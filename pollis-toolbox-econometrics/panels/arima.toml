# ARIMA Models Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/arima.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "ARIMAX and SARIMA Models"
viewType = "pollis.arima"
defaultModel = "arima"

