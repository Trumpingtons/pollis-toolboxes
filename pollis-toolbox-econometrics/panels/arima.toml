[[models]]
id = "arima"
label = "ARIMA"

[[models]]
id = "sarima"
label = "Seasonal ARIMA"

[[models]]
id = "arimax"
label = "ARIMAX"

[[bullets]]
text = "ARIMA"
detail = "integrated autoregressive moving-average model for univariate time series"

[[bullets]]
text = "Seasonal ARIMA"
detail = "extends ARIMA with a multiplicative seasonal structure"

[[bullets]]
text = "ARIMAX"
detail = "regression on exogenous variables with ARIMA errors"

[[decisionRows]]
task = "ARIMA"
context = "A single non-seasonal series whose trend or level drift is removed by differencing"
purpose = "Models the differenced series as autoregressive (p) plus moving-average (q) terms; short-horizon forecasts with prediction intervals"

[[decisionRows]]
task = "Seasonal ARIMA"
context = "Monthly, quarterly or other periodic data with a repeating pattern of period s"
purpose = "Adds multiplicative seasonal AR (P), differencing (D) and MA (Q) terms at lag s, so the same shock recurs one season later"

[[decisionRows]]
task = "ARIMAX"
context = "A series that also responds to other variables, whose future values you know or can assume"
purpose = "Regresses the series on those variables with ARIMA errors: the effect of each variable, and forecasts given its future values"

[[inputs]]
id = "yvar"
label = "Data variable"
tooltip = "Your univariate time series (Vector of Float64), oldest observation first."
default = "y"

[[inputs]]
id = "p"
label = "p (AR)"
tooltip = "Non-seasonal autoregressive order: lags of the differenced series. Read from the PACF cut-off. Typical: 0 to 3."
default = "1"
newRow = true

[[inputs]]
id = "d"
label = "d (diff)"
tooltip = "Non-seasonal differencing order: 1 removes a stochastic trend, 2 is rarely needed. Check with the ADF test."
default = "1"

[[inputs]]
id = "q"
label = "q (MA)"
tooltip = "Non-seasonal moving-average order: lagged forecast errors. Read from the ACF cut-off. Typical: 0 to 3."
default = "0"

[[inputs]]
id = "sp"
label = "P (seas. AR)"
tooltip = "Seasonal autoregressive order, at multiples of the period s. Typical: 0 or 1."
default = "1"
models = ["sarima"]
newRow = true

[[inputs]]
id = "sd"
label = "D (seas. diff)"
tooltip = "Seasonal differencing order: 1 removes a stable seasonal pattern. Rarely more than 1."
default = "1"
models = ["sarima"]

[[inputs]]
id = "sq"
label = "Q (seas. MA)"
tooltip = "Seasonal moving-average order, at multiples of the period s. Typical: 0 or 1."
default = "1"
models = ["sarima"]

[[inputs]]
id = "s"
label = "s (period)"
tooltip = "Seasonal period in observations: 12 for monthly, 4 for quarterly, 7 for daily data with a weekly cycle."
default = "12"
models = ["sarima"]

[[inputs]]
id = "xvar"
label = "Regressors"
tooltip = "The exogenous variables over the sample: a Vector, or a Matrix with one column per variable and one row per observation. With x, the example simulates y, x and xf."
default = "x"
models = ["arimax"]
newRow = true

[[inputs]]
id = "xfuture"
label = "Future regressors"
tooltip = "The values of the same variables over the forecast: a Vector or Matrix with one row per step. Forecasts run for as many steps as it has rows."
default = "xf"
models = ["arimax"]

[[inputs]]
id = "h"
label = "Horizon"
tooltip = "Forecast horizon in observations, used by the Predict actions."
default = "24"
newRow = true

[[codeBranches]]
model = "arima"
code = '''
using StateSpaceModels

{{?yvar=y}} using Random
{{?yvar=y}} Random.seed!(1)  # simulated: an ARIMA(1,1,0) whose differences are AR(1) with phi = 0.6, so ar_L1 should come out near 0.6. Replace y with your own series.
{{?yvar=y}} shock = zeros(300); for i in 2:300; shock[i] = 0.6shock[i-1] + randn(); end; y = 10 .+ cumsum(shock)
y = Float64.({{yvar}})
seas = (0, 0, 0, 0)  # no seasonal part
arima_model(p, d, q) = SARIMA(y; order=(p, d, q))
model = arima_model({{p}}, {{d}}, {{q}})  # ARIMA({{p}},{{d}},{{q}})
StateSpaceModels.fit!(model)  # maximum-likelihood estimation via the Kalman filter

print_results(model)  # estimates, standard errors, log-likelihood, AIC/BIC
'''

[[codeBranches]]
model = "sarima"
code = '''
using StateSpaceModels

{{?yvar=y}} using Durbyn: air_passengers
{{?yvar=y}} y = log.(air_passengers())  # monthly airline passengers, 1949-1960 (Box and Jenkins), in logs: the seasonal swings grow with the level, and in logs they keep one size. Replace y with your own series.
y = Float64.({{yvar}})
seas = ({{sp}}, {{sd}}, {{sq}}, {{s}})  # seasonal (P, D, Q, s)
arima_model(p, d, q) = SARIMA(y; order=(p, d, q), seasonal_order=seas)
model = arima_model({{p}}, {{d}}, {{q}})  # SARIMA({{p}},{{d}},{{q}})({{sp}},{{sd}},{{sq}})_{{s}}
StateSpaceModels.fit!(model)  # maximum-likelihood estimation via the Kalman filter

print_results(model)  # estimates, standard errors, log-likelihood, AIC/BIC
'''

[[codeBranches]]
model = "arimax"
code = '''
import Durbyn
using Durbyn: NamedMatrix
using Durbyn.Arima: PDQ

{{?xvar=x}} using Random
{{?xvar=x}} Random.seed!(1)  # simulated: y moves by 2 with each unit of x, with AR(1) shocks in its differences
{{?xvar=x}} n = 200; path = cumsum(randn(n + {{h}})) ./ 5 .+ randn(n + {{h}})
{{?xvar=x}} shock = zeros(n); for i in 2:n; shock[i] = 0.6shock[i-1] + randn(); end
{{?xvar=x}} x, xf = path[1:n], path[n+1:end]; y = 10 .+ 2 .* x .+ cumsum(shock)
y = Float64.({{yvar}})
columns(v) = reshape(Float64.(v), size(v, 1), :)  # one column per regressor
regressors = ["x$j" for j in axes(columns({{xvar}}), 2)]
X, F = NamedMatrix(columns({{xvar}}), regressors), NamedMatrix(columns({{xfuture}}), regressors)
order = PDQ({{p}}, {{d}}, {{q}})
model = Durbyn.Arima.arima(y, 1; order=order, xreg=X)  # regression on X with ARIMA({{p}},{{d}},{{q}}) errors
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "fitted"
label = "Series and One-Step Fit"
models = ["arima", "sarima"]
desc = "The data against the one-step-ahead predictions of the fitted model: where the model tracks the series and where it lags behind turning points"
code = '''
using StateSpaceModels, Plots
kf = kalman_filter(model)
yhat = y .- vec(get_innovations(kf))  # one-step-ahead prediction = data - innovation
skip = {{d}} + seas[2] * seas[4]  # observations lost to differencing
Plots.plot(y, lw=1.5, label="data", xlabel="t", title="One-step-ahead fit")
Plots.plot!(skip+1:length(y), yhat[skip+1:end], lw=1.5, ls=:dash, label="one-step prediction")
'''

[[actionGroups.actions]]
id = "differenced"
label = "Differenced Series"
models = ["arima", "sarima"]
desc = "The series after the differencing the model applies: it should look stationary, with a constant mean and variance and no remaining trend"
code = '''
using Plots
z = reduce((z, _) -> diff(z), 1:{{d}}; init=y)  # regular differences
z = reduce((z, _) -> z[seas[4]+1:end] .- z[1:end-seas[4]], 1:seas[2]; init=z)  # seasonal differences
Plots.plot(z, lw=1, legend=false, xlabel="t", title="Differenced series")
hline!([0], c=:gray, ls=:dash)
'''

[[actionGroups.actions]]
id = "x-fitted"
label = "Series and One-Step Fit"
models = ["arimax"]
desc = "The data against the one-step predictions of the fitted model, regressors included: where the model tracks the series and where it lags behind turning points"
code = '''
using Plots
Plots.plot(y, lw=1.5, label="data", xlabel="t", title="One-step fit")
Plots.plot!(model.fitted, lw=1.5, ls=:dash, label="one-step prediction")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "acf"
label = "Residual ACF and PACF"
models = ["arima", "sarima"]
desc = "Autocorrelation and partial autocorrelation of the standardised residuals with 95% bands: bars outside the bands mean structure the model has missed"
code = '''
using StateSpaceModels, StatsBase, Plots
r = filter(isfinite, vec(StateSpaceModels.get_standard_residuals(kalman_filter(model))))
L = min(24, length(r) ÷ 4); band = 1.96 / sqrt(length(r))
p1 = bar(1:L, autocor(r, 1:L), legend=false, title="Residual ACF", xlabel="Lag")
hline!(p1, [-band, band], c=:red, ls=:dash)
p2 = bar(1:L, StatsBase.pacf(r, 1:L), legend=false, title="Residual PACF", xlabel="Lag")
hline!(p2, [-band, band], c=:red, ls=:dash)
Plots.plot(p1, p2, layout=(2, 1))
'''

[[actionGroups.actions]]
id = "ljung-box"
label = "Ljung-Box and Normality"
models = ["arima", "sarima"]
desc = "Ljung-Box test for leftover autocorrelation (degrees of freedom net of the ARMA parameters) and Jarque-Bera test for normal residuals"
code = '''
using StateSpaceModels, HypothesisTests
r = filter(isfinite, vec(StateSpaceModels.get_standard_residuals(kalman_filter(model))))
L = min(24, length(r) ÷ 4)
npar = {{p}} + {{q}} + seas[1] + seas[3]  # estimated ARMA terms
lb = LjungBoxTest(r, L, npar); jb = JarqueBeraTest(r)
(ljung_box_lags = L, ljung_box_p = pvalue(lb), jarque_bera_p = pvalue(jb), verdict = pvalue(lb) > 0.05 ? "no leftover autocorrelation" : "residuals still autocorrelated: revise p or q")
'''

[[actionGroups.actions]]
id = "adf"
label = "ADF Unit Root Test"
desc = "Augmented Dickey-Fuller test on the levels and on the first difference: a unit root in the levels but not in the difference supports d = 1"
code = '''
using HypothesisTests
lag = floor(Int, length(y)^(1/3))
t0 = ADFTest(y, :constant, lag); t1 = ADFTest(diff(y), :constant, lag)
(levels_p = pvalue(t0), first_difference_p = pvalue(t1), suggested_d = pvalue(t0) < 0.05 ? 0 : pvalue(t1) < 0.05 ? 1 : 2)
'''

[[actionGroups.actions]]
id = "x-acf"
label = "Residual ACF and PACF"
models = ["arimax"]
desc = "Autocorrelation and partial autocorrelation of the residuals with 95% bands: bars outside the bands mean structure that neither the regressors nor the ARIMA errors have explained"
code = '''
using StatsBase, Plots
r = filter(isfinite, model.residuals)
L = min(24, length(r) ÷ 4); band = 1.96 / sqrt(length(r))
p1 = bar(1:L, autocor(r, 1:L), legend=false, title="Residual ACF", xlabel="Lag")
hline!(p1, [-band, band], c=:red, ls=:dash)
p2 = bar(1:L, StatsBase.pacf(r, 1:L), legend=false, title="Residual PACF", xlabel="Lag")
hline!(p2, [-band, band], c=:red, ls=:dash)
Plots.plot(p1, p2, layout=(2, 1))
'''

[[actionGroups.actions]]
id = "x-ljung-box"
label = "Ljung-Box and Normality"
models = ["arimax"]
desc = "Ljung-Box test for leftover autocorrelation (degrees of freedom net of the ARMA parameters) and Jarque-Bera test for normal residuals"
code = '''
using HypothesisTests
r = filter(isfinite, model.residuals)
L = min(24, length(r) ÷ 4)
lb = LjungBoxTest(r, L, {{p}} + {{q}}); jb = JarqueBeraTest(r)
(ljung_box_lags = L, ljung_box_p = pvalue(lb), jarque_bera_p = pvalue(jb), verdict = pvalue(lb) > 0.05 ? "no leftover autocorrelation" : "residuals still autocorrelated: revise p or q")
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "forecast"
label = "Forecast with Intervals"
models = ["arima", "sarima"]
desc = "Point forecasts over the horizon with 80% and 95% prediction intervals"
code = '''
using StateSpaceModels, Plots
fc = StateSpaceModels.forecast(model, {{h}})
Plots.plot(model, fc; label="data", title="Forecast, {{h}} steps")
'''

[[actionGroups.actions]]
id = "scenarios"
label = "Simulated Scenarios"
models = ["arima", "sarima"]
desc = "500 simulated future paths from the fitted model and their quantile fan: the full distribution of outcomes, not only the mean and variance"
code = '''
using StateSpaceModels, Statistics, Plots
S = simulate_scenarios(model, {{h}}, 500)[:, 1, :]  # horizon x scenarios
t = length(y) .+ (1:{{h}})
q(a) = [quantile(S[i, :], a) for i in axes(S, 1)]
p = Plots.plot(max(1, length(y) - 4 * {{h}}):length(y), y[max(1, end - 4 * {{h}}):end], lw=1.5, c=:black, label="data", title="Simulated scenarios")
Plots.plot!(t, S[:, 1:20], c=:gray, alpha=0.3, label=false)
Plots.plot!(t, q(0.5), ribbon=(q(0.5) .- q(0.05), q(0.95) .- q(0.5)), fillalpha=0.2, lw=2, label="median, 90% band")
'''

[[actionGroups.actions]]
id = "backtest"
label = "Rolling Backtest"
models = ["arima", "sarima"]
desc = "Refits the model on expanding windows and scores its forecasts on the data that followed: out-of-sample error by horizon"
code = '''
using StateSpaceModels, Statistics, Plots
H = min({{h}}, 12); origins = round.(Int, range(0.7 * length(y), length(y) - H, length=6))
err = zeros(length(origins), H)
for (k, n) in enumerate(origins)
    m = SARIMA(y[1:n]; order=({{p}}, {{d}}, {{q}}), seasonal_order=seas); StateSpaceModels.fit!(m)
    err[k, :] = y[n+1:n+H] .- vcat(StateSpaceModels.forecast(m, H).expected_value...)
end
display((rmse_by_horizon = round.(vec(sqrt.(mean(err .^ 2, dims=1))), digits=3),))
Plots.plot(1:H, vec(sqrt.(mean(err .^ 2, dims=1))), marker=:o, lw=2, legend=false, xlabel="Horizon", ylabel="RMSE", title="Out-of-sample error by horizon")
'''

[[actionGroups.actions]]
id = "x-forecast"
label = "Forecast with Intervals"
models = ["arimax"]
desc = "Point forecasts with 80% and 95% prediction intervals, given the future regressors: the intervals leave out any uncertainty about those values"
code = '''
using Plots
fc = Durbyn.forecast(model; h=size(F.data, 1), xreg=F)
t = length(y) .+ (1:size(F.data, 1))
Plots.plot(y, lw=1.5, c=:black, label="data", xlabel="t", title="Forecast given the future regressors")
Plots.plot!(t, fc.mean, ribbon=(fc.mean .- fc.lower[:, 2], fc.upper[:, 2] .- fc.mean), fillalpha=0.2, lw=2, label="forecast, 95% interval")
'''

[[actionGroups.actions]]
id = "x-backtest"
label = "Rolling Backtest"
models = ["arimax"]
desc = "Refits on expanding windows and scores the forecasts on the data that followed, by horizon. It uses the regressors that actually occurred, so it is better than a real forecast would be when they have to be predicted too"
code = '''
using Statistics, Plots
H = min({{h}}, 12); origins = round.(Int, range(0.7 * length(y), length(y) - H, length=6))
err = zeros(length(origins), H)
for (k, n) in enumerate(origins)
    m = Durbyn.Arima.arima(y[1:n], 1; order=order, xreg=NamedMatrix(X.data[1:n, :], regressors))
    err[k, :] = y[n+1:n+H] .- Durbyn.forecast(m; h=H, xreg=NamedMatrix(X.data[n+1:n+H, :], regressors)).mean
end
display((rmse_by_horizon = round.(vec(sqrt.(mean(err .^ 2, dims=1))), digits=3),))
Plots.plot(1:H, vec(sqrt.(mean(err .^ 2, dims=1))), marker=:o, lw=2, legend=false, xlabel="Horizon", ylabel="RMSE", title="Out-of-sample error by horizon")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "auto-arima"
label = "Automatic Order Selection"
models = ["arima", "sarima"]
desc = "auto_arima searches over orders (Hyndman-Khandakar stepwise search, AICc) and reports the order it picks next to this model; a seasonal search can take a few minutes"
code = '''
using StateSpaceModels
best = StateSpaceModels.auto_arima(y; seasonal=seas[4])  # seasonal = 0: non-seasonal search
spec(m) = (order = (m.order.p, m.order.d, m.order.q), seasonal = (m.order.P, m.order.D, m.order.Q, m.order.s), aicc = m.results.aicc)
(this_model = spec(model), auto_arima = spec(best))
'''

[[actionGroups.actions]]
id = "order-grid"
label = "Order Grid (AICc)"
models = ["arima", "sarima"]
desc = "AICc of every (p, q) with p, q in 0..3 at the current differencing: a heat map of how sensitive the fit is to the chosen order (16 fits: about a minute for seasonal models)"
code = '''
using StateSpaceModels, Plots
ic = fill(NaN, 4, 4)
for p in 0:3, q in 0:3
    try
        m = arima_model(p, {{d}}, q); StateSpaceModels.fit!(m); ic[p+1, q+1] = m.results.aicc
    catch
    end
end
display((best_p_q = Tuple(argmin(replace(ic, NaN => Inf))) .- 1, current = ({{p}}, {{q}})))
heatmap(0:3, 0:3, ic, xlabel="q", ylabel="p", title="AICc by order (d = {{d}})", c=:viridis)
'''

[[actionGroups.actions]]
id = "x-without"
label = "With and Without the Regressors"
models = ["arimax"]
desc = "The same ARIMA with and without the regressors: a lower AIC with them means they add more than their parameters cost"
code = '''
without = Durbyn.Arima.arima(y, 1; order=order)
(aic_with = round(model.aic, digits=2), aic_without = round(without.aic, digits=2), sigma2_with = round(model.sigma2, digits=4), sigma2_without = round(without.sigma2, digits=4), verdict = model.aic < without.aic ? "the regressors improve the fit" : "the regressors do not pay for their parameters")
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "coefficients"
label = "Coefficient Table"
models = ["arima", "sarima"]
desc = "Estimates with standard errors, z statistics and p-values: which AR and MA terms are distinguishable from zero"
code = '''
using StateSpaceModels, Distributions
ct = model.results.coef_table
[(parameter = n, estimate = round(c, digits=4), std_error = round(s, digits=4), z = round(z, digits=2), p_value = round(2ccdf(Normal(), abs(z)), digits=4))  # two-sided, from z
 for (n, c, s, z) in zip(ct.names, ct.coef, ct.std_err, ct.z)]
'''

[[actionGroups.actions]]
id = "impulse"
label = "Impulse Response (Psi Weights)"
models = ["arima", "sarima"]
desc = "Effect of a one-off unit shock on the differenced series over the next 24 steps, from the fitted AR and MA polynomials; on the level it accumulates d times"
code = '''
using StateSpaceModels, Plots
ct = model.results.coef_table
coefs_of(prefix) = [ct.coef[i] for i in eachindex(ct.names) if startswith(ct.names[i], prefix)]
phi, theta = coefs_of("ar_L"), coefs_of("ma_L")
psi = zeros(25); psi[1] = 1.0
for j in 1:24
    psi[j+1] = (j <= length(theta) ? theta[j] : 0.0) + sum((phi[i] * psi[j+1-i] for i in eachindex(phi) if i <= j); init=0.0)
end
level = reduce((l, _) -> cumsum(l), 1:{{d}}; init=psi)  # accumulate over the d differences
Plots.plot(0:24, [psi level], marker=:o, label=["differenced series" "level"], xlabel="Steps after shock", title="Impulse response (non-seasonal part)")
'''

[[actionGroups.actions]]
id = "x-coefficients"
label = "Coefficient Table"
models = ["arimax"]
desc = "Estimates with standard errors, z statistics and p-values. A regressor's coefficient is its effect on the series; the AR and MA terms describe the errors around that regression"
code = '''
using Distributions, LinearAlgebra
se = sqrt.(diag(model.var_coef))
[(parameter = n, estimate = round(c, digits=4), std_error = round(s, digits=4), z = round(c / s, digits=2), p_value = round(2ccdf(Normal(), abs(c / s)), digits=4))
 for (n, c, s) in zip(model.coef.colnames, vec(model.coef.data), se)]
'''
