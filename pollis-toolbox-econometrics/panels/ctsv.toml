[[models]]
id = "heston"
label = "Heston"

[[models]]
id = "bates"
label = "Bates"

[[models]]
id = "sabr"
label = "SABR"

[[bullets]]
text = "Heston"
detail = "stochastic variance with mean-reverting CIR dynamics"

[[bullets]]
text = "Bates"
detail = "Heston extended with compound Poisson–log-normal jump diffusion"

[[bullets]]
text = "SABR"
detail = "CEV-type forward with log-normal volatility, priced with the Hagan et al. (2002) implied-volatility formula"

[[inputs]]
id = "kappa"
label = "kappa (kappa)"
tooltip = "Mean-reversion speed of variance — controls how quickly v_t reverts to theta. Higher kappa means faster reversion. Default 2."
default = "2"
models = ["heston", "bates"]

[[inputs]]
id = "theta"
label = "theta (theta)"
tooltip = "Long-run mean of variance. As t → ∞, E[v_t] → theta. Set theta = sigmā² for the target long-run volatility sigmā. Default 0.04 (≈ 20% vol)."
default = "0.04"
models = ["heston", "bates"]

[[inputs]]
id = "xi"
label = "xi (xi)"
tooltip = "Vol-of-vol — volatility of the variance process. Higher xi increases the curvature of the implied volatility smile. Default 0.3."
default = "0.3"
models = ["heston", "bates"]

[[inputs]]
id = "rho"
label = "rho (rho)"
tooltip = "Correlation between the asset and variance Brownian motions. Negative rho captures the leverage effect (volatility rises when price falls). Default −0.7."
default = "-0.7"
models = ["heston", "bates"]

[[inputs]]
id = "S0"
label = "S₀ (price)"
tooltip = "Initial asset price. Default 100."
default = "100"
models = ["heston", "bates"]

[[inputs]]
id = "v0"
label = "v₀ (variance)"
tooltip = "Initial variance (not volatility). Initial instantaneous volatility is sigma₀ = √v₀. Default 0.04 (≈ 20% vol)."
default = "0.04"
models = ["heston", "bates"]

[[inputs]]
id = "T"
label = "T (horizon)"
tooltip = "Simulation horizon in years. Default 1."
default = "1"
models = ["heston", "bates"]

[[inputs]]
id = "mu"
label = "mu (drift)"
tooltip = "Risk-neutral drift of the asset price. Set to the risk-free rate minus the continuous dividend yield for pricing. Default 0.05."
default = "0.05"
models = ["heston", "bates"]

[[inputs]]
id = "lambda"
label = "lambda (intensity)"
tooltip = "Jump intensity — expected number of jumps per year (Poisson arrival rate lambda). Default 0.5."
default = "0.5"
models = ["bates"]

[[inputs]]
id = "muJ"
label = "muJ (mean jump)"
tooltip = "Mean log-jump size. The expected relative jump size is mū_J = exp(mu_J + delta²_J / 2) − 1. Default −0.1."
default = "-0.1"
models = ["bates"]

[[inputs]]
id = "sigmaJ"
label = "deltaJ (jump vol)"
tooltip = "Standard deviation of log-jump size. Controls the dispersion of individual jump magnitudes. Default 0.2."
default = "0.2"
models = ["bates"]

[[inputs]]
id = "alpha"
label = "alpha (alpha)"
tooltip = "Initial stochastic volatility in the SABR model. Default 2 (about 20% at F₀ = 100 and beta 0.5)."
default = "2"
models = ["sabr"]

[[inputs]]
id = "beta"
label = "beta (beta)"
tooltip = "CEV exponent — controls the relationship between forward price and local volatility. beta = 0: normal model, beta = 1: log-normal. Default 0.5."
default = "0.5"
models = ["sabr"]

[[inputs]]
id = "rho-sabr"
label = "rho (rho)"
tooltip = "Correlation between the forward and its volatility. Negative rho tilts the smile downwards (low strikes have higher implied volatility). Default −0.3."
default = "-0.3"
models = ["sabr"]

[[inputs]]
id = "F0"
label = "F₀ (forward)"
tooltip = "Initial forward price. Default 100."
default = "100"
models = ["sabr"]

[[inputs]]
id = "T-sabr"
label = "T (expiry)"
tooltip = "Option expiry in years. Default 1."
default = "1"
models = ["sabr"]

[[inputs]]
id = "nu"
label = "nu (vol of vol)"
tooltip = "Volatility of the volatility process. Higher nu increases the curvature of the smile. Default 0.4."
default = "0.4"
models = ["sabr"]

[[codeBranches]]
model = "heston"
code = '''
using StochasticVolatility

S0, v0, T = {{S0}}, {{v0}}, {{T}}  # initial price, initial variance, horizon
model = Heston(; S0, v0, mu={{mu}}, kappa={{kappa}}, theta={{theta}}, xi={{xi}}, rho={{rho}})
path = simulate(model, T; paths=1)  # one path of 252 steps, by the quadratic-exponential scheme
t, S, v = path.time, vec(path.price), vec(path.state)  # times, prices, variances
'''

[[codeBranches]]
model = "bates"
code = '''
using StochasticVolatility

S0, v0, T = {{S0}}, {{v0}}, {{T}}  # initial price, initial variance, horizon
model = Bates(; S0, v0, mu={{mu}}, kappa={{kappa}}, theta={{theta}}, xi={{xi}}, rho={{rho}}, lambda={{lambda}}, muJ={{muJ}}, deltaJ={{sigmaJ}})
path = simulate(model, T; paths=1)  # one path of 252 steps, by the quadratic-exponential scheme with compensated jumps
t, S, v = path.time, vec(path.price), vec(path.state)  # times, prices, variances
'''

[[codeBranches]]
model = "sabr"
code = '''
using StochasticVolatility

F0, T = {{F0}}, {{T-sabr}}  # initial forward, expiry
S0 = F0  # the forward plays the role of the price
model = SABR(; F0, alpha={{alpha}}, beta={{beta}}, rho={{rho-sabr}}, nu={{nu}})
path = simulate(model, T; paths=1)  # one path of 252 steps, by Euler with the forward absorbed at 0
t, S, sig = path.time, vec(path.price), vec(path.state)  # times, forwards, volatilities
v = (sig .* S .^ ({{beta}} - 1)) .^ 2  # instantaneous variance of log F
println("ATM implied volatility: ", hagan_implied_vol(model, F0, T))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "paths"
label = "Price and Volatility Paths"
desc = "The simulated price path above its instantaneous volatility: look for volatility spikes as prices fall"
code = '''
using Plots
p1 = plot(t, S, xlabel="t (years)", ylabel="price", legend=false, title="Simulated price path")
p2 = plot(t, sqrt.(max.(v, 0)), xlabel="t (years)", ylabel="volatility", legend=false, title="Instantaneous volatility")
plot(p1, p2, layout=(2, 1), size=(800, 550))
'''

[[actionGroups.actions]]
id = "smile"
label = "Implied Volatility Smile"
desc = "Black implied volatility across strikes: closed-form prices inverted for Heston and Bates, the Hagan formula for SABR"
code = '''
using Distributions, Plots
{{?model=heston|bates}} F = S0 * exp({{mu}} * T)  # forward price
{{?model=sabr}} F = S0
black(sig, K) = (d1 = (log(F / K) + sig^2 * T / 2) / (sig * sqrt(T)); F * cdf(Normal(), d1) - K * cdf(Normal(), d1 - sig * sqrt(T)))
function implied(c, K)  # bisection on the undiscounted Black price
    lo, hi = 1e-4, 3.0
    for _ in 1:60
        mid = (lo + hi) / 2
        black(mid, K) < c ? (lo = mid) : (hi = mid)
    end
    (lo + hi) / 2
end
strikes = F .* (0.7:0.05:1.3)
{{?model=heston|bates}} ivs = [implied(european_price(model, K, T; rate=0), K) for K in strikes]  # rate 0: the undiscounted price
{{?model=sabr}} ivs = [hagan_implied_vol(model, K, T) for K in strikes]
plot(strikes ./ F, ivs, marker=:circle, xlabel="moneyness K / F", ylabel="implied volatility", legend=false, title="Implied volatility smile")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "positivity"
label = "Positivity Check"
desc = "Heston and Bates: the Feller condition 2 kappa theta > xi^2 keeps the variance away from zero; SABR: whether the forward was absorbed at zero"
code = '''
{{?model=heston|bates}} (two_kappa_theta = 2 * {{kappa}} * {{theta}}, xi_squared = {{xi}}^2, feller_holds = 2 * {{kappa}} * {{theta}} > {{xi}}^2, steps_at_zero_variance = count(<=(0), v))
{{?model=sabr}} (min_forward = minimum(S), absorbed_at_zero = any(==(0), S))
'''

[[actionGroups.actions]]
id = "martingale"
label = "Monte Carlo Mean Check"
desc = "The mean simulated terminal price against its theoretical value: a z-score beyond 2 points to discretisation bias"
code = '''
using Statistics
ST = simulate_terminal(model, T; paths=2000)
{{?model=heston|bates}} expected = S0 * exp({{mu}} * T)
{{?model=sabr}} expected = S0  # the forward is a martingale
se = std(ST) / sqrt(length(ST))
(simulated_mean = mean(ST), expected = expected, std_error = se, z = (mean(ST) - expected) / se)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "risk"
label = "Terminal Price Risk"
desc = "Quantiles of the price at the horizon with the 95% value at risk and expected shortfall of the return"
code = '''
using Statistics
ST = simulate_terminal(model, T; paths=5000)
ret = ST ./ S0 .- 1
q05 = quantile(ret, 0.05)
(p05 = quantile(ST, 0.05), median = median(ST), p95 = quantile(ST, 0.95), VaR95 = -q05, ES95 = -mean(ret[ret .<= q05]))
'''

[[actionGroups.actions]]
id = "options"
label = "Option Prices by Strike"
desc = "European calls and puts at five strikes around the current price: the closed form, the Hagan approximation for SABR, beside Monte Carlo with its standard error"
code = '''
strikes = S0 .* (0.8:0.1:1.2)
{{?model=heston|bates}} rate = {{mu}}
{{?model=sabr}} rate = 0.0  # prices in forward terms
{{?model=heston|bates}} closed(K, call) = european_price(model, K, T; rate, call)
{{?model=sabr}} closed(K, call) = hagan_price(model, K, T; rate, call)
calls = monte_carlo_price(model, strikes, T; rate, paths=5000)
puts = monte_carlo_price(model, strikes, T; rate, call=false, paths=5000)
[(strike = K, call = closed(K, true), call_mc = c.price, call_se = c.standard_error, put = closed(K, false), put_mc = p.price, put_se = p.standard_error) for (K, c, p) in zip(strikes, calls, puts)]
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "vs-black-scholes"
label = "Against Black-Scholes"
desc = "Quantiles of the terminal price against a geometric Brownian motion with the same initial volatility: stochastic volatility fattens the tails"
code = '''
using Statistics
ST = simulate_terminal(model, T; paths=5000)
{{?model=heston|bates}} sig0 = sqrt({{v0}})
{{?model=sabr}} sig0 = {{alpha}} * S0^({{beta}} - 1)
{{?model=heston|bates}} m = {{mu}}
{{?model=sabr}} m = 0.0
GBM = S0 .* exp.((m - sig0^2 / 2) * T .+ sig0 * sqrt(T) .* randn(length(ST)))
[(p = p, model = quantile(ST, p), black_scholes = quantile(GBM, p)) for p in [0.01, 0.05, 0.5, 0.95, 0.99]]
'''

[[actionGroups.actions]]
id = "vs-normal"
label = "Log Returns Against the Normal"
desc = "Histogram of terminal log returns with the normal density of the same mean and variance, plus skewness and excess kurtosis"
code = '''
using Statistics, StatsBase, Distributions, Plots
lr = log.(max.(simulate_terminal(model, T; paths=5000), eps()) ./ S0)
println((skewness = skewness(lr), excess_kurtosis = kurtosis(lr)))
histogram(lr, bins=80, normalize=:pdf, label="simulated", xlabel="log return to T")
plot!(x -> pdf(Normal(mean(lr), std(lr)), x), extrema(lr)..., lw=2, label="normal")
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "parameters"
label = "Parameters in Plain Terms"
desc = "Long-run volatility, variance half-life and leverage (Heston, Bates), jump size and frequency (Bates), ATM volatility and backbone (SABR)"
code = '''
{{?model=heston|bates}} display((long_run_vol = sqrt({{theta}}), initial_vol = sqrt({{v0}}), variance_half_life_years = log(2) / {{kappa}}, leverage = {{rho}} < 0 ? "negative: volatility rises when prices fall" : "none or positive"))
{{?model=bates}} display((jumps_per_year = {{lambda}}, mean_jump_pct = 100 * (exp({{muJ}} + {{sigmaJ}}^2 / 2) - 1), jump_share_of_variance = {{lambda}} * ({{muJ}}^2 + {{sigmaJ}}^2) / ({{theta}} + {{lambda}} * ({{muJ}}^2 + {{sigmaJ}}^2))))
{{?model=sabr}} (atm_vol = hagan_implied_vol(model, S0, T), backbone = {{beta}} == 1 ? "log-normal" : {{beta}} == 0 ? "normal" : "CEV", smile_skew = {{rho-sabr}} < 0 ? "downward: low strikes are dearer" : "flat or upward", smile_curvature_from_nu = {{nu}})
'''

[[actionGroups.actions]]
id = "realised"
label = "Realised Against Integrated Volatility"
desc = "The volatility measured from the simulated price path next to the average of the instantaneous volatility that drove it"
code = '''
rv = sqrt(sum(abs2, diff(log.(max.(S, eps())))) / T)  # realised volatility (includes jumps)
iv = sqrt(sum(max.(v[1:end-1], 0) .* diff(t)) / T)  # integrated volatility
(realised_vol = rv, integrated_vol = iv, gap = rv - iv)
'''
