name = "StochasticVolatility.jl"
github = "https://github.com/Trumpingtons/StochasticVolatility.jl"

[[packages]]
name = "Distributions.jl"
github = "https://github.com/JuliaStats/Distributions.jl"

[requires]
packages = ["StochasticVolatility.jl", "Distributions.jl", "Plots.jl", "StatsBase.jl"]

