# High-Frequency Volatility Webview Configuration
# The declarative source of the panel, read by Pollis when the Finance Toolbox is installed.

[meta]
title = "High-Frequency Volatility"
viewType = "pollis.hfvol"
defaultModel = "rv"

[[packages]]
name = "HighFrequencyCovariance.jl"
github = "https://github.com/s-baumann/HighFrequencyCovariance.jl"

[requires]
packages = ["HighFrequencyCovariance.jl", "Plots.jl", "SpecialFunctions.jl", "Tables.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Realized Volatility and the Sampling Interval"
file = "hf-vol/tutorial-01-realized.ipynb"
bundled = true
description = "Realized volatility of one day of ticks at several sampling intervals, and why the finest is not the best"

[[notebookSections.notebooks]]
name = "Two-Scales Volatility and the Noise"
file = "hf-vol/tutorial-02-two-scales.ipynb"
bundled = true
description = "The two-scales estimator on every tick, its sub-grids and its estimate of the noise"

[[notebookSections.notebooks]]
name = "Bipower Variation and Jumps"
file = "hf-vol/tutorial-03-bipower.ipynb"
bundled = true
description = "Bipower variation against realized variance, and the Barndorff-Nielsen and Shephard jump test"

