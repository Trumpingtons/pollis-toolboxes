[[codeBranches]]
model = "bpv"
code = '''
using HighFrequencyCovariance, Dates

{{?data=simulated}} using Random
{{?data=simulated}} rng = Xoshiro(7); n = 23400  # one trading day of 6.5 hours, a tick every second
{{?data=simulated}} efficient = log(100) .+ cumsum(0.01 / sqrt(n) .* randn(rng, n))  # efficient log price, true volatility 1% over the day
{{?data=simulated}} efficient[14000:end] .-= 0.01  # a 1% drop after 14,000 seconds: a jump
{{?data=simulated}} ticks = (time = collect(1.0:n), asset = fill(:SPX, n), logprice = efficient .+ 0.0002 .* randn(rng, n))  # observed with 2 basis points of noise. Replace ticks with your own.
{{?data!=simulated}} using Tables
{{?data!=simulated}} ticks = Tables.columntable({{data}})  # one row per tick: time (seconds), asset (Symbol) and logprice
ts = SortedDataFrame(HighFrequencyCovariance.DataFrame(ticks), :time, :asset, :logprice, Second(1))  # the package's tick table, sorted by time
asset = first(get_assets(ts))
span = duration(ts; in_dates_period = false)  # seconds from the first tick to the last

"""The log returns of `asset` every `every` seconds: the last price at or before each time of the grid."""
function grid_returns(ticks, asset, every)
    mine = ticks.asset .== asset
    order = sortperm(ticks.time[mine])
    t, p = ticks.time[mine][order], ticks.logprice[mine][order]
    return diff([p[searchsortedlast(t, g)] for g in range(first(t), last(t); step = every)])
end

r = grid_returns(ticks, asset, {{every}})  # log returns every {{every}} seconds
BPV = (pi / 2) * sum(abs.(r[2:end]) .* abs.(r[1:end-1]))  # bipower variation; pi/2 makes it estimate the variance of the continuous moves
sigma = sqrt(BPV)  # volatility over the span, apart from jumps

println("Bipower volatility over the span: ", round(100 * sigma, digits = 3), "%")
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "path"
label = "Price Path"
desc = "The asset's price at every tick through the span"
code = '''
using Plots
mine = ticks.asset .== asset
Plots.plot(ticks.time[mine] ./ 3600, exp.(ticks.logprice[mine]); xlabel = "Hours since the first tick", ylabel = "Price", legend = false)
'''

[[actionGroups.actions]]
id = "signature"
label = "Volatility Signature Plot"
desc = "Realized volatility at sampling intervals from one second to half an hour: noise makes it rise as the interval shrinks"
code = '''
using Plots
intervals = [1, 2, 5, 10, 30, 60, 120, 300, 600, 900, 1800]  # seconds
realized = [sqrt(sum(abs2, grid_returns(ticks, asset, s))) for s in intervals]
Plots.plot(intervals, 100 .* realized; xscale = :log10, marker = :circle, xlabel = "Sampling interval (seconds)", ylabel = "Realized volatility (%)", label = "Realized volatility")
hline!([100 * sigma]; linestyle = :dash, label = "This tab's estimate")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "bns"
label = "Barndorff-Nielsen and Shephard Test"
desc = "Jump test on returns every five minutes: the standardised gap between realized variance and bipower variation, one-sided, as jumps raise only realized variance"
code = '''
using SpecialFunctions  # gamma, erfc

{{?model=rv|tsv}} r = grid_returns(ticks, asset, 300)  # log returns every five minutes
{{?model=bpv}} r = grid_returns(ticks, asset, {{every}})  # the returns of the tab
n = length(r)
RV = sum(r .^ 2)  # realized variance
BV = (pi / 2) * sum(abs.(r[2:end]) .* abs.(r[1:end-1]))  # bipower variation
mu43 = 2^(2 / 3) * gamma(7 / 6) / gamma(1 / 2)  # E|Z|^(4/3) for a standard normal Z
TQ = n * mu43^(-3) * sum(abs.(r[3:end]) .^ (4 / 3) .* abs.(r[2:end-1]) .^ (4 / 3) .* abs.(r[1:end-2]) .^ (4 / 3))  # tripower quarticity
Z = (RV - BV) / sqrt(((pi / 2)^2 + pi - 5) * TQ / n)
p = 0.5 * erfc(Z / sqrt(2))  # one-sided p-value
println("Z = ", round(Z, digits = 2), ", one-sided p-value = ", round(p, sigdigits = 3), Z > 1.645 ? ": jumps at the 5% level" : ": no significant jump at the 5% level")
'''

[[actionGroups.actions]]
id = "noise"
label = "Microstructure Noise"
desc = "The variance of the noise, estimated by the two-scales method, against the variance of the efficient price over one tick"
code = '''
noise = estimate_microstructure_noise(ts, [asset])[asset]  # variance of the noise in the log price
per_tick = sigma^2 / count(==(asset), ticks.asset)  # variance of the efficient price over one tick, from this tab's estimate
(noise_sd_basis_points = round(1e4 * sqrt(noise), digits = 2), noise_to_signal = round(noise / per_tick, digits = 2))  # a ratio above 1: tick returns are mostly noise
'''

[[actionGroups.actions]]
id = "intraday"
label = "Volatility Through the Day"
desc = "Realized volatility of each half hour, from one-minute returns"
code = '''
using Plots
minute = grid_returns(ticks, asset, 60)  # one-minute log returns
halves = collect(Iterators.partition(minute, 30))  # half hours
bar(100 .* [sqrt(sum(abs2, h)) for h in halves]; xlabel = "Half hour of the span", ylabel = "Realized volatility (%)", legend = false)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "estimators"
label = "All Four Estimators"
desc = "Realized volatility on every tick and every five minutes, two-scales and bipower volatility, side by side"
code = '''
r5 = grid_returns(ticks, asset, 300)  # log returns every five minutes
rows = [
    (estimator = "Realized, every tick", volatility = simple_volatility(ts, [asset]; use_all_obs = true)[asset] * sqrt(span)),
    (estimator = "Realized, every 5 minutes", volatility = simple_volatility(ts, [asset]; fixed_spacing = 300)[asset] * sqrt(span)),
    (estimator = "Two-scales, every tick", volatility = two_scales_volatility(ts, [asset])[1][asset] * sqrt(span)),
    (estimator = "Bipower, every 5 minutes", volatility = sqrt((pi / 2) * sum(abs.(r5[2:end]) .* abs.(r5[1:end-1])))),
]
{{?data=simulated}} push!(rows, (estimator = "True, continuous moves only", volatility = 0.01), (estimator = "True, with the jump", volatility = sqrt(0.01^2 + 0.01^2)))
[(r.estimator, round(100 * r.volatility, digits = 3)) for r in rows]  # volatility over the span, in %
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "annualise"
label = "Annualise"
desc = "The volatility of one day of ticks scaled to a year of 252 trading days"
code = '''
println("Annualised volatility: ", round(100 * sigma * sqrt(252), digits = 2), "%  (valid when the ticks cover one trading day)")
'''

[[actionGroups.actions]]
id = "jumpshare"
label = "Jump Share of the Variance"
desc = "The share of realized variance that bipower variation does not explain, an estimate of the part due to jumps"
code = '''
{{?model=rv|tsv}} r = grid_returns(ticks, asset, 300)  # log returns every five minutes
{{?model=bpv}} r = grid_returns(ticks, asset, {{every}})  # the returns of the tab
RV = sum(r .^ 2)
BV = (pi / 2) * sum(abs.(r[2:end]) .* abs.(r[1:end-1]))
println("Jump share of the variance: ", round(100 * max(RV - BV, 0) / RV, digits = 1), "%")
'''
