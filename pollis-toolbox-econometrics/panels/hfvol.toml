[[models]]
id = "rv"
label = "Realized"

[[models]]
id = "tsv"
label = "Two-Scales"

[[models]]
id = "bpv"
label = "Bipower"

[[bullets]]
text = "Realized"
detail = "the square root of the sum of squared log returns, sampled every few minutes so that market noise does not swamp it"

[[bullets]]
text = "Two-Scales"
detail = "uses every tick and removes the bias of the noise by combining realized variance on all ticks with its average over sparser sub-grids"

[[bullets]]
text = "Bipower"
detail = "multiplies adjacent absolute returns, so a jump counts far less than in realized variance and the two can be compared to find jumps"

[[decisionRows]]
task = "Realized"
context = "Prices every few minutes"
purpose = "The day's volatility, jumps included"

[[decisionRows]]
task = "Two-Scales"
context = "Every tick, with noise"
purpose = "The day's volatility from all the ticks, with the noise removed, and the size of the noise"

[[decisionRows]]
task = "Bipower"
context = "Possible jumps"
purpose = "The volatility of the continuous moves, apart from jumps, and a test for jumps"

[[inputs]]
id = "data"
label = "Tick Data"
tooltip = "simulated: one trading day of 6.5 hours with a tick every second, a true volatility of 1%, a 1% jump and noise of 2 basis points. Otherwise any Tables.jl source (e.g. a named tuple of vectors) with one row per tick: time (seconds), asset (Symbol) and logprice. Only the first asset is measured."
default = "simulated"

[[inputs]]
id = "spacing"
label = "Sampling Interval (seconds)"
tooltip = "Seconds between the prices whose returns are squared: 300, five minutes, is a common choice. Leave blank for the interval HighFrequencyCovariance.jl chooses from its estimate of the noise."
default = "300"
models = ["rv"]

[[inputs]]
id = "K"
label = "Sub-grids (K)"
tooltip = "Number of sub-grids of the slow time scale, each taking every K-th tick. Leave blank for the package default: the number of ticks of the asset with the fewest, divided by 100, and at least 3."
default = ""
models = ["tsv"]

[[inputs]]
id = "every"
label = "Sampling Interval (seconds)"
tooltip = "Seconds between the prices whose returns are multiplied: 300, five minutes, keeps the noise small next to each return."
default = "300"
models = ["bpv"]

[miniCharts]
# SVG drawing functions for each model's mini-chart icon (54 x 86 box)

