# Many small intraday returns summed into one bar
svg = '''
var s = '<line x1="4" y1="44" x2="38" y2="44" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>';
for (var i = 0; i < 16; i++) { var h = 3 + 9 * Math.abs(Math.sin(i * 1.7)); s += '<line x1="' + (6 + i * 2) + '" y1="' + (44 - h) + '" x2="' + (6 + i * 2) + '" y2="' + (44 + h * 0.6) + '" stroke="currentColor" stroke-width="1" opacity="0.6"/>'; }
s += '<rect x="42" y="24" width="7" height="42" fill="currentColor" opacity="0.9"/>';
return s;
'''

[miniCharts.tsv]
# Noisy fast path and a smooth slow-scale path
svg = '''
var d = '', e = '';
for (var i = 0; i <= 44; i++) {
	var base = 44 - 12 * Math.sin(i / 9);
	d += (i ? 'L' : 'M') + (5 + i) + ',' + (base + (i % 2 ? 4 : -4)).toFixed(1);
	e += (i ? 'L' : 'M') + (5 + i) + ',' + base.toFixed(1);
}
return '<path d="' + d + '" fill="none" stroke="currentColor" stroke-width="0.8" opacity="0.4"/><path d="' + e + '" fill="none" stroke="currentColor" stroke-width="1.6"/>';
'''

[miniCharts.bpv]
# Returns with one jump that bipower variation discounts
svg = '''
var s = '<line x1="4" y1="46" x2="50" y2="46" stroke="currentColor" stroke-width="0.6" opacity="0.5"/>';
for (var i = 0; i < 20; i++) {
	var h = i === 11 ? 26 : 3 + 6 * Math.abs(Math.sin(i * 1.3));
	s += '<line x1="' + (6 + i * 2.2) + '" y1="' + (46 - h) + '" x2="' + (6 + i * 2.2) + '" y2="46" stroke="currentColor" stroke-width="1.2" opacity="' + (i === 11 ? 0.95 : 0.55) + '"/>';
}
return s;
'''

[[codeBranches]]
model = "rv"
code = '''
using HighFrequencyCovariance, Dates

{{?data=simulated}} using Random
{{?data=simulated}} rng = Xoshiro(7); n = 23400  # one trading day of 6.5 hours, a tick every second
{{?data=simulated}} efficient = log(100) .+ cumsum(0.01 / sqrt(n) .* randn(rng, n))  # efficient log price, true volatility 1% over the day
{{?data=simulated}} efficient[14000:end] .-= 0.01  # a 1% drop after 14,000 seconds: a jump
{{?data=simulated}} ticks = (time = collect(1.0:n), asset = fill(:SPX, n), logprice = efficient .+ 0.0002 .* randn(rng, n))  # observed with 2 basis points of noise. Replace ticks with your own.
{{?data!=simulated}} using Tables
{{?data!=simulated}} ticks = Tables.columntable({{data}})  # one row per tick: time (seconds), asset (Symbol) and logprice
ts = SortedDataFrame(HighFrequencyCovariance.DataFrame(ticks), :time, :asset, :logprice, Second(1))  # the package's tick table, sorted by time
asset = first(get_assets(ts))
span = duration(ts; in_dates_period = false)  # seconds from the first tick to the last

"""The log returns of `asset` every `every` seconds: the last price at or before each time of the grid."""
function grid_returns(ticks, asset, every)
    mine = ticks.asset .== asset
    order = sortperm(ticks.time[mine])
    t, p = ticks.time[mine][order], ticks.logprice[mine][order]
    return diff([p[searchsortedlast(t, g)] for g in range(first(t), last(t); step = every)])
end

{{?spacing=}} vols = simple_volatility(ts, [asset])  # sampled at the interval the package chooses from its estimate of the noise
{{?spacing!=}} vols = simple_volatility(ts, [asset]; fixed_spacing = {{spacing}})  # sampled every {{spacing}} seconds
sigma = vols[asset] * sqrt(span)  # volatility over the span of the ticks: one day of ticks gives a daily volatility

println("Realized volatility over the span: ", round(100 * sigma, digits = 3), "%")
'''

