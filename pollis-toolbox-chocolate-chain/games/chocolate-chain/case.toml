# Grow a Chocolate Chain: a case of Compose > Collaboration > Simulation Games. Its model is model.jl,
# which Pollis runs for each round, in a fresh Julia process on the facilitator's computer.

title = "Grow a Chocolate Chain"
description = "Rival teams each run a chocolate brand in one country, and make every tablet they sell in their own shops. Each year they set their price, beans, shops, staff and marketing. The highest cumulative profit after five years wins."
rounds = 5
round = "Year"
teams = [2, 6]
briefing = "briefing.md"
# Questions the debrief suggests for the class.
debrief = "debrief-questions.md"
# Teams can write to each other, the facilitator reading what they write.
negotiations = true

# The ways the teams can be organised; the facilitator chooses one when hosting the game. Each role reads its
# briefing and sets the decisions it lists.
[[structures]]
key = "board"
label = "Board Members"
description = "Every player sits on the board of their brand, reads every briefing and sets every decision."

[[structures.roles]]
key = "board"
label = "Board Member"
briefing = ["briefings/shops-and-staff.md", "briefings/buyers-and-marketing.md", "briefings/beans.md", "briefings/costs-and-cash.md"]

[[structures]]
key = "departments"
label = "Departments"
description = "Each player runs a department: Chief Executive, Marketing, Sourcing or Finance. Each reads its own briefing and sets its own decisions, so the team has to talk."

[[structures.roles]]
key = "chief_executive"
label = "Chief Executive"
briefing = "briefings/shops-and-staff.md"
decides = ["shops", "staff"]

[[structures.roles]]
key = "marketing"
label = "Marketing"
briefing = "briefings/buyers-and-marketing.md"
decides = ["price", "marketing"]

[[structures.roles]]
key = "sourcing"
label = "Sourcing"
briefing = "briefings/beans.md"
decides = ["beans"]

[[structures.roles]]
key = "finance"
label = "Finance"
briefing = "briefings/costs-and-cash.md"
decides = []

[[decisions]]
key = "price"
label = "Price per Tablet"
kind = "number"
unit = "€"
min = 2
max = 9
step = 0.1
default = 4
help = "What a 100 g tablet costs in your shops."

[[decisions]]
key = "beans"
label = "Beans"
kind = "choice"
options = ["bulk", "fine", "origin"]
labels = ["Bulk Forastero", "Fine Trinitario", "Single-Origin Criollo"]
default = "fine"
help = "The cacao your tablets are made from."

[[decisions]]
key = "shops"
label = "Shops"
kind = "number"
min = 1
max = 20
step = 1
default = 2
help = "The shops you run this year."

[[decisions]]
key = "staff"
label = "Staff per Shop"
kind = "number"
min = 2
max = 10
step = 1
default = 3
help = "The staff in each of your shops."

[[decisions]]
key = "marketing"
label = "Marketing"
kind = "number"
unit = "thousand €"
min = 0
max = 500
step = 5
default = 50
help = "What you spend on marketing this year."

# The results: those every player sees and those each team alone sees. The debrief ranks the teams by winner, a
# column of the public results, whose rows name their team in team.
[results]
winner = "cumulative_profit"

[[results.public]]
key = "team"
label = "Team"

[[results.public]]
key = "price"
label = "Price"
unit = "€"
digits = 2

[[results.public]]
key = "beans"
label = "Beans"

[[results.public]]
key = "shops"
label = "Shops"

[[results.public]]
key = "share"
label = "Market Share"
unit = "%"
digits = 1

[[results.public]]
key = "sales"
label = "Tablets Sold"

[[results.public]]
key = "profit"
label = "Profit"
unit = "€"

[[results.public]]
key = "cumulative_profit"
label = "Cumulative Profit"
unit = "€"

[[results.private]]
key = "demand"
label = "Demand"
unit = "tablets"

[[results.private]]
key = "capacity"
label = "Capacity"
unit = "tablets"

[[results.private]]
key = "lost_sales"
label = "Lost Sales"
unit = "tablets"

[[results.private]]
key = "revenue"
label = "Revenue"
unit = "€"

[[results.private]]
key = "tablet_costs"
label = "Cost of the Tablets"
unit = "€"

[[results.private]]
key = "rent"
label = "Rent"
unit = "€"

[[results.private]]
key = "wages"
label = "Wages"
unit = "€"

[[results.private]]
key = "opening"
label = "Shops Opened"
unit = "€"

[[results.private]]
key = "marketing"
label = "Marketing"
unit = "€"

[[results.private]]
key = "profit"
label = "Profit"
unit = "€"

[[results.private]]
key = "cash"
label = "Cash"
unit = "€"

# The news the facilitator can release, from the round given on; [news.parameters] are the values of
# [parameters] it changes from the round it is released in. roles are those who read it in a structure that has
# them; everyone reads it in one that has none of them.
[[news]]
round = 2
title = "Cacao Prices Climb"
text = "A poor harvest in West Africa has pushed up the price of cacao. Traders expect Bulk Forastero to cost about 0.85 € a tablet from now on, Fine Trinitario about 1.25 €, and Single-Origin Criollo, grown elsewhere, about 1.90 €."
roles = ["sourcing", "finance"]

[news.parameters.bean_cost]
bulk = 0.85
fine = 1.25
origin = 1.9

[[news]]
round = 3
title = "Rents Rise in the Shopping Streets"
text = "Landlords are raising rents across the country's shopping streets: a shop will cost about 48,000 € a year from now on."
roles = ["chief_executive", "finance"]

[news.parameters]
rent = 48000

[[news]]
round = 4
title = "A Television Series on Craft Chocolate"
text = "A popular television series follows the makers of fine chocolate. Market researchers expect buyers to care more about the beans from now on, and most of all about the finest."
roles = ["marketing", "sourcing"]

[news.parameters.quality_appeal]
fine = 0.75
origin = 1.45

# What model.jl reads. The market is the tablets the country's buyers would buy in a year; each brand's
# appeal adds its beans, its price, its brand and its shops, and buyers choose among the brands and buying
# none by a multinomial logit.
[parameters]
market_size = 1500000
market_growth = 0.04
demand_noise = 0.08
no_purchase_appeal = 1.0
price_sensitivity = 1.8
brand_appeal = 0.5
brand_memory = 0.5
shop_appeal = 0.6
tablets_per_staff = 20000
other_unit_cost = 0.4
rent = 40000
wage = 22000
opening_cost = 80000
starting_cash = 1000000

[parameters.quality_appeal]
bulk = 0.0
fine = 0.6
origin = 1.1

[parameters.bean_cost]
bulk = 0.6
fine = 1.0
origin = 1.7
