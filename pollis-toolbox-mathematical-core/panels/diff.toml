[[bullets]]
text = "Finite Differences"
detail = "forward, backward and central difference quotients at a step h, and central stencils of 3 to 9 points whose step <span class=\"yellow\">FiniteDifferences</span> chooses"

[[bullets]]
text = "Higher Derivatives"
detail = "second, third and fourth derivatives from the weights of a central stencil"

[[bullets]]
text = "Jacobians, Hessians"
detail = "gradients, Hessians and Jacobians from difference quotients, with the number of function evaluations each one costs"

[[bullets]]
text = "Complex Step"
detail = "the imaginary part of f(x0 + ih) / h: no subtraction, so the step can be as small as 1e-20"

[[bullets]]
text = "Step Size and Error"
detail = "truncation error falls with the step and rounding error grows: the best step, and Richardson extrapolation over a sequence of steps"

[[decisionRows]]
task = "Finite Differences"
context = "A function known only through its values: a simulation, an external program, a model solved numerically"
purpose = "A difference quotient needs nothing but evaluations of f; the central difference is more accurate than the forward one for the same step"

[[decisionRows]]
task = "Higher Derivatives"
context = "Curvature, convexity or a third derivative, for a function given by its values"
purpose = "A stencil of more points estimates a derivative of higher order; its weights come from the Taylor expansions of f around x0"

[[decisionRows]]
task = "Jacobians, Hessians"
context = "A function of several variables, or several functions, given by their values"
purpose = "One difference quotient per variable for a gradient or a Jacobian, and per pair of variables for a Hessian: the cost grows with the number of variables"

[[decisionRows]]
task = "Complex Step"
context = "A function written as code that accepts complex numbers"
purpose = "The first derivative to machine precision with one evaluation, since nothing is subtracted"

[[decisionRows]]
task = "Step Size and Error"
context = "Any difference quotient, before relying on its digits"
purpose = "The error is lowest at a step that balances truncation against rounding; Richardson extrapolation combines several steps into a better estimate"

[[inputs]]
id = "f1"
label = "Function f(x)"
tooltip = "A Julia expression in x, e.g. x^2 * exp(-x) or log(1 + x). The Complex Step tab needs it to accept complex numbers."
