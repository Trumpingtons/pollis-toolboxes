label = "2"

[[inputs.options]]
value = "3"
label = "3"

[[inputs.options]]
value = "4"
label = "4"

[[inputs]]
id = "p"
label = "Stencil Points"
tooltip = "The number of points of the central stencil: more points cancel more terms of the Taylor expansion."
kind = "select"
default = "5"
models = ["fd", "hd"]

[[inputs.options]]
value = "3"
label = "3"

[[inputs.options]]
value = "5"
label = "5"

[[inputs.options]]
value = "7"
label = "7"

[[inputs.options]]
value = "9"
label = "9"

[[inputs]]
id = "fn"
label = "Function f(x)"
tooltip = "A Julia expression in the variables x[1], x[2], ... returning one number: its gradient and Hessian are estimated. The default is a Cobb-Douglas production function with capital share 0.3."
default = "x[1]^0.3 * x[2]^0.7"
models = ["jh"]

[[inputs]]
id = "F"
label = "Functions F(x)"
tooltip = "A vector with one Julia expression per output, in the variables x[1], x[2], ...: its Jacobian is estimated. The number of outputs need not equal the number of variables."
kind = "textarea"
