[[inputs]]
id = "xv"
label = "Point x0"
tooltip = "The point at which the derivatives are estimated, one value per variable."
default = "[1.0, 2.0]"
models = ["jh"]

[[inputs]]
id = "w"
label = "Plot Half-Width"
tooltip = "The plots show x0 plus or minus this amount."
default = "1.0"
newRow = true

[[codeBranches]]
model = "fd"
code = '''
using FiniteDifferences
import Symbolics

f(x) = {{f1}}
x0 = float({{x0}})
h = {{h}}  # the step of the three difference quotients
fwd = (f(x0 + h) - f(x0)) / h  # forward difference: error of order h
bwd = (f(x0) - f(x0 - h)) / h  # backward difference: error of order h
cen = (f(x0 + h) - f(x0 - h)) / (2h)  # central difference: error of order h^2
m = central_fdm({{p}}, 1)  # a central stencil of {{p}} points
hstep, err = estimate_step(m, f, x0)  # the step FiniteDifferences chooses, and its estimate of the error
d1 = m(f, x0)
Symbolics.@variables t
exact = Symbolics.build_function(Symbolics.expand_derivatives(Symbolics.Differential(t)(f(t))), t; expression=Val{false})(x0)  # the exact derivative, from the formula
(x0 = x0, exact = exact, forward = fwd, backward = bwd, central = cen, stencil = d1, stencil_step = hstep, stencil_error_estimate = err, errors = (forward = abs(fwd - exact), backward = abs(bwd - exact), central = abs(cen - exact), stencil = abs(d1 - exact)))
'''

[[codeBranches]]
model = "hd"
code = '''
using FiniteDifferences
import Symbolics

f(x) = {{f1}}
x0 = float({{x0}})
q = {{q}}  # the order of the derivative
m = central_fdm({{p}}, q)  # a central stencil of {{p}} points
hstep, err = estimate_step(m, f, x0)  # the step FiniteDifferences chooses, and its estimate of the error
d = m(f, x0)
Symbolics.@variables t
exact = Symbolics.build_function(Symbolics.expand_derivatives((Symbolics.Differential(t)^q)(f(t))), t; expression=Val{false})(x0)  # the exact derivative, from the formula
(x0 = x0, order = q, estimate = d, exact = exact, error = abs(d - exact), step = hstep, error_estimate = err, grid = collect(m.grid), weights = collect(m.coefs))
'''

[[codeBranches]]
model = "jh"
code = '''
using FiniteDifferences, DifferentiationInterface
import Symbolics

f(x) = {{fn}}
F(x) = {{F}}
x0 = {{xv}}
m = central_fdm(5, 1)  # a central stencil of 5 points
calls = Ref(0)  # counts the evaluations of f
fc(x) = (calls[] += 1; f(x))
g = grad(m, fc, x0)[1]; gradient_calls = calls[]
calls[] = 0
H = jacobian(m, x -> grad(m, fc, x)[1], x0)[1]; hessian_calls = calls[]  # the Jacobian of the gradient
J = jacobian(m, F, x0)[1]  # row i = output i, column j = variable j
exact_g = gradient(f, AutoSymbolics(), x0); exact_H = hessian(f, AutoSymbolics(), x0); exact_J = jacobian(F, AutoSymbolics(), x0)  # exact, from the formulas
(gradient = g, hessian = H, jacobian = J, evaluations = (gradient = gradient_calls, hessian = hessian_calls), max_errors = (gradient = maximum(abs, g .- exact_g), hessian = maximum(abs, H .- exact_H), jacobian = maximum(abs, J .- exact_J)), hessian_asymmetry = maximum(abs, H .- transpose(H)))
'''

[[codeBranches]]
model = "cs"
code = '''
import Symbolics

f(x) = {{f1}}
x0 = float({{x0}})
h = {{hc}}  # the complex step can be tiny, since nothing is subtracted
d1 = imag(f(x0 + im * h)) / h  # complex step: error of order h^2
hr = cbrt(eps()) * max(1, abs(x0))  # a usual step of the central difference
cen = (f(x0 + hr) - f(x0 - hr)) / (2hr)
Symbolics.@variables t
exact = Symbolics.build_function(Symbolics.expand_derivatives(Symbolics.Differential(t)(f(t))), t; expression=Val{false})(x0)  # the exact derivative, from the formula
(x0 = x0, exact = exact, complex_step = d1, central = cen, errors = (complex_step = abs(d1 - exact), central = abs(cen - exact)))
'''

[[codeBranches]]
model = "ss"
code = '''
using FiniteDifferences
import Symbolics

f(x) = {{f1}}
x0 = float({{x0}})
Symbolics.@variables t
exact = Symbolics.build_function(Symbolics.expand_derivatives(Symbolics.Differential(t)(f(t))), t; expression=Val{false})(x0)  # the exact derivative, from the formula
hs = 10.0 .^ (-1:-1:-14)  # steps from 0.1 down
errors = [(h = h, forward = abs((f(x0 + h) - f(x0)) / h - exact), central = abs((f(x0 + h) - f(x0 - h)) / (2h) - exact)) for h in hs]
best_forward = errors[argmin([e.forward for e in errors])].h
best_central = errors[argmin([e.central for e in errors])].h
h = best_central
d1, richardson_estimate = extrapolate_fdm(central_fdm(2, 1), f, x0)  # Richardson extrapolation over a sequence of steps
(exact = exact, errors = errors, best_step_forward = best_forward, best_step_central = best_central, richardson = d1, richardson_error = abs(d1 - exact), richardson_error_estimate = richardson_estimate)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "secants-tangent"
label = "Secants and Tangent"
desc = "f with its tangent at x0 and the forward and central secants of a step of half the plot half-width: the central secant runs closer to the tangent"
models = ["fd", "cs", "ss"]
code = '''
using Plots
hv = {{w}} / 2  # a step large enough to see
xs = range(x0 - {{w}}, x0 + {{w}}, length=400)
sf = (f(x0 + hv) - f(x0)) / hv; sc = (f(x0 + hv) - f(x0 - hv)) / (2hv)
p = Plots.plot(xs, f.(xs), lw=2, c=:black, label="f(x)", xlabel="x")
Plots.plot!(xs, f(x0) .+ exact .* (xs .- x0), lw=2, c=:blue, label="tangent, slope $(round(exact, sigdigits=4))")
Plots.plot!(xs, f(x0) .+ sf .* (xs .- x0), lw=2, ls=:dash, c=:red, label="forward secant, slope $(round(sf, sigdigits=4))")
Plots.plot!(xs, f(x0) .+ sc .* (xs .- x0), lw=2, ls=:dash, c=:green, label="central secant, slope $(round(sc, sigdigits=4))")
Plots.scatter!([x0 - hv, x0, x0 + hv], f.([x0 - hv, x0, x0 + hv]), ms=5, c=:black, label="")
p
'''

[[actionGroups.actions]]
id = "stencil-weights"
label = "Stencil Weights"
desc = "The weight of each point of the stencil, at its multiple of the step: the estimate is the weighted sum of the values of f there, divided by the step to the power of the order"
models = ["fd", "hd"]
code = '''
using Plots
{{?model=fd}} mm = central_fdm({{p}}, 1); qq = 1
{{?model=hd}} mm = m; qq = q
Plots.bar(collect(mm.grid), collect(mm.coefs), xlabel="point of the stencil, in steps from x0", ylabel="weight", title="Central stencil of $(length(mm.grid)) points, derivative of order $qq", legend=false)
'''

[[actionGroups.actions]]
id = "error-heat-map"
label = "Error Heat Map"
desc = "The absolute error of each entry of the estimated Jacobian against the exact one: the entries a difference quotient estimates worst"
models = ["jh"]
code = '''
using Plots
E = abs.(J .- exact_J)
lab = vec([(j, i, Plots.text(string(round(E[i, j], sigdigits=2)), 9)) for i in axes(E, 1), j in axes(E, 2)])
Plots.heatmap(E, yflip=true, c=:viridis, xlabel="variable j", ylabel="output i", title="Error of the estimated Jacobian at x0", annotations=lab)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "step-size-error"
label = "Step-Size Error"
desc = "Error against the exact derivative as the step h shrinks: truncation error falls and rounding error rises, so each difference quotient has a best step; the complex step has no rounding error from subtraction"
code = '''
using Plots
hs = 10.0 .^ (-1:-0.5:-15)
{{?model=fd|cs|ss}} s(t) = f(x0 + t); ds = exact
{{?model=jh}} s(t) = f(x0 .+ t .* [1.0; zeros(length(x0) - 1)]); ds = exact_g[1]  # slice along x[1]
{{?model=fd|cs|ss|jh}} fwd_err = [abs((s(h) - s(0)) / h - ds) for h in hs]
{{?model=fd|cs|ss|jh}} cen_err = [abs((s(h) - s(-h)) / 2h - ds) for h in hs]
{{?model=fd|cs|ss|jh}} cst_err = try [abs(imag(s(im * h)) / h - ds) for h in hs] catch; fill(NaN, length(hs)) end  # needs f to accept complex numbers
{{?model=fd|cs|ss|jh}} p = Plots.plot(hs, max.(fwd_err, 1e-17), xscale=:log10, yscale=:log10, m=:circle, lw=2, label="forward difference", xlabel="step h", ylabel="error vs exact", title="Error by step size", legend=:bottomleft)
{{?model=fd|cs|ss|jh}} Plots.plot!(hs, max.(cen_err, 1e-17), m=:square, lw=2, label="central difference")
{{?model=fd|cs|ss|jh}} Plots.plot!(hs, max.(cst_err, 1e-17), m=:diamond, lw=2, label="complex step")
{{?model=hd}} hd_err = [abs(m(f, x0, h) - exact) for h in hs]
{{?model=hd}} p = Plots.plot(hs, max.(hd_err, 1e-17), xscale=:log10, yscale=:log10, m=:circle, lw=2, label="central, $(length(m.grid)) points", xlabel="step h", ylabel="error vs exact", title="Error of the derivative of order $q by step size", legend=:bottomleft)
Plots.vline!([sqrt(eps()), cbrt(eps())], c=:gray, ls=:dot, label="sqrt(eps), cbrt(eps)")
p
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "linear-approximation"
label = "Linear Approximation"
desc = "Predicts f after a change in x from the estimated derivatives at x0 (first- and, with a Hessian, second-order Taylor) and compares with the exact value: good for small changes, worse as they grow"
models = ["fd", "cs", "ss", "jh"]
code = '''
{{?model=fd|cs|ss}} [(dx = dx, exact = f(x0 + dx), linear = f(x0) + d1 * dx) for dx in (-0.5, -0.1, -0.01, 0.01, 0.1, 0.5)]
{{?model=jh}} (f = [(change = "$(100r)% in every x", exact = f(x0 .* (1 + r)), linear = f(x0) + transpose(g) * (r .* x0), quadratic = f(x0) + transpose(g) * (r .* x0) + transpose(r .* x0) * H * (r .* x0) / 2) for r in (-0.1, -0.01, 0.01, 0.1)], F = [(change = "$(100r)% in every x", exact = F(x0 .* (1 + r)), linear = F(x0) .+ J * (r .* x0)) for r in (-0.1, -0.01, 0.01, 0.1)])
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-methods"
label = "Compare Methods"
desc = "The first derivative by forward and central stencils of several sizes, Richardson extrapolation and the complex step: estimate, error against the exact value and the number of evaluations of f each one took"
models = ["fd", "cs", "ss"]
code = '''
using FiniteDifferences
calls = Ref(0)  # counts the evaluations of f
fc(x) = (calls[] += 1; f(x))
stencils = ["forward, 2 points" => forward_fdm(2, 1), "central, 3 points" => central_fdm(3, 1), "central, 5 points" => central_fdm(5, 1), "central, 9 points" => central_fdm(9, 1)]
rows = map(stencils) do (name, mm)
    calls[] = 0
    v = mm(fc, x0)
    (method = name, estimate = v, error = abs(v - exact), evaluations = calls[])
end
calls[] = 0
r = extrapolate_fdm(central_fdm(2, 1), fc, x0)[1]
push!(rows, (method = "Richardson extrapolation", estimate = r, error = abs(r - exact), evaluations = calls[]))
c = try imag(f(x0 + im * 1e-20)) / 1e-20 catch; NaN end  # needs f to accept complex numbers
push!(rows, (method = "complex step", estimate = c, error = abs(c - exact), evaluations = 1))
rows
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "accuracy-summary"
label = "Accuracy Summary"
desc = "How many significant digits of each estimate agree with the exact derivative, the step used beside the usual rules, and the most accurate estimate of the tab"
code = '''
digits_left(error, e) = round(-log10(max(error / max(maximum(abs, e), floatmin()), eps())), digits=1)  # significant digits an absolute error leaves
correct_digits(v, e) = digits_left(maximum(abs, v .- e), e)  # significant digits that agree with the exact value
step_rules = (forward = sqrt(eps()) * max(1, abs(first(x0))), central = cbrt(eps()) * max(1, abs(first(x0))))
{{?model=fd}} estimates = (forward = fwd, backward = bwd, central = cen, stencil = d1)
{{?model=fd}} (exact = exact, correct_digits = map(v -> correct_digits(v, exact), estimates), step = h, stencil_step = hstep, step_rules = step_rules, most_accurate = argmin(map(v -> abs(v - exact), estimates)))
{{?model=hd}} (exact = exact, estimate = d, correct_digits = correct_digits(d, exact), step = hstep, error_estimate = err, error = abs(d - exact))
{{?model=cs}} estimates = (complex_step = d1, central = cen)
{{?model=cs}} (exact = exact, correct_digits = map(v -> correct_digits(v, exact), estimates), step = h, most_accurate = argmin(map(v -> abs(v - exact), estimates)))
{{?model=ss}} (exact = exact, correct_digits = (best_forward = digits_left(minimum(e.forward for e in errors), exact), best_central = digits_left(minimum(e.central for e in errors), exact), richardson = correct_digits(d1, exact)), best_step_forward = best_forward, best_step_central = best_central, step_rules = step_rules)
{{?model=jh}} (correct_digits = (gradient = correct_digits(g, exact_g), hessian = correct_digits(H, exact_H), jacobian = correct_digits(J, exact_J)), evaluations = (gradient = gradient_calls, hessian = hessian_calls))
'''
