models = ["fd", "hd", "cs", "ss"]

[[inputs]]
id = "x0"
label = "Point x0"
tooltip = "The point at which the derivative is estimated."
default = "1.0"
models = ["fd", "hd", "cs", "ss"]

[[inputs]]
id = "h"
label = "Step h"
tooltip = "The step of the forward, backward and central differences."
default = "1e-5"
models = ["fd"]

[[inputs]]
id = "hc"
label = "Step h"
tooltip = "The step of the complex step: it can be tiny, since nothing is subtracted."
default = "1e-20"
models = ["cs"]

[[inputs]]
id = "q"
label = "Derivative Order"
tooltip = "The order of the derivative: 2 for curvature. The stencil needs more points than the order."
