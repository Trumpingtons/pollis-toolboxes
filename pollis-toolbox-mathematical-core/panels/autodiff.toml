[[models]]
id = "deriv"
label = "Derivatives"

[[models]]
id = "grad"
label = "Gradients and Hessians"

[[models]]
id = "jac"
label = "Jacobians"

[[models]]
id = "pfpb"
label = "Pushforward/Pullback"

[[bullets]]
text = "Derivatives"
detail = "one function of one variable: the first and second derivative at a point, i.e. slope and curvature"

[[bullets]]
text = "Gradients and Hessians"
detail = "one function of several variables: the vector of partial derivatives and the matrix of second partials"

[[bullets]]
text = "Jacobians"
detail = "several functions of several variables: the matrix of all first partial derivatives"

[[bullets]]
text = "Pushforward/Pullback"
detail = "one pass of forward mode gives J times a direction (pushforward); one pass of reverse mode gives the transpose of J times a weight on the outputs (pullback)"

[[bullets]]
text = "Backends"
detail = "<span class=\"yellow\">DifferentiationInterface</span> runs the same code on <span class=\"yellow\">ForwardDiff</span>, <span class=\"yellow\">Enzyme</span>, <span class=\"yellow\">Mooncake</span> (automatic), <span class=\"yellow\">FiniteDiff</span> (numerical) or <span class=\"yellow\">Symbolics</span> (exact)"

[[decisionRows]]
task = "Derivatives"
context = "A function of one variable: marginal cost, marginal revenue, the slope of a demand curve"
purpose = "The first derivative gives the rate of change and the direction; the second tells whether the function is convex or concave there"

[[decisionRows]]
task = "Gradients and Hessians"
context = "A function of several variables: a production, utility or likelihood function"
purpose = "The gradient holds the marginal products and points uphill; the Hessian's eigenvalues say whether a stationary point is a maximum, minimum or saddle"

[[decisionRows]]
task = "Jacobians"
context = "Several functions of several variables: a system of demand or supply equations, the right-hand side of a dynamic model"
purpose = "The Jacobian is the best linear approximation to the system; its determinant decides local invertibility and it drives Newton's method and comparative statics"

[[decisionRows]]
task = "Pushforward/Pullback"
context = "A model with many inputs or many outputs, where the whole Jacobian is too costly: a loss function, a large simulation"
purpose = "The pushforward gives the change of every output along one direction of the inputs; the pullback gives the gradient of a weighted sum of the outputs, which is backpropagation"

[[inputs]]
id = "f1"
label = "Function f(x)"
tooltip = "A Julia expression in x, e.g. x^2 * exp(-x) or log(1 + x)."
default = "x^2 * exp(-x)"
models = ["deriv"]

[[inputs]]
id = "x0"
label = "Point x0"
tooltip = "The point at which the derivatives are evaluated."
default = "1.0"
models = ["deriv"]

[[inputs]]
id = "fn"
label = "Function f(x)"
tooltip = "A Julia expression in the variables x[1], x[2], ... returning one number. The default is a Cobb-Douglas production function with capital share 0.3."
default = "x[1]^0.3 * x[2]^0.7"
models = ["grad"]

[[inputs]]
id = "F"
label = "Functions F(x)"
tooltip = "A vector with one Julia expression per output, in the variables x[1], x[2], ... The number of outputs need not equal the number of variables."
kind = "textarea"
default = '''
[x[1]^2 * x[2],
 5x[1] + sin(x[2]),
 x[1] * exp(-x[2])]
'''
models = ["jac", "pfpb"]

[[inputs]]
id = "xv"
label = "Point x0"
tooltip = "The point at which the derivatives are evaluated, one value per variable."
default = "[1.0, 2.0]"
models = ["grad", "jac", "pfpb"]

[[inputs]]
id = "tx"
label = "Direction dx"
tooltip = "A direction in the inputs, one value per variable: the pushforward is the change of the outputs along it."
default = "[1.0, 0.0]"
models = ["pfpb"]

[[inputs]]
id = "ty"
label = "Weights dy"
tooltip = "A weight on each output, one value per output: the pullback is the gradient of the weighted sum of the outputs."
default = "[1.0, 0.0, 0.0]"
models = ["pfpb"]

[[inputs]]
id = "backend"
label = "Backend"
tooltip = "ForwardDiff: forward-mode AD with dual numbers, best for few inputs. Enzyme: reverse-mode AD on compiled code, best for many inputs. Mooncake: reverse-mode AD on Julia's IR. FiniteDiff: numerical differences, an approximation. Symbolics: exact formulas, then evaluated."
kind = "select"
default = "forwarddiff"
newRow = true

[[inputs.options]]
value = "forwarddiff"
label = "ForwardDiff"

[[inputs.options]]
value = "enzyme"
label = "Enzyme"

[[inputs.options]]
value = "mooncake"
label = "Mooncake"

[[inputs.options]]
value = "finitediff"
label = "FiniteDiff"

[[inputs.options]]
value = "symbolics"
label = "Symbolics"

[[inputs]]
id = "order"
label = "Taylor Order"
tooltip = "Highest power kept by the Taylor Polynomial action."
default = "4"

[[inputs]]
id = "w"
label = "Plot Half-Width"
tooltip = "The plots show x0 plus or minus this amount (in every variable)."
default = "1.0"

[[codeBranches]]
model = "deriv"
code = '''
using DifferentiationInterface
{{?backend=forwarddiff}} import ForwardDiff; backend = AutoForwardDiff(); backend2 = backend
{{?backend=enzyme}} import Enzyme; backend = AutoEnzyme(); backend2 = SecondOrder(AutoEnzyme(mode=Enzyme.Forward), AutoEnzyme(mode=Enzyme.Reverse))
{{?backend=mooncake}} import Mooncake; backend = AutoMooncake(; config=nothing); backend2 = SecondOrder(AutoMooncakeForward(; config=nothing), AutoMooncake(; config=nothing))
{{?backend=finitediff}} import FiniteDiff; backend = AutoFiniteDiff(); backend2 = backend
{{?backend=symbolics}} import Symbolics; backend = AutoSymbolics(); backend2 = backend

f(x) = {{f1}}
x0 = {{x0}}
dcalc(b) = derivative(f, b, x0)  # first derivative with any backend
d1 = dcalc(backend)
d2 = second_derivative(f, backend2, x0)
(x0 = x0, value = f(x0), first_derivative = d1, second_derivative = d2)
'''

[[codeBranches]]
model = "grad"
code = '''
using DifferentiationInterface
{{?backend=forwarddiff}} import ForwardDiff; backend = AutoForwardDiff(); backend2 = backend
{{?backend=enzyme}} import Enzyme; backend = AutoEnzyme(); backend2 = SecondOrder(AutoEnzyme(mode=Enzyme.Forward), AutoEnzyme(mode=Enzyme.Reverse))
{{?backend=mooncake}} import Mooncake; backend = AutoMooncake(; config=nothing); backend2 = SecondOrder(AutoMooncakeForward(; config=nothing), AutoMooncake(; config=nothing))
{{?backend=finitediff}} import FiniteDiff; backend = AutoFiniteDiff(); backend2 = backend
{{?backend=symbolics}} import Symbolics; backend = AutoSymbolics(); backend2 = backend

f(x) = {{fn}}
x0 = {{xv}}
dcalc(b) = gradient(f, b, x0)  # gradient with any backend
g = dcalc(backend)
H = hessian(f, backend2, x0)
(x0 = x0, value = f(x0), gradient = g, hessian = H)
'''

[[codeBranches]]
model = "jac"
code = '''
using DifferentiationInterface
{{?backend=forwarddiff}} import ForwardDiff; backend = AutoForwardDiff()
{{?backend=enzyme}} import Enzyme; backend = AutoEnzyme()
{{?backend=mooncake}} import Mooncake; backend = AutoMooncake(; config=nothing)
{{?backend=finitediff}} import FiniteDiff; backend = AutoFiniteDiff()
{{?backend=symbolics}} import Symbolics; backend = AutoSymbolics()

F(x) = {{F}}
x0 = {{xv}}
dcalc(b) = jacobian(F, b, x0)  # Jacobian with any backend: row i = output i, column j = variable j
J = dcalc(backend)
(x0 = x0, value = F(x0), jacobian = J)
'''

[[codeBranches]]
model = "pfpb"
code = '''
using DifferentiationInterface
{{?backend=forwarddiff}} import ForwardDiff; backend = AutoForwardDiff()
{{?backend=enzyme}} import Enzyme; backend = AutoEnzyme()
{{?backend=mooncake}} import Mooncake; backend = AutoMooncake(; config=nothing)
{{?backend=finitediff}} import FiniteDiff; backend = AutoFiniteDiff()
{{?backend=symbolics}} import Symbolics; backend = AutoSymbolics()

F(x) = {{F}}
x0 = {{xv}}
dx = {{tx}}  # a direction in the inputs
dy = {{ty}}  # a weight on each output
jvp = pushforward(F, backend, x0, (dx,))[1]  # forward mode, one pass: J * dx
vjp = pullback(F, backend, x0, (dy,))[1]  # reverse mode, one pass: transpose(J) * dy
dcalc(b) = vcat(pushforward(F, b, x0, (dx,))[1], pullback(F, b, x0, (dy,))[1])  # both products with any backend
J = jacobian(F, backend, x0)  # the whole Jacobian, to check the two products
(x0 = x0, value = F(x0), pushforward = jvp, pullback = vjp, pushforward_is_J_dx = isapprox(jvp, J * dx), pullback_is_Jt_dy = isapprox(vjp, transpose(J) * dy))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "function-tangent"
label = "Function and Tangent"
desc = "One variable: f with its tangent line and quadratic approximation at x0. Two variables: level curves with the gradient, which is perpendicular to them and points uphill. Jacobian: a heat map of the matrix"
code = '''
using Plots
{{?model=deriv}} xs = range(x0 - {{w}}, x0 + {{w}}, length=400); ys = f.(xs); pad = 0.2 * (maximum(ys) - minimum(ys) + eps())
{{?model=deriv}} p = Plots.plot(xs, ys, lw=2, c=:black, label="f(x)", xlabel="x", ylims=(minimum(ys) - pad, maximum(ys) + pad))
{{?model=deriv}} Plots.plot!(xs, f(x0) .+ d1 .* (xs .- x0), lw=2, c=:blue, label="tangent, slope $(round(d1, sigdigits=4))")
{{?model=deriv}} Plots.plot!(xs, f(x0) .+ d1 .* (xs .- x0) .+ d2 ./ 2 .* (xs .- x0) .^ 2, lw=2, ls=:dash, c=:red, label="quadratic approximation")
{{?model=deriv}} Plots.scatter!([x0], [f(x0)], ms=6, c=:black, label="")
{{?model=grad}} length(x0) == 2 || error("the plot needs exactly two variables")
{{?model=grad}} g1 = range(x0[1] - {{w}}, x0[1] + {{w}}, length=200); g2 = range(x0[2] - {{w}}, x0[2] + {{w}}, length=200)
{{?model=grad}} p = Plots.contour(g1, g2, (a, b) -> f([a, b]), levels=20, aspect_ratio=:equal, xlabel="x[1]", ylabel="x[2]", title="Level curves and the gradient at x0")
{{?model=grad}} sc = {{w}} / 2 / sqrt(sum(abs2, g))
{{?model=grad}} Plots.quiver!([x0[1]], [x0[2]], quiver=([sc * g[1]], [sc * g[2]]), c=:red, lw=2); Plots.scatter!([x0[1]], [x0[2]], c=:black, label="x0")
{{?model=jac|pfpb}} lab = vec([(j, i, Plots.text(string(round(J[i, j], sigdigits=3)), 9)) for i in axes(J, 1), j in axes(J, 2)])
{{?model=jac|pfpb}} p = Plots.heatmap(J, yflip=true, c=:balance, clims=(-1, 1) .* maximum(abs, J), xlabel="variable j", ylabel="output i", title="Jacobian: dF[i] / dx[j] at x0", annotations=lab)
p
'''

[[actionGroups.actions]]
id = "derivative-plot"
label = "Derivative Plot"
desc = "One variable: f, f' and f'' over the window, so you can see where f rises, falls and bends. Two variables: the gradient field. Jacobian: each output along x[1] with the Jacobian slopes at x0"
code = '''
using Plots
{{?model=deriv}} xs = range(x0 - {{w}}, x0 + {{w}}, length=200)
{{?model=deriv}} prep1 = prepare_derivative(f, backend, x0); prep2 = prepare_second_derivative(f, backend2, x0)  # prepare once, reuse at every point
{{?model=deriv}} d1s = [derivative(f, prep1, backend, x) for x in xs]; d2s = [second_derivative(f, prep2, backend2, x) for x in xs]
{{?model=deriv}} p = Plots.plot(xs, [f.(xs) d1s d2s], layout=(3, 1), lw=2, legend=false, title=["f(x)" "f'(x): positive where f rises" "f''(x): positive where f is convex"], xlabel="x", size=(700, 700))
{{?model=deriv}} foreach(k -> (Plots.hline!(p[k], [0], c=:gray, ls=:dot); Plots.vline!(p[k], [x0], c=:gray, ls=:dash)), 1:3)
{{?model=grad}} length(x0) == 2 || error("the plot needs exactly two variables")
{{?model=grad}} r1 = range(x0[1] - {{w}}, x0[1] + {{w}}, length=14)[2:end-1]; r2 = range(x0[2] - {{w}}, x0[2] + {{w}}, length=14)[2:end-1]
{{?model=grad}} pts = vec([[a, b] for a in r1, b in r2]); G = [gradient(f, backend, q) for q in pts]
{{?model=grad}} sc = 0.8 * step(r1) / maximum(q -> sqrt(sum(abs2, q)), G)
{{?model=grad}} p = Plots.contour(r1, r2, (a, b) -> f([a, b]), levels=15, aspect_ratio=:equal, xlabel="x[1]", ylabel="x[2]", title="Gradient field: arrows point uphill")
{{?model=grad}} Plots.quiver!(first.(pts), last.(pts), quiver=(sc .* first.(G), sc .* last.(G)), c=:red)
{{?model=jac|pfpb}} ts = range(-{{w}}, {{w}}, length=200); e1 = [1.0; zeros(length(x0) - 1)]; F0 = F(x0)
{{?model=jac|pfpb}} Fs = [F(x0 .+ t .* e1) for t in ts]
{{?model=jac|pfpb}} p = Plots.plot(xlabel="t, the change in x[1] from x0", title="Outputs along x[1]; dashed: slope J[i, 1]")
{{?model=jac|pfpb}} foreach(i -> (Plots.plot!(ts, getindex.(Fs, i), lw=2, label="F[$i]"); Plots.plot!(ts, F0[i] .+ J[i, 1] .* ts, ls=:dash, c=:gray, label="")), eachindex(F0))
p
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "check-exact"
label = "Check Against Exact"
desc = "Compares the selected backend with the exact symbolic derivative and a finite-difference approximation: AD should match the exact value to machine precision, finite differences to about half the digits"
code = '''
import Symbolics, FiniteDiff
exact = dcalc(AutoSymbolics()); numerical = dcalc(AutoFiniteDiff()); selected = dcalc(backend)
{{?model=deriv}} second = (selected = d2, exact = second_derivative(f, AutoSymbolics(), x0))
{{?model=grad}} second = (selected = H, exact = hessian(f, AutoSymbolics(), x0))
{{?model=jac|pfpb}} second = nothing
(selected_backend = selected, exact_symbolic = exact, finite_difference = numerical, max_error_selected = maximum(abs, selected .- exact), max_error_finite_difference = maximum(abs, numerical .- exact), second_order = second)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "linear-approximation"
label = "Linear Approximation"
desc = "Predicts f after a change in x from the derivatives at x0 (first- and, where available, second-order Taylor), or F along the direction dx from the pushforward, and compares with the exact value: good for small changes, worse as they grow"
code = '''
{{?model=deriv}} [(dx = dx, exact = f(x0 + dx), linear = f(x0) + d1 * dx, quadratic = f(x0) + d1 * dx + d2 / 2 * dx^2) for dx in (-0.5, -0.1, -0.01, 0.01, 0.1, 0.5)]
{{?model=grad}} [(change = "$(100r)% in every x", exact = f(x0 .* (1 + r)), linear = f(x0) + transpose(g) * (r .* x0), quadratic = f(x0) + transpose(g) * (r .* x0) + transpose(r .* x0) * H * (r .* x0) / 2) for r in (-0.1, -0.01, 0.01, 0.1)]
{{?model=jac}} [(change = "$(100r)% in every x", exact = F(x0 .* (1 + r)), linear = F(x0) .+ J * (r .* x0)) for r in (-0.1, -0.01, 0.01, 0.1)]
{{?model=pfpb}} [(t = t, exact = F(x0 .+ t .* dx), linear = F(x0) .+ t .* jvp) for t in (-0.5, -0.1, -0.01, 0.01, 0.1, 0.5)]  # along the direction dx
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-backends"
label = "Compare Backends"
desc = "The same derivative with every backend: result, error against the exact symbolic value and time on a second run (after compilation). Backends that are not installed or cannot handle f show the error"
code = '''
for pkg in (:ForwardDiff, :FiniteDiff, :Symbolics, :Enzyme, :Mooncake)
    try
        @eval import $pkg
    catch
        @warn "$pkg is not installed: its row will show the error"
    end
end
backends = ["ForwardDiff" => AutoForwardDiff(), "Enzyme" => AutoEnzyme(), "Mooncake" => AutoMooncake(; config=nothing), "FiniteDiff" => AutoFiniteDiff(), "Symbolics" => AutoSymbolics()]
ref = dcalc(AutoSymbolics())
map(backends) do (name, b)
    try
        dcalc(b)  # compile
        t = @elapsed r = dcalc(b)
        (backend = name, result = r, max_error = maximum(abs, r .- ref), seconds = round(t, sigdigits=3))
    catch e
        (backend = name, result = nothing, max_error = nothing, seconds = nothing, error = first(sprint(showerror, e), 120))
    end
end
'''

[[actionGroups.actions]]
id = "forward-reverse"
label = "Forward vs Reverse Mode"
desc = "Time per gradient of a test function as the number of inputs n grows: forward mode (ForwardDiff) needs work proportional to n, reverse mode (Enzyme, Mooncake) about a constant multiple of one evaluation"
code = '''
using Plots
for pkg in (:ForwardDiff, :Enzyme, :Mooncake)
    try
        @eval import $pkg
    catch
        @warn "$pkg is not installed"
    end
end
h(x) = sum(abs2, x) / 2 + sum(sin, x)  # a test function of n inputs
ns = (2, 10, 50, 200, 1000)
modes = ["ForwardDiff (forward)" => AutoForwardDiff(), "Enzyme (reverse)" => AutoEnzyme(), "Mooncake (reverse)" => AutoMooncake(; config=nothing)]
rows = vec([begin
    x = rand(n)
    t = try
        prep = prepare_gradient(h, b, x)  # one-off setup, reused below
        gradient(h, prep, b, x)
        1e6 * (@elapsed for _ in 1:20; gradient(h, prep, b, x); end) / 20
    catch
        NaN
    end
    (n = n, backend = name, microseconds = round(t, sigdigits=3))
end for (name, b) in modes, n in ns])
p = Plots.plot(xscale=:log10, yscale=:log10, xlabel="number of inputs n", ylabel="microseconds per gradient", title="Gradient cost: forward vs reverse mode", legend=:topleft)
foreach(name -> Plots.plot!([r.n for r in rows if r.backend == name], [r.microseconds for r in rows if r.backend == name], m=:circle, lw=2, label=name), first.(modes))
display(p)
rows
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "derivative-summary"
label = "Derivative Summary"
desc = "What the derivatives say at x0: rising or falling, convex or concave; for several variables whether x0 is stationary and the Hessian's sign pattern; for a Jacobian its rank and whether F is locally invertible"
code = '''
using LinearAlgebra
{{?model=deriv}} slope = d1 > 0 ? "increasing" : d1 < 0 ? "decreasing" : "stationary"
{{?model=deriv}} curve = d2 > 0 ? "convex (bending up)" : d2 < 0 ? "concave (bending down)" : "a possible inflection point"
{{?model=deriv}} (value = f(x0), slope = d1, curvature = d2, shape = "f is $slope and $curve at x0")
{{?model=grad}} ev = eigvals(Symmetric(Matrix(H)))
{{?model=grad}} curve = all(>(0), ev) ? "locally strictly convex" : all(<(0), ev) ? "locally strictly concave" : any(>(0), ev) && any(<(0), ev) ? "saddle-shaped" : "degenerate (a zero eigenvalue): second-order test inconclusive"
{{?model=grad}} (value = f(x0), gradient_norm = norm(g), stationary = norm(g) < 1e-8, hessian_eigenvalues = ev, shape = curve, steepest_ascent_direction = g / norm(g))
{{?model=jac|pfpb}} r = rank(J)
{{?model=jac|pfpb}} (outputs = size(J, 1), variables = size(J, 2), rank = r, full_rank = r == minimum(size(J)), determinant = size(J, 1) == size(J, 2) ? det(J) : missing, invertible_near_x0 = size(J, 1) == size(J, 2) && r == size(J, 1), singular_values = svdvals(J))
'''

[[actionGroups.actions]]
id = "taylor-polynomial"
label = "Taylor Polynomial"
desc = "The Taylor expansion of f around x0 up to the chosen order, computed with TaylorSeries; the coefficients times k! are the higher derivatives, and the polynomial is checked against f at x0 plus the plot half-width"
code = '''
import TaylorSeries
{{?model=deriv}} t = TaylorSeries.taylor_expand(f, x0; order={{order}})  # f(x0 + t) as a polynomial in t
{{?model=deriv}} (polynomial = t, derivatives_at_x0 = [TaylorSeries.getcoeff(t, k) * prod(1:k; init=1.0) for k in 0:{{order}}], approximation_at_x0_plus_w = t({{w}}), exact_at_x0_plus_w = f(x0 + {{w}}))
{{?model=grad}} TaylorSeries.variables!("dx"; numvars=length(x0), order={{order}})
{{?model=grad}} t = TaylorSeries.taylor_expand(f, x0)  # f(x0 + dx) as a polynomial in dx1, dx2, ...
{{?model=grad}} (polynomial = t, approximation_at_x0_plus_w = t(fill({{w}}, length(x0))), exact_at_x0_plus_w = f(x0 .+ {{w}}))
{{?model=jac|pfpb}} TaylorSeries.variables!("dx"; numvars=length(x0), order={{order}})
{{?model=jac|pfpb}} t = TaylorSeries.taylor_expand(F, x0)  # one polynomial per output
{{?model=jac|pfpb}} (polynomials = t, approximation_at_x0_plus_w = [ti(fill({{w}}, length(x0))) for ti in t], exact_at_x0_plus_w = F(x0 .+ {{w}}))
'''
