[[actionGroups.actions]]
id = "matrix-free"
label = "Matrix-Free Operator"
desc = "A Krylov method needs only the product of A with a vector. Here the Laplacian is never stored: a function applies the five-point stencil to the grid, and CG solves the system with it as with the sparse matrix, in the same iterations"
models = ["iter"]
code = '''
struct LaplacianOperator  # minus the 2-D Laplacian on the n x n grid, as a product with a vector: no matrix is stored
    n::Int
end
Base.size(P::LaplacianOperator) = (P.n^2, P.n^2)
Base.eltype(::LaplacianOperator) = Float64
function LinearAlgebra.mul!(y::AbstractVector, P::LaplacianOperator, v::AbstractVector)
    k = P.n; h2 = (1 / (k + 1))^2
    V = reshape(v, k, k); Y = reshape(y, k, k)
    for j in 1:k, i in 1:k  # the five-point stencil, zero outside the grid
        s = 4 * V[i, j]
        i > 1 && (s -= V[i - 1, j])
        i < k && (s -= V[i + 1, j])
        j > 1 && (s -= V[i, j - 1])
        j < k && (s -= V[i, j + 1])
        Y[i, j] = s / h2
    end
    return y
end
op = LaplacianOperator(n)
L_sparse = testmatrix("spd", n)
bL = ones(n^2)
x_free, s_free = cg(op, bL; stopping("cg", bL)...)
x_sparse, s_sparse = cg(L_sparse, bL; stopping("cg", bL)...)
(iterations_matrix_free = s_free.niter, iterations_sparse = s_sparse.niter, largest_difference = maximum(abs.(x_free - x_sparse)),
 bytes_operator = Base.summarysize(op), bytes_sparse_matrix = Base.summarysize(L_sparse), seconds_matrix_free = s_free.timer, seconds_sparse = s_sparse.timer)
'''

