label = "Iterative Methods"

[[bullets]]
text = "Linear Systems"
detail = "solves A x = b with the backslash operator, which picks the method from the structure of A, and checks the residual"

[[bullets]]
text = "Factorisations"
detail = "writes A as a product of simple matrices: LU (triangular), QR (orthogonal times triangular) and Cholesky (for symmetric positive definite A)"

[[bullets]]
text = "Eigenvalues"
detail = "the directions A only stretches and by how much: stability, long-run growth and the shape of a quadratic form"

[[bullets]]
text = "Singular Values"
detail = "the rank, the condition number and the best approximation of A by a matrix of lower rank"

[[bullets]]
text = "Least Squares"
detail = "the coefficients that best fit more equations than unknowns, here a polynomial through simulated noisy data"

[[bullets]]
text = "Iterative Methods"
detail = "solves a large sparse system with a Krylov method of Krylov.jl, which needs only the products of A with vectors: CG, MINRES, GMRES, BiCGSTAB, LSQR or LSMR, each suited to a structure of A"

[[decisionRows]]
task = "Linear Systems"
context = "As many equations as unknowns and a matrix that is not singular: equilibrium prices, input-output models, a step inside Newton's method"
purpose = "A \\ b factorises A (Cholesky, LU or another, from its structure) and solves two triangular systems; never form inv(A)"

[[decisionRows]]
task = "Factorisations"
context = "The same matrix with many right-hand sides, a determinant, or a check that a matrix is positive definite"
purpose = "LU with partial pivoting for general square A; QR for any shape, the stable route to least squares; Cholesky, about twice as fast as LU, exists only when A is symmetric positive definite"

[[decisionRows]]
task = "Eigenvalues"
context = "Dynamics of x(t+1) = A x(t), stability of an equilibrium, principal components, the curvature of a quadratic form"
purpose = "eigen runs the QR algorithm (LAPACK); for a symmetric matrix the eigenvalues are real and the eigenvectors orthogonal, and it uses a faster, more accurate routine"

[[decisionRows]]
task = "Singular Values"
context = "Any matrix, of any shape: its numerical rank, how ill-conditioned it is, or a compressed version of it"
purpose = "svd writes A = U S Vt with orthogonal U and V; the singular values give the rank and the condition number, and the leading k terms are the best rank-k approximation (Eckart-Young)"

[[decisionRows]]
task = "Least Squares"
context = "More equations than unknowns, a tall design matrix: regression, curve fitting, calibration"
purpose = "A \\ b on a tall A uses a pivoted QR and minimises the sum of squared residuals; the normal equations square the condition number, the SVD handles a rank-deficient A"

[[decisionRows]]
task = "Iterative Methods"
context = "A matrix too large to factorise, or known only through its products with vectors: discretised differential equations, networks, large sparse regressions"
purpose = "A Krylov method builds the solution from b, A b, A^2 b, ...: CG for symmetric positive definite A, MINRES for symmetric indefinite A, GMRES or BiCGSTAB for nonsymmetric A, LSQR or LSMR for least squares; a preconditioner cuts the iterations"

[[inputs]]
id = "A"
label = "Matrix A"
tooltip = "A matrix as a Julia literal: rows separated by semicolons, entries by spaces, e.g. [4.0 1 2; 1 5 1; 2 1 6]. Write one entry as a decimal (4.0) so the matrix holds floating-point numbers."
default = "[4.0 1 2; 1 5 1; 2 1 6]"
models = ["solve", "fact", "eig", "svd"]

[[inputs]]
id = "b"
label = "Right-Hand Side b"
tooltip = "A vector with one entry per row of A, e.g. [1.0, 2, 3]."
default = "[1.0, 2, 3]"
models = ["solve"]

[[inputs]]
id = "k"
label = "Rank k"
tooltip = "Number of singular values kept in the low-rank approximation of A. At most the smaller dimension of A."
default = "1"
models = ["svd"]

[[inputs]]
id = "n"
label = "Observations"
tooltip = "Number of simulated data points: more equations than unknowns."
default = "50"
models = ["lsq"]

[[inputs]]
id = "degree"
label = "Polynomial Degree"
tooltip = "Degree of the fitted polynomial: the design matrix has degree + 1 columns (1, t, t^2, ...). The data come from a degree 2 curve."
default = "2"
models = ["lsq"]

[[inputs]]
id = "noise"
label = "Noise Standard Deviation"
tooltip = "Standard deviation of the normal noise added to the true curve 1 + 2t - 0.5t^2."
default = "0.5"
models = ["lsq"]
newRow = true

[[inputs]]
id = "seed"
label = "Random Seed"
tooltip = "Random seed for the simulated data: the same seed gives the same data on every run."
default = "1"
models = ["lsq"]

[[inputs]]
id = "matrix"
label = "Test Matrix"
tooltip = "A sparse matrix from an n x n grid on the unit square. Laplacian: the five-point Laplacian, symmetric positive definite. Shifted Laplacian: the Laplacian minus 110 I, symmetric with some negative eigenvalues. Convection-Diffusion: the Laplacian plus convection along x, nonsymmetric. Tall: the Laplacian stacked on the first differences of the grid along x and along y, about three times as many equations as unknowns."
kind = "select"
default = "spd"
models = ["iter"]

[[inputs.options]]
value = "spd"
label = "Laplacian (Symmetric Positive Definite)"

[[inputs.options]]
value = "indefinite"
label = "Shifted Laplacian (Symmetric Indefinite)"

[[inputs.options]]
value = "nonsymmetric"
label = "Convection-Diffusion (Nonsymmetric)"

[[inputs.options]]
value = "tall"
label = "Tall Sparse (Least Squares)"

[[inputs]]
id = "method"
label = "Krylov Method"
tooltip = "Suited to the Matrix: CG for the Laplacian, MINRES for the shifted Laplacian, GMRES for convection-diffusion, LSQR for the tall matrix. Any other choice runs that method as it is, also on a matrix it does not suit, so you can see what happens. CG, MINRES, GMRES and BiCGSTAB need a square matrix."
kind = "select"
default = "auto"
models = ["iter"]

[[inputs.options]]
value = "auto"
label = "Suited to the Matrix"

[[inputs.options]]
value = "cg"
label = "CG"

[[inputs.options]]
value = "minres"
label = "MINRES"

[[inputs.options]]
value = "gmres"
label = "GMRES"

[[inputs.options]]
value = "bicgstab"
label = "BiCGSTAB"

[[inputs.options]]
value = "lsqr"
label = "LSQR"

[[inputs.options]]
value = "lsmr"
label = "LSMR"

[[inputs]]
id = "gridn"
label = "Grid Points per Side"
tooltip = "Points in each direction of the grid: the matrix has this number squared columns, 3600 at 60. The Laplacian's condition number grows with the square of this number, and with it the iterations."
default = "60"
models = ["iter"]
newRow = true

[[inputs]]
id = "tol"
label = "Tolerance"
tooltip = "The method stops when the residual norm falls below this tolerance times the norm of b. LSQR and LSMR also stop when the normal equations hold to this tolerance, as a least-squares residual does not go to zero."
default = "1e-8"
models = ["iter"]

[[codeBranches]]
model = "solve"
code = '''
using LinearAlgebra

A = {{A}}
b = {{b}}
x = A \ b  # factorises A (Cholesky, LU, ...) from its structure, then solves two triangular systems
r = b - A * x  # residual: zero up to rounding when the system is solved
(x = x, residual_norm = norm(r), determinant = det(A), condition_number = cond(A))
'''

[[codeBranches]]
model = "fact"
code = '''
using LinearAlgebra

A = {{A}}
F_lu = lu(A)  # P A = L U, partial pivoting
F_qr = qr(A)  # A = Q R, Householder reflections
F_ch = isposdef(A) ? cholesky(Symmetric(A)) : nothing  # A = transpose(U) U, only for symmetric positive definite A
(L = F_lu.L, U = F_lu.U, row_order = F_lu.p, Q = Matrix(F_qr.Q), R = F_qr.R,
 cholesky_factor = F_ch === nothing ? "A is not symmetric positive definite" : F_ch.U)
'''

[[codeBranches]]
model = "eig"
code = '''
using LinearAlgebra

A = {{A}}
E = eigen(A)  # A V = V Diagonal(values)
values, V = E.values, E.vectors  # complex when A is not symmetric
(eigenvalues = values, eigenvectors = V, symmetric = issymmetric(A),
 trace = tr(A), sum_of_eigenvalues = sum(values), determinant = det(A), product_of_eigenvalues = prod(values))
'''

[[codeBranches]]
model = "svd"
code = '''
using LinearAlgebra

A = {{A}}
S = svd(A)  # A = U Diagonal(S) Vt, singular values in decreasing order
k = {{k}}
Ak = S.U[:, 1:k] * Diagonal(S.S[1:k]) * S.Vt[1:k, :]  # best rank-k approximation (Eckart-Young)
(singular_values = S.S, rank = rank(A), condition_number = S.S[1] / S.S[end],
 rank_k_error = opnorm(A - Ak), next_singular_value = k < length(S.S) ? S.S[k + 1] : 0.0)
'''

[[codeBranches]]
model = "lsq"
code = '''
using LinearAlgebra, Random

rng = Xoshiro({{seed}})  # fixed seed: the same data on every run
n = {{n}}
t = sort(4 .* rand(rng, n))  # inputs on [0, 4]
truth(s) = 1 + 2s - 0.5s^2  # the true curve
b = truth.(t) .+ {{noise}} .* randn(rng, n)
A = [s^j for s in t, j in 0:{{degree}}]  # design matrix: columns 1, t, t^2, ...
x = A \ b  # tall A: least squares through a pivoted QR
r = b - A * x
(coefficients = x, true_coefficients = [1.0, 2.0, -0.5], residual_norm = norm(r),
 r_squared = 1 - sum(abs2, r) / sum(abs2, b .- sum(b) / n))
'''

[[codeBranches]]
model = "iter"
code = '''
using LinearAlgebra, SparseArrays, Random, Krylov

function testmatrix(kind, n)  # a sparse matrix from the n x n grid of the unit square
    h = 1 / (n + 1)
    T = spdiagm(-1 => fill(-1.0, n - 1), 0 => fill(2.0, n), 1 => fill(-1.0, n - 1)) / h^2
    D = spdiagm(-1 => fill(-1.0, n - 1), 1 => fill(1.0, n - 1)) / (2h)  # centred first difference
    G = spdiagm(n + 1, n, 0 => fill(1.0, n), -1 => fill(-1.0, n)) / h  # first differences between neighbours, (n + 1) x n
    Id = sparse(1.0I, n, n)
    L = kron(Id, T) + kron(T, Id)  # minus the 2-D Laplacian, zero on the boundary: symmetric positive definite
    kind == "spd" && return L
    kind == "indefinite" && return L - 110.0I  # shifted past the smallest eigenvalues: symmetric, some eigenvalues negative
    kind == "nonsymmetric" && return L + 50.0 * kron(Id, D)  # convection along x: no longer symmetric
    return [L; kron(Id, G); kron(G, Id)]  # tall: the Laplacian and the differences along x and y, 3n^2 + 2n equations, n^2 unknowns
end
n = {{gridn}}  # grid points per side: n^2 unknowns
tol = {{tol}}
A = testmatrix("{{matrix}}", n)
b = ones(size(A, 1))
solvers = Dict("cg" => cg, "minres" => minres, "gmres" => gmres, "bicgstab" => bicgstab, "lsqr" => lsqr, "lsmr" => lsmr)
suited = Dict("spd" => "cg", "indefinite" => "minres", "nonsymmetric" => "gmres", "tall" => "lsqr")
method = "{{method}}" == "auto" ? suited["{{matrix}}"] : "{{method}}"
# Stop when the residual is below tol times the norm of b; LSQR and LSMR also when the normal equations hold
stopping(m, rhs) = m in ("lsqr", "lsmr") ? (axtol = tol, btol = tol) : (atol = tol * norm(rhs), rtol = 0.0)
x, stats = solvers[method](A, b; stopping(method, b)..., history = true)  # history: the residual at every iteration
r = b - A * x
x_direct = A \ b  # sparse direct solve, for comparison
t_direct = @elapsed A \ b
(method = method, size = size(A), nonzeros = nnz(A), iterations = stats.niter, solved = stats.solved, status = stats.status,
 relative_residual = norm(r) / norm(b), difference_from_direct = norm(x - x_direct) / norm(x_direct), seconds = stats.timer, seconds_direct = t_direct)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "result-plot"
label = "Result Plot"
desc = "The result at a glance: the solution vector, the L and U factors, the eigenvalues in the complex plane, the singular values, the data with the fitted curve, or the residual at every iteration of the Krylov method"
code = '''
using Plots
{{?model=solve}} Plots.bar(1:length(x), x, label="x", xlabel="component", title="Solution of A x = b")
{{?model=fact}} Plots.plot(Plots.heatmap(Matrix(F_lu.L), yflip=true, title="L", c=:balance, clims=(-1, 1) .* maximum(abs, F_lu.L)), Plots.heatmap(F_lu.U, yflip=true, title="U", c=:balance, clims=(-1, 1) .* maximum(abs, F_lu.U)), layout=(1, 2), size=(800, 350))
{{?model=eig}} Plots.scatter(real.(values), imag.(values), ms=7, label="eigenvalues", xlabel="real part", ylabel="imaginary part", aspect_ratio=:equal)
{{?model=eig}} Plots.plot!(cos.(range(0, 2pi, length=200)), sin.(range(0, 2pi, length=200)), c=:gray, ls=:dot, label="unit circle")
{{?model=svd}} Plots.bar(1:length(S.S), S.S, label="singular values", xlabel="index", c=[i <= k ? :steelblue : :lightgray for i in 1:length(S.S)])
{{?model=lsq}} ts = range(0, 4, length=200)
{{?model=lsq}} Plots.scatter(t, b, ms=3, label="data", xlabel="t", ylabel="y")
{{?model=lsq}} Plots.plot!(ts, [sum(x[j + 1] * s^j for j in 0:{{degree}}) for s in ts], lw=2, label="fitted, degree {{degree}}")
{{?model=lsq}} Plots.plot!(ts, truth.(ts), lw=1.5, ls=:dash, c=:black, label="true curve")
{{?model=iter}} Plots.plot(0:length(stats.residuals) - 1, stats.residuals ./ norm(b), yscale=:log10, lw=2, label="residual / norm(b)", xlabel="iteration", title="$(uppercase(method)) on a $(size(A, 1)) x $(size(A, 2)) matrix")
{{?model=iter}} method in ("lsqr", "lsmr") && Plots.plot!(0:length(stats.Aresiduals) - 1, stats.Aresiduals ./ norm(transpose(A) * b), lw=2, label="normal-equations residual / norm(transpose(A) b)")
{{?model=iter}} Plots.hline!([tol], c=:gray, ls=:dot, label="tolerance")
'''

[[actionGroups.actions]]
id = "heatmap"
label = "Matrix Heatmap"
desc = "Each entry of the matrix as a colour, rows from top to bottom: structure such as symmetry, a dominant diagonal or near-equal columns shows at once. For the large sparse matrix of Iterative Methods, where its nonzero entries are"
code = '''
using Plots
