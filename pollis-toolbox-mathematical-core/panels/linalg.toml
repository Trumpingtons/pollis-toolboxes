# Linear Algebra Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/linalg.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Linear Algebra"
viewType = "pollis.linalg"
defaultModel = "solve"

[[packages]]
name = "LinearAlgebra.jl"
github = "https://github.com/JuliaLang/LinearAlgebra.jl"

[[packages]]
name = "Krylov.jl"
github = "https://github.com/JuliaSmoothOptimizers/Krylov.jl"

[[packages]]
name = "AlgebraicMultigrid.jl"
github = "https://github.com/JuliaLinearAlgebra/AlgebraicMultigrid.jl"

[[packages]]
name = "MLDataDevices.jl"
github = "https://github.com/LuxDL/MLDataDevices.jl"

[requires]
packages = ["LinearAlgebra.jl", "Plots.jl", "Krylov.jl", "AlgebraicMultigrid.jl", "MLDataDevices.jl"]

[[notebookSections]]
label = ""

[[notebookSections.notebooks]]
name = "Solving Linear Systems"
file = "linalg/tutorial-01-linear-systems.ipynb"
bundled = true
description = "Solve A x = b with the backslash operator, check the residual and see when a system has no unique solution"

[[notebookSections.notebooks]]
name = "Matrix Factorisations"
file = "linalg/tutorial-02-factorisations.ipynb"
bundled = true
description = "LU, QR and Cholesky: what each one writes A as, and why a factorisation is computed once and reused"

[[notebookSections.notebooks]]
name = "Eigenvalues and Eigenvectors"
file = "linalg/tutorial-03-eigenvalues.ipynb"
bundled = true
description = "The directions a matrix only stretches, the long-run behaviour of a linear recursion and the power method"

[[notebookSections.notebooks]]
name = "The Singular Value Decomposition"
file = "linalg/tutorial-04-svd.ipynb"
bundled = true
description = "Singular values, rank, the condition number and the best low-rank approximation of a matrix"

[[notebookSections.notebooks]]
name = "Least Squares"
file = "linalg/tutorial-05-least-squares.ipynb"
bundled = true
description = "Fit a polynomial to noisy data by QR, by the normal equations and by the SVD, and see why QR is the default"

[[notebookSections.notebooks]]
name = "Iterative Methods"
file = "linalg/tutorial-06-iterative-methods.ipynb"
bundled = true
description = "Solve a large sparse system with the Krylov methods of Krylov.jl: CG, MINRES, GMRES and LSQR, the residual at every iteration, a preconditioner, and how the iterations grow with the grid"

