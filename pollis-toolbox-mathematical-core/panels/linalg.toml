id = "partitioned"
label = "Partitioned Systems (GPMR)"
desc = "The nonsymmetric 2 x 2 block system [I A; B I] [x; y] = [b; c], here with A scaled to a largest entry of 1 and B = -transpose(A). GPMR works on the blocks A and B; GMRES sees one large matrix. Iterations, and the distance of each solution to the direct one"
models = ["iter"]
code = '''
m, p = size(A)
As = A / maximum(abs, A)  # scaled to a largest entry of 1, so that the identity blocks weigh against it
B = -sparse(transpose(As))  # p x m, the shape of transpose(A)
c = ones(p)
K = [sparse(1.0I, m, m) As; B sparse(1.0I, p, p)]
z_dir = K \ [b; c]
x1, y1, s1 = gpmr(As, B, b, c; atol = 0.0, rtol = tol)  # the diagonal blocks are I by default
z2, s2 = gmres(K, [b; c]; atol = 0.0, rtol = tol)
[(method = name, iterations = s.niter, solved = s.solved, distance_to_direct = norm(z - z_dir) / norm(z_dir), seconds = s.timer)
 for (name, z, s) in (("GPMR", [x1; y1], s1), ("GMRES on the whole matrix", z2, s2))]
