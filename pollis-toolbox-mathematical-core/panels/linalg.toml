desc = "Four right-hand sides, b and three random ones, solved together by block-GMRES, against GMRES on each in turn: each block iteration multiplies A by four vectors at once. Iterations, time and the largest residual. Block-GMRES needs a square A"
models = ["iter"]
code = '''
if size(A, 1) != size(A, 2)
    (note = "Block-GMRES needs a square matrix: choose the Laplacian, the shifted Laplacian or convection-diffusion",)
else
    Bs = hcat(b, randn(Xoshiro(5), size(A, 1), 3))
    X, sb = block_gmres(A, Bs; atol = 0.0, rtol = tol)
    single = [gmres(A, Bs[:, j]; atol = 0.0, rtol = tol) for j in 1:4]
    (block_iterations = sb.niter, block_seconds = sb.timer, separate_iterations = [s.niter for (_, s) in single], separate_seconds = sum(s.timer for (_, s) in single),
     largest_relative_residual = maximum(norm(Bs[:, j] - A * X[:, j]) / norm(Bs[:, j]) for j in 1:4))
end
'''

[[actionGroups.actions]]
id = "gpu"
label = "On the GPU"
desc = "The same method on the GPU, with MLDataDevices.jl: load CUDA.jl, AMDGPU.jl, Metal.jl or oneAPI.jl first, or it runs on the CPU. The matrix is dense and single precision, as every backend multiplies such matrices, on at most 40 points per side. Iterations, time and the difference from the same solve on the CPU"
models = ["iter"]
code = '''
using MLDataDevices
dev = gpu_device()  # the GPU of the backend loaded, or the CPU when there is none
A32 = Matrix{Float32}(testmatrix("{{matrix}}", min(n, 40)))
b32 = ones(Float32, size(A32, 1))
stop32 = method in ("lsqr", "lsmr") ? (axtol = 1f-4, btol = 1f-4) : (atol = 0f0, rtol = 1f-4)  # single precision holds about 7 digits: a tolerance it can reach
x_dev, s_dev = solvers[method](dev(A32), dev(b32); stop32...)
x_cpu, s_cpu = solvers[method](A32, b32; stop32...)
(device = string(dev), unknowns = size(A32, 2), iterations_device = s_dev.niter, iterations_cpu = s_cpu.niter,
 seconds_device = s_dev.timer, seconds_cpu = s_cpu.timer, largest_difference = maximum(abs.(Array(x_dev) .- x_cpu)))
'''
