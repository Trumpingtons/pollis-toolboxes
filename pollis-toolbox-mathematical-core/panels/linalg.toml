[[actionGroups.actions]]
id = "saddle-point"
label = "Saddle-Point Systems (TriCG and TriMR)"
desc = "The symmetric quasi-definite system [I A; transpose(A) -I] [r; x] = [b; 0], with A scaled to a largest entry of 1, whose x solves the regularised least-squares problem (transpose(A) A + I) x = transpose(A) b. TriCG and TriMR work on the two blocks; MINRES sees one large symmetric indefinite matrix. Iterations, and the distance of each x to the direct solution"
models = ["iter"]
code = '''
m, p = size(A)
As = A / maximum(abs, A)  # scaled to a largest entry of 1, so that the identity blocks weigh against it
K = [sparse(1.0I, m, m) As; transpose(As) -sparse(1.0I, p, p)]  # the whole matrix, for MINRES and the direct solve
x_reg = (transpose(As) * As + I) \ (transpose(As) * b)  # the regularised least-squares solution, directly
r1, x1, s1 = tricg(As, b, zeros(p); atol = 0.0, rtol = tol)  # by default the blocks are I and -I
r2, x2, s2 = trimr(As, b, zeros(p); atol = 0.0, rtol = tol)
z3, s3 = minres(K, [b; zeros(p)]; atol = 0.0, rtol = tol)
[(method = name, iterations = s.niter, solved = s.solved, distance_to_direct = norm(xs - x_reg) / norm(x_reg), seconds = s.timer)
 for (name, xs, s) in (("TriCG", x1, s1), ("TriMR", x2, s2), ("MINRES on the whole matrix", z3[m+1:end], s3))]
'''

