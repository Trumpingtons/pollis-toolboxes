id = "moment-equations"
label = "Moment Equations"
desc = "For du = A u dt + noise, the mean solves m' = A m and the covariance P' = A P + P A^T + Q. Solves both as ordinary differential equations and compares them with 2000 paths"
models = ["system"]
code = '''
using OrdinaryDiffEq, Statistics, Plots
mom(v, p, t) = (P = reshape(v[n+1:end], n, n); [A * v[1:n]; vec(A * P + P * transpose(A) + Q)])  # mean, then the covariance by columns
mo = solve(ODEProblem(mom, [u0; zeros(n * n)], tspan), Tsit5(); reltol=1e-8, abstol=1e-10)
ts = range(tspan[1], tspan[2], length=51)
ens = paths(2000; saveat=ts)
U = [s.u[k][1] for s in ens.u, k in eachindex(ts)]
p = Plots.plot(ts, [mo(t)[1] for t in ts], lw=2, label="mean of u[1], moment equations", xlabel="t", title="Moment equations and 2000 paths")
Plots.plot!(p, ts, vec(mean(U; dims=1)), ls=:dash, label="mean of u[1], paths")
Plots.plot!(p, ts, [mo(t)[n + 1] for t in ts], lw=2, label="variance of u[1], moment equations")
Plots.plot!(p, ts, vec(var(U; dims=1)), ls=:dash, label="variance of u[1], paths")
display(p)
UT = reduce(hcat, [s.u[end] for s in ens.u])
(mean_at_end = mo.u[end][1:n], paths_mean_at_end = vec(mean(UT; dims=2)), covariance_at_end = reshape(mo.u[end][n+1:end], n, n), paths_covariance_at_end = cov(transpose(UT)))
'''

