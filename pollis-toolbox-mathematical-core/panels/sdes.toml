expected = Dict("em" => (0.5, 1.0), "lambaem" => (0.5, 1.0), "rkmil" => (1.0, 1.0), "sriw1" => (1.5, 2.0), "sosri" => (1.5, 2.0))[alg]
(steps = dts, strong_errors = strong.errors[:final], strong_order = slope(strong.errors[:final]), weak_errors = weak.errors[:weak_final], weak_order = slope(weak.errors[:weak_final]), expected_strong_and_weak = expected, note = "with noise that does not depend on X, EM and LambaEM reach strong order 1")
