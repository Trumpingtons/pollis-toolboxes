# Stochastic Differential Equations Webview Configuration
# This is the declarative source for the webview, read by the Core Mathematics Toolbox.

[meta]
title = "Stochastic Differential Equations"
viewType = "pollis.sdes"
defaultModel = "ito"

[[packages]]
name = "StochasticDiffEq.jl"
github = "https://github.com/SciML/StochasticDiffEq.jl"

[[packages]]
name = "DiffEqNoiseProcess.jl"
github = "https://github.com/SciML/DiffEqNoiseProcess.jl"

[[packages]]
