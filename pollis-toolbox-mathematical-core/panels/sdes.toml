[[models]]
id = "ito"
label = "Itô Calculus"

[[models]]
id = "strat"
label = "Stratonovich"

[[models]]
id = "exact"
label = "Exact Solutions"

[[models]]
id = "system"
label = "Systems of SDEs"

[[models]]
id = "stiff"
label = "Stiff SDEs"

[[bullets]]
text = "Itô Calculus"
detail = "Itô's lemma for F(X) when dX = f(X) dt + g(X) dW, found symbolically and checked on one Brownian path against the ordinary chain rule"

[[bullets]]
text = "Stratonovich"
detail = "dX = f(X) dt + g(X) ∘ dW, solved with EulerHeun and compared on the same path with its Itô form, whose drift is f + g g'/2"

[[bullets]]
text = "Exact Solutions"
detail = "Four equations with closed-form solutions, so every solve reports its error and the strong and weak orders can be measured"

[[bullets]]
text = "Systems of SDEs"
detail = "du = A u dt + noise for a vector u: diagonal, general or correlated noise, which decides the solvers that apply"

[[bullets]]
text = "Stiff SDEs"
detail = "A fast pull towards a moving target, where explicit Euler-Maruyama blows up at a step that implicit solvers take in their stride"

[[decisionRows]]
task = "Itô Calculus"
context = "A quantity defined as a function of a diffusion: log-prices, energies, transformed states"
purpose = "The SDE that F(X) follows, and how far the ordinary chain rule goes wrong"

[[decisionRows]]
task = "Stratonovich"
context = "Noise that is smooth on a short time scale and idealised as white, as in physics and engineering"
purpose = "The Stratonovich solution and its Itô equivalent on one Brownian path"

[[decisionRows]]
task = "Exact Solutions"
context = "Testing a solver, a step size or a tolerance before trusting it on an equation without a closed form"
purpose = "Errors against the exact solution, convergence orders and work against precision"

[[decisionRows]]
task = "Systems of SDEs"
context = "Several states driven by several Brownian motions, which may be mixed or correlated"
purpose = "Paths of the system, and the mean and covariance from the moment equations"

[[decisionRows]]
task = "Stiff SDEs"
context = "Fast relaxation next to slow change: strong mean reversion, chemical kinetics, fast-slow systems"
purpose = "Which steps explicit solvers survive, and what implicit solvers buy"

[[inputs]]
id = "f"
label = "Drift f(X)"
tooltip = "The drift of X as a Julia expression in X, e.g. 0.1 * X (growth), 1 - X (mean reversion to 1)."
default = "0.1 * X"
models = ["ito"]

[[inputs]]
id = "g"
label = "Diffusion g(X)"
tooltip = "The diffusion of X as a Julia expression in X, e.g. 0.4 * X (proportional noise), 0.3 (constant noise), 0.2 * sqrt(X)."
default = "0.4 * X"
models = ["ito"]

[[inputs]]
id = "F"
label = "Function F(X)"
tooltip = "The function of X whose SDE Itô's lemma gives, e.g. log(X), X^2, exp(X)."
default = "log(X)"
models = ["ito"]

[[inputs]]
id = "fs"
label = "Drift f(X)"
tooltip = "The drift of the Stratonovich equation as a Julia expression in X."
default = "0.1 * X"
models = ["strat"]

[[inputs]]
id = "gs"
label = "Diffusion g(X)"
tooltip = "The diffusion of the Stratonovich equation as a Julia expression in X. With a g that does not depend on X, the two calculi give the same equation."
default = "0.4 * X"
models = ["strat"]

[[inputs]]
id = "eq"
label = "Equation"
tooltip = "Geometric Brownian motion: dX = a X dt + b X dW. Additive: dX = (b / sqrt(1 + t) - X / (2(1 + t))) dt + a b / sqrt(1 + t) dW. Wave: dX = -sin(X) cos(X)^3 / 100 dt + cos(X)^2 / 10 dW. Cubic: dX = X^(1/3) / 3 dt + X^(2/3) dW. Each has a solution written in t and W(t) (Kloeden and Platen 1992, section 4.4)."
kind = "select"
default = "gbm"
models = ["exact"]

[[inputs.options]]
value = "gbm"
label = "Geometric Brownian Motion"

[[inputs.options]]
value = "additive"
label = "Additive Noise"

[[inputs.options]]
value = "wave"
label = "Wave"

[[inputs.options]]
value = "cubic"
label = "Cubic"

[[inputs]]
id = "a"
label = "Parameter a"
tooltip = "Geometric Brownian motion: the growth rate a. Additive: the factor a of the noise. The Wave and Cubic equations have no parameters."
default = "1.5"
models = ["exact"]

[[inputs]]
id = "b"
label = "Parameter b"
tooltip = "Geometric Brownian motion: the volatility b. Additive: the scale b of the drift and the noise."
default = "0.5"
models = ["exact"]

[[inputs]]
id = "A"
label = "Drift Matrix A"
tooltip = "The drift of du = A u dt + noise, one row per state, e.g. [-1.0 0.5; 0.0 -2.0]."
default = "[-1.0 0.5; 0.0 -2.0]"
models = ["system"]

[[inputs]]
id = "S"
label = "Noise Matrix S"
tooltip = "Diagonal noise uses the diagonal of S, one independent Brownian motion per state. General noise uses all of S: column j is the effect of Brownian motion j on each state. Correlated noise uses the diagonal of S with correlated Brownian motions."
default = "[0.3 0.1; 0.0 0.2]"
models = ["system"]

[[inputs]]
id = "noise"
label = "Noise Structure"
tooltip = "Diagonal: each state has its own Brownian motion. General: a matrix S mixes the Brownian motions (non-diagonal noise). Correlated: each state has its own Brownian motion, correlated with the others at Correlation rho."
kind = "select"
default = "general"
models = ["system"]

[[inputs.options]]
value = "diagonal"
label = "Diagonal"

[[inputs.options]]
value = "general"
label = "General (Non-Diagonal)"

[[inputs.options]]
value = "correlated"
label = "Correlated"

[[inputs]]
id = "rho"
label = "Correlation rho"
tooltip = "The correlation between every pair of Brownian motions when Noise Structure is Correlated."
default = "0.5"
models = ["system"]

[[inputs]]
id = "uv0"
label = "Initial State u(t0)"
tooltip = "One starting value per state, e.g. [1.0, 1.0]."
default = "[1.0, 1.0]"
models = ["system"]

[[inputs]]
id = "lam"
label = "Rate lambda"
tooltip = "How fast X is pulled towards sin(t): dX = -lambda (X - sin(t)) dt + sigma dW. Explicit Euler-Maruyama needs a step below 2 / lambda."
default = "50.0"
models = ["stiff"]

[[inputs]]
id = "sig"
label = "Noise sigma"
tooltip = "The constant size of the noise."
default = "1.0"
models = ["stiff"]

[[inputs]]
id = "X0"
label = "Initial Value X0"
tooltip = "The value of X at the start of the time span."
default = "1.0"
models = ["ito", "strat", "exact", "stiff"]

[[inputs]]
id = "tspan"
label = "Time Span"
tooltip = "Start and end times as a tuple, e.g. (0.0, 5.0)."
default = "(0.0, 5.0)"
newRow = true

[[inputs]]
id = "alg"
label = "Solver"
tooltip = "EM: Euler-Maruyama, strong order 1/2 (1 with additive noise), weak order 1. LambaEM: EM with an adaptive step. RKMil: Milstein, strong order 1 for scalar noise. SRIW1 and SOSRI: stochastic Runge-Kutta, strong order 3/2 and weak order 2, for diagonal noise. Only EM and LambaEM take the non-diagonal noise of Itô Calculus and of General noise."
kind = "select"
default = "em"
models = ["ito", "exact", "system"]

[[inputs.options]]
value = "em"
label = "EM (Euler-Maruyama)"

[[inputs.options]]
value = "lambaem"
label = "LambaEM (Adaptive)"

[[inputs.options]]
value = "rkmil"
label = "RKMil (Milstein)"
models = ["exact"]

[[inputs.options]]
value = "sriw1"
label = "SRIW1 (Strong 3/2)"
models = ["exact"]

[[inputs.options]]
value = "sriw1"
label = "SRIW1 (Strong 3/2)"
models = ["system"]
when = "noise!=general"

[[inputs.options]]
value = "sosri"
label = "SOSRI (Stability-Optimised)"
models = ["exact"]

[[inputs]]
id = "algStrat"
label = "Solver"
tooltip = "Solvers that read the Stratonovich integral. EulerHeun: fixed step, strong order 1 for scalar noise. LambaEulerHeun: EulerHeun with an adaptive step. RKMil: Milstein in its Stratonovich form."
kind = "select"
default = "eulerheun"
models = ["strat"]

[[inputs.options]]
value = "eulerheun"
label = "EulerHeun"

[[inputs.options]]
value = "lambaeulerheun"
label = "LambaEulerHeun (Adaptive)"

[[inputs.options]]
value = "rkmil"
label = "RKMil (Stratonovich)"

[[inputs]]
id = "algStiff"
label = "Solver"
tooltip = "SKenCarp: implicit-explicit and adaptive, for additive noise. ImplicitEM: the drift-implicit Euler-Maruyama. SOSRA: explicit, with a stability region stretched for stiff additive noise. EM: explicit Euler-Maruyama, unstable once the step exceeds 2 / lambda."
kind = "select"
default = "skencarp"
models = ["stiff"]

[[inputs.options]]
value = "skencarp"
label = "SKenCarp (Implicit, Adaptive)"

[[inputs.options]]
value = "implicitem"
label = "ImplicitEM (Implicit)"

[[inputs.options]]
value = "sosra"
label = "SOSRA (Explicit, Stabilised)"

[[inputs.options]]
value = "em"
label = "EM (Explicit)"

[[inputs]]
id = "dt"
label = "Step dt"
tooltip = "The step of fixed-step solvers and the first step of adaptive ones."
default = "0.01"

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "The seed of the Brownian path, so that a run can be repeated."
default = "1"

[[codeBranches]]
model = "ito"
code = '''
using StochasticDiffEq, Symbolics, Random

@variables X
drift_X = {{f}}  # f(X), the drift of X
noise_X = {{g}}  # g(X), the diffusion of X
F_X = {{F}}  # the function of X whose SDE Ito's lemma gives
DX = Differential(X)
F1 = expand_derivatives(DX(F_X)); F2 = expand_derivatives(DX(F1))
drift_F = simplify(F1 * drift_X + F2 * noise_X^2 / 2)  # Ito's lemma: dF = (F' f + F'' g^2 / 2) dt + F' g dW
noise_F = simplify(F1 * noise_X)
chain_F = simplify(F1 * drift_X)  # the ordinary chain rule leaves out F'' g^2 / 2
fun(e) = build_function(e, X; expression=Val(false))
fX, gX, FX, fF, gF, cF = fun.((drift_X, noise_X, F_X, drift_F, noise_F, chain_F))
drift(x, t) = fX(x); noise(x, t) = gX(x)  # the scalar equation, for the Next Steps

# One Brownian motion drives X, Y by Ito's lemma and Z by the chain rule: u = [X, Y, Z], noise matrix 3 x 1
f3!(du, u, p, t) = (du[1] = fX(u[1]); du[2] = fF(u[1]); du[3] = cF(u[1]); nothing)
g3!(du, u, p, t) = (du[1, 1] = gX(u[1]); du[2, 1] = gF(u[1]); du[3, 1] = gF(u[1]); nothing)
X0 = float({{X0}})
tspan = float.({{tspan}})
prob = SDEProblem(f3!, g3!, [X0, FX(X0), FX(X0)], tspan; noise_rate_prototype=zeros(3, 1))
labels = ["X", "Y, by Ito's lemma", "Z, by the chain rule"]
algs = Dict("em" => EM(), "lambaem" => LambaEM())  # solvers for non-diagonal noise
fresh(p, s) = remake(p; seed=UInt64(s))  # the problem with the Brownian path of seed s
solve_with(name; problem=prob, dt={{dt}}, seed={{seed}}, kw...) = solve(fresh(problem, seed), algs[name]; dt, kw...)
paths(N; name=alg, kw...) = solve(EnsembleProblem(prob; prob_func=(p, ctx) -> fresh(p, ctx.sim_id)), algs[name], EnsembleThreads(); trajectories=N, dt={{dt}}, kw...)
alg = "{{alg}}"
sol = solve_with(alg)
XT, YT, ZT = sol.u[end]
(ito_drift_of_F = drift_F, ito_diffusion_of_F = noise_F, chain_rule_drift = chain_F, F_of_X_at_end = FX(XT), Y_at_end = YT, Z_at_end = ZT, gap_Y = YT - FX(XT), gap_Z = ZT - FX(XT))
'''

[[codeBranches]]
model = "strat"
code = '''
using StochasticDiffEq, Symbolics, Random

@variables X
drift_X = {{fs}}  # f(X), the drift of the Stratonovich equation
noise_X = {{gs}}  # g(X), its diffusion
ito_drift = simplify(drift_X + expand_derivatives(Differential(X)(noise_X)) * noise_X / 2)  # the Ito equation with the same solution has drift f + g g' / 2
fun(e) = build_function(e, X; expression=Val(false))
fX, gX, fI = fun.((drift_X, noise_X, ito_drift))
drift(x, t) = fX(x); noise(x, t) = gX(x)  # the scalar equation, for the Next Steps

X0 = float({{X0}})
tspan = float.({{tspan}})
prob = SDEProblem((u, p, t) -> fX(u), (u, p, t) -> gX(u), X0, tspan)
labels = ["X"]
algs = Dict("eulerheun" => EulerHeun(), "lambaeulerheun" => LambaEulerHeun(), "rkmil" => RKMil(interpretation=SciMLBase.AlgorithmInterpretation.Stratonovich))
fresh(p, s) = remake(p; seed=UInt64(s))  # the problem with the Brownian path of seed s
solve_with(name; problem=prob, dt={{dt}}, seed={{seed}}, kw...) = solve(fresh(problem, seed), algs[name]; dt, kw...)
paths(N; name=alg, kw...) = solve(EnsembleProblem(prob; prob_func=(p, ctx) -> fresh(p, ctx.sim_id)), algs[name], EnsembleThreads(); trajectories=N, dt={{dt}}, kw...)
alg = "{{algStrat}}"
sol = solve_with(alg; save_noise=true)  # keeps the Brownian path
ito_form = solve(SDEProblem((u, p, t) -> fI(u), (u, p, t) -> gX(u), X0, tspan; noise=NoiseWrapper(sol.W)), EM(); dt={{dt}})  # the Ito form on the same path
(ito_drift_equivalent = ito_drift, stratonovich_at_end = sol.u[end], ito_form_at_end = ito_form.u[end], gap = ito_form.u[end] - sol.u[end])
'''

[[codeBranches]]
model = "exact"
code = '''
using StochasticDiffEq, Random

a, b = float({{a}}), float({{b}})
{{?eq=gbm}} fexact(u, p, t) = a * u
{{?eq=gbm}} gexact(u, p, t) = b * u
{{?eq=gbm}} exact(u0, p, t, W) = u0 * exp((a - b^2 / 2) * t + b * W)  # geometric Brownian motion
{{?eq=additive}} fexact(u, p, t) = b / sqrt(1 + t) - u / (2 * (1 + t))
{{?eq=additive}} gexact(u, p, t) = a * b / sqrt(1 + t)
{{?eq=additive}} exact(u0, p, t, W) = u0 / sqrt(1 + t) + b * (t + a * W) / sqrt(1 + t)
{{?eq=wave}} fexact(u, p, t) = -sin(u) * cos(u)^3 / 100
{{?eq=wave}} gexact(u, p, t) = cos(u)^2 / 10
{{?eq=wave}} exact(u0, p, t, W) = atan(W / 10 + tan(u0))
{{?eq=cubic}} fexact(u, p, t) = cbrt(u) / 3
{{?eq=cubic}} gexact(u, p, t) = cbrt(u)^2
{{?eq=cubic}} exact(u0, p, t, W) = (cbrt(u0) + W / 3)^3
drift(x, t) = fexact(x, nothing, t); noise(x, t) = gexact(x, nothing, t)  # the scalar equation, for the Next Steps

X0 = float({{X0}})
tspan = float.({{tspan}})
prob = SDEProblem(SDEFunction(fexact, gexact; analytic=exact), X0, tspan)  # every solve also computes the exact solution on its own path
labels = ["X"]
algs = Dict("em" => EM(), "lambaem" => LambaEM(), "rkmil" => RKMil(), "sriw1" => SRIW1(), "sosri" => SOSRI())
fresh(p, s) = remake(p; seed=UInt64(s))  # the problem with the Brownian path of seed s
solve_with(name; problem=prob, dt={{dt}}, seed={{seed}}, kw...) = solve(fresh(problem, seed), algs[name]; dt, kw...)
paths(N; name=alg, kw...) = solve(EnsembleProblem(prob; prob_func=(p, ctx) -> fresh(p, ctx.sim_id)), algs[name], EnsembleThreads(); trajectories=N, dt={{dt}}, kw...)
alg = "{{alg}}"
sol = solve_with(alg)
(value_at_end = sol.u[end], exact_value_at_end = sol.u_analytic[end], error_at_end = sol.errors[:final], largest_error = maximum(abs.(sol.u .- sol.u_analytic)), steps = length(sol.t) - 1, solver = alg)
'''

[[codeBranches]]
model = "system"
code = '''
using StochasticDiffEq, LinearAlgebra, Random

A = float.({{A}})  # du = A u dt + noise
S = float.({{S}})
u0 = float.({{uv0}}); n = length(u0)
tspan = float.({{tspan}})
drift_sys!(du, u, p, t) = mul!(du, A, u)
{{?noise=diagonal}} B = Diagonal(diag(S)); Gam = Matrix(1.0I, n, n)  # one independent Brownian motion per state, of size S[i, i]
{{?noise=diagonal}} noise_sys!(du, u, p, t) = (du .= diag(S))
{{?noise=diagonal}} fresh(p, s) = remake(p; seed=UInt64(s))  # the problem with the Brownian path of seed s
{{?noise=diagonal}} prob = SDEProblem(drift_sys!, noise_sys!, u0, tspan)
{{?noise=general}} B = S; Gam = Matrix(1.0I, size(S, 2), size(S, 2))  # size(S, 2) independent Brownian motions, mixed by S
{{?noise=general}} noise_sys!(du, u, p, t) = (du .= S)
{{?noise=general}} fresh(p, s) = remake(p; seed=UInt64(s))  # the problem with the Brownian path of seed s
{{?noise=general}} prob = SDEProblem(drift_sys!, noise_sys!, u0, tspan; noise_rate_prototype=zeros(n, size(S, 2)))
{{?noise=correlated}} B = Diagonal(diag(S)); Gam = [i == j ? 1.0 : float({{rho}}) for i in 1:n, j in 1:n]  # Brownian motions with correlation rho
{{?noise=correlated}} noise_sys!(du, u, p, t) = (du .= diag(S))
{{?noise=correlated}} fresh(p, s) = remake(p; noise=CorrelatedWienerProcess(Gam, p.tspan[1], zeros(n); rng=Xoshiro(s)))  # a new correlated path for seed s
{{?noise=correlated}} prob = fresh(SDEProblem(drift_sys!, noise_sys!, u0, tspan), {{seed}})
Q = B * Gam * transpose(B)  # covariance rate of the noise: Cov(noise over dt) = Q dt
labels = ["u[$i]" for i in 1:n]
algs = Dict("em" => EM(), "lambaem" => LambaEM(), "sriw1" => SRIW1())  # SRIW1 takes diagonal and correlated noise only
solve_with(name; problem=prob, dt={{dt}}, seed={{seed}}, kw...) = solve(fresh(problem, seed), algs[name]; dt, kw...)
paths(N; name=alg, kw...) = solve(EnsembleProblem(prob; prob_func=(p, ctx) -> fresh(p, ctx.sim_id)), algs[name], EnsembleThreads(); trajectories=N, dt={{dt}}, kw...)
alg = "{{alg}}"
sol = solve_with(alg)
(state_at_end = sol.u[end], steps = length(sol.t) - 1, noise_structure = "{{noise}}", noise_covariance_rate = Q, retcode = sol.retcode)
'''

[[codeBranches]]
model = "stiff"
code = '''
using StochasticDiffEq, Random

lam, sig = float({{lam}}), float({{sig}})
drift(x, t) = -lam * (x - sin(t))  # a fast pull towards sin(t)
noise(x, t) = sig
X0 = float({{X0}})
tspan = float.({{tspan}})
prob = SDEProblem((u, p, t) -> drift(u, t), (u, p, t) -> noise(u, t), X0, tspan)
labels = ["X"]
algs = Dict("skencarp" => SKenCarp(), "implicitem" => ImplicitEM(), "sosra" => SOSRA(), "em" => EM())
fresh(p, s) = remake(p; seed=UInt64(s))  # the problem with the Brownian path of seed s
solve_with(name; problem=prob, dt={{dt}}, seed={{seed}}, kw...) = solve(fresh(problem, seed), algs[name]; dt, kw...)
paths(N; name=alg, kw...) = solve(EnsembleProblem(prob; prob_func=(p, ctx) -> fresh(p, ctx.sim_id)), algs[name], EnsembleThreads(); trajectories=N, dt={{dt}}, kw...)
alg = "{{algStiff}}"
sol = solve_with(alg)
(value_at_end = sol.u[end], steps = length(sol.t) - 1, retcode = sol.retcode, explicit_step_limit = 2 / lam, step = {{dt}}, solver = alg)
'''

