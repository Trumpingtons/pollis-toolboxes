[[actionGroups.actions]]
id = "ito-vs-strat"
label = "Itô vs Stratonovich"
desc = "Solves the same f and g on one Brownian path as an Itô equation (EM), as a Stratonovich equation (EulerHeun), and as an Itô equation with drift f + g g'/2, which should follow the Stratonovich path"
models = ["ito", "strat", "exact", "stiff"]
code = '''
using StochasticDiffEq, Plots
h = 1e-6
dnoise(x, t) = (noise(x + h, t) - noise(x - h, t)) / (2h)  # dg/dX by a central difference
pI = SDEProblem((u, p, t) -> drift(u, t), (u, p, t) -> noise(u, t), X0, tspan; seed=UInt64({{seed}}))
ito_path = solve(pI, EM(); dt={{dt}}, save_noise=true)  # f and g read as Ito; keeps the Brownian path
strat_path = solve(remake(pI; noise=NoiseWrapper(ito_path.W)), EulerHeun(); dt={{dt}})  # the same f and g read as Stratonovich
corrected = solve(remake(pI; f=(u, p, t) -> drift(u, t) + noise(u, t) * dnoise(u, t) / 2, noise=NoiseWrapper(ito_path.W)), EM(); dt={{dt}})  # Ito with drift f + g g' / 2
p = Plots.plot(ito_path, lw=1.5, label="Ito", xlabel="t", ylabel="X", title="One Brownian path, two calculi")
Plots.plot!(p, strat_path, lw=1.5, label="Stratonovich")
Plots.plot!(p, corrected, lw=1, ls=:dash, c=:black, label="Ito with drift f + g g'/2")
display(p)
(ito_at_end = ito_path.u[end], stratonovich_at_end = strat_path.u[end], corrected_ito_at_end = corrected.u[end], ito_minus_stratonovich = ito_path.u[end] - strat_path.u[end], corrected_minus_stratonovich = corrected.u[end] - strat_path.u[end])
'''

[[actionGroups.actions]]
id = "compare-solvers"
label = "Compare Solvers"
desc = "Every solver of the tab on one Brownian path: error at the end against a reference run at a step 1000 times smaller, steps and time (timed on a second run, after compilation)"
code = '''
using StochasticDiffEq, LinearAlgebra
{{?model=strat}} ref = solve(fresh(prob, {{seed}}), EulerHeun(); dt={{dt}} / 1000, save_noise=true)  # reference; keeps the Brownian path
{{?model!=strat}} ref = solve(fresh(prob, {{seed}}), EM(); dt={{dt}} / 1000, save_noise=true)  # reference; keeps the Brownian path
map(sort(collect(keys(algs)))) do name
    replay() = solve(remake(prob; noise=NoiseWrapper(ref.W)), algs[name]; dt={{dt}})
    try
        replay()  # compile
        t = @elapsed s = replay()
        (solver = name, error_at_end = norm(s.u[end] - ref.u[end]), steps = length(s.t) - 1, seconds = round(t, sigdigits=3), retcode = string(s.retcode))
    catch e
        (solver = name, error_at_end = missing, steps = missing, seconds = missing, retcode = first(sprint(showerror, e), 120))
    end
end
'''

