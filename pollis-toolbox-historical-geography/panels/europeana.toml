# Europeana Newspapers: the newspapers of Europeana with full text, from the national and state libraries of Europe, searched by words and dates through Europeana's full-text search, the issues found retrieved as a table, read page by page with the words found marked, and saved as text files; with JSON.jl

[meta]
title = "Europeana Newspapers"
viewType = "pollis.europeana"
style = "timeArrow"
intro = "Find issues in the newspapers of Europeana that have their full text, about a million issues from the libraries of Germany, the Netherlands, Austria, Latvia, Estonia, Finland, Serbia, Poland and Luxembourg: query them by words and dates, retrieve the issues found as a table, read an issue page by page with the words found marked, and save the texts. Europeana's search needs a key: the code uses the demo key Europeana gives for trying its API, and a free key of your own, set on the Powered by line, for more requests. A step first runs the steps before it that have not run in the Julia REPL as they are now."

# The user's Europeana API key, kept by Pollis in Secret Storage and set in the Julia REPL; without it, the demo key is used
[apiKey]
label = "Europeana"
noun = "key"

[[apiKey.fields]]
name = "europeanaKey"
envVar = "EUROPEANA_API_KEY"
label = "Europeana"
prompt = "Europeana API key, from pro.europeana.eu/page/get-api (optional: the demo key is used without it)"

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"
minimum = "0.1.9"

[[steps]]
id = "query"
title = "Query"
intro = "Count the issues that have the words between two dates, and how many there are each year (each decade, over more than 60 years). Words are joined by AND, OR and NOT, words without an operator by OR; a phrase goes in quotes, and a word ending in * stands for all its endings. Europeana gathers the newspapers that each library has given it with their text, so a hit is an issue, and each library's newspapers cover the years it gave."
code = '''
using HistoricalGeography, Dates
# The query: the words, the dates between which the issues were published, and optionally the newspaper (its title as
# Europeana gives it) and the language of the newspapers
words = strip(raw""" {{words}} """)
from, to = Date("{{from}}"), Date("{{to}}")
newspaper = strip(raw""" {{newspaper}} """)
language = "{{language}}"
# The issues that Europeana's full-text search finds, with the key in EUROPEANA_API_KEY or else Europeana's demo key,
# then those of each year, or of each decade over more than 60 years, a request each
total = europeana_count(words, from, to; newspaper, language)
println(total, " issues found for ", words, " from ", from, " to ", to, isempty(newspaper) ? "" : " in " * newspaper,
	language == "all" ? "" : " in the newspapers in " * language)
print_bars(europeana_periods(words, from, to; newspaper, language))
'''

[[steps.inputs]]
id = "words"
label = "Words"
tooltip = "The words to find, in the language of the newspapers: Eisenbahn, or Eisenbahn AND Wien, or (Eisenbahn OR Dampfschiff) NOT Berlin, or \"Wiener Eisenbahn\" for the words next to one another, or Eisenbahn* for Eisenbahnen, Eisenbahngesellschaft and the other words it starts. Capitals do not matter."
default = "Eisenbahn"

[[steps.inputs]]
id = "from"
label = "From"
tooltip = "The first day of publication, as year-month-day: 1865-01-01."
default = "1865-01-01"

[[steps.inputs]]
id = "to"
label = "To"
tooltip = "The last day of publication, as year-month-day: 1869-12-31."
default = "1869-12-31"

[[steps.inputs]]
id = "newspaper"
label = "Newspaper"
tooltip = "Empty for all the newspapers, or the title of one as Europeana gives it, without the date: Tages-Post, Algemeen Handelsblad, Baltijas Vēstnesis, Hamburger Nachrichten. Step 2 shows the titles of the newspapers found."
default = ""

[[steps.inputs]]
id = "language"
label = "Language"
kind = "select"
tooltip = "The language of the newspapers searched: all of them, or one of the languages of the newspapers that Europeana holds with their text."
default = "all"

[[steps.inputs.options]]
value = "all"
label = "All"

[[steps.inputs.options]]
value = "de"
label = "German"

[[steps.inputs.options]]
value = "nl"
label = "Dutch"

[[steps.inputs.options]]
value = "lv"
label = "Latvian"

[[steps.inputs.options]]
value = "et"
label = "Estonian"

[[steps.inputs.options]]
value = "fi"
label = "Finnish"

[[steps.inputs.options]]
value = "sr"
label = "Serbian"

[[steps.inputs.options]]
value = "pl"
label = "Polish"

[[steps.inputs.options]]
value = "fr"
label = "French"

[[steps.actions]]
id = "search"
label = "The Same Search on Europeana"
desc = "Open the same search in the newspapers of europeana.eu in Pollis's browser, with the issues and their scans"
code = '''
Pollis.browse(europeana_search_address(words, from, to; language))
'''

[[steps]]
id = "retrieve"
title = "Retrieve"
intro = "Retrieve the issues found, up to a number, as a table: a row per issue with its date, newspaper, language, the library that gave it and its rights, the words found in it in the forms they have there, a passage around them, and its link on Europeana. The search gives 100 issues a request, so 1,000 take ten requests."
code = '''
total == 0 && error("Step 1 found no issues: change its words, dates, newspaper or language")
# The issues found, the most relevant first, or by date, 100 a request, half a second apart
results = europeana_issues(words, from, to; newspaper, language, at_most = {{atMost}}, order = "{{order}}")
dates = collect(skipmissing(r.date for r in results))
println(length(results), " of ", total, " issues retrieved", isempty(dates) ? "" : ", from $(minimum(dates)) to $(maximum(dates))")
println("By newspaper: ", tallied([r.newspaper for r in results]; top = 10))
println("By library: ", tallied([r.library for r in results]))
println("By rights: ", tallied([r.rights for r in results]))
vscodedisplay(results, "Europeana Newspapers: $words")
'''

[[steps.inputs]]
id = "atMost"
label = "At Most"
tooltip = "The number of issues to retrieve at most: 1,000 by default. The search gives 100 a request, with a pause of half a second between requests."
default = "1000"

[[steps.inputs]]
id = "order"
label = "Order"
kind = "select"
tooltip = "Most Relevant First: the issues in which the words count most, as Europeana ranks them. Oldest First and Newest First: by date of publication."
default = "relevance"

[[steps.inputs.options]]
value = "relevance"
label = "Most Relevant First"

[[steps.inputs.options]]
value = "oldest"
label = "Oldest First"

[[steps.inputs.options]]
value = "newest"
label = "Newest First"

[[steps]]
id = "read"
title = "Read"
intro = "Read an issue, by its number in the table of Step 2: the text of each of its pages, as the library's OCR read it, opens in Pollis's browser with the words found marked, and the link to the issue on Europeana, where the scans are. The issue's pages come from Europeana's IIIF service, a request each."
code = '''
issue = results[{{number}}]
# The texts of the issue's pages, from its IIIF manifest, with the words found in it marked, as they are written there,
# or else the words of the query
pages = europeana_pages(issue)
isempty(pages) && error("Europeana gives no page texts for this issue: open it on Europeana with The Issue on Europeana")
found_words = filter(!isempty, strip.(split(issue.found, ",")))
marks = isempty(found_words) ? query_patterns(words) : literal_patterns(found_words)
title = "$(issue.newspaper), $(ismissing(issue.date) ? "" : Dates.format(issue.date, "d U yyyy"))"
html = reading_page(title, [p.page => split(p.text, r"\n\s*\n") for p in pages]; marks, passages = false,
	meta = "$(issue.library), $(issue.rights), $(length(pages)) pages", link = "The issue on Europeana" => issue.europeana)
Pollis.browse(html.file)
# Here, the lines of the issue with the words found, page by page; the whole issue is in Pollis's browser
println(title, ": ", length(pages), " pages")
for p in pages
	lines = filter(l -> any(r -> occursin(r, l), marks), split(p.text, '\n'))
	isempty(lines) || println("\n", p.page, "\n", join(strip.(lines), "\n"))
end
'''

[[steps.inputs]]
id = "number"
label = "Issue"
tooltip = "The number of the issue, in the column number of the table of Step 2."
default = "1"

[[steps.actions]]
id = "scan"
label = "The Issue on Europeana"
desc = "Open the issue on Europeana in Pollis's browser: the scans of its pages beside their text"
code = '''
Pollis.browse(issue.europeana)
'''

[[steps]]
id = "save"
title = "Save"
intro = "Save the texts of the issues retrieved as text files, a file each with its newspaper, date, library, rights and link above the text of its pages, and the table of Step 2 as a CSV file beside them. Each issue is a request for each of its pages; files already saved are kept, so a save stopped halfway goes on where it stopped."
code = '''
# The texts of the issues, a file each with their pages, and the table of the issues, in a folder named after the words
# and the dates; the texts that did not come are saved by running the step again
saved = save_texts(joinpath(expanduser(raw"{{folder}}"), "europeana", plain_name(words) * "-$from-$to"), results; count = {{toSave}},
	table = "issues.csv", name = r -> "$(coalesce(r.date, ""))-$(plain_name(r.newspaper, 40))",
	text = r -> join(("== $(p.page)\n\n$(p.text)\n" for p in europeana_pages(r)), "\n"),
	header = r -> ["$(r.newspaper), $(coalesce(r.date, ""))", "$(r.library), $(r.rights)", r.europeana])
println(saved.saved, " texts and the table of the ", length(results), " issues in ", saved.folder)
isempty(saved.missed) || println("The texts of issues ", join(saved.missed, ", "), " did not come: run the step again, or open them on Europeana")
'''

[[steps.inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. The texts go into europeana, in a folder named after the words and dates."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[steps.inputs]]
id = "toSave"
label = "Issues to Save"
tooltip = "The number of issues whose texts are saved, the first in the table of Step 2: 20 by default. Each issue is a request for each of its pages, with a pause of a fifth of a second."
default = "20"
