# Project Gutenberg: the books of Project Gutenberg, found in its catalogue by words, language and the years of their authors, their texts downloaded from the mirror of the Project Gutenberg Literary Archive Foundation and searched in Julia, read with the words marked, and saved as text files

[meta]
title = "Project Gutenberg"
viewType = "pollis.gutenberg"
style = "timeArrow"
intro = "Find books in Project Gutenberg, the 75,000 books in the public domain in the United States that its volunteers have transcribed since 1971, most of them printed before 1930: query its catalogue by words in their titles, authors, subjects and bookshelves, by language and by the years of their authors, retrieve the books found as a table with their texts, searched for words of their own, read a text with the words marked, and save the texts. The catalogue and the texts come from the mirror of the Project Gutenberg Literary Archive Foundation, downloaded once. A step first runs the steps before it that have not run in the Julia REPL as they are now."

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"
minimum = "0.1.9"

[[steps]]
id = "query"
title = "Query"
intro = "Find the books whose title, authors, subjects or bookshelves have the words, in a language, by authors who lived between two years, and count them by the quarter century in which their first author died, with their bookshelves, subjects and authors. The catalogue gives no year of first printing, so the years are those of the authors' lives. Words are joined by AND, OR and NOT, words without an operator by AND, with brackets; a phrase goes in quotes, and a word ending in * stands for all its endings. The catalogue, 21 MB, is downloaded into the folder the first time; Update the Catalogue downloads it again, with the books added since."
code = '''
using HistoricalGeography
# The query: the words of the catalogue's records, the language, and the years of the authors' lives
words = strip(raw""" {{words}} """)
language = strip(raw""" {{language}} """)
from_year, to_year = tryparse(Int, strip(raw""" {{from}} """)), tryparse(Int, strip(raw""" {{to}} """))
folder = expanduser(raw"{{folder}}")
# The books of the catalogue of Project Gutenberg, downloaded once into the folder gutenberg, whose title, authors,
# subjects or bookshelves have the words, in the language, by authors who lived between the years
record_query = text_query(words)
found = gutenberg_books(record_query; language, from = from_year, to = to_year, folder)
total = length(found)
println(total, " books of Project Gutenberg", isempty(language) ? "" : " in $language",
	from_year === nothing && to_year === nothing ? "" : " by authors who lived between $(something(from_year, "any year")) and $(something(to_year, "any year"))",
	isempty(words) ? "" : " have " * words)
died = [r.died for r in found if !ismissing(r.died)]
if !isempty(died)
	println("By the quarter century in which their first author died:")
	print_bars(period_counts(died, minimum(died), maximum(died); each = 25))
end
println(count(r -> ismissing(r.born), found), " books whose authors have no years in the catalogue")
if total > 0
	println("Bookshelves: ", tallied([t for r in found for t in unique(replace(strip(t), r"^Category:\s*" => "") for t in split(r.bookshelves, ";")) if !isempty(t)];
		top = 8, separator = "; "))
	println("Subjects: ", tallied(filter(!isempty, [strip(t) for r in found for t in split(r.subjects, ";")]); top = 8, separator = "; "))
	println("Authors: ", tallied(filter(!isempty, [strip(first(split(r.authors, ";"))) for r in found]); top = 8, separator = "; "))
end
'''

[[steps.inputs]]
id = "words"
label = "Words"
tooltip = "The words to find in the titles, authors, subjects and bookshelves of the catalogue: whaling, or cookery AND French, or (comet OR meteor) NOT fiction, or \"South Sea\" for the words next to one another. Empty for every book of the language and years. Capitals do not matter."
default = "travel* AND Africa"

[[steps.inputs]]
id = "language"
label = "Language"
tooltip = "Empty for all the languages, or the language of the books, by its code: en English, fr French, de German, fi Finnish, nl Dutch, it Italian, es Spanish, pt Portuguese, la Latin, el Greek, zh Chinese, sv Swedish."
default = "en"

[[steps.inputs]]
id = "from"
label = "From Year"
tooltip = "Empty for all the years, or a year in which the authors were alive or after it: the books of authors who died before it are left out, and those whose authors have no years in the catalogue."
default = "1750"

[[steps.inputs]]
id = "to"
label = "To Year"
tooltip = "Empty for all the years, or a year in which the authors were alive or before it: the books of authors born after it are left out."
default = "1850"

[[steps.inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. The catalogue and the texts go into gutenberg, and stay there for the next queries."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[steps.actions]]
id = "update"
label = "Update the Catalogue"
desc = "Download the catalogue again, with the books added to Project Gutenberg since it was downloaded, and run the query again"
code = '''
gutenberg_catalogue(; folder, update = true)
println("The catalogue is updated: run Step 1 again to query it")
'''

[[steps]]
id = "retrieve"
title = "Retrieve"
intro = "Retrieve the books found, up to a number, as a table with their texts: a row per book with its number at Project Gutenberg, title, authors, the years of the first author, language, subjects, bookshelves, the date it was added, length in words, how often the words of the text are in it, and its page at Project Gutenberg. Each text is downloaded once into the folder of Step 1, a request each with a pause of a second, without Project Gutenberg's header and licence. Words in the Text keep the books whose text has them, searched as in Step 1."
code = '''
total == 0 && error("Step 1 found no books: change its words, language or years")
text_words = strip(raw""" {{textWords}} """)
in_text = text_query(text_words)
# The texts of the first books in the order asked, downloaded once into gutenberg/texts, and kept when they have the
# words of the text
results = gutenberg_texts(found, in_text; at_most = {{atMost}}, order = "{{order}}", folder)
println(min({{atMost}}, total), " of the ", total, " books of Step 1 searched", isempty(text_words) ? "" : ", of which " * string(length(results)) * " have " * text_words)
vscodedisplay(without(results, :text), "Project Gutenberg: $words")
'''

[[steps.inputs]]
id = "textWords"
label = "Words in the Text"
tooltip = "Empty to keep all the books downloaded, or words to find in their texts, as in Step 1: Timbuctoo, or (ivory OR gold) AND caravan*."
default = ""

[[steps.inputs]]
id = "atMost"
label = "At Most"
tooltip = "The number of books whose texts are downloaded and searched at most: 100 by default, a request each the first time, about 400 KB a text."
default = "100"

[[steps.inputs]]
id = "order"
label = "Order"
kind = "select"
tooltip = "Most Relevant First: the books whose records have the words most, and then whose texts have the words of the text most. Oldest First and Newest First: by the year of birth of their first author, those without one last."
default = "oldest"

[[steps.inputs.options]]
value = "relevance"
label = "Most Relevant First"

[[steps.inputs.options]]
value = "oldest"
label = "Oldest First"

[[steps.inputs.options]]
value = "newest"
label = "Newest First"

[[steps]]
id = "read"
title = "Read"
intro = "Read a book, by its number in the table of Step 2: its whole text opens in Pollis's browser with the words of the text marked, or those of the catalogue when there are none, and a link to each passage that has them at the top."
code = '''
chosen = results[{{number}}]
# The text with the words marked, those of the text, or else those of the catalogue's records
marks = isempty(text_words) ? record_query.patterns : in_text.patterns
page = reading_page(chosen.title, split(chosen.text, "\n"); marks, meta = "$(chosen.authors) · Project Gutenberg $(chosen.ebook)",
	link = "The book at Project Gutenberg" => chosen.link)
Pollis.browse(page.file)
println(chosen.title, "\n", chosen.authors, "\n", length(page.passages), " passages have the words")
'''

[[steps.inputs]]
id = "number"
label = "Book"
tooltip = "The number of the book, in the column number of the table of Step 2."
default = "1"

[[steps.actions]]
id = "gutenbergpage"
label = "The Book at Project Gutenberg"
desc = "Open the book's page at Project Gutenberg in Pollis's browser, with its other formats: EPUB, Kindle and HTML with its pictures"
code = '''
Pollis.browse(chosen.link)
'''

[[steps]]
id = "save"
title = "Save"
intro = "Save the texts of the books retrieved as text files, a file each with its title, authors, number and link above its text, and the table of Step 2 as a CSV file beside them. The texts came with Step 2, so saving makes no request."
code = '''
# The texts, a file each, and the table of the books, in a folder named after the words, the language and the years
saved = save_texts(joinpath(folder, "gutenberg", "saved", plain_name(join(filter(!isempty, [words, text_words, language, string.(something.([from_year, to_year], ""))...]), " "))),
	results; count = {{toSave}}, table = "books.csv", name = r -> "pg$(r.ebook)-$(plain_name(r.title, 50))",
	header = r -> [r.title, r.authors, "Project Gutenberg $(r.ebook)", r.link])
println(saved.saved, " texts and the table of the ", length(results), " books in ", saved.folder)
'''

[[steps.inputs]]
id = "toSave"
label = "Books to Save"
tooltip = "The number of books whose texts are saved, the first in the table of Step 2: all of those retrieved by default."
default = "1000"
