# Papyrology: the sources of papyrology, a row per source with what it covers, its period, size, access and licence,
# and, where the source can be downloaded, the Julia code that downloads it and shows it as a table

[meta]
title = "Papyrology"
viewType = "pollis.papyrology"
style = "minimal"
intro = "The texts, catalogues, images and data sets of papyri, ostraca and tablets, each with its period, size, access and licence, and the Julia code that downloads it where it can be downloaded."
rowTitle = "Source"

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"
minimum = "0.1.8"

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/DuckDB.jl"

[[packages]]
name = "EzXML.jl"
github = "https://github.com/JuliaIO/EzXML.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

[[packages]]
name = "CodecZlib.jl"
github = "https://github.com/JuliaIO/CodecZlib.jl"

[[packages]]
name = "ZipArchives.jl"
github = "https://github.com/JuliaIO/ZipArchives.jl"

# The table: the columns after the sources' titles, then a row per source

[[columns]]
id = "covers"
label = "Covers"

[[columns]]
id = "period"
label = "Period"

[[columns]]
id = "size"
label = "Size"

[[columns]]
id = "access"
label = "Access"

[[columns]]
id = "licence"
label = "Licence"


[[rows]]
id = "ddbdp"
title = "Duke Databank of Documentary Papyri (DDbDP)"
subtitle = "Papyri.info, Duke Collaboratory for Classics Computing (DC3)"
description = "The texts of documentary papyri and ostraca as their editions print them, in EpiDoc XML, each with its Trismegistos number and its edition, from the Papyrological Editor of papyri.info. The code takes the texts as written, leaving out the regularised spellings and the editors' corrections."
covers = "Documentary texts in Greek, Coptic and Latin"
period = "Dated in the HGV"
size = "67,980 texts, 4.8 million words"
access = "GitHub (papyri/idp.data), an archive of 180 MB updated every hour"
licence = "CC BY 3.0"
code = '''
using HistoricalGeography
folder = expanduser("~/.pollis/data/examples/papyrology")  # where the downloads are kept
# The texts of the DDbDP, from the data of papyri.info, an archive of about 180 MB downloaded once: each text as
# written, the regularised spellings and the editors' corrections left out
texts = ddbdp(; folder)
println(length(texts), " texts, ", sum(t -> t.words, texts), " words")
println("By language: ", tallied(t.language for t in texts))
println("The series with most texts: ", tallied((t.series for t in texts); top = 10))
vscodedisplay(texts, "Duke Databank of Documentary Papyri")
'''

[[rows]]
id = "hgv"
title = "Heidelberger Gesamtverzeichnis der griechischen Papyrusurkunden Ägyptens (HGV)"
subtitle = "Papyri.info, with the Institut für Papyrologie, Heidelberg"
description = "The metadata of the documentary papyri of the DDbDP: an English title, the date, the place of writing and of finding, the material and keywords, the places in German. Its translations of 8,001 texts are in the same archive, in the folder Translations."
covers = "Dates, places and materials of documentary papyri"
period = "Mostly 3rd century BCE to 8th century CE"
size = "68,027 records, 66,640 of them dated"
access = "GitHub (papyri/idp.data), an archive of 180 MB updated every hour"
licence = "CC BY 3.0"
code = '''
using HistoricalGeography
folder = expanduser("~/.pollis/data/examples/papyrology")  # where the downloads are kept
# The records of the HGV, from the data of papyri.info, an archive of about 180 MB downloaded once
records = hgv(; folder)
println(length(records), " records, ", count(r -> !ismissing(r.from), records), " of them dated")
println("By century of the earliest date (negative before the Common Era): ",
	tallied((century(r.from) for r in records if !ismissing(r.from)); ordered = true))
println("The places with most records: ", tallied((r.place for r in records); top = 10))
vscodedisplay(records, "Heidelberger Gesamtverzeichnis")
'''

[[rows]]
id = "dclp"
title = "Digital Corpus of Literary Papyri (DCLP)"
subtitle = "Papyri.info"
description = "Literary papyri with their author and work, their contents, date and material, and the text where it has been entered: Homer first, then the Septuagint, Demosthenes, Euripides, Menander, Isocrates and Hesiod. Each has its Trismegistos and LDAB numbers."
covers = "Literary papyri in Greek, Latin, Coptic, Syriac and other languages"
period = "Mostly 4th century BCE to 8th century CE"
size = "14,850 papyri, 8,647 of them with their text"
access = "GitHub (papyri/idp.data), an archive of 180 MB updated every hour"
licence = "CC BY 3.0"
code = '''
using HistoricalGeography
folder = expanduser("~/.pollis/data/examples/papyrology")  # where the downloads are kept
# The literary papyri of the DCLP, from the data of papyri.info, an archive of about 180 MB downloaded once
papyri = dclp(; folder)
println(length(papyri), " literary papyri, ", count(p -> !isempty(p.author), papyri), " of them with their author")
println("The authors with most papyri: ", tallied((p.author for p in papyri if !isempty(p.author)); top = 10))
println("By language of the text, none when the papyrus has no text yet: ",
	tallied(isempty(p.language) ? "none" : p.language for p in papyri))
vscodedisplay(papyri, "Digital Corpus of Literary Papyri")
'''

