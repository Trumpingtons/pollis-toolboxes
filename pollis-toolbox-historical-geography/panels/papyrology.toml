code = '''
# AL-PUB on Kaggle, where it is downloaded after signing in
Pollis.browse("https://www.kaggle.com/datasets/miswindall/al-pub-v2")
'''

[[rows]]
id = "icdar2023"
title = "ICDAR 2023: Detection and Recognition of Greek Letters on Papyri"
subtitle = "D-Scribes project, on Zenodo"
description = "185 surfaces of 136 papyri of the Iliad, in book hands over a millennium, annotated letter by letter for the competition of ICDAR 2023, with the answers of its test set released after it, and each papyrus's Trismegistos number and link to papyri.info."
covers = "Greek letters on papyri of the Iliad, located and named"
period = ""
size = "152 training images with 35,597 letters, 37 test images with 9,773; 424 MB"
access = "Zenodo"
licence = "CC BY-NC 4.0"
code = '''
using HistoricalGeography
folder = expanduser("~/.pollis/data/examples/papyrology")  # where the downloads are kept
# The data set of the competition, an archive of 424 MB downloaded once; its images stay in it. The letters located and
# named on the images of the training set; the answers of the test set give their letters by image ids its list of
# images does not have, so they are counted as a whole
greek = icdar2023(; folder)
println("Training set: ", length(greek.images), " images, ", length(greek.letters), " letters located and named; test set: ",
	greek.test_images, " images, ", greek.test_letters, " letters")
println("The letters most often found in the training set: ", tallied((l.letter for l in greek.letters); top = 12))
vscodedisplay(greek.images, "ICDAR 2023: Greek Letters on Papyri")
vscodedisplay(greek.letters, "ICDAR 2023: the letters of the training set")
'''

[[rows]]
id = "helldate"
title = "Hell-Date: Hellenistic Dated Papyri"
subtitle = "EGRAPSA project, on Zenodo"
description = "Images of Greek papyri dated within two years, about 50 a century, with their characters annotated, for dating by handwriting and for character recognition. The images stay with their holders: the data set gives each one's link and licence, and the code shows them in a table."
covers = "Dated Greek cursive hands"
period = "310 to 3 BCE"
size = "194 images of 157 papyri; 2.7 MB without the images"
access = "Zenodo; the images from their holders"
licence = "CC BY-NC 4.0; each image under its holder's terms"
code = '''
using HistoricalGeography, DuckDB, Tables
folder = expanduser("~/.pollis/data/examples/papyrology")  # where the downloads are kept
con = DBInterface.connect(DuckDB.DB)  # an in-memory database
# Hell-Date as the table helldate, from an archive of 2.7 MB downloaded once: a row per image, with its papyrus, the
# years it is dated to, its nome, its kind of document, its holder and the licence of the image
helldate(con; folder)
images = Tables.rowtable(DBInterface.execute(con, "SELECT * FROM helldate"))
println(length(images), " images, dated from ", minimum(i -> i.year_from, images), " to ", maximum(i -> i.year_to, images))
println("Licences of the images: ", tallied(i.licence for i in images))
vscodedisplay(images, "Hell-Date: Hellenistic Dated Papyri")
'''

[[rows]]
id = "zenon"
title = "Zenon Papyri for Handwritten Text Recognition"
subtitle = "D-Scribes project, on Zenodo"
description = "Diplomatic transcriptions of papyri of the archive of Zenon of Kaunos, line by line in PageXML made with Transkribus, with their images, as ground truth for handwritten text recognition. Version 0.9."
covers = "Transcribed lines of Greek papyri, with their images"
period = ""
size = "27 transcriptions and 32 images, 5 MB"
access = "Zenodo"
licence = "CC BY 4.0"
code = '''
using HistoricalGeography
folder = expanduser("~/.pollis/data/examples/papyrology")  # where the downloads are kept
# The Zenon papyri, a PageXML transcription and an image for each, about 5 MB downloaded once: each papyrus with the
# lines of its transcription, as they were drawn on the image in Transkribus
papyri = zenon(; folder)
println(length(papyri), " papyri transcribed, in ", sum(p -> p.lines, papyri), " lines; ", count(p -> p.image, papyri), " with their image")
vscodedisplay(papyri, "Zenon Papyri for Handwritten Text Recognition")
'''
