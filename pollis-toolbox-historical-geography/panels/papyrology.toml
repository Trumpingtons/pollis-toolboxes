[[rows]]
id = "tlademotic"
title = "Thesaurus Linguae Aegyptiae: Demotic Sentences"
subtitle = "Berlin-Brandenburg and Saxon Academies of Sciences and Humanities, on Hugging Face"
description = "The Demotic sentences of the TLA's corpus 18 that are intact, unambiguously readable and fully lemmatised, 13,383 of its 31,156, each in transliteration with its lemmas, parts of speech, glosses, German translation and the dates of its text. The TLA publishes Late Egyptian and Earlier Egyptian sentences in the same way."
covers = "Demotic sentences, with German translations"
period = "7th century BCE to 5th century CE"
size = "13,383 sentences, 7 MB"
access = "Hugging Face, JSON lines"
licence = "CC BY-SA 4.0"
code = '''
using HistoricalGeography, DuckDB, Tables
folder = expanduser("~/.pollis/data/examples/papyrology")  # where the downloads are kept
con = DBInterface.connect(DuckDB.DB)  # an in-memory database
# The intact Demotic sentences of the TLA's corpus 18 as the table demotic, from a file of 7 MB downloaded once
println(tla_demotic(con; folder), " sentences")
# Each sentence in transliteration, with its lemmas, parts of speech, German translation and dates
sentences = Tables.rowtable(DBInterface.execute(con,
	"SELECT transliteration, translation, lemmatization, UPOS, dateNotBefore, dateNotAfter FROM demotic"))
# The sentences by century of the earliest date of their text, negative before the Common Era
println("By century: ", tallied((century(parse(Int, s.dateNotBefore)) for s in sentences
	if s.dateNotBefore isa AbstractString && occursin(r"^-?\d+$", s.dateNotBefore)); ordered = true))
vscodedisplay(sentences, "Thesaurus Linguae Aegyptiae: Demotic Sentences")
'''

