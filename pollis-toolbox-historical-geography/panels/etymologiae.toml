# Etymologiae by Isidore of Seville: its 20 books in Lindsay's Latin text, as Bill Thayer gives them on LacusCurtius, downloaded once, searched in Julia by words, the sections found retrieved as a table, read in their chapter with the words marked, and saved as text files

[meta]
title = "Etymologiae by Isidore of Seville"
viewType = "pollis.etymologiae"
style = "timeArrow"
intro = "Find the sections of the Etymologiae of Isidore of Seville, the encyclopedia of the early Middle Ages in 20 books, written about 630, which explains each thing by the origin of its name, from grammar and medicine to animals, stones, ships and tools: query its Latin text, as Wallace Lindsay edited it in 1911, by words, retrieve the sections found as a table, read a section in its chapter with the words marked, and save the texts. The text comes from Bill Thayer's LacusCurtius, a page each book, downloaded once. A step first runs the steps before it that have not run in the Julia REPL as they are now."

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"
minimum = "0.1.9"

[[steps]]
id = "query"
title = "Query"
intro = "Search the sections of the books chosen, each one or a few sentences, most of them the etymology of a word, and count those that have the words, book by book. Words are joined by AND, OR and NOT, words without an operator by AND, with brackets; a phrase goes in quotes, and a word ending in * stands for all its endings, which Latin needs: elephant* finds elephantus and elephantos. The 20 books, 2 MB, are downloaded into the folder the first time, a request each."
code = '''
using HistoricalGeography
# The query: the words, and the books, from 1 to 20
words = strip(raw""" {{words}} """)
books = {{fromBook}}:{{toBook}}
folder = expanduser(raw"{{folder}}")
# The sections of the books, from the pages of LacusCurtius, a page a book, downloaded into the folder etymologiae once
sections = isidore_sections(books; folder)
# The sections with the words, each with how often the words are in it
query = text_query(words)
found = [merge(s, (hits = query_hits(query, s.text),)) for s in sections if query(s.text)]
total = length(found)
println(total, " of the ", length(sections), " sections of books ", first(books), " to ", last(books), " have ", words)
print_bars([lpad(b, 3) * "  " * first(isidore_book_title(b), 38) => count(f -> f.book == b, found) for b in books]; width = 30)
'''

[[steps.inputs]]
id = "words"
label = "Words"
tooltip = "The words to find, in Latin: elephant*, or equus AND bellum, or (leo OR leaena) NOT pardus, or \"dictus quod\" for the words next to one another. A word ending in * finds all its endings. Capitals do not matter."
default = "elephant*"

[[steps.inputs]]
id = "fromBook"
label = "From Book"
tooltip = "The first book searched, from 1 to 20: 1 to 3 the liberal arts; 4 medicine; 5 laws and times; 6 to 8 books, God and the Church; 9 languages and peoples; 10 words; 11 man; 12 animals; 13 and 14 the world and the earth; 15 buildings; 16 stones and metals; 17 agriculture; 18 war and games; 19 ships, buildings and clothing; 20 provisions and tools."
default = "1"

[[steps.inputs]]
id = "toBook"
label = "To Book"
tooltip = "The last book searched, from 1 to 20."
default = "20"

[[steps.inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. The books go into etymologiae, and stay there for the next queries."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[steps]]
id = "retrieve"
title = "Retrieve"
intro = "Retrieve the sections found, up to a number, as a table: a row per section with its book, the book's subject, its chapter and the chapter's title, its number, how often the words are in it, the beginning of its text, and its place on LacusCurtius."
code = '''
total == 0 && error("Step 1 found no sections: change its words or books")
results = ranked(found, "{{order}}" == "relevance" ? "relevance" : "work"; at_most = {{atMost}})
println(length(results), " of ", total, " sections retrieved, in ", length(unique((r.book, r.chapter) for r in results)), " chapters")
vscodedisplay([(number = r.number, book = r.book, subject = r.book_title, chapter = r.chapter, chapter_title = r.chapter_title, section = r.section,
	hits = r.hits, text = first(r.text, 120), lacuscurtius = r.link) for r in results], "Etymologiae: $words")
'''

[[steps.inputs]]
id = "atMost"
label = "At Most"
tooltip = "The number of sections to retrieve at most: 1,000 by default."
default = "1000"

[[steps.inputs]]
id = "order"
label = "Order"
kind = "select"
tooltip = "Most Relevant First: the sections where the words come most often. In the Order of the Work: book by book, chapter by chapter."
default = "work"

[[steps.inputs.options]]
value = "relevance"
label = "Most Relevant First"

[[steps.inputs.options]]
value = "work"
label = "In the Order of the Work"

[[steps]]
id = "read"
title = "Read"
intro = "Read a section, by its number in the table of Step 2, in its chapter: the chapter opens in Pollis's browser with the section found shaded and the words marked, and the link to the section on LacusCurtius."
code = '''
chosen = results[{{number}}]
# The chapter of the section, its sections numbered, the section set apart, with the words marked
Pollis.browse(isidore_page(chosen, sections, query.patterns))
println("Etymologiae $(chosen.book)", isempty(chosen.chapter) ? "" : ".$(chosen.chapter)", ".$(chosen.section), ", chosen.chapter_title, "\n\n", chosen.text)
'''

[[steps.inputs]]
id = "number"
label = "Section"
tooltip = "The number of the section, in the column number of the table of Step 2."
default = "1"

[[steps.actions]]
id = "lacuscurtius"
label = "The Section on LacusCurtius"
desc = "Open the section in Bill Thayer's LacusCurtius in Pollis's browser, with his notes on the readings of the text"
code = '''
Pollis.browse(chosen.link)
'''

[[steps]]
id = "save"
title = "Save"
intro = "Save the sections retrieved as text files, a file each with its book, chapter, section and link above its text, and the table of Step 2 as a CSV file beside them, in the folder of Step 1."
code = '''
# The texts, a file each, and the table of the sections, in a folder named after the words
saved = save_texts(joinpath(folder, "etymologiae", "sections", plain_name(words)), results; count = {{toSave}}, table = "sections.csv",
	name = s -> "book$(s.book)" * (isempty(s.chapter) ? "" : "-chapter$(s.chapter)") * "-section$(s.section)",
	header = s -> ["Isidore of Seville, Etymologiae, book $(s.book) ($(s.book_title))" * (isempty(s.chapter) ? "" : ", chapter $(s.chapter), $(s.chapter_title)") *
		", section $(s.section)", s.link],
	columns = (:number, :book, :book_title, :chapter, :chapter_title, :section, :hits, :text, :link))
println(saved.saved, " texts and the table of the ", length(results), " sections in ", saved.folder)
'''

[[steps.inputs]]
id = "toSave"
label = "Sections to Save"
tooltip = "The number of sections whose texts are saved, the first in the table of Step 2: all of those retrieved by default."
default = "1000"
