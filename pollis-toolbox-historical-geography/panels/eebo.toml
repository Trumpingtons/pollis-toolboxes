# EEBO-TCP: the texts of Early English Books Online transcribed by the Text Creation Partnership, in the public domain, found in the TCP's catalogue by words and years, their texts downloaded from the TCP's repositories on GitHub and searched in Julia, read with the words marked, and saved as text files

[meta]
title = "EEBO-TCP"
viewType = "pollis.eebo"
style = "timeArrow"
intro = "Find books printed in England and in English from 1473 to 1700 in EEBO-TCP, the 60,000 texts of Early English Books Online that the Text Creation Partnership transcribed, all in the public domain since 2020: query the TCP's catalogue by words in their titles, authors and subjects and by years, retrieve the works found as a table with their texts, searched for words of their own, read a text with the words marked, and save the texts. The catalogue and the texts come from the TCP's repositories on GitHub, downloaded once. A step first runs the steps before it that have not run in the Julia REPL as they are now."

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"
minimum = "0.1.9"

[[steps]]
id = "query"
title = "Query"
intro = "Find the works whose title, author or subjects have the words, printed between two years, and count them decade by decade, with their subjects and authors. Words are joined by AND, OR and NOT, words without an operator by AND, with brackets; a phrase goes in quotes, and a word ending in * stands for all its endings. As the printers of the time, u and v, i and j, and s and the long s are the same letters: loue finds love, and love finds loue. Empty words find every work of those years. The catalogue of the TCP, 29 MB, is downloaded into the folder the first time."
code = '''
using HistoricalGeography
# The query: the words of the catalogue's records, and the years of printing
words = strip(raw""" {{words}} """)
from, to = {{from}}, {{to}}
folder = expanduser(raw"{{folder}}")
# The works of EEBO-TCP in the catalogue of the Text Creation Partnership, downloaded once into the folder tcp: those
# printed in the years whose title, author or subjects have the words; u and v, i and j, and s and the long s the same
record_query = text_query(words; early_modern = true)
found = tcp_works("EEBO-TCP", record_query, from, to; folder)
total = length(found)
println(total, " works of EEBO-TCP printed from ", from, " to ", to, isempty(words) ? "" : " have " * words)
print_bars(period_counts([r.year for r in found], from, to))
subjects = tallied(filter(!isempty, [strip(t) for r in found for t in split(r.terms, ";")]); top = 8, separator = "; ")
isempty(subjects) || println("Subjects: ", subjects)
println("Authors: ", tallied(filter(!isempty, [strip(first(split(r.author, ";"))) for r in found]); top = 8, separator = "; "))
'''

[[steps.inputs]]
id = "words"
label = "Words"
tooltip = "The words to find in the titles, authors and subjects of the catalogue: tobacco, or sermon* AND plague, or (comet OR blazing) NOT almanack, or \"New England\" for the words next to one another. Empty for every work of the years. Capitals do not matter."
default = "tobacco"

[[steps.inputs]]
id = "from"
label = "From Year"
tooltip = "The first year of printing: EEBO-TCP's works start in 1473."
default = "1473"

[[steps.inputs]]
id = "to"
label = "To Year"
tooltip = "The last year of printing: most of EEBO-TCP's works end in 1700."
default = "1700"

[[steps.inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. The catalogue and the texts go into tcp, shared by EEBO-TCP, Evans-TCP and ECCO-TCP, and stay there for the next queries."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[steps]]
id = "retrieve"
title = "Retrieve"
intro = "Retrieve the works found, up to a number, as a table with their texts: a row per work with its TCP number, year, author, title, subjects, pages, length in words, how often the words of the text are in it, and its repository on GitHub. Each text is downloaded once into the folder of Step 1, a request each, and then read from there. Words in the Text keep the works whose text has them, searched as in Step 1."
code = '''
total == 0 && error("Step 1 found no works: change its words or years")
text_words = strip(raw""" {{textWords}} """)
in_text = text_query(text_words; early_modern = true)
# The texts of the first works in the order asked, downloaded once into tcp/texts from the TCP's repositories on GitHub,
# and kept when they have the words of the text
results = tcp_texts(found, in_text; at_most = {{atMost}}, order = "{{order}}", folder)
println(min({{atMost}}, total), " of the ", total, " works of Step 1 searched", isempty(text_words) ? "" : ", of which " * string(length(results)) * " have " * text_words)
vscodedisplay(without(results, :text), "EEBO-TCP: $words")
'''

[[steps.inputs]]
id = "textWords"
label = "Words in the Text"
tooltip = "Empty to keep all the works downloaded, or words to find in their texts, as in Step 1: smoak*, or tobacco AND physick."
default = ""

[[steps.inputs]]
id = "atMost"
label = "At Most"
tooltip = "The number of works whose texts are downloaded and searched at most: 100 by default, a request each the first time, about 300 KB a text."
default = "100"

[[steps.inputs]]
id = "order"
label = "Order"
kind = "select"
tooltip = "Most Relevant First: the works whose records have the words most, and then whose texts have the words of the text most. Oldest First and Newest First: by year of printing."
default = "oldest"

[[steps.inputs.options]]
value = "relevance"
label = "Most Relevant First"

[[steps.inputs.options]]
value = "oldest"
label = "Oldest First"

[[steps.inputs.options]]
value = "newest"
label = "Newest First"

[[steps]]
id = "read"
title = "Read"
intro = "Read a work, by its number in the table of Step 2: its whole text opens in Pollis's browser with the words of the text marked, or those of the catalogue when there are none, and a link to each passage that has them at the top."
code = '''
chosen = results[{{number}}]
# The text with the words marked, those of the text, or else those of the catalogue's records
marks = isempty(text_words) ? record_query.patterns : in_text.patterns
page = reading_page(chosen.title, split(chosen.text, "\n"); marks, meta = "$(chosen.author) · $(chosen.date) · $(chosen.tcp) of EEBO-TCP",
	link = "The text on GitHub" => chosen.github)
Pollis.browse(page.file)
println(chosen.title, "\n", chosen.author, ", ", chosen.date, "\n", length(page.passages), " passages have the words")
'''

[[steps.inputs]]
id = "number"
label = "Work"
tooltip = "The number of the work, in the column number of the table of Step 2."
default = "1"

[[steps.actions]]
id = "github"
label = "The Text on GitHub"
desc = "Open the work's repository on GitHub in Pollis's browser: its text in TEI, with the TCP's record of it"
code = '''
Pollis.browse(chosen.github)
'''

[[steps]]
id = "save"
title = "Save"
intro = "Save the texts of the works retrieved as text files, a file each with its title, author, date, TCP number and link above its text, and the table of Step 2 as a CSV file beside them. The texts came with Step 2, so saving makes no request."
code = '''
# The texts, a file each, and the table of the works, in a folder named after the words and the years
saved = save_texts(joinpath(folder, "tcp", "saved", plain_name("EEBO-TCP $words $text_words") * "-$from-$to"), results;
	count = {{toSave}}, table = "works.csv", name = r -> "$(r.year)-$(r.tcp)",
	header = r -> [r.title, r.author, r.date, "$(r.tcp) of EEBO-TCP", r.github])
println(saved.saved, " texts and the table of the ", length(results), " works in ", saved.folder)
'''

[[steps.inputs]]
id = "toSave"
label = "Works to Save"
tooltip = "The number of works whose texts are saved, the first in the table of Step 2: all of those retrieved by default."
default = "1000"
