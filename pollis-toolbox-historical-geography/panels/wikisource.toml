# Wikisource: the texts of the Wikisource of a language, searched by words and category through the MediaWiki API, the pages found retrieved as a table with the years of their works from Wikidata, read with the words marked, and saved as text files; with JSON.jl

[meta]
title = "Wikisource"
viewType = "pollis.wikisource"
style = "timeArrow"
intro = "Find texts in Wikisource, the free library of texts in the public domain or under free licences that volunteers transcribe and proofread, in more than 70 languages: query the Wikisource of a language by words and category, retrieve the pages found as a table with the years of their works, read a page with the words marked, and save the texts. Wikisource's search answers the queries, and Wikidata gives the years. A step first runs the steps before it that have not run in the Julia REPL as they are now."

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"
minimum = "0.1.9"

[[steps]]
id = "query"
title = "Query"
intro = "Find the pages of texts that have the words, in the Wikisource of a language, optionally in one of its categories, and count them by the works they belong to. Words are joined by AND, OR and NOT, with brackets; a phrase goes in quotes, and a word ending in * stands for all its endings. Wikisource lists 10,000 pages of a query at most, 500 a request."
code = '''
using HistoricalGeography
# The query: the Wikisource, the words and optionally a category
language = strip(raw""" {{language}} """)
words = strip(raw""" {{words}} """)
category = strip(raw""" {{category}} """)
# The pages that Wikisource's search finds, the most relevant first, up to the 10,000 it lists, a second apart
found = wikisource_search(language, words; category)
total = found.total
println(total, " pages of the ", language, " Wikisource have ", words, isempty(category) ? "" : " in the category $category",
	length(found.pages) < total ? ", of which Wikisource lists the first $(length(found.pages))" : "")
works = tally(p.work for p in found.pages)
println(length(works), " works; those with the most pages:")
print_bars([first(w, 50) => n for (w, n) in first(works, 15)]; width = 30)
'''

[[steps.inputs]]
id = "language"
label = "Wikisource"
tooltip = "The language of the Wikisource, by its code: en English, fr French, de German, it Italian, es Spanish, pt Portuguese, la Latin, el Greek, ru Russian, pl Polish, nl Dutch, sv Swedish, zh Chinese, ar Arabic, he Hebrew."
default = "en"

[[steps.inputs]]
id = "words"
label = "Words"
tooltip = "The words to find, in the language of the Wikisource: tobacco, or plague AND London, or (comet OR meteor) NOT almanac, or \"South Sea\" for the words next to one another. A word ending in * finds all its endings. Capitals do not matter."
default = "tobacco"

[[steps.inputs]]
id = "category"
label = "Category"
tooltip = "Empty for all the pages, or a category of the Wikisource, its name without Category: and as the Wikisource writes it, such as 1604 works, Early modern works, Popular Science Monthly, Poems."
default = ""

[[steps]]
id = "retrieve"
title = "Retrieve"
intro = "Retrieve the pages found, up to a number, as a table: a row per page with its title, its work, the year of the work from Wikidata when it has one, its length in words, the words around the first place that has the words, and its page on Wikisource. The years of the works come from Wikidata, 50 a request, and From Year and To Year keep the pages whose works have a year between them."
code = '''
total == 0 && error("Step 1 found no pages: change its words or category")
from_year, to_year = tryparse(Int, strip(raw""" {{fromYear}} """)), tryparse(Int, strip(raw""" {{toYear}} """))
# The first pages, each with the year of its work from Wikidata, those of the years kept, in the order asked
chosen_pages = first(found.pages, min({{atMost}}, length(found.pages)))
results = wikisource_years(language, chosen_pages; from = from_year, to = to_year, order = "{{order}}")
println(length(results), " of the first ", length(chosen_pages), " pages kept, ", count(r -> !ismissing(r.year), results), " of them with the year of their work")
vscodedisplay(results, "Wikisource: $words")
'''

[[steps.inputs]]
id = "atMost"
label = "At Most"
tooltip = "The number of pages to retrieve at most, the first that Wikisource lists, the most relevant: 1,000 by default."
default = "1000"

[[steps.inputs]]
id = "fromYear"
label = "From Year"
tooltip = "Empty for all the pages, or the first year of their works, as Wikidata gives it: the pages whose works have no year in Wikidata are then left out."
default = ""

[[steps.inputs]]
id = "toYear"
label = "To Year"
tooltip = "Empty for all the pages, or the last year of their works, as Wikidata gives it."
default = ""

[[steps.inputs]]
id = "order"
label = "Order"
kind = "select"
tooltip = "Most Relevant First: as Wikisource's search ranks the pages. Oldest First and Newest First: by the year of their works, those without one last."
default = "relevance"

[[steps.inputs.options]]
value = "relevance"
label = "Most Relevant First"

[[steps.inputs.options]]
value = "oldest"
label = "Oldest First"

[[steps.inputs.options]]
value = "newest"
label = "Newest First"

[[steps]]
id = "read"
title = "Read"
intro = "Read a page, by its number in the table of Step 2: its text, which Wikisource gives in a request, opens in Pollis's browser with the words marked where they are, and a link to each passage that has them at the top, without Wikisource's headers, notes on the licence and page numbers."
code = '''
chosen = results[{{number}}]
folder = expanduser(raw"{{folder}}")
# The text of the page, kept in the folder wikisource, with the words of the query marked
text = wikisource_text(language, chosen.title; folder)
page = reading_page(chosen.title, split(text, "\n"); marks = query_patterns(words), language,
	meta = "$(language) Wikisource" * (ismissing(chosen.year) ? "" : " · $(chosen.year)"), link = "The page on Wikisource" => chosen.wikisource_page)
Pollis.browse(page.file)
println(chosen.title, "\n", length(page.passages), " passages have the words")
'''

[[steps.inputs]]
id = "number"
label = "Page"
tooltip = "The number of the page, in the column number of the table of Step 2."
default = "1"

[[steps.inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. The texts go into wikisource, by language, and are not asked for again."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[steps.actions]]
id = "wikisourcepage"
label = "The Page on Wikisource"
desc = "Open the page on Wikisource in Pollis's browser, with the scans of its pages where it has them"
code = '''
Pollis.browse(chosen.wikisource_page)
'''

[[steps]]
id = "save"
title = "Save"
intro = "Save the texts of the pages retrieved as text files, a file each with its title, year and link above its text, and the table of Step 2 as a CSV file beside them. Wikisource gives the text of each page in a request, with a pause of a second, except those already read."
code = '''
# The texts, a file each, and the table of the pages, in a folder named after the words
saved = save_texts(joinpath(folder, "wikisource", language, "saved", plain_name("$words $category")), results; count = {{toSave}},
	table = "pages.csv", name = r -> plain_name(r.title), text = r -> wikisource_text(language, r.title; folder),
	header = r -> [r.title, string(coalesce(r.year, "")), r.wikisource_page],
	columns = (:number, :title, :work, :year, :words, :rank, :wikidata, :wikisource_page))
println(saved.saved, " texts and the table of the ", length(results), " pages in ", saved.folder)
'''

[[steps.inputs]]
id = "toSave"
label = "Pages to Save"
tooltip = "The number of pages whose texts are saved, the first in the table of Step 2: 100 by default, a request each."
default = "100"
