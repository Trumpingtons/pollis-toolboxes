# Checks every pull request: the toolbox it adds or changes, with scripts/checkToolboxes.ts (see the
# checks at its top). Runs with a read-only token and no secrets, so a pull request from a fork
# cannot write to this repository. The check scripts are taken from main, not from the pull request.
name: Check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Use the check scripts of main
        run: git checkout "origin/${{ github.base_ref }}" -- scripts
      - name: Get the panel validator of the Pollis Agents skills
        uses: actions/checkout@v4
        with:
          repository: Trumpingtons/pollis-skills
          path: .pollis-skills
          sparse-checkout: plugins/pollis-agents/scripts
      - uses: actions/setup-node@v4
        with:
          node-version: 24
      - name: Check the toolbox
        run: node scripts/checkToolboxes.ts --validator .pollis-skills/plugins/pollis-agents/scripts/validatePanel.mjs --base "origin/${{ github.base_ref }}"
