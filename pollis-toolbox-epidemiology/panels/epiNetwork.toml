[[actionGroups.actions]]
id = "compare-threshold"
label = "Threshold by Network"
desc = "The endemic level as Basic R rises, on a random and a scale-free network, against the level with no network"
models = ["recurring"]
code = '''
using Plots

function endemic_level(network, basic_R)
    rate = beta_R0(basic_R, network, recovery)
{{?immunity=none}}    m = SISModel(rate, recovery)
{{?immunity=waning}}    m = SIRSModel(rate, recovery, {{waning}})
    r = Xoshiro({{seed}})
    run = init_model_discrete(m, network, r, :S)
    set_state_nodes(m, run, r, randperm(r, nv(network))[1:50], :I, true)  # enough first cases to avoid losing it by chance
    mean(row.I for row in run_complex_contagion(m, network, days, r, run)[(end - days ÷ 3):end]) / nv(network)
end
R_values = 0.25:0.25:3.0
{{?immunity=none}}well_mixed = max.(0.0, 1 .- 1 ./ R_values)
{{?immunity=waning}}well_mixed = max.(0.0, 1 .- 1 ./ R_values) .* ({{waning}} / ({{waning}} + recovery))
p = plot(R_values, well_mixed; color = :gray, linestyle = :dash, label = "No network", xlabel = "Basic R", ylabel = "Share infectious", title = "Endemic level")
plot!(p, R_values, [endemic_level(erdos_renyi(people, contacts / (people - 1); rng = Xoshiro({{seed}})), x) for x in R_values]; marker = :circle, label = "Random")
plot!(p, R_values, [endemic_level(barabasi_albert(people, even_contacts ÷ 2; rng = Xoshiro({{seed}})), x) for x in R_values]; marker = :circle, label = "Scale-Free")
display(p)
'''

