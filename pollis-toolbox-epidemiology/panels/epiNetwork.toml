[[models]]
id = "sir"
label = "SIR"

[[models]]
id = "seir"
label = "SEIR"

[[models]]
id = "recurring"
label = "SIS and SIRS"

[[models]]
id = "continuous"
label = "Continuous Time"

[[bullets]]
text = "SIR"
detail = "each person is a node and each contact an edge: infection passes along edges, one day at a time, and recovery gives lasting immunity, so that the shape of the network sets how far the epidemic goes"

[[bullets]]
text = "SEIR"
detail = "adds a latent period before a person can infect, and lets people differ in how infectious they are, which produces superspreading from the model rather than from an assumed distribution"

[[bullets]]
text = "SIS and SIRS"
detail = "immunity is absent or wanes, so that people are infected again and the infection can settle at an endemic level or die out"

[[bullets]]
text = "Continuous Time"
detail = "the exact stochastic simulation of the SIR model on a network, with infection and recovery as rates, event by event, in place of daily steps"

[[decisionRows]]
task = "SIR"
context = "Lasting immunity; who meets whom matters"
purpose = "Final size, peak and timing on a given network; the effect of vaccinating by random choice or by number of contacts"

[[decisionRows]]
task = "SEIR"
context = "A latent period; people unequally infectious"
purpose = "How latency delays an epidemic without changing its final size, and what unequal infectivity does"

[[decisionRows]]
task = "SIS and SIRS"
context = "No lasting immunity"
purpose = "Whether the infection persists, and at which level"

[[decisionRows]]
task = "Continuous Time"
context = "Rates rather than daily probabilities; exact timing of each event"
purpose = "An exact simulation, and a check of what the daily steps of the other tabs change"

[[inputs]]
id = "network"
label = "Network"
kind = "select"
default = "random"
tooltip = "Random: every pair equally likely to meet (Erdos-Renyi). Scale-Free: a few people with very many contacts (Barabasi-Albert). Small-World: a ring of local contacts with some long ties (Watts-Strogatz). Regular: everybody with the same number of contacts."

[[inputs.options]]
value = "random"
label = "Random"

[[inputs.options]]
value = "scalefree"
label = "Scale-Free"

[[inputs.options]]
value = "smallworld"
label = "Small-World"

[[inputs.options]]
value = "regular"
label = "Regular"

[[inputs]]
id = "people"
label = "People"
tooltip = "Number of nodes of the network."
default = "2000"

[[inputs]]
id = "contacts"
label = "Mean Contacts"
tooltip = "Mean number of edges per person. Scale-Free, Small-World and Regular use the nearest even number."
default = "10"

[[inputs]]
id = "R0"
label = "Basic R"
tooltip = "Sets the infection rate as R x recovery / mean contacts. This ignores the shape of the network: Next Steps > Diagnose shows the reproduction number the network really gives."
default = "2.5"

[[inputs]]
id = "recovery"
label = "Recovery per Day"
tooltip = "Daily probability of recovering, or the recovery rate in Continuous Time. The mean infectious period is 1 / this."
default = "0.2"
newRow = true

[[inputs]]
id = "latent"
label = "End of Latency per Day"
tooltip = "Daily probability that a latent person becomes infectious. The mean latent period is 1 / this."
default = "0.25"
models = ["seir"]

[[inputs]]
id = "spreaders"
label = "Infectiousness"
kind = "select"
default = "equal"
models = ["seir"]
tooltip = "Equal: everybody equally infectious. Unequal: each person's infectiousness is drawn from a Gamma distribution with mean 1. Next Steps > Diagnose shows that this also lowers the reproduction number."

[[inputs.options]]
value = "equal"
label = "Equal"

[[inputs.options]]
value = "unequal"
label = "Unequal"

[[inputs]]
id = "shape"
label = "Gamma Shape"
tooltip = "Shape of the Gamma distribution of infectiousness. Smaller means a few people do most of the infecting."
default = "0.3"
models = ["seir"]
when = "spreaders=unequal"

[[inputs]]
id = "immunity"
label = "Immunity"
kind = "select"
default = "none"
models = ["recurring"]
tooltip = "None (SIS): a person who recovers can be infected at once. Waning (SIRS): immune for a while first."

[[inputs.options]]
value = "none"
label = "None (SIS)"

[[inputs.options]]
value = "waning"
label = "Waning (SIRS)"

[[inputs]]
id = "waning"
label = "Loss of Immunity per Day"
tooltip = "Daily probability that a recovered person becomes susceptible again."
default = "0.02"
models = ["recurring"]
when = "immunity=waning"

[[inputs]]
id = "days"
label = "Days"
tooltip = "Number of days simulated."
default = "300"
models = ["recurring"]

[[inputs]]
id = "first-cases"
label = "First Cases"
tooltip = "Number of people infected at the start, chosen at random."
default = "5"
newRow = true

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Random seed for the network and the simulation."
default = "42"

[[codeBranches]]
model = "sir"
code = '''
using GraphEpidemics, Graphs, Distributions, Random  # simulation; networks; distributions; seed

rng = Xoshiro({{seed}})  # fixed seed: the same network and epidemic on every run
people, contacts = {{people}}, {{contacts}}
even_contacts = 2 * round(Int, contacts / 2)

{{?network=random}}g = erdos_renyi(people, contacts / (people - 1); rng)
{{?network=scalefree}}g = barabasi_albert(people, even_contacts ÷ 2; rng)
{{?network=smallworld}}g = watts_strogatz(people, even_contacts, 0.1; rng)
{{?network=regular}}g = random_regular_graph(people, even_contacts; rng)

recovery = {{recovery}}
infection = beta_R0({{R0}}, g, recovery)  # daily chance of infection along one edge
model = SIRModel(infection, recovery)

first_cases = randperm(rng, people)[1:{{first-cases}}]
data, trace = run_sir_fast(g, model, -1, rng, first_cases)  # -1: until nobody is infectious

S, I, R = eachrow(stack(trace))  # counts of each state by day
println("Mean contacts: ", round(mean(degree(g)); digits = 1), ", infection per edge per day: ", round(infection; digits = 4))
println("Infected in all: ", R[end], " of ", people, " (", round(100 * R[end] / people; digits = 1), "%)")
println("Peak: ", maximum(I), " infectious on day ", argmax(I) - 1, ", over on day ", length(I) - 1)
'''

[[codeBranches]]
model = "seir"
code = '''
using GraphEpidemics, Graphs, Distributions, Random  # simulation; networks; distributions; seed

rng = Xoshiro({{seed}})  # fixed seed: the same network and epidemic on every run
people, contacts = {{people}}, {{contacts}}
even_contacts = 2 * round(Int, contacts / 2)

{{?network=random}}g = erdos_renyi(people, contacts / (people - 1); rng)
{{?network=scalefree}}g = barabasi_albert(people, even_contacts ÷ 2; rng)
{{?network=smallworld}}g = watts_strogatz(people, even_contacts, 0.1; rng)
{{?network=regular}}g = random_regular_graph(people, even_contacts; rng)

recovery, latent = {{recovery}}, {{latent}}
infection = beta_R0({{R0}}, g, recovery)  # daily chance of infection along one edge
{{?spreaders=equal}}model = SEIRModel(latent, infection, recovery)
{{?spreaders=unequal}}infectiousness = rand(rng, Gamma({{shape}}, 1 / {{shape}}), people)  # mean 1: the same mean infectiousness, unevenly shared
{{?spreaders=unequal}}model = SEIRHetModel(infection, infectiousness, ones(people), latent, recovery)

first_cases = randperm(rng, people)[1:{{first-cases}}]
data, trace = run_seir_fast(g, model, -1, rng, first_cases)  # -1: until nobody is latent or infectious

S, E, I, R = eachrow(stack(trace))  # counts of each state by day
println("Infected in all: ", R[end], " of ", people, " (", round(100 * R[end] / people; digits = 1), "%)")
println("Peak: ", maximum(I), " infectious on day ", argmax(I) - 1, ", over on day ", length(I) - 1)
'''

[[codeBranches]]
model = "recurring"
code = '''
using GraphEpidemics, Graphs, Distributions, Random  # simulation; networks; distributions; seed

rng = Xoshiro({{seed}})  # fixed seed: the same network and epidemic on every run
people, contacts = {{people}}, {{contacts}}
even_contacts = 2 * round(Int, contacts / 2)

{{?network=random}}g = erdos_renyi(people, contacts / (people - 1); rng)
{{?network=scalefree}}g = barabasi_albert(people, even_contacts ÷ 2; rng)
{{?network=smallworld}}g = watts_strogatz(people, even_contacts, 0.1; rng)
{{?network=regular}}g = random_regular_graph(people, even_contacts; rng)

recovery = {{recovery}}
infection = beta_R0({{R0}}, g, recovery)  # daily chance of infection along one edge
{{?immunity=none}}model = SISModel(infection, recovery)
{{?immunity=waning}}model = SIRSModel(infection, recovery, {{waning}})

# Start with everybody susceptible, then infect the first cases
data = init_model_discrete(model, g, rng, :S)
first_cases = randperm(rng, people)[1:{{first-cases}}]
set_state_nodes(model, data, rng, first_cases, :I, true)

days = {{days}}
history = run_complex_contagion(model, g, days, rng, data)  # one named tuple per day
day = [row.t for row in history]
I = [row.I for row in history]

settled = I[(end - days ÷ 3):end]  # the last third of the run
println("Infectious at the end: ", I[end], " of ", people)
println("Mean over the last third: ", round(mean(settled); digits = 1), " (", round(100 * mean(settled) / people; digits = 1), "%)")
'''

[[codeBranches]]
model = "continuous"
code = '''
using GraphEpidemics, Graphs, Distributions, Random  # simulation; networks; distributions; seed

rng = Xoshiro({{seed}})  # fixed seed: the same network and epidemic on every run
people, contacts = {{people}}, {{contacts}}
even_contacts = 2 * round(Int, contacts / 2)

{{?network=random}}g = erdos_renyi(people, contacts / (people - 1); rng)
{{?network=scalefree}}g = barabasi_albert(people, even_contacts ÷ 2; rng)
{{?network=smallworld}}g = watts_strogatz(people, even_contacts, 0.1; rng)
{{?network=regular}}g = random_regular_graph(people, even_contacts; rng)

recovery = {{recovery}}
infection = beta_R0({{R0}}, g, recovery)  # rate of infection along one edge
model = SIRModel(infection, recovery)

first_cases = randperm(rng, people)[1:{{first-cases}}]
data, times, trace = run_sir_gillespie(g, model, rng, first_cases)  # one entry per event

S, I, R = eachrow(stack(trace))
println("Events: ", length(times) - 1)
println("Infected in all: ", R[end], " of ", people, " (", round(100 * R[end] / people; digits = 1), "%)")
println("Peak: ", maximum(I), " infectious at time ", round(times[argmax(I)]; digits = 1), ", over at time ", round(times[end]; digits = 1))
'''

