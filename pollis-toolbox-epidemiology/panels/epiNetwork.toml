[[actionGroups.actions]]
id = "compare-networks"
label = "Compare Networks"
desc = "The same infection on four networks with the same mean contacts"
models = ["sir"]
code = '''
networks = [
    "Random" => erdos_renyi(people, contacts / (people - 1); rng = Xoshiro({{seed}})),
    "Scale-Free" => barabasi_albert(people, even_contacts ÷ 2; rng = Xoshiro({{seed}})),
    "Small-World" => watts_strogatz(people, even_contacts, 0.1; rng = Xoshiro({{seed}})),
    "Regular" => random_regular_graph(people, even_contacts; rng = Xoshiro({{seed}})),
]
println(rpad("Network", 14), rpad("Large outbreak", 16), rpad("Mean size", 11), "Mean peak")
for (name, network) in networks
    network_runs = map(1:50) do s
        r = Xoshiro(s)
        result, counts = run_sir_fast(network, model, -1, r, randperm(r, people)[1:{{first-cases}}])
        (size = count(!isnan, result.infect_time), peak = maximum(stack(counts)[2, :]))
    end
    took_off = filter(run -> run.size > 0.05 * people, network_runs)
    println(rpad(name, 14), rpad(length(took_off) / 50, 16), rpad(round(Int, mean(run.size for run in took_off)), 11), round(Int, mean(run.peak for run in took_off)))
end
'''

[[actionGroups.actions]]
id = "compare-vaccination"
label = "Compare Vaccination Strategies"
desc = "One person in five vaccinated, at random or those with the most contacts first"
models = ["sir"]
code = '''
covered = round(Int, 0.2 * people)  # the people vaccinated
strategies = [
    "No vaccination" => Int[],
    "At random" => randperm(Xoshiro({{seed}}), people)[1:covered],
    "Most contacts first" => sortperm(degree(g); rev = true)[1:covered],
]
for (name, vaccinated) in strategies
    network, _ = induced_subgraph(g, setdiff(1:people, vaccinated))  # the vaccinated no longer pass it on
    strategy_sizes = map(1:50) do s
        r = Xoshiro(s)
        result, _ = run_sir_fast(network, model, -1, r, randperm(r, nv(network))[1:{{first-cases}}])
        count(!isnan, result.infect_time)
    end
    println(rpad(name, 22), "mean infected ", rpad(round(Int, mean(strategy_sizes)), 7), "largest ", maximum(strategy_sizes))
end
println("Most contacts first gains the most on a Scale-Free network, and nothing on a Regular one")
'''

[[actionGroups.actions]]
id = "compare-spreaders"
label = "Equal or Unequal Infectiousness"
desc = "The chance of a large outbreak and its size, with the same mean infectiousness"
models = ["seir"]
code = '''
for (name, spread) in (("Equal", ones(people)), ("Gamma shape 0.3", rand(Xoshiro({{seed}}), Gamma(0.3, 1 / 0.3), people)))
    unequal_model = SEIRHetModel(infection, spread, ones(people), latent, recovery)
    spreader_sizes = map(1:100) do s
        r = Xoshiro(s)
        result, _ = run_seir_fast(g, unequal_model, -1, r, randperm(r, people)[1:1])  # one first case, where chance matters most
        count(!isnan, result.infect_time)
    end
    took_off = filter(>(0.05 * people), spreader_sizes)
    println(rpad(name, 18), "chance of a large outbreak ", rpad(length(took_off) / 100, 6), "mean size ", isempty(took_off) ? "none" : round(Int, mean(took_off)))
end
println("With unequal infectiousness more introductions die out, and those infecting many reach the same contacts twice over, which also lowers the size")
'''

[[actionGroups.actions]]
id = "compare-latency"
label = "With and Without Latency"
desc = "The same epidemic with and without a latent period"
