[[actionGroups.actions]]
id = "secondary-cases"
label = "Secondary Cases"
desc = "How unevenly transmission was shared, read from who infected whom"
models = ["sir", "seir", "continuous"]
code = '''
infected = findall(!isnan, data.infect_time)
caused = zeros(Int, people)
for person in infected
    source = data.infect_node[person]
    source > 0 && (caused[Int(source)] += 1)  # the first cases have no source
end
secondary = sort(caused[infected]; rev = true)
top = secondary[1:ceil(Int, 0.2 * length(secondary))]
println("Secondary cases per case: mean ", round(mean(secondary); digits = 2), ", variance ", round(var(secondary); digits = 2))
println("Infected nobody: ", round(100 * mean(==(0), secondary); digits = 1), "% of cases")
println("Top 20% of cases caused ", round(100 * sum(top) / sum(secondary); digits = 1), "% of transmission")
println("A variance far above the mean is superspreading, here produced by the network and by the infectious periods")
'''

