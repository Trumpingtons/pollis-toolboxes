[[actionGroups.actions]]
id = "contacts-per-person"
label = "Contacts per Person"
desc = "The distribution of the number of contacts, which sets how the infection spreads"
models = ["sir", "seir", "recurring", "continuous"]
code = '''
using Plots

k = degree(g)
p = histogram(k; bins = 40, yscale = :log10, label = false, xlabel = "Contacts", ylabel = "People (log scale)", title = "Contacts per person")
display(p)
println("Mean ", round(mean(k); digits = 1), ", variance ", round(var(k); digits = 1), ", largest ", maximum(k))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "network-reproduction"
label = "Reproduction Number of the Network"
desc = "What the network really gives, against the Basic R that was entered"
models = ["sir", "continuous"]
code = '''
k = degree(g)
{{?model=sir}}transmissibility = infection / (infection + recovery - infection * recovery)  # chance an infectious person infects one contact, daily steps
{{?model=continuous}}transmissibility = infection / (infection + recovery)  # chance an infectious person infects one contact, rates
excess = (mean(k .^ 2) - mean(k)) / mean(k)  # contacts of a person reached along an edge, other than the one who infected them
println("Basic R entered:              ", {{R0}})
println("Chance of infecting a contact: ", round(transmissibility; digits = 3))
println("Further contacts of a case:   ", round(excess; digits = 1))
println("Reproduction number:          ", round(transmissibility * excess; digits = 2))
println("Each contact can be infected only once, which lowers it below Basic R; variation in contacts raises it, as people with many contacts are reached first")
'''

[[actionGroups.actions]]
id = "network-reproduction-seir"
label = "Reproduction Number of the Network"
desc = "What the network really gives, against the Basic R that was entered"
models = ["seir"]
code = '''
k = degree(g)
{{?spreaders=equal}}per_edge = [infection]
{{?spreaders=unequal}}per_edge = min.(infection .* infectiousness, 1.0)  # a chance cannot pass 1
transmissibility = mean(per_edge ./ (per_edge .+ recovery .- per_edge .* recovery))
excess = (mean(k .^ 2) - mean(k)) / mean(k)  # contacts of a person reached along an edge, other than the one who infected them
println("Basic R entered:              ", {{R0}})
println("Chance of infecting a contact: ", round(transmissibility; digits = 3))
println("Further contacts of a case:   ", round(excess; digits = 1))
println("Reproduction number:          ", round(transmissibility * excess; digits = 2))
'''

[[actionGroups.actions]]
id = "against-theory"
label = "Against Theory"
desc = "The final size in repeated simulations, against the size from this network's contact counts"
models = ["sir", "continuous"]
code = '''
k = degree(g)
{{?model=sir}}transmissibility = infection / (infection + recovery - infection * recovery)
{{?model=continuous}}transmissibility = infection / (infection + recovery)
missed = 0.5  # the chance that an edge does not bring infection, found by iteration
for _ in 1:2000
    global missed = sum(k .* (1 - transmissibility + transmissibility * missed) .^ (k .- 1)) / sum(k)
end
theory = 1 - mean((1 - transmissibility + transmissibility * missed) .^ k)

sizes = map(1:50) do s
    r = Xoshiro(s)
{{?model=sir}}    run = first(run_sir_fast(g, model, -1, r, randperm(r, people)[1:{{first-cases}}]))
{{?model=continuous}}    run = first(run_sir_gillespie(g, model, r, randperm(r, people)[1:{{first-cases}}]))
    count(!isnan, run.infect_time) / people
end
large = filter(>(0.05), sizes)
println("Theory, for a network with no clustering: ", round(theory; digits = 3))
println("Simulated, large outbreaks only:          ", isempty(large) ? "none" : round(mean(large); digits = 3), " (", length(large), " of 50 runs)")
println("A gap on the Small-World network comes from clustering, which the theory leaves out")
'''

[[actionGroups.actions]]
id = "effective-r"
label = "Effective R Over Time"
desc = "New infections per person infectious, times the infectious period, in a moving window"
models = ["sir", "seir"]
code = '''
using Plots

new_cases = [count(==(day), data.infect_time) for day in 0:length(I)-1]
window(day) = max(1, day - 3):min(length(I), day + 3)  # seven days around each day
effective = [sum(new_cases[window(day)]) / sum(I[window(day)]) / recovery for day in eachindex(I)]  # new infections per person infectious, times the infectious period
p = plot(0:length(I)-1, effective; label = "Effective R, 7-day window", xlabel = "Day", ylabel = "Effective R", title = "Effective R over time")
hline!(p, [1.0]; linestyle = :dash, color = :gray, label = "R = 1")
display(p)
'''

[[actionGroups.actions]]
id = "settled"
label = "Has It Settled?"
desc = "The mean over the second and last thirds of the run, and whether the infection was lost"
models = ["recurring"]
code = '''
third = days ÷ 3
middle = I[(third + 1):(2 * third)]
println("Second third: ", round(mean(middle); digits = 1), ", last third: ", round(mean(settled); digits = 1))
println("Standard deviation in the last third: ", round(std(settled); digits = 1))
if I[end] == 0
    println("The infection died out on day ", findfirst(==(0), I) - 1, ": the mean of the last third says nothing about a level")
else
    println("Close means say the run is long enough; if they differ, raise Days")
end
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "many-epidemics"
label = "Many Epidemics"
desc = "The chance of a large outbreak, and its size and peak, over 100 runs on this network"
models = ["sir", "seir", "continuous"]
code = '''
runs = map(1:100) do s
    r = Xoshiro(s)
    start = randperm(r, people)[1:{{first-cases}}]
{{?model=sir}}    result, counts = run_sir_fast(g, model, -1, r, start)
{{?model=sir}}    infectious = stack(counts)[2, :]
{{?model=seir}}    result, counts = run_seir_fast(g, model, -1, r, start)
{{?model=seir}}    infectious = stack(counts)[3, :]
{{?model=continuous}}    result, _, counts = run_sir_gillespie(g, model, r, start)
{{?model=continuous}}    infectious = stack(counts)[2, :]
    (size = count(!isnan, result.infect_time), peak = maximum(infectious))
end
large = filter(run -> run.size > 0.05 * people, runs)
println("Chance of a large outbreak: ", length(large) / length(runs))
if !isempty(large)
    println("Size:  median ", median(run.size for run in large), ", 90% range ", quantile([run.size for run in large], [0.05, 0.95]))
    println("Peak:  median ", median(run.peak for run in large), ", 90% range ", quantile([run.peak for run in large], [0.05, 0.95]))
end
'''

[[actionGroups.actions]]
id = "dying-out"
label = "Chance of Dying Out"
desc = "How many of 30 runs lose the infection, and the level of those that keep it"
models = ["recurring"]
code = '''
levels = map(1:30) do s
    r = Xoshiro(s)
    run = init_model_discrete(model, g, r, :S)
    set_state_nodes(model, run, r, randperm(r, people)[1:{{first-cases}}], :I, true)
    counts = [row.I for row in run_complex_contagion(model, g, days, r, run)]
    mean(counts[(end - days ÷ 3):end])
end
kept = filter(>(0), levels)
println("Lost the infection: ", length(levels) - length(kept), " of 30 runs")
isempty(kept) || println("Level where it stayed: ", round(mean(kept); digits = 1), " people, range ", round.(extrema(kept); digits = 1))
'''

