[[actionGroups.actions]]
id = "compare-order"
label = "Order of Arrival"
desc = "Strain 1 first, strain 2 first and both together, the second arriving 30 steps later, over 30 runs each"
models = ["two"]
code = '''
function run_in_order(first_strain, second_strain)
    population = Population([Individual(2, rand(0:40)) for _ in 1:hosts])
    infect!(population, first_strain, {{first-cases}})
    start = simulate(population, parameters(interactions, 31, :{{mixing}}))
    middle = start[end]
    infect!(middle, second_strain, {{first-cases}})
    vcat(start, simulate(middle, parameters(interactions, steps - 30, :{{mixing}}))[2:end])
end
scenarios = ["Together" => () -> run_two(interactions), "Strain 1 first" => () -> run_in_order(1, 2), "Strain 2 first" => () -> run_in_order(2, 1)]
println(rpad("Arrival", 18), rpad("Peak strain 1", 16), rpad("Peak strain 2", 16), "Peak coinfected")
for (name, simulate_order) in scenarios
    order_runs = map(1:30) do s
        Random.seed!(s)
        result = simulate_order()
        [maximum(tally(result, 1, infectious)), maximum(tally(result, 2, infectious)), maximum(both_infected(result))]
    end
    println(rpad(name, 18), rpad(round(mean(run[1] for run in order_runs); digits = 1), 16), rpad(round(mean(run[2] for run in order_runs); digits = 1), 16), round(mean(run[3] for run in order_runs); digits = 1))
end
'''

