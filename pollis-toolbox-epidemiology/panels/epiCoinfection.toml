[[models]]
id = "two"
label = "Two Strains"

[[models]]
id = "community"
label = "Strain Community"

[[models]]
id = "detection"
label = "Detection"

[[bullets]]
text = "Two Strains"
detail = "two strains in one host population, where being infected with one makes a host more or less likely to catch the other, so that the strains compete or help each other"

[[bullets]]
text = "Strain Community"
detail = "several strains with a random matrix of interactions, set by how strong they are and how many are competitive or facilitative, to see which strains persist and how many hosts carry several"

[[bullets]]
text = "Detection"
detail = "a survey of the simulated population with imperfect tests: what a sample of hosts would report, against what was really circulating"

[[decisionRows]]
task = "Two Strains"
context = "One known interaction, in each direction"
purpose = "The effect of competition or facilitation on peaks and coinfection, and of the order in which the strains arrive"

[[decisionRows]]
task = "Strain Community"
context = "Many strains; the interactions unknown or only described in general"
purpose = "How strength and sign of interactions change which strains persist and how many hosts are coinfected"

[[decisionRows]]
task = "Detection"
context = "A planned or real survey, with false positives and false negatives"
purpose = "How much sampling is needed, how much false positives distort a survey, and whether co-occurrence seen in detections reflects the truth"

[[inputs]]
id = "disease"
label = "Disease Model"
kind = "select"
default = "sir"
tooltip = "Applied to every strain. SI: no recovery. SIR: lasting immunity. SEIR: adds a latent period. SEIRS: adds a latent period and immunity that wanes."

[[inputs.options]]
value = "si"
label = "SI"

[[inputs.options]]
value = "sir"
label = "SIR"

[[inputs.options]]
value = "seir"
label = "SEIR"

[[inputs.options]]
value = "seirs"
label = "SEIRS"

[[inputs]]
id = "hosts"
label = "Hosts"
tooltip = "Number of hosts at the start."
default = "1000"

[[inputs]]
id = "steps"
label = "Time Steps"
tooltip = "Number of time steps simulated."
default = "200"

[[inputs]]
id = "mixing"
label = "Transmission"
kind = "select"
default = "frequency"
tooltip = "Frequency-Dependent: each susceptible host is infected with probability transmission x infected / hosts. Density-Dependent: with probability (transmission / starting hosts) x infected, so the two agree at the start and part as births and deaths change the number of hosts."

[[inputs.options]]
value = "frequency"
label = "Frequency-Dependent"

[[inputs.options]]
value = "density"
label = "Density-Dependent"

[[inputs]]
id = "transmission-1"
label = "Transmission, Strain 1"
tooltip = "Probability per time step, between 0 and 1."
default = "0.3"
models = ["two"]
newRow = true

[[inputs]]
id = "transmission-2"
label = "Transmission, Strain 2"
tooltip = "Probability per time step, between 0 and 1."
default = "0.25"
models = ["two"]

[[inputs]]
id = "transmission"
label = "Transmission"
tooltip = "Probability per time step, between 0 and 1, the same for every strain: differences among strains then come from the interactions and from chance."
default = "0.3"
models = ["community", "detection"]
newRow = true

[[inputs]]
id = "mortality"
label = "Disease Mortality"
tooltip = "Probability that an infected host dies of the infection in a time step."
default = "0.005"

[[inputs]]
id = "recovery"
label = "Recovery"
tooltip = "Probability of recovering in a time step. The mean infectious period is 1 / this."
default = "0.1"
when = "disease=sir|seir|seirs"

[[inputs]]
id = "latency"
label = "Latent Period"
tooltip = "Mean number of time steps before an exposed host becomes infectious (a whole number)."
default = "5"
when = "disease=seir|seirs"

[[inputs]]
id = "immunity-loss"
label = "Loss of Immunity"
tooltip = "Probability per time step that a recovered host becomes susceptible again."
default = "0.02"
when = "disease=seirs"

[[inputs]]
id = "effect-of-2-on-1"
label = "Effect of Strain 2 on Strain 1"
tooltip = "Multiplies the chance of catching strain 1 for a host infected with strain 2. Below 1: competition. Above 1: facilitation. 1: no interaction."
default = "2.0"
models = ["two"]
newRow = true

[[inputs]]
id = "effect-of-1-on-2"
label = "Effect of Strain 1 on Strain 2"
tooltip = "Multiplies the chance of catching strain 2 for a host infected with strain 1. Below 1: competition. Above 1: facilitation. 1: no interaction."
default = "0.5"
models = ["two"]

[[inputs]]
id = "first-cases"
label = "First Cases per Strain"
tooltip = "Number of hosts infected with each strain at the start, chosen at random."
default = "5"
models = ["two"]

[[inputs]]
id = "strains"
label = "Strains"
tooltip = "Number of strains."
default = "6"
models = ["community", "detection"]
newRow = true

[[inputs]]
id = "strength"
label = "Interaction Strength"
tooltip = "Between 0 and 1. Interactions are drawn between 1 - this and 1 + this. At 0 the strains do not interact."
default = "0.8"
models = ["community", "detection"]

[[inputs]]
id = "facilitation"
label = "Share Facilitative"
tooltip = "Between 0 and 1: the share of interactions above 1, the rest being below 1."
default = "0.5"
models = ["community", "detection"]

[[inputs]]
id = "priority"
label = "Priority Effects"
kind = "select"
default = "true"
models = ["community", "detection"]
tooltip = "On: the effect of one strain on another differs from the effect of the other on it, so the order of arrival can matter. Off: both effects are equal."

[[inputs.options]]
value = "true"
label = "On"

[[inputs.options]]
value = "false"
label = "Off"

[[inputs]]
id = "arrival"
label = "Arrival of Strains"
kind = "select"
default = "simultaneous"
models = ["community", "detection"]
tooltip = "Together: one host infected with each strain at the first step. At Random Times: each strain arrives at a random step of the run, which can be too late to spread."

[[inputs.options]]
value = "simultaneous"
label = "Together"

[[inputs.options]]
value = "random"
label = "At Random Times"

[[inputs]]
id = "sampled"
label = "Share Sampled"
tooltip = "Share of hosts tested at each time step, between 0 and 1."
default = "0.05"
models = ["detection"]
newRow = true

[[inputs]]
id = "false-positive"
label = "False Positive Rate"
tooltip = "Chance that a test of a host not infected with the strain is positive."
default = "0.001"
models = ["detection"]

[[inputs]]
id = "false-negative"
label = "False Negative Rate"
tooltip = "Chance that a test of a host infected with the strain is negative."
default = "0.1"
models = ["detection"]

[[inputs]]
id = "base-mortality"
label = "Background Mortality"
tooltip = "Probability that a host dies of other causes in a time step."
default = "0.001"
newRow = true

[[inputs]]
id = "fecundity"
label = "Births per Mature Host"
tooltip = "Mean number of births per mature host in a time step. New hosts are susceptible to every strain."
default = "0.002"

[[inputs]]
id = "maturity"
label = "Age of Maturity"
tooltip = "Age, in time steps, from which a host can give birth (a whole number)."
default = "20"

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Random seed. The package draws from Julia's global random numbers."
default = "42"

[[codeBranches]]
model = "two"
code = '''
using CoinfectionSimulator, Random, Statistics  # simulation; seed; means

Random.seed!({{seed}})  # the package draws from the global random numbers
hosts, steps = {{hosts}}, {{steps}}
susceptible, exposed, infectious, recovered = 1, 2, 3, 4  # the columns of a host's state

{{?disease=si}}model_of(transmission) = SIModel(transmission, {{mortality}})
{{?disease=sir}}model_of(transmission) = SIRModel(transmission, {{mortality}}, {{recovery}})
{{?disease=seir}}model_of(transmission) = SEIRModel(transmission, {{mortality}}, {{recovery}}, {{latency}})
{{?disease=seirs}}model_of(transmission) = SEIRSModel(transmission, {{mortality}}, {{recovery}}, {{latency}}, {{immunity-loss}})
# Density-dependent transmission is per infected host: divided by the starting hosts, both kinds agree at the start
rate(transmission, mixing) = mixing == :density ? transmission / hosts : transmission
models(mixing) = [model_of(rate({{transmission-1}}, mixing)), model_of(rate({{transmission-2}}, mixing))]

# Row i, column j: multiplies the chance of catching strain i for a host infected with strain j
interactions = [1.0 {{effect-of-2-on-1}};
                {{effect-of-1-on-2}} 1.0]

parameters(matrix, time_steps, mixing) = SimulationParameters(models(mixing), matrix, float({{base-mortality}}), float({{fecundity}}), {{maturity}}, :none, time_steps, mixing)

function infect!(population, strain, cases)
    for host in randperm(length(population))[1:cases]
        population[host][strain, susceptible] = false
        population[host][strain, infectious] = true
    end
end

function run_two(matrix; mixing = :{{mixing}})
    population = Population([Individual(2, rand(0:40)) for _ in 1:hosts])
    infect!(population, 1, {{first-cases}})
    infect!(population, 2, {{first-cases}})
    simulate(population, parameters(matrix, steps, mixing))
end

tally(runs, strain, state) = [count(host -> host[strain, state], population) for population in runs]
both_infected(runs) = [count(host -> host[1, infectious] && host[2, infectious], population) for population in runs]

populations = run_two(interactions)

infected = [tally(populations, 1, infectious) tally(populations, 2, infectious)]
coinfected = both_infected(populations)
for strain in 1:2
    met = length(populations[end]) - tally(populations[end:end], strain, susceptible)[1]
    println("Strain ", strain, ": peak ", maximum(infected[:, strain]), " infected at step ", argmax(infected[:, strain]), ", ", met, " of the hosts at the end have had it")
end
println("Coinfected: peak ", maximum(coinfected), " at step ", argmax(coinfected))
println("Hosts: ", hosts, " at the start, ", length(populations[end]), " at the end")
'''

[[codeBranches]]
model = "community"
code = '''
using CoinfectionSimulator, Random, Statistics  # simulation; seed; means

Random.seed!({{seed}})  # the package draws from the global random numbers
hosts, steps, strains = {{hosts}}, {{steps}}, {{strains}}
susceptible, exposed, infectious, recovered = 1, 2, 3, 4  # the columns of a host's state

{{?disease=si}}model_of(transmission) = SIModel(transmission, {{mortality}})
{{?disease=sir}}model_of(transmission) = SIRModel(transmission, {{mortality}}, {{recovery}})
{{?disease=seir}}model_of(transmission) = SEIRModel(transmission, {{mortality}}, {{recovery}}, {{latency}})
{{?disease=seirs}}model_of(transmission) = SEIRSModel(transmission, {{mortality}}, {{recovery}}, {{latency}}, {{immunity-loss}})
{{?mixing=frequency}}strain_models = fill(model_of({{transmission}}), strains)
{{?mixing=density}}strain_models = fill(model_of({{transmission}} / hosts), strains)  # per infected host: both kinds agree at the start

# Row i, column j: multiplies the chance of catching strain i for a host infected with strain j
interactions = create_interaction_matrix(strains, {{priority}}, {{strength}}; cf_ratio = {{facilitation}})

function run_community(matrix)
    population = Population([Individual(strains, rand(0:40)) for _ in 1:hosts])
    simulate(population, SimulationParameters(strain_models, matrix, float({{base-mortality}}), float({{fecundity}}), {{maturity}}, :{{arrival}}, steps, :{{mixing}}))
end

tally(runs, strain, state) = [count(host -> host[strain, state], population) for population in runs]
infected_by_strain(runs) = reduce(hcat, [tally(runs, strain, infectious) for strain in 1:strains])
coinfected_hosts(runs) = [count(host -> count(host[:, infectious]) >= 2, population) for population in runs]

populations = run_community(interactions)

infected = infected_by_strain(populations)
coinfected = coinfected_hosts(populations)
println("Strains that spread (peak above 1% of hosts): ", count(>(0.01 * hosts), vec(maximum(infected; dims = 1))), " of ", strains)
println("Peak infected by strain: ", vec(maximum(infected; dims = 1)))
println("Hosts with two or more strains: peak ", maximum(coinfected), " at step ", argmax(coinfected))
println("Hosts: ", hosts, " at the start, ", length(populations[end]), " at the end")
'''

[[codeBranches]]
model = "detection"
code = '''
using CoinfectionSimulator, Random, Statistics  # simulation; seed; means

Random.seed!({{seed}})  # the package draws from the global random numbers
hosts, steps, strains = {{hosts}}, {{steps}}, {{strains}}
susceptible, exposed, infectious, recovered = 1, 2, 3, 4  # the columns of a host's state

{{?disease=si}}model_of(transmission) = SIModel(transmission, {{mortality}})
{{?disease=sir}}model_of(transmission) = SIRModel(transmission, {{mortality}}, {{recovery}})
{{?disease=seir}}model_of(transmission) = SEIRModel(transmission, {{mortality}}, {{recovery}}, {{latency}})
{{?disease=seirs}}model_of(transmission) = SEIRSModel(transmission, {{mortality}}, {{recovery}}, {{latency}}, {{immunity-loss}})
{{?mixing=frequency}}strain_models = fill(model_of({{transmission}}), strains)
{{?mixing=density}}strain_models = fill(model_of({{transmission}} / hosts), strains)  # per infected host: both kinds agree at the start

# Row i, column j: multiplies the chance of catching strain i for a host infected with strain j
interactions = create_interaction_matrix(strains, {{priority}}, {{strength}}; cf_ratio = {{facilitation}})

population = Population([Individual(strains, rand(0:40)) for _ in 1:hosts])
populations = simulate(population, SimulationParameters(strain_models, interactions, float({{base-mortality}}), float({{fecundity}}), {{maturity}}, :{{arrival}}, steps, :{{mixing}}))

tally(runs, strain, state) = [count(host -> host[strain, state], population) for population in runs]
infected = reduce(hcat, [tally(populations, strain, infectious) for strain in 1:strains])
present = infected .> 0  # steps by strains: what was really circulating

survey = SamplingParameters(float({{sampled}}), float({{false-positive}}), float({{false-negative}}))
detected = sample_populations(populations, survey)  # steps by strains: what the survey reports

println("Steps with a strain circulating: ", vec(sum(present; dims = 1)))
println("Steps with a strain detected:    ", vec(sum(detected; dims = 1)))
println("Steps correctly classified:      ", round(100 * mean(present .== detected); digits = 1), "%")
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "curves-two"
label = "Infected and Coinfected"
desc = "Hosts infected with each strain and with both, by time step"
models = ["two"]
code = '''
using Plots

p = plot(0:steps-1, [infected coinfected]; label = ["Strain 1" "Strain 2" "Both"], xlabel = "Time step", ylabel = "Hosts", title = "Infected hosts")
display(p)
'''

[[actionGroups.actions]]
id = "states-two"
label = "States of Each Strain"
desc = "Hosts in each state for the two strains, side by side"
models = ["two"]
code = '''
using Plots

panels = map(1:2) do strain
    states = reduce(hcat, [tally(populations, strain, state) for state in (susceptible, exposed, infectious, recovered)])
    plot(0:steps-1, states; label = ["Susceptible" "Exposed" "Infectious" "Recovered"], xlabel = "Time step", ylabel = "Hosts", title = "Strain $strain")
end
p = plot(panels...; layout = (1, 2), size = (900, 400))
display(p)
'''

[[actionGroups.actions]]
