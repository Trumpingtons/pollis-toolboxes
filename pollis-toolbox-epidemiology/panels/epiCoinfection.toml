    was, found = present[:, strain], detected[:, strain]
    sensitivity = any(was) ? round(mean(found[was]); digits = 2) : "none circulating"
    specificity = all(was) ? "always circulating" : round(mean(.!found[.!was]); digits = 2)
    println("Strain ", rpad(strain, 3), "sensitivity ", rpad(sensitivity, 8), "specificity ", specificity)
end
