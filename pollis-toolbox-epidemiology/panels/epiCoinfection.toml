using Plots

p = heatmap(1:strains, 1:strains, interactions; yflip = true, color = :RdBu, clims = (0.0, 2.0), xlabel = "Strain already in the host", ylabel = "Strain being caught", title = "Interaction matrix", aspect_ratio = 1)
display(p)
'''

[[actionGroups.actions]]
id = "curves-community"
label = "Infected by Strain"
desc = "Hosts infected with each strain, and hosts with two or more"
models = ["community"]
code = '''
using Plots

p = plot(0:steps-1, infected; label = permutedims(["Strain $s" for s in 1:strains]), xlabel = "Time step", ylabel = "Hosts", title = "Infected by strain")
plot!(p, 0:steps-1, coinfected; color = :black, linewidth = 2, label = "Two or more")
display(p)
'''

[[actionGroups.actions]]
id = "detection-grid"
label = "Truth and Detections"
desc = "When each strain was circulating, and when the survey detected it"
models = ["detection"]
code = '''
using Plots

truth = heatmap(0:steps-1, 1:strains, permutedims(Int.(present)); color = :Blues, colorbar = false, xlabel = "Time step", ylabel = "Strain", title = "Circulating")
seen = heatmap(0:steps-1, 1:strains, permutedims(Int.(detected)); color = :Blues, colorbar = false, xlabel = "Time step", ylabel = "Strain", title = "Detected")
p = plot(truth, seen; layout = (2, 1), size = (800, 500))
display(p)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "run-to-run-two"
label = "Run-to-Run Variation"
desc = "How much the peaks vary across 30 runs with the same settings, for judging any one run"
models = ["two"]
code = '''
runs = map(1:30) do s
    Random.seed!(s)
    result = run_two(interactions)
    (one = maximum(tally(result, 1, infectious)), two = maximum(tally(result, 2, infectious)), both = maximum(both_infected(result)))
end
for (name, values) in (("Strain 1", [run.one for run in runs]), ("Strain 2", [run.two for run in runs]), ("Both", [run.both for run in runs]))
    println(rpad(name, 10), "peak: mean ", round(mean(values); digits = 1), ", standard deviation ", round(std(values); digits = 1), ", range ", extrema(values))
end
'''

[[actionGroups.actions]]
id = "against-independence"
label = "Coinfection Against Chance"
desc = "Coinfected hosts against the number expected if the two strains ignored each other"
models = ["two"]
code = '''
using Plots

alive = length.(populations)
expected = infected[:, 1] .* infected[:, 2] ./ alive  # if the two infections were independent
p = plot(0:steps-1, coinfected; label = "Coinfected", xlabel = "Time step", ylabel = "Hosts", title = "Coinfection against chance")
plot!(p, 0:steps-1, expected; linestyle = :dash, label = "Expected by chance")
display(p)
println("Coinfected host-steps: ", sum(coinfected), ", expected by chance: ", round(Int, sum(expected)))
println("Ratio: ", round(sum(coinfected) / sum(expected); digits = 2), ". Compare it with a run with both effects set to 1")
'''

[[actionGroups.actions]]
id = "matrix-summary"
label = "Matrix Summary"
desc = "The drawn interactions: how many are competitive and facilitative, and their range"
models = ["community", "detection"]
code = '''
effects = [interactions[i, j] for i in 1:strains for j in 1:strains if i != j]
println("Interactions: ", length(effects))
println("Competitive (below 1): ", count(<(1), effects), ", facilitative (above 1): ", count(>(1), effects), ", neutral: ", count(==(1), effects))
println("Range: ", round.(extrema(effects); digits = 2), ", mean ", round(mean(effects); digits = 2))
println("Symmetric: ", interactions ≈ transpose(interactions))
println("One draw of the matrix: Compare runs several")
'''

[[actionGroups.actions]]
id = "run-to-run-community"
label = "Run-to-Run Variation"
desc = "How much the strains' peaks vary across 20 runs with the same matrix"
models = ["community"]
code = '''
peaks = reduce(hcat, map(1:20) do s
    Random.seed!(s)
    vec(maximum(infected_by_strain(run_community(interactions)); dims = 1))
end)
for strain in 1:strains
    println("Strain ", rpad(strain, 3), "peak: mean ", rpad(round(mean(peaks[strain, :]); digits = 1), 8), "standard deviation ", rpad(round(std(peaks[strain, :]); digits = 1), 8), "runs where it failed to spread ", count(<(0.01 * hosts), peaks[strain, :]))
end
'''

