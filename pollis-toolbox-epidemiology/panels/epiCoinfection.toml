[[actionGroups.actions]]
id = "interaction-effect"
label = "What the Interactions Change"
desc = "Infected host-steps of each strain with and without the interactions, over 30 runs"
models = ["two"]
code = '''
function burden(matrix)
    runs = map(1:30) do s
        Random.seed!(s)
        result = run_two(matrix)
        [sum(tally(result, 1, infectious)), sum(tally(result, 2, infectious))]
    end
    mean(runs)
end
with_effects = burden(interactions)
without_effects = burden([1.0 1.0; 1.0 1.0])
for strain in 1:2
    println("Strain ", strain, ": ", round(Int, with_effects[strain]), " infected host-steps with the interactions, ", round(Int, without_effects[strain]), " without, a change of ", round(100 * (with_effects[strain] / without_effects[strain] - 1); digits = 1), "%")
end
println("Only hosts infectious with both strains at once feel the effect, so it is smaller than the factors entered")
'''

