[[actionGroups.actions]]
id = "size-if-contained"
label = "Size of a Contained Outbreak"
desc = "Quantiles of the size of the outbreaks that ended, and the chance of passing given sizes"
models = ["contain"]
code = '''
ended_sizes = [s.cumulative_cases for s in results if s.extinct && s.cumulative_cases < cap]
println("Size of a contained outbreak: median ", median(ended_sizes), ", 90th percentile ", quantile(ended_sizes, 0.9), ", largest ", maximum(ended_sizes))
for threshold in (10, 50, 100, 500)
    println("Chance of at least ", threshold, " cases: ", round(mean(s.cumulative_cases >= threshold for s in results); digits = 3))
end
'''

[[actionGroups.actions]]
id = "introductions"
label = "Several Introductions"
desc = "The chance of an epidemic from several independent introductions"
models = ["exact"]
code = '''
q = extinction_probability(offspring)
for introductions in (1, 2, 5, 10, 20)
