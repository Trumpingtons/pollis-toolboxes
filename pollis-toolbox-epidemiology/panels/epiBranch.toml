[[actionGroups.actions]]
id = "end-of-outbreak-exact"
label = "End of an Outbreak"
desc = "The chance that transmission is over, by days since the last case"
models = ["exact"]
code = '''
using Plots

days = collect(0.0:60.0)
gt = LogNormal(1.6, 0.5)  # generation time in days, median about 5
p = plot(days, end_of_outbreak_probability({{R-chains}}, k, gt, days); xlabel = "Days since the last case", ylabel = "Chance no further case follows", label = "One case, R = {{R-chains}}, k = $k", title = "End of an outbreak")
display(p)
'''

[[actionGroups.actions]]
id = "epidemic-chance"
label = "Chance of an Epidemic"
desc = "The posterior of the chance that one new introduction starts an epidemic"
models = ["fit"]
code = '''
chance = [epidemic_probability(r, d; max_iter = 100_000) for (r, d) in zip(R_draws, k_draws)]  # slow to converge with R near 1
low, mid, high = quantile(chance, [0.025, 0.5, 0.975])
println("Chance of an epidemic from one introduction: median ", round(mid; digits = 3), ", 95% credible interval [", round(low; digits = 3), ", ", round(high; digits = 3), "]")
'''

[[actionGroups.actions]]
id = "end-of-outbreak-cases"
label = "End of This Outbreak"
desc = "The chance that this outbreak is over, by days after its last symptom onset"
models = ["cases"]
code = '''
has_onset = findall(!ismissing, cases.date_onset)
onsets = cases.date_onset[has_onset]
secondary = [count(isequal(cases.id[i]), cases.parent_id) for i in has_onset]  # known onward cases of each
for days_after in (7, 14, 21, 28, 42)
    since_onset = [Float64(Dates.value(maximum(onsets) - d) + days_after) for d in onsets]
    over = end_of_outbreak_probability(NegBin({{R}}, {{k}}), {{generation-time}}, since_onset, secondary)
    println(rpad(days_after, 3), " days after the last onset: chance it is over ", round(over; digits = 3))
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compare-measures"
label = "Compare Measures"
desc = "Containment with no measures, with isolation, with tracing, and with post-exposure vaccination"
models = ["contain"]
code = '''
iso_all = Isolation(onset_to_isolation_delay = Exponential({{isolation-delay}}), duration = {{duration}})
ct_all = ContactTracing(probability = {{trace-probability}}, isolation_to_trace_delay = Exponential({{trace-delay}}), action = Quarantine(duration = {{duration}}))
rv_all = RingVaccination(efficacy = 0.0, post_exposure_efficacy = {{post-exposure}})
scenarios = [
    "No measures" => AbstractIntervention[],
    "Isolation" => [iso_all],
    "Isolation and tracing" => [iso_all, ct_all],
    "Isolation, tracing and vaccination" => [iso_all, ct_all, rv_all],
]
for (name, measures) in scenarios
    spec = ModelSpec(process; interventions = measures, attributes = clinical)
    share = containment_probability(spec, n_sim; max_cases = cap, rng = Xoshiro({{seed}}))
    println(rpad(name, 36), round(share; digits = 3), " +/- ", round(1.96 * sqrt(share * (1 - share) / n_sim); digits = 3))
end
println("A difference inside the margins is no evidence: raise the outbreaks simulated before reading it")
'''

[[actionGroups.actions]]
id = "compare-tracing"
label = "Compare Tracing Levels"
desc = "Containment as the tracing probability goes from 0 to 1"
models = ["contain"]
code = '''
using Plots

levels = 0.0:0.2:1.0
shares = map(levels) do level
    tracing = ContactTracing(probability = level, isolation_to_trace_delay = Exponential({{trace-delay}}), action = Quarantine(duration = {{duration}}))
    spec = ModelSpec(process; interventions = [iso, tracing], attributes = clinical)
    containment_probability(spec, n_sim; max_cases = cap, rng = Xoshiro({{seed}}))
end
p = plot(levels, shares; marker = :circle, label = "Isolation and tracing", xlabel = "Tracing probability", ylabel = "Containment probability", title = "How much tracing is enough")
hline!(p, [uncontrolled]; linestyle = :dash, color = :gray, label = "Dying out by chance alone")
display(p)
'''

