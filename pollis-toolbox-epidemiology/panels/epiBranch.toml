[[actionGroups.actions]]
id = "compare-poisson"
label = "Poisson or Negative Binomial"
desc = "AIC of Poisson offspring, with R on a grid, against the negative binomial at the maximum-likelihood estimates"
models = ["fit"]
code = '''
{{?data=offspring}}observed = OffspringCounts(data)
{{?data=chains}}observed = ChainSizes(data)
{{?data=offspring}}R_grid = 0.05:0.005:5.0
{{?data=chains}}R_grid = 0.05:0.005:0.995
ll_poisson = maximum(loglikelihood(observed, Poisson(r)) for r in R_grid)
ll_negbin = loglikelihood(observed, NegBin(est.R, est.k))
println("Poisson:           log-likelihood ", round(ll_poisson; digits = 1), ", AIC ", round(2 - 2 * ll_poisson; digits = 1))
println("Negative binomial: log-likelihood ", round(ll_negbin; digits = 1), ", AIC ", round(4 - 2 * ll_negbin; digits = 1))
println("The lower AIC is preferred: a large gap against Poisson is evidence of superspreading")
'''

[[actionGroups.actions]]
id = "compare-curves"
label = "Onset and Reporting Curves"
desc = "Weekly cases by symptom onset against weekly cases by reporting"
models = ["cases"]
code = '''
using Plots

by_onset = Tables.columntable(weekly_incidence(outbreak; reference_date = start))
by_report = Tables.columntable(weekly_incidence(outbreak; by = :reporting, reference_date = start))
p = plot(by_onset.week, by_onset.cases; marker = :circle, label = "By onset", xlabel = "Week", ylabel = "Cases", title = "What the reporting delay does to the curve")
plot!(p, by_report.week, by_report.cases; marker = :circle, label = "By reporting")
display(p)
'''

