[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "monte-carlo-error"
label = "Monte Carlo Error"
desc = "The standard error of the containment probability, and how many outbreaks each stopping rule ended"
models = ["contain"]
code = '''
se = sqrt(contained * (1 - contained) / n_sim)  # a share estimated from n_sim outbreaks
println("Containment: ", round(contained; digits = 3), ", standard error ", round(se; digits = 3))
println("Ended by themselves:     ", count(s -> s.extinct && s.cumulative_cases < cap, results))
println("Reached the case cap:    ", count(s -> s.cumulative_cases >= cap, results))
println("Stopped at the generation limit: ", count(s -> !s.extinct && s.cumulative_cases < cap, results))
'''

[[actionGroups.actions]]
id = "generation-ratio"
label = "Generation Ratio"
desc = "Cases in each generation over cases in the one before, in runs of six generations with no case cap"
models = ["contain"]
code = '''
using Plots, Tables

bounded = simulate(model, 200; max_cases = nothing, max_generations = 6, rng = Xoshiro({{seed}}))  # complete ratios up to the bound
ratios = [Tables.columntable(generation_R(s)) for s in bounded]
generations = 0:5
mean_ratio = [mean(vcat([r.offspring_ratio[r.generation .== g] for r in ratios]...)) for g in generations]
p = plot(generations, mean_ratio; marker = :circle, label = "Mean over outbreaks still going", xlabel = "Generation", ylabel = "Cases in the next / cases in this", title = "Generation ratio")
hline!(p, [1.0]; linestyle = :dash, color = :gray, label = "Ratio 1")
display(p)
'''

[[actionGroups.actions]]
id = "against-simulation"
label = "Against Simulation"
desc = "The exact chance of dying out, against the share of simulated outbreaks that die out"
models = ["exact"]
code = '''
using Random

runs = simulate(BranchingProcess(offspring, Exponential(5.0)), 1000; max_cases = 10_000, max_generations = 200, rng = Xoshiro({{seed}}))
simulated = containment_probability(runs)
println("Exact:     ", round(extinction_probability(offspring); digits = 3))
println("Simulated: ", round(simulated; digits = 3), ", standard error ", round(sqrt(simulated * (1 - simulated) / 1000); digits = 3))
'''

[[actionGroups.actions]]
id = "convergence"
label = "Convergence"
desc = "R-hat and effective sample sizes of R and k"
models = ["fit"]
code = '''
using Turing.FlexiChains: rhat, ess

for name in (:R, :k)
    println(name, ": R-hat ", round(rhat(posterior[name]); digits = 3), ", bulk ESS ", round(Int, ess(posterior[name]; kind = :bulk)), ", tail ESS ", round(Int, ess(posterior[name]; kind = :tail)))
end
println("R-hat should be below 1.01, and each ESS in the hundreds at least")
'''

[[actionGroups.actions]]
id = "predictive-check"
label = "Posterior Predictive Check"
desc = "The share of the smallest count and the largest value in the data, against datasets drawn from the posterior"
models = ["fit"]
code = '''
draw_rows = rand(Xoshiro({{seed}}), eachindex(R_draws), 500)
{{?data=offspring}}smallest = 0
{{?data=offspring}}replicate(i) = rand(NegBin(R_draws[i], k_draws[i]), length(data))
{{?data=chains}}smallest = 1
{{?data=chains}}replicate(i) = rand(chain_size_distribution(NegBin(min(R_draws[i], 0.99), k_draws[i])), length(data))  # chain sizes need R below 1
replicates = [replicate(i) for i in draw_rows]
share_rep = [mean(==(smallest), r) for r in replicates]
largest_rep = [maximum(r) for r in replicates]
println("Share equal to ", smallest, ": data ", round(mean(==(smallest), data); digits = 3), ", 90% predictive interval ", round.(quantile(share_rep, [0.05, 0.95]); digits = 3))
println("Largest value: data ", maximum(data), ", 90% predictive interval ", round.(Int, quantile(largest_rep, [0.05, 0.95])))
'''

[[actionGroups.actions]]
id = "chain-statistics"
label = "Chains and Offspring"
desc = "The size of each chain, and the mean and variance of the secondary cases per case in this outbreak"
models = ["cases"]
code = '''
chains = Tables.columntable(chain_statistics(outbreak))
secondary = [count(isequal(id), cases.parent_id) for id in cases.id]
println("Chains: ", length(chains.size), ", largest ", maximum(chains.size), " cases, longest ", maximum(chains.length), " generations")
println("Secondary cases per case: mean ", round(mean(secondary); digits = 2), ", variance ", round(var(secondary); digits = 2))
println("An outbreak chosen by its size is a selected one: these need not match the R and k of the model")
'''

