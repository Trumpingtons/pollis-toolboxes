[[models]]
id = "contain"
label = "Containment"

[[models]]
id = "exact"
label = "Superspreading"

[[models]]
id = "fit"
label = "Estimating R and k"

[[models]]
id = "cases"
label = "Line Lists"

[[bullets]]
text = "Containment"
detail = "simulate many outbreaks from one introduced case under isolation, contact tracing and post-exposure vaccination, and count how often transmission stops"

[[bullets]]
text = "Superspreading"
detail = "exact results from the offspring distribution with mean R and dispersion k: the chance that an introduction dies out, the share of transmission from the most infectious cases, the distribution of chain sizes when R is below 1"

[[bullets]]
text = "Estimating R and k"
detail = "fit R and k to offspring counts or chain sizes, by maximum likelihood and with the Turing.jl NUTS sampler, on the same exact likelihood"

[[bullets]]
text = "Line Lists"
detail = "turn one simulated outbreak into the tables surveillance would hold: one row per case with onset, reporting, admission and outcome dates, and one row per contact"

[[decisionRows]]
task = "Containment"
context = "Offspring and delay distributions assumed; measures in force"
purpose = "Ask how often a set of measures stops an outbreak, and what each measure adds"

[[decisionRows]]
task = "Superspreading"
context = "R and k assumed; no control"
purpose = "Exact answers without simulation: chance of an epidemic, share of transmission from the top cases, chain sizes"

[[decisionRows]]
task = "Estimating R and k"
context = "Secondary cases per case, or final cluster sizes"
purpose = "Estimate R and k with intervals, from counts or from clusters that have finished growing"

[[decisionRows]]
task = "Line Lists"
context = "A model with a clinical course"
purpose = "Produce data shaped like a real outbreak's, to test an analysis before the real data arrive"

[[inputs]]
id = "R"
label = "R"
tooltip = "Reproduction number: the mean number of secondary cases per case with no control."
default = "2.5"
models = ["contain", "exact", "cases"]

[[inputs]]
id = "k"
label = "Dispersion k"
tooltip = "Dispersion of the negative binomial offspring distribution. Smaller k means more superspreading: most cases infect nobody and a few infect many."
default = "0.16"
models = ["contain", "exact", "cases"]

[[inputs]]
id = "generation-time"
label = "Generation Time (days)"
tooltip = "Time from the infection of an infector to the infection of the person it infects, as a Distributions.jl distribution. LogNormal takes the mean and standard deviation of the log."
default = "LogNormal(1.6, 0.5)"
models = ["contain", "cases"]

[[inputs]]
id = "incubation"
label = "Incubation Period (days)"
tooltip = "Time from infection to symptom onset, as a Distributions.jl distribution."
default = "LogNormal(1.5, 0.5)"
models = ["contain", "cases"]

[[inputs]]
id = "measures"
label = "Measures"
kind = "select"
default = "tracing"
models = ["contain"]
newRow = true
tooltip = "The control measures in the model. Next Steps > Compare runs them all."

[[inputs.options]]
value = "isolation"
label = "Isolation"

[[inputs.options]]
value = "tracing"
label = "Isolation and Contact Tracing"

[[inputs.options]]
value = "ring"
label = "Isolation, Tracing and Post-Exposure Vaccination"

[[inputs]]
id = "isolation-delay"
label = "Onset to Isolation (days)"
tooltip = "Mean of the exponential delay from symptom onset to isolation."
default = "2.0"
models = ["contain"]

[[inputs]]
id = "duration"
label = "Isolation Length (days)"
tooltip = "How long isolation and quarantine last. A person released while still infectious can transmit again. Inf means never released."
default = "7.0"
models = ["contain"]

[[inputs]]
id = "trace-probability"
label = "Tracing Probability"
tooltip = "Probability that each contact of an isolated case is traced."
default = "0.5"
models = ["contain"]
when = "measures=tracing|ring"

[[inputs]]
id = "trace-delay"
label = "Isolation to Trace (days)"
tooltip = "Mean of the exponential delay from the isolation of a case to the tracing of its contact."
default = "1.5"
models = ["contain"]
when = "measures=tracing|ring"

[[inputs]]
id = "post-exposure"
label = "Post-Exposure Efficacy"
tooltip = "Probability that a dose given to a traced contact before symptom onset stops the infection the contact already has."
default = "0.6"
models = ["contain"]
when = "measures=ring"

[[inputs]]
id = "n-sim"
label = "Outbreaks"
tooltip = "Number of outbreaks simulated, each from one introduced case."
default = "500"
models = ["contain"]
newRow = true

[[inputs]]
id = "max-cases"
label = "Case Cap"
tooltip = "An outbreak that reaches this many cases is stopped and counts as not contained."
default = "5000"
models = ["contain"]

[[inputs]]
id = "R-chains"
label = "R for Chain Sizes"
tooltip = "Reproduction number for the chain size distribution. It must be below 1, so that every chain ends."
default = "0.8"
models = ["exact"]

[[inputs]]
id = "top-share"
label = "Top Share of Cases"
tooltip = "The share of most infectious cases whose part of transmission is reported, between 0 and 1."
default = "0.2"
models = ["exact"]

[[inputs]]
id = "data"
label = "Data"
kind = "select"
default = "offspring"
models = ["fit"]
tooltip = "Offspring counts: the secondary cases of each case. Chain sizes: the final number of cases in each cluster, which assumes each cluster has finished growing, so R must be below 1."

[[inputs.options]]
value = "offspring"
label = "Offspring Counts"

[[inputs.options]]
value = "chains"
label = "Chain Sizes"

[[inputs]]
id = "true-R"
label = "True R"
tooltip = "R of the simulated data."
default = "0.8"
models = ["fit"]

[[inputs]]
id = "true-k"
label = "True k"
tooltip = "Dispersion of the simulated data."
default = "0.5"
models = ["fit"]

[[inputs]]
id = "n-obs"
label = "Observations"
tooltip = "Number of cases, or of clusters. With few observations the interval for k is wide and often has no upper limit."
default = "200"
models = ["fit"]

[[inputs]]
id = "samples"
label = "NUTS Samples"
tooltip = "Posterior draws per chain, after adaptation."
default = "1000"
models = ["fit"]

[[inputs]]
id = "chains"
label = "Chains"
tooltip = "Number of MCMC chains, needed for R-hat."
default = "4"
models = ["fit"]

[[inputs]]
id = "size-low"
label = "Smallest Outbreak"
tooltip = "Simulation repeats until an outbreak ends with at least this many cases. Outbreaks chosen by size are a selected subset: their R and timing are not typical of the model."
default = "50"
models = ["cases"]
newRow = true

[[inputs]]
id = "size-high"
label = "Largest Outbreak"
tooltip = "The largest outbreak accepted. An outbreak that grows past this is dropped and another is simulated."
default = "200"
models = ["cases"]

[[inputs]]
id = "report-delay"
label = "Onset to Report (days)"
tooltip = "Mean of the exponential delay from symptom onset to reporting."
default = "3.0"
models = ["cases"]

[[inputs]]
id = "admission"
label = "Admission Probability"
tooltip = "Probability that a case is admitted to hospital."
default = "0.2"
models = ["cases"]

[[inputs]]
id = "death"
label = "Death Probability"
tooltip = "Probability that a case is due to die. Recovery competes with it, so that the share who die is lower than this."
default = "0.05"
models = ["cases"]

[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Random seed for the simulation and the sampler."
default = "42"

[[codeBranches]]
model = "contain"
code = '''
using EpiBranch, Distributions, Random  # branching process; delays; seed

rng = Xoshiro({{seed}})  # fixed seed: the same outbreaks on every run
n_sim, cap = {{n-sim}}, {{max-cases}}

process = BranchingProcess(NegBin({{R}}, {{k}}), {{generation-time}})  # offspring and generation time
clinical = clinical_presentation(incubation_period = {{incubation}})  # isolation starts from symptom onset

iso = Isolation(onset_to_isolation_delay = Exponential({{isolation-delay}}), duration = {{duration}})
{{?measures=tracing|ring}}ct = ContactTracing(probability = {{trace-probability}}, isolation_to_trace_delay = Exponential({{trace-delay}}), action = Quarantine(duration = {{duration}}))
{{?measures=ring}}rv = RingVaccination(efficacy = 0.0, post_exposure_efficacy = {{post-exposure}})  # a dose to traced contacts, stopping an infection they already have
{{?measures=isolation}}interventions = [iso]
{{?measures=tracing}}interventions = [iso, ct]
{{?measures=ring}}interventions = [iso, ct, rv]

model = ModelSpec(process; interventions, attributes = clinical)
results = simulate(model, n_sim; max_cases = cap, rng)  # one simulated state per outbreak

contained = containment_probability(results; max_cases = cap)
uncontrolled = extinction_probability(process)  # exact, with no measures
println("Contained under the measures: ", round(contained; digits = 3))
println("Dying out by chance alone:    ", round(uncontrolled; digits = 3))
'''

[[codeBranches]]
model = "exact"
code = '''
using EpiBranch, Distributions  # exact formulas; offspring distributions

R, k = {{R}}, {{k}}
offspring = NegBin(R, k)  # mean R, dispersion k

println("Chance one introduction dies out: ", round(extinction_probability(offspring); digits = 3))
println("Chance it starts an epidemic:     ", round(epidemic_probability(offspring); digits = 3))
println("Top ", {{top-share}}, " of cases cause ", round(proportion_transmission(R, k; prop_cases = {{top-share}}); digits = 3), " of transmission")

chain_sizes = chain_size_distribution(NegBin({{R-chains}}, k))  # R below 1: every chain ends
println("With R = ", {{R-chains}}, ": mean chain size ", round(mean(chain_sizes); digits = 2), ", chance of a single case ", round(pdf(chain_sizes, 1); digits = 3))
'''

[[codeBranches]]
model = "fit"
code = '''
using EpiBranch, Distributions, Turing, Random  # likelihoods; offspring; NUTS; seed

rng = Xoshiro({{seed}})  # fixed seed: the same data and draws on every run
R_true, k_true = {{true-R}}, {{true-k}}

# Simulated data (replace with your own vector of integers)
{{?data=offspring}}data = rand(rng, NegBin(R_true, k_true), {{n-obs}})  # secondary cases of each case
{{?data=chains}}data = rand(rng, chain_size_distribution(NegBin(R_true, k_true)), {{n-obs}})  # final size of each cluster

@model function outbreak_model(data)
    R ~ LogNormal(0.0, 1.0)  # prior with median 1
    k ~ Exponential(1.0)  # prior with mean 1
{{?data=offspring}}    data ~ offspring_distribution(BranchingProcess(NegBin(R, k)))
{{?data=chains}}    data ~ chain_size_distribution(BranchingProcess(NegBin(R, k)))
end
model = outbreak_model(data)

fit_ml = maximum_likelihood(Xoshiro({{seed}}), model)  # ignores the priors
est = NamedTuple(fit_ml.params)
println("Maximum likelihood: R = ", round(est.R; digits = 2), ", k = ", round(est.k; digits = 2), " (true ", R_true, ", ", k_true, ")")

posterior = sample(Xoshiro({{seed}}), model, NUTS(), MCMCSerial(), {{samples}}, {{chains}}; progress = false)
R_draws, k_draws = vec(posterior[:R]), vec(posterior[:k])
for (name, draws) in (("R", R_draws), ("k", k_draws))
    low, mid, high = quantile(draws, [0.025, 0.5, 0.975])
    println(name, ": posterior median ", round(mid; digits = 2), ", 95% credible interval [", round(low; digits = 2), ", ", round(high; digits = 2), "]")
end
'''

[[codeBranches]]
model = "cases"
code = '''
using EpiBranch, Distributions, Dates, Tables, Random  # model; delays; calendar; columns; seed

rng = Xoshiro({{seed}})  # fixed seed: the same outbreak on every run
start = Date(2024, 1, 1)  # the calendar date of day 0

progression = [
    Reporting(delay = Exponential({{report-delay}})),
    Hospitalisation(delay = Exponential(5.0), probability = {{admission}}),
    Death(delay = Exponential(14.0), probability = {{death}}),
    Recovery(delay = Exponential(14.0)),
]
attributes = [
    clinical_presentation(incubation_period = {{incubation}}),
    demographics(age_distribution = Normal(40, 15), prob_female = 0.55),
]
model = ModelSpec(BranchingProcess(NegBin({{R}}, {{k}}), {{generation-time}}); progression, attributes)

# Repeat until an outbreak ends within the size range
outbreak = simulate(model; condition = {{size-low}}:{{size-high}}, max_cases = {{size-high}} + 1, rng)  # the cap above the range: one stopped at the cap has no final size

cases = Tables.columntable(linelist(outbreak; reference_date = start))  # one row per case
exposed = Tables.columntable(contacts(outbreak; reference_date = start))  # one row per contact
println(length(cases.id), " cases, ", length(exposed.from), " contacts, ended by itself: ", outbreak.extinct)
println("Columns: ", join(keys(cases), ", "))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "outbreak-sizes"
label = "Outbreak Sizes"
desc = "Histogram of the size of every simulated outbreak, on a log scale"
models = ["contain"]
code = '''
using Plots

sizes = [s.cumulative_cases for s in results]
p = histogram(log10.(sizes); bins = 30, xlabel = "Cases in the outbreak (log10)", ylabel = "Outbreaks", label = false, title = "Outbreak sizes")
display(p)
println(count(>=(cap), sizes), " of ", n_sim, " outbreaks reached the cap of ", cap, " cases")
'''

[[actionGroups.actions]]
id = "epidemic-curve-contained"
label = "Epidemic Curve"
desc = "Weekly cases by symptom onset in the largest outbreak that ended before the cap"
models = ["contain"]
code = '''
using Plots, Tables

ended = filter(s -> s.extinct && s.cumulative_cases < cap, results)
largest = ended[argmax([s.cumulative_cases for s in ended])]
curve = Tables.columntable(weekly_incidence(largest))  # a table of week and cases
p = bar(curve.week, curve.cases; xlabel = "Week", ylabel = "Cases", label = false, title = "Largest contained outbreak: $(largest.cumulative_cases) cases")
display(p)
'''

[[actionGroups.actions]]
id = "offspring"
label = "Offspring Distribution"
desc = "Secondary cases per case, against a Poisson distribution with the same R"
models = ["exact"]
code = '''
using Plots

counts = 0:10
p = bar(counts, pdf.(offspring, counts); alpha = 0.5, label = "Negative binomial", xlabel = "Secondary cases", ylabel = "Probability", title = "Offspring distribution, R = $R")
scatter!(p, counts, pdf.(Poisson(R), counts); color = :black, label = "Poisson")
display(p)
'''

[[actionGroups.actions]]
id = "transmission-share"
label = "Share of Transmission"
desc = "The share of transmission from the most infectious cases, for several values of k"
models = ["exact"]
code = '''
using Plots

shares = 0.01:0.01:0.99
p = plot(shares, shares; linestyle = :dot, color = :gray, label = "Every case the same", xlabel = "Share of cases, most infectious first", ylabel = "Share of transmission", title = "Who transmits")
for dispersion in sort(unique([0.05, k, 0.5, 2.0]))
    plot!(p, shares, [proportion_transmission(R, dispersion; prop_cases = s) for s in shares]; label = "k = $dispersion")
end
display(p)
'''

[[actionGroups.actions]]
id = "chain-sizes"
label = "Chain Sizes"
desc = "The distribution of final chain sizes, against Poisson offspring with the same R"
models = ["exact"]
code = '''
using Plots

sizes = 1:50
p = plot(sizes, pdf.(chain_sizes, sizes); yscale = :log10, label = "Negative binomial, k = $k", xlabel = "Cases in the chain", ylabel = "Probability (log scale)", title = "Chain sizes, R = {{R-chains}}")
plot!(p, sizes, pdf.(chain_size_distribution(Poisson({{R-chains}})), sizes); label = "Poisson")
display(p)
'''

[[actionGroups.actions]]
id = "data-against-fit"
label = "Data Against the Fit"
desc = "Observed proportions against the distribution at the maximum-likelihood estimates"
models = ["fit"]
code = '''
using Plots

{{?data=offspring}}fitted_dist = NegBin(est.R, est.k)
{{?data=offspring}}support = 0:min(maximum(data), 30)
{{?data=chains}}fitted_dist = chain_size_distribution(NegBin(est.R, est.k))
{{?data=chains}}support = 1:min(maximum(data), 30)
observed = [count(==(x), data) / length(data) for x in support]
p = bar(support, observed; alpha = 0.5, label = "Observed", xlabel = "Count", ylabel = "Proportion", title = "Data against the fit")
scatter!(p, support, pdf.(fitted_dist, support); color = :black, label = "Fitted")
display(p)
'''

[[actionGroups.actions]]
id = "joint-posterior"
