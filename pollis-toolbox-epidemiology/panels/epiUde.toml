# Machine Learning for Epidemics Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/epiUde.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Machine Learning for Epidemics"
viewType = "pollis.epi-ude"
defaultModel = "node"

[[packages]]
name = "Lux.jl"
github = "https://lux.csail.mit.edu/"

[[packages]]
name = "SciMLSensitivity.jl"
github = "https://docs.sciml.ai/SciMLSensitivity/stable/"

[[packages]]
name = "AdvancedHMC.jl"
github = "https://github.com/TuringLang/AdvancedHMC.jl"

[[packages]]
name = "DataDrivenDiffEq.jl"
github = "https://docs.sciml.ai/DataDrivenDiffEq/stable/"

[requires]
packages = ["Lux.jl", "OrdinaryDiffEq.jl", "SciMLSensitivity.jl", "Optimization.jl", "OptimizationOptimisers.jl", "ComponentArrays.jl", "Mooncake.jl", "AdvancedHMC.jl", "DataDrivenDiffEq.jl", "DataDrivenSparse.jl", "Plots.jl"]

[[notebookSections]]
label = "Part 1: Tools"

[[notebookSections.notebooks]]
name = "Neural ODEs on Epidemiology Models"
file = "epi-ude/tutorial-01-neural-ode.ipynb"
bundled = true
description = "Train a Neural ODE on the 5-compartment SIRHD model and see why black-box networks fail at forecasting"

[[notebookSections.notebooks]]
name = "Universal Differential Equations (UDE)"
file = "epi-ude/tutorial-02-ude.ipynb"
bundled = true
description = "Replace interaction terms with neural networks in the SIRHD model and train the hybrid UDE"

[[notebookSections.notebooks]]
name = "7-Compartment Model: Neural ODE vs UDE"
file = "epi-ude/tutorial-03-7compartment.ipynb"
bundled = true
description = "Compare Neural ODE and UDE extrapolation on a 7-compartment epidemic with a time-varying contact rate"

[[notebookSections.notebooks]]
name = "Bayesian Neural ODEs"
file = "epi-ude/tutorial-04-bayesian-neural-ode.ipynb"
bundled = true
description = "Add uncertainty quantification to Neural ODEs via NUTS sampling with AdvancedHMC.jl"

[[notebookSections.notebooks]]
name = "SciML Optimisers + Symbolic Recovery"
file = "epi-ude/tutorial-05-symbolic-recovery.ipynb"
bundled = true
description = "Chain ADAM and BFGS optimisers for a Lotka-Volterra UDE, then recover symbolic equations via SINDy"

[[notebookSections]]
label = "Part 2: Applications"

[[notebookSections.notebooks]]
name = "QSIR: Italy Quarantine Diagnosis"
file = "epi-ude/tutorial-06-qsir-italy.ipynb"
bundled = true
