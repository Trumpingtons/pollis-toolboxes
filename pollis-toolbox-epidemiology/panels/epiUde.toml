desc = "The SIRHD model itself, its six rates fitted to the same data, and the errors of both in the data and beyond it: what the network costs when the model is known"
models = ["node", "bnode"]
code = '''
using OrdinaryDiffEq, SciMLSensitivity, Optimization, OptimizationOptimisers, Mooncake, Statistics

# The SIRHD model with its six rates estimated by least squares, from 0.1 each
sirhd_predict(r, ts = t) = Array(solve(ODEProblem(sirhd!, u0, (0.0, last(ts)), abs.(r)), Tsit5(); saveat = ts))
sirhd_problem = OptimizationProblem(OptimizationFunction((r, _) -> sum(abs2, data .- sirhd_predict(r)), Optimization.AutoMooncake(; config = nothing)), fill(0.1, 6))
sirhd_fit = solve(sirhd_problem, Adam(0.01); maxiters = 1000)
println("Fitted rates: ", round.(abs.(sirhd_fit.u); sigdigits = 3), " (true ", rates, ")")

horizon = 0.0:1.0:2days
actual = simulate(horizon)
rmse(x, y) = sqrt(mean(abs2, x .- y))
inside, beyond = 1:length(t), length(t)+1:length(horizon)
for (label, run) in (("Neural ODE", predict(fit.u, horizon)), ("SIRHD", sirhd_predict(sirhd_fit.u, horizon)))
    println(rpad(label, 12), "RMSE in the data: ", round(rmse(run[:, inside], actual[:, inside]); sigdigits = 3),
        "   beyond it: ", round(rmse(run[:, beyond], actual[:, beyond]); sigdigits = 3))
end
'''

