[[actionGroups.actions]]
id = "against-neural-ode"
label = "Against a Neural ODE"
desc = "A plain neural ODE fitted to the same data, and the errors of both in the data and beyond it: what the epidemic's known structure buys"
models = ["ude", "symb", "qsir"]
code = '''
using Lux, OrdinaryDiffEq, SciMLSensitivity, Optimization, OptimizationOptimisers, ComponentArrays, Mooncake, Random, Statistics

# A neural ODE on the observed series themselves, du/dt = NN(u), trained as long as the UDE was
width = size(data, 1)
black_box = Chain(Dense(width => 16, tanh), Dense(16 => width))
bb_ps, bb_st = f64(Lux.setup(Xoshiro(2), black_box))
bb_predict(p, ts = t) = Array(solve(ODEProblem((u, p, t) -> first(black_box(u, p, bb_st)), data[:, 1], (0.0, last(ts)), p), Tsit5(); saveat = ts))
bb_problem = OptimizationProblem(OptimizationFunction((p, _) -> sum(abs2, data .- bb_predict(p)), Optimization.AutoMooncake(; config = nothing)), ComponentArray(bb_ps))
bb_fit = solve(bb_problem, Adam(0.01); maxiters = length(losses))

horizon = 0.0:1.0:2days
actual = simulate(horizon)
rmse(x, y) = sqrt(mean(abs2, x .- y))
inside, beyond = 1:length(t), length(t)+1:length(horizon)
for (label, run) in (("UDE", predict(fit.u, horizon)), ("Neural ODE", bb_predict(bb_fit.u, horizon)))
    println(rpad(label, 12), "RMSE in the data: ", round(rmse(run[:, inside], actual[:, inside]); sigdigits = 3),
        "   beyond it: ", round(rmse(run[:, beyond], actual[:, beyond]); sigdigits = 3))
end
'''

