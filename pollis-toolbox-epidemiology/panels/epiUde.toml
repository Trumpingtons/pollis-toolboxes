code = '''
using Plots

fitted = predict(fit.u)  # the trained model's trajectories on the observed days
plot(; xlabel = "Day", ylabel = "Fraction of the population", title = "Fit against the data")
for (k, name) in enumerate(names)
    scatter!(t, data[k, :]; color = k, markersize = 3, label = "$name data")
    plot!(t, fitted[k, :]; color = k, linewidth = 2, label = "$name fitted")
end
plot!()
'''

