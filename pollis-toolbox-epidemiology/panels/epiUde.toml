[[codeBranches]]
model = "node"
code = '''
using Lux, OrdinaryDiffEq, SciMLSensitivity, Optimization, OptimizationOptimisers, ComponentArrays, Mooncake, Random

# Simulated data: an SIRHD epidemic (susceptible, infected, recovered, hospitalised, dead), as fractions of the
# population, observed every day with a little noise. Replace it with your own counts, scaled to fractions.
function sirhd!(du, u, rates, t)
    S, I, R, H, D = u
    beta, gamma_ir, gamma_ih, gamma_id, gamma_hr, gamma_hd = rates
    du[1] = -beta * S * I
    du[2] = beta * S * I - (gamma_ir + gamma_ih + gamma_id) * I
    du[3] = gamma_ir * I + gamma_hr * H
    du[4] = gamma_ih * I - (gamma_hr + gamma_hd) * H
    du[5] = gamma_id * I + gamma_hd * H
end
names = ["S", "I", "R", "H", "D"]
u0 = [0.99, 0.01, 0.0, 0.0, 0.0]
rates = [0.85, 0.1, 0.025, 0.05, 0.02, 0.002]  # beta, then the rates from I to R, H and D, and from H to R and D
days = {{days}}
t = 0.0:1.0:days
simulate(ts) = Array(solve(ODEProblem(sirhd!, u0, (0.0, last(ts)), rates), Tsit5(); saveat = ts))
rng = Xoshiro(1)
data = simulate(t) .* (1 .+ 0.02 .* randn(rng, 5, length(t)))

# The neural ODE: du/dt = NN(u), a network that knows nothing of epidemics
nn = Chain(Dense(5 => {{hidden}}, tanh), Dense({{hidden}} => 5))
ps, st = f64(Lux.setup(rng, nn))
rhs(u, p, t) = first(nn(u, p, st))
predict(p, ts = t) = Array(solve(ODEProblem(rhs, u0, (0.0, last(ts)), p), Tsit5(); saveat = ts))
loss(p, _) = sum(abs2, data .- predict(p))

losses = Float64[]
record(state, l) = (push!(losses, l); false)
problem = OptimizationProblem(OptimizationFunction(loss, Optimization.AutoMooncake(; config = nothing)), ComponentArray(ps))
fit = solve(problem, Adam(0.05); maxiters = {{iterations}}, callback = record)
println("Loss: ", round(losses[1]; sigdigits = 4), " -> ", round(losses[end]; sigdigits = 4))
'''

[[codeBranches]]
model = "ude"
code = '''
using Lux, OrdinaryDiffEq, SciMLSensitivity, Optimization, OptimizationOptimisers, ComponentArrays, Mooncake, Random

# Simulated data: an SIRHD epidemic (susceptible, infected, recovered, hospitalised, dead), as fractions of the
# population, observed every day with a little noise. Replace it with your own counts, scaled to fractions.
function sirhd!(du, u, rates, t)
    S, I, R, H, D = u
    beta, gamma_ir, gamma_ih, gamma_id, gamma_hr, gamma_hd = rates
    du[1] = -beta * S * I
    du[2] = beta * S * I - (gamma_ir + gamma_ih + gamma_id) * I
    du[3] = gamma_ir * I + gamma_hr * H
    du[4] = gamma_ih * I - (gamma_hr + gamma_hd) * H
    du[5] = gamma_id * I + gamma_hd * H
end
names = ["S", "I", "R", "H", "D"]
u0 = [0.99, 0.01, 0.0, 0.0, 0.0]
rates = [0.85, 0.1, 0.025, 0.05, 0.02, 0.002]  # beta, then the rates from I to R, H and D, and from H to R and D
days = {{days}}
t = 0.0:1.0:days
simulate(ts) = Array(solve(ODEProblem(sirhd!, u0, (0.0, last(ts)), rates), Tsit5(); saveat = ts))
rng = Xoshiro(1)
data = simulate(t) .* (1 .+ 0.02 .* randn(rng, 5, length(t)))

# The universal differential equation: the SIRHD model with its transmission term beta * S * I, which is not
# known, replaced by a network of S and I; the five other rates are estimated with it
nn = Chain(Dense(2 => {{hidden}}, tanh), Dense({{hidden}} => 1))
ps, st = f64(Lux.setup(rng, nn))
transmission(S, I, p) = abs(first(first(nn([S, I], p.nn, st))))
function rhs(u, p, t)
    S, I, R, H, D = u
    gamma_ir, gamma_ih, gamma_id, gamma_hr, gamma_hd = abs.(p.rates)
    new = transmission(S, I, p)
    return [-new, new - (gamma_ir + gamma_ih + gamma_id) * I, gamma_ir * I + gamma_hr * H,
        gamma_ih * I - (gamma_hr + gamma_hd) * H, gamma_id * I + gamma_hd * H]
end
predict(p, ts = t) = Array(solve(ODEProblem(rhs, u0, (0.0, last(ts)), p), Tsit5(); saveat = ts))
loss(p, _) = sum(abs2, data .- predict(p))

losses = Float64[]
record(state, l) = (push!(losses, l); false)
start = ComponentArray(nn = ps, rates = fill(0.05, 5))
problem = OptimizationProblem(OptimizationFunction(loss, Optimization.AutoMooncake(; config = nothing)), start)
fit = solve(problem, Adam(0.05); maxiters = {{iterations}}, callback = record)
println("Loss: ", round(losses[1]; sigdigits = 4), " -> ", round(losses[end]; sigdigits = 4))
println("Rates: ", round.(abs.(fit.u.rates); sigdigits = 3), " (true ", rates[2:end], ")")
'''

[[codeBranches]]
model = "bnode"
code = '''
using Lux, OrdinaryDiffEq, SciMLSensitivity, Optimization, OptimizationOptimisers, ComponentArrays, Mooncake, AdvancedHMC, Random

# Simulated data: an SIRHD epidemic (susceptible, infected, recovered, hospitalised, dead), as fractions of the
# population, observed every day with a little noise. Replace it with your own counts, scaled to fractions.
function sirhd!(du, u, rates, t)
    S, I, R, H, D = u
    beta, gamma_ir, gamma_ih, gamma_id, gamma_hr, gamma_hd = rates
    du[1] = -beta * S * I
    du[2] = beta * S * I - (gamma_ir + gamma_ih + gamma_id) * I
    du[3] = gamma_ir * I + gamma_hr * H
    du[4] = gamma_ih * I - (gamma_hr + gamma_hd) * H
    du[5] = gamma_id * I + gamma_hd * H
end
names = ["S", "I", "R", "H", "D"]
u0 = [0.99, 0.01, 0.0, 0.0, 0.0]
rates = [0.85, 0.1, 0.025, 0.05, 0.02, 0.002]  # beta, then the rates from I to R, H and D, and from H to R and D
days = {{days}}
t = 0.0:1.0:days
simulate(ts) = Array(solve(ODEProblem(sirhd!, u0, (0.0, last(ts)), rates), Tsit5(); saveat = ts))
rng = Xoshiro(1)
data = simulate(t) .* (1 .+ 0.02 .* randn(rng, 5, length(t)))

# A Bayesian neural ODE: the neural ODE's weights get a standard normal prior and the data a normal likelihood,
# and NUTS samples their posterior, starting from a fit by Adam
nn = Chain(Dense(5 => {{hidden}}, tanh), Dense({{hidden}} => 5))
ps, st = f64(Lux.setup(rng, nn))
rhs(u, p, t) = first(nn(u, p, st))
predict(p, ts = t) = Array(solve(ODEProblem(rhs, u0, (0.0, last(ts)), p), Tsit5(); saveat = ts))
loss(p, _) = sum(abs2, data .- predict(p))

losses = Float64[]
record(state, l) = (push!(losses, l); false)
problem = OptimizationProblem(OptimizationFunction(loss, Optimization.AutoMooncake(; config = nothing)), ComponentArray(ps))
fit = solve(problem, Adam(0.05); maxiters = {{iterations}}, callback = record)

sigma = 0.02  # the noise's standard deviation
weights(theta) = ComponentArray(theta, getaxes(fit.u))
logposterior(theta) = -sum(abs2, data .- predict(weights(theta))) / (2 * sigma^2) - sum(abs2, theta) / 2
theta0 = collect(fit.u)
cache = Mooncake.prepare_gradient_cache(logposterior, theta0)
# The log posterior and its gradient, by Mooncake
gradient(theta) = (result = Mooncake.value_and_gradient!!(cache, logposterior, theta); (result[1], copy(result[2][2])))
metric = DiagEuclideanMetric(length(theta0))
hamiltonian = Hamiltonian(metric, logposterior, gradient)
integrator = Leapfrog(find_good_stepsize(hamiltonian, theta0))
kernel = HMCKernel(Trajectory{MultinomialTS}(integrator, GeneralisedNoUTurn()))
adaptor = StanHMCAdaptor(MassMatrixAdaptor(metric), StepSizeAdaptor(0.65, integrator))
draws = {{samples}}
samples, stats = sample(hamiltonian, kernel, theta0, draws, adaptor, div(draws, 2); progress = false)
println("Loss: ", round(losses[1]; sigdigits = 4), " -> ", round(losses[end]; sigdigits = 4), "; ", length(samples), " posterior draws")
'''

[[codeBranches]]
model = "symb"
code = '''
using Lux, OrdinaryDiffEq, SciMLSensitivity, Optimization, OptimizationOptimisers, ComponentArrays, Mooncake, DataDrivenDiffEq, DataDrivenSparse, Random

# Simulated data: an SIR epidemic (susceptible, infected, recovered), as fractions of the population, observed
# every day with a little noise. Replace it with your own counts, scaled to fractions.
function sir!(du, u, rates, t)
    S, I, R = u
    beta, gamma = rates
    du[1] = -beta * S * I
    du[2] = beta * S * I - gamma * I
    du[3] = gamma * I
end
names = ["S", "I", "R"]
u0 = [0.99, 0.01, 0.0]
rates = [0.85, 0.1]  # beta and gamma
days = {{days}}
t = 0.0:1.0:days
simulate(ts) = Array(solve(ODEProblem(sir!, u0, (0.0, last(ts)), rates), Tsit5(); saveat = ts))
rng = Xoshiro(1)
data = simulate(t) .* (1 .+ 0.02 .* randn(rng, 3, length(t)))

# First a universal differential equation: the SIR model with its transmission term replaced by a network of
# S and I, and gamma estimated with it
nn = Chain(Dense(2 => {{hidden}}, tanh), Dense({{hidden}} => 1))
ps, st = f64(Lux.setup(rng, nn))
transmission(S, I, p) = abs(first(first(nn([S, I], p.nn, st))))
function rhs(u, p, t)
    S, I, R = u
    new = transmission(S, I, p)
    return [-new, new - abs(p.gamma) * I, abs(p.gamma) * I]
end
predict(p, ts = t) = Array(solve(ODEProblem(rhs, u0, (0.0, last(ts)), p), Tsit5(); saveat = ts))
loss(p, _) = sum(abs2, data .- predict(p))

losses = Float64[]
record(state, l) = (push!(losses, l); false)
problem = OptimizationProblem(OptimizationFunction(loss, Optimization.AutoMooncake(; config = nothing)), ComponentArray(nn = ps, gamma = 0.05))
fit = solve(problem, Adam(0.05); maxiters = {{iterations}}, callback = record)

# Then sparse regression (SINDy) finds the few terms, among the polynomials in S and I up to degree 2, that
# reproduce what the network learned
@variables S I
basis = Basis(polynomial_basis([S, I], 2), [S, I])
X = predict(fit.u)[1:2, :]
Y = reshape([transmission(x[1], x[2], fit.u) for x in eachcol(X)], 1, :)
recovered = solve(DirectDataDrivenProblem(X, Y), basis, STLSQ(exp10.(-3:0.25:-1)))
println("Loss: ", round(losses[1]; sigdigits = 4), " -> ", round(losses[end]; sigdigits = 4))
println("Transmission: ", only(equations(get_basis(recovered))).rhs, " with ", get_parameter_map(get_basis(recovered)), " (true 0.85 * S * I)")
'''

[[codeBranches]]
model = "qsir"
code = '''
using Lux, OrdinaryDiffEq, SciMLSensitivity, Optimization, OptimizationOptimisers, ComponentArrays, Mooncake, Random

# Simulated data: an epidemic with quarantine (QSIR: susceptible, infected, recovered, quarantined), as fractions of
# the population, where the quarantine's strength Q(t) rises after a lockdown on day 12. Only the infected (I + T)
# and the removed (R) are observed, every day with a little noise. Replace them with your own counts, scaled to
# fractions.
lockdown = 12
strength(t) = 0.3 / (1 + exp(-(t - lockdown) / 2))
function qsir!(du, u, rates, t)
    S, I, R, T = u
    beta, gamma, delta = rates
    du[1] = -beta * S * I
    du[2] = beta * S * I - gamma * I - strength(t) * I
    du[3] = gamma * I + delta * T
    du[4] = strength(t) * I - delta * T
end
names = ["I + T", "R"]  # the observed series
u0 = [0.99, 0.01, 0.0, 0.0]
rates = [0.6, 0.05, 0.05]  # beta, gamma, and delta, the rate at which the quarantined recover
days = {{days}}
t = 0.0:1.0:days
truth(ts) = Array(solve(ODEProblem(qsir!, u0, (0.0, last(ts)), rates), Tsit5(); saveat = ts))
simulate(ts) = (x = truth(ts); [x[2, :] .+ x[4, :] x[3, :]]')
rng = Xoshiro(1)
data = simulate(t) .* (1 .+ 0.02 .* randn(rng, 2, length(t)))

# The universal differential equation: the QSIR model with Q, which is not known, a network of S, I and R; beta,
# gamma and delta are estimated with it
nn = Chain(Dense(3 => {{hidden}}, tanh), Dense({{hidden}} => 1))
ps, st = f64(Lux.setup(rng, nn))
quarantine(u, p) = abs(first(first(nn(u[1:3], p.nn, st))))
function rhs(u, p, t)
    S, I, R, T = u
    beta, gamma, delta = abs.(p.rates)
    Q = quarantine(u, p)
    return [-beta * S * I, beta * S * I - gamma * I - Q * I, gamma * I + delta * T, Q * I - delta * T]
end
states(p, ts = t) = Array(solve(ODEProblem(rhs, u0, (0.0, last(ts)), p), Tsit5(); saveat = ts))
predict(p, ts = t) = (x = states(p, ts); [x[2, :] .+ x[4, :] x[3, :]]')
loss(p, _) = sum(abs2, data .- predict(p))

losses = Float64[]
record(state, l) = (push!(losses, l); false)
start = ComponentArray(nn = ps, rates = [0.5, 0.1, 0.1])
problem = OptimizationProblem(OptimizationFunction(loss, Optimization.AutoMooncake(; config = nothing)), start)
fit = solve(problem, Adam(0.05); maxiters = {{iterations}}, callback = record)
println("Loss: ", round(losses[1]; sigdigits = 4), " -> ", round(losses[end]; sigdigits = 4))
println("Rates: ", round.(abs.(fit.u.rates); sigdigits = 3), " (true ", rates, ")")
'''

