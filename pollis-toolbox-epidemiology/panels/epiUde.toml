code = '''
using Plots

plot(losses; yscale = :log10, xlabel = "Iteration", ylabel = "Sum of squared errors", title = "Training loss", label = nothing, linewidth = 2)
'''

[[actionGroups.actions]]
id = "residuals"
label = "Residuals by Day"
desc = "Data minus fit for each series: a pattern over the days, rather than noise around zero, is structure the model missed"
code = '''
using Plots

residuals = data .- predict(fit.u)  # observed minus fitted, a row per series
plot(t, residuals'; label = permutedims(names), xlabel = "Day", ylabel = "Data - fit", title = "Residuals by day", marker = :circle, markersize = 2)
hline!([0]; color = :gray, linestyle = :dash, label = nothing)
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "forecast"
label = "Forecast Beyond the Data"
desc = "The model run for twice as many days as it was trained on, against the true epidemic: a neural ODE drifts off, a UDE keeps the epidemic's shape"
code = '''
using Plots

horizon = 0.0:1.0:2days  # twice the days the model saw
forecast = predict(fit.u, horizon)  # the trained model, run on
actual = simulate(horizon)  # the epidemic the data came from, without noise
plot(; xlabel = "Day", ylabel = "Fraction of the population", title = "Forecast beyond the data")
for (k, name) in enumerate(names)
    plot!(horizon, actual[k, :]; color = k, linestyle = :dash, label = "$name true")
    plot!(horizon, forecast[k, :]; color = k, linewidth = 2, label = "$name forecast")
end
vline!([days]; color = :gray, label = "end of the data")
'''

[[actionGroups.actions]]
id = "band"
label = "Posterior Forecast Band"
desc = "The forecasts of 100 posterior draws beyond the data, with their 5% to 95% band: how much the Bayesian neural ODE knows it does not know"
models = ["bnode"]
code = '''
using Plots, Statistics

horizon = 0.0:1.0:2days  # twice the days the model saw
draws = [predict(weights(samples[i]), horizon) for i in round.(Int, range(1, length(samples); length = 100))]  # 100 posterior draws, run on
actual = simulate(horizon)  # the epidemic the data came from, without noise
plot(; xlabel = "Day", ylabel = "Fraction of the population", title = "Posterior forecast band")
for (k, name) in enumerate(names)
    paths = reduce(hcat, [d[k, :] for d in draws])  # a column per draw
    low = [quantile(row, 0.05) for row in eachrow(paths)]
    high = [quantile(row, 0.95) for row in eachrow(paths)]
    plot!(horizon, median(paths; dims = 2); ribbon = (vec(median(paths; dims = 2)) .- low, high .- vec(median(paths; dims = 2))), fillalpha = 0.2, color = k, linewidth = 2, label = "$name posterior")
    plot!(horizon, actual[k, :]; color = k, linestyle = :dash, label = "$name true")
end
vline!([days]; color = :gray, label = "end of the data")
'''

