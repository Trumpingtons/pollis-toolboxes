# Compartmental Models Webview Configuration
# This is the declarative source for the webview. The build script generates:
# - src/vs/workbench/contrib/model/browser/webviews/epi-comp.data.ts
# Run: npm run gulp compile-toml

[meta]
title = "Compartmental Models"
viewType = "pollis.epi-comp"
defaultModel = "sir"

[[packages]]
name = "DifferentialEquations.jl"
github = "https://docs.sciml.ai/DiffEqDocs/stable/"

[requires]
packages = ["DifferentialEquations.jl", "Plots.jl", "Roots.jl"]

