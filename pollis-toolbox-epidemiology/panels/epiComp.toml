[[bullets]]
text = "Compartmental models divide a population into discrete health states"
detail = "susceptible (S), exposed (E), infectious (I), recovered (R), or dead (D) — and describe transmission dynamics via ordinary differential equations. The choice of variant controls which transitions are modelled."

[[bullets]]
text = "Best suited to large, well-mixed populations where average-rate assumptions hold: national-level influenza forecasting, endemic disease modelling, and policy evaluation."
detail = ""

[[decisionRows]]
task = "SIR"
context = "S → I → R"
purpose = "Outbreaks with permanent immunity after recovery"

[[decisionRows]]
task = "SIS"
context = "S → I → S"
purpose = "Endemic diseases where immunity wanes immediately"

[[decisionRows]]
task = "SEIR"
context = "S → E → I → R"
purpose = "Diseases with a latent incubation period before infectiousness"

[[decisionRows]]
task = "SIRS"
context = "S → I → R → S"
purpose = "Waning immunity leading to recurrent epidemic waves"

[[decisionRows]]
task = "SEIRD"
context = "S → E → I → R/D"
purpose = "Tracking disease-attributable mortality alongside recovery"

[[inputs]]
id = "N"
label = "N (population)"
tooltip = "Total population size. Compartmental models are deterministic ODE systems, so N scales the initial conditions but does not affect the dynamics qualitatively."
default = "10000"

[[inputs]]
id = "T"
label = "T (days)"
tooltip = "Simulation duration in days. Choose long enough to see the epidemic peak and resolution, or the endemic steady state for SIS/SIRS."
default = "160"

[[inputs]]
id = "beta"
label = "beta (transmission)"
tooltip = "Transmission rate: expected contacts per day times probability of transmission per contact. The basic reproduction number R0 = beta / gamma for SIR/SIS."
default = "0.3"

[[inputs]]
id = "gamma"
label = "gamma (recovery)"
tooltip = "Recovery rate: inverse of the mean infectious period in days. For example, gamma = 0.1 gives a 10-day mean infectious period."
default = "0.1"

[[codeBranches]]
model = "sir"
code = '''
using DifferentialEquations, Plots

beta  = {{beta}}  # transmission rate
gamma = {{gamma}}  # recovery rate
N     = {{N}}  # total population

function sir!(du, u, p, t)
    S, I, R = u; b, g = p
    du[1] = -b * S * I / N  # dS/dt
    du[2] =  b * S * I / N - g * I  # dI/dt
    du[3] =  g * I  # dR/dt
end

u0  = [{{N}} - 1.0, 1.0, 0.0]  # S0, I0, R0
tspan = (0.0, {{T}})  # time span in days
prob = ODEProblem(sir!, u0, tspan, (beta, gamma))
sol  = solve(prob, Tsit5())
labels = ["S", "I", "R"]  # compartments, in the order of u
infected_index, recovered_index = 2, 3  # rows of I and R in sol

R0 = beta / gamma  # basic reproduction number
println("R0 = ", round(R0; digits=2), "  Peak I = ", round(maximum(sol[2,:]); digits=0))  # epidemic summary
'''

[[codeBranches]]
model = "sis"
code = '''
using DifferentialEquations, Plots

beta  = {{beta}}  # transmission rate
gamma = {{gamma}}  # recovery rate
N     = {{N}}  # total population

function sis!(du, u, p, t)
    S, I = u; b, g = p
    du[1] = -b * S * I / N + g * I  # dS/dt: infection out, recovery in
    du[2] =  b * S * I / N - g * I  # dI/dt
end

u0    = [{{N}} - 1.0, 1.0]  # S0, I0
prob  = ODEProblem(sis!, u0, (0.0, {{T}}), (beta, gamma))
sol   = solve(prob, Tsit5())
labels = ["S", "I"]  # compartments, in the order of u
infected_index = 2  # row of I in sol; SIS has no R

R0    = beta / gamma  # basic reproduction number
I_end = R0 > 1 ? (1 - 1/R0) * {{N}} : 0.0  # endemic equilibrium
println("R0 = ", round(R0;digits=2), "  Endemic I* = ", round(I_end;digits=0))  # endemic summary
'''

[[codeBranches]]
model = "seir"
code = '''
using DifferentialEquations, Plots

beta   = {{beta}}  # transmission rate
sigma  = 1.0/5.0  # progression rate (5-day latent period)
gamma  = {{gamma}}  # recovery rate
N      = {{N}}  # total population

function seir!(du, u, p, t)
    S, E, I, R = u; b, s, g = p
    du[1] = -b * S * I / N  # dS/dt
    du[2] =  b * S * I / N - s * E  # dE/dt: exposed become infectious
    du[3] =  s * E - g * I  # dI/dt
    du[4] =  g * I  # dR/dt
end

u0   = [{{N}}-1.0, 0.0, 1.0, 0.0]  # S0, E0, I0, R0
prob = ODEProblem(seir!, u0, (0.0, {{T}}), (beta, sigma, gamma))
sol  = solve(prob, Tsit5())
labels = ["S", "E", "I", "R"]  # compartments, in the order of u
infected_index, recovered_index = 3, 4  # rows of I and R in sol

R0 = beta / gamma  # basic reproduction number
println("R0 = ", round(R0;digits=2), "  Peak I = ", round(maximum(sol[3,:]);digits=0))  # SEIR summary
'''

[[codeBranches]]
model = "sirs"
code = '''
using DifferentialEquations, Plots

beta  = {{beta}}  # transmission rate
gamma = {{gamma}}  # recovery rate
xi    = 1.0/180.0  # waning immunity rate (180-day immunity)
N     = {{N}}  # total population

function sirs!(du, u, p, t)
    S, I, R = u; b, g, x = p
    du[1] = -b * S * I / N + x * R  # dS/dt: waning immunity returns R to S
    du[2] =  b * S * I / N - g * I  # dI/dt
    du[3] =  g * I - x * R  # dR/dt
end

u0   = [{{N}}-1.0, 1.0, 0.0]  # S0, I0, R0
prob = ODEProblem(sirs!, u0, (0.0, {{T}}), (beta, gamma, xi))
sol  = solve(prob, Tsit5())
labels = ["S", "I", "R"]  # compartments, in the order of u
infected_index, recovered_index = 2, 3  # rows of I and R in sol

R0 = beta / gamma  # basic reproduction number
println("R0 = ", round(R0;digits=2), "  Endemic equilibrium (reached through damped oscillations): ", R0 > 1)  # SIRS summary
'''

[[codeBranches]]
model = "seird"
code = '''
using DifferentialEquations, Plots

beta   = {{beta}}  # transmission rate
sigma  = 1.0/5.0  # progression rate from E to I
gamma  = {{gamma}}  # recovery rate
mu     = 0.01  # disease-induced mortality rate
N      = {{N}}  # total population

function seird!(du, u, p, t)
    S, E, I, R, D = u; b, s, g, m = p
    du[1] = -b * S * I / N  # dS/dt
    du[2] =  b * S * I / N - s * E  # dE/dt
    du[3] =  s * E - g * I - m * I  # dI/dt: recovery and death
    du[4] =  g * I  # dR/dt
    du[5] =  m * I  # dD/dt: disease-attributable deaths
end

u0   = [{{N}}-1.0, 0.0, 1.0, 0.0, 0.0]  # S0, E0, I0, R0, D0
prob = ODEProblem(seird!, u0, (0.0, {{T}}), (beta, sigma, gamma, mu))
sol  = solve(prob, Tsit5())
labels = ["S", "E", "I", "R", "D"]  # compartments, in the order of u
infected_index, recovered_index = 3, 4  # rows of I and R in sol

R0 = beta / (gamma + mu)  # basic reproduction number: an infectious person leaves I by recovery or death
println("R0 = ", round(R0;digits=2), "  Peak I = ", round(maximum(sol[3,:]);digits=0), "  Total deaths = ", round(sol[5,end];digits=0))  # SEIRD summary
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "epidemic-curve"
label = "Epidemic Curve"
desc = "Plot every compartment of the tab's model over time, at the chosen beta, gamma and N"
code = '''
using Plots
p = plot(sol; label = permutedims(labels), lw = 2, xlabel = "Days", ylabel = "People", title = "Epidemic curve")
display(p)
'''

[[actionGroups.actions]]
id = "phase-portrait"
label = "Phase Portrait"
desc = "Plot the path of the epidemic in the S-I plane, from the first case (dot) to the end of the time span"
code = '''
using Plots
p = plot(sol[1, :], sol[infected_index, :]; lw = 2, label = "Path", xlabel = "S", ylabel = "I", title = "Phase portrait")
scatter!(p, [sol[1, 1]], [sol[infected_index, 1]]; label = "Start")
display(p)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "r0"
label = "Basic R0"
desc = "R0 of the tab's model, whether an epidemic can start, and the herd immunity threshold 1 - 1/R0"
code = '''
println("R0 = ", round(R0; digits = 3))
println("Epidemic occurs: ", R0 > 1)
R0 > 1 && println("Herd immunity threshold: ", round((1 - 1 / R0) * 100; digits = 1), "%")
'''

[[actionGroups.actions]]
id = "final-size"
label = "Final Epidemic Size"
desc = "Solve the final-size equation z = 1 - exp(-R0 z) for the share ever infected, and compare it with the simulation"
models = ["sir", "seir", "seird"]
code = '''
using Roots
z = R0 > 1 ? find_zero(z -> z + exp(-R0 * z) - 1, (1e-9, 1.0)) : 0.0  # share ever infected, for one case in a large population
println("R0                          = ", round(R0; digits = 3))
println("Final size from the equation = ", round(z; digits = 4))
println("Share infected by day ", sol.t[end], "  = ", round(1 - sol[1, end] / N; digits = 4), " (lower if the epidemic has not ended)")
{{?model=sir}} println("Peak share infectious        = ", round(1 - 1 / R0 - log(R0) / R0; digits = 4), " (simulation ", round(maximum(sol[infected_index, :]) / N; digits = 4), ")")
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "beta-sweep"
label = "Transmission Sweep"
desc = "Solve the tab's model for transmission rates from 0.01 to 0.5 and plot the share no longer susceptible at day T, with the threshold where R0 = 1 (near the threshold the epidemic is slow, so the share can be below the final size)"
code = '''
using Plots
betas = 0.01:0.01:0.5
shares = [1 - solve(remake(prob; p = (b, Base.tail(prob.p)...)), Tsit5())[1, end] / N for b in betas]  # beta comes first in p
p = plot(betas, shares; lw = 2, label = "Share not susceptible at day T", xlabel = "beta", ylabel = "Share of N", title = "Epidemic threshold")
vline!(p, [beta / R0]; ls = :dash, c = :gray, label = "R0 = 1")
display(p)
'''

[[actionGroups.actions]]
id = "vaccination"
label = "Vaccination Impact"
desc = "Move 0%, 30%, 60% and 80% of the susceptibles to the recovered at day 0 and compare the infectious curves"
models = ["sir", "seir", "sirs", "seird"]
code = '''
using Plots
p = plot(xlabel = "Days", ylabel = "Infectious", title = "Vaccination impact")
for v in (0.0, 0.3, 0.6, 0.8)
    u0v = copy(prob.u0)
    u0v[1] -= v * N; u0v[recovered_index] += v * N  # vaccinated at day 0
    s = solve(remake(prob; u0 = u0v), Tsit5())
    plot!(p, s.t, s[infected_index, :]; lw = 2, label = string(round(Int, 100 * v), "% vaccinated"))
end
display(p)
println("Herd immunity threshold 1 - 1/R0 = ", round(100 * max(0, 1 - 1 / R0); digits = 1), "%")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "model-comparison"
label = "Model Comparison"
desc = "Peak infectious and share ever infected of SIR, SEIR and SEIRD at the same beta, gamma and N, with a 5-day latent period and a death rate of 0.01"
code = '''
rhs_sir(u, p, t) = (b = beta * u[1] * u[2] / N; [-b, b - gamma * u[2], gamma * u[2]])
rhs_seir(u, p, t) = (b = beta * u[1] * u[3] / N; [-b, b - u[2] / 5, u[2] / 5 - gamma * u[3], gamma * u[3]])
rhs_seird(u, p, t) = (b = beta * u[1] * u[3] / N; [-b, b - u[2] / 5, u[2] / 5 - (gamma + 0.01) * u[3], gamma * u[3], 0.01 * u[3]])
span = (0.0, float({{T}}))
runs = (("SIR", solve(ODEProblem(rhs_sir, [N - 1.0, 1.0, 0.0], span), Tsit5()), 2),
        ("SEIR", solve(ODEProblem(rhs_seir, [N - 1.0, 0.0, 1.0, 0.0], span), Tsit5()), 3),
        ("SEIRD", solve(ODEProblem(rhs_seird, [N - 1.0, 0.0, 1.0, 0.0, 0.0], span), Tsit5()), 3))
for (name, s, i) in runs
    println(rpad(name, 6), " peak I = ", round(maximum(s[i, :]); digits = 0), " on day ", round(s.t[argmax(s[i, :])]; digits = 1), ", share ever infected by day T = ", round(1 - s[1, end] / N; digits = 3))
end
println("SEIRD deaths by day T = ", round(runs[3][2][5, end]; digits = 0))
'''

[[actionGroups.actions]]
id = "intervention-timing"
label = "Intervention Timing"
desc = "Halve the transmission rate of the tab's model from day 0, 20, 40 or 60 and compare the infectious curves"
code = '''
using Plots
p = plot(sol.t, sol[infected_index, :]; lw = 2, c = :black, label = "No intervention", xlabel = "Days", ylabel = "Infectious", title = "Intervention timing")
for day in (0.0, 20.0, 40.0, 60.0)
    halved = ODEProblem((du, u, q, t) -> prob.f(du, u, (t >= day ? beta / 2 : beta, Base.tail(prob.p)...), t), prob.u0, prob.tspan)  # beta halved from day on
    s = solve(halved, Tsit5(); tstops = [day])
    plot!(p, s.t, s[infected_index, :]; lw = 2, label = string("From day ", round(Int, day)))
end
display(p)
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "r0-interpretation"
label = "R0 Interpretation"
desc = "What R0 says about the epidemic of the tab's model: whether it grows or fades, and the immune share that stops it"
code = '''
println("R0 = ", round(R0; digits = 2))
if R0 > 1
    println("The epidemic grows: in a fully susceptible population, each case causes ", round(R0; digits = 2), " new cases")
    println("Growth stops once ", round(100 * (1 - 1 / R0); digits = 1), "% of the population is immune")
else
    println("R0 <= 1: each case causes at most one new case, and the epidemic fades")
end
'''

[[actionGroups.actions]]
id = "endemic-interpretation"
label = "Endemic Equilibrium"
desc = "The long-run infectious share of the tab's model, from its equilibrium, against the value the simulation reaches by day T"
models = ["sis", "sirs"]
code = '''
{{?model=sis}} I_star = R0 > 1 ? (1 - 1 / R0) * N : 0.0  # S* = N / R0, and S + I = N
{{?model=sirs}} I_star = R0 > 1 ? (1 - 1 / R0) * xi / (gamma + xi) * N : 0.0  # S* = N / R0, and R* = gamma I* / xi
println("R0 = ", round(R0; digits = 2))
println("Endemic I* = ", round(I_star; digits = 0), " (", round(100 * I_star / N; digits = 1), "% of N)")
println("I at day ", sol.t[end], " = ", round(sol[infected_index, end]; digits = 0), " (the simulation approaches I* over time)")
'''
