using Plots

highest = untested[sortperm(risk[untested]; rev = true)[1:3]]
courses = reduce(hcat, [nodes[i].marg.m[2, :] for i in highest])
plot(0:steps, courses; label = reshape(["Person $i" for i in highest], 1, :), xlabel = "Day", ylabel = "Chance of being infected", ylim = (0, 1), title = "Highest risks")
'''

