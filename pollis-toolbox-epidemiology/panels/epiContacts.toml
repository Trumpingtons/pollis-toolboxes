[[inputs]]
id = "seed"
label = "Seed"
tooltip = "Fixes the network, the outbreak and the tests."
default = "1"

[[codeBranches]]
model = "risk"
code = '''
using SmallCouplingDynamicCavity, Graphs, Random, Statistics

people = {{people}}
steps = {{steps}}
first_cases = {{first-cases}}
rng = Xoshiro({{seed}})

{{?disease=si}}disease = SI(0.0, people, steps)
{{?disease=sir}}disease = SIR(0.0, {{recovery}}, people, steps)
{{?disease=sis}}disease = SIS(0.0, {{recovery}}, people, steps)
{{?disease=sirs}}disease = SIRS(0.0, {{recovery}}, {{immunity-loss}}, people, steps)

# Infection probabilities along the contacts of each day
function contact_couplings(graphs, probability)
    chance = zeros(people, people, steps + 1)
    for (day, graph) in enumerate(graphs), e in edges(graph)
        chance[src(e), dst(e), day] = probability
        chance[dst(e), src(e), day] = probability
    end
    return log.(1 .- chance)
end

# One graph per day: the form of the package that works with the current Graphs.jl
function make_graphs(rng)
    return fill(random_regular_graph(people, {{contacts}}; rng = rng), steps + 1)
end

# -1 not tested, 1 positive, 0 negative
function make_tests(truth, rng; share = {{tested-daily}}, first_day = {{first-test-day}}, last_day = steps + 1, false_positive = {{false-positive}}, false_negative = {{false-negative}})
    tests = fill(Int8(-1), people, steps + 1)
    for day in first_day:last_day, i in randperm(rng, people)[1:round(Int, share * people)]
        tests[i, day] = truth[i, day] == 1 ? (rand(rng) < false_negative ? 0 : 1) : (rand(rng) < false_positive ? 1 : 0)
    end
    return tests
end

# The chance of a test result given the state of the person
function test_likelihood(false_positive, false_negative)
    return (seen, state) -> seen == -1 ? 1.0 : state == 1 ? (seen == 1 ? 1 - false_negative : false_negative) : (seen == 1 ? false_positive : 1 - false_positive)
end

# The cutoff keeps the messages stable; the package names this keyword with a Greek letter
const message_cutoff = NamedTuple{(Symbol("μ_cutoff"),)}((-1.0,))

function infer(model, tests, rng; false_positive = {{false-positive}}, false_negative = {{false-negative}}, changes = Float64[])
    model.obsmat .= tests
    nodes = run_SCDC(model, test_likelihood(false_positive, false_negative), first_cases / people, {{iterations}}, 1e-4, {{damping}}; callback = (_, _, change) -> push!(changes, change), rng = rng, message_cutoff...)
    return nodes
end

never_tested(tests) = findall(i -> all(==(-1), view(tests, i, :)), 1:people)
area_under_curve(score, flags) = 0 < sum(flags) < length(flags) ? ROC_curve(score, flags)[3] : NaN

graphs = make_graphs(rng)
model = EpidemicModel(disease, graphs, steps, contact_couplings(graphs, {{infection}}))
truth = sim_epidemics(model; patient_zero = randperm(rng, people)[1:first_cases], rng = rng)
tests = make_tests(truth, rng)
changes = Float64[]
nodes = infer(model, tests, rng; changes = changes)

risk = [node.marg.m[2, end] for node in nodes]  # the chance that each person is infected on the last day
infected = Int.(truth[:, end] .== 1)
untested = never_tested(tests)
println("Converged: ", model.converged, ", after ", length(changes), " iterations")
println("Infected on the last day: ", sum(infected), ", the risks add up to ", round(sum(risk); digits = 1))
println("Never tested: ", length(untested), " people, ", sum(infected[untested]), " of them infected")
score = area_under_curve(risk[untested], infected[untested])
println(isnan(score) ? "Among untested people, nobody or everybody is infected, so there is no ranking to score" : "Chance that an infected untested person ranks above an uninfected one: $(round(score; digits = 3))")
'''

[[codeBranches]]
model = "source"
code = '''
using SmallCouplingDynamicCavity, Graphs, Random, Statistics

people = {{source-people}}
rng = Xoshiro({{seed}})

# The test says who is infected on the last day
function test_likelihood(false_positive, false_negative)
    return (seen, state) -> seen == -1 ? 1.0 : state == 1 ? (seen == 1 ? 1 - false_negative : false_negative) : (seen == 1 ? false_positive : 1 - false_positive)
end

# The cutoff keeps the messages stable; the package names this keyword with a Greek letter
const message_cutoff = NamedTuple{(Symbol("μ_cutoff"),)}((-1.0,))

# One outbreak from one first case: the chance of each person being that case
function trace_back(seed; days = {{source-steps}}, share = {{tested-share}}, false_positive = {{false-positive}}, false_negative = {{false-negative}})
    rng = Xoshiro(seed)
    network = random_regular_graph(people, {{contacts}}; rng = rng)
    chance = zeros(people, people, days + 1)
    for e in edges(network)
        chance[src(e), dst(e), :] .= {{source-infection}}
        chance[dst(e), src(e), :] .= {{source-infection}}
    end
    # One graph per day: the form of the package that works with the current Graphs.jl
    model = EpidemicModel(SI(0.0, people, days), fill(network, days + 1), days, log.(1 .- chance))
    first_case = rand(rng, 1:people)
    truth = sim_epidemics(model; patient_zero = [first_case], rng = rng)
    tests = fill(Int8(-1), people, days + 1)
    for i in randperm(rng, people)[1:round(Int, share * people)]
        tests[i, end] = truth[i, end] == 1 ? (rand(rng) < false_negative ? 0 : 1) : (rand(rng) < false_positive ? 1 : 0)
    end
    model.obsmat .= tests
    changes = Float64[]
    nodes = run_SCDC(model, test_likelihood(false_positive, false_negative), 1 / people, {{iterations}}, 1e-4, {{damping}}; callback = (_, _, change) -> push!(changes, change), rng = rng, message_cutoff...)
    first_chance = [node.marg.m[2, 1] for node in nodes]
    first_chance ./= sum(first_chance)
    order = sortperm(first_chance; rev = true)
    set_size = findfirst(>=(0.9), cumsum(first_chance[order]))
    place = findfirst(==(first_case), order)
    return (; network, model, truth, tests, changes, first_case, first_chance, order, set_size, place)
end

result = trace_back({{seed}})
println("Converged: ", result.model.converged, ", after ", length(result.changes), " iterations")
println("Infected on the last day: ", count(==(1), result.truth[:, end]), " of ", people)
println("The real first case ranks ", result.place, " of ", people, ", with a chance of ", round(result.first_chance[result.first_case]; digits = 3))
println("The first ", result.set_size, " people on the list hold 90% of the chance")
'''

[[codeBranches]]
model = "changing"
code = '''
using SmallCouplingDynamicCavity, Graphs, Random, Statistics

people = {{people}}
steps = {{steps}}
first_cases = {{first-cases}}
rng = Xoshiro({{seed}})

{{?disease=si}}disease = SI(0.0, people, steps)
{{?disease=sir}}disease = SIR(0.0, {{recovery}}, people, steps)
{{?disease=sis}}disease = SIS(0.0, {{recovery}}, people, steps)
{{?disease=sirs}}disease = SIRS(0.0, {{recovery}}, {{immunity-loss}}, people, steps)

# Infection probabilities along the contacts of each day
function contact_couplings(graphs, probability)
    chance = zeros(people, people, steps + 1)
    for (day, graph) in enumerate(graphs), e in edges(graph)
        chance[src(e), dst(e), day] = probability
        chance[dst(e), src(e), day] = probability
    end
    return log.(1 .- chance)
end

# New contacts each day, fewer of them from the day contacts change
function make_graphs(rng)
    return [erdos_renyi(people, (day < {{change-day}} ? {{contacts}} : {{contacts-after}}) / people; rng = rng) for day in 1:steps+1]
end

# -1 not tested, 1 positive, 0 negative
function make_tests(truth, rng; share = {{tested-daily}}, first_day = {{first-test-day}}, last_day = steps + 1, false_positive = {{false-positive}}, false_negative = {{false-negative}})
    tests = fill(Int8(-1), people, steps + 1)
    for day in first_day:last_day, i in randperm(rng, people)[1:round(Int, share * people)]
        tests[i, day] = truth[i, day] == 1 ? (rand(rng) < false_negative ? 0 : 1) : (rand(rng) < false_positive ? 1 : 0)
    end
    return tests
end

# The chance of a test result given the state of the person
function test_likelihood(false_positive, false_negative)
    return (seen, state) -> seen == -1 ? 1.0 : state == 1 ? (seen == 1 ? 1 - false_negative : false_negative) : (seen == 1 ? false_positive : 1 - false_positive)
end

# The cutoff keeps the messages stable; the package names this keyword with a Greek letter
const message_cutoff = NamedTuple{(Symbol("μ_cutoff"),)}((-1.0,))

function infer(model, tests, rng; false_positive = {{false-positive}}, false_negative = {{false-negative}}, changes = Float64[])
    model.obsmat .= tests
    nodes = run_SCDC(model, test_likelihood(false_positive, false_negative), first_cases / people, {{iterations}}, 1e-4, {{damping}}; callback = (_, _, change) -> push!(changes, change), rng = rng, message_cutoff...)
    return nodes
end

never_tested(tests) = findall(i -> all(==(-1), view(tests, i, :)), 1:people)
area_under_curve(score, flags) = 0 < sum(flags) < length(flags) ? ROC_curve(score, flags)[3] : NaN

graphs = make_graphs(rng)
model = EpidemicModel(disease, graphs, steps, contact_couplings(graphs, {{infection}}))
truth = sim_epidemics(model; patient_zero = randperm(rng, people)[1:first_cases], rng = rng)
tests = make_tests(truth, rng)
changes = Float64[]
nodes = infer(model, tests, rng; changes = changes)

risk = [node.marg.m[2, end] for node in nodes]  # the chance that each person is infected on the last day
infected = Int.(truth[:, end] .== 1)
untested = never_tested(tests)
println("Converged: ", model.converged, ", after ", length(changes), " iterations")
println("Infected on the last day: ", sum(infected), ", the risks add up to ", round(sum(risk); digits = 1))
println("Never tested: ", length(untested), " people, ", sum(infected[untested]), " of them infected")
score = area_under_curve(risk[untested], infected[untested])
println(isnan(score) ? "Among untested people, nobody or everybody is infected, so there is no ranking to score" : "Chance that an infected untested person ranks above an uninfected one: $(round(score; digits = 3))")
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "ranked-risk"
label = "Risk of Untested People"
desc = "Untested people from highest risk to lowest, marked by whether they were really infected"
models = ["risk", "changing"]
code = '''
using Plots

ranked = untested[sortperm(risk[untested]; rev = true)]
hit = findall(==(1), infected[ranked])
plot(eachindex(ranked), risk[ranked]; label = "Risk", xlabel = "Untested people, by risk", ylabel = "Chance of being infected", title = "Risk on the last day")
scatter!(hit, risk[ranked][hit]; label = "Really infected", markersize = 3)
'''

[[actionGroups.actions]]
id = "expected-cases"
label = "Expected and Real Cases"
desc = "The sum of the risks of each day beside the number really infected"
models = ["risk", "changing"]
code = '''
using Plots

expected = [sum(node.marg.m[2, day] for node in nodes) for day in 1:steps+1]
real_cases = vec(sum(truth .== 1; dims = 1))
plot(0:steps, [expected real_cases]; label = ["Sum of the risks" "Really infected"], xlabel = "Day", ylabel = "People", title = "Cases by day")
'''

[[actionGroups.actions]]
id = "person-course"
label = "Course of the Highest Risks"
desc = "The chance of being infected, day by day, for the three untested people at highest risk"
models = ["risk", "changing"]
