[[actionGroups.actions]]
id = "calibration"
label = "Calibration"
desc = "Among untested people, the mean risk beside the share really infected"
models = ["risk", "changing"]
code = '''
println(rpad("Risk", 14), rpad("People", 9), rpad("Mean risk", 12), "Really infected")
for (low, high) in ((0.0, 0.05), (0.05, 0.2), (0.2, 0.5), (0.5, 1.01))
    members = filter(i -> low <= risk[i] < high, untested)
    isempty(members) && continue
    println(rpad("$low to $(min(high, 1.0))", 14), rpad(length(members), 9), rpad(round(mean(risk[members]); digits = 3), 12), round(mean(infected[members]); digits = 3))
end
println("From one outbreak: small groups say little")
'''

[[actionGroups.actions]]
id = "against-simulation"
label = "Against Simulation, With No Tests"
desc = "The inference with no test results beside 1000 simulated outbreaks: what the approximation does on its own"
models = ["risk", "changing"]
code = '''
no_tests = fill(Int8(-1), people, steps + 1)
cavity_nodes = infer(model, no_tests, Xoshiro({{seed}}))
cavity = [sum(node.marg.m[2, day] for node in cavity_nodes) for day in 1:steps+1]
sim_rng = Xoshiro({{seed}})
simulated = mean(vec(sum(sim_epidemics(model; patient_zero = findall(rand(sim_rng, people) .< first_cases / people), rng = sim_rng) .== 1; dims = 1)) for _ in 1:1000)
println(rpad("Day", 8), rpad("Inference", 12), "Simulated")
for day in 1:5:steps+1
    println(rpad(day - 1, 8), rpad(round(cavity[day]; digits = 1), 12), round(simulated[day]; digits = 1))
end
println("Where the two part, read the risks as a ranking and not as exact probabilities")
model.obsmat .= tests  # back to the tests of the Example Code
'''

