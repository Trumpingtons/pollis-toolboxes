[[actionGroups.actions]]
id = "compare-distance-rule"
label = "Compare With a Simple Rule"
desc = "The inference against ranking people by their mean distance to those who tested positive, over 20 outbreaks"
models = ["source"]
code = '''
function distance_place(run)
    positive = findall(i -> run.tests[i, end] == 1, 1:people)
    isempty(positive) && return people ÷ 2
    closeness = [-mean(gdistances(run.network, i)[positive]) for i in 1:people]
    return findfirst(==(run.first_case), sortperm(closeness; rev = true))
end
runs = [trace_back(s) for s in 1:20]
println("The inference:   median place ", median(run.place for run in runs))
println("Mean distance:   median place ", median(distance_place(run) for run in runs))
'''

