[[actionGroups.actions]]
id = "compare-rule"
label = "Compare With a Simple Rule"
desc = "The inference against counting each person's contacts who tested positive, over 10 outbreaks"
models = ["risk", "changing"]
code = '''
function against_rule(seed)
    rng = Xoshiro(seed)
    outbreak_graphs = make_graphs(rng)
    outbreak_model = EpidemicModel(disease, outbreak_graphs, steps, contact_couplings(outbreak_graphs, {{infection}}))
    outbreak = sim_epidemics(outbreak_model; patient_zero = randperm(rng, people)[1:first_cases], rng = rng)
    outbreak_tests = make_tests(outbreak, rng)
    outbreak_nodes = infer(outbreak_model, outbreak_tests, rng)
    positive = [any(==(1), view(outbreak_tests, i, :)) for i in 1:people]
    contacts_of(i) = unique(reduce(vcat, [collect(neighbors(graph, i)) for graph in outbreak_graphs]))
    rule = [Float64(count(j -> positive[j], contacts_of(i))) for i in 1:people]
    others = never_tested(outbreak_tests)
    flags = Int.(outbreak[others, end] .== 1)
    inferred = [outbreak_nodes[i].marg.m[2, end] for i in others]
    return (area_under_curve(inferred, flags), area_under_curve(rule[others], flags))
end
rule_runs = filter(run -> !any(isnan, run), [against_rule(s) for s in 1:10])
println("Chance that an infected untested person ranks above an uninfected one, ", length(rule_runs), " outbreaks:")
println("The inference:                   ", round(mean(first, rule_runs); digits = 3))
println("Counting contacts who tested positive: ", round(mean(last, rule_runs); digits = 3))
'''

[[actionGroups.actions]]
id = "compare-testing"
label = "Compare Testing Effort"
desc = "The ranking with 2%, 5%, 10% and 20% of people tested per day, over 10 outbreaks"
models = ["risk", "changing"]
code = '''
function with_effort(seed, share)
    rng = Xoshiro(seed)
    outbreak_graphs = make_graphs(rng)
    outbreak_model = EpidemicModel(disease, outbreak_graphs, steps, contact_couplings(outbreak_graphs, {{infection}}))
    outbreak = sim_epidemics(outbreak_model; patient_zero = randperm(rng, people)[1:first_cases], rng = rng)
    outbreak_tests = make_tests(outbreak, rng; share = share)
    outbreak_nodes = infer(outbreak_model, outbreak_tests, rng)
    others = never_tested(outbreak_tests)
    return area_under_curve([outbreak_nodes[i].marg.m[2, end] for i in others], Int.(outbreak[others, end] .== 1))
end
for share in (0.02, 0.05, 0.1, 0.2)
    values = filter(!isnan, [with_effort(s, share) for s in 1:10])
    println("Tested per day ", rpad(share, 6), "chance an infected person ranks above an uninfected one ", isempty(values) ? "too few untested" : round(mean(values); digits = 3))
end
'''

[[actionGroups.actions]]
id = "compare-wrong-rate"
label = "Compare a Wrong Infection Rate"
desc = "The inference told half, the right and double the infection probability, over 10 outbreaks"
models = ["risk", "changing"]
code = '''
function with_rate(seed, factor)
    rng = Xoshiro(seed)
    outbreak_graphs = make_graphs(rng)
    outbreak_model = EpidemicModel(disease, outbreak_graphs, steps, contact_couplings(outbreak_graphs, {{infection}}))
    outbreak = sim_epidemics(outbreak_model; patient_zero = randperm(rng, people)[1:first_cases], rng = rng)
    outbreak_tests = make_tests(outbreak, rng)
    assumed_model = EpidemicModel(disease, outbreak_graphs, steps, contact_couplings(outbreak_graphs, factor * {{infection}}))
    outbreak_nodes = infer(assumed_model, outbreak_tests, rng)
    others = never_tested(outbreak_tests)
    return (area_under_curve([outbreak_nodes[i].marg.m[2, end] for i in others], Int.(outbreak[others, end] .== 1)), sum(node.marg.m[2, end] for node in outbreak_nodes), count(==(1), outbreak[:, end]))
end
for factor in (0.5, 1.0, 2.0)
    rate_runs = [with_rate(s, factor) for s in 1:10]
    println("Told ", rpad(factor, 4), "times the rate: ranking ", rpad(round(mean(filter(!isnan, first.(rate_runs))); digits = 3), 7), "risks add up to ", rpad(round(mean(run[2] for run in rate_runs); digits = 1), 8), "really infected ", round(mean(last, rate_runs); digits = 1))
end
'''

