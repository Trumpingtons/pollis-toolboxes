[[actionGroups.actions]]
id = "johansen"
label = "Johansen Cointegration Test"
models = ["var", "svar", "vecm"]
desc = "Trace and max-eigenvalue tests for the number of cointegrating vectors among I(1) series"
code = '''
using MacroEconometricModels

jo = johansen_test({{yvar}}, {{p}}; deterministic = :{{trend}})  # one trace and one max-eigenvalue test per rank
display(jo)
println("Rank selected by the trace test at 5%: ", jo.rank)
println("0 = no cointegration (VAR in differences); n = stationary levels (VAR in levels); in between = VECM")
'''

[[actionGroups.actions]]
id = "lag-selection"
label = "Lag Selection"
desc = "AIC, BIC and HQ for p = 1 to 6, all fitted on the same sample"
code = '''
using MacroEconometricModels

{{?model=favar}}Ylag = to_var(model).Y  # the VAR system: factors and y
{{?model!=favar}}Ylag = {{yvar}}  # for VECM, the levels VAR order
max_p = 6
println("p    AIC      BIC      HQ")
for lags in 1:max_p
    m = estimate_var(Ylag[(max_p - lags + 1):end, :], lags; check_stability = false)  # drop the same max_p start-up rows for every p
    println(rpad(lags, 5), rpad(round(m.aic, digits = 3), 9), rpad(round(m.bic, digits = 3), 9), round(m.hqic, digits = 3))
end
println("Chosen p: AIC ", select_lag_order(Ylag, max_p; criterion = :aic),
    ", BIC ", select_lag_order(Ylag, max_p; criterion = :bic),
    ", HQ ", select_lag_order(Ylag, max_p; criterion = :hqic))
'''

[[actionGroups.actions]]
id = "stability"
label = "Stability Check"
desc = "Moduli of the companion-matrix eigenvalues: below 1 means shocks die out"
code = '''
using MacroEconometricModels, LinearAlgebra

{{?model=var|svar}}sys = model
{{?model=vecm|favar}}sys = to_var(model)  # the implied VAR in levels
moduli = sort(abs.(eigvals(companion_matrix(sys.B, nvars(sys), sys.p))); rev = true)
println("Largest moduli: ", round.(moduli[1:min(6, end)]; digits = 3))
{{?model=vecm}}println("Rank ", model.rank, " implies ", nvars(model) - model.rank, " unit root(s); every other modulus should be below 1")
{{?model!=vecm}}println(moduli[1] < 1 ? "Stable: every modulus is below 1" : "Not stable: a modulus is at or above 1, so responses do not die out")
'''

