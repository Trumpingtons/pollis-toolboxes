[[inputs]]
id = "xvar"
label = "Panel Data (X)"
tooltip = "T x N panel of stationary series summarised by the latent factors. With the default X, the code builds a balanced panel from the FRED-QD database shipped with the package, with the federal funds rate in levels."
default = "X"
models = ["favar"]

[[inputs]]
id = "yvar"
label = "Data Variable"
tooltip = "T x n matrix of endogenous variables, one column per series. For FAVAR, the observed key series (with the default X, the federal funds rate); for VECM, the I(1) series in levels. With the default y, the code loads an example dataset shipped with the package."
default = "y"

[[inputs]]
id = "p"
label = "p (Lags)"
tooltip = "Lag order of the VAR in levels. For VECM this is the levels order, so the model has p - 1 lagged differences. Choose it with the Lag Selection action. Default 2."
default = "2"
newRow = true

[[inputs]]
id = "trend"
label = "Deterministic Terms"
tooltip = "Deterministic terms of the VECM and the Johansen test: an unrestricted constant, a constant and a linear trend, or none. The VAR always has an intercept in every equation. Default constant."
kind = "select"
default = "constant"
models = ["vecm"]

[[inputs.options]]
value = "constant"
label = "Constant"

[[inputs.options]]
value = "trend"
label = "Constant + Trend"

[[inputs.options]]
value = "none"
label = "None"

[[inputs]]
id = "ident"
label = "Identification"
tooltip = "How the structural shocks are identified. Recursive (Cholesky): column order matters, slow-moving series first. Long-run (Blanchard-Quah): shock j has no long-run effect on variables 1 to j - 1, which suits growth rates. Sign: the last shock raises variable 3 and does not raise variables 1 and 2 for two quarters, so the data need at least 3 columns."
kind = "select"
default = "cholesky"
models = ["svar"]

[[inputs.options]]
value = "cholesky"
label = "Recursive (Cholesky)"

[[inputs.options]]
value = "long_run"
label = "Long-Run (Blanchard-Quah)"

[[inputs.options]]
value = "sign"
label = "Sign Restrictions"

[[inputs]]
id = "nfactors"
label = "Factors"
tooltip = "Number of latent factors extracted from the panel by principal components. Default 3, as in Bernanke, Boivin and Eliasz (2005)."
default = "3"
models = ["favar"]

[[inputs]]
id = "r"
label = "r (Rank)"
tooltip = "Cointegrating rank: the number of long-run relations, between 1 and n - 1. Choose it with the Johansen Cointegration Test action, or write :auto to let the trace test pick it at the 5% level. Default 1."
default = "1"
models = ["vecm"]

[[codeBranches]]
model = "var"
code = '''
using MacroEconometricModels

{{?yvar=y}}# Example: US output gap, GDP-deflator inflation and federal funds rate, quarterly
{{?yvar=y}}# (McKay and Wolf 2023 data appendix, shipped with the package)
{{?yvar=y}}mpd = load_example(:mp_shocks)[:, ["ygap", "infl", "ffr"]]
{{?yvar=y}}rows = findall(i -> all(isfinite, Matrix(mpd)[i, :]), 1:size(Matrix(mpd), 1))  # the gap starts in 1969Q1
{{?yvar=y}}y = Matrix(mpd)[rows, :]
{{?yvar=y}}varnames = mpd.varnames
{{?yvar!=y}}varnames = ["y$i" for i in 1:size({{yvar}}, 2)]

model = estimate_var({{yvar}}, {{p}}; varnames)  # VAR({{p}}) by OLS, intercept in every equation
ident = (method = :cholesky,)  # orthogonalised shocks, recursive in column order
ci = (ci_type = :bootstrap, reps = 500)  # residual-bootstrap bands for the impulse responses

report(model)  # coefficients, residual covariance and information criteria
'''

[[codeBranches]]
model = "svar"
code = '''
using MacroEconometricModels

{{?yvar=y}}# Example: US output gap, GDP-deflator inflation and federal funds rate, quarterly
{{?yvar=y}}# (McKay and Wolf 2023 data appendix, shipped with the package)
{{?yvar=y}}mpd = load_example(:mp_shocks)[:, ["ygap", "infl", "ffr"]]
{{?yvar=y}}rows = findall(i -> all(isfinite, Matrix(mpd)[i, :]), 1:size(Matrix(mpd), 1))  # the gap starts in 1969Q1
{{?yvar=y}}y = Matrix(mpd)[rows, :]
{{?yvar=y}}varnames = mpd.varnames
{{?yvar!=y}}varnames = ["y$i" for i in 1:size({{yvar}}, 2)]

model = estimate_var({{yvar}}, {{p}}; varnames)  # reduced-form VAR({{p}})
{{?ident=cholesky}}ident = (method = :cholesky,)  # recursive: shock j moves only variables j to n on impact (order slow to fast)
{{?ident=long_run}}ident = (method = :long_run,)  # Blanchard-Quah: shock j has no long-run (cumulative) effect on variables 1 to j - 1
{{?ident=sign}}# Monetary tightening = the last shock: for two quarters it raises variable 3 (the rate)
{{?ident=sign}}# and does not raise variables 1 and 2. resp is indexed [horizon, variable, shock];
{{?ident=sign}}# the other shocks are left unidentified.
{{?ident=sign}}tightening(resp) = all(resp[1:2, 3, 3] .> 0) && all(resp[1:2, 1, 3] .<= 0) && all(resp[1:2, 2, 3] .<= 0)
{{?ident=sign}}ident = (method = :sign, check_func = tightening, max_draws = 5000)
{{?ident!=sign}}ci = (ci_type = :bootstrap, reps = 500)  # residual-bootstrap bands
{{?ident=sign}}ci = (;)  # sign restrictions: bands span the accepted rotations (the identified set)

responses = irf(model, 20; ident..., ci...)  # every later action reuses ident, so the identification carries through
println("Impact responses (rows = variables, columns = shocks):")
display(round.(responses.values[1, :, :]; digits = 3))
'''

[[codeBranches]]
model = "favar"
code = '''
using MacroEconometricModels

{{?xvar=X}}# Example: FRED-QD (McCracken and Ng 2020), January 2026 vintage, shipped with the package
{{?xvar=X}}qd = load_example(:fred_qd)
{{?xvar=X}}tq = apply_tcode(qd)  # each series made stationary by its FRED-QD transformation code
{{?xvar=X}}M = Matrix(tq)[1:end-1, :]  # drop the last quarter, still incomplete for many series
{{?xvar=X}}keep = findall(j -> all(isfinite, M[:, j]), 1:size(M, 2))  # balanced panel
{{?xvar=X}}X = M[:, keep]
{{?xvar=X}}panel_names = tq.varnames[keep]
{{?xvar=X}}iffr = findfirst(==("FEDFUNDS"), panel_names)
{{?xvar=X}}ffr = qd[:, "FEDFUNDS"]
{{?xvar=X}}X[:, iffr] = ffr[(end - size(X, 1)):(end - 1)]  # the policy rate in levels, as in Bernanke, Boivin and Eliasz (2005)
{{?xvar!=X}}panel_names = ["x$j" for j in 1:size({{xvar}}, 2)]
{{?yvar=y}}y = X[:, [iffr]]  # key series: the federal funds rate (needs the default X)

# Two steps: principal-component factors from X, purged of y, then a VAR({{p}}) on [factors, y]
model = estimate_favar({{xvar}}, {{yvar}}, {{nfactors}}, {{p}}; panel_varnames = panel_names)
ident = (method = :cholesky,)  # recursive with y last: the rate reacts within the quarter, the factors do not
ci = (ci_type = :bootstrap, reps = 500)  # the bootstrap treats the estimated factors as data

display(model)
'''

[[codeBranches]]
model = "vecm"
code = '''
using MacroEconometricModels

{{?yvar=y}}# Example: Danish money demand, 1974Q1-1987Q3 (Johansen and Juselius 1990):
{{?yvar=y}}# log real M2, log real income, bond rate and deposit rate
{{?yvar=y}}dk = load_example(:denmark)[:, ["LRM", "LRY", "IBO", "IDE"]]
{{?yvar=y}}y = Matrix(dk)
{{?yvar=y}}varnames = dk.varnames
{{?yvar!=y}}varnames = ["y$i" for i in 1:size({{yvar}}, 2)]

# Johansen ML; {{p}} is the VAR order in levels, so the VECM has {{p}} - 1 lagged differences
model = estimate_vecm({{yvar}}, {{p}}; rank = {{r}}, deterministic = :{{trend}}, varnames)
ident = (method = :cholesky,)  # recursive shocks on the implied VAR in levels
ci = (;)  # no bootstrap bands: the levels-VAR bootstrap would drop the rank restriction

report(model)  # alpha (adjustment), beta (cointegrating vectors), Gamma (short-run dynamics)
'''

