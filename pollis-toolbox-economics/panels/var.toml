[[actionGroups.actions]]
id = "transmission-channels"
label = "Transmission Channels"
models = ["var", "svar"]
desc = "Split the response of variable 2 to the last shock into the part that goes through variable 1 and the direct part (TransmissionChannelAnalysis.jl)"
code = '''
using MacroEconometricModels, TransmissionChannelAnalysis, LinearAlgebra, Logging, Statistics

# Transmission channel analysis (Wegner, Lieb, Smeekes and Wilms 2024). With the default y:
# shock 3 (monetary policy), channel = variable 1 (output gap), outcome = variable 2 (inflation).
# The transmission order puts the rate first, then the channel, then the outcome.
shock, channel, outcome = 3, 1, 2
n, p, H = nvars(model), model.p, 16  # quarters 0 to 16
order = [shock; channel; outcome; setdiff(1:n, [shock, channel, outcome])]
As = extract_ar_coefficients(model.B, n, p)  # reduced-form lag matrices A_1 ... A_p
Sigma = Matrix(Symmetric(model.Sigma))
direct_q = not_through(channel, 0:H, order)  # paths that never pass through the channel
rows = [map_y_to_x(outcome, h, n, order) for h in 0:H]  # the outcome at each horizon in the systems form

# Impact matrix of the identified shocks: one for recursive or long-run identification,
# one per accepted rotation for sign restrictions (the median response is not itself a model).
impacts = if ident.method === :sign
    set = identify_sign(model, H + 1, ident.check_func; max_draws = ident.max_draws, store_all = true)
    [set.irf_draws[d, 1, :, :] for d in 1:set.n_accepted]
else
    [irf(model, 1; ident...).values[1, :, :]]
end

effects = with_logger(NullLogger()) do  # transmission() logs the method on every call
    map(impacts) do Phi0
        B, Omega = make_systems_form(Phi0, As, Matrix{Float64}[], Sigma, order, H)  # x = B x + Omega e
        total = ((I - B) \ Omega[:, shock])[rows]
        direct = transmission(shock, B, Omega, direct_q; method = :BOmega)[rows]
        (; total, direct, through = total .- direct)
    end
end

vn = model.varnames
println("Response of $(vn[outcome]) to shock $shock: through $(vn[channel]) vs direct", length(effects) > 1 ? " (median over $(length(effects)) rotations)" : "")
cell(f, h) = round(median(getfield(e, f)[h + 1] for e in effects); digits = 3)
println(rpad("h", 5), rpad("total", 10), rpad("through", 10), "direct")
for h in [0, 1, 2, 4, 8, 12, 16]
    println(rpad(h, 5), rpad(cell(:total, h), 10), rpad(cell(:through, h), 10), cell(:direct, h))
end
'''

[[actionGroups.actions]]
id = "granger"
label = "Granger Causality"
desc = "Test whether the lags of one variable help predict another"
code = '''
using MacroEconometricModels

{{?model=var|svar}}G = granger_test_all(model)  # Wald tests; G[effect, cause]
{{?model=favar}}G = granger_test_all(to_var(model))  # on the system [factors, y]
{{?model!=vecm}}println("p-values (rows = effect, columns = cause):")
{{?model!=vecm}}display([isnothing(g) ? NaN : round(g.pvalue, digits = 3) for g in G])
{{?model=vecm}}display(granger_causality_vecm(model, 1, 2))  # does variable 1 cause variable 2: short run, long run (via alpha) and strong
'''
