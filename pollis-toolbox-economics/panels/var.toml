[[actionGroups.actions]]
id = "var-vs-vecm"
label = "VAR vs VECM"
models = ["var", "svar", "vecm"]
desc = "AIC and BIC of the VAR in levels and of a VECM at every rank, on the same sample"
code = '''
using MacroEconometricModels, LinearAlgebra

n = size({{yvar}}, 2)
levels = estimate_var({{yvar}}, {{p}}; check_stability = false)  # unrestricted VAR({{p}}) = VECM with full rank n
Teff = size(levels.U, 1)  # T - p, the same sample as every VECM below
# Same formula for both: log det of the ML residual covariance plus a penalty on the free parameters.
# VAR: n(1 + n p). VECM rank r: n constants + n^2 (p - 1) Gamma + r(2n - r) for alpha and beta (net of normalisation).
crit(S, k) = (round(logdet(S) + 2k / Teff, digits = 3), round(logdet(S) + k * log(Teff) / Teff, digits = 3))
println("model         AIC, BIC")
for rk in 1:(n - 1)
     m = estimate_vecm({{yvar}}, {{p}}; rank = rk, deterministic = :constant)
     println(rpad("VECM r = $rk", 14), crit(m.Sigma, n + n^2 * ({{p}} - 1) + rk * (2n - rk)))
end
println(rpad("VAR (r = $n)", 14), crit(levels.Sigma, n * (1 + n * {{p}})))
'''

