[[actionGroups.actions]]
id = "replicate-bhj-table4"
label = "Borusyak, Hull and Jaravel's Table 4"
desc = "Borusyak, Hull and Jaravel (2022), Table 4: the effect of Chinese import competition on manufacturing employment across the US commuting zones, 1990 to 2007, by a shift-share IV estimated across the industries, in seven columns of controls, the estimates, standard errors, first-stage F and null-imposed intervals beside those the article prints"
models = ["ssiv"]
code = '''
using PollisDatasets

let
	czr = dataset("adh_czones")  # Borusyak, Hull and Jaravel's data of Autor, Dorn and Hanson (2013)
	shk = dataset("adh_shocks")
	order_r = sortperm(collect(zip(czr.year, czr.czone)))  # period by period, the zones varying fastest
	order_k = sortperm(collect(zip(shk.year, shk.sic87dd)))
	nz, K1 = length(order_r), count(==(1990), shk.year)
	cz(v) = Float64.(getproperty(czr, Symbol(v))[order_r])
	sk(v) = getproperty(shk, Symbol(v))[order_k]
	row = Dict((czr.czone[r], czr.year[r]) => i for (i, r) in enumerate(order_r))
	colk = Dict((sk("sic87dd")[j], sk("year")[j]) => j for j in eachindex(order_k))
	sh_rows = Tables.columntable(DBInterface.execute(con, "SELECT * FROM '$(samplefile("adh_shares.parquet"))'"))
	Wa = zeros(nz, length(order_k))  # zones and periods by industries and periods
	for (c, yr, s, v) in zip(sh_rows.czone, sh_rows.year, sh_rows.sic87dd, sh_rows.share)
		Wa[row[(c, yr)], colk[(s, yr)]] = v
	end
	ga, sic3, group, year_k = Float64.(sk("g")), sk("sic3"), sk("sicgroup"), sk("year")
	t2 = cz("t2"); lsh = vec(sum(Wa; dims = 2))  # the lagged manufacturing share
	adh = reduce(hcat, cz.(["reg_midatl", "reg_encen", "reg_wncen", "reg_satl", "reg_escen", "reg_wscen", "reg_mount", "reg_pacif", "l_sh_popedu_c", "l_sh_popfborn", "l_sh_empl_f", "l_sh_routine33", "l_task_outsource"]))
	groups9 = reduce(hcat, [vec(sum(Wa[:, group .== j]; dims = 2)) for j in 1:9])  # the shares of the SIC groups; the tenth is lsh minus these
	aadhp = reduce(hcat, cz.(["cz_prode_share1991", "cz_cap_va1991", "cz_log_avg_wage1991", "cz_ind_ci_1990", "cz_ind_htsh1_1990"]))
	sics = sort(unique(sk("sic87dd")))
	industry = zeros(nz, length(sics))  # each zone's share in each industry, in its period
	for j in eachindex(ga); industry[:, searchsortedfirst(sics, sk("sic87dd")[j])] .+= Wa[:, j]; end
	year_d = Float64.(year_k .== 2000)
	group_d = reduce(hcat, [Float64.(group .== j) for j in 2:10])
	chars = reduce(hcat, [Float64.(sk(v)) for v in ["prode_share1991", "cap_va1991", "log_avg_wage1991", "ind_ci_1990", "ind_htsh1_1990"]])
	industry_d = reduce(hcat, [Float64.(sk("sic87dd") .== s) for s in sics[2:end]])
	base = hcat(t2, lsh, lsh .* t2)
	columns = [(hcat(t2, cz("l_shind_manuf_cbp"), adh), nothing), (hcat(t2, lsh, adh), nothing), (hcat(base, adh), year_d), (base, year_d),
		(hcat(base, adh, groups9), hcat(year_d, group_d)), (hcat(base, adh, aadhp), hcat(year_d, chars)), (hcat(t2, lsh .* t2, industry, adh), hcat(year_d, industry_d))]
	published = [-0.596 0.114 -1.059 -0.395 185.586; -0.489 0.100 -0.832 -0.309 166.730; -0.267 0.099 -0.568 -0.028 123.638; -0.314 0.107 -0.637 -0.018 272.349;
		-0.310 0.134 -0.705 -0.002 64.590; -0.290 0.129 -0.699 0.002 63.293; -0.432 0.205 -1.207 0.122 27.613]
	println(rpad("Column", 8), rpad("Julia", 11), rpad("Article", 9), rpad("Julia SE", 10), rpad("Article", 9), rpad("Julia interval", 22), rpad("Article", 18), rpad("Julia F", 10), "Article")
	for (j, (Cj, SCj)) in enumerate(columns)
		if j == 1  # the shares completed by the rest of each zone's employment, a shock of 0 in each period, as the article's column 1
			rest = 1 .- lsh
			Wj = hcat(rest .* (t2 .== 0), Wa[:, 1:K1], rest .* (t2 .== 1), Wa[:, (K1 + 1):end])
			gj, cj = vcat(0.0, ga[1:K1], 0.0, ga[(K1 + 1):end]), vcat(0, sic3[1:K1], 0, sic3[(K1 + 1):end])
		else
			Wj, gj, cj = Wa, ga, sic3
		end
		dj = shift_share_design(Wj, gj; controls = Cj, weights = cz("timepwt48"))
		fj = fit_shock_level(cz("d_sh_empl_mfg"), dj; treatment = cz("d_tradeusch_pw"), shock_controls = SCj, shock_clusters = cj)
		p = published[j, :]
		println(rpad(j, 8), rpad(round(fj.beta, digits = 4), 11), rpad(p[1], 9), rpad(round(fj.se, digits = 4), 10), rpad(p[2], 9),
			rpad("[$(round(fj.ci[1], digits = 3)), $(round(fj.ci[2], digits = 3))]", 22), rpad("[$(p[3]), $(p[4])]", 18), rpad(round(fj.first_stage_F, digits = 3), 10), p[5])
		if j == 7  # the article's column 7 absorbs the industries with ivreghdfe, which corrects for the clusters and the regressors left
			factor = fj.n_clusters / (fj.n_clusters - 1) * (fj.n_shocks - 1) / (fj.n_shocks - 3)
			println("Column 7 with that small-sample correction: SE ", round(fj.se * sqrt(factor), digits = 4), ", F ", round(fj.first_stage_F / factor, digits = 3))
		end
	end
	println("\nThe article finds the ends of its intervals by bisection to 0.001, and prints three decimals")
end
'''

