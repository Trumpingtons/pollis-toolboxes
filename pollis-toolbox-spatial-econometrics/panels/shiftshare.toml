desc = "Which shocks the shift-share estimate rests on: the estimate taken apart, as Goldsmith-Pinkham, Sorkin and Swift show, into one estimate per shock, with the shares in that shock alone as the instrument, and the weight of each in the whole, the shocks of the largest weights listed with their own estimates, and the negative weights counted"
code = '''
using ECharts

# The estimate is the weighted sum of one estimate per shock, each with the shares in that shock alone as the instrument; the weights sum to 1 and can be negative
{{?model=ssiv}} rw = rotemberg_weights(y, x, d)
{{?model=ssreduced}} rw = rotemberg_weights(y, d.X, d)
println("Estimate ", round(m.beta, digits = 4), "; the weighted sum of the estimates per shock ", round(rw.beta_overall, digits = 4), ", with weights summing to ", round(rw.alpha_sum, digits = 4))
top = first(rw.order, 10)  # the shocks of the largest weights, positive or negative
println("\n", rpad("Shock", 20), rpad("Weight", 10), rpad("Its own estimate", 18), rpad("Shock value", 14), "Mean share")
for k in top
	println(rpad(shock_names[k], 20), rpad(round(rw.alpha[k], digits = 4), 10), rpad(isnan(rw.beta_k[k]) ? "none" : string(round(rw.beta_k[k], digits = 4)), 18), rpad(round(d.g[k], digits = 3), 14), round(d.s_bar[k], digits = 4))
end
weight_top5 = sum(abs, rw.alpha[first(rw.order, 5)]) / sum(abs, rw.alpha)
println("\nThe 5 shocks of the largest weights carry ", round(100 * weight_top5, digits = 1), "% of the absolute weight, of ", length(rw.alpha), " shocks")
println("Negative weights: ", rw.n_negative, " shocks, summing to ", round(rw.negative_mass, digits = 4))
isempty(rw.undefined) || println(length(rw.undefined), " shocks with no first stage of their own, given weight 0")
display(EChart(ec_width = 700, ec_height = 320, title = [ECharts.Title(text = "Weights of the shocks, largest first")],
	xAxis = [ECharts.Axis(_type = "category", name = "{{shockColumn}}", data = shock_names[first(rw.order, 20)])], yAxis = [ECharts.Axis(_type = "value", name = "Weight")],
	series = [ECharts.XYSeries(name = "Weight", _type = "bar", data = round.(rw.alpha[first(rw.order, 20)], digits = 4))]))
println("\nGoldsmith-Pinkham, Sorkin and Swift propose the weights to name the shocks whose shares have to be defended as unrelated to the outcome's other causes; a weight shows how much a flaw in that shock would move the estimate")
'''

