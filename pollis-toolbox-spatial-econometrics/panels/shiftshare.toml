[[faq]]
question = "Which tab of the Shift-Share Designs panel should I start with?"
answer = '''
Shift-Share IV when the question is the effect of a change that local conditions also cause, such as the growth of imports in a local labour market: the shift-share regressor instruments it. Reduced Form when the exposure to the shocks is itself the quantity of interest: the outcome on the shift-share regressor. Both estimate across the shocks and print the same kind of standard error and interval.
'''
wiki = "Overview"

[[faq]]
question = "Why does the panel estimate across the shocks?"
answer = '''
Borusyak, Hull and Jaravel (2022) show that the coefficient of a shift-share IV regression can be obtained from an equivalent regression across the shocks, and that identification can follow from the quasi-random assignment of the shocks while the shares are allowed to be endogenous. The shocks are then the observations, and the usual standard error of the regression across the shocks is valid however the areas' residuals are correlated.
'''
wiki = "Inference Across the Shocks"

[[faq]]
question = "What does Shock Clusters do?"
answer = '''
It names a column of the shocks file whose values group shocks that may be correlated, and the standard error is clustered by it. Borusyak, Hull and Jaravel cluster the industries of Autor, Dorn and Hanson by their 3-digit SIC code. In a stacked design an industry has the same code in every period, so its shocks may be correlated over time.
'''
wiki = "Inference Across the Shocks"

[[faq]]
question = "What is the interval with the null imposed?"
answer = '''
The values of the coefficient that a test with the null imposed does not reject at 5%: for each value, the residual of the regression across the shocks is formed with that value, and the test asks whether it is unrelated to the shocks. Borusyak, Hull and Jaravel report it beside the usual standard error; it need not be symmetric around the estimate, and with a weak instrument it can be unbounded.
'''
wiki = "Inference Across the Shocks"
hidden = true

[[faq]]
question = "What is the effective number of shocks?"
answer = '''
The reciprocal of the Herfindahl index of the mean shares, computed by exposure_concentration. The documentation of exposure_concentration states that the asymptotics are in the number of shocks, so an estimate resting on a few effective shocks is not supported by the theory however many areas there are.
'''
wiki = "Inference Across the Shocks"
hidden = true

[[faq]]
question = "Why are the share total and its products with the periods among the controls?"
answer = '''
The documentation of shift_share_design explains that the framework of Borusyak, Hull and Jaravel assumes each area's shares sum to the same total; when they do not, as with shares of manufacturing jobs only, the total is an area characteristic correlated with the regressor and belongs among the controls. With stacked periods each period has its own total, so the panel adds the total and its product with each period indicator.
'''
wiki = "Shares, Shocks and Identification"
hidden = true

[[faq]]
question = "Why does column 7 of the replication differ in its standard error?"
answer = '''
The article's column 7 absorbs the industries with Stata's ivreghdfe, which applies a small-sample correction for the number of clusters and of regressors; its other columns use ivreg2 without one, as the panel does. The step prints column 7 also with that correction, which brings the standard error and the first-stage F to the article's.
'''
wiki = "Replications"
hidden = true
