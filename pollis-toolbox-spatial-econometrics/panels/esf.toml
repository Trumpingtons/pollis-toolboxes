[[faq]]
question = "When should I use a spatial filter instead of a spatial lag or error model?"
answer = '''
When the spatial autocorrelation is a nuisance rather than the question. A spatial lag model estimates how an area's outcome depends on its neighbours' outcomes, and a spatial error model the dependence of the errors; a spatial filter makes no claim about how the dependence arises, it removes it, so that the coefficients of the explanatory variables and their standard errors can be read as in an ordinary regression. A filter is also simpler for counts.
'''
wiki = "Decision Guide"

[[faq]]
question = "Should I select the eigenvectors by the Moran criterion or by AIC?"
answer = '''
The Moran criterion adds the eigenvector that most reduces the Moran coefficient of the residuals and stops once it is close to zero, so it removes the residual autocorrelation with few eigenvectors. AIC adds the eigenvector that most improves the fit for the number of parameters, whether or not autocorrelation remains. Use the Moran criterion when the coefficients of the explanatory variables are the purpose, and AIC when the fit of the model matters most.
'''
wiki = "Selecting Eigenvectors"

[[faq]]
question = "What does random-effects ESF do differently from stepwise ESF?"
answer = '''
It keeps every candidate eigenvector instead of choosing some, and shrinks their coefficients towards zero, with a single variance ratio, theta, estimated by restricted maximum likelihood. Because nothing is chosen on the outcome, its standard errors do not suffer from the selection that makes those of stepwise ESF somewhat too small; the price is a filter that cannot be read eigenvector by eigenvector.
'''
wiki = "Random-Effects ESF"

[[faq]]
question = "Can eigenvector spatial filtering be used for counts?"
answer = '''
Yes. The selected eigenvectors are ordinary explanatory variables, so they can enter a Poisson or negative binomial regression as easily as a linear one, where spatial lag and error models do not carry over directly. The ESF for Counts tab selects them by the Moran coefficient of the Pearson residuals, each residual divided by its standard deviation under the model.
'''
wiki = "Spatial Filtering for Counts and Binary Outcomes"

[[faq]]
question = "What does the Candidate Screen input do?"
answer = '''
It limits the candidate eigenvectors to those whose Moran coefficient is at least the given share of the largest, the patterns of marked positive spatial autocorrelation. The default, a quarter, is that of SpatialEconometrics.jl and of spmoran. A lower share adds candidates of weaker autocorrelation, at the cost of more possible selections.
'''
wiki = "Moran Eigenvectors"
hidden = true

[[faq]]
question = "Why is the residual Moran coefficient of random-effects ESF negative?"
answer = '''
Removing the filter takes out the directions of positive autocorrelation, so the residuals lie mostly among the other eigenvectors and their Moran coefficient is expected to be clearly negative. Read it against the reference value the Random-Effects ESF tab prints, the Moran coefficient of a random vector among the eigenvectors left out, not against zero: close to it or above it is the healthy case.
'''
wiki = "Random-Effects ESF"
hidden = true

[[faq]]
question = "Can I trust the standard errors of stepwise ESF?"
answer = '''
With some care. The eigenvectors are chosen on the same outcome the regression then explains, and the standard errors treat them as fixed in advance, so the confidence intervals of the explanatory variables' coefficients are somewhat too narrow when eigenvectors are selected. Random-effects ESF avoids the selection.
'''
wiki = "ESF, Moran Criterion"
hidden = true

[[faq]]
question = "What is the alpha printed on the ESF for Counts tab?"
answer = '''
The dispersion parameter of the negative binomial regression, estimated by maximum likelihood: with it, the variance of a count grows with the square of its expected value. An alpha close to zero means the counts vary little more than a Poisson regression allows.
'''
wiki = "ESF for Counts"
hidden = true

[[faq]]
question = "Which software are the panel's results checked against?"
answer = '''
spmoran, the R package of Murakami, from the output its case study examples print for the Boston housing data: ESF and random-effects ESF of the corrected median house value on seven variables. The Boston House Prices step prints Julia's values beside them.
'''
wiki = "Replications"
