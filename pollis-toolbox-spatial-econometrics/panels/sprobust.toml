S = [sqrt(max(0.0, vcov_conley(Xd, res, N, T_per, ConleySpatialHAC(coords, c; max_time_lag = {{lags}}, space_kernel = kernel))[j, j])) for c in cuts, j in eachindex(b)]
println(rpad("cutoff, km", 12), join((rpad(n, 16) for n in cnames)))
println(rpad("usual", 12), join((rpad(round(s, sigdigits = 4), 16) for s in se0)))
foreach(k -> println(rpad(cuts[k], 12), join((rpad(round(S[k, j], sigdigits = 4), 16) for j in eachindex(b)))), eachindex(cuts))
println("A standard error that keeps rising with the cutoff: the correlation reaches further than the cutoff chosen")
EChart(ec_width = 700, ec_height = 420, title = [ECharts.Title(text = "Standard Error Relative to the Usual One")],
	xAxis = [ECharts.Axis(_type = "category", name = "km", data = string.(cuts))], yAxis = [ECharts.Axis(_type = "value", name = "Ratio")],
	series = [ECharts.XYSeries(name = cnames[j], _type = "line", data = round.(S[:, j] ./ se0[j], digits = 3)) for j in eachindex(b)])
'''

