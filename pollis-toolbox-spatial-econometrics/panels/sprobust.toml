[[faq]]
question = "Why are the usual standard errors too small when areas are correlated?"
answer = '''
The usual standard errors assume that every observation brings new information. When neighbouring areas share shocks, and the explanatory variable is also alike in neighbouring areas, their errors move together, so a sample of correlated areas holds less information than its size suggests. The coefficient is still estimated without bias, but the standard errors, and the confidence intervals and tests built on them, claim more precision than there is.
'''
wiki = "Overview"

[[faq]]
question = "How do I choose the distance cutoff of Conley's standard errors?"
answer = '''
The cutoff is the distance beyond which two areas are treated as uncorrelated. It should reach as far as the correlation of the errors does. Residual Correlation by Distance shows how the correlation of the residuals falls with distance, and Standard Errors Against the Cutoff shows how much the answer depends on the choice. Reporting the standard errors at a few cutoffs is common practice.
'''
wiki = "Choosing a Cutoff"

[[faq]]
question = "When should I cluster instead of using Conley's standard errors?"
answer = '''
Clustering suits correlation that stays inside known groups, such as districts or regions, and stops at their borders, and it needs many groups. Conley's standard errors suit correlation that fades with distance and crosses any border. Driscoll and Kraay's suit panels with many periods, where any area may be correlated with any other in the same period.
'''
wiki = "Decision Guide"

[[faq]]
question = "How do I know the panel gives the same standard errors as other software?"
answer = '''
The Replicate group of the Next Steps computes the clustered standard errors of Petersen's test data beside the values Petersen publishes, Driscoll and Kraay's beside R's plm and fixest on the same data, and Conley's beside R's fixest on the earthquakes off Fiji of R's datasets package, each with the difference.
'''
wiki = "Replications"

[[faq]]
question = "Why does the Driscoll–Kraay tab need several periods?"
answer = '''
Driscoll and Kraay's estimator sums the scores of all areas in each period and treats the sums as a time series, whose correlation over the periods it corrects as Newey and West do. With few periods there are few sums to estimate their variance from, and the standard errors are unreliable. With a cross-section, a single period, the tab stops and says so.
'''
wiki = "Driscoll–Kraay"
hidden = true

[[faq]]
question = "What does the ratio column of the table mean?"
answer = '''
It is the robust standard error divided by the usual one. A ratio near 1 means the correction changes little; a ratio of 2 means the usual standard error was half what it should be, and the usual t-statistic twice too large. The documentation of SpatialEconometrics.jl calls the ratio the diagnostic worth reading.
'''
wiki = "Overview"
hidden = true

[[faq]]
question = "Does a spatial correction change the coefficients?"
answer = '''
No. All three tabs fit the same least squares regression, so the estimates are the same; only their standard errors, t-statistics and p-values change. A spatial lag model, which changes the estimates themselves, is compared in With a Spatial Lag.
'''
wiki = "Overview"
hidden = true

[[faq]]
question = "Why should the distances be in a projected coordinate system?"
answer = '''
The tab measures straight-line distances between the centroids, in kilometres, in the Distance Coordinate System. In longitude and latitude a degree of longitude shrinks towards the poles, so straight-line distances in degrees mislead. A projected system for the region, such as a UTM zone, keeps distances close to their true length.
'''
wiki = "Conley Spatial HAC"
hidden = true

