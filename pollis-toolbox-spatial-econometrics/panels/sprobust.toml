# Spatial Correlation Robust Inference: least squares on areas, or on areas observed over several periods, with standard
# errors corrected for spatial correlation by Conley's spatial HAC, by clusters or by Driscoll and Kraay, with
# SpatialEconometrics.jl; the areas are read through DuckDB's spatial extension. Replications of Petersen's test data,
# R's plm and fixest.

