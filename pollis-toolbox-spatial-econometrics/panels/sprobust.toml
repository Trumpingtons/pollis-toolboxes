[[actionGroups.actions]]
id = "save-results"
label = "Save the Results"
desc = "Write the coefficients with the usual and the tab's robust standard errors to spatial-robust-se.csv, and the areas with their mean residual to spatial-robust.parquet, in the folder above"
code = '''
out_csv, out_parquet = joinpath(folder, "spatial-robust-se.csv"), joinpath(folder, "spatial-robust.parquet")
if isfile(out_csv) || isfile(out_parquet)
	println(out_csv, " or ", out_parquet, " is there already: rename or move it first")
else
	se = sqrt.(max.(0.0, diag(V)))
	open(out_csv, "w") do io
		println(io, "coefficient,estimate,usual_se,robust_se")
		foreach(j -> println(io, cnames[j], ",", b[j], ",", se0[j], ",", se[j]), eachindex(b))
	end
	rbar = vec(mean(reshape(res, N, T_per), dims = 2))
	DBInterface.execute(con, "CREATE OR REPLACE TABLE fit AS SELECT i, r::DOUBLE AS residual FROM (VALUES $(join(("($i, $(rbar[i]))" for i in 1:N), ", "))) t(i, r)")
	DBInterface.execute(con, "COPY (SELECT a.area, f.residual, a.geom FROM areas a JOIN fit f USING (i) ORDER BY i) TO '$(out_parquet)' (FORMAT PARQUET)")  # GeoParquet: DuckDB writes the geometry column's metadata
	println("Wrote ", out_csv, " and ", out_parquet)
end
'''
