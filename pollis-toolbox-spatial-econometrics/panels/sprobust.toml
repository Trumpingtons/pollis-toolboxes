[[actionGroups.actions]]
id = "replicate-petersen"
label = "Petersen's Test Data"
desc = "The 5000 firm-years of Petersen's test data: the standard errors clustered by firm and by year beside the values Petersen publishes, and Driscoll and Kraay's beside R's plm and fixest"
code = '''
using Downloads

let
	file = Downloads.download("https://www.kellogg.northwestern.edu/faculty/petersen/htm/papers/se/test_data.txt", joinpath(mktempdir(), "test_data.txt"))
	rows = [parse.(Float64, split(l)) for l in eachline(file) if !isempty(strip(l))]  # firm, year, x, y
	P = reduce(vcat, transpose.(rows))
	P = P[sortperm(collect(zip(P[:, 2], P[:, 1]))), :]  # year by year, the firms varying fastest
	firm, year = Int.(P[:, 1]), Int.(P[:, 2])
	Xp = hcat(ones(size(P, 1)), P[:, 3])
	bp = Xp \ P[:, 4]
	ep = P[:, 4] - Xp * bp
	np, Np, Tp = size(P, 1), length(unique(firm)), length(unique(year))
	se(V) = sqrt.(diag(V))
	function report(title, rows)
		println("\n", title)
		println(rpad("", 34), rpad("Julia", 16), rpad("published", 16), "difference")
		for (what, julia, published) in rows
			println(rpad(what, 34), rpad(round(julia, digits = 10), 16), rpad(published, 16), round(julia - published, sigdigits = 2))
		end
	end
	usual = se(sum(abs2, ep) / (np - 2) .* inv(transpose(Xp) * Xp))
	byfirm = se(vcov_cluster(Xp, ep, ClusterRobustVCOV(firm)))
	byyear = se(vcov_cluster(Xp, ep, ClusterRobustVCOV(year)))
	println(np, " firm-years, ", Np, " firms, ", Tp, " years")
	report("Petersen's published values, to 4 decimals", [("intercept", bp[1], 0.0297), ("x", bp[2], 1.0348),
		("se intercept, usual", usual[1], 0.0284), ("se x, usual", usual[2], 0.0286),
		("se intercept, clustered by firm", byfirm[1], 0.0670), ("se x, clustered by firm", byfirm[2], 0.0506),
		("se intercept, clustered by year", byyear[1], 0.0234), ("se x, clustered by year", byyear[2], 0.0334)])
	dk = se(vcov_driscoll_kraay(Xp, ep, Np, Tp; spec = DriscollKraayVCOV(max_lag = 2)))
	dk0 = se(vcov_driscoll_kraay(Xp, ep, Np, Tp; spec = DriscollKraayVCOV(max_lag = 2, small_sample_correct = false)))
	report("Driscoll and Kraay, 2 lags: R's plm, vcovSCC(maxlag = 2, type = \"HC1\")", [("se intercept", dk[1], 0.0228911478), ("se x", dk[2], 0.0244198042)])
	report("Driscoll and Kraay, 2 lags, no adjustment: R's fixest, vcov_DK(lag = 2, ssc = ssc(K.adj = FALSE, G.adj = FALSE))", [("se intercept", dk0[1], 0.0228865691), ("se x", dk0[2], 0.0244149197)])
end
'''

[[actionGroups.actions]]
id = "replicate-fixest-conley"
label = "Earthquakes off Fiji: fixest"
desc = "The 1000 earthquakes of R's datasets package: Conley's standard errors with a uniform kernel and great-circle distances at 50 and 100 km beside R's fixest"
code = '''
using Downloads

let
	file = Downloads.download("https://vincentarelbundock.github.io/Rdatasets/csv/datasets/quakes.csv", joinpath(mktempdir(), "quakes.csv"))
	rcon = DBInterface.connect(DuckDB.DB)
	qk = Tables.columntable(DBInterface.execute(rcon, "SELECT lat::DOUBLE AS lat, long::DOUBLE AS lon, depth::DOUBLE AS depth, mag::DOUBLE AS mag, stations::DOUBLE AS stations FROM read_csv('$(file)')"))
	Xq = hcat(ones(length(qk.mag)), qk.depth, qk.stations)  # magnitude on depth and the number of stations that reported the earthquake
	eq = qk.mag - Xq * (Xq \ qk.mag)
	println("\nConley, uniform kernel, great-circle distances on a sphere of radius 6376 km, as fixest; no small-sample adjustment, ssc = ssc(K.adj = FALSE)")
	println(rpad("", 30), rpad("Julia", 16), rpad("fixest", 16), "difference")
	for (cut, published) in ((50.0, [0.0214452646, 0.0000460976, 0.0003712446]), (100.0, [0.0262143995, 0.0000579418, 0.0003790993]))
		Vq = vcov_conley(Xq, eq, length(eq), 1, ConleySpatialHAC(hcat(qk.lat, qk.lon), cut; metric = HaversineDistance(radius_km = 6376.0), space_kernel = UniformKernel(), psd_fix = false))
		for (j, name) in enumerate(["intercept", "depth", "stations"])
			julia = sqrt(Vq[j, j])
			println(rpad("se $(name), $(Int(cut)) km", 30), rpad(round(julia, digits = 10), 16), rpad(published[j], 16), round(julia - published[j], sigdigits = 2))
		end
	end
end
'''

