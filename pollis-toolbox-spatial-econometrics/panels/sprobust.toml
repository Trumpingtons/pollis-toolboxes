lagm = T_per == 1 ? fit_spatial(SAR(), W, X, y; varnames = xnames) : fit_spatial_panel(SAR(), fe, W, X, y, N, T_per; varnames = xnames)  # maximum likelihood, neighbours sharing a boundary
se_table("Least squares, the tab's robust standard errors", V)
