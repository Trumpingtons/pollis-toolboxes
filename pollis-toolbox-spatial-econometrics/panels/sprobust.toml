	println(rpad(name, 20), rpad(length(unique(g)), 10), join((rpad(round(sqrt(max(0.0, Vg[j, j])), sigdigits = 4), 16) for j in eachindex(b))))
end
println("Wider groups allow for more correlation, but leave fewer clusters to estimate it from")
