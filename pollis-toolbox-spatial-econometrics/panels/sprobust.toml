[[actionGroups.actions]]
id = "residual-moran"
label = "Moran's I of the Residuals"
desc = "Are the residuals of neighbouring areas alike? Moran's I period by period, with a pseudo p-value from 499 random permutations"
code = '''
println(rpad("period", 8), rpad("Moran's I", 12), rpad("expected", 12), "pseudo p-value")
for t in 1:T_per
	mr = moran_global(res[(t - 1) * N + 1:t * N], W; inference = :permutation, n_perm = 499, rng = Xoshiro(2026))  # a fixed seed: the same permutations every time
	println(rpad(t, 8), rpad(round(mr.I_stat, digits = 4), 12), rpad(round(mr.E_I, digits = 4), 12), mr.p_value)
end
println("A small p-value: neighbouring areas' residuals are alike, and the usual standard errors are too small")
'''

[[actionGroups.actions]]
id = "residual-correlogram"
label = "Residual Correlation by Distance"
desc = "The correlation of the residuals of pairs of areas in the same period, in bands of distance: how far the correlation reaches, a guide to the cutoff"
code = '''
using ECharts

band = {{cutoff}} / 3
edges = collect(0:band:4 * {{cutoff}})  # bands of a third of the cutoff, up to 4 times the cutoff
num, den = zeros(length(edges) - 1), zeros(Int, length(edges) - 1)
for t in 1:T_per
	e = res[(t - 1) * N + 1:t * N]
	for i in 1:N, j in i + 1:N
		k = searchsortedlast(edges, hypot(coords[i, 1] - coords[j, 1], coords[i, 2] - coords[j, 2]))
		if 1 <= k < length(edges)
			num[k] += e[i] * e[j]
			den[k] += 1
		end
	end
end
keep = findall(>(0), den)  # bands with at least one pair
r = [num[k] / den[k] / (sum(abs2, res) / nobs) for k in keep]
println(rpad("distance, km", 16), rpad("pairs", 10), "correlation")
foreach(((k, rk),) -> println(rpad("$(round(edges[k], digits = 2))-$(round(edges[k + 1], digits = 2))", 16), rpad(den[k], 10), round(rk, digits = 3)), zip(keep, r))
println("Where the correlation falls to about zero is where a cutoff stops gaining anything")
EChart(ec_width = 700, ec_height = 400, title = [ECharts.Title(text = "Residual Correlation by Distance")],
	xAxis = [ECharts.Axis(_type = "category", name = "km", data = [string(round((edges[k] + edges[k + 1]) / 2, digits = 2)) for k in keep])],
	yAxis = [ECharts.Axis(_type = "value", name = "Correlation")],
	series = [ECharts.XYSeries(name = "Correlation", _type = "line", data = round.(r, digits = 4))])
'''

[[actionGroups.actions]]
id = "design-check"
label = "Design Check"
desc = "What each estimator leans on in these data: areas within the cutoff for Conley, the number and size of the clusters, and the number of periods for Driscoll and Kraay"
code = '''
within = [count(j -> j != i && hypot(coords[i, 1] - coords[j, 1], coords[i, 2] - coords[j, 2]) < {{cutoff}}, 1:N) for i in 1:N]
println("Conley: areas within {{cutoff}} km of each area, median ", median(within), ", fewest ", minimum(within))
try
	g = String.(Tables.columntable(DBInterface.execute(con, "SELECT \"{{clusterColumn}}\"::VARCHAR AS v FROM obs ORDER BY t, i")).v)
	sizes = [count(==(k), g) for k in unique(g)]
	println("Clusters by {{clusterColumn}}: ", length(sizes), " clusters of ", minimum(sizes), " to ", maximum(sizes), " rows", length(sizes) < 20 ? ": too few for reliable cluster-robust standard errors" : "")
catch
	println("Clusters: no column {{clusterColumn}} in the data")
end
println("Driscoll and Kraay: ", T_per, " periods", T_per < 20 ? ", few for an estimator that leans on many periods" : "")
'''

