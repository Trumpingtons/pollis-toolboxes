[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. Choose... picks another. A file given by an absolute path is read where it is. Save the Results writes there."
default = "~/.pollis/data/examples"
folder = "data/examples"

[[inputs]]
id = "areasFile"
label = "Areas File"
tooltip = "The file of areas, as polygons, one per area: GeoPackage (its first layer), GeoJSON, Shapefile, FlatGeobuf or KML, in the folder above, or an absolute path. With the default, bruggepanel.gpkg, the example first writes a grid of 225 square cells of 1 km around Bruges, and the panel file beside it, unless the folder has both already."
default = "bruggepanel.gpkg"

[[inputs]]
id = "panelFile"
label = "Panel File"
tooltip = "The data, one row per area and period: a CSV or Parquet file, in the folder above, or an absolute path. Areas without a value in some period, or without a polygon in the areas file, are left out, so that every area left has every period. Leave it empty for a cross-section whose columns are in the areas file itself."
default = "bruggepanel.csv"

[[inputs]]
id = "areaColumn"
label = "Area Column"
tooltip = "The column that names each area, in both files: the panel's rows are joined to the polygons by it."
default = "cell"
newRow = true

[[inputs]]
id = "periodColumn"
label = "Period Column"
tooltip = "The column of the panel file that names each period, a year, a quarter or a date: the periods are put in its order. Not used for a cross-section."
default = "year"

[[inputs]]
id = "dependent"
label = "Dependent Variable"
tooltip = "The numeric column to explain. With the example files, price: the log of the price per square metre of the dwellings sold in the cell that year."
default = "price"

[[inputs]]
id = "explanatory"
label = "Explanatory Variables"
tooltip = "The numeric columns that explain it, separated by commas. With the example files, green: the share of green space in the cell, in per cent; noise: the mean road noise, in decibels."
default = "green, noise"

[[inputs]]
id = "effects"
label = "Fixed Effects"
tooltip = "What is removed before least squares: None, a single intercept; Periods, a level for each period, common to all areas; Areas, a level of its own for each area; Areas and Periods, the two together. The effects are removed by subtracting means, which gives the same slopes as a dummy for each level. A cross-section takes None."
kind = "select"
default = "none"

[[inputs.options]]
value = "none"
label = "None"

[[inputs.options]]
value = "periods"
label = "Periods"

[[inputs.options]]
value = "areas"
label = "Areas"

[[inputs.options]]
value = "both"
label = "Areas and Periods"

[[inputs]]
id = "fileCrs"
label = "File Coordinate System"
tooltip = "The coordinate system of the areas file's coordinates, as an EPSG code: the areas are moved from it into longitude and latitude on WGS 84 (EPSG:4326) for the maps. The example's cells are in EPSG:31370, Belgian Lambert 72. GeoJSON and KML are always EPSG:4326."
default = "EPSG:31370"
newRow = true

[[inputs]]
id = "distanceCrs"
label = "Distance Coordinate System"
tooltip = "A projected coordinate system in metres, as an EPSG code, in which the distances between the areas' centroids are measured, in kilometres: a UTM zone or the national grid of the region. With a file in longitude and latitude, choose one here."
default = "EPSG:31370"

[[inputs]]
id = "cutoff"
label = "Cutoff (km)"
tooltip = "Conley Spatial HAC: the distance between centroids, in kilometres, beyond which two areas are treated as uncorrelated. Residual Correlation by Distance and Standard Errors Against the Cutoff help to choose it."
default = "3"
newRow = true

[[inputs]]
id = "kernel"
label = "Kernel"
tooltip = "Conley Spatial HAC: how the weight of a pair of areas falls with their distance. Bartlett, from 1 for areas at the same place down to 0 at the cutoff, as Conley (1999) proposes; Uniform, 1 for every pair within the cutoff, as R's fixest does; Parzen, a smoother fall."
kind = "select"
default = "bartlett"

[[inputs.options]]
value = "bartlett"
label = "Bartlett"

[[inputs.options]]
value = "uniform"
label = "Uniform"

[[inputs.options]]
value = "parzen"
label = "Parzen"

[[inputs]]
id = "lags"
label = "Lags"
tooltip = "In a panel: the number of periods over which the errors may stay correlated, with weights falling as Newey and West's. Conley Spatial HAC uses it for the correlation of each area with itself over the periods; Driscoll–Kraay for the correlation of the period sums."
default = "2"

[[inputs]]
id = "clusterColumn"
label = "Cluster Column"
tooltip = "Cluster-Robust: the column whose values name the groups, numbers or text, in the panel file, or in the areas file for a cross-section. With the example files, district: 25 districts of 3 by 3 cells."
default = "district"

[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables, SpatialEconometrics, SparseArrays, LinearAlgebra, Statistics, Random, Distributions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the files stay where they are
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Spatial Econometrics Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files: Choose... picks another
areas_path = joinpath(folder, "{{areasFile}}")  # an absolute path is kept as it is
crosssection = isempty(strip("{{panelFile}}"))  # no panel file: a cross-section, whose columns are in the areas file
panel_path = crosssection ? "" : joinpath(folder, "{{panelFile}}")
# Example files: 15 by 15 square cells of 1 km around Bruges, in EPSG:31370, observed over 12 years, written unless the folder has both already. Replace them with your own files.
if basename(areas_path) == "bruggepanel.gpkg" && basename(panel_path) == "bruggepanel.csv" && !(isfile(areas_path) && isfile(panel_path))
	rng = Xoshiro(2026)  # a fixed seed: the same values every time
	u, v = repeat(-7:7, outer = 15), repeat(-7:7, inner = 15)  # km east and north of the centre, row by row from the south-west
	grid = [(c, d) for c in 1:225 for d in 1:225 if c != d && abs(u[c] - u[d]) <= 1 && abs(v[c] - v[d]) <= 1]  # queen neighbours on the grid
	smooth = lu(I - 0.85 .* Matrix(row_standardize(sparse(first.(grid), last.(grid), 1.0, 225, 225))))
	field = () -> (z = smooth \ randn(rng, 225); (z .- mean(z)) ./ std(z))  # a map whose neighbouring cells are alike, mean 0 and standard deviation 1
	district = 5 .* div.(v .+ 7, 3) .+ div.(u .+ 7, 3) .+ 1  # 25 districts of 3 by 3 cells
	green_level, noise_level, cell_level = 30 .+ 10 .* field(), 55 .+ 4 .* field(), 0.08 .* field()  # alike in neighbouring cells, and constant over the years
	open(panel_path, "w") do io
		println(io, "cell,year,district,price,green,noise")
		for t in 1:12
			green = green_level .+ 0.4 .* t .+ 2 .* randn(rng, 225)  # share of green space, per cent, slowly rising
			noise = noise_level .+ 1.5 .* randn(rng, 225)  # road noise, decibels
			# The log price per square metre: green space and noise, each cell's own level, a shock common to the year, and a shock shared by neighbouring cells
			price = 7.8 .+ 0.006 .* green .- 0.01 .* noise .+ cell_level .+ 0.03 * randn(rng) .+ 0.04 .* field() .+ 0.02 .* randn(rng, 225)
			for c in 1:225
				println(io, c, ",", 2013 + t, ",", district[c], ",", round(price[c], digits = 4), ",", round(green[c], digits = 2), ",", round(noise[c], digits = 2))
			end
		end
	end
	cells = ["($(c), $(district[c]), ST_MakeEnvelope($(69000 + 1000 * u[c]), $(211000 + 1000 * v[c]), $(70000 + 1000 * u[c]), $(212000 + 1000 * v[c])))" for c in 1:225]
	DBInterface.execute(con, "COPY (SELECT cell::INTEGER AS cell, district::INTEGER AS district, geom FROM (VALUES $(join(cells, ", "))) t(cell, district, geom)) TO '$(areas_path)' (FORMAT GDAL, DRIVER 'GPKG', LAYER_NAME 'cells', SRS 'EPSG:31370')")
end
yname = "{{dependent}}"
xnames = String.(strip.(split("{{explanatory}}", ",")))  # the explanatory variables, separated by commas
period = crosssection ? "pollis_period" : "{{periodColumn}}"
source = crosssection ? "(SELECT * EXCLUDE (geom), 1 AS pollis_period FROM ST_Read('$(areas_path)'))" : "'$(panel_path)'"
{{?model=cluster}} present = join(("p.\"$c\" IS NOT NULL" for c in [yname; xnames; "{{clusterColumn}}"]), " AND ")
{{?model!=cluster}} present = join(("p.\"$c\" IS NOT NULL" for c in [yname; xnames]), " AND ")
# The polygons, in longitude and latitude, with their centroids in kilometres in the distance coordinate system
DBInterface.execute(con, "CREATE OR REPLACE TABLE polygons AS SELECT \"{{areaColumn}}\" AS area, ST_X(ST_Transform(ST_Centroid(geom), '{{fileCrs}}', '{{distanceCrs}}')) / 1000 AS cx, ST_Y(ST_Transform(ST_Centroid(geom), '{{fileCrs}}', '{{distanceCrs}}')) / 1000 AS cy, ST_Transform(geom, '{{fileCrs}}', 'EPSG:4326') AS geom FROM ST_Read('$(areas_path)')")
# The rows that have a polygon and every value, of the areas that have every period
DBInterface.execute(con, """
	CREATE OR REPLACE TABLE obs AS
	WITH p AS (SELECT p.* FROM $(source) p JOIN polygons g ON p."{{areaColumn}}" = g.area WHERE $(present)),
	complete AS (SELECT "{{areaColumn}}" AS area FROM p GROUP BY 1 HAVING count(DISTINCT "$(period)") = (SELECT count(DISTINCT "$(period)") FROM p))
	SELECT dense_rank() OVER (ORDER BY p."{{areaColumn}}") AS i, dense_rank() OVER (ORDER BY p."$(period)") AS t, p.*
	FROM p JOIN complete c ON p."{{areaColumn}}" = c.area""")  # areas numbered i = 1, 2, ... and periods t = 1, 2, ...
DBInterface.execute(con, "CREATE OR REPLACE TABLE areas AS SELECT o.i, o.area, g.cx, g.cy, g.geom FROM (SELECT DISTINCT i, \"{{areaColumn}}\" AS area FROM obs) o JOIN polygons g ON o.area = g.area")
column(c) = Float64.(Tables.columntable(DBInterface.execute(con, "SELECT \"$c\"::DOUBLE AS v FROM obs ORDER BY t, i")).v)  # period by period, the areas varying fastest
y = column(yname)
X = reduce(hcat, column.(xnames))
counts = Tables.columntable(DBInterface.execute(con, "SELECT (SELECT max(i) FROM obs) AS n, (SELECT max(t) FROM obs) AS periods, (SELECT count(*) FROM obs) AS rows"))
N, T_per = Int(only(counts.n)), Int(only(counts.periods))
Int(only(counts.rows)) == N * T_per || error("each area must have one row per period: check Area Column and Period Column")
nobs = N * T_per
areacol(c) = Float64.(Tables.columntable(DBInterface.execute(con, "SELECT $c::DOUBLE AS v FROM areas ORDER BY i")).v)
coords = hcat(areacol("cx"), areacol("cy"))  # the centroids, in kilometres
println(N, " areas", T_per > 1 ? " over $(T_per) periods" : ", a cross-section")

# The fixed effects removed by subtracting means, which leaves the same slopes as a dummy for each level
effects = "{{effects}}"
if T_per == 1 && effects != "none"
	error("a cross-section takes Fixed Effects None")
end
function demean(v)
	M = reshape(v, N, T_per)  # one column per period
	effects == "periods" && return vec(M .- mean(M, dims = 1))
	effects == "areas" && return vec(M .- mean(M, dims = 2))
	effects == "both" && return vec(M .- mean(M, dims = 1) .- mean(M, dims = 2) .+ mean(M))
	return v
end
Xd = effects == "none" ? hcat(ones(nobs), X) : reduce(hcat, demean.(eachcol(X)))
yd = demean(y)
cnames = effects == "none" ? ["(Intercept)"; xnames] : xnames
absorbed = Dict("none" => 0, "periods" => T_per, "areas" => N, "both" => N + T_per - 1)[effects]
b = Xd \ yd  # least squares
res = yd - Xd * b
V0 = sum(abs2, res) / (nobs - size(Xd, 2) - absorbed) .* inv(Symmetric(transpose(Xd) * Xd))  # the usual covariance, independent errors of equal variance
se0 = sqrt.(diag(V0))

# The neighbours of each area, sharing any point of their boundaries, for Moran's I and the spatial lag
nbr = Tables.columntable(DBInterface.execute(con, "SELECT a.i, b.i AS j FROM areas a JOIN areas b ON a.i <> b.i AND ST_Intersects(a.geom, b.geom)"))
W = row_standardize(sparse(nbr.i, nbr.j, 1.0, N, N))

function se_table(title, V)
	se = sqrt.(max.(0.0, diag(V)))
	println("\n", title)
	println(rpad("", 16), rpad("estimate", 14), rpad("usual se", 12), rpad("robust se", 12), rpad("ratio", 8), rpad("t", 10), "p-value")
	for j in eachindex(b)
		z = b[j] / se[j]
		println(rpad(cnames[j], 16), rpad(round(b[j], sigdigits = 5), 14), rpad(round(se0[j], sigdigits = 4), 12), rpad(round(se[j], sigdigits = 4), 12), rpad(round(se[j] / se0[j], digits = 2), 8), rpad(round(z, digits = 2), 10), (pz = 2 * ccdf(Normal(), abs(z)); pz < 0.0001 ? "<0.0001" : round(pz, digits = 4)))
	end
end
{{?model=conley}} kernel = Dict("bartlett" => BartlettKernel(), "uniform" => UniformKernel(), "parzen" => ParzenKernel())["{{kernel}}"]
{{?model=conley}} # Conley (1999): the scores of pairs of areas closer than the cutoff, weighted by the kernel, and of each area with itself over the lags
{{?model=conley}} spec = ConleySpatialHAC(coords, {{cutoff}}; max_time_lag = {{lags}}, space_kernel = kernel)
{{?model=conley}} V = vcov_conley(Xd, res, N, T_per, spec)
{{?model=conley}} se_table("Conley spatial HAC, cutoff {{cutoff}} km, {{kernel}} kernel" * (T_per > 1 ? ", {{lags}} lags" : ""), V)
{{?model=cluster}} # Clusters: the scores summed within each group, any correlation inside it, none between groups
{{?model=cluster}} groups = String.(Tables.columntable(DBInterface.execute(con, "SELECT \"{{clusterColumn}}\"::VARCHAR AS v FROM obs ORDER BY t, i")).v)
{{?model=cluster}} G = length(unique(groups))
{{?model=cluster}} V = vcov_cluster(Xd, res, ClusterRobustVCOV(groups))  # with the usual G/(G-1) (n-1)/(n-K) adjustment
{{?model=cluster}} se_table("Clustered by {{clusterColumn}}, $(G) clusters", V)
{{?model=cluster}} if G < 20
{{?model=cluster}} 	println("Only $(G) clusters: with few clusters these standard errors are too small, see Cameron and Miller (2015)")
{{?model=cluster}} end
{{?model=dk}} T_per > 1 || error("Driscoll–Kraay needs several periods: choose a panel file")
{{?model=dk}} # Driscoll and Kraay (1998): the scores summed over the areas in each period, then Newey and West's correction over the periods
{{?model=dk}} V = vcov_driscoll_kraay(Xd, res, N, T_per; spec = DriscollKraayVCOV(max_lag = {{lags}}))  # with the adjustment nobs / (nobs - K)
{{?model=dk}} se_table("Driscoll and Kraay, $(T_per) periods, {{lags}} lags", V)
{{?model=dk}} if T_per < 20
{{?model=dk}} 	println("Only $(T_per) periods: the estimator leans on many periods, and with few its standard errors are unreliable")
{{?model=dk}} end
'''

# Next Steps action groups
[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "map-residuals"
label = "Map of the Residuals"
desc = "Each area's residual on a base map, averaged over the periods in a panel: patches of the same sign are the spatial correlation the robust standard errors allow for"
code = '''
rbar = vec(mean(reshape(res, N, T_per), dims = 2))  # each area's mean residual over the periods
DBInterface.execute(con, "CREATE OR REPLACE TABLE fit AS SELECT i, r::DOUBLE AS residual FROM (VALUES $(join(("($i, $(rbar[i]))" for i in 1:N), ", "))) t(i, r)")
rmap = joinpath(mktempdir(), "residuals.geojson")
DBInterface.execute(con, "COPY (SELECT a.area, round(f.residual, 4) AS residual, a.geom FROM areas a JOIN fit f USING (i)) TO '$(rmap)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(rmap; name = T_per > 1 ? "Mean residual" : "Residual", column = "residual", opacity = 0.75)))
'''

[[actionGroups.actions]]
id = "map-neighbours"
label = "Map of the Neighbours Within the Cutoff"
desc = "Each area coloured by how many other areas lie within the cutoff: the pairs whose correlation Conley's estimator allows for"
models = ["conley"]
code = '''
within = [count(j -> j != i && hypot(coords[i, 1] - coords[j, 1], coords[i, 2] - coords[j, 2]) < {{cutoff}}, 1:N) for i in 1:N]
println("Areas within {{cutoff}} km of each area: fewest ", minimum(within), ", median ", median(within), ", most ", maximum(within))
minimum(within) == 0 && println(count(==(0), within), " areas have none: for them the correction is only for heteroskedasticity")
DBInterface.execute(con, "CREATE OR REPLACE TABLE near AS SELECT * FROM (VALUES $(join(("($i, $(within[i]))" for i in 1:N), ", "))) t(i, neighbours)")
nmap = joinpath(mktempdir(), "neighbours.geojson")
DBInterface.execute(con, "COPY (SELECT a.area, n.neighbours, a.geom FROM areas a JOIN near n USING (i)) TO '$(nmap)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(nmap; name = "Areas within {{cutoff}} km", column = "neighbours", opacity = 0.75)))
'''

[[actionGroups.actions]]
id = "map-clusters"
label = "Map of the Clusters"
desc = "Each area coloured by its cluster: the groups inside which the errors may be correlated in any way"
models = ["cluster"]
code = '''
labels = Dict(g => k for (k, g) in enumerate(sort(unique(groups))))
DBInterface.execute(con, "CREATE OR REPLACE TABLE clus AS SELECT * FROM (VALUES $(join(("($i, $(labels[groups[i]]))" for i in 1:N), ", "))) t(i, cluster)")  # the first period's rows: one per area
cmap = joinpath(mktempdir(), "clusters.geojson")
DBInterface.execute(con, "COPY (SELECT a.area, c.cluster, a.geom FROM areas a JOIN clus c USING (i)) TO '$(cmap)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(cmap; name = "{{clusterColumn}}", column = "cluster", opacity = 0.75)))
'''

