push!(rows, "Conley, {{cutoff}} km, Bartlett" => vcov_conley(Xd, res, N, T_per, ConleySpatialHAC(coords, {{cutoff}}; max_time_lag = {{lags}})))
T_per > 1 && push!(rows, "Driscoll and Kraay, {{lags}} lags" => vcov_driscoll_kraay(Xd, res, N, T_per; spec = DriscollKraayVCOV(max_lag = {{lags}})))
println(rpad("standard errors", 34), join((rpad(n, 16) for n in cnames)))
foreach(((name, Vr),) -> println(rpad(name, 34), join((rpad(round(sqrt(max(0.0, Vr[j, j])), sigdigits = 4), 16) for j in eachindex(b)))), rows)
