[[faq]]
question = "Which tab of the Spatial Causal Inference panel should I start with?"
answer = '''
Spatial DiD when many areas are under the policy and observed before and after it, with comparison areas around them: it is a regression with standard errors, and the spillover onto the neighbours has a coefficient of its own. Synthetic Control when one or a few areas are under the policy and there is a long run of periods before it: each gets a weighted mean of areas outside the policy that follows it before the policy.
'''
wiki = "Decision Guide"

[[faq]]
question = "Why does the Spatial DiD tab have a column for the neighbours?"
answer = '''
A policy can change the outcome of the areas around those under it. The documentation of fit_spatial_did states that a difference-in-differences regression without that column does not make the spillover zero: it pushes it into the error, where it is correlated with the policy, and into the comparison group, which then holds areas the policy reaches. Delgado and Florax (2015) show that a regression with the neighbours' policy status identifies both the direct effect and the effect on the neighbours under the usual assumptions of difference-in-differences.
'''
wiki = "Overview"

[[faq]]
question = "Why are the neighbours left out of the comparison areas of a synthetic control?"
answer = '''
Because a spillover reaches them. The documentation of fit_synthetic_control explains that the neighbours follow an area under the policy best before it, so a fit that keeps them builds the counterfactual from them, and the spillover lands inside the comparison. Comparison Areas set to Exclude Neighbours, the default, leaves out every area not under the policy that neighbours one under it; All Areas Not Under the Policy keeps them. The Comparison Areas step fits both, and the Spillover Onto the Neighbours step turns the areas left out into an estimate of the spillover.
'''
wiki = "Decision Guide"

[[faq]]
question = "Why does the Synthetic Control tab have no standard errors?"
answer = '''
The weights solve a constrained optimisation rather than estimating a parameter with a sampling distribution of known form, and the gap is a difference between one observed and one constructed path, so the documentation of SyntheticControlResult states there is no standard error to report. The Permutation Test step gives the policy to random sets of comparison areas, as many as the areas under it, fits their synthetic controls, and ranks the ratio of the fit after the policy to that before of the real areas among theirs.
'''
wiki = "Inference Without Standard Errors"

[[faq]]
question = "Does the spillover depend on the Neighbours input?"
answer = '''
Yes. The documentation of ExposureMap states that every spillover estimate is relative to the mapping that produced it: a spillover estimated with five nearest neighbours answers a different question from one estimated with a band of 50 km, and neither is the spillover, so the mapping is reported beside the estimate. The Neighbours input chooses queen or rook contiguity or the k nearest centroids, and the Interference Check step prints the counts of comparison areas with and without a neighbour under the policy under each of the three.
'''
wiki = "Spillovers and Exposure"
hidden = true

[[faq]]
question = "What do the four effects of the Spatial DiD tab mean?"
answer = '''
The direct effect is the coefficient of the policy column, the effect on an area under the policy of its own status. The spillover onto the areas under the policy and the spillover onto the comparison areas are the exposure coefficients times the mean share of neighbours under the policy in each group, so they differ because the groups are exposed differently. The total onto the areas under the policy is the direct effect plus the spillover onto them. Each is a fixed linear combination of the coefficients, so its standard error is exact.
'''
wiki = "Spatial DiD"
hidden = true

[[faq]]
question = "When can the Spatial DiD tab not identify the spillover?"
answer = '''
The spillover coefficient is identified by comparison areas that differ in their share of neighbours under the policy. When every comparison area has a neighbour under the policy, there is no unexposed baseline, and the coefficient measures more against less exposure. When no comparison area has one, the spillover rests on the areas under the policy alone and cannot be told apart from the direct effect. The tab prints the counts and the message of check_interference.
'''
wiki = "Spatial DiD"
hidden = true

[[faq]]
question = "What does the Penalty of the Synthetic Control tab do?"
answer = '''
Abadie and L'Hour (2021) observe that the weights that best reproduce an area under the policy may not be unique, especially with many areas, and penalise the discrepancies between the area under the policy and each comparison area it draws on. Penalty Distance sets the discrepancy: the distance on the map, in km between centroids, or the distance between the standardised predictors. A penalty of 0 is the best match alone; larger values move the weights towards the single nearest comparison area. The Penalty step fits six values.
'''
wiki = "Synthetic Control"
hidden = true

[[faq]]
question = "What does Predictor Weights do on the Synthetic Control tab?"
answer = '''
It sets the weight of each predictor in the distance between an area under the policy and its synthetic control. Equal weighs every standardised predictor alike, the default of fit_synthetic_control. Nested Search chooses the weights as Abadie, Diamond and Hainmueller (2010) do, those whose synthetic control gives the smallest mean squared gap in the outcome before the policy. The documentation of fit_synthetic_control states that this search is not unique, so its result depends on the search, and that it needs a penalty of 0.
'''
wiki = "Synthetic Control"
hidden = true
