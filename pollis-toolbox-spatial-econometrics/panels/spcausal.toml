[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "with-without-exposure"
label = "With and Without the Exposure Column"
desc = "The spatial difference-in-differences of the tab against the usual one without the share of neighbours under the policy, on all the comparison areas and on the comparison areas with no neighbour under the policy only: how far a spillover moves the estimate of the direct effect when it is left out"
models = ["spdid"]
code = '''
# The usual difference-in-differences, on the same periods and explanatory variables, without the share of neighbours under the policy, on the areas kept
twoway(M) = vec(M .- mean(M; dims = 2) .- mean(M; dims = 1) .+ mean(M))  # the two-way within transformation of an areas by periods matrix, areas varying fastest
function did_without_exposure(keep)
{{?periods=every}}	dep = twoway(yfit[keep, :])
{{?periods=every}}	cols = [[twoway(treat[keep, :])]; Xfit === nothing ? Vector{Float64}[] : [twoway(Xfit[keep, k, :]) for k in axes(Xfit, 2)]]
{{?periods=every}}	groups, slot = repeat(1:count(keep), T_per), 1
{{?periods=means}}	dep = yfit[keep, 2] .- yfit[keep, 1]  # first differences of the means before and after
{{?periods=means}}	cols = [[ones(count(keep)), treat[keep]]; Xfit === nothing ? Vector{Float64}[] : [Xfit[keep, k, 2] .- Xfit[keep, k, 1] for k in axes(Xfit, 2)]]
{{?periods=means}}	groups, slot = collect(1:count(keep)), 2
	Z0 = reduce(hcat, cols)
	b = Z0 \ dep
	V = vcov_cluster(Z0, dep .- Z0 * b, ClusterRobustVCOV(groups))  # clustered by area
	return b[slot], sqrt(V[slot, slot])
end
exposed = .!treated .& (exposure(Float64.(treated), W).E[:, 1] .> 0)  # areas not under the policy with a neighbour under the policy
all_areas, unexposed_only = did_without_exposure(trues(N)), did_without_exposure(.!exposed)
m_cluster = fit_spatial_did(yfit, treat, W; X = Xfit, vcov = :cluster, order = {{exposureOrder}})  # the tab's model, with the same standard errors as the others
println(rpad("", 60), rpad("Estimate", 12), rpad("Std. Error", 12), "z")
for (name, (est, se)) in (("Without exposure, all comparison areas", all_areas), ("Without exposure, comparison areas next to them left out", unexposed_only),
		("With exposure: direct effect", (m_cluster.att_direct, m_cluster.att_direct_se)), ("With exposure: spillover onto the comparison areas", (m_cluster.att_spill_control, m_cluster.att_spill_control_se)),
		("With exposure: total onto the areas under the policy", (m_cluster.att_total_treated, m_cluster.att_total_treated_se)))
	println(rpad(name, 60), rpad(round(est, digits = 4), 12), rpad(round(se, digits = 4), 12), round(est / se, digits = 2))
end
println("Standard errors clustered by area in every row; ", count(exposed), " comparison areas next to an area under the policy")
println("\nWithout the exposure column less the direct effect: ", round(first(all_areas) - m_cluster.att_direct, digits = 4), " with all the comparison areas, ", round(first(unexposed_only) - m_cluster.att_direct, digits = 4), " with the comparison areas next to them left out")
println("Left out, the spillover goes into the error, where it is correlated with the policy, and into the comparison group, which then holds areas the policy reaches")
'''

[[actionGroups.actions]]
id = "standard-errors"
label = "Standard Errors"
desc = "The effects of the tab with each standard error SpatialEconometrics.jl offers: clustered by area, OLS, and Conley at half, once, twice and four times the Conley Cutoff: how much the inference depends on the choice, with the estimates unchanged"
models = ["spdid"]
code = '''
cutoffs = {{cutoff}} .* [0.5, 1, 2, 4]  # metres of the distance coordinate system
choices = [("Clustered by area", :cluster, nothing); ("OLS", :ols, nothing); [("Conley, $(round(c / 1000, digits = 1)) km", :conley, c) for c in cutoffs]]
println(rpad("", 22), rpad("Direct", 12), rpad("z", 8), rpad("Spillover, comparison areas", 30), rpad("z", 8), rpad("Total, under it", 16), "z")
for (name, kind, c) in choices
	fit = fit_spatial_did(yfit, treat, W; X = Xfit, vcov = kind, coords = coords, dist_cutoff = c, order = {{exposureOrder}})
	println(rpad(name, 22), rpad(round(fit.att_direct_se, digits = 4), 12), rpad(round(fit.att_direct / fit.att_direct_se, digits = 2), 8),
		rpad(round(fit.att_spill_control_se, digits = 4), 30), rpad(round(fit.att_spill_control / fit.att_spill_control_se, digits = 2), 8),
		rpad(round(fit.att_total_treated_se, digits = 4), 16), round(fit.att_total_treated / fit.att_total_treated_se, digits = 2))
end
println("Standard errors of the effects; the estimates are the same in every row: direct ", round(m.att_direct, digits = 4), ", spillover onto the comparison areas ", round(m.att_spill_control, digits = 4), ", total onto the areas under the policy ", round(m.att_total_treated, digits = 4))
{{?periods=means}} println("With Mean Before and After there is one row per area: clustering by area is robust to heteroskedasticity only")
println("The documentation of SpatialEconometrics.jl reports Conley intervals covering less as the cutoff widens in its simulations, with and without spatial correlation, and advises reporting more than one cutoff and preferring the narrow end")
'''

[[actionGroups.actions]]
id = "comparison-pool"
label = "Comparison Areas"
desc = "The synthetic control built without the neighbours of the areas under the policy against the one built from every area not under the policy, on the same predictors and penalty: the effect, the fit before the policy, and the weight the second puts on the neighbours, which a spillover reaches"
models = ["synth"]
code = '''
using ECharts

fits = [(name, fit_synthetic_control(y, treated, T0; W = W, coords = coords ./ 1000, predictors = predictors, donor_pool = pool, penalty = {{penalty}}, penalty_metric = Symbol("{{penaltyMetric}}"), predictor_weights = vweights))
	for (name, pool) in (("Exclude Neighbours", :exclude_neighbours), ("All Areas Not Under the Policy", :all))]
neighbour = .!treated .& (exposure(Float64.(treated), W).E[:, 1] .> 0)  # areas not under the policy with a neighbour under the policy
println(rpad("Comparison areas", 32), rpad("Areas", 8), rpad("Effect", 10), rpad("RMSPE before", 14), rpad("Ratio", 8), "Mean weight on neighbours")
for (name, f) in fits
	on_neighbours = mean(sum(f.weights[:, neighbour[f.donors]]; dims = 2))  # the total weight of the neighbours, averaged over the areas under the policy
	println(rpad(name, 32), rpad(length(f.donors), 8), rpad(round(f.att, digits = 4), 10), rpad(round(mean(f.rmspe_pre), digits = 3), 14), rpad(round(f.ratio_aggregate, digits = 2), 8), round(on_neighbours, digits = 3))
end
display(EChart(ec_width = 700, ec_height = 320, title = [ECharts.Title(text = "Mean gap to the synthetic controls", subtext = "policy from: $(labels[T0 + 1])")],
	xAxis = [ECharts.Axis(_type = "category", name = period_col, data = labels)], yAxis = [ECharts.Axis(_type = "value", name = "Gap", scale = true)],
	series = [ECharts.XYSeries(name = name, _type = "line", data = round.(f.att_path, digits = 3)) for (name, f) in fits]))
println("Effect with every area not under the policy less that without the neighbours: ", round(fits[2][2].att - fits[1][2].att, digits = 4))
println("A spillover reaches the neighbours, and they track the areas under the policy closely before the policy: as comparison areas, they carry the spillover into the counterfactual, and the gap is then the effect less the spillover their weights carry")
'''

[[actionGroups.actions]]
id = "penalty-grid"
label = "Penalty"
desc = "The synthetic control at penalties from 0 to 10, on the tab's Penalty Distance, pool of comparison areas and predictors: the effect, the fit before the policy, how many comparison areas the weights spread over and how far they are, as the penalty moves the weights from the best match towards the nearest comparison areas"
models = ["synth"]
code = '''
using ECharts

penalties = [0, 0.001, 0.01, 0.1, 1, 10]  # the penalty multiplies the distance in km, On the Map, or in the standardised predictors, In the Predictors
# The nested search needs penalty 0: with Nested Search, every penalty keeps the predictor weights the tab found, averaged over the areas under the policy
pw = m.predictor_rule == :nested ? vec(mean(m.predictor_weights; dims = 1)) : :equal
distance_km(i, j) = sqrt(sum(abs2, coords[i, :] .- coords[j, :])) / 1000
println(rpad("Penalty", 10), rpad("Effect", 10), rpad("RMSPE before", 14), rpad("Ratio", 8), rpad("Comparison areas over 1%", 26), "Weighted mean distance, km")
effects = Float64[]
for p in penalties
	f = fit_synthetic_control(y, treated, T0; W = W, coords = coords ./ 1000, predictors = predictors, donor_pool = Symbol("{{donorPool}}"), penalty = p, penalty_metric = Symbol("{{penaltyMetric}}"), predictor_weights = pw)
	push!(effects, f.att)
	used = mean(count(>(0.01), f.weights[k, :]) for k in eachindex(f.treated))  # averaged over the areas under the policy
	km = mean(sum(f.weights[k, q] * distance_km(i, f.donors[q]) for q in eachindex(f.donors)) for (k, i) in enumerate(f.treated))
	println(rpad(p, 10), rpad(round(f.att, digits = 4), 10), rpad(round(mean(f.rmspe_pre), digits = 3), 14), rpad(round(f.ratio_aggregate, digits = 2), 8), rpad(round(used, digits = 1), 26), round(km, digits = 2))
end
display(EChart(ec_width = 600, ec_height = 300, title = [ECharts.Title(text = "Effect against the penalty", subtext = "{{penaltyMetric}}" == "spatial" ? "distance on the map, km" : "distance in the standardised predictors")],
	xAxis = [ECharts.Axis(_type = "category", name = "Penalty", data = string.(penalties))], yAxis = [ECharts.Axis(_type = "value", name = "Effect", scale = true)],
	series = [ECharts.XYSeries(name = "Effect", _type = "line", data = round.(effects, digits = 4))]))
println("Penalty 0 is the best match alone, whose weights may not be unique; Abadie and L'Hour's penalty breaks the tie, and the larger it is, the nearer the weights move to the single nearest comparison area, at the cost of the fit before the policy")
'''

[[actionGroups.actions]]
id = "did-against-synth"
label = "Spatial DiD Against Synthetic Control"
desc = "Spatial DiD fitted on the areas, policy and neighbours of the Synthetic Control tab, with the inputs of the Spatial DiD tab: the direct and total effects of the regression beside the mean gap of the synthetic controls, then the two counterfactuals period by period, before the policy and after it: whether parallel trends and a weighted match of the comparison areas give the same answer"
models = ["synth"]
code = '''
using ECharts

# Spatial DiD on the areas of this tab, with the inputs of the Spatial DiD tab as they are set
scm = m
{{?periods=every}} yfit, treat, Xfit = y, D, X
{{?periods=means}} before, after = 1:T0, (T0 + 1):T_per
{{?periods=means}} yfit = hcat(vec(mean(y[:, before]; dims = 2)), vec(mean(y[:, after]; dims = 2)))
{{?periods=means}} treat = Float64.(treated)
{{?periods=means}} Xfit = X === nothing ? nothing : cat(mean(X[:, :, before]; dims = 3), mean(X[:, :, after]; dims = 3); dims = 3)
did = fit_spatial_did(yfit, treat, W; X = Xfit, vcov = Symbol("{{standardErrors}}"), coords = coords, dist_cutoff = {{cutoff}}, order = {{exposureOrder}})
println(rpad("", 54), rpad("Estimate", 12), rpad("Std. Error", 12), "z")
for (name, est, se) in (("Spatial DiD: direct effect", did.att_direct, did.att_direct_se), ("Spatial DiD: total onto the areas under the policy", did.att_total_treated, did.att_total_treated_se))
	println(rpad(name, 54), rpad(round(est, digits = 4), 12), rpad(round(se, digits = 4), 12), round(est / se, digits = 2))
end
println(rpad("Synthetic control: mean gap after", 54), rpad(round(scm.att, digits = 4), 12), "none, the Permutation Test ranks it")
share_treated = exposure(Float64.(treated), W).E[:, 1]
println("\n", count(treated .& (share_treated .> 0)), " of ", count(treated), " areas under the policy have a neighbour under the policy. The gap of a synthetic control sets an area under the policy against comparison areas, so it holds the spillover from its neighbours under the policy too: it answers to the total onto the areas under the policy more than to the direct effect")
println(scm.donor_pool_rule == :exclude_neighbours ? "Comparison Areas is Exclude Neighbours: no comparison area has a neighbour under the policy, so the counterfactual is an area not under the policy with no exposure, as in the total onto the areas under the policy of Spatial DiD" :
	"Comparison Areas is All Areas Not Under the Policy: comparison areas next to the areas under the policy bring the spillover they receive into the synthetic control")

# Period by period: the gap to the synthetic controls, and the raw difference-in-differences, the areas under the policy less the comparison areas with no neighbour under the policy, less its mean before the policy
unexposed = .!treated .& (exposure(Float64.(treated), W).E[:, 1] .== 0)
any(unexposed) || error("Every comparison area has a neighbour under the policy: there is no unexposed group for the raw difference-in-differences")
raw = vec(mean(y[treated, :]; dims = 1)) .- vec(mean(y[unexposed, :]; dims = 1))
raw .-= mean(raw[1:T0])
display(EChart(ec_width = 700, ec_height = 320, title = [ECharts.Title(text = "Gap to each counterfactual", subtext = "policy from: $(labels[T0 + 1])")],
	xAxis = [ECharts.Axis(_type = "category", name = period_col, data = labels)], yAxis = [ECharts.Axis(_type = "value", name = "Gap", scale = true)],
	series = [ECharts.XYSeries(name = "Synthetic control", _type = "line", data = round.(scm.att_path, digits = 3)),
		ECharts.XYSeries(name = "Difference-in-differences, raw", _type = "line", data = round.(raw, digits = 3))]))
rms(v) = sqrt(mean(v .^ 2))
post = (T0 + 1):T_per
println(rpad("", 34), rpad("Root mean square before", 26), "Mean after")
println(rpad("Synthetic control", 34), rpad(round(rms(scm.att_path[1:T0]), digits = 3), 26), round(mean(scm.att_path[post]), digits = 4))
println(rpad("Difference-in-differences, raw", 34), rpad(round(rms(raw[1:T0]), digits = 3), 26), round(mean(raw[post]), digits = 4))
println("Before the policy, the closer the path to 0, the closer the counterfactual followed the areas under the policy: for the raw difference-in-differences, the closer the trends were to parallel. The raw path has no explanatory variables and no share of neighbours under the policy: the regression of Spatial DiD gives the estimates")
println("Spatial DiD rests on parallel trends, with the spillover modelled by the share of neighbours under the policy; the synthetic control rests on a weighted mean of comparison areas that follows each area under the policy before the policy. Close estimates under the two assumptions support each other; far apart, the paths before the policy help tell which assumption fails")
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "direct-spillover"
label = "Direct and Spillover Effects"
desc = "The effect of the tab taken apart: the direct effect of the policy on the areas under it, the spillover at each share of neighbours under the policy, with its standard error, the effect each area receives on a map, and the sums over the areas under the policy and the comparison areas: how much of the change reaches beyond the areas under the policy"
models = ["spdid"]
code = '''
# The coefficients of the regression: D, the direct effect; WD, the effect on an area of having all its neighbours under the policy rather than none; W2D, the same for the neighbours of its neighbours
ring_names = {{exposureOrder}} == 2 ? ["WD", "W2D"] : ["WD"]
k_direct = findfirst(==("D"), m.coefnames)
k_rings = [findfirst(==(r), m.coefnames) for r in ring_names]
direct, spill = m.coef[k_direct], m.coef[k_rings]
V = m.vcov
println(rpad("Coefficient", 44), rpad("Estimate", 12), rpad("Std. Error", 12), "z")
for (name, k) in [("D: direct effect", k_direct); [(r == "WD" ? "WD: all the neighbours under the policy" : "W2D: all of the second ring under it", k) for (r, k) in zip(ring_names, k_rings)]]
	println(rpad(name, 44), rpad(round(m.coef[k], digits = 4), 12), rpad(round(sqrt(V[k, k]), digits = 4), 12), round(m.coef[k] / sqrt(V[k, k]), digits = 2))
end

# The spillover at each share of neighbours under the policy, on a comparison area and on an area under the policy, with its standard error
println("\n", rpad("Share of neighbours under the policy", 40), rpad("On a comparison area", 22), rpad("Std. Error", 12), rpad("On an area under the policy", 30), "Std. Error")
k1 = k_rings[1]
for s in [0, 0.25, 0.5, 0.75, 1]
	on_treated_se = sqrt(max(0.0, V[k_direct, k_direct] + s^2 * V[k1, k1] + 2 * s * V[k_direct, k1]))
	println(rpad(s, 40), rpad(round(s * spill[1], digits = 4), 22), rpad(round(s * sqrt(V[k1, k1]), digits = 4), 12), rpad(round(direct + s * spill[1], digits = 4), 30), round(on_treated_se, digits = 4))
end
length(spill) == 2 && println("With Exposure Order 2, the share of the second ring under the policy adds ", round(spill[2], digits = 4), " times that share")

# The effect each area receives: the direct effect if under the policy, plus the spillover at its own shares
em = exposure(Float64.(treated), W; order = {{exposureOrder}})
spillover = em.E * spill
effect = spillover .+ direct .* treated
roles = [treated[i] ? "Under the policy" : em.E[i, 1] > 0 ? "Comparison, next to an area under the policy" : "Comparison, no neighbour under the policy" for i in 1:N]
DBInterface.execute(con, "CREATE OR REPLACE TABLE mapped AS SELECT i, role, share1::DOUBLE AS share1, spillover::DOUBLE AS spillover, effect::DOUBLE AS effect FROM (VALUES $(join(("($i, '$(roles[i])', $(em.E[i, 1]), $(spillover[i]), $(effect[i]))" for i in 1:N), ", "))) t(i, role, share1, spillover, effect)")
fmap = joinpath(mktempdir(), "effects.geojson")
DBInterface.execute(con, "COPY (SELECT a.geom, a.area AS \"$(area_col)\", v.role, round(v.share1, 3) AS neighbours_under_policy, round(v.spillover, 4) AS spillover, round(v.effect, 4) AS effect FROM areas a JOIN mapped v USING (i)) TO '$(fmap)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(fmap; name = "Effect on each area", column = "effect", opacity = 0.75)))  # clicking an area shows its share, spillover and effect
println("\n", rpad("", 48), rpad("Areas", 8), rpad("Mean share", 12), rpad("Mean spillover", 16), rpad("Mean effect", 14), "Sum of the effect")
for r in ["Under the policy", "Comparison, next to an area under the policy", "Comparison, no neighbour under the policy"]
	g = roles .== r
	any(g) && println(rpad(r, 48), rpad(count(g), 8), rpad(round(mean(em.E[g, 1]), digits = 3), 12), rpad(round(mean(spillover[g]), digits = 4), 16), rpad(round(mean(effect[g]), digits = 4), 14), round(sum(effect[g]), digits = 3))
end
direct_sum, spill_treated_sum, spill_control_sum = direct * count(treated), sum(spillover[treated]), sum(spillover[.!treated])
println("\nSummed over the areas: direct ", round(direct_sum, digits = 3), ", spillover onto the areas under the policy ", round(spill_treated_sum, digits = 3), ", spillover onto the comparison areas ", round(spill_control_sum, digits = 3))
println("Spillover onto the comparison areas for each unit of direct effect summed over the areas under the policy: ", round(spill_control_sum / direct_sum, digits = 3), sign(spill_control_sum) == sign(direct_sum) ? ", in the same direction" : ", in the opposite direction, offsetting part of it")
println("Spillover onto the areas under the policy, mean ", round(mean(spillover[treated]), digits = 4), ", and onto the comparison areas, mean ", round(mean(spillover[.!treated]), digits = 4), ": the tab's estimates ", round(m.att_spill_treated, digits = 4), " and ", round(m.att_spill_control, digits = 4))
println("The spillover is read on the neighbours chosen: another definition of them changes what one unit of exposure means")
length(starts) > 1 && println("The policy starts in different periods: these shares count the areas under the policy in some period, while the regression counts those under the policy by each period")
'''

[[actionGroups.actions]]
id = "permutation-test"
label = "Permutation Test"
desc = "The inference of a synthetic control, which has no standard errors: the same number of areas as were under the policy, drawn from the comparison areas as stand-ins, each set given synthetic controls of its own, and the ratio of the RMSPE after the policy to that before, of the real areas under the policy, ranked among theirs, with its p-value"
models = ["synth"]
code = '''
using ECharts

# Each random set holds as many comparison areas as there are areas under the policy, and gets synthetic controls from the other comparison areas with the tab's predictors and penalty; every set when there are few, otherwise a random draw of them
pt = placebo_test(m, y; n_placebo = 500, rng = Xoshiro(2026), coords = coords ./ 1000, predictors = predictors)
println(rpad("Areas under the policy", 46), pt.m_treated)
println(rpad("Comparison areas the sets are drawn from", 46), pt.n_donors)
println(rpad("Random sets", 46), pt.n_placebo, pt.exact ? ", every possible set" : " drawn at random, of $(pt.n_possible) possible")
println(rpad("Ratio of the areas under the policy", 46), round(pt.ratio_observed, digits = 3))
println(rpad("Ratios of random sets as large or larger", 46), count(>=(pt.ratio_observed), pt.ratio_placebo))
println(rpad("p-value", 46), round(pt.p_value, digits = 4))
println(rpad("Smallest p-value attainable", 46), round(pt.min_attainable_p, digits = 4))
# The ratios of the random sets in 20 bins, with the ratio of the areas under the policy named in the subtitle
edges = range(0, max(maximum(pt.ratio_placebo), pt.ratio_observed) * 1.0001; length = 21)
bins = [count(r -> edges[b] <= r < edges[b + 1], pt.ratio_placebo) for b in 1:20]
display(EChart(ec_width = 700, ec_height = 300, title = [ECharts.Title(text = "Ratios of the random sets", subtext = "areas under the policy: $(round(pt.ratio_observed, digits = 2)), in the bin from $(round(edges[searchsortedlast(edges, pt.ratio_observed)], digits = 2))")],
	xAxis = [ECharts.Axis(_type = "category", name = "Ratio from", data = string.(round.(edges[1:20], digits = 2)))], yAxis = [ECharts.Axis(_type = "value", name = "Random sets")],
	series = [ECharts.XYSeries(name = "Random sets", _type = "bar", data = bins)]))
println("\nThe p-value is the share of the random sets, counting the areas under the policy, whose ratio is as large or larger: it rests on the areas under the policy being no different from any other set of comparison areas before the policy, not on a sampling distribution")
println("The ratio divides by the fit before the policy, so a random set that fits poorly before it cannot show a large ratio by a poor fit alone")
println("The random sets are drawn from the comparison areas anywhere on the map, while the areas under the policy may sit together: a spillover among the areas under the policy is part of their ratio, and of no random set's")
'''

[[actionGroups.actions]]
id = "spillover-neighbours"
label = "Spillover Onto the Neighbours"
desc = "The spillover read with synthetic controls: each neighbour of the areas under the policy, left out of the comparison areas, given a synthetic control of its own from the same comparison areas, and its gap after the policy read as the spillover it receives, on a map, period by period beside the effect, and neighbour by neighbour with its fit before the policy"
models = ["synth"]
code = '''
using ECharts

# The neighbours must be left out of the comparison areas to be read on their own: with All Areas Not Under the Policy, the tab's synthetic control is fitted again without them
base = m.donor_pool_rule == :exclude_neighbours ? m :
	fit_synthetic_control(y, treated, T0; W = W, coords = coords ./ 1000, predictors = predictors, donor_pool = :exclude_neighbours, penalty = {{penalty}}, penalty_metric = Symbol("{{penaltyMetric}}"), predictor_weights = vweights)
# Each neighbour is not under the policy, so with no spillover its gap after the policy is noise around 0
sg = spillover_gaps(base, y; coords = coords ./ 1000, predictors = predictors, predictor_weights = vweights)
post = (T0 + 1):T_per
println(length(sg.units), " neighbours of the areas under the policy, each given a synthetic control from ", length(sg.donors), " comparison areas")
println("Spillover, the mean gap of the neighbours after the policy: ", round(sg.spillover, digits = 4), "; effect on the areas under the policy: ", round(base.att, digits = 4))
println("RMSPE before the policy: neighbours, mean ", round(mean(sg.rmspe_pre), digits = 3), "; areas under the policy, mean ", round(mean(base.rmspe_pre), digits = 3))
display(EChart(ec_width = 700, ec_height = 320, title = [ECharts.Title(text = "Mean gap to the synthetic controls", subtext = "policy from: $(labels[T0 + 1])")],
	xAxis = [ECharts.Axis(_type = "category", name = period_col, data = labels)], yAxis = [ECharts.Axis(_type = "value", name = "Gap", scale = true)],
	series = [ECharts.XYSeries(name = "Areas under the policy, the effect", _type = "line", data = round.(base.att_path, digits = 3)),
		ECharts.XYSeries(name = "Their neighbours, the spillover", _type = "line", data = round.(sg.spillover_path, digits = 3))]))

# Neighbour by neighbour: its share of neighbours under the policy, its fit before the policy, and its gap after it
share1 = exposure(Float64.(treated), W).E[:, 1]
gap_after = vec(mean(sg.gaps[:, post]; dims = 2))
ratio = [sqrt(mean(sg.gaps[q, post] .^ 2)) / sg.rmspe_pre[q] for q in eachindex(sg.units)]
println("\n", rpad("Neighbour", 18), rpad("Share under the policy", 24), rpad("RMSPE before", 14), rpad("Mean gap after", 16), "Ratio after to before")
for q in sortperm(gap_after; by = abs, rev = true)
	println(rpad(area_names[sg.units[q]], 18), rpad(round(share1[sg.units[q]], digits = 3), 24), rpad(round(sg.rmspe_pre[q], digits = 3), 14), rpad(round(gap_after[q], digits = 4), 16), round(ratio[q], digits = 2))
end
length(sg.units) > 2 && println("Correlation of the mean gap after the policy with the share of neighbours under the policy: ", round(cor(share1[sg.units], gap_after), digits = 3))

DBInterface.execute(con, "CREATE OR REPLACE TABLE mapped AS SELECT i, gap::DOUBLE AS gap FROM (VALUES $(join(("($(sg.units[q]), $(gap_after[q]))" for q in eachindex(sg.units)), ", "))) t(i, gap)")
dir = mktempdir()
fneighbours, fpolicy = joinpath(dir, "neighbours.geojson"), joinpath(dir, "under-policy.geojson")
DBInterface.execute(con, "COPY (SELECT a.geom, a.area AS \"$(area_col)\", round(v.gap, 4) AS spillover FROM areas a JOIN mapped v USING (i)) TO '$(fneighbours)' (FORMAT GDAL, DRIVER 'GeoJSON')")
DBInterface.execute(con, "COPY (SELECT geom, area AS \"$(area_col)\" FROM areas WHERE i IN ($(join(base.treated, ", ")))) TO '$(fpolicy)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(fneighbours; name = "Spillover, mean gap after the policy", column = "spillover", opacity = 0.75), Pollis.layer(fpolicy; name = "Under the policy", color = "#e15759", opacity = 0.9)))

println("\nA gap is read as spillover only where the neighbour's synthetic control followed it closely before the policy; the Permutation Test shows what gaps arise by chance")
println("Spatial DiD estimates the same quantity, as its spillover onto the comparison areas, from the share of neighbours under the policy rather than from a synthetic control of each neighbour")
'''

[[actionGroups]]
id = "replicate"
label = "Replicate"

[[actionGroups.actions]]
id = "replicate-adh-prop99"
label = "Abadie, Diamond and Hainmueller's Proposition 99"
desc = "Abadie, Diamond and Hainmueller (2010), Tables 1 and 2: the synthetic California of Proposition 99, built from the 38 comparison states on their seven predictors with the predictor weights of the nested search, its predictors and the weights of the states beside those the article prints, the gap in cigarette sales in 2000, and the permutation test over the 38 states"
models = ["synth"]
code = '''
using PollisDatasets

let
	d = Tables.columntable(DBInterface.execute(con, "SELECT * FROM '$(datafile("prop99"))'"))  # the 39 states of the article, 1970 to 2000, from the R package tidysynth
	states, years = sort(unique(d.state)), 1970:2000
	row = Dict((d.state[r], Int(d.year[r])) => r for r in eachindex(d.state))
	value(v, s, t) = (x = getproperty(d, v)[row[(s, t)]]; x === missing ? NaN : Float64(x))
	mean_of(v, s, ts) = mean(filter(!isnan, [value(v, s, t) for t in ts]))
	# The predictors of Table 1: the log of income per head, the percent aged 15 to 24 and the retail price, means of 1980 to 1988; beer per head, mean of 1984 to 1988; cigarette sales per head in 1988, 1980 and 1975
	predictors_of(s) = [mean_of(:lnincome, s, 1980:1988), 100 * mean_of(:age15to24, s, 1980:1988), mean_of(:retprice, s, 1980:1988), mean_of(:beer, s, 1984:1988),
		value(:cigsale, s, 1988), value(:cigsale, s, 1980), value(:cigsale, s, 1975)]
	Y = [value(:cigsale, s, t) for s in states, t in years]
	P = permutedims(reduce(hcat, predictors_of.(states)))
	ca = findfirst(==("California"), states)
	# Every other state is a comparison state, and the predictor weights make the synthetic California follow its sales from 1970 to 1988, the 19 years before Proposition 99
	fit = fit_synthetic_control(Y, ca, 19; predictors = P, donor_pool = :all, predictor_weights = :nested)
	w = vec(fit.weights[1, :])
	synthetic_P = transpose(P[fit.donors, :]) * w
	rows = ["Ln(GDP per capita)", "Percent aged 15 to 24", "Retail price", "Beer consumption per capita", "Cigarette sales per capita 1988", "Cigarette sales per capita 1980", "Cigarette sales per capita 1975"]
	real_article = [10.08, 17.40, 89.42, 24.28, 90.10, 120.20, 127.10]
	synthetic_article = [9.86, 17.40, 89.41, 24.20, 91.62, 120.43, 126.99]
	println("Table 1, the predictors before Proposition 99\n", rpad("", 34), rpad("California", 12), rpad("Article", 10), rpad("Synthetic", 12), "Article")
	for j in eachindex(rows)
		println(rpad(rows[j], 34), rpad(round(P[ca, j], digits = 2), 12), rpad(real_article[j], 10), rpad(round(synthetic_P[j], digits = 2), 12), synthetic_article[j])
	end
	weights_article = Dict("Colorado" => 0.164, "Connecticut" => 0.069, "Montana" => 0.199, "Nevada" => 0.234, "Utah" => 0.334)  # every other state 0
	println("\nTable 2, the weights of the states in the synthetic California\n", rpad("State", 16), rpad("Julia", 10), "Article")
	for q in sortperm(w; rev = true)
		s = states[fit.donors[q]]
		(w[q] >= 0.0005 || haskey(weights_article, s)) && println(rpad(s, 16), rpad(round(w[q], digits = 3), 10), get(weights_article, s, 0.0))
	end
	println("Every other state: below 0.0005 in Julia, 0 in the article")
	println("\nGap in cigarette sales per head in 2000, California less its synthetic control: ", round(fit.gaps[1, end], digits = 1), " packs; the article, about 26 packs fewer")
	println("RMSPE before Proposition 99: ", round(fit.rmspe_pre[1], digits = 2))
	println("Predictor weights of the nested search: ", join(round.(fit.predictor_weights[1, :], digits = 3), ", "))
	println("The predictor weights need not be unique: other predictor weights, with other weights of the states, can follow the sales before 1989 about as closely")
	# Each of the 38 states in turn as if under the policy, with its synthetic control from the other 37 and the same nested search: a couple of minutes
	pt = placebo_test(fit, Y; predictors = P)
	println("\nPermutation test: ratio of the RMSPE after Proposition 99 to that before, California ", round(pt.ratio_observed, digits = 2), ", ", count(>=(pt.ratio_observed), pt.ratio_placebo), " of the ", pt.n_placebo, " states as large or larger")
	println("p-value ", round(pt.p_value, digits = 3), "; the article, 1/39 = 0.026")
end
'''

