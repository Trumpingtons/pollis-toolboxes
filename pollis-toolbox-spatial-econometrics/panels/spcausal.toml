# Spatial Causal Inference: the effects of a policy on the areas under it and on their neighbours, with SpatialEconometrics.jl;
# the areas are read, the panel joined to them, and their neighbours found, through DuckDB and its spatial extension.

[meta]
title = "Spatial Causal Inference"
viewType = "pollis.spcausal"
defaultModel = "spdid"
decisionFirstColumn = "Model"

[[packages]]
name = "SpatialEconometrics.jl"
# Fork of randsley/SpatialEconometrics.jl whose GWR and MGWR follow GWR4 and mgwr: Gaussian and exponential kernels without a cut-off, adaptive bandwidths counting the observation itself, AICc with n log(2 pi), golden section search and mgwr's back-fitting
github = "https://github.com/Trumpingtons/SpatialEconometrics.jl"
fork = true

[[packages]]
name = "PollisDatasets.jl"
github = "https://github.com/Trumpingtons/PollisDatasets.jl"

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/DuckDB.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

[requires]
packages = ["ECharts.jl"]

[[models]]
id = "spdid"
label = "Spatial DiD"

[[models]]
id = "synth"
label = "Synthetic Control"

[[bullets]]
text = "Spatial DiD"
detail = "Difference-in-differences with spillovers: the effect of a policy on the areas under it, and on their neighbours through the share of their neighbours under the policy, as in Delgado and Florax, in two periods or in every period with fixed effects of the areas and the periods"

[[bullets]]
text = "Synthetic Control"
detail = "The synthetic control of Abadie, Diamond and Hainmueller: each area under the policy compared with a weighted mean of areas not under the policy that matches it before the policy, with the neighbours of the areas under the policy left out of the comparison areas, and the weights optionally penalised by distance, as in Abadie and L'Hour"

[[decisionRows]]
task = "Spatial DiD"
context = "Many areas covered"
purpose = "Estimate a policy's direct effect and its spillover onto the neighbours, from areas observed before and after it, without letting the spillover bias the direct effect"

[[decisionRows]]
task = "Synthetic Control"
context = "Few areas covered"
purpose = "Build the counterfactual of each area under the policy from areas outside it that its spillover does not reach, when there are too few areas under the policy for a regression"

[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. Choose... picks another. A file given by an absolute path is read where it is."
default = "~/.pollis/data/examples"
folder = "data/examples"

[[inputs]]
id = "areasFile"
label = "Areas File"
tooltip = "The file of areas, as polygons, one per area: GeoPackage (its first layer), GeoJSON, Shapefile, FlatGeobuf or KML, in the folder above, or an absolute path. With the default, mpdta_counties.gpkg, the example copies into the folder the 500 US counties of the minimum wage panel of Callaway and Sant'Anna (2021), from the Census Bureau's county boundaries of 2010, from PollisDatasets.jl, unless the folder has it."
default = "mpdta_counties.gpkg"
models = ["spdid"]

[[inputs]]
id = "synthAreasFile"
label = "Areas File"
tooltip = "The file of areas, as polygons, one per area: GeoPackage (its first layer), GeoJSON, Shapefile, FlatGeobuf or KML, in the folder above, or an absolute path. With the default, us_states.gpkg, the example copies into the folder the polygons of the 48 contiguous US states, from PollisDatasets.jl, unless the folder has it. Areas of the file with no rows in the panel file are left out."
default = "us_states.gpkg"
models = ["synth"]

[[inputs]]
id = "panelFile"
label = "Panel File"
tooltip = "The panel, one row per area and period: a CSV or Parquet file, in the folder above, or an absolute path. Areas without a value in some period, or without a polygon in the areas file, are left out, so that every area left has every period. With the default, mpdta.csv, the example copies into the folder the teen employment of 500 US counties from 2003 to 2007, from the R package did, from PollisDatasets.jl, unless the folder has it."
default = "mpdta.csv"
models = ["spdid"]

[[inputs]]
id = "synthPanelFile"
label = "Panel File"
tooltip = "The panel, one row per area and period: a CSV or Parquet file, in the folder above, or an absolute path. Areas without a value in some period, or without a polygon in the areas file, are left out, so that every area left has every period. With the default, prop99.csv, the example copies into the folder the cigarette sales of 39 US states from 1970 to 2000 of Abadie, Diamond and Hainmueller (2010), from the R package tidysynth, from PollisDatasets.jl, unless the folder has it."
default = "prop99.csv"
models = ["synth"]

[[inputs]]
id = "areaColumn"
label = "Area Column"
tooltip = "The column of the panel file that names each area: the panel's rows are joined to the polygons by it. With the example files, countyreal, the county's FIPS code."
default = "countyreal"
newRow = true
models = ["spdid"]

[[inputs]]
id = "synthAreaColumn"
label = "Area Column"
tooltip = "The column of the panel file that names each area: the panel's rows are joined to the polygons by it. With the example files, state, the state's name."
default = "state"
newRow = true
models = ["synth"]

[[inputs]]
id = "polygonColumn"
label = "Areas File Column"
tooltip = "The column of the areas file that names each area as the Area Column names it in the panel file. With the example files, county, the county's FIPS code."
default = "county"
models = ["spdid"]

[[inputs]]
id = "synthPolygonColumn"
label = "Areas File Column"
tooltip = "The column of the areas file that names each area as the Area Column names it in the panel file. With the example files, name, the state's name: the column state of us_states.gpkg writes the names as another dataset does."
default = "name"
models = ["synth"]

[[inputs]]
id = "periodColumn"
label = "Period Column"
tooltip = "The column of the panel file that names each period, a year, a quarter or a date: the periods are put in its order. With the example files, year."
default = "year"

[[inputs]]
id = "dependent"
label = "Dependent Variable"
tooltip = "The outcome, a numeric column of the panel file. With the example files, lemp: the log of the county's teen employment."
default = "lemp"
models = ["spdid"]

[[inputs]]
id = "synthDependent"
label = "Dependent Variable"
tooltip = "The outcome, a numeric column of the panel file. With the example files, cigsale: the cigarette sales of the state per head, in packs."
default = "cigsale"
models = ["synth"]

[[inputs]]
id = "treatment"
label = "Policy Column"
tooltip = "The column of the panel file that is 1 in the periods an area is under the policy and 0 otherwise. With the example files, minwage: 1 from the year the county's state raised its minimum wage, 2004, 2006 or 2007, and 0 before it and in the states that did not. A policy that starts in different periods is fitted with Every Period."
default = "minwage"
models = ["spdid"]

[[inputs]]
id = "synthTreatment"
label = "Policy Column"
tooltip = "The column of the panel file that is 1 in the periods an area is under the policy and 0 otherwise. With the example files, prop99: 1 in California from 1989, the first year of Proposition 99, its tobacco tax and control programme. Synthetic Control needs the policy to start in the same period in every area under it."
default = "prop99"
models = ["synth"]

[[inputs]]
id = "explanatory"
label = "Explanatory Variables"
tooltip = "Numeric columns of the panel file that vary over the periods, separated by commas, or empty: a column that never changes within an area is absorbed by the area's fixed effect. A variable the policy itself changes does not belong here. With the example files, none: lpop, the log of the county's population, is the same in every year."
default = ""
models = ["spdid"]

[[inputs]]
id = "synthExplanatory"
label = "Explanatory Variables"
tooltip = "Numeric columns of the panel file with a value in every period, separated by commas, or empty: they enter only with Predictors set to Also Explanatory Variables, as their means before the policy. A variable the policy itself changes does not belong here. With the example files, retprice: the retail price of a pack of cigarettes, in cents."
default = "retprice"
models = ["synth"]

[[inputs]]
id = "fileCrs"
label = "File Coordinate System"
tooltip = "The coordinate system of the areas file's coordinates, as an EPSG code: the areas are moved from it into longitude and latitude on WGS 84 (EPSG:4326) for the maps. The example's files are in EPSG:4269, NAD83. GeoJSON and KML are always EPSG:4326."
default = "EPSG:4269"
newRow = true

[[inputs]]
id = "distanceCrs"
label = "Distance Coordinate System"
tooltip = "A projected coordinate system in metres, as an EPSG code: the centroids of the areas are moved into it, and the distances between them, and the Conley Cutoff, are in its metres. For the example's areas, EPSG:5070, NAD83 / Conus Albers."
default = "EPSG:5070"

[[inputs]]
id = "neighbours"
label = "Neighbours"
tooltip = "Which areas are neighbours, and so which areas an area under the policy spills over onto: Queen, those that share any point of their boundaries; Rook, those that share a stretch of boundary; k Nearest, the k areas with the nearest centroids. An area's exposure is the share of its neighbours under the policy. With the example files, k Nearest: the 500 counties are a sample, and few of them share a boundary."
kind = "select"
default = "knn"
models = ["spdid"]

[[inputs.options]]
value = "queen"
label = "Queen Contiguity"

[[inputs.options]]
value = "rook"
label = "Rook Contiguity"

[[inputs.options]]
value = "knn"
label = "k Nearest"

[[inputs]]
id = "synthNeighbours"
label = "Neighbours"
tooltip = "Which areas are neighbours, and so which areas an area under the policy spills over onto, and which Exclude Neighbours leaves out of the comparison areas: Queen, those that share any point of their boundaries; Rook, those that share a stretch of boundary; k Nearest, the k areas with the nearest centroids."
kind = "select"
default = "queen"
models = ["synth"]

[[inputs.options]]
value = "queen"
label = "Queen Contiguity"

[[inputs.options]]
value = "rook"
label = "Rook Contiguity"

[[inputs.options]]
value = "knn"
label = "k Nearest"

[[inputs]]
id = "k"
label = "k"
tooltip = "The number of neighbours of every area with k Nearest."
default = "6"

[[inputs]]
id = "exposureOrder"
label = "Exposure Order"
tooltip = "On Spatial DiD, the rings of neighbours whose policy an area is exposed to: 1, the share of its neighbours under the policy; 2, also the share of their neighbours, with a coefficient of its own, so that the spillover of the second ring need not follow that of the first."
kind = "select"
default = "1"
newRow = true

[[inputs.options]]
value = "1"
label = "1, the Neighbours"

[[inputs.options]]
value = "2"
label = "2, Also Theirs"

[[inputs]]
id = "periods"
label = "Periods"
tooltip = "On Spatial DiD: Every Period, the regression on every area and period with fixed effects of the areas and of the periods, removed by the two-way within transformation; Mean Before and After, each area's mean before the policy starts and after, first-differenced, which needs the policy to start in the same period in every area under it."
kind = "select"
default = "every"

[[inputs.options]]
value = "every"
label = "Every Period"

[[inputs.options]]
value = "means"
label = "Mean Before and After"

[[inputs]]
id = "standardErrors"
label = "Standard Errors"
tooltip = "On Spatial DiD: Clustered by Area, robust to any correlation over the periods within an area, the default of SpatialEconometrics.jl; Conley, robust also to correlation between areas closer than the Conley Cutoff; OLS, the classical standard errors. With Mean Before and After there is one row per area, and clustering by area is robust to heteroskedasticity only."
kind = "select"
default = "cluster"

[[inputs.options]]
value = "cluster"
label = "Clustered by Area"

[[inputs.options]]
value = "conley"
label = "Conley"

[[inputs.options]]
value = "ols"
label = "OLS"

[[inputs]]
id = "cutoff"
label = "Conley Cutoff"
tooltip = "With Conley standard errors, the distance in metres of the distance coordinate system beyond which two areas are taken as independent, their weight falling linearly to zero at it. The documentation of SpatialEconometrics.jl advises reporting more than one cutoff and preferring the narrow end. With the example's counties, 100000, 100 km."
default = "100000"

[[inputs]]
id = "predictors"
label = "Predictors"
tooltip = "On Synthetic Control, what the weights match before the policy: Outcome Before, the Dependent Variable in each period before it, the choice Abadie (2021) recommends for a long period before the policy; Also Explanatory Variables, also the means of the Explanatory Variables before it. Each predictor is divided by its standard deviation over the areas."
kind = "select"
default = "outcome"
newRow = true

[[inputs.options]]
value = "outcome"
label = "Outcome Before"

[[inputs.options]]
value = "explanatory"
label = "Also Explanatory Variables"

[[inputs]]
id = "predictorWeights"
label = "Predictor Weights"
tooltip = "On Synthetic Control, the weight of each predictor in the distance the weights of the comparison areas minimise: Equal, every standardised predictor alike; Nested Search, the weights that make the synthetic control follow the outcome of the area under the policy most closely before the policy, as Abadie, Diamond and Hainmueller (2010) choose them, found by a search that can take a minute for each area under the policy and needs Penalty 0."
kind = "select"
default = "equal"

[[inputs.options]]
value = "equal"
label = "Equal"

[[inputs.options]]
value = "nested"
label = "Nested Search"

[[inputs]]
id = "donorPool"
label = "Comparison Areas"
tooltip = "On Synthetic Control, the areas not under the policy whose weighted mean is the counterfactual: Exclude Neighbours, all but the neighbours of the areas under the policy, which a spillover would reach, the default of SpatialEconometrics.jl; All Areas Not Under the Policy, every one of them."
kind = "select"
default = "exclude_neighbours"

[[inputs.options]]
value = "exclude_neighbours"
label = "Exclude Neighbours"

[[inputs.options]]
value = "all"
label = "All Areas Not Under the Policy"

[[inputs]]
id = "penalty"
label = "Penalty"
tooltip = "On Synthetic Control, the weight of the penalty of Abadie and L'Hour (2021) on the distance from each area under the policy to the comparison areas it draws on: 0, no penalty, when several sets of weights can match equally well; larger values move the weights towards the nearest comparison areas. Nested Search needs 0."
default = "0"

[[inputs]]
id = "penaltyMetric"
label = "Penalty Distance"
tooltip = "On Synthetic Control with a penalty, the distance it is on: On the Map, the distance in km between the centroids, in the distance coordinate system; In the Predictors, the distance between the standardised predictors."
kind = "select"
default = "spatial"

[[inputs.options]]
value = "spatial"
label = "On the Map"

[[inputs.options]]
value = "covariate"
label = "In the Predictors"

[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables, SpatialEconometrics, PollisDatasets, SparseArrays, LinearAlgebra, Statistics, Random

con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the files stay where they are
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Spatial Econometrics Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files: Choose... picks another
{{?model=spdid}} areas_file, panel_file, area_col, polygon_col = "{{areasFile}}", "{{panelFile}}", "{{areaColumn}}", "{{polygonColumn}}"
{{?model=spdid}} yname, dname, xlist, neighbour_rule = "{{dependent}}", "{{treatment}}", "{{explanatory}}", "{{neighbours}}"
{{?model=synth}} areas_file, panel_file, area_col, polygon_col = "{{synthAreasFile}}", "{{synthPanelFile}}", "{{synthAreaColumn}}", "{{synthPolygonColumn}}"
{{?model=synth}} yname, dname, xlist, neighbour_rule = "{{synthDependent}}", "{{synthTreatment}}", "{{synthExplanatory}}", "{{synthNeighbours}}"
period_col = "{{periodColumn}}"
areas_path = joinpath(folder, areas_file)  # an absolute path is kept as it is
panel_path = joinpath(folder, panel_file)
{{?model=spdid}} # Example files: the teen employment of 500 US counties from 2003 to 2007, with the minimum wage raised in some states in 2004, 2006 or 2007, of Callaway and Sant'Anna (2021), and the counties' polygons, from PollisDatasets.jl; copied unless the folder has them. Replace them with your own files.
{{?model=spdid}}{{?areasFile=mpdta_counties.gpkg}} isfile(areas_path) || cp(samplefile("mpdta_counties.gpkg"), areas_path)
{{?model=spdid}}{{?panelFile=mpdta.csv}} isfile(panel_path) || cp(datafile("mpdta"), panel_path)
{{?model=synth}} # Example files: the cigarette sales of 39 US states from 1970 to 2000, with Proposition 99 in California from 1989, of Abadie, Diamond and Hainmueller (2010), and the states' polygons, from PollisDatasets.jl; copied unless the folder has them. Replace them with your own files.
{{?model=synth}}{{?synthAreasFile=us_states.gpkg}} isfile(areas_path) || cp(samplefile("us_states.gpkg"), areas_path)
{{?model=synth}}{{?synthPanelFile=prop99.csv}} isfile(panel_path) || cp(datafile("prop99"), panel_path)
xnames = filter(!isempty, String.(strip.(split(xlist, ","))))  # the explanatory variables, separated by commas, or none
needed = [yname; dname; xnames]
present = join(("p.\"$c\" IS NOT NULL" for c in needed), " AND ")
# The polygons, in longitude and latitude, with their centroids in the distance coordinate system, and the panel's rows that have a polygon and every value
DBInterface.execute(con, "CREATE OR REPLACE TABLE polygons AS SELECT \"$(polygon_col)\" AS area, ST_X(ST_Transform(ST_Centroid(geom), '{{fileCrs}}', '{{distanceCrs}}')) AS cx, ST_Y(ST_Transform(ST_Centroid(geom), '{{fileCrs}}', '{{distanceCrs}}')) AS cy, ST_Transform(geom, '{{fileCrs}}', 'EPSG:4326') AS geom FROM ST_Read('$(areas_path)')")
DBInterface.execute(con, """
	CREATE OR REPLACE TABLE obs AS
	WITH p AS (SELECT p.* FROM '$(panel_path)' p JOIN polygons g ON p."$(area_col)" = g.area WHERE $(present)),
	complete AS (SELECT "$(area_col)" AS area FROM p GROUP BY 1 HAVING count(DISTINCT "$(period_col)") = (SELECT count(DISTINCT "$(period_col)") FROM p))
	SELECT dense_rank() OVER (ORDER BY p."$(area_col)") AS i, dense_rank() OVER (ORDER BY p."$(period_col)") AS t, p.*
	FROM p JOIN complete c ON p."$(area_col)" = c.area""")  # areas numbered i = 1, 2, ... and periods t = 1, 2, ..., only areas with every period
DBInterface.execute(con, "CREATE OR REPLACE TABLE areas AS SELECT o.i, o.area, g.cx, g.cy, g.geom FROM (SELECT DISTINCT i, \"$(area_col)\" AS area FROM obs) o JOIN polygons g ON o.area = g.area")
column(c) = Float64.(Tables.columntable(DBInterface.execute(con, "SELECT \"$c\"::DOUBLE AS v FROM obs ORDER BY t, i")).v)  # period by period, the areas varying fastest
counts = Tables.columntable(DBInterface.execute(con, "SELECT (SELECT max(i) FROM obs) AS n, (SELECT max(t) FROM obs) AS periods, (SELECT count(*) FROM polygons) AS polygons"))
N, T_per = Int(only(counts.n)), Int(only(counts.periods))
labels = String.(Tables.columntable(DBInterface.execute(con, "SELECT DISTINCT t, \"$(period_col)\"::VARCHAR AS label FROM obs ORDER BY t")).label)  # the name of each period
println(N, " areas over ", T_per, " periods", only(counts.polygons) > N ? "; $(only(counts.polygons) - N) areas of the areas file left out, without rows in the panel file or without every value in every period" : "")
xy = Tables.columntable(DBInterface.execute(con, "SELECT cx, cy FROM areas ORDER BY i"))
coords = hcat(Float64.(xy.cx), Float64.(xy.cy))  # metres in the distance coordinate system

# The neighbours of each area, as pairs (i, j), found with SQL; the same in every period
neighbour_pairs = Dict(
	"queen" => "SELECT a.i, b.i AS j FROM areas a JOIN areas b ON a.i <> b.i AND ST_Intersects(a.geom, b.geom)",  # any shared point of the boundaries
	"rook" => "SELECT a.i, b.i AS j FROM areas a JOIN areas b ON a.i <> b.i AND ST_Intersects(a.geom, b.geom) WHERE ST_Dimension(ST_Intersection(a.geom, b.geom)) >= 1",  # a shared stretch of boundary
	"knn" => "WITH c AS (SELECT i, ST_Centroid(geom) AS p FROM areas) SELECT i, j FROM (SELECT a.i, b.i AS j, row_number() OVER (PARTITION BY a.i ORDER BY ST_Distance_Sphere(a.p, b.p), b.i) AS r FROM c a JOIN c b ON a.i <> b.i) WHERE r <= {{k}}")  # the nearest centroids, by great-circle distance
pairs = Tables.columntable(DBInterface.execute(con, neighbour_pairs[neighbour_rule]))
W = sparse(pairs.i, pairs.j, 1.0, N, N)  # 1 for each neighbour; SpatialEconometrics.jl makes each row sum to 1, so that an area's exposure is the share of its neighbours under the policy

# The outcome and the policy, areas by periods
y = reshape(column(yname), N, T_per)
X = isempty(xnames) ? nothing : permutedims(cat((reshape(column(c), N, T_per) for c in xnames)...; dims = 3), (1, 3, 2))  # areas by variables by periods
D = reshape(column(dname), N, T_per)  # 1 in the periods an area is under the policy
treated = vec(any(!iszero, D; dims = 2))  # the areas under the policy in some period
starts = unique(findfirst(!iszero, D[i, :]) for i in findall(treated))  # the first period under the policy, of each area under it
println(count(treated), " areas under the policy, ", length(starts) == 1 ? "all from $(labels[only(starts)])" : "starting in $(length(starts)) different periods")
{{?model=spdid}}{{?periods=every}} # Every period: fixed effects of the areas and of the periods, removed by the two-way within transformation
{{?model=spdid}}{{?periods=every}} yfit, treat, Xfit = y, D, X
{{?model=spdid}}{{?periods=means}} # Mean Before and After: each area's mean in the periods before the policy starts and in those from then on
{{?model=spdid}}{{?periods=means}} length(starts) == 1 || error("Mean Before and After needs the policy to start in the same period in every area under it: use Every Period")
{{?model=spdid}}{{?periods=means}} before, after = 1:(only(starts) - 1), only(starts):T_per
{{?model=spdid}}{{?periods=means}} isempty(before) && error("The policy starts in the first period, so there is no period before it")
{{?model=spdid}}{{?periods=means}} yfit = hcat(vec(mean(y[:, before]; dims = 2)), vec(mean(y[:, after]; dims = 2)))
{{?model=spdid}}{{?periods=means}} treat = Float64.(treated)  # under the policy in the second of the two periods
{{?model=spdid}}{{?periods=means}} Xfit = X === nothing ? nothing : cat(mean(X[:, :, before]; dims = 3), mean(X[:, :, after]; dims = 3); dims = 3)

{{?model=spdid}} # Difference-in-differences with the share of the neighbours under the policy: the coefficient of D is the direct effect, that of WD the spillover per unit of exposure
{{?model=spdid}} m = fit_spatial_did(yfit, treat, W; X = Xfit, vcov = Symbol("{{standardErrors}}"), coords = coords, dist_cutoff = {{cutoff}}, order = {{exposureOrder}})
{{?model=spdid}} println(m.design == :two_period ? "Two periods, first-differenced: the mean before and after the start of the policy" : "Every period, with fixed effects of the areas and of the periods")
{{?model=spdid}} println("Standard errors: ", m.vcov_name, "\n")
{{?model=spdid}} println(rpad("", 46), rpad("Estimate", 12), rpad("Std. Error", 12), "z")
{{?model=spdid}} for (name, est, se) in (("Direct effect", m.att_direct, m.att_direct_se),  # the coefficient of D
{{?model=spdid}}		("Spillover onto the areas under the policy", m.att_spill_treated, m.att_spill_treated_se),  # the exposure coefficients times the mean exposure of the areas under the policy
{{?model=spdid}}		("Spillover onto the comparison areas", m.att_spill_control, m.att_spill_control_se),  # times the mean exposure of the comparison areas
{{?model=spdid}}		("Total onto the areas under the policy", m.att_total_treated, m.att_total_treated_se))  # direct plus spillover onto the areas under the policy
{{?model=spdid}}	println(rpad(name, 46), rpad(round(est, digits = 4), 12), rpad(round(se, digits = 4), 12), round(est / se, digits = 2))
{{?model=spdid}} end
{{?model=spdid}} coef_names = copy(m.coefnames)  # D, WD (and W2D with Exposure Order 2), then the explanatory variables, after the intercept with two periods
{{?model=spdid}} isempty(xnames) || (coef_names[(end - length(xnames) + 1):end] .= m.design == :two_period ? "Change in " .* xnames : xnames)
{{?model=spdid}} se = sqrt.(max.(0.0, diag(m.vcov)))
{{?model=spdid}} println("\nRegression", "\n", rpad("", 30), rpad("Estimate", 12), rpad("Std. Error", 12), "z")
{{?model=spdid}} for k in eachindex(m.coef)
{{?model=spdid}}	println(rpad(coef_names[k], 30), rpad(round(m.coef[k], digits = 4), 12), rpad(round(se[k], digits = 4), 12), round(m.coef[k] / se[k], digits = 2))
{{?model=spdid}} end
{{?model=spdid}} r = m.interference
{{?model=spdid}} println("\nExposure, over the rows of the regression: ", r.n_control_unexposed, " of ", r.n_control, " rows of comparison areas have no neighbour under the policy, ", r.n_control - r.n_control_unexposed, " have one or more", m.design == :two_period ? "" : "; a row is an area in one period")
{{?model=spdid}} println(r.identified ? "" : "The spillover is not identified. ", r.message)
{{?model=spdid}} length(starts) > 1 && println("The policy starts in different periods: with effects that differ between the areas brought under it at different times, the two-way fixed effects estimate is a weighted mean with weights of its own, some of them negative")
{{?model=spdid}} res = m.residuals  # one per area with two periods; one per area and period, after the within transformation, otherwise

{{?model=synth}} # Synthetic control: the policy must start in the same period in every area under it
{{?model=synth}} length(starts) == 1 || error("Synthetic Control needs the policy to start in the same period in every area under it")
{{?model=synth}} T0 = only(starts) - 1  # the last period before the policy
{{?model=synth}} T0 >= 2 || error("Synthetic Control needs two or more periods before the policy")
{{?model=synth}} # The predictors matched before the policy: the outcome in each period before it, and with Predictors set to Also Explanatory Variables, their means before it
{{?model=synth}} predictors = "{{predictors}}" == "outcome" || X === nothing ? nothing : hcat(y[:, 1:T0], reduce(hcat, [vec(mean(X[:, k, 1:T0]; dims = 2)) for k in axes(X, 2)]))
{{?model=synth}} # For each area under the policy, weights on the comparison areas, non-negative and summing to 1, that match its predictors; a penalty on the distance from the area under the policy to each comparison area, in km, favours the near comparison areas
{{?model=synth}} # Predictor Weights: Equal weighs every standardised predictor alike; Nested Search chooses the weights that make the synthetic control follow the outcome before the policy most closely
{{?model=synth}} vweights = Symbol("{{predictorWeights}}")
{{?model=synth}} m = fit_synthetic_control(y, treated, T0; W = W, coords = coords ./ 1000, predictors = predictors, donor_pool = Symbol("{{donorPool}}"), penalty = {{penalty}}, penalty_metric = Symbol("{{penaltyMetric}}"), predictor_weights = vweights)
{{?model=synth}} println(length(m.treated), " areas under the policy matched on ", m.n_predictors, " predictors, periods ", labels[1], " to ", labels[T0], "; ", length(m.donors), " comparison areas",
{{?model=synth}}	m.donor_pool_rule == :exclude_neighbours ? ", the $(length(m.excluded_neighbours)) neighbours of the areas under the policy left out" : ", every area not under the policy")
{{?model=synth}} println(m.penalty > 0 ? "Penalty: $(m.penalty) on the $(m.penalty_metric == :spatial ? "distance in km" : "distance in the standardised predictors")" : "No penalty: the weights may not be unique")
{{?model=synth}} println(m.predictor_rule == :nested ? "Predictor weights of the nested search, matching the outcome over periods $(labels[first(m.optimization_window)]) to $(labels[last(m.optimization_window)])" : "Equal weights on the standardised predictors")
{{?model=synth}} (maximum(m.kkt_gap) > 1e-6 || maximum(m.kkt_violation) > 1e-6) && println("The weights did not reach the optimum: their optimality conditions are not met")
{{?model=synth}} println("\nAverage effect on the areas under the policy, the mean gap after the policy: ", round(m.att, digits = 4))
{{?model=synth}} println("Ratio of the RMSPE of the mean gap after the policy to that before: ", round(m.ratio_aggregate, digits = 3), "; the Permutation Test ranks it, as there are no standard errors")
{{?model=synth}} area_names = String.(Tables.columntable(DBInterface.execute(con, "SELECT area::VARCHAR AS a FROM areas ORDER BY i")).a)
{{?model=synth}} println("\n", rpad("Area under the policy", 24), rpad("RMSPE before", 14), rpad("RMSPE after", 14), rpad("Ratio", 10), rpad("Mean gap after", 16), "Comparison areas used")
{{?model=synth}} for (k, i) in enumerate(m.treated)
{{?model=synth}}	println(rpad(area_names[i], 24), rpad(round(m.rmspe_pre[k], digits = 3), 14), rpad(round(m.rmspe_post[k], digits = 3), 14), rpad(round(m.ratio[k], digits = 2), 10),
{{?model=synth}}		rpad(round(mean(m.gaps[k, (T0 + 1):end]), digits = 3), 16), count(>(1e-6), m.weights[k, :]))
{{?model=synth}} end
{{?model=synth}} println("\n", rpad("Period", 12), rpad("Under the policy", 18), rpad("Synthetic", 12), "Gap")
{{?model=synth}} for t in 1:T_per  # means over the areas under the policy
{{?model=synth}}	println(rpad(labels[t] * (t == T0 + 1 ? " *" : ""), 12), rpad(round(mean(y[m.treated, t]), digits = 3), 18), rpad(round(mean(m.synthetic[:, t]), digits = 3), 12), round(m.att_path[t], digits = 3))
{{?model=synth}} end
{{?model=synth}} println("* the first period under the policy")
{{?model=synth}} mean_weight = vec(mean(m.weights; dims = 1))  # each comparison area's weight, averaged over the areas under the policy
{{?model=synth}} println("\n", rpad("Comparison area", 18), "Mean weight")
{{?model=synth}} for q in first(sortperm(mean_weight; rev = true), 10)
{{?model=synth}}	mean_weight[q] > 1e-6 && println(rpad(area_names[m.donors[q]], 18), round(mean_weight[q], digits = 4))
{{?model=synth}} end
{{?model=synth}} gaps = m.gaps  # areas under the policy by periods: the fit before the policy, the effect after it
'''

