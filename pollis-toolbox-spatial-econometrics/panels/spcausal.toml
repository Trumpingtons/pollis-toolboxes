for j in axes(P, 2)  # means over the areas under the policy
	println(rpad(pnames[j], 26), rpad(round(mean(P[m.treated, j]), digits = 3), 18), rpad(round(mean(synthetic_P[:, j]), digits = 3), 12), rpad(round(mean(P[m.donors, j]), digits = 3), 30), round(mean(m.predictor_weights[:, j]), digits = 3))
end
println("\n", rpad("Area under the policy", 24), rpad("RMSPE before", 14), rpad("Its own sd before", 20), rpad("Periods beyond the comparison areas", 38), "Optimum reached")
for (k, i) in enumerate(m.treated)
	# A weighted mean of the comparison areas stays within their range: an area under the policy above every comparison area, or below, cannot be matched there
	beyond = count(t -> y[i, t] > maximum(y[m.donors, t]) || y[i, t] < minimum(y[m.donors, t]), 1:T0)
	converged = m.kkt_gap[k] <= 1e-6 && m.kkt_violation[k] <= 1e-6
	println(rpad(area_names[i], 24), rpad(round(m.rmspe_pre[k], digits = 3), 14), rpad(round(std(y[i, 1:T0]), digits = 3), 20), rpad("$(beyond) of $(T0)", 38),
		converged ? "yes, $(m.iterations[k]) iterations" : "no: gap $(round(m.kkt_gap[k], sigdigits = 2)), violation $(round(m.kkt_violation[k], sigdigits = 2))")
end
println("Predictors divided by their standard deviations before the match: ", m.standardized ? "yes" : "no", "; predictor weights ", m.predictor_rule == :nested ? "of the nested search" : "equal")
println("A synthetic control that fits poorly before the policy says little about the effect after it")
