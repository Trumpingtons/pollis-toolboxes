[[faq]]
question = "What is a spatial interaction model?"
answer = '''
A spatial interaction model explains the flows between places, such as migrants, commuters, shoppers or goods, by how much each origin sends, how much each destination attracts, and how far apart they are. The gravity model is its best-known form: flows grow with the size of the origin and of the destination and fall with distance. Wilson's family adds constraints, so that the predicted flows add up to the known totals leaving each origin, arriving at each destination, or both.
'''
wiki = "Overview"

[[faq]]
question = "Why are flows modelled with a Poisson regression rather than least squares on logs?"
answer = '''
Flows are counts, often with many zeros, and their variance grows with their size. Least squares on the log of the flows drops the zeros and, when the errors are heteroskedastic, gives inconsistent estimates of the coefficients. A Poisson regression keeps the zeros, needs only the mean of the flows to be right, and, with origin and destination effects, reproduces the constraints of Wilson's models exactly.
'''
wiki = "Overview"

[[faq]]
question = "Which constraint should I choose?"
answer = '''
Choose by what is known and what is to be predicted. With both the total outflows of each origin and the total inflows of each destination known, the Doubly Constrained model distributes them across the pairs. With only the outflows known, as in a model of where people go from where they live, the Production model predicts the destinations. With only the inflows known, the Attraction model predicts where they come from. The Unconstrained model predicts the totals as well, from the variables of the origins and destinations.
'''
wiki = "Decision Guide"

[[faq]]
question = "How do I read the distance coefficient?"
answer = '''
With Exponential decay, the coefficient is the change in the log of the flow for one more kilometre: a coefficient of -0.007 means about 0.7 per cent fewer migrants for each kilometre. With Power decay, it is an elasticity: a coefficient of -1.2 means about 1.2 per cent fewer for each 1 per cent more distance. Distance Decay in Plain Numbers, in the Next Steps, prints both readings and the distance over which flows halve.
'''
wiki = "Distance Decay"

[[faq]]
question = "What do SRMSE and the Sørensen similarity index measure?"
answer = '''
Both compare the predicted flows with the observed ones. The standardised root mean square error is the root mean square error of the flows divided by their mean: 0 is a perfect fit, and smaller is better. The Sørensen similarity index averages, over the pairs, the share of the two values they have in common: 1 is a perfect fit. Unlike the pseudo R-squared, both are on the scale of the flows themselves.
'''
wiki = "Goodness of Fit"
hidden = true

[[faq]]
question = "When should I use the negative binomial model?"
answer = '''
When the flows vary much more than a Poisson model allows, which the overdispersion test of the Next Steps shows. The Poisson estimates stay consistent under overdispersion, but its model-based standard errors are then too small. The negative binomial model weights the flows differently and estimates the extra variance; robust standard errors are the other remedy, keeping the Poisson estimates.
'''
wiki = "Negative Binomial"
hidden = true

[[faq]]
question = "What are the origin and destination effects of the constrained models?"
answer = '''
They are one parameter for each origin, each destination, or both, which make the predicted flows add up to the observed totals. In Wilson's models they are the balancing factors; in trade, Anderson and van Wincoop call them multilateral resistance terms: how hard it is for each origin to reach all destinations, and for each destination to be reached. Map of the Origin and Destination Effects, in the Next Steps, draws them.
'''
wiki = "Doubly Constrained"
hidden = true

[[faq]]
question = "Does the panel reproduce PySAL's spint?"
answer = '''
Yes. Austrian Migration: spint, in the Replicate group of the Next Steps, fits the four models of Oshan's primer on the Austrian migration data and prints the coefficients and fit statistics of the primer and the standard errors, deviances and log-likelihoods of spint's tests beside those of Julia.
'''
wiki = "Replications"
hidden = true

