# Spatial Interaction Models: flows between places (migration, commuting, trade) on the size of the origins and
# destinations and the distance between them, Wilson's family of unconstrained, production-, attraction- and doubly
# constrained models fitted as Poisson regressions with GLFixedEffectModels.jl, and a negative binomial model with
# SpatialEconometrics.jl; the areas are read through DuckDB's spatial extension. Replication of PySAL's spint on the
# Austrian migration data.

[meta]
title = "Spatial Interaction Models"
viewType = "pollis.gravity"
defaultModel = "doubly"
decisionFirstColumn = "Model"

[[packages]]
name = "GLFixedEffectModels.jl"
github = "https://github.com/jmboehm/GLFixedEffectModels.jl"

[[packages]]
name = "SpatialEconometrics.jl"
# Fork of randsley/SpatialEconometrics.jl whose GWR and MGWR follow GWR4 and mgwr: Gaussian and exponential kernels without a cut-off, adaptive bandwidths counting the observation itself, AICc with n log(2 pi), golden section search and mgwr's back-fitting
github = "https://github.com/Trumpingtons/SpatialEconometrics.jl"
fork = true

