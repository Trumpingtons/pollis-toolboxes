DBInterface.execute(con, "COPY (SELECT area, geom FROM places) TO '$(pmap)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(pmap; name = "Places", color = "#bab0ac", opacity = 0.25), Pollis.layer(fmap; name = "Flows", column = "flow")))
'''

