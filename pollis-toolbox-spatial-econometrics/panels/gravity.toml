[[actionGroups.actions]]
id = "overdispersion"
label = "Overdispersion Test"
desc = "Cameron and Trivedi's regression test: does the variance of the flows grow faster than their mean, as a negative binomial model allows?"
models = ["unconstrained", "production", "attraction", "doubly"]
code = '''
# Cameron and Trivedi (1990): regress ((y - mu)^2 - y) / mu on mu, with no intercept; alpha > 0 is overdispersion of the form mu + alpha mu^2
aux = ((data.flow .- fit.mu) .^ 2 .- data.flow) ./ fit.mu
alpha = sum(aux .* fit.mu) / sum(abs2, fit.mu)
e = aux .- alpha .* fit.mu
se_alpha = sqrt(sum(abs2, e) / (nflows - 1) / sum(abs2, fit.mu))
z = alpha / se_alpha
println("alpha ", round(alpha, sigdigits = 4), ", standard error ", round(se_alpha, sigdigits = 4), ", t ", round(z, digits = 2), ", one-sided p-value ", (p = ccdf(Normal(), z); p < 0.0001 ? "<0.0001" : round(p, digits = 4)))
println(z > 1.645 ? "Overdispersion: the model-based standard errors are too small; choose Robust standard errors, or the Negative Binomial tab" : "No evidence of overdispersion at the 5 per cent level")
'''

[[actionGroups.actions]]
id = "residual-moran"
label = "Moran's I of the Residual Flows"
desc = "Are the residuals of flows from neighbouring origins, or to neighbouring destinations, alike? Moran's I with origin and with destination neighbours, as LeSage and Pace define them, with pseudo p-values from 499 permutations"
code = '''
# Places are neighbours when their outlines touch; flows are origin neighbours when they share a destination and their origins are neighbours, and destination neighbours likewise
touching = Tables.columntable(DBInterface.execute(con, "SELECT a.area AS a, b.area AS b FROM places a JOIN places b ON a.area <> b.area AND ST_Intersects(a.geom, b.geom)"))
adjacent = Set(zip(touching.a, touching.b))
r = (data.flow .- fit.mu) ./ sqrt.(max.(fit.mu, 1e-12))  # Pearson residuals
rng = Xoshiro(2026)
for (name, linked) in (("origin neighbours", (p, s) -> data.destination[p] == data.destination[s] && (data.origin[p], data.origin[s]) in adjacent),
		("destination neighbours", (p, s) -> data.origin[p] == data.origin[s] && (data.destination[p], data.destination[s]) in adjacent))
	pairs_ = [(p, s) for p in 1:nflows for s in 1:nflows if p != s && linked(p, s)]
	isempty(pairs_) && (println(name, ": no neighbouring flows"); continue)
	Wf = sparse(first.(pairs_), last.(pairs_), 1.0, nflows, nflows)
	Wf = spdiagm(0 => [s > 0 ? 1 / s : 0.0 for s in vec(sum(Wf, dims = 2))]) * Wf  # each row averages the flow's neighbours
	moran(v) = (z = v .- mean(v); dot(z, Wf * z) / dot(z, z) * nflows / sum(Wf))
	I0 = moran(r)
	perm = [moran(shuffle(rng, r)) for _ in 1:499]
	println(rpad(name, 24), "I ", round(I0, digits = 4), ", expected ", round(-1 / (nflows - 1), digits = 4), ", pseudo p-value ", round((1 + count(>=(I0), perm)) / 500, digits = 3))
end
println("Alike residuals of neighbouring flows: dependence the model leaves out, which the spatial interaction models of LeSage and Pace (2008) estimate")
'''

