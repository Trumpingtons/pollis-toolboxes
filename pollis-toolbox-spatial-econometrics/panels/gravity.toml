context = "Overdispersed flows"
purpose = "The doubly constrained model when the flows vary much more than a Poisson model allows"

[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. Choose... picks another. A file given by an absolute path is read where it is. Save the Results writes there."
default = "~/.pollis/data/examples"
folder = "data/examples"

[[inputs]]
id = "areasFile"
label = "Areas File"
tooltip = "The file of the places, as polygons, one per place: GeoPackage (its first layer), GeoJSON, Shapefile, FlatGeobuf or KML, in the folder above, or an absolute path. With the default, austria_nuts2.gpkg, the example first copies the nine NUTS-2 regions of Austria from PollisDatasets into the folder, unless it has the file already."
default = "austria_nuts2.gpkg"

[[inputs]]
id = "flowsFile"
label = "Flows File"
tooltip = "The flows, one row per origin and destination: a CSV or Parquet file, in the folder above, or an absolute path. With the default, austria_migration.csv, the example first copies the migration between the regions of Austria in 2006 from PollisDatasets into the folder, unless the folder has the file already."
default = "austria_migration.csv"

[[inputs]]
id = "areaColumn"
label = "Area Column"
tooltip = "The column of the areas file that names each place, as the origins and destinations of the flows file do."
default = "nuts_id"
newRow = true

[[inputs]]
id = "originColumn"
label = "Origin Column"
tooltip = "The column of the flows file that names the origin of each flow."
default = "origin"

[[inputs]]
id = "destinationColumn"
label = "Destination Column"
tooltip = "The column of the flows file that names the destination of each flow."
default = "destination"

[[inputs]]
id = "flowColumn"
label = "Flow Column"
tooltip = "The column of the flows file with the size of each flow: migrants, commuters, trips or the value of trade. Zeros are kept."
default = "flow"

[[inputs]]
id = "originVariables"
label = "Origin Variables"
tooltip = "Columns of the flows file that describe the origin of each flow, separated by commas, such as its population or its total outflow; entered in logs, so their coefficients are elasticities. Used by Unconstrained and Attraction. The example's oi is the total outflow of the origin."
default = "oi"
newRow = true

[[inputs]]
id = "destinationVariables"
label = "Destination Variables"
tooltip = "Columns of the flows file that describe the destination of each flow, separated by commas, such as its jobs or its total inflow; entered in logs. Used by Unconstrained and Production. The example's dj is the total inflow of the destination."
default = "dj"

[[inputs]]
id = "pairVariables"
label = "Pair Variables"
tooltip = "Columns of the flows file that describe each origin and destination together, separated by commas, such as a shared border or language, entered as they are; empty for none. Used by every tab."
default = ""

[[inputs]]
id = "distanceColumn"
label = "Distance Column"
tooltip = "The column of the flows file with the distance between origin and destination, in kilometres or another unit. Leave it empty to measure the distance between the places' centroids, in kilometres, in the Distance Coordinate System. The example's dij is the published distance."
default = "dij"
newRow = true

[[inputs]]
id = "decay"
label = "Distance Decay"
tooltip = "How the flows fall with distance: Exponential, exp(beta d), the distance as it is, so the coefficient is the change in the log flow per unit of distance; Power, d to the power beta, the log of the distance, so the coefficient is an elasticity. Power needs the flows within a place dropped."
kind = "select"
default = "exponential"

[[inputs.options]]
value = "exponential"
label = "Exponential"

[[inputs.options]]
value = "power"
label = "Power"

[[inputs]]
id = "intra"
label = "Flows Within a Place"
tooltip = "Whether the flows from a place to itself, such as moves within a region, are left out, as is usual, or kept."
kind = "select"
default = "drop"

[[inputs.options]]
value = "drop"
label = "Drop"

[[inputs.options]]
value = "keep"
label = "Keep"

[[inputs]]
id = "standardErrors"
label = "Standard Errors"
tooltip = "Model-Based, those of the Poisson model, which assume a variance equal to the mean, as PySAL's spint gives; Robust, valid whatever the variance, the usual choice for Poisson pseudo-maximum likelihood; or Clustered by Origin, which also allows the flows from the same origin to be correlated. The Negative Binomial tab gives SpatialEconometrics.jl's robust standard errors."
kind = "select"
default = "robust"

[[inputs.options]]
value = "model"
label = "Model-Based"

[[inputs.options]]
value = "robust"
label = "Robust"

[[inputs.options]]
value = "origin"
label = "Clustered by Origin"

[[inputs]]
id = "fileCrs"
label = "File Coordinate System"
tooltip = "The coordinate system of the areas file's coordinates, as an EPSG code: the places are moved from it into longitude and latitude on WGS 84 (EPSG:4326), for the maps. The example's regions are in EPSG:4258, ETRS89. GeoJSON and KML are always EPSG:4326."
default = "EPSG:4258"
newRow = true

[[inputs]]
id = "distanceCrs"
label = "Distance Coordinate System"
tooltip = "A projected coordinate system in metres, as an EPSG code, in which the distances between the places' centroids are measured when the Distance Column is empty: a UTM zone or the national grid of the region. The example's EPSG:31287 is MGI / Austria Lambert."
default = "EPSG:31287"

[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables, GLFixedEffectModels, PollisDatasets, SparseArrays, LinearAlgebra, Statistics, Random, Distributions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the files stay where they are
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Spatial Econometrics Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files: Choose... picks another
areas_path = joinpath(folder, "{{areasFile}}")  # an absolute path is kept as it is
flows_path = joinpath(folder, "{{flowsFile}}")
# Example files: migration between the nine NUTS-2 regions of Austria in 2006, from PollisDatasets, copied into the folder unless it has them already. Replace them with your own files.
if basename(areas_path) == "austria_nuts2.gpkg" && !isfile(areas_path)
	cp(samplefile("austria_nuts2.gpkg"), areas_path)  # the regions' outlines, in EPSG:4258
end
if basename(flows_path) == "austria_migration.csv" && !isfile(flows_path)
	cp(datafile("austria_migration"), flows_path)  # datasetinfo("austria_migration") describes the columns
end
names_of(s) = filter(!isempty, String.(strip.(split(s, ","))))  # a list of columns, separated by commas
ovars, dvars, pvars = names_of("{{originVariables}}"), names_of("{{destinationVariables}}"), names_of("{{pairVariables}}")
q(c) = "\"" * c * "\""  # a column name quoted for SQL

# The places, in longitude and latitude, with their centroids in kilometres in the distance coordinate system
DBInterface.execute(con, "CREATE OR REPLACE TABLE places AS SELECT $(q("{{areaColumn}}"))::VARCHAR AS area, ST_X(ST_Centroid(ST_Transform(geom, '{{fileCrs}}', '{{distanceCrs}}'))) / 1000 AS cx, ST_Y(ST_Centroid(ST_Transform(geom, '{{fileCrs}}', '{{distanceCrs}}'))) / 1000 AS cy, ST_Transform(geom, '{{fileCrs}}', 'EPSG:4326') AS geom FROM ST_Read('$(areas_path)')")
# The flows whose origin and destination are both places of the areas file, with every value
distance_sql = isempty(strip("{{distanceColumn}}")) ? "sqrt((a.cx - b.cx)^2 + (a.cy - b.cy)^2)" : "f.$(q("{{distanceColumn}}"))::DOUBLE"
extra = join(("f.$(q(c))::DOUBLE AS $(q(c))" for c in unique([ovars; dvars; pvars])), ", ")
present = join(("f.$(q(c)) IS NOT NULL" for c in ["{{flowColumn}}"; ovars; dvars; pvars]), " AND ")
within = "{{intra}}" == "drop" ? " AND a.area <> b.area" : ""
DBInterface.execute(con, """
	CREATE OR REPLACE TABLE flows AS
	SELECT a.area AS origin, b.area AS destination, f.$(q("{{flowColumn}}"))::DOUBLE AS flow, $(distance_sql) AS distance$(isempty(extra) ? "" : ", " * extra)
	FROM '$(flows_path)' f JOIN places a ON a.area = f.$(q("{{originColumn}}"))::VARCHAR JOIN places b ON b.area = f.$(q("{{destinationColumn}}"))::VARCHAR
	WHERE $(present)$(within)""")
t = Tables.columntable(DBInterface.execute(con, "SELECT * FROM flows ORDER BY origin, destination"))
nflows = length(t.flow)
decay = "{{decay}}"
decay == "power" && any(<=(0), t.distance) && error("Power decay takes the log of the distance: choose Drop for Flows Within a Place")
# The columns of the regression: the distance (its log with power decay), the origin and destination variables in logs, the pair variables as they are
data = (; flow = t.flow, origin = t.origin, destination = t.destination, every = fill("all", nflows), distance = decay == "power" ? log.(t.distance) : t.distance,
	(Symbol("log_", c) => log.(t[Symbol(c)]) for c in unique([ovars; dvars]))..., (Symbol(c) => t[Symbol(c)] for c in pvars)...)
println(nflows, " flows between ", length(unique([t.origin; t.destination])), " places, ", round(Int, sum(t.flow)), " in all")

# One of Wilson's four models, as a Poisson regression with the origin and destination effects of its constraints
vcov_choice = Dict("model" => Vcov.simple(), "robust" => Vcov.robust(), "origin" => Vcov.cluster(:origin))["{{standardErrors}}"]
function fit_flows(constraint; vcov = vcov_choice, columns = data, distribution = Poisson(), link = LogLink())
	rhs = Any[]
	constraint in ("unconstrained", "attraction") && append!(rhs, term.(Symbol.("log_" .* ovars)))
	constraint in ("unconstrained", "production") && append!(rhs, term.(Symbol.("log_" .* dvars)))
	append!(rhs, term.(Symbol.(pvars)))
	push!(rhs, term(:distance))
	nslopes = length(rhs)
	constraint == "unconstrained" && push!(rhs, fe(:every))  # one effect shared by every flow: the intercept
	constraint in ("production", "doubly") && push!(rhs, fe(:origin))
	constraint in ("attraction", "doubly") && push!(rhs, fe(:destination))
	# Started from 0: with the default start, 0.1 times distances in km overflows the first prediction
	m = nlreg(columns, term(:flow) ~ sum(rhs), distribution, link, vcov; save = [:mu, :fe], start = zeros(nslopes))
	m.converged || println("The fit of the $(constraint) model did not converge")
	return m
end
# What every tab leaves for the Next Steps: coefficients, covariance, fitted flows and fit
# The parameters of each model: the slopes, and the effects of its constraint, two-way effects sharing one level
nparams(m, constraint, columns = data) = length(coef(m)) + Dict("unconstrained" => 1, "production" => length(unique(columns.origin)),
	"attraction" => length(unique(columns.destination)), "doubly" => length(unique(columns.origin)) + length(unique(columns.destination)) - 1)[constraint]
function summarise(m, constraint)
	mu = predict(m)
	y = data.flow
	k = nparams(m, constraint)  # the origin and destination effects included
	ll, ll0 = loglikelihood(m), nullloglikelihood(m)
	return (b = coef(m), V = vcov(m), names = coefnames(m), mu = mu, ll = ll, ll0 = ll0, k = k, deviance = deviance(m),
		pseudoR2 = 1 - ll / ll0, adj_pseudoR2 = 1 - (ll - k) / ll0, AIC = -2 * ll + 2 * k,
		SRMSE = sqrt(sum(abs2, y .- mu) / length(y)) / mean(y), SSI = mean(ifelse.(y .+ mu .> 0, 2 .* min.(y, mu) ./ (y .+ mu), 1.0)))
end
function show_fit(title, f)
	se = sqrt.(max.(0.0, diag(f.V)))
	println("\n", title)
	println(rpad("", 18), rpad("estimate", 14), rpad("std. error", 14), rpad("z", 10), "p-value")
	for j in eachindex(f.b)
		z = f.b[j] / se[j]
		println(rpad(f.names[j], 18), rpad(round(f.b[j], sigdigits = 6), 14), rpad(round(se[j], sigdigits = 4), 14), rpad(round(z, digits = 2), 10), (p = 2 * ccdf(Normal(), abs(z)); p < 0.0001 ? "<0.0001" : round(p, digits = 4)))
	end
	println("pseudo R2 ", round(f.pseudoR2, digits = 4), ", AIC ", round(f.AIC, digits = 1), ", SRMSE ", round(f.SRMSE, digits = 4), ", SSI ", round(f.SSI, digits = 4))
end
se_label = Dict("model" => "model-based", "robust" => "robust", "origin" => "clustered by origin")["{{standardErrors}}"]

{{?model=unconstrained}} # The gravity model: the origins' and destinations' variables, in logs, and the distance
{{?model=unconstrained}} m = fit_flows("unconstrained")
{{?model=unconstrained}} fit = summarise(m, "unconstrained")
{{?model=unconstrained}} show_fit("Unconstrained Poisson model, $(decay) distance decay, $(se_label) standard errors", fit)
{{?model=unconstrained}} println("intercept ", round(first(Tables.columntable(m.augmentdf).fe_every), sigdigits = 6), ", the effect shared by every flow")
{{?model=production}} # One effect per origin, so that the predicted flows leaving each origin add up to the observed ones
{{?model=production}} m = fit_flows("production")
{{?model=production}} fit = summarise(m, "production")
{{?model=production}} show_fit("Production-constrained Poisson model, $(decay) distance decay, $(se_label) standard errors", fit)
{{?model=attraction}} # One effect per destination, so that the predicted flows into each destination add up to the observed ones
{{?model=attraction}} m = fit_flows("attraction")
{{?model=attraction}} fit = summarise(m, "attraction")
{{?model=attraction}} show_fit("Attraction-constrained Poisson model, $(decay) distance decay, $(se_label) standard errors", fit)
{{?model=doubly}} # One effect per origin and per destination: both totals reproduced, and the flows distributed by distance
{{?model=doubly}} m = fit_flows("doubly")
{{?model=doubly}} fit = summarise(m, "doubly")
{{?model=doubly}} show_fit("Doubly constrained Poisson model, $(decay) distance decay, $(se_label) standard errors", fit)
{{?model=negbin}} using SpatialEconometrics: fit_gravity, NegBinGravity, BilateralFE  # by name: SpatialEconometrics.jl also exports a fe of its own
{{?model=negbin}} # The doubly constrained model with a negative binomial variance, mu + alpha mu^2, origin and destination effects swept out
{{?model=negbin}} codes = sort(unique([data.origin; data.destination]))
{{?model=negbin}} index = Dict(c => k for (k, c) in enumerate(codes))
{{?model=negbin}} m = fit_gravity(NegBinGravity(), data.flow, hcat((data[Symbol(c)] for c in pvars)..., data.distance), getindex.(Ref(index), data.origin), getindex.(Ref(index), data.destination); fe = BilateralFE(), varnames = [pvars; "distance"])
{{?model=negbin}} m.converged || println("The negative binomial fit did not converge")
{{?model=negbin}} k = length(m.coef) + 2 * length(codes) - 1
{{?model=negbin}} y = data.flow
{{?model=negbin}} fit = (b = m.coef, V = m.vcov, names = m.coefnames, mu = m.fitted, ll = m.loglik, ll0 = NaN, k = k, deviance = m.deviance, pseudoR2 = m.pseudo_R2, adj_pseudoR2 = NaN, AIC = -2 * m.loglik + 2 * (k + 1), SRMSE = sqrt(sum(abs2, y .- m.fitted) / length(y)) / mean(y), SSI = mean(ifelse.(y .+ m.fitted .> 0, 2 .* min.(y, m.fitted) ./ (y .+ m.fitted), 1.0)))
{{?model=negbin}} show_fit("Negative binomial model with origin and destination effects, $(decay) distance decay, robust standard errors", fit)
{{?model=negbin}} println("alpha ", round(m.alpha, sigdigits = 4), ": the variance is mu + alpha mu^2, and 0 would be Poisson")
'''

# Next Steps action groups
[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "map-flows"
label = "Map of the Flows"
desc = "Each flow as a line from the centroid of its origin to that of its destination, coloured by its size, the largest drawn last"
code = '''
largest = sortperm(data.flow)[max(1, nflows - 199):end]  # at most the 200 largest flows, so the map stays readable
DBInterface.execute(con, "CREATE OR REPLACE TABLE shown AS SELECT origin, destination, flow::DOUBLE AS flow, k FROM (VALUES $(join(("('$(data.origin[r])', '$(data.destination[r])', $(data.flow[r]), $(k))" for (k, r) in enumerate(largest)), ", "))) t(origin, destination, flow, k)")
fmap = joinpath(mktempdir(), "flows.geojson")
DBInterface.execute(con, "COPY (SELECT s.origin, s.destination, s.flow, ST_MakeLine(ST_Centroid(a.geom), ST_Centroid(b.geom)) AS geom FROM shown s JOIN places a ON a.area = s.origin JOIN places b ON b.area = s.destination ORDER BY s.k) TO '$(fmap)' (FORMAT GDAL, DRIVER 'GeoJSON')")
