[[actionGroups.actions]]
id = "replicate-spint"
label = "Austrian Migration: spint"
desc = "The four constrained models of Oshan's primer on PySAL's spint, on the migration between Austria's regions in 2006: coefficients and fit against the primer, standard errors, deviance and log-likelihood against spint's tests"
code = '''
a = dataset("austria_migration")
keep = a.origin .!= a.destination  # the flows within a region left out, as in the primer
austria = (flow = Float64.(a.flow[keep]), origin = a.origin[keep], destination = a.destination[keep], every = fill("all", count(keep)), distance = a.dij[keep], log_oi = log.(a.oi[keep]), log_dj = log.(a.dj[keep]))
function spint_fit(constraint, columns)
	rhs = Any[]
	constraint in ("unconstrained", "attraction") && push!(rhs, term(:log_oi))
	constraint in ("unconstrained", "production") && push!(rhs, term(:log_dj))
	push!(rhs, term(:distance))
	nslopes = length(rhs)
	constraint == "unconstrained" && push!(rhs, fe(:every))  # the intercept
	constraint in ("production", "doubly") && push!(rhs, fe(:origin))
	constraint in ("attraction", "doubly") && push!(rhs, fe(:destination))
	m_ = nlreg(columns, term(:flow) ~ sum(rhs), Poisson(), LogLink(), Vcov.simple(); save = [:mu, :fe], start = zeros(nslopes))
	mu, y_ = predict(m_), columns.flow
	k_, ll = nparams(m_, constraint, columns), loglikelihood(m_)
	if constraint == "unconstrained"  # the intercept with the slopes, and their model-based standard errors from the Poisson information matrix
		b_ = [first(Tables.columntable(m_.augmentdf).fe_every); coef(m_)]
		Xf = hcat(ones(length(mu)), columns.log_oi, columns.log_dj, columns.distance)
		se_ = sqrt.(diag(inv(transpose(Xf) * (mu .* Xf))))
	else
		b_, se_ = coef(m_), sqrt.(diag(vcov(m_)))
	end
	return (b = b_, se = se_, ll = ll, deviance = deviance(m_), pseudoR2 = 1 - ll / nullloglikelihood(m_), adj = 1 - (ll - k_) / nullloglikelihood(m_), AIC = -2 * ll + 2 * k_,
		SRMSE = sqrt(sum(abs2, y_ .- mu) / length(y_)) / mean(y_), SSI = mean(2 .* min.(y_, mu) ./ (y_ .+ mu)))
end
function compare(title, rows)
	println("\n", title)
	println(rpad("", 34), rpad("Julia", 20), rpad("published", 20), "difference")
	foreach(((what, julia, published),) -> println(rpad(what, 34), rpad(round(julia, sigdigits = 10), 20), rpad(published, 20), round(julia - published, sigdigits = 2)), rows)
end
# Oshan (2016), the primer: exponential distance decay, with the totals of the dataset
u, p, at, d = (spint_fit(c, austria) for c in ("unconstrained", "production", "attraction", "doubly"))
compare("Oshan's primer: coefficients", [
	("unconstrained, intercept", u.b[1], -8.01822841), ("unconstrained, log oi", u.b[2], 0.869316127), ("unconstrained, log dj", u.b[3], 0.891445153), ("unconstrained, distance", u.b[4], -0.0062293837),
	("production, log dj", p.b[1], 0.90285448), ("production, distance", p.b[2], -0.0072617),
	("attraction, log oi", at.b[1], 0.90037216), ("attraction, distance", at.b[2], -0.00695034),
	("doubly, distance", d.b[1], -0.00791533)])
compare("Oshan's primer: fit", [
	("unconstrained, pseudo R2", u.pseudoR2, 0.885764), ("unconstrained, adjusted", u.adj, 0.885718), ("unconstrained, AIC", u.AIC, 20122.074349), ("unconstrained, SRMSE", u.SRMSE, 0.607776), ("unconstrained, SSI", u.SSI, 0.727358),
	("production, pseudo R2", p.pseudoR2, 0.910156), ("production, adjusted", p.adj, 0.910031), ("production, AIC", p.AIC, 15841.253799), ("production, SRMSE", p.SRMSE, 0.464520), ("production, SSI", p.SSI, 0.740914),
	("attraction, pseudo R2", at.pseudoR2, 0.909355), ("attraction, adjusted", at.adj, 0.909230), ("attraction, AIC", at.AIC, 15982.313101), ("attraction, SRMSE", at.SRMSE, 0.584048), ("attraction, SSI", at.SSI, 0.752155),
	("doubly, pseudo R2", d.pseudoR2, 0.943540), ("doubly, adjusted", d.adj, 0.943335), ("doubly, AIC", d.AIC, 9977.159141), ("doubly, SRMSE", d.SRMSE, 0.379286), ("doubly, SSI", d.SSI, 0.811852)])
# spint's tests: the same flows and distances, with origin and destination totals of their own for the models that use them
oi_test = Dict("AT11" => 4320, "AT12" => 21478, "AT13" => 30500, "AT21" => 5012, "AT22" => 8811, "AT31" => 11349, "AT32" => 6021, "AT33" => 4477, "AT34" => 2275)
dj_test = Dict("AT11" => 5452, "AT12" => 27169, "AT13" => 28710, "AT21" => 4354, "AT22" => 9069, "AT31" => 8577, "AT32" => 4963, "AT33" => 3923, "AT34" => 2026)
tested = merge(austria, (log_oi = log.(getindex.(Ref(oi_test), austria.origin)), log_dj = log.(getindex.(Ref(dj_test), austria.destination))))
ut, pt, att = (spint_fit(c, tested) for c in ("unconstrained", "production", "attraction"))
compare("spint's tests: coefficients and standard errors", [
	("unconstrained, intercept", ut.b[1], -7.95447436), ("unconstrained, log oi", ut.b[2], 0.863867812), ("unconstrained, log dj", ut.b[3], 0.880474585), ("unconstrained, distance", ut.b[4], -0.00620544765),
	("se unconstrained, intercept", ut.se[1], 0.0755583451), ("se unconstrained, log oi", ut.se[2], 0.0051683844), ("se unconstrained, log dj", ut.se[3], 0.00478122141), ("se unconstrained, distance", ut.se[4], 5.18488192e-5),
