id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "forecast-beyond"
label = "Forecast Beyond the Data"
desc = "The model fitted again on every period, the held-back ones included, and the Horizon forecast after the last period of the data, with the forecasts of every area saved beside the panel file"
code = '''
# The fit and forecasts of the held-back periods stay as m and forecasts, for the steps that score them; these are m_all and ahead
{{?model!=spvar}} isempty(xnames) || error("Forecasting beyond the data needs the explanatory variables' values in the periods forecast, which the panel file does not have: leave Explanatory Variables empty")
{{?model!=spvar}} ybar_all = "{{areaMeans}}" == "remove" ? vec(mean(reshape(y, N, T_per), dims = 2)) : zeros(N)  # each area's mean over every period, with Area Means set to Remove
{{?model!=spvar}} yc_all = y .- repeat(ybar_all, T_per)
{{?model=star}} m_all = fit_star(yc_all, zeros(N * T_per, 0), W, N, T_per; spatial_lags = {{spatialLags}}, temporal_lags = L, spatial_weights = Symbol("{{spatialWeights}}"))
{{?model=panelar}} m_all = fit_star(yc_all, zeros(N * T_per, 0), W, N, T_per; spatial_lags = 0, temporal_lags = L)
{{?model!=spvar}} ahead = spatial_forecast(m_all, zeros(N * h, 0); h = h, y_history = yc_all[(N * (T_per - L) + 1):end]) .+ ybar_all  # N areas by h periods, the area means added back
{{?model!=spvar}} saved, saved_names = ahead, [yname]
{{?model!=spvar}} shown = yname
{{?model=spvar}} m_all = fit_spvar(Y, W, N, T_per; ordering = 1:K, p = L, s = {{spatialLags}}, varnames = vnames)
{{?model=spvar}} ahead_all = spvar_forecast(m_all, h; y_history = Y[(N * (T_per - L) + 1):end, :])  # N * h rows, one column per variable
{{?model=spvar}} kshow = something(findfirst(==("{{dependent}}"), vnames), K)  # the Variable to Forecast, if it is one of the Variables, otherwise the last
{{?model=spvar}} shown = vnames[kshow]
{{?model=spvar}} ahead = reshape(ahead_all[:, kshow], N, h)  # N areas by h periods
{{?model=spvar}} saved, saved_names = ahead_all, vnames
println("Fitted again on periods ", labels[L + 1], " to ", labels[T_per], "; spectral radius ", round(m_all.spectral_radius, digits = 4), " (", round(m.spectral_radius, digits = 4), " without the ", H, " periods held back)")
m_all.stationary || println("The system fitted on every period is not stationary: these forecasts diverge with the horizon")
println("\nForecasts of ", shown, " after ", labels[T_per], ", the last period of the data")
println(rpad("Step", 8), rpad("Mean", 12), rpad("Lowest", 12), "Highest")
for s in 1:h
	println(rpad("+$(s)", 8), rpad(round(mean(ahead[:, s]), digits = 3), 12), rpad(round(minimum(ahead[:, s]), digits = 3), 12), round(maximum(ahead[:, s]), digits = 3))
end
# Every area's forecasts, one row per area and step, beside the panel file
area_names = String.(Tables.columntable(DBInterface.execute(con, "SELECT area::VARCHAR AS area FROM areas ORDER BY i")).area)
out_path = joinpath(dirname(panel_path), splitext(basename(panel_path))[1] * "-forecasts.csv")
open(out_path, "w") do io
	println(io, join(["{{areaColumn}}"; "step"; saved_names], ","))
	for s in 1:h, i in 1:N
{{?model!=spvar}}		row = [saved[i, s]]  # N areas by h steps
{{?model=spvar}}		row = saved[(s - 1) * N + i, :]  # N * h rows, one column per variable
		println(io, join([area_names[i]; string(s); string.(round.(row, digits = 4))], ","))
	end
end
println("\nSaved ", N * h, " rows, every area at every step, in ", out_path)
println("Steps count periods after ", labels[T_per], ": +1 is the next period of the Period Column")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "accuracy-by-horizon"
label = "Forecast Accuracy by Horizon"
desc = "STAR, Spatial VAR, Panel AR and each area's last value, fitted on the same periods and scored on the periods held back, step by step: the RMSE of each against the horizon on a chart, and a table of RMSE and MAE, so that what the neighbours and the other variables add can be read at each horizon"
code = '''
using ECharts

H >= 1 || error("Hold back one or more periods, under Periods Held Back, so that the forecasts can be scored")
hs = min(h, H)  # the steps whose values are known
{{?model!=spvar}} target = yname
{{?model=spvar}} target = vnames[something(findfirst(==("{{dependent}}"), vnames), K)]  # the Variable to Forecast, if it is one of the Variables, otherwise the last
y_t = column(target)
observed_t = reshape(y_t, N, T_per)[:, (T_fit + 1):(T_fit + hs)]  # the values held back, N areas by hs steps
# STAR and Panel AR: the settings of the tab, with its explanatory variables on STAR and Panel AR, none on Spatial VAR
bar = "{{areaMeans}}" == "remove" ? vec(mean(reshape(y_t[1:(N * T_fit)], N, T_fit), dims = 2)) : zeros(N)
yt_c = y_t .- repeat(bar, T_per)
history_t = yt_c[(N * (T_fit - L) + 1):(N * T_fit)]
{{?model!=spvar}} X_fit, X_ahead = Xc[1:(N * T_fit), :], Xc[(N * T_fit + 1):(N * (T_fit + hs)), :]
{{?model=spvar}} X_fit, X_ahead = zeros(N * T_fit, 0), zeros(N * hs, 0)
m_star = fit_star(yt_c[1:(N * T_fit)], X_fit, W, N, T_fit; spatial_lags = max(1, {{spatialLags}}), temporal_lags = L, spatial_weights = Symbol("{{spatialWeights}}"))
m_ar = fit_star(yt_c[1:(N * T_fit)], X_fit, W, N, T_fit; spatial_lags = 0, temporal_lags = L)
methods = [("STAR", spatial_forecast(m_star, X_ahead; h = hs, y_history = history_t) .+ bar),
	("Panel AR", spatial_forecast(m_ar, X_ahead; h = hs, y_history = history_t) .+ bar),
	("Last value", repeat(reshape(y_t, N, T_per)[:, T_fit], 1, hs))]
# Spatial VAR: the Variables, when the variable scored is one of them and none has missing values
vlist = String.(strip.(split("{{variables}}", ",")))
kt = findfirst(==(target), vlist)
gaps = only(Tables.columntable(DBInterface.execute(con, "SELECT count(*) AS n FROM obs WHERE $(join(("\"$v\" IS NULL" for v in vlist), " OR "))")).n)
if kt !== nothing && length(vlist) >= 2 && gaps == 0
	Yv = reduce(hcat, column.(vlist))
	m_var = fit_spvar(Yv[1:(N * T_fit), :], W, N, T_fit; ordering = 1:length(vlist), p = L, s = max(1, {{spatialLags}}), varnames = vlist)
	insert!(methods, 2, ("Spatial VAR", reshape(spvar_forecast(m_var, hs; y_history = Yv[(N * (T_fit - L) + 1):(N * T_fit), :])[:, kt], N, hs)))
else
	println("Spatial VAR left out: ", target, " is not one of two or more Variables without missing values")
end
rmse(f) = vec(sqrt.(mean((f .- observed_t) .^ 2, dims = 1)))  # one value per step, over the areas
display(EChart(ec_width = 720, ec_height = 360, title = [ECharts.Title(text = "RMSE of the forecasts of $(target), step by step")],
	xAxis = [ECharts.Axis(_type = "category", name = "{{periodColumn}}", data = labels[(T_fit + 1):(T_fit + hs)])], yAxis = [ECharts.Axis(_type = "value", name = "RMSE", scale = true)],
	series = [ECharts.XYSeries(name = name, _type = "line", data = rmse(f)) for (name, f) in methods]))
println(rpad("Step", 6), rpad("Period", 12), join((rpad(name, 14) for (name, _) in methods)))
for s in 1:hs
	println(rpad(s, 6), rpad(labels[T_fit + s], 12), join((rpad(round(rmse(f)[s], digits = 3), 14) for (_, f) in methods)))
end
naive = sqrt(mean((last(methods)[2] .- observed_t) .^ 2))
println("\n", rpad("Over all steps", 18), rpad("RMSE", 10), rpad("MAE", 10), "RMSE / last value")
for (name, f) in methods
	overall = sqrt(mean((f .- observed_t) .^ 2))
	println(rpad(name, 18), rpad(round(overall, digits = 3), 10), rpad(round(mean(abs.(f .- observed_t)), digits = 3), 10), round(overall / naive, digits = 3))
end
println("\nFitted on periods to ", labels[T_fit], " and scored on the ", hs, " period(s) after it; below 1 in the last column, more accurate than each area's last value")
println("STAR with ", max(1, {{spatialLags}}), " spatial lag(s) and Spatial VAR with ", max(1, {{spatialLags}}), " ring(s) of neighbours, all with ", L, " temporal lag(s)", isempty(X_ahead) ? "" : "; STAR and Panel AR with the explanatory variables, whose values in the periods forecast are known only because they were held back")
println("One origin and one set of periods held back: differences between the models are those of these periods, not a test")
'''

[[actionGroups.actions]]
id = "powers-orders"
label = "Powers Against Orders of W"
desc = "STAR with two or more spatial lags fitted twice, with the rings of neighbours as powers of the weights and as order-k neighbours: their coefficients side by side, their log-likelihood, AIC and BIC, their spectral radius and the accuracy of their forecasts of the periods held back"
models = ["star"]
code = '''
S2 = max(2, {{spatialLags}})  # with one spatial lag the two definitions are the same
weights_kinds = [("Powers of W", :powers), ("Order-k", :orders)]
# W^k, the weights multiplied k times, counts the paths of k steps between two areas, so it reaches the area itself and nearer rings; order k keeps only the areas exactly k steps away
fits = [(name, fit_star(yc[fitted], Xc[fitted, :], W, N, T_fit; spatial_lags = S2, temporal_lags = L, spatial_weights = kind, varnames = xnames)) for (name, kind) in weights_kinds]
println("STAR with ", S2, " spatial lags and ", L, " temporal lag(s), fitted on periods ", labels[L + 1], " to ", labels[T_fit], "\n")
println(rpad("", 18), join((rpad(name, 24) for (name, _) in fits)))
for j in eachindex(fits[1][2].coef)  # the same terms in the same order; the names say W^k for powers and W with k in brackets for orders
	println(rpad(fits[1][2].coefnames[j], 18), join((rpad("$(round(f.coef[j], digits = 4)) ($(round(sqrt(max(0.0, f.vcov[j, j])), digits = 4)))", 24) for (_, f) in fits)))
end
println("Estimates with their standard errors in brackets\n")
hs = min(h, H)  # the steps whose values are known
history_s = yc[(N * (T_fit - L) + 1):(N * T_fit)]
X_ahead = isempty(xnames) ? zeros(N * hs, 0) : Xc[(N * T_fit + 1):(N * (T_fit + hs)), :]
println(rpad("", 18), rpad("Log-likelihood", 16), rpad("AIC", 12), rpad("BIC", 12), rpad("Spectral radius", 18), hs > 0 ? "RMSE, held back" : "")
for (name, f) in fits
	n_obs, k = f.N * f.T_eff, length(f.coef)  # the same observations in both fits, so their criteria compare
	score = ""
	if hs > 0
		ahead_s = spatial_forecast(f, X_ahead; h = hs, y_history = history_s) .+ ybar
		score = string(round(sqrt(mean((ahead_s .- actual[:, (T_fit + 1):(T_fit + hs)]) .^ 2)), digits = 4))
	end
	println(rpad(name, 18), rpad(round(f.loglik, digits = 2), 16), rpad(round(-2 * f.loglik + 2 * k, digits = 2), 12), rpad(round(-2 * f.loglik + k * log(n_obs), digits = 2), 12), rpad(round(f.spectral_radius, digits = 4), 18), score)
end
println("\nThe two fits have the same number of coefficients, so AIC and BIC rank them as the log-likelihood does: the higher log-likelihood, the lower criteria")
println("Pfeifer and Deutsch define the rings as order-k neighbours; SpatialEconometrics.jl takes powers of W by default")
'''

[[actionGroups.actions]]
id = "lag-orders"
label = "Lag Orders"
desc = "STAR fitted for every spatial order from 0, Panel AR, to 3 and every temporal order from 1 to 3, on the same periods: AIC, BIC and the RMSE of the forecasts of the periods held back for each pair of orders, with the pair each prefers"
models = ["star", "panelar"]
code = '''
S_grid, L_grid = 0:3, 1:3  # spatial orders, 0 being Panel AR, and temporal orders
L_top = maximum(L_grid)
T_fit > L_top + 1 || error("Too few periods fitted for ", L_top, " temporal lags: hold back fewer periods")
hs = min(h, H)  # the steps whose values are known
X_ahead = isempty(xnames) ? zeros(N * hs, 0) : Xc[(N * T_fit + 1):(N * (T_fit + hs)), :]
aic, bic, score = fill(NaN, length(S_grid), length(L_grid)), fill(NaN, length(S_grid), length(L_grid)), fill(NaN, length(S_grid), length(L_grid))
for (a, S) in enumerate(S_grid), (b, Lg) in enumerate(L_grid)
	skip = L_top - Lg  # periods left out at the start, so that every fit explains periods L_top + 1 to the last fitted
	rows = (skip * N + 1):(N * T_fit)
	f = try
		fit_star(yc[rows], Xc[rows, :], W, N, T_fit - skip; spatial_lags = S, temporal_lags = Lg, spatial_weights = Symbol("{{spatialWeights}}"), varnames = xnames)
	catch e
		e isa ArgumentError || rethrow()
		nothing  # a design the package refuses: a power of W that repeats lower ones, or an order beyond the neighbours' graph
	end
	f === nothing && continue
	n_obs, k = f.N * f.T_eff, length(f.coef)
	aic[a, b], bic[a, b] = -2 * f.loglik + 2 * k, -2 * f.loglik + k * log(n_obs)
	if hs > 0
		ahead_s = spatial_forecast(f, X_ahead; h = hs, y_history = yc[(N * (T_fit - Lg) + 1):(N * T_fit)]) .+ ybar
		score[a, b] = sqrt(mean((ahead_s .- actual[:, (T_fit + 1):(T_fit + hs)]) .^ 2))
	end
end
function show_grid(title, values, digits)
	println(title)
	println(rpad("", 22), join((rpad("L = $(Lg)", 14) for Lg in L_grid)))
	for (a, S) in enumerate(S_grid)
		println(rpad(S == 0 ? "S = 0, Panel AR" : "S = $(S)", 22), join((rpad(isnan(v) ? "-" : string(round(v, digits = digits)), 14) for v in values[a, :])))
	end
	if any(!isnan, values)
		best = argmin(map(v -> isnan(v) ? Inf : v, values))
		println("Lowest: S = ", S_grid[best[1]], ", L = ", L_grid[best[2]], "\n")
	end
end
println("STAR on periods ", labels[L_top + 1], " to ", labels[T_fit], " for every pair of orders, with ", "{{spatialWeights}}" == "powers" ? "powers of W" : "order-k neighbours", "\n")
show_grid("AIC", aic, 1)
show_grid("BIC", bic, 1)
hs > 0 && show_grid("RMSE of the forecasts of the $(hs) period(s) held back", score, 4)
println("BIC penalises each coefficient more than AIC once there are more than about 7 observations, so it tends to choose the smaller orders")
println("A dash marks a pair the package refused: a power of W that repeats lower ones, or an order beyond the farthest neighbours")
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "impulse-responses"
label = "Space-Time Impulse Responses"
desc = "How a one-period shock to one area spreads over the following periods: on STAR and Panel AR the response of the area itself and the spillover to the others, on Spatial VAR the response of each variable to a shock to each, at the area and at each ring of its neighbours, with the effects added up over the Horizon"
code = '''
using ECharts

steps = 0:h  # periods after the shock, 0 being the period of the shock
{{?model!=spvar}} irf = space_time_irf(m; horizon = h, store_matrices = false)  # the response of every area to a unit shock to each, averaged over the areas
{{?model!=spvar}} cum = space_time_irf(m; horizon = h, cumulative = true, store_matrices = false)  # the same, added up over the periods
{{?model!=spvar}} display(EChart(ec_width = 720, ec_height = 360, title = [ECharts.Title(text = "Response to a unit shock to $(yname) in one area")],
{{?model!=spvar}}	xAxis = [ECharts.Axis(_type = "category", name = "Periods after", data = string.(steps))], yAxis = [ECharts.Axis(_type = "value", name = "Response", scale = true)],
{{?model!=spvar}}	series = [ECharts.XYSeries(name = "Own area", _type = "line", data = irf.own), ECharts.XYSeries(name = "Other areas", _type = "line", data = irf.spillover), ECharts.XYSeries(name = "Total", _type = "line", data = irf.total)]))
{{?model!=spvar}} println(rpad("After", 8), rpad("Own area", 12), rpad("Other areas", 14), rpad("Total", 12), "Total so far")
{{?model!=spvar}} for j in eachindex(steps)
{{?model!=spvar}}	println(rpad(steps[j], 8), rpad(round(irf.own[j], digits = 4), 12), rpad(round(irf.spillover[j], digits = 4), 14), rpad(round(irf.total[j], digits = 4), 12), round(cum.total[j], digits = 4))
{{?model!=spvar}} end
{{?model!=spvar}} println("\nAveraged over the areas shocked: Own area, the response of the area shocked; Other areas, the sum of the responses of all the others; Total, the two together")
{{?model!=spvar}} println(m.stationary ? "Added up, the Total tends to the long-run effect of the shock, $(round(cum.total[end], digits = 4)) after $(h) periods" : "The system is not stationary: the responses do not die out, and their sum does not settle")
{{?model=spvar}} stir = space_time_stir(m; horizon = h)  # Di Giacinto's outward responses, averaged over the areas shocked
{{?model=spvar}} stir_cum = space_time_stir(m; horizon = h, cumulative = true)
{{?model=spvar}} ring(l) = l == 0 ? "Own area" : "Ring $(l)"
{{?model=spvar}} for k in 1:K, r in 1:K  # the response of variable k to a shock to variable r
{{?model=spvar}}	display(EChart(ec_width = 640, ec_height = 300, title = [ECharts.Title(text = "Response of $(m.varnames[k]) to a shock to $(m.varnames[r])")],
{{?model=spvar}}		xAxis = [ECharts.Axis(_type = "category", name = "Periods after", data = string.(steps))], yAxis = [ECharts.Axis(_type = "value", name = "Response", scale = true)],
{{?model=spvar}}		series = [ECharts.XYSeries(name = ring(l), _type = "line", data = stir.outward[:, l + 1, k, r]) for l in stir.orders]))
{{?model=spvar}} end
{{?model=spvar}} println("Responses added up over ", h, " periods, at the area shocked and at each ring of its neighbours")
{{?model=spvar}} println(rpad("Response of", 14), rpad("Shock to", 14), join((rpad(ring(l), 12) for l in stir.orders)))
{{?model=spvar}} for k in 1:K, r in 1:K
{{?model=spvar}}	println(rpad(m.varnames[k], 14), rpad(m.varnames[r], 14), join((rpad(round(stir_cum.outward[end, l + 1, k, r], digits = 4), 12) for l in stir.orders)))
{{?model=spvar}} end
{{?model=spvar}} println("\nThe shock is to one variable's equation in one area; within its period it reaches the variables after it in the causal order, ", join(m.varnames, ", then "), ", but not those before it")
{{?model=spvar}} println("A ring's response is the average response of the areas that number of steps away from the area shocked, weighted by that ring's weights, which sum to 1")
'''

[[actionGroups.actions]]
id = "spatial-interaction"
label = "Spatial Interaction Test"
desc = "A test of whether the neighbours matter at all: on STAR and Panel AR, a Wald test that every coefficient of the neighbours' past values in STAR is zero, which leaves Panel AR; on Spatial VAR, Di Giacinto's likelihood ratio test against the panel VAR without spatial terms"
code = '''
{{?model!=spvar}} S_test = max(1, {{spatialLags}})  # on Panel AR, STAR with the Spatial Lags, at least 1, fitted to test against it
{{?model!=spvar}} m_sp = fit_star(yc[fitted], Xc[fitted, :], W, N, T_fit; spatial_lags = S_test, temporal_lags = L, spatial_weights = Symbol("{{spatialWeights}}"), varnames = xnames)
{{?model!=spvar}} spatial = [(l - 1) * (S_test + 1) + k + 1 for l in 1:L for k in 1:S_test]  # the positions of W^k y(t-l), k >= 1, in the coefficients: lag by lag, ring 0 to S in each
{{?model!=spvar}} R = zeros(length(spatial), length(m_sp.coef))
{{?model!=spvar}} for (row, j) in enumerate(spatial)
{{?model!=spvar}}	R[row, j] = 1.0
{{?model!=spvar}} end
{{?model!=spvar}} test = wald_test(m_sp, R, zeros(length(spatial)))  # every coefficient of the neighbours' past values zero
{{?model!=spvar}} println("STAR with ", S_test, " spatial lag(s) and ", L, " temporal lag(s): the coefficients of the neighbours' past values")
{{?model!=spvar}} for j in spatial
{{?model!=spvar}}	println("  ", rpad(m_sp.coefnames[j], 18), rpad(round(m_sp.coef[j], digits = 4), 12), "standard error ", round(sqrt(max(0.0, m_sp.vcov[j, j])), digits = 4))
{{?model!=spvar}} end
{{?model!=spvar}} println("\nWald test that all ", test.df, " are zero, which leaves Panel AR: statistic ", round(test.stat, digits = 3), ", p-value ", round(test.p_value, digits = 4))
{{?model!=spvar}} println(test.p_value < 0.05 ? "Rejected at 5%: the neighbours' past values help explain each area's value, beyond its own past" : "Not rejected at 5%: the neighbours' past values add nothing clear to the area's own past")
{{?model!=spvar}} println("With the standard errors of least squares, against a chi-squared distribution with ", test.df, " degrees of freedom")
{{?model=spvar}} m.s >= 1 || error("Spatial VAR with no spatial lag has no spatial interaction to test: set Spatial Lags to 1 or more")
{{?model=spvar}} test = lr_spatial_interaction(m, Y[fitted, :], W)  # the same data, refitted with no spatial terms: the panel VAR, each area on its own past and the same period's variables before it
{{?model=spvar}} println("Spatial VAR with ", test.s, " ring(s) of neighbours against the panel VAR without them")
{{?model=spvar}} println("  Log-likelihood: ", round(test.loglik_full, digits = 2), " with the neighbours, ", round(test.loglik_restricted, digits = 2), " without")
{{?model=spvar}} println("  Likelihood ratio statistic ", round(test.stat, digits = 3), " on ", test.df, " degrees of freedom, p-value ", round(test.p_value, digits = 4))
{{?model=spvar}} println(test.p_value < 0.05 ? "Rejected at 5%: the neighbours, in the same period or in the past, matter for some of the variables" : "Not rejected at 5%: the panel VAR, without the neighbours, is not clearly worse")
{{?model=spvar}} println("The chi-squared distribution of the statistic holds as the periods grow with the areas fixed")
println("A test of the fit on the periods fitted; Forecast Accuracy by Horizon shows what the neighbours add to the forecasts of the periods held back")
'''

