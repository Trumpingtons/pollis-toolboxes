# Spatio-Temporal Forecasting: forecasts of areas observed over many periods, from their own past and their neighbours',
# the space-time autoregression (STAR), the spatial VAR and a panel autoregression without space, with SpatialEconometrics.jl;
# the areas are read, the panel joined to them, and their neighbours found, through DuckDB and its spatial extension.

[meta]
title = "Spatio-Temporal Forecasting"
viewType = "pollis.stforecast"
defaultModel = "star"
decisionFirstColumn = "Model"

[[packages]]
name = "SpatialEconometrics.jl"
github = "https://github.com/randsley/SpatialEconometrics.jl"
fork = true

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/DuckDB.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

[requires]
packages = ["ECharts.jl"]

[[models]]
id = "star"
label = "STAR"

[[models]]
id = "spvar"
label = "Spatial VAR"

[[models]]
id = "panelar"
label = "Panel AR"

[[bullets]]
text = "STAR"
detail = "The space-time autoregression of Pfeifer and Deutsch: each area's value is forecast from its own past values and its neighbours', at chosen spatial and temporal lag orders, by least squares"

[[bullets]]
text = "Spatial VAR"
detail = "Di Giacinto's spatial vector autoregression: several variables forecast together, each from the past of all of them in the area and its neighbours, with a causal ordering of the variables within a period"

[[bullets]]
text = "Panel AR"
detail = "A panel autoregression without space: each area's value forecast from its own past only, the benchmark that shows what the neighbours add to the forecasts"

[[decisionRows]]
task = "STAR"
context = "One variable"
purpose = "Forecast one variable over the areas from its own past and its neighbours' past, with as many spatial and temporal lags as the data supports"

[[decisionRows]]
task = "Spatial VAR"
context = "Several variables"
purpose = "Forecast several interdependent variables together, and trace how a shock to one spreads to the others and to the neighbours"

[[decisionRows]]
task = "Panel AR"
context = "Benchmark"
purpose = "Measure what the neighbours add, by forecasting each area from its own past alone"

[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. Choose... picks another. A file given by an absolute path is read where it is."
default = "~/.pollis/data/examples"
folder = "data/examples"

[[inputs]]
id = "areasFile"
label = "Areas File"
tooltip = "The file of areas, as polygons, one per area: GeoPackage (its first layer), GeoJSON, Shapefile, FlatGeobuf or KML, in the folder above, or an absolute path. With the default, oxfordair.gpkg, the example first writes a grid of 100 square cells of 1 km around Oxford, and the panel file beside it, unless the folder has both already."
default = "oxfordair.gpkg"

[[inputs]]
id = "panelFile"
label = "Panel File"
tooltip = "The panel, one row per area and period: a CSV or Parquet file, in the folder above, or an absolute path. Areas without a value in some period, or without a polygon in the areas file, are left out, so that every area left has every period."
default = "oxfordair.csv"

[[inputs]]
id = "areaColumn"
label = "Area Column"
tooltip = "The column that names each area, in both files: the panel's rows are joined to the polygons by it."
default = "cell"
newRow = true

[[inputs]]
id = "periodColumn"
label = "Period Column"
tooltip = "The column of the panel file that names each period, a year, a month or a date: the periods are put in its order, and must be equally spaced."
default = "month"

[[inputs]]
id = "dependent"
label = "Variable to Forecast"
tooltip = "On STAR and Panel AR, the column of the panel file to forecast. With the example files, no2: the monthly mean concentration of nitrogen dioxide in the cell, in micrograms per cubic metre. On Spatial VAR, the variable that the maps and paths of the Next Steps show, if it is one of the Variables, otherwise the last of them."
default = "no2"

[[inputs]]
id = "explanatory"
label = "Explanatory Variables"
tooltip = "On STAR and Panel AR, numeric columns of the panel file that enter in the same period as the value forecast, separated by commas, or empty. Forecasting with them needs their values in the periods forecast, so the horizon cannot then pass the periods held back."
default = ""

[[inputs]]
id = "variables"
label = "Variables"
tooltip = "On Spatial VAR, the columns of the panel file forecast together, separated by commas, in causal order: within a period each variable can respond to those before it, not to those after it, which is the identifying assumption of the model. With the example files, traffic first, then no2."
default = "traffic, no2"

[[inputs]]
id = "fileCrs"
label = "File Coordinate System"
tooltip = "The coordinate system of the areas file's coordinates, as an EPSG code: the areas are moved from it into longitude and latitude on WGS 84 (EPSG:4326), for the maps and the distances between centroids. The example's cells are in EPSG:27700, OSGB36 / British National Grid. GeoJSON and KML are always EPSG:4326."
default = "EPSG:27700"
newRow = true

[[inputs]]
id = "neighbours"
label = "Neighbours"
tooltip = "Which areas are neighbours: Queen, those that share any point of their boundaries; Rook, those that share a stretch of boundary; k Nearest, the k areas with the nearest centroids. The weights of each area's neighbours sum to 1, and are the same in every period."
kind = "select"
default = "queen"

[[inputs.options]]
value = "queen"
label = "Queen Contiguity"

[[inputs.options]]
value = "rook"
label = "Rook Contiguity"

[[inputs.options]]
value = "knn"
label = "k Nearest"

[[inputs]]
id = "k"
label = "k"
tooltip = "The number of neighbours of every area with k Nearest."
default = "6"

[[inputs]]
id = "spatialLags"
label = "Spatial Lags"
tooltip = "On STAR and Spatial VAR, the spatial order S: the neighbours up to the S-th ring enter the model. 1, the immediate neighbours; 2, also their neighbours. Spatial VAR always takes the S-th ring as the areas exactly S steps away."
default = "1"
newRow = true

[[inputs]]
id = "temporalLags"
label = "Temporal Lags"
tooltip = "The temporal order L: the values of the last L periods enter the model, and the first L periods only supply lags."
default = "1"

[[inputs]]
id = "spatialWeights"
label = "Spatial Weights"
tooltip = "On STAR with two or more spatial lags, what the S-th ring is: Powers of W, the weights multiplied by themselves S times, the default of SpatialEconometrics.jl; Order-k Neighbours, the areas exactly k steps away, each ring's weights summing to 1, Pfeifer and Deutsch's own definition. The two are the same with one spatial lag."
kind = "select"
default = "powers"

[[inputs.options]]
value = "powers"
label = "Powers of W"

[[inputs.options]]
value = "orders"
label = "Order-k Neighbours"

[[inputs]]
id = "areaMeans"
label = "Area Means"
tooltip = "On STAR and Panel AR: Remove, each area's mean over the periods fitted is subtracted before the fit and added back to the forecasts, so that areas with different levels share the dynamics; Keep, the values are fitted as they are, with one intercept for all areas. Spatial VAR always removes them."
kind = "select"
default = "remove"

[[inputs.options]]
value = "remove"
label = "Remove"

[[inputs.options]]
value = "keep"
label = "Keep"

[[inputs]]
id = "heldBack"
label = "Periods Held Back"
tooltip = "The last periods of the panel, left out of the fit and forecast, so that the forecasts can be scored against what happened; 0 fits every period and forecasts beyond the data."
default = "12"
newRow = true

[[inputs]]
id = "horizon"
label = "Horizon"
tooltip = "The number of periods forecast after the last period fitted, each from the forecasts of the periods before it."
default = "12"

[[inputs]]
id = "mapStep"
label = "Step to Map"
tooltip = "For the Map of the Forecasts: the step ahead whose forecasts are mapped, from 1, the period after the last one fitted, to the Horizon."
default = "1"

[[inputs]]
id = "pathAreas"
label = "Areas to Show"
tooltip = "For the Forecast Paths: the areas whose paths are drawn, as values of the Area Column separated by commas; empty, three areas, those with the highest, the middle and the lowest mean over the periods fitted."
default = ""

[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables, SpatialEconometrics, SparseArrays, LinearAlgebra, Statistics, Random

con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the files stay where they are
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Spatial Econometrics Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files: Choose... picks another
areas_path = joinpath(folder, "{{areasFile}}")  # an absolute path is kept as it is
panel_path = joinpath(folder, "{{panelFile}}")
# Example files: 10 by 10 square cells of 1 km around Oxford, in EPSG:27700, observed monthly over 10 years, written unless the folder has both already. Replace them with your own files.
if basename(areas_path) == "oxfordair.gpkg" && basename(panel_path) == "oxfordair.csv" && !(isfile(areas_path) && isfile(panel_path))
	rng = Xoshiro(2026)  # a fixed seed: the same values every time
	u, v = repeat(-5:4, outer = 10), repeat(-5:4, inner = 10)  # km east and north of the centre, row by row from the south-west
	grid = [(c, d) for c in 1:100 for d in 1:100 if c != d && abs(u[c] - u[d]) <= 1 && abs(v[c] - v[d]) <= 1]  # queen neighbours on the grid
	Wgrid = row_standardize(sparse(first.(grid), last.(grid), 1.0, 100, 100))
	traffic_spread, no2_spread = lu(I - 0.3 .* Matrix(Wgrid)), lu(I - 0.2 .* Matrix(Wgrid))  # spillovers within the month
	traffic_level = 20 .+ 25 .* exp.(-(u .^ 2 .+ v .^ 2) ./ 10)  # thousand vehicles a day, busiest at the centre
	no2_level = 15 .+ 0.6 .* traffic_level  # micrograms per cubic metre
	dt, dn = zeros(100), zeros(100)  # the departures of traffic and NO2 from each cell's level
	open(panel_path, "w") do io
		println(io, "cell,month,traffic,no2")
		for t in -49:120  # 50 months to settle, not written, then January 2015 to December 2024
			# Traffic moves first: last month's own and neighbours' departures, and this month's neighbours'
			dt .= traffic_spread \ (0.5 .* dt .+ 0.15 .* (Wgrid * dt) .+ 2 .* randn(rng, 100))
			# NO2 follows: last month's own and neighbours' departures, this month's traffic, and this month's neighbours'
			dn .= no2_spread \ (0.45 .* dn .+ 0.2 .* (Wgrid * dn) .+ 0.4 .* dt .+ 1.5 .* randn(rng, 100))
			t >= 1 || continue
			month = string(2015 + (t - 1) ÷ 12, "-", lpad((t - 1) % 12 + 1, 2, '0'))
			for c in 1:100
				println(io, c, ",", month, ",", round(traffic_level[c] + dt[c], digits = 2), ",", round(no2_level[c] + dn[c], digits = 2))
			end
		end
	end
	cells = ["($(c), ST_MakeEnvelope($(451000 + 1000 * u[c]), $(206000 + 1000 * v[c]), $(452000 + 1000 * u[c]), $(207000 + 1000 * v[c])))" for c in 1:100]
	DBInterface.execute(con, "COPY (SELECT cell::INTEGER AS cell, geom FROM (VALUES $(join(cells, ", "))) t(cell, geom)) TO '$(areas_path)' (FORMAT GDAL, DRIVER 'GPKG', LAYER_NAME 'cells', SRS 'EPSG:27700')")
end
{{?model!=spvar}} yname = "{{dependent}}"
{{?model!=spvar}} xnames = filter(!isempty, String.(strip.(split("{{explanatory}}", ","))))  # the explanatory variables, separated by commas, or none
{{?model!=spvar}} needed = [yname; xnames]
{{?model=spvar}} vnames = String.(strip.(split("{{variables}}", ",")))  # the variables, in causal order
{{?model=spvar}} needed = vnames
present = join(("p.\"$c\" IS NOT NULL" for c in needed), " AND ")
# The polygons, in longitude and latitude, and the panel's rows that have a polygon and every value
DBInterface.execute(con, "CREATE OR REPLACE TABLE polygons AS SELECT \"{{areaColumn}}\" AS area, ST_Transform(geom, '{{fileCrs}}', 'EPSG:4326') AS geom FROM ST_Read('$(areas_path)')")
DBInterface.execute(con, """
	CREATE OR REPLACE TABLE obs AS
	WITH p AS (SELECT p.* FROM '$(panel_path)' p JOIN polygons g ON p."{{areaColumn}}" = g.area WHERE $(present)),
	complete AS (SELECT "{{areaColumn}}" AS area FROM p GROUP BY 1 HAVING count(DISTINCT "{{periodColumn}}") = (SELECT count(DISTINCT "{{periodColumn}}") FROM p))
	SELECT dense_rank() OVER (ORDER BY p."{{areaColumn}}") AS i, dense_rank() OVER (ORDER BY p."{{periodColumn}}") AS t, p.*
	FROM p JOIN complete c ON p."{{areaColumn}}" = c.area""")  # areas numbered i = 1, 2, ... and periods t = 1, 2, ..., only areas with every period
DBInterface.execute(con, "CREATE OR REPLACE TABLE areas AS SELECT o.i, o.area, g.geom FROM (SELECT DISTINCT i, \"{{areaColumn}}\" AS area FROM obs) o JOIN polygons g ON o.area = g.area")
column(c) = Float64.(Tables.columntable(DBInterface.execute(con, "SELECT \"$c\"::DOUBLE AS v FROM obs ORDER BY t, i")).v)  # period by period, the areas varying fastest, the order SpatialEconometrics.jl requires
counts = Tables.columntable(DBInterface.execute(con, "SELECT (SELECT max(i) FROM obs) AS n, (SELECT max(t) FROM obs) AS periods, (SELECT count(*) FROM polygons) AS polygons"))
N, T_per = Int(only(counts.n)), Int(only(counts.periods))
labels = String.(Tables.columntable(DBInterface.execute(con, "SELECT DISTINCT t, \"{{periodColumn}}\"::VARCHAR AS label FROM obs ORDER BY t")).label)  # the name of each period
println(N, " areas over ", T_per, " periods", only(counts.polygons) > N ? "; $(only(counts.polygons) - N) areas of the areas file left out, with missing values or periods" : "")

# The neighbours of each area, as pairs (i, j), found with SQL; the same in every period
neighbour_pairs = Dict(
	"queen" => "SELECT a.i, b.i AS j FROM areas a JOIN areas b ON a.i <> b.i AND ST_Intersects(a.geom, b.geom)",  # any shared point of the boundaries
	"rook" => "SELECT a.i, b.i AS j FROM areas a JOIN areas b ON a.i <> b.i AND ST_Intersects(a.geom, b.geom) WHERE ST_Dimension(ST_Intersection(a.geom, b.geom)) >= 1",  # a shared stretch of boundary
	"knn" => "WITH c AS (SELECT i, ST_Centroid(geom) AS p FROM areas) SELECT i, j FROM (SELECT a.i, b.i AS j, row_number() OVER (PARTITION BY a.i ORDER BY ST_Distance_Sphere(a.p, b.p), b.i) AS r FROM c a JOIN c b ON a.i <> b.i) WHERE r <= {{k}}")  # the nearest centroids, by great-circle distance
pairs = Tables.columntable(DBInterface.execute(con, neighbour_pairs["{{neighbours}}"]))
W = row_standardize(sparse(pairs.i, pairs.j, 1.0, N, N))  # the N x N weights of the areas, not of the stacked panel

# The periods fitted and the periods forecast
L, H, h = {{temporalLags}}, {{heldBack}}, {{horizon}}
T_fit = T_per - H  # the periods fitted; the H after them are held back to score the forecasts
T_fit > L + 1 || error("Too few periods left to fit: hold back fewer periods, or use fewer temporal lags")
{{?model!=spvar}} y = column(yname)
{{?model!=spvar}} X = isempty(xnames) ? zeros(N * T_per, 0) : reduce(hcat, column.(xnames))  # the explanatory variables, if any, with as many rows as y
{{?model!=spvar}} isempty(xnames) || h <= H || error("With explanatory variables the horizon cannot pass the periods held back, the only ones whose values are known")
{{?model!=spvar}} fitted = 1:(N * T_fit)  # the rows of the periods fitted
{{?model!=spvar}} # Each area's mean over the periods fitted, removed with Area Means set to Remove and added back to the forecasts
{{?model!=spvar}} area_mean(v) = "{{areaMeans}}" == "remove" ? vec(mean(reshape(v[fitted], N, T_fit), dims = 2)) : zeros(N)
{{?model!=spvar}} ybar = area_mean(y)
{{?model!=spvar}} yc = y .- repeat(ybar, T_per)
{{?model!=spvar}} Xc = isempty(xnames) ? X : reduce(hcat, [X[:, j] .- repeat(area_mean(X[:, j]), T_per) for j in axes(X, 2)])
{{?model=star}} # Least squares of each period on the last L periods of the area and of its neighbours up to the S-th ring, the explanatory variables and an intercept
{{?model=star}} m = fit_star(yc[fitted], Xc[fitted, :], W, N, T_fit; spatial_lags = {{spatialLags}}, temporal_lags = L, spatial_weights = Symbol("{{spatialWeights}}"), varnames = xnames)
{{?model=panelar}} # Least squares of each period on the last L periods of the area itself, the explanatory variables and an intercept: STAR with no spatial lag, so that the neighbours play no part
{{?model=panelar}} m = fit_star(yc[fitted], Xc[fitted, :], W, N, T_fit; spatial_lags = 0, temporal_lags = L, varnames = xnames)
{{?model=spvar}} K = length(vnames)
{{?model=spvar}} K >= 2 || error("Spatial VAR needs two or more variables, separated by commas")
{{?model=spvar}} Y = reduce(hcat, column.(vnames))  # one column per variable, in causal order, with N * T_per rows stacked as for STAR
{{?model=spvar}} fitted = 1:(N * T_fit)  # the rows of the periods fitted
{{?model=spvar}} # Maximum likelihood, one equation per variable: each variable on its neighbours' values in the same period, the variables before it in the area and its neighbours in the same period, and all the variables' last L periods in the area and its neighbours; each area's mean removed
{{?model=spvar}} m = fit_spvar(Y[fitted, :], W, N, T_fit; ordering = 1:K, p = L, s = {{spatialLags}}, varnames = vnames)

{{?model!=spvar}} se = sqrt.(max.(0.0, diag(m.vcov)))
{{?model!=spvar}} println(rpad("", 18), rpad("Estimate", 12), rpad("Std. Error", 12), "t")
{{?model!=spvar}} for k in eachindex(m.coef)  # y(t-l), the area's own value l periods before; on STAR, W^k y(t-l), its neighbours' up to the k-th ring; then the explanatory variables and the intercept
{{?model!=spvar}}	println(rpad(m.coefnames[k], 18), rpad(round(m.coef[k], digits = 4), 12), rpad(round(se[k], digits = 4), 12), round(m.coef[k] / se[k], digits = 2))
{{?model!=spvar}} end
{{?model!=spvar}} println("\nFitted on periods ", labels[L + 1], " to ", labels[T_fit], ", ", m.N * m.T_eff, " observations; the first ", L, " period(s) give the lags only")
{{?model!=spvar}} println("Area means: ", "{{areaMeans}}" == "remove" ? "removed before the fit and added back to the forecasts" : "kept, one intercept for all areas")
{{?model!=spvar}} println("Error variance: ", round(m.sigma2, digits = 5), "; log-likelihood: ", round(m.loglik, digits = 2))
{{?model=panelar}} println("No spatial lags: each area is forecast from its own past alone, the benchmark for STAR and Spatial VAR in the Next Steps")
{{?model=spvar}} for k in 1:K  # one equation per variable, in causal order
{{?model=spvar}}	coefs, se = [m.rho[k]; m.theta[k]], sqrt.(max.(0.0, diag(m.vcov_eq[k])))
{{?model=spvar}}	println("Equation of ", m.varnames[k])
{{?model=spvar}}	println(rpad("", 22), rpad("Estimate", 12), rpad("Std. Error", 12), "z")
{{?model=spvar}}	for j in eachindex(coefs)  # W^l·v, the neighbours' values in the l-th ring in the same period, rho first; then v(t-h), the values h periods before
{{?model=spvar}}		println(rpad(last(split(m.coefnames_eq[k][j], ": ", limit = 2)), 22), rpad(round(coefs[j], digits = 4), 12), rpad(round(se[j], digits = 4), 12), round(coefs[j] / se[j], digits = 2))
{{?model=spvar}}	end
{{?model=spvar}}	println("Mean error variance over the areas: ", round(mean(m.lambda[:, k]), digits = 5), "\n")
{{?model=spvar}} end
{{?model=spvar}} println("Causal ordering: ", join(m.varnames, ", then "), "; fitted on periods ", labels[L + 1], " to ", labels[T_fit], ", the first ", L, " period(s) giving the lags only")
{{?model=spvar}} println("Log-likelihood: ", round(m.loglik, digits = 2), m.converged ? "" : "; the search for the spatial coefficients did not converge")
{{?model=spvar}} println("Standard errors: from the numerical Hessian of each equation's likelihood, whose theory lets the periods grow with the areas fixed")
println("Spectral radius of the system: ", round(m.spectral_radius, digits = 4), m.stationary ? ", below 1: the forecasts settle back towards the means" : ", not below 1: the forecasts diverge with the horizon")

# Forecasts of the periods after the last one fitted, each from the forecasts of the periods before it
{{?model!=spvar}} history = yc[(N * (T_fit - L) + 1):(N * T_fit)]  # the last L periods fitted, oldest first
{{?model!=spvar}} X_future = isempty(xnames) ? zeros(N * h, 0) : Xc[(N * T_fit + 1):(N * (T_fit + h)), :]
{{?model!=spvar}} forecasts = spatial_forecast(m, X_future; h = h, y_history = history) .+ ybar  # N areas by h periods, the area means added back
{{?model!=spvar}} actual = reshape(y, N, T_per)
{{?model!=spvar}} println("\n", rpad("Step", 6), rpad("Period", 12), rpad("Mean forecast", 16), rpad("RMSE", 10), "MAE")
{{?model!=spvar}} for s in 1:h
{{?model!=spvar}}	period = T_fit + s
{{?model!=spvar}}	scored = period <= T_per  # a period held back, whose values are known
{{?model!=spvar}}	err = scored ? forecasts[:, s] .- actual[:, period] : Float64[]
{{?model!=spvar}}	println(rpad(s, 6), rpad(scored ? labels[period] : "+$(period - T_per)", 12), rpad(round(mean(forecasts[:, s]), digits = 3), 16),
{{?model!=spvar}}		rpad(scored ? round(sqrt(mean(err .^ 2)), digits = 3) : "", 10), scored ? round(mean(abs.(err)), digits = 3) : "")
{{?model!=spvar}} end
{{?model=spvar}} history = Y[(N * (T_fit - L) + 1):(N * T_fit), :]  # the last L periods fitted, oldest first, as they are
{{?model=spvar}} forecasts = spvar_forecast(m, h; y_history = history)  # N * h rows stacked as Y, one column per variable, the area means added back
{{?model=spvar}} println("\n", rpad("Step", 6), rpad("Period", 12), join((rpad("RMSE " * v, 16) for v in vnames)), join((rpad("MAE " * v, 16) for v in vnames)))
{{?model=spvar}} for s in 1:h
{{?model=spvar}}	period = T_fit + s
{{?model=spvar}}	scored = period <= T_per  # a period held back, whose values are known
{{?model=spvar}}	err = scored ? forecasts[((s - 1) * N + 1):(s * N), :] .- Y[((period - 1) * N + 1):(period * N), :] : zeros(0, K)
{{?model=spvar}}	println(rpad(s, 6), rpad(scored ? labels[period] : "+$(period - T_per)", 12),
{{?model=spvar}}		join((rpad(scored ? round(sqrt(mean(err[:, k] .^ 2)), digits = 3) : "", 16) for k in 1:K)), join((rpad(scored ? round(mean(abs.(err[:, k])), digits = 3) : "", 16) for k in 1:K)))
{{?model=spvar}} end
println("RMSE and MAE over the areas, against the values held back; the Next Steps compare them with the benchmarks")
{{?model!=spvar}} res = m.residuals  # periods L + 1 to T_fit, stacked as y
{{?model=spvar}} res = m.residuals  # periods L + 1 to T_fit, stacked as Y, one column per variable
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "map-forecasts"
label = "Map of the Forecasts"
desc = "The forecast of every area at the Step to Map, on a base map, and, when that period was held back, a second map of the forecast errors with the areas forecast worst: where the forecasts are high or low, and whether the errors cluster in space"
code = '''
s_map = {{mapStep}}
1 <= s_map <= h || error("Step to Map must be between 1 and the Horizon")
period = T_fit + s_map  # the period mapped
scored = period <= T_per  # a period held back, whose values are known
{{?model!=spvar}} shown = yname
{{?model!=spvar}} fc = forecasts[:, s_map]
{{?model!=spvar}} observed = scored ? actual[:, period] : fill(NaN, N)
{{?model=spvar}} kshow = something(findfirst(==("{{dependent}}"), vnames), K)  # the Variable to Forecast, if it is one of the Variables, otherwise the last
{{?model=spvar}} shown = vnames[kshow]
{{?model=spvar}} fc = forecasts[((s_map - 1) * N + 1):(s_map * N), kshow]
{{?model=spvar}} observed = scored ? Y[((period - 1) * N + 1):(period * N), kshow] : fill(NaN, N)
err = fc .- observed  # forecast minus observed: positive where the forecast was too high
cell(x) = isnan(x) ? "NULL" : string(x)
DBInterface.execute(con, "CREATE OR REPLACE TABLE mapped AS SELECT * FROM (VALUES $(join(("($i, $(fc[i]), $(cell(observed[i]))::DOUBLE, $(cell(err[i]))::DOUBLE)" for i in 1:N), ", "))) t(i, forecast, observed, error)")
when = scored ? labels[period] : "+$(period - T_per)"
fmap = joinpath(mktempdir(), "forecasts.geojson")
DBInterface.execute(con, "COPY (SELECT a.geom, a.area AS \"{{areaColumn}}\", round(v.forecast, 3) AS forecast, round(v.observed, 3) AS observed, round(v.error, 3) AS error FROM areas a JOIN mapped v USING (i)) TO '$(fmap)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(fmap; name = "Forecast of $(shown), $(when)", column = "forecast", opacity = 0.75)))  # clicking an area shows its forecast, and the observed value and error when known
scored && display(Pollis.webmap(Pollis.layer(fmap; name = "Forecast error, $(when)", column = "error", opacity = 0.75)))
println("Forecasts of ", shown, " for ", when, ", ", s_map, " step(s) after ", labels[T_fit], ", the last period fitted")
println("Across the areas: from ", round(minimum(fc), digits = 3), " to ", round(maximum(fc), digits = 3), ", mean ", round(mean(fc), digits = 3))
if scored
	area_names = Tables.columntable(DBInterface.execute(con, "SELECT area::VARCHAR AS area FROM areas ORDER BY i")).area
	println("Against the values observed: RMSE ", round(sqrt(mean(err .^ 2)), digits = 3), ", mean error ", round(mean(err), digits = 3), " (positive, forecasts too high on average)")
	println("Areas forecast worst:")
	for i in sortperm(abs.(err), rev = true)[1:min(5, N)]
		println("  ", rpad(area_names[i], 16), "forecast ", rpad(round(fc[i], digits = 3), 10), "observed ", rpad(round(observed[i], digits = 3), 10), "error ", round(err[i], digits = 3))
	end
else
	println("The period is after the end of the data, so there is nothing to score the forecasts against")
end
'''

[[actionGroups.actions]]
id = "forecast-paths"
label = "Forecast Paths"
desc = "For a few areas, the values observed over the last periods fitted and the held-back periods, with the forecasts from the last period fitted on: how far ahead the forecasts follow the values, and how they return towards each area's mean"
code = '''
using ECharts

{{?model!=spvar}} shown = yname
{{?model!=spvar}} Yshown = reshape(y, N, T_per)  # one row per area, one column per period
{{?model!=spvar}} Fshown = forecasts  # one row per area, one column per step
{{?model=spvar}} kshow = something(findfirst(==("{{dependent}}"), vnames), K)  # the Variable to Forecast, if it is one of the Variables, otherwise the last
{{?model=spvar}} shown = vnames[kshow]
{{?model=spvar}} Yshown = reshape(Y[:, kshow], N, T_per)  # one row per area, one column per period
{{?model=spvar}} Fshown = reshape(forecasts[:, kshow], N, h)  # one row per area, one column per step
area_names = String.(Tables.columntable(DBInterface.execute(con, "SELECT area::VARCHAR AS area FROM areas ORDER BY i")).area)
asked = filter(!isempty, String.(strip.(split("{{pathAreas}}", ","))))  # the Areas to Show, or none
if isempty(asked)
	order = sortperm(vec(mean(Yshown[:, 1:T_fit], dims = 2)))  # the areas by their mean over the periods fitted
	picked = unique([order[end], order[(N + 1) ÷ 2], order[1]])  # the highest, the middle and the lowest
else
	picked = [something(findfirst(==(a), area_names), 0) for a in asked]
	all(>(0), picked) || error("Not among the areas: ", join(asked[picked .== 0], ", "))
end
span = max(1, T_fit - 3 * h + 1):(T_fit + h)  # three horizons' worth of periods fitted, then the periods forecast
xlabels = [t <= T_per ? labels[t] : "+$(t - T_per)" for t in span]
println(rpad("Area", 16), rpad("Mean fitted", 14), rpad("Last fitted", 14), rpad("Forecast, step 1", 18), rpad("Forecast, step $(h)", 18), "RMSE")
for i in picked
	observed = [t <= T_per ? Yshown[i, t] : nothing for t in span]  # nothing leaves a gap after the end of the data
	path = [t == T_fit ? Yshown[i, t] : t > T_fit ? Fshown[i, t - T_fit] : nothing for t in span]  # from the last period fitted, so that the line joins the values observed
	display(EChart(ec_width = 700, ec_height = 320, title = [ECharts.Title(text = "$(shown) in $(area_names[i])")],
		xAxis = [ECharts.Axis(_type = "category", name = "{{periodColumn}}", data = xlabels)], yAxis = [ECharts.Axis(_type = "value", name = shown, scale = true)],
		series = [ECharts.XYSeries(name = "Observed", _type = "line", data = observed), ECharts.XYSeries(name = "Forecast", _type = "line", data = path)]))
	held = (T_fit + 1):min(T_fit + h, T_per)  # the periods forecast whose values are known
	rmse = isempty(held) ? "" : string(round(sqrt(mean((Fshown[i, held .- T_fit] .- Yshown[i, held]) .^ 2)), digits = 3))
	println(rpad(area_names[i], 16), rpad(round(mean(Yshown[i, 1:T_fit]), digits = 3), 14), rpad(round(Yshown[i, T_fit], digits = 3), 14),
		rpad(round(Fshown[i, 1], digits = 3), 18), rpad(round(Fshown[i, h], digits = 3), 18), rmse)
end
println("RMSE of each area over the periods forecast that were held back")
println(m.stationary ? "The system is stationary: further ahead, the forecasts move towards the mean the model implies, each area's own mean when the area means are removed, as the past matters less and less" : "The system is not stationary: the forecasts do not settle, and move further from the values the further ahead they go")
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "moran-residuals"
label = "Moran's I of the Residuals"
desc = "Moran's I of the residuals in each period fitted, on a line beside its expected value without spatial autocorrelation, with the share of periods where it is significant and a test for all of them together: whether the model leaves spatial dependence that its forecasts do not use"
code = '''
using ECharts

{{?model!=spvar}} resid_sets = [(yname, res)]  # the residuals, stacked period by period
{{?model=spvar}} resid_sets = [(m.varnames[k], res[:, k]) for k in 1:K]  # one equation's residuals per variable, in causal order
T_res = size(res, 1) ÷ N  # the periods with residuals: L + 1 to the last period fitted
results = [(name, panel_moran(r, W, N, T_res)) for (name, r) in resid_sets]  # Moran's I of each period's residuals, with its asymptotic test
display(EChart(ec_width = 760, ec_height = 360, title = [ECharts.Title(text = "Moran's I of the residuals, period by period")],
	xAxis = [ECharts.Axis(_type = "category", name = "{{periodColumn}}", data = labels[(T_fit - T_res + 1):T_fit])], yAxis = [ECharts.Axis(_type = "value", name = "Moran's I", scale = true)],
	series = [[ECharts.XYSeries(name = "Moran's I, $(name)", _type = "line", data = [r.I_stat for r in mp.period_results]) for (name, mp) in results];
		ECharts.XYSeries(name = "Expected without autocorrelation", _type = "line", data = [r.E_I for r in last(results[1]).period_results])]))
println(rpad("Residuals of", 16), rpad("Mean I", 10), rpad("Periods p < 0.05", 20), rpad("Combined z", 14), "p-value")
for (name, mp) in results
	significant = count(r -> r.p_value < 0.05, mp.period_results)
	println(rpad(name, 16), rpad(round(mp.pooled.I_stat, digits = 4), 10), rpad("$(significant) of $(T_res)", 20), rpad(round(mp.pooled.z_stat, digits = 2), 14), round(mp.pooled.p_value, digits = 4))
end
println("Expected value of Moran's I without spatial autocorrelation: ", round(results[1][2].period_results[1].E_I, digits = 4), "; about 5% of the periods are significant at 5% by chance alone")
println("The combined test treats the periods as independent, which the residuals of one fit are not, as they share its coefficients: the documentation of panel_moran finds it mildly liberal")
{{?model=star}} println("Every term of STAR is dated before the period it explains, so dependence between neighbours within a period stays in the residuals")
{{?model=panelar}} println("Panel AR leaves the neighbours out, so dependence on their past values or on their values in the same period stays in the residuals")
{{?model=spvar}} println("Spatial VAR has each variable's neighbours in the same period and the variables before it, so what is left is dependence these terms do not capture")
'''

[[actionGroups.actions]]
id = "stationarity"
label = "Stationarity"
desc = "The roots of the fitted system, drawn against the unit circle, with the spectral radius, the largest of their sizes, and how long a shock takes to halve: whether the forecasts settle back towards the means or diverge, and how slowly"
code = '''
using ECharts

# The matrices that carry the values of the last L periods into this period's forecast
{{?model!=spvar}} A = [sum(m.phi[k + 1, l] .* Matrix(m.Wk[k + 1]) for k in 0:m.spatial_lags) for l in 1:m.temporal_lags]  # for lag l, the area's own value and, on STAR, its neighbours' rings, each with its coefficient
{{?model=spvar}} A = [m.C0 \ C for C in m.C]  # for each lag, with the same-period terms solved out: the variables in causal order, one block of N areas after another
n, P = size(A[1], 1), length(A)
companion = zeros(n * P, n * P)  # the system written with one lag, the earlier periods carried along
companion[1:n, :] = reduce(hcat, A)
for l in 2:P
	companion[((l - 1) * n + 1):(l * n), ((l - 2) * n + 1):((l - 1) * n)] = Matrix(1.0I, n, n)
end
roots = eigvals(companion)
sizes = sort(abs.(roots), rev = true)
radius = sizes[1]  # the spectral radius, as the model reports it
edge = radius < 1 ? 1 : ceil(Int, radius)
display(EChart(ec_width = 520, ec_height = 520, title = [ECharts.Title(text = "Roots of the system and the unit circle")],
	xAxis = [ECharts.Axis(_type = "value", name = "Real", min = -edge, max = edge)], yAxis = [ECharts.Axis(_type = "value", name = "Imaginary", min = -edge, max = edge)],
	series = [ECharts.XYSeries(name = "Unit circle", _type = "line", showSymbol = false, data = [[cos(a), sin(a)] for a in range(0, 2 * pi, length = 181)]),
		ECharts.XYSeries(name = "Roots", _type = "scatter", data = [[real(z), imag(z)] for z in roots])]))
println(length(roots), " roots: ", n, " per lag", P > 1 ? ", for $(P) lags" : "")
println("Spectral radius: ", round(radius, digits = 4), " (", round(m.spectral_radius, digits = 4), " as the model reports it)")
println("Largest sizes: ", join(round.(sizes[1:min(5, end)], digits = 4), ", "), "; ", count(>(0.95), sizes), " root(s) above 0.95")
if radius < 1
	println("Stationary: every root is inside the unit circle, so the forecasts settle back towards the means")
	println("In the long run a shock shrinks by a factor of about ", round(radius, digits = 4), " a period, and halves in about ", round(log(0.5) / log(radius), digits = 1), " periods")
else
	println("Not stationary: a root on or outside the unit circle, so the forecasts do not settle, and the further ahead, the further they move away")
	println("A value that trends or wanders may need differencing before the fit, or a model of its trend")
end
'''

[[actionGroups.actions]]
id = "pesaran-cd"
label = "Pesaran's CD Test"
desc = "Pesaran's CD test of the residuals' correlation across all pairs of areas, with the exponent of cross-sectional dependence: whether a common factor moves every area together, which neither the neighbours nor the lags capture"
code = '''
{{?model!=spvar}} resid_sets = [(yname, res)]  # the residuals, stacked period by period
{{?model=spvar}} resid_sets = [(m.varnames[k], res[:, k]) for k in 1:K]  # one equation's residuals per variable, in causal order
T_res = size(res, 1) ÷ N  # the periods with residuals: L + 1 to the last period fitted
reading = Dict(
	:unidentified => "weak: the dependence is too weak for its exponent to be told from noise, which the neighbours and the lags can carry",
	:semi_weak => "semi-weak: a common factor reaches many of the areas but not all, beyond what the neighbours and the lags carry",
	:strong => "strong: a common factor moves nearly every area together, which no weight matrix absorbs")
for (name, r) in resid_sets
	v = dependence_verdict(r, N, T_res)  # Pesaran's CD test and the exponent alpha of cross-sectional dependence, with their thresholds
	println("Residuals of ", name, ", ", N, " areas over ", T_res, " periods")
	println("  CD statistic ", round(v.cd.stat, digits = 3), ", p-value ", round(v.cd.p_value, digits = 4), v.cd.p_value < 0.05 ? ": the dependence is stronger than the test's null of weak dependence" : ": consistent with weak dependence, which is not the same as independence")
	println("  Mean correlation between pairs of areas ", round(v.cd.rho_bar, digits = 4), "; mean absolute correlation ", round(v.cd.abs_rho_bar, digits = 4), ", against ", round(v.cd.abs_rho_bar_null, digits = 4), " for independent areas")
	println("  Exponent alpha: ", v.alpha === nothing ? "not identified, at or below 1/2" : "$(round(v.alpha.alpha, digits = 3)), 95% interval $(round(v.alpha.ci[1], digits = 3)) to $(round(v.alpha.ci[2], digits = 3))$(v.alpha.inference_valid ? "" : ", indicative only between 1/2 and 4/7")")
	println("  Dependence: ", reading[v.kind])
	v.cd.abs_rho_bar > 2 * v.cd.abs_rho_bar_null && abs(v.cd.rho_bar) < 0.05 && println("  The correlations are large but of both signs and cancel in the CD statistic: read the mean absolute correlation, not the statistic")
end
println("\nAlpha runs up to 1, a factor common to all areas; at or below 1/2 the dependence is weak, and SpatialEconometrics.jl calls it strong above 0.9")
println("A strong common factor in the residuals, such as a shock to every area in the same period, is not forecast by the neighbours or the lags of these models")
'''

