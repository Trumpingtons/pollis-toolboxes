[[faq]]
question = "Which tab of the Spatio-Temporal Forecasting panel should I start with?"
answer = '''
STAR for one variable whose value in each area follows its own past and its neighbours' past: it allows any number of spatial and temporal lags and is estimated by least squares. Spatial VAR for several variables that move together, each possibly responding to the others within a period, with the neighbours' values in the same period and a causal ordering of the variables. Panel AR is the benchmark: each area's own past only, fitted and scored on the same periods, to see what the neighbours add.
'''
wiki = "Decision Guide"

[[faq]]
question = "What does the causal ordering of the Spatial VAR do?"
answer = '''
The Variables are listed in causal order: within a period, each variable can respond to those before it, not to those after it. The documentation of fit_spvar states that the identification of the model's contemporaneous matrix rests entirely on this ordering, that the data does not settle it, and that reversing it changes the impulse responses, which is why the ordering has no default. The matrix is block triangular across the variables, so within each variable the areas still interact both ways.
'''
wiki = "Decision Guide"

[[faq]]
question = "How are the forecasts of the panel scored?"
answer = '''
Against the values of the Periods Held Back, left out of the fit: each tab prints the root mean squared error and the mean absolute error over the areas at each step ahead. The Forecast Accuracy by Horizon step scores STAR, Spatial VAR and Panel AR on the same variable, areas and periods, and divides each RMSE by that of each area's last value carried forward. Hyndman and Koehler (2006) find many earlier accuracy measures inadequate and propose the mean absolute scaled error for comparing accuracy across multiple series.
'''
wiki = "Forecasting in Space and Time"

[[faq]]
question = "Why do the forecasts grow without settling?"
answer = '''
Because the fitted system is not stationary. SpatialEconometrics.jl reports the spectral radius of the companion matrix, which must be below one, the form of Pfeifer and Deutsch's condition that every root lies inside the unit circle. When it is not, spatial_forecast and spvar_forecast warn and return diverging forecasts rather than failing, the documentation calling the divergence the honest answer for those parameters. The Stationarity step draws the roots against the unit circle.
'''
wiki = "Forecasting in Space and Time"

[[faq]]
question = "Should I remove the area means on STAR and Panel AR?"
answer = '''
fit_star has one intercept for all the areas. With Area Means set to Remove, the STAR and Panel AR tabs subtract each area's mean over the periods fitted before the fit and add it back to the forecasts, so that areas at different levels share the dynamics; with Keep, the values are fitted as they are. fit_spvar always removes the means, which its documentation states is the same as estimating an intercept for each area and carries a bias of order one over the number of periods.
'''
wiki = "Decision Guide"
hidden = true

[[faq]]
question = "Should the rings of STAR be powers of W or order-k neighbours?"
answer = '''
Pfeifer and Deutsch (1980) define the k-th ring as the neighbours of order k, the areas exactly k steps away. fit_star takes powers of the weights by default and the order-k neighbours on request. The two coincide with one spatial lag and differ from the second: the k-th power counts the paths of k steps between two areas, places weight on the area itself and keeps first-order neighbours wherever the map has triangles. The Powers Against Orders of W step fits STAR both ways.
'''
wiki = "Decision Guide"
hidden = true

[[faq]]
question = "Why is STAR estimated by least squares?"
answer = '''
Every regressor of STAR is dated before the period it explains, so none is correlated with that period's error and least squares is consistent without the Jacobian a contemporaneous spatial lag requires. The documentation of fit_star gives this as the reason any lag orders are affordable. The price is that STAR has no spatial feedback within a period.
'''
wiki = "STAR"
hidden = true

[[faq]]
question = "Can I forecast with explanatory variables?"
answer = '''
On STAR and Panel AR, explanatory variables enter in the same period as the value they explain, so spatial_forecast needs their values in every period forecast. Within the periods held back those values are known, and the Horizon cannot then pass the periods held back; after the end of the data they are not known, and Forecast Beyond the Data forecasts only without explanatory variables. fit_spvar takes no explanatory variables: its variables explain one another.
'''
wiki = "Forecasting in Space and Time"
hidden = true

[[faq]]
question = "Why does the Spatial VAR need many periods?"
answer = '''
The documentation of fit_spvar states that its inference holds as the number of periods grows with the number of areas fixed, the asymptotics of structural VAR models, whereas the package's other panel estimators are consistent as the number of areas grows; it calls bringing a wide, short panel to fit_spvar a mistake. Removing each area's means also carries a bias of order one over the number of periods.
'''
wiki = "Spatial VAR"
hidden = true

[[faq]]
question = "What does a rejection of Pesaran's CD test on the residuals of Panel AR mean?"
answer = '''
That the residuals are correlated across the areas more strongly than the test's null of weak dependence, which Pesaran (2015) argues is more appropriate than independence in panels of many units. The documentation of pesaran_cd notes that a rejection does not by itself say the dependence comes from a common factor; the exponent of cross-sectional dependence, reported beside the test, tells them apart, the strong case being a factor that touches nearly every area and that no weight matrix absorbs.
'''
wiki = "Panel AR"
hidden = true
