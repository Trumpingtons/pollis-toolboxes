# Regionalisation and Spatial Regimes: contiguous regions found by SKATER, and regressions with one set of coefficients
# per regime, by least squares or with a spatial lag shared by the regimes, with SpatialEconometrics.jl; the areas are
# read, and their neighbours found, through DuckDB's spatial extension. Replication of PySAL's spreg on Baltimore houses.

