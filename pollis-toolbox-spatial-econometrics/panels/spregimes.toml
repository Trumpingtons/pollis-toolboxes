[[actionGroups.actions]]
id = "ols-vs-lag"
label = "OLS Against Spatial Lag Regimes"
desc = "The same regimes by least squares and with a spatial lag: the coefficients with their standard errors, and the likelihood ratio test of rho = 0"
models = ["regols", "reglag"]
code = '''
using Distributions

fo = fit_spatial_regime(W, X, y, ExogenousRegimes(labels); spatial_lag = false, varnames = xnames)
fl = fit_spatial_regime(W, X, y, ExogenousRegimes(labels); spatial_lag = true, varnames = xnames)
so, sl = sqrt.(diag(fo.vcov)), sqrt.(diag(fl.vcov))
println(rpad("", 22), rpad("OLS", 24), "spatial lag")
for j in eachindex(fo.coef)
	println(rpad(fo.coefnames[j], 22), rpad("$(round(fo.coef[j], digits = 4)) ($(round(so[j], digits = 4)))", 24), "$(round(fl.coef[j], digits = 4)) ($(round(sl[j], digits = 4)))")
end
println(rpad("rho", 22), rpad("", 24), "$(round(fl.rho, digits = 4)) ($(round(sl[end], digits = 4)))")
lr = 2 * (fl.loglik - fo.loglik)
println("Likelihood ratio test of rho = 0: ", round(lr, digits = 3), ", p-value ", round(ccdf(Chisq(1), lr), sigdigits = 4))
println("Standard errors in parentheses. With a spatial lag, a slope is the first round of the effect, before it travels through the neighbours")
'''

[[actionGroups.actions]]
id = "column-vs-skater"
label = "Given Regimes Against SKATER"
desc = "The regimes of Regime Column beside as many SKATER regions: the areas they share, the Rand index, and the log-likelihood of the OLS regimes each gives"
code = '''
rawc = String.(Tables.columntable(DBInterface.execute(con, "SELECT \"{{regimeColumn}}\"::VARCHAR AS v FROM areas ORDER BY i")).v)
lev = sort(unique(rawc))
given = [findfirst(==(r), lev) for r in rawc]
found = skater_regimes(Wsym, reduce(hcat, column.(zvars)), length(lev); min_size = {{minSize}}).labels
println("Areas by {{regimeColumn}} (rows) and by SKATER's regions on ", join(zvars, ", "), " (columns)")
println(rpad("", 24), join((rpad("Region $r", 12) for r in 1:maximum(found))))
for g in eachindex(lev)
	println(rpad("{{regimeColumn}} = $(lev[g])", 24), join((rpad(count((given .== g) .& (found .== r)), 12) for r in 1:maximum(found))))
end
together = count((given[a] == given[b]) == (found[a] == found[b]) for a in 1:n for b in a + 1:n)
println("Rand index, the share of pairs of areas both put together or both put apart: ", round(together / (n * (n - 1) / 2), digits = 3))
for (name, lab) in ("{{regimeColumn}}" => given, "SKATER" => found)
	f = fit_spatial_regime(W, X, y, ExogenousRegimes(lab); spatial_lag = false)
	println("OLS regimes from ", name, ": log-likelihood ", round(f.loglik, digits = 3))
end
'''

[[actionGroups.actions]]
id = "regimes-vs-gwr"
label = "Regimes Against GWR"
desc = "The single model, the OLS regimes and geographically weighted regression by AICc, and the mean of GWR's local coefficients in each regime beside the regime's own"
models = ["regols", "reglag"]
code = '''
coords = hcat(column("cx"), column("cy"))  # the centroids, in the file's coordinate system: metres in a projected one
g = fit_gwr(X, y, coords; kernel = BisquareKernel(), varnames = xnames)  # one adaptive bandwidth, chosen by AICc
aicc(rss, trs) = n * log(rss / n) + n * (n + trs) / (n - 2 - trs)  # the AICc of SpatialEconometrics.jl's GWR, with trs coefficients
fo = fit_spatial_regime(W, X, y, ExogenousRegimes(labels); spatial_lag = false, varnames = xnames)
fp = fit_spatial_regime(W, X, y, ExogenousRegimes(ones(Int, n)); spatial_lag = false, varnames = xnames)
println(rpad("model", 30), rpad("coefficients", 14), "AICc")
println(rpad("one model, OLS", 30), rpad(p + 1, 14), round(aicc(sum(abs2, fp.residuals), p + 1), digits = 2))
println(rpad("regimes, OLS", 30), rpad(length(fo.coef), 14), round(aicc(sum(abs2, fo.residuals), length(fo.coef)), digits = 2))
println(rpad("GWR, $(round(Int, g.bandwidth)) nearest areas", 30), rpad(round(g.hat_trace, digits = 1), 14), round(g.AICc, digits = 2))
P = p + 1
println("\nMean of GWR's local coefficients / the regime's coefficient")
println(rpad("", 16), join((rpad(regime_names[r], 26) for r in 1:R)))
for k in 1:P
	println(rpad(g.coefnames[k], 16), join((rpad("$(round(mean(g.coef_local[labels .== r, k]), digits = 4)) / $(round(fo.coef[(r - 1) * P + k], digits = 4))", 26) for r in 1:R)))
end
println("The smallest AICc fits best for its effective number of coefficients. The regimes are fitted by OLS here, as GWR has no spatial lag")
'''

