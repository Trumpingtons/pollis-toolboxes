[[actionGroups.actions]]
id = "bootstrap-chow"
label = "Bootstrap Chow Test"
desc = "The Chow test of SKATER's regions against 199 data sets with no regimes, on each of which SKATER searches for the regions again: a p-value that allows for the regions having been found from the data"
models = ["skater", "regols"]
code = '''
Zcols = Dict(v => column(v) for v in zvars)
Xi = hcat(ones(n), X)
b0 = Xi \ y
e0 = y - Xi * b0  # the single model's fit and residuals
function search_and_test(yy)
	Zb = reduce(hcat, [v == yname ? yy : Zcols[v] for v in zvars])  # the outcome, when SKATER uses it, is the one tested
	lab = skater_regimes(Wsym, Zb, {{regions}}; min_size = {{minSize}}).labels
	one_model = fit_spatial_regime(W, X, yy, ExogenousRegimes(ones(Int, n)); spatial_lag = false)
	return regime_chow_test(one_model, fit_spatial_regime(W, X, yy, ExogenousRegimes(lab); spatial_lag = false)).stat
end
observed = search_and_test(y)
rng = Xoshiro(2026)  # a fixed seed: the same data sets every time
sims = filter(isfinite, [try search_and_test(Xi * b0 .+ e0[rand(rng, 1:n, n)]) catch; NaN end for _ in 1:199])  # no regimes: the single model's fit plus resampled residuals
println("Chow likelihood ratio statistic of SKATER's regions on ", join(zvars, ", "), ": ", round(observed, digits = 3))
println("Bootstrap p-value, from ", length(sims), " data sets with no regimes: ", round((1 + count(>=(observed), sims)) / (1 + length(sims)), digits = 3))
if !(yname in zvars)
	println("SKATER does not use $(yname) here, so the regions do not depend on the outcome and the chi-squared p-value of the tab holds")
end
{{?model=regols}} if source == "column"
{{?model=regols}} 	println("The tab's regimes come from {{regimeColumn}}: this step tests SKATER's regions instead")
{{?model=regols}} end
'''

