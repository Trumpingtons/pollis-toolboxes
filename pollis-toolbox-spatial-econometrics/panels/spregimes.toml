[[actionGroups.actions]]
id = "replicate-baltimore"
label = "Baltimore Houses: spreg"
desc = "The sale prices of 211 houses in Baltimore (Dubin, 1992), with the city and the county as regimes, from PySAL's libpysal: the regime spatial lag model beside the values spreg's documentation prints for ML_Lag_Regimes, with queen contiguity"
code = '''
using Downloads

let
	dir = mktempdir()
	base = "https://raw.githubusercontent.com/pysal/libpysal/main/libpysal/examples/baltim/"  # libpysal, BSD-3-Clause
	for f in ("baltim.shp", "baltim.shx", "baltim.dbf", "baltim_q.gal")
		Downloads.download(base * f, joinpath(dir, f))
	end
	rcon = DBInterface.connect(DuckDB.DB)
	DBInterface.execute(rcon, "LOAD spatial")
	DBInterface.execute(rcon, "CREATE TABLE houses AS SELECT * FROM ST_Read('$(joinpath(dir, "baltim.shp"))')")
	cols(c) = Float64.(Tables.columntable(DBInterface.execute(rcon, "SELECT \"$c\"::DOUBLE AS v FROM houses ORDER BY STATION")).v)
	Wb, _ = read_gal(joinpath(dir, "baltim_q.gal"); ids = string.(Int.(cols("STATION"))))  # queen contiguity, row-standardised, in the order of STATION
	yb = cols("PRICE")
	Xb = hcat(cols("NROOM"), cols("AGE"), cols("SQFT"))
	regimes = ExogenousRegimes(Int.(cols("CITCOU")) .+ 1)  # CITCOU 0 is regime 1 and CITCOU 1 regime 2, in spreg's order
	nb = length(yb)
	function report(title, rows)
		println("\n", title)
		println(rpad("", 26), rpad("Julia", 14), rpad("spreg", 14), "difference")
		for (what, julia, published) in rows
			println(rpad(what, 26), rpad(round(julia, digits = 6), 14), rpad(published, 14), round(julia - published, sigdigits = 2))
		end
	end
	lag = fit_spatial_regime(Wb, Xb, yb, regimes; spatial_lag = true, varnames = ["NROOM", "AGE", "SQFT"])
	names = ["0_CONSTANT", "0_NROOM", "0_AGE", "0_SQFT", "1_CONSTANT", "1_NROOM", "1_AGE", "1_SQFT"]
	k = length(lag.coef)  # the eight coefficients and rho, as spreg counts them
	report("Regime spatial lag model (ML_Lag_Regimes, method full)", [[("mean PRICE", sum(yb) / nb, 44.30718)];
		[(names[j], lag.coef[j], v) for (j, v) in enumerate([-15.0059, 4.496, -0.0318, 0.35, -4.5404, 3.9219, -0.1702, 0.8194])];
		[("rho", lag.rho, 0.538503)];
		[("variance " * names[j], lag.vcov[j, j], v) for (j, v) in enumerate([47.42, 2.3953, 0.0051, 0.0648, 69.6765, 3.2066, 0.0116, 0.0486])];
		[("variance rho", lag.vcov[k, k], 0.004), ("sigma squared", lag.sigma2, 200.044334), ("log-likelihood", lag.loglik, -864.985056),
		("AIC", -2 * lag.loglik + 2 * k, 1747.970112), ("Schwarz", -2 * lag.loglik + k * log(nb), 1778.136835)]])
	ols = fit_spatial_regime(Wb, Xb, yb, regimes; spatial_lag = false, varnames = ["NROOM", "AGE", "SQFT"])
	one_model = fit_spatial_regime(Wb, Xb, yb, ExogenousRegimes(ones(Int, nb)); spatial_lag = false, varnames = ["NROOM", "AGE", "SQFT"])
	println("\nWithout published values to compare: the OLS regimes and the Chow test of the city and the county")
	println(ols)
	println(regime_chow_test(one_model, ols))
end
'''

