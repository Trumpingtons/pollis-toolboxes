[[faq]]
question = "What is the difference between regionalisation and clustering?"
answer = '''
Clustering groups areas that are alike, wherever they lie, so one cluster can be scattered over the map. Regionalisation groups areas that are alike and also touch: every region is one connected piece of the map. SKATER, on the SKATER Regions tab, builds such regions by cutting a tree that joins neighbouring areas, choosing each cut to make the regions as alike inside as it can.
'''
wiki = "Regionalisation"

[[faq]]
question = "When should I use spatial regimes rather than geographically weighted regression?"
answer = '''
Spatial regimes give one set of coefficients to each of a few regions, which suits a map divided by known boundaries: a city and its suburbs, regions with different laws, the two sides of a border. Geographically weighted regression lets the coefficients change smoothly from area to area. When the change is abrupt at a boundary, regimes describe it with far fewer coefficients; when it is gradual, GWR does. Regimes Against GWR compares both on the same data.
'''
wiki = "Decision Guide"

[[faq]]
question = "Why is the Chow test too optimistic when SKATER chose the regions?"
answer = '''
The Chow test assumes the regimes were fixed before looking at the data. When SKATER builds the regions from the same variables the regression explains, it places the boundaries where the data differ most, so the test finds differences more often than its p-value says. The Bootstrap Chow Test repeats the search for regions on many data sets with no regimes, and compares the observed statistic with those.
'''
wiki = "Testing Regimes"

[[faq]]
question = "How do I know the panel gives the same results as PySAL's spreg?"
answer = '''
The Replicate group of the Next Steps downloads the Baltimore house prices of Dubin (1992) from PySAL's libpysal, fits the regime spatial lag model with the city and the county as regimes, and prints each estimate beside the value spreg's documentation prints for ML_Lag_Regimes, with the difference.
'''
wiki = "Replications"

[[faq]]
question = "Why does SKATER give fewer regions than I asked for?"
answer = '''
SKATER makes each cut only if both regions it leaves have at least the Minimum Region Size. When no cut of any region meets that, it stops, and the tab says so. Lower Minimum Region Size, or ask for fewer regions.
'''
wiki = "SKATER Regions"
hidden = true

[[faq]]
question = "Why does the spatial lag regime model have a single rho?"
answer = '''
SpatialEconometrics.jl lets the intercept and the slopes differ between the regimes and keeps one spatial lag coefficient, rho, for the whole map: the outcomes of neighbours in two regimes still affect each other across the boundary. This is the default of spreg's ML_Lag_Regimes as well.
'''
wiki = "Regimes, Spatial Lag"
hidden = true

[[faq]]
question = "What does Minimum Region Size do?"
answer = '''
It is the fewest areas a region may have. SKATER skips a cut that would leave a smaller region. A regime regression needs more areas in each region than it has coefficients, so raise Minimum Region Size when the regions feed the Regimes, OLS or Regimes, Spatial Lag tab.
'''
wiki = "SKATER Regions"
hidden = true

[[faq]]
question = "Why does a regime model stop with an error about the rank of the design?"
answer = '''
Each regime has its own intercept and slopes, so an explanatory variable that does not vary inside one regime cannot be told apart from that regime's intercept. SpatialEconometrics.jl stops and names the column. Merge the regime with another, drop the variable, or build regions with more areas.
'''
wiki = "Regimes, OLS"
hidden = true

