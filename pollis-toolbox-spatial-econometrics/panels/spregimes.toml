[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. Choose... picks another. A file given by an absolute path is read where it is. Save the Results as GeoParquet writes there."
default = "~/.pollis/data/examples"
folder = "data/examples"

[[inputs]]
id = "file"
label = "File"
tooltip = "The file of areas, as polygons: GeoPackage (its first layer), GeoJSON, Shapefile, FlatGeobuf or KML, in the folder above, or an absolute path. With the default, bolognaregimes.gpkg, the example first writes a grid of 225 square cells of 1 km around Bologna with a simulated rent (euros per square metre a month), income (thousand euros a year per taxpayer), age of the buildings (years) and zone (1, the 37 central cells, 2, the rest), unless the folder has a bolognaregimes.gpkg already."
default = "bolognaregimes.gpkg"

[[inputs]]
id = "dependent"
label = "Dependent Variable"
tooltip = "The numeric column explained by the regime models. Areas without a value in it, in an explanatory variable or in the columns that set the regimes are left out."
default = "rent"

[[inputs]]
id = "explanatory"
label = "Explanatory Variables"
tooltip = "The numeric columns that explain it, separated by commas. Every regime gets its own intercept and its own slope on each of them."
default = "income, age"

[[inputs]]
id = "fileCrs"
label = "File Coordinate System"
tooltip = "The coordinate system of the file's coordinates, as an EPSG code: the areas are moved from it into longitude and latitude on WGS 84 (EPSG:4326) for the maps. Regimes Against GWR measures distances between centroids in it, so a projected system in metres suits it. The example's cells are in EPSG:32632, WGS 84 / UTM zone 32N. GeoJSON and KML are always EPSG:4326."
default = "EPSG:32632"
newRow = true

[[inputs]]
id = "neighbours"
label = "Neighbours"
tooltip = "Which areas are neighbours: Queen, those that share any point of their boundaries; Rook, those that share a stretch of boundary; k Nearest, the k areas with the nearest centroids. SKATER joins neighbours into its tree, and the spatial lag averages over them, with weights summing to 1."
kind = "select"
default = "queen"

[[inputs.options]]
value = "queen"
label = "Queen Contiguity"

[[inputs.options]]
value = "rook"
label = "Rook Contiguity"

[[inputs.options]]
value = "knn"
label = "k Nearest"

[[inputs]]
id = "k"
label = "k"
tooltip = "The number of neighbours of every area with k Nearest."
default = "6"

[[inputs]]
id = "regimesFrom"
label = "Regimes From"
tooltip = "On the Regimes, OLS and Regimes, Spatial Lag tabs: Column, the regimes are the values of Regime Column, fixed before looking at the outcome; SKATER, the regions SKATER builds from SKATER Variables, as on the SKATER Regions tab."
kind = "select"
default = "column"
newRow = true

[[inputs.options]]
value = "column"
label = "Column"

[[inputs.options]]
value = "skater"
label = "SKATER"

[[inputs]]
id = "regimeColumn"
label = "Regime Column"
tooltip = "The column whose values name the regimes, numbers or text: one regime per distinct value, numbered in their sorted order. Also Given Regimes Against SKATER compares it with SKATER's regions."
default = "zone"

[[inputs]]
id = "skaterVariables"
label = "SKATER Variables"
tooltip = "The numeric columns SKATER makes each region alike in, separated by commas, each standardised first. When they include the dependent variable, the Chow test of regimes built from them is too optimistic: see the Bootstrap Chow Test."
default = "rent, income, age"
newRow = true

[[inputs]]
id = "regions"
label = "Number of Regions"
tooltip = "How many regions SKATER builds: it cuts its tree one edge fewer times than this. Fewer come out when no cut leaves regions of at least Minimum Region Size."
default = "2"

[[inputs]]
id = "minSize"
label = "Minimum Region Size"
tooltip = "The fewest areas a SKATER region may have. A regime regression needs more areas in each regime than its coefficients, the intercept and one slope per explanatory variable."
default = "20"

[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables, SpatialEconometrics, SparseArrays, LinearAlgebra, Statistics, Random
{{?model=regols}} using Distributions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the file stays where it is
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Spatial Econometrics Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files: Choose... picks another
path = joinpath(folder, "{{file}}")  # an absolute path is kept as it is
{{?file=bolognaregimes.gpkg}} # Example file: a grid of 15 by 15 square cells of 1 km around Bologna, in EPSG:32632, with a simulated rent, income, age of the buildings and zone, written to bolognaregimes.gpkg unless the folder has one already. Replace "bolognaregimes.gpkg" with your own file.
{{?file=bolognaregimes.gpkg}} if !isfile(path)
{{?file=bolognaregimes.gpkg}} 	rng = Xoshiro(2026)  # a fixed seed: the same values every time
{{?file=bolognaregimes.gpkg}} 	u, v = repeat(-7:7, outer = 15), repeat(-7:7, inner = 15)  # km east and north of the centre cell, row by row from the south-west
{{?file=bolognaregimes.gpkg}} 	zone = ifelse.(u .^ 2 .+ v .^ 2 .<= 12, 1, 2)  # 1: the 37 cells within about 3.5 km of the centre, 2: the others
{{?file=bolognaregimes.gpkg}} 	income = 22 .+ 6 .* (zone .== 1) .+ 3 .* randn(rng, 225)  # thousand euros a year per taxpayer
{{?file=bolognaregimes.gpkg}} 	age = clamp.(80 .- 6 .* sqrt.(u .^ 2 .+ v .^ 2) .+ 12 .* randn(rng, 225), 5, 120)  # mean age of the buildings, years, oldest in the centre
{{?file=bolognaregimes.gpkg}} 	# Two regimes: in the centre the rent rises faster with income and rises with the age of the buildings; outside it rises slower with income and falls with age
{{?file=bolognaregimes.gpkg}} 	base = ifelse.(zone .== 1, 1 .+ 0.25 .* income .+ 0.03 .* age, 2 .+ 0.12 .* income .- 0.01 .* age)
{{?file=bolognaregimes.gpkg}} 	rent = (I - 0.4 * make_queen_weights(15)) \ (base .+ 0.6 .* randn(rng, 225))  # euros per square metre a month: a spatial lag process with rho = 0.4
{{?file=bolognaregimes.gpkg}} 	cells = ["($(round(rent[c], digits = 2)), $(round(income[c], digits = 2)), $(round(age[c], digits = 1)), $(zone[c]), ST_MakeEnvelope($(685500 + 1000 * u[c]), $(4928900 + 1000 * v[c]), $(686500 + 1000 * u[c]), $(4929900 + 1000 * v[c])))" for c in 1:225]
{{?file=bolognaregimes.gpkg}} 	DBInterface.execute(con, "COPY (SELECT rent::DOUBLE AS rent, income::DOUBLE AS income, age::DOUBLE AS age, zone::INTEGER AS zone, geom FROM (VALUES $(join(cells, ", "))) t(rent, income, age, zone, geom)) TO '$(path)' (FORMAT GDAL, DRIVER 'GPKG', LAYER_NAME 'cells', SRS 'EPSG:32632')")
{{?file=bolognaregimes.gpkg}} end
yname = "{{dependent}}"
xnames = String.(strip.(split("{{explanatory}}", ",")))  # the explanatory variables, separated by commas
{{?model=skater}} source = "skater"  # the SKATER Regions tab always builds its regions
{{?model!=skater}} source = "{{regimesFrom}}"
zvars = String.(strip.(split("{{skaterVariables}}", ",")))  # the variables SKATER makes each region alike in
needed = unique([yname; xnames; source == "skater" ? zvars : ["{{regimeColumn}}"]])
present = join(("\"$c\" IS NOT NULL" for c in needed), " AND ")
# The areas, numbered i = 1, 2, ... in the order of the file, in longitude and latitude, with their centroids in the file's coordinate system; areas without a value are left out
DBInterface.execute(con, "CREATE OR REPLACE TABLE areas AS SELECT row_number() OVER () AS i, * EXCLUDE (geom), ST_X(ST_Centroid(geom)) AS cx, ST_Y(ST_Centroid(geom)) AS cy, ST_Transform(geom, '{{fileCrs}}', 'EPSG:4326') AS geom FROM ST_Read('$(path)') WHERE $(present)")
DBInterface.execute(con, "ALTER TABLE areas DROP COLUMN IF EXISTS ogc_fid")  # GDAL's own feature number, not a column of the file
column(c) = Float64.(Tables.columntable(DBInterface.execute(con, "SELECT \"$c\"::DOUBLE AS v FROM areas ORDER BY i")).v)
y = column(yname)
X = reduce(hcat, column.(xnames))  # without the intercept, which every regime gets
n, p = size(X)

# The neighbours of each area, as pairs (i, j), found with SQL
neighbour_pairs = Dict(
	"queen" => "SELECT a.i, b.i AS j FROM areas a JOIN areas b ON a.i <> b.i AND ST_Intersects(a.geom, b.geom)",  # any shared point of the boundaries
	"rook" => "SELECT a.i, b.i AS j FROM areas a JOIN areas b ON a.i <> b.i AND ST_Intersects(a.geom, b.geom) WHERE ST_Dimension(ST_Intersection(a.geom, b.geom)) >= 1",  # a shared stretch of boundary
	"knn" => "WITH c AS (SELECT i, ST_Centroid(geom) AS p FROM areas) SELECT i, j FROM (SELECT a.i, b.i AS j, row_number() OVER (PARTITION BY a.i ORDER BY ST_Distance_Sphere(a.p, b.p), b.i) AS r FROM c a JOIN c b ON a.i <> b.i) WHERE r <= {{k}}")  # the nearest centroids, by great-circle distance
pairs = Tables.columntable(DBInterface.execute(con, neighbour_pairs["{{neighbours}}"]))
W = row_standardize(sparse(pairs.i, pairs.j, 1.0, n, n))  # the weights of each area's neighbours sum to 1
Wsym = W + sparse(transpose(W))  # SKATER's tree joins neighbours in both directions

# The regimes: regime 1, 2, ... of each area
if source == "skater"
	Z = reduce(hcat, column.(zvars))
	labels = skater_regimes(Wsym, Z, {{regions}}; min_size = {{minSize}}).labels  # SKATER, after Assuncao, Neves, Camara and Freitas (2006)
	regime_names = ["Region $r" for r in 1:maximum(labels)]
else
	raw = String.(Tables.columntable(DBInterface.execute(con, "SELECT \"{{regimeColumn}}\"::VARCHAR AS v FROM areas ORDER BY i")).v)
	levels = sort(unique(raw))
	labels = [findfirst(==(r), levels) for r in raw]  # numbered in the sorted order of the column's values
	regime_names = ["{{regimeColumn}} = $l" for l in levels]
end
R = maximum(labels)

{{?model=skater}} Zs = (Z .- mean(Z, dims = 1)) ./ std(Z, dims = 1)  # standardised, as SKATER compares them
{{?model=skater}} within = sum(sum(abs2, Zs[labels .== r, :] .- mean(Zs[labels .== r, :], dims = 1)) for r in 1:R)
{{?model=skater}} println("SKATER: ", R, " regions", R < {{regions}} ? ", fewer than asked: no further cut leaves regions of at least {{minSize}} areas" : "", ", alike in ", join(zvars, ", "))
{{?model=skater}} println("Share of the spread of the standardised variables between the regions: ", round(1 - within / sum(abs2, Zs), digits = 3))
{{?model=skater}} println(rpad("region", 10), rpad("areas", 8), join((rpad("mean " * v, 16) for v in zvars)))
{{?model=skater}} for r in 1:R
{{?model=skater}} 	println(rpad(r, 10), rpad(count(==(r), labels), 8), join((rpad(round(mean(Z[labels .== r, j]), digits = 3), 16) for j in eachindex(zvars))))
{{?model=skater}} end
{{?model=regols}} m = fit_spatial_regime(W, X, y, ExogenousRegimes(labels); spatial_lag = false, varnames = xnames)  # least squares, one intercept and slopes per regime
{{?model=regols}} pooled = fit_spatial_regime(W, X, y, ExogenousRegimes(ones(Int, n)); spatial_lag = false, varnames = xnames)  # the same model with a single regime
{{?model=reglag}} m = fit_spatial_regime(W, X, y, ExogenousRegimes(labels); spatial_lag = true, varnames = xnames)  # maximum likelihood, with one rho shared by the regimes
{{?model=reglag}} pooled = fit_spatial_regime(W, X, y, ExogenousRegimes(ones(Int, n)); spatial_lag = true, varnames = xnames)  # the same model with a single regime
{{?model!=skater}} res = m.residuals
{{?model!=skater}} println(m)
{{?model!=skater}} println("Regimes: ", join(("R$r is $(regime_names[r])" for r in 1:R), ", "))
{{?model!=skater}} println(regime_chow_test(pooled, m))  # the likelihood ratio test that the coefficients are the same in every regime
{{?model=regols}} rss_one, rss_regimes = sum(abs2, pooled.residuals), sum(abs2, res)
{{?model=regols}} q, dfr = length(m.coef) - length(pooled.coef), n - length(m.coef)
{{?model=regols}} F = ((rss_one - rss_regimes) / q) / (rss_regimes / dfr)
{{?model=regols}} println("Chow F test: F = ", round(F, digits = 3), " on ", q, " and ", dfr, " degrees of freedom, p-value ", round(ccdf(FDist(q, dfr), F), sigdigits = 4))
{{?model!=skater}} if source == "skater"
{{?model!=skater}} 	println("The regions were found from the data, so these p-values are too small: see the Bootstrap Chow Test")
{{?model!=skater}} end
'''

# Next Steps action groups
[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "map-regimes"
label = "Map of the Regimes"
desc = "The areas on a base map, coloured by their regime or SKATER region; click an area for its attributes"
code = '''
DBInterface.execute(con, "CREATE OR REPLACE TABLE regime AS SELECT * FROM (VALUES $(join(("($i, $(labels[i]))" for i in 1:n), ", "))) t(i, regime)")
gmap = joinpath(mktempdir(), "regimes.geojson")
DBInterface.execute(con, "COPY (SELECT a.* EXCLUDE (geom, cx, cy), r.regime, a.geom FROM areas a JOIN regime r USING (i)) TO '$(gmap)' (FORMAT GDAL, DRIVER 'GeoJSON')")
foreach(r -> println(r, ": ", regime_names[r], ", ", count(==(r), labels), " areas"), 1:R)
display(Pollis.webmap(Pollis.layer(gmap; name = "Regime", column = "regime", opacity = 0.75)))
'''

[[actionGroups.actions]]
id = "map-coefficients"
label = "Maps of the Coefficients"
desc = "One layer per coefficient on a base map, each area coloured by the estimate of its regime; switch the layers to compare them"
models = ["regols", "reglag"]
code = '''
P = p + 1  # the intercept and the slopes of each regime
B = [m.coef[(labels[i] - 1) * P + k] for i in 1:n, k in 1:P]  # each area gets its regime's coefficients
DBInterface.execute(con, "CREATE OR REPLACE TABLE regcoef AS SELECT i, $(join(("b$k::DOUBLE AS b$k" for k in 1:P), ", ")) FROM (VALUES $(join(("($i, $(join(B[i, :], ", ")))" for i in 1:n), ", "))) t(i, $(join(("b$k" for k in 1:P), ", ")))")
cmap = joinpath(mktempdir(), "coefficients.geojson")
DBInterface.execute(con, "COPY (SELECT a.geom, c.* EXCLUDE (i) FROM areas a JOIN regcoef c USING (i)) TO '$(cmap)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap((Pollis.layer(cmap; name = ["(Intercept)"; xnames][k], column = "b$k", opacity = 0.75) for k in 1:P)...))
'''

[[actionGroups.actions]]
id = "map-residuals"
label = "Map of the Residuals"
desc = "The residuals of the tab's regime model on a base map: clusters of large residuals of the same sign are spatial dependence it leaves, or a regime boundary in the wrong place"
models = ["regols", "reglag"]
code = '''
DBInterface.execute(con, "CREATE OR REPLACE TABLE fit AS SELECT i, residual::DOUBLE AS residual FROM (VALUES $(join(("($i, $(res[i]))" for i in 1:n), ", "))) t(i, residual)")
rmap = joinpath(mktempdir(), "residuals.geojson")
DBInterface.execute(con, "COPY (SELECT a.* EXCLUDE (geom, cx, cy), round(f.residual, 3) AS residual, a.geom FROM areas a JOIN fit f USING (i)) TO '$(rmap)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(rmap; name = "Residuals", column = "residual", opacity = 0.75)))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "residual-moran"
label = "Moran's I of the Residuals"
desc = "Is there spatial dependence left in the residuals of the tab's regime model? A pseudo p-value from 999 random permutations"
models = ["regols", "reglag"]
code = '''
mr = moran_global(res, W; inference = :permutation, n_perm = 999, rng = Xoshiro(2026))  # a fixed seed: the same permutations every time
println("Moran's I of the residuals ", round(mr.I_stat, digits = 4), " (expected ", round(mr.E_I, digits = 4), "), pseudo p-value ", mr.p_value, " from 999 permutations")
{{?model=regols}} mr.p_value < 0.05 && println("Spatial dependence is left: the Regimes, Spatial Lag tab adds a spatial lag of {{dependent}}")
'''

[[actionGroups.actions]]
id = "regime-sizes"
label = "Regime Sizes and Spread"
desc = "Each regime's number of areas, the mean of the dependent variable and the spread of each explanatory variable inside it, with the regimes too small or too uniform to estimate"
code = '''
println(rpad("regime", 24), rpad("areas", 8), rpad("mean " * yname, 16), join((rpad("sd " * v, 14) for v in xnames)))
for r in 1:R
	rows = labels .== r
	sds = [count(rows) > 1 ? std(X[rows, k]) : 0.0 for k in 1:p]
	println(rpad(regime_names[r], 24), rpad(count(rows), 8), rpad(round(mean(y[rows]), digits = 3), 16), join((rpad(round(s, digits = 3), 14) for s in sds)))
	count(rows) <= p + 1 && println("  fewer areas than its ", p + 1, " coefficients: merge it with another, or raise Minimum Region Size")
	any(sds .== 0) && println("  an explanatory variable does not vary here, so its slope cannot be told from the regime's intercept")
end
'''

[[actionGroups.actions]]
id = "which-coefficients"
label = "Which Coefficients Differ"
desc = "Wald tests, coefficient by coefficient, that the intercept or one slope is the same in every regime while the others are free"
models = ["regols", "reglag"]
code = '''
using Distributions

P = p + 1
V = m.vcov[1:R * P, 1:R * P]
println(rpad("coefficient", 16), rpad("Wald", 12), rpad("df", 6), "p-value")
for (k, name) in enumerate(["(Intercept)"; xnames])
	C = zeros(R - 1, R * P)  # regime 1's coefficient minus each other regime's
	for r in 2:R
		C[r - 1, k] = 1.0
		C[r - 1, (r - 1) * P + k] = -1.0
	end
	d = C * m.coef[1:R * P]
	w = dot(d, (C * V * transpose(C)) \ d)
	println(rpad(name, 16), rpad(round(w, digits = 3), 12), rpad(R - 1, 6), round(ccdf(Chisq(R - 1), w), sigdigits = 4))
end
println("A small p-value: that coefficient differs between the regimes")
if source == "skater"
	println("The regions were found from the data, so these p-values are too small")
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "number-of-regions"
label = "Number of Regions"
desc = "SKATER with 2 to 8 regions: the regions found, the smallest, the share of the spread of the SKATER Variables between the regions, and the AIC of the OLS regimes they give"
code = '''
Zn = reduce(hcat, column.(zvars))
Zs = (Zn .- mean(Zn, dims = 1)) ./ std(Zn, dims = 1)
println(rpad("asked", 8), rpad("found", 8), rpad("smallest", 10), rpad("share between", 16), "AIC of the OLS regimes")
for k in 2:8
	lab = skater_regimes(Wsym, Zn, k; min_size = {{minSize}}).labels
	Rk = maximum(lab)
	within = sum(sum(abs2, Zs[lab .== r, :] .- mean(Zs[lab .== r, :], dims = 1)) for r in 1:Rk)
	aic = try
		fk = fit_spatial_regime(W, X, y, ExogenousRegimes(lab); spatial_lag = false)
		round(-2 * fk.loglik + 2 * (length(fk.coef) + 1), digits = 2)  # the coefficients and the variance
	catch
		"not estimable"
	end
	println(rpad(k, 8), rpad(Rk, 8), rpad(minimum(count(==(r), lab) for r in 1:Rk), 10), rpad(round(1 - within / sum(abs2, Zs), digits = 3), 16), aic)
end
println("The share between rises with every cut: look for where it stops rising much. The smallest AIC fits best for its number of coefficients")
'''

