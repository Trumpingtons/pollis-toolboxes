[[actionGroups.actions]]
id = "save-geoparquet"
label = "Save the Results as GeoParquet"
desc = "Write the areas, in longitude and latitude, with their regime and, on the regime tabs, the residuals, to spatial-regimes.parquet in the folder above"
code = '''
out = joinpath(folder, "spatial-regimes.parquet")
resid = @isdefined(res) ? res : fill(NaN, n)  # the SKATER Regions tab fits no regression
DBInterface.execute(con, "CREATE OR REPLACE TABLE fit AS SELECT * FROM (VALUES $(join(("($i, $(labels[i]), $(isnan(resid[i]) ? "NULL" : resid[i]))" for i in 1:n), ", "))) t(i, regime, residual)")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "COPY (SELECT a.* EXCLUDE (geom, cx, cy), f.regime, f.residual::DOUBLE AS residual, a.geom FROM areas a JOIN fit f USING (i) ORDER BY i) TO '$(out)' (FORMAT PARQUET)")  # GeoParquet: DuckDB writes the geometry column's metadata
	println("Wrote ", out)
end
'''
