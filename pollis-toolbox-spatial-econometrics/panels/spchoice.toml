effects = marginal_effects(m)  # the effects of LeSage and Pace (2009), from the normal density at each area's index and the spatial multiplier
println(rpad("", 14), rpad("Direct", 11), rpad("Indirect", 11), rpad("Total", 11), "Indirect share")
for k in 1:p
	println(rpad(effects.varnames[k], 14), rpad(round(effects.direct[k], digits = 4), 11), rpad(round(effects.indirect[k], digits = 4), 11), rpad(round(effects.total[k], digits = 4), 11), round(100 * effects.indirect[k] / effects.total[k], digits = 1), "%")
end
println("\nEach effect is a change in the probability of the choice, from 0 to 1, for one more unit of the variable")
println("Direct: one more unit in an area, on that area's own probability, feedback through its neighbours included")
println("Indirect: the same change in every other area, on an area's probability, through the neighbours")
println("Total: one more unit in every area, on an area's probability; the effects are averaged over the areas, without standard errors")
'''

