[[actionGroups.actions]]
id = "replicate-katrina"
label = "New Orleans After Katrina"
desc = "Table 3 of LeSage, Pace, Lam, Campanella and Liu (2011): the reopening of 673 businesses on three New Orleans streets within 6 and within 12 months of Hurricane Katrina, by a spatial lag probit fitted by Gibbs sampling on the 15 nearest neighbours, the posterior means and standard deviations beside those of the article"
models = ["probitbayes"]
code = '''
using Downloads, RData

let
	file = joinpath(mktempdir(), "Katrina.RData")
	Downloads.download("https://raw.githubusercontent.com/stefanwilhelm/spatialprobit/7b624f571a740caf491671ef6cf4ae1135593a6c/data/Katrina.RData", file)  # the data of the R package spatialprobit, GPL-2 or later
	katrina = Tables.columntable(RData.load(file)["Katrina"])  # read as columns, one vector per variable
	names = ["flood_depth", "log_medinc", "small_size", "large_size", "low_status_customers", "high_status_customers", "owntype_sole_proprietor", "owntype_national_chain"]
	Xk = reduce(hcat, (Float64.(Tables.getcolumn(katrina, Symbol(c))) for c in names))
	coords = hcat(Float64.(katrina.lat), Float64.(katrina.long))
	nk = size(Xk, 1)
	# The 15 nearest businesses by the Euclidean distance between latitude and longitude, as spdep's knearneigh in the article's code, row-standardised
	D = [i == j ? Inf : norm(coords[i, :] - coords[j, :]) for i in 1:nk, j in 1:nk]  # a business is not its own neighbour
	near = [partialsortperm(D[i, :], 1:15) for i in 1:nk]
	Wk = row_standardize(sparse(repeat(1:nk, inner = 15), reduce(vcat, near), 1.0, nk, nk))
	labels = ["constant"; names; "rho"]
	function report(title, fit, means, deviations)
		sd = sqrt.(diag(fit.vcov))
		println("\n", title, "; acceptance rate of rho ", round(fit.accept_rate, digits = 3))
		println(rpad("", 24), rpad("Julia mean", 12), rpad("Article", 10), rpad("Julia SD", 10), "Article SD")
		for k in eachindex(labels)
			println(rpad(labels[k], 24), rpad(round(fit.coef[k], digits = 4), 12), rpad(means[k], 10), rpad(round(sd[k], digits = 4), 10), deviations[k])
		end
	end
	for (column, title, reopened, means, deviations) in (
			("y2", "(b) 0-6 months", 425,
				[-2.9778, -0.1103, 0.3110, -0.1087, -0.3723, -0.3423, 0.0407, 0.3588, 0.2948, 0.5783],
				[2.7300, 0.0349, 0.2685, 0.1488, 0.3316, 0.1613, 0.1528, 0.1813, 0.3806, 0.0842]),
			("y3", "(c) 0-12 months", 478,
				[-4.3361, -0.0894, 0.4844, -0.2142, -0.3572, -0.3209, -0.1015, 0.1459, -0.1205, 0.5846],
				[2.7227, 0.0343, 0.2683, 0.1542, 0.2981, 0.1620, 0.1654, 0.1886, 0.3893, 0.0929]))
		yk = Float64.(Tables.getcolumn(katrina, Symbol(column)))
		println("\n", title, ": ", count(==(1), yk), " of ", nk, " businesses reopened (the article: ", reopened, ")")
		fit = fit_bayesian_spatial_probit(Wk, Xk, yk; n_samples = {{draws}}, burnin = {{burnin}}, varnames = names, rng = Xoshiro(2026))  # Draws and Burn-in from the inputs; more draws give steadier posterior means
		report(title, fit, means, deviations)
	end
end
'''

