id = "effects"
label = "Direct, Indirect and Total Effects"
desc = "The effect of each explanatory variable on the probability of the choice, averaged over the areas: direct, of a change in an area on its own choice; indirect, through its neighbours and theirs; and total, of the same change in every area, with the share of the total that passes through the neighbours"
models = ["probitgmm"]
