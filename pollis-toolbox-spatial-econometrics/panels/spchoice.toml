[[faq]]
question = "Should I fit the spatial probit by GMM or by Gibbs sampling?"
answer = '''
The two trade speed against precision. The linearised GMM of the Probit, GMM tab is fast and approximately unbiased, but its estimates of rho are spread far more widely than those of the Gibbs sampler on the same data. The Gibbs sampler of the Probit, Bayesian tab is more precise and gives posterior intervals for every parameter, but in small samples it pulls rho towards zero. The GMM Against Gibbs step fits both on the same data.
'''
wiki = "Decision Guide"

[[faq]]
question = "Why can't I read the coefficients of a spatial probit as effects on the probability?"
answer = '''
A coefficient moves the latent propensity, not the probability, and in a spatial lag probit a change at one location also moves its neighbours' propensities through the spatial multiplier. The effect on the probability is then summarised by three averages over the locations: the direct effect on a location's own probability, the indirect effect that reaches it from changes elsewhere, and the total effect, their sum. The Direct, Indirect and Total Effects step computes them on the Probit, GMM tab.
'''
wiki = "Effects on the Probability"

[[faq]]
question = "When should I use the Logit With a Filter tab instead of a spatial lag probit?"
answer = '''
When the spatial autocorrelation of the choices is in the way of the coefficients rather than the question. A spatial lag probit models how a location's propensity responds to its neighbours', so it gives indirect effects; a logistic regression with a spatial filter takes up the spatial pattern with Moran eigenvectors and has no indirect effects, its coefficients reading as in an ordinary logistic regression. The Lag Probit Against a Filter step compares the two.
'''
wiki = "Decision Guide"

[[faq]]
question = "Which software are the panel's results checked against?"
answer = '''
The published estimates of LeSage, Pace, Lam, Campanella and Liu (2011) for the reopening of New Orleans businesses after Hurricane Katrina, whose data are distributed with spatialprobit, the R package of Wilhelm and de Matos. The New Orleans After Katrina step fits the spatial lag probit at the 6- and 12-month horizons and prints Julia's posterior means and standard deviations beside the article's Table 3.
'''
wiki = "Replications"

[[faq]]
question = "What does the Instrument Lags input do?"
answer = '''
It sets how many spatial lags of the explanatory variables enter as instruments in the two-stage least squares step of the Probit, GMM tab: their neighbours' averages, the averages of those averages and so on, from one to three, with two by default. The spatial lag of the intercept is left out, as with row-standardised weights it equals the intercept itself.
'''
wiki = "Probit, GMM"
hidden = true

[[faq]]
question = "What acceptance rate of rho should the Probit, Bayesian tab show?"
answer = '''
Between 0.2 and 0.5, as the documentation of fit_bayesian_spatial_probit expects for its random-walk Metropolis step on rho. The Trace and Density of ρ and Chain Diagnostics steps then check whether the chain has run long enough for the posterior summaries.
'''
wiki = "Probit, Bayesian"
hidden = true

[[faq]]
question = "Why does the Ordered Probit tab have no intercept?"
answer = '''
The level of the latent propensity and the cut points cannot both be estimated, so fit_spatial_ordered_probit fixes the first cut point at zero and leaves out the intercept. For the same reason no explanatory variable may be constant, as a constant column would play the part of the missing intercept.
'''
wiki = "Ordered Probit"
hidden = true

[[faq]]
question = "Do the standard errors of the Logit With a Filter tab allow for the selection of eigenvectors?"
answer = '''
No. The eigenvectors are chosen on the same choices the regression then explains, and the standard errors treat them as fixed in advance, so they do not include the uncertainty of the selection.
'''
wiki = "Logit With a Filter"
hidden = true

[[faq]]
question = "Why might the replication of the New Orleans estimates not match the article to the last digit?"
answer = '''
A Gibbs sampler gives posterior means that vary from one chain to another by their Monte Carlo error, so different random draws or a chain of a different length do not reproduce the published values exactly; the Chain Diagnostics step reports that error. The priors of the two samplers need not be the same, and businesses at equal distances can be ordered differently among the 15 nearest neighbours.
'''
wiki = "Replications"
hidden = true
