[[faq]]
question = "What does a positive Moran's I mean, and what does a negative one mean?"
answer = '''
A positive Moran's I means that neighbouring areas tend to have similar values: high next to high, low next to low. A negative Moran's I means that neighbours tend to differ, high next to low, as on a chessboard.

Under no spatial autocorrelation, Moran's I is expected to be -1/(n - 1), slightly below zero, for n areas. The pseudo p-value says how often random rearrangements of the values over the areas give a Moran's I as far from that expectation.
'''
wiki = "Global Moran's I"

[[faq]]
question = "Which neighbours should I choose: queen, rook or k nearest?"
answer = '''
Queen contiguity makes neighbours of areas that share any point of their boundaries, rook contiguity of areas that share a stretch of boundary. Both suit polygons that tile a region, such as municipalities or grid cells.

k nearest neighbours gives every area the same number of neighbours, by the distance between centroids, and suits areas of very different sizes, islands, and points. Weights: Contiguity and k Nearest shows how much Moran's I depends on the choice.
'''
wiki = "Spatial Weights"

[[faq]]
question = "What do High-High, Low-Low, High-Low and Low-High mean on a LISA cluster map?"
answer = '''
High-High is an area with a high value among neighbours with high values: a hot spot. Low-Low is a low value among low values: a cold spot. High-Low and Low-High are spatial outliers, an area that differs from its neighbours.

Only areas whose local Moran's I is significant at the chosen level get one of the four labels; the others are Not Significant.
'''
wiki = "Local Moran (LISA)"

[[faq]]
question = "Why do no areas stay significant after a Bonferroni or FDR adjustment?"
answer = '''
A pseudo p-value from random permutations can be no smaller than 1/(permutations + 1): 0.001 with 999 permutations. A Bonferroni adjustment at 0.05 over 225 areas asks for a p-value below 0.05/225, about 0.0002, which 999 permutations cannot give.

Raise Permutations to 9999 or more before adjusting for the number of tests.
'''
wiki = "Permutation Inference"

[[faq]]
question = "Why is the pseudo p-value of Moran's I the same every time I run the code?"
answer = '''
The permutations are drawn from a random number generator started with a fixed seed, Xoshiro(2026), so a run gives the same permutations, and the same pseudo p-value, as the one before.

Another seed gives other permutations: with enough permutations, the pseudo p-value changes little from one seed to another.
'''
wiki = "Permutation Inference"
hidden = true

[[faq]]
question = "What is an island in a spatial weights matrix?"
answer = '''
An island is an area without neighbours: an island in the sea, with contiguity neighbours, or an area whose boundary touches no other because of gaps in the data.

An island's spatial lag is zero, and it adds nothing to Moran's I. Neighbour Counts lists the islands; k nearest neighbours leaves none.
'''
wiki = "Spatial Weights"
hidden = true

[[faq]]
question = "What is the difference between Moran's I and Geary's c?"
answer = '''
Moran's I is built from the products of the deviations of neighbouring values from the mean; Geary's c from the squared differences between neighbouring values.

Under no spatial autocorrelation Moran's I is expected near zero and Geary's c at 1. Positive autocorrelation gives a positive Moran's I and a Geary's c below 1.
'''
wiki = "Spatial Autocorrelation"
hidden = true

[[faq]]
question = "What does the slope of the Moran scatterplot show?"
answer = '''
The Moran scatterplot plots each area's standardised value against the average of its neighbours' standardised values, the spatial lag. With row-standardised weights, the slope of the regression line through the points is Moran's I.

Its four quadrants are the four kinds of LISA cluster: High-High at the top right, Low-Low at the bottom left, and the spatial outliers in the other two.
'''
wiki = "Spatial Autocorrelation"
hidden = true

[[faq]]
question = "Does a significant Moran's I tell me where the clusters are?"
answer = '''
No. Moran's I is one number for the whole map: it says that similar values lie near each other more often than chance would give, not where.

The Local Moran (LISA) tab gives a statistic and a pseudo p-value for every area, and maps the hot spots, cold spots and spatial outliers.
'''
wiki = "Overview"
hidden = true

