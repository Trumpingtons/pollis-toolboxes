{{?model=local}} result = "SELECT a.* EXCLUDE (geom), g.spatial_lag, l.cluster, l.local_i, l.p, a.geom FROM areas a JOIN lags g USING (i) JOIN lisa l USING (i) ORDER BY i"
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "COPY ($result) TO '$(out)' (FORMAT PARQUET)")  # GeoParquet: DuckDB writes the geometry column's metadata
	println("Wrote ", out)
