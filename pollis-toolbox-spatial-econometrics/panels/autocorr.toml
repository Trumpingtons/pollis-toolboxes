DBInterface.execute(con, "CREATE OR REPLACE TABLE lags AS SELECT i, spatial_lag::DOUBLE AS spatial_lag FROM (VALUES $(join(("($i, $(lagged[i]))" for i in 1:n), ", "))) t(i, spatial_lag)")
