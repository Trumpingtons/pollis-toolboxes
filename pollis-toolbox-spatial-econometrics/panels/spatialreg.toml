[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. Choose... picks another. A file given by an absolute path is read where it is. Save the Results as GeoParquet writes there."
default = "~/.pollis/data/examples"
folder = "data/examples"

[[inputs]]
id = "file"
label = "File"
tooltip = "The file of areas, as polygons: GeoPackage (its first layer), GeoJSON, Shapefile, FlatGeobuf or KML, in the folder above, or an absolute path. With the default, boston_tracts.gpkg, the example first copies the 506 census tracts of Boston in 1970 from PollisDatasets into the folder, unless it has the file already: the corrected median value of owner-occupied homes (CMEDV, in thousands of dollars) with the variables of Harrison and Rubinfeld (1978), such as crimes per head (CRIM), nitric oxides (NOX, parts per 10 million), rooms per dwelling (RM) and the percent of the population of lower status (LSTAT)."
default = "boston_tracts.gpkg"

[[inputs]]
id = "dependent"
label = "Dependent Variable"
tooltip = "The numeric column explained by the model. Areas without a value in it, or in an explanatory variable, are left out."
default = "CMEDV"

[[inputs]]
id = "explanatory"
label = "Explanatory Variables"
tooltip = "The numeric columns that explain it, separated by commas. Every model adds an intercept. Change One Area changes the first of them."
default = "CRIM, NOX, RM, LSTAT"

[[inputs]]
id = "fileCrs"
label = "File Coordinate System"
tooltip = "The coordinate system of the file's coordinates, as an EPSG code: the areas are moved from it into longitude and latitude on WGS 84 (EPSG:4326), for the maps and for the distances between centroids. The example's tracts are in EPSG:4267, longitude and latitude on NAD27. GeoJSON and KML are always EPSG:4326."
default = "EPSG:4267"
newRow = true

[[inputs]]
id = "neighbours"
label = "Neighbours"
tooltip = "Which areas are neighbours: Queen, those that share any point of their boundaries; Rook, those that share a stretch of boundary; k Nearest, the k areas with the nearest centroids. The weights of each area's neighbours sum to 1."
kind = "select"
default = "queen"

[[inputs.options]]
value = "queen"
label = "Queen Contiguity"

[[inputs.options]]
value = "rook"
label = "Rook Contiguity"

[[inputs.options]]
value = "knn"
label = "k Nearest"

[[inputs]]
id = "k"
label = "k"
tooltip = "The number of neighbours of every area with k Nearest, and in Weights: Contiguity and k Nearest."
default = "6"

[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables, SpatialEconometrics, SparseArrays, LinearAlgebra, Random
{{?file=boston_tracts.gpkg}} using PollisDatasets

con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the file stays where it is
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Spatial Econometrics Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files: Choose... picks another
path = joinpath(folder, "{{file}}")  # an absolute path is kept as it is
{{?file=boston_tracts.gpkg}} # Example file: the 506 census tracts of Boston in 1970, with the median house values of Harrison and Rubinfeld (1978), corrected by Gilley and Pace (1996), copied from PollisDatasets unless the folder has it already. Replace "boston_tracts.gpkg" with your own file.
{{?file=boston_tracts.gpkg}} isfile(path) || cp(samplefile("boston_tracts.gpkg"), path)
yname = "{{dependent}}"
xnames = String.(strip.(split("{{explanatory}}", ",")))  # the explanatory variables, separated by commas
present = join(("\"$c\" IS NOT NULL" for c in [yname; xnames]), " AND ")
# The areas, numbered i = 1, 2, ... in the order of the file, in longitude and latitude; areas without a value are left out
DBInterface.execute(con, "CREATE OR REPLACE TABLE areas AS SELECT row_number() OVER () AS i, * EXCLUDE (geom), ST_Transform(geom, '{{fileCrs}}', 'EPSG:4326') AS geom FROM ST_Read('$(path)') WHERE $(present)")
DBInterface.execute(con, "ALTER TABLE areas DROP COLUMN IF EXISTS ogc_fid")  # GDAL's own feature number, not a column of the file
column(c) = Float64.(Tables.columntable(DBInterface.execute(con, "SELECT \"$c\"::DOUBLE AS v FROM areas ORDER BY i")).v)
y = column(yname)
X = reduce(hcat, column.(xnames))  # without the intercept, which every model adds
n, p = size(X)

# The neighbours of each area, as pairs (i, j), found with SQL
neighbour_pairs = Dict(
	"queen" => "SELECT a.i, b.i AS j FROM areas a JOIN areas b ON a.i <> b.i AND ST_Intersects(a.geom, b.geom)",  # any shared point of the boundaries
	"rook" => "SELECT a.i, b.i AS j FROM areas a JOIN areas b ON a.i <> b.i AND ST_Intersects(a.geom, b.geom) WHERE ST_Dimension(ST_Intersection(a.geom, b.geom)) >= 1",  # a shared stretch of boundary
	"knn" => "WITH c AS (SELECT i, ST_Centroid(geom) AS p FROM areas) SELECT i, j FROM (SELECT a.i, b.i AS j, row_number() OVER (PARTITION BY a.i ORDER BY ST_Distance_Sphere(a.p, b.p), b.i) AS r FROM c a JOIN c b ON a.i <> b.i) WHERE r <= {{k}}")  # the nearest centroids, by great-circle distance
function weights(kind)
	pairs = Tables.columntable(DBInterface.execute(con, neighbour_pairs[kind]))
	return row_standardize(sparse(pairs.i, pairs.j, 1.0, n, n))  # the weights of each area's neighbours sum to 1
end
W = weights("{{neighbours}}")

# Moran's I of least-squares residuals, with the expectation and variance of Cliff and Ord (1972) for row-standardised weights
function moran_residuals(y, Xi, W)
	n, k = size(Xi)
	M = I - Xi * ((transpose(Xi) * Xi) \ transpose(Xi))  # the residual maker
	e = M * y
	MW = M * Matrix(W)
	mi = dot(e, W * e) / dot(e, e)
	expected = tr(MW) / (n - k)
	variance = (tr(MW * M * transpose(Matrix(W))) + tr(MW * MW) + tr(MW)^2) / ((n - k) * (n - k + 2)) - expected^2
	return mi, (mi - expected) / sqrt(variance)
end

{{?model=ols}} Xi = hcat(ones(n), X)  # with the intercept
{{?model=ols}} b = Xi \ y  # least squares
{{?model=ols}} res = y - Xi * b  # the residuals
{{?model=ols}} se = sqrt.(diag(dot(res, res) / (n - p - 1) * inv(transpose(Xi) * Xi)))
{{?model=ols}} println(rpad("", 14), rpad("Estimate", 12), rpad("Std. Error", 12), "t")
{{?model=ols}} for (name, bk, sk) in zip(["(Intercept)"; xnames], b, se)
{{?model=ols}} 	println(rpad(name, 14), rpad(round(bk, digits = 4), 12), rpad(round(sk, digits = 4), 12), round(bk / sk, digits = 2))
{{?model=ols}} end
{{?model=ols}} mi, z = moran_residuals(y, Xi, W)
{{?model=ols}} println("\nMoran's I of the residuals: ", round(mi, digits = 4), ", z = ", round(z, digits = 2), abs(z) > 1.96 ? ", beyond 1.96: spatial autocorrelation at the 5% level" : ", within 1.96")
{{?model=ols}} tests = lm_tests(y, Xi, W)  # the Lagrange multiplier tests of Anselin, Bera, Florax and Yoon (1996)
{{?model=ols}} foreach(print, tests)
{{?model=sar}} m = fit_spatial(SAR(), W, X, y; varnames = xnames)  # maximum likelihood, with the intercept added
{{?model=sem}} m = fit_spatial_error(W, X, y; varnames = xnames)  # maximum likelihood, with the intercept added
{{?model=slx}} m = fit_slx(W, X, y; varnames = xnames)  # least squares on X and WX, with the intercept added
{{?model=sdm}} m = fit_spatial(SDM(), W, X, y; varnames = xnames)  # maximum likelihood on X and WX, with the intercept added
{{?model!=ols}} res = m.residuals
{{?model!=ols}} println(coeftable(m))
{{?model!=ols}} println("Log-likelihood ", round(m.loglik, digits = 3), ", n = ", n)
{{?model=sar|sdm}} println(spatial_effects(m))  # direct and indirect effects, with standard errors
'''

# Next Steps action groups
