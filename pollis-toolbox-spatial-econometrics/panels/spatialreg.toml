id = "neighbour-counts"
label = "Neighbour Counts"
desc = "How many areas have 0, 1, 2, ... neighbours, and the islands: the areas without a neighbour"
code = '''
counts = vec(sum(W .> 0, dims = 2))  # the number of neighbours of each area
println("Neighbours of {{neighbours}}: mean ", round(sum(counts) / n, digits = 2), ", from ", minimum(counts), " to ", maximum(counts))
println(rpad("neighbours", 12), "areas")
for c in sort(unique(counts))
	println(rpad(c, 12), count(==(c), counts))
end
islands = findall(==(0), counts)
println(isempty(islands) ? "No islands" : "Islands, areas without a neighbour: i = $(join(islands, ", ")). Leave them out, or choose k Nearest")
