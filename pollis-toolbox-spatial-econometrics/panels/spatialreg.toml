[[actionGroups.actions]]
id = "change-one-area"
label = "Change One Area"
desc = "One more unit of the first explanatory variable in the area nearest the middle of the map: the change in the dependent variable there and in every other area, on a base map"
code = '''
middle = only(Tables.columntable(DBInterface.execute(con, "WITH m AS (SELECT ST_Centroid(ST_Envelope_Agg(geom)) AS p FROM areas) SELECT i FROM areas, m ORDER BY ST_Distance_Sphere(ST_Centroid(geom), m.p) LIMIT 1")).i)
shock = zeros(n)
shock[middle] = 1.0  # one more unit in that area alone
{{?model=ols}} change = b[2] .* shock
{{?model=sem}} change = m.coef[2] .* shock  # the spatial dependence of the errors carries nothing to the neighbours
{{?model=slx}} change = m.coef[2] .* shock .+ m.coef[2 + p] .* (W * shock)  # the area itself, and its neighbours through WX
{{?model=sar}} change = (I - m.rho * W) \ (m.coef[2] .* shock)  # the spatial multiplier carries it to every connected area
{{?model=sdm}} change = (I - m.rho * W) \ (m.coef[2] .* shock .+ m.coef[2 + p] .* (W * shock))
println("One more unit of $(xnames[1]) in area i = $(middle): $(round(change[middle], digits = 4)) there, $(round(sum(change) - change[middle], digits = 4)) in all the other areas together, $(count(abs.(change) .> 1e-8) - 1) of which change")
DBInterface.execute(con, "CREATE OR REPLACE TABLE spill AS SELECT i, change::DOUBLE AS change FROM (VALUES $(join(("($i, $(change[i]))" for i in 1:n), ", "))) t(i, change)")
smap = joinpath(mktempdir(), "change.geojson")
DBInterface.execute(con, "COPY (SELECT a.* EXCLUDE (geom), round(s.change, 4) AS change, a.geom FROM areas a JOIN spill s USING (i)) TO '$(smap)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(smap; name = "Change in {{dependent}}", column = "change", opacity = 0.75)))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "models-compared"
label = "Models Compared"
desc = "Least squares and the four spatial models on the same data and weights: parameters, log-likelihood, AIC, BIC and the spatial parameter"
code = '''
Xi = hcat(ones(n), X)
e = y - Xi * (Xi \ y)
ols_loglik = -n / 2 * (log(2 * pi) + log(dot(e, e) / n) + 1)  # the log-likelihood of least squares
rows = ["OLS" => (ols_loglik, p + 2, "")]
fitted = ["SAR" => fit_spatial(SAR(), W, X, y; varnames = xnames), "SEM" => fit_spatial_error(W, X, y; varnames = xnames), "SLX" => fit_slx(W, X, y; varnames = xnames), "SDM" => fit_spatial(SDM(), W, X, y; varnames = xnames)]
for (name, fm) in fitted
	spatial = name == "SEM" ? "lambda = $(round(fm.lambda, digits = 4))" : name in ("SAR", "SDM") ? "rho = $(round(fm.rho, digits = 4))" : ""
	push!(rows, name => (fm.loglik, length(fm.coef) + 1, spatial))  # the coefficients and the variance
end
println(rpad("model", 8), rpad("parameters", 12), rpad("log-likelihood", 16), rpad("AIC", 12), rpad("BIC", 12), "spatial parameter")
for (name, (ll, k, spatial)) in rows
	println(rpad(name, 8), rpad(k, 12), rpad(round(ll, digits = 3), 16), rpad(round(-2 * ll + 2 * k, digits = 2), 12), rpad(round(-2 * ll + k * log(n), digits = 2), 12), spatial)
end
println("The smallest AIC or BIC fits best for its number of parameters")
'''

