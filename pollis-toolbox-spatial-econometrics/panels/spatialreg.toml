[[faq]]
question = "Which spatial model should I start with?"
answer = '''
Start on the OLS and LM Tests tab. If Moran's I of the least-squares residuals is significant, the Lagrange multiplier tests point to a model: a significant LM lag test with an insignificant LM error test points to the spatial lag model (SAR), the reverse to the spatial error model (SEM). When both are significant, the robust forms decide.

Another route starts from the spatial Durbin model (SDM) and tests it down: Likelihood Ratio Tests of the SDM compares it with the SAR, SLX and SEM models it nests.
'''
wiki = "Decision Guide"

[[faq]]
question = "Why are the coefficients of the spatial lag model not the effects of the explanatory variables?"
answer = '''
In the spatial lag model, a change in an explanatory variable in one area changes the outcome there, which changes the outcome of its neighbours through the spatial lag, which feeds back to the first area, and so on. The coefficient is only the first round of that chain.

The direct effect is the average change in an area's own outcome, feedback included; the indirect effect is the average change in all the other areas' outcomes together. The Spatial Lag (SAR) and Spatial Durbin (SDM) tabs print both, with standard errors.
'''
wiki = "Direct and Indirect Effects"

[[faq]]
question = "What does rho measure, and what does lambda measure?"
answer = '''
rho, in the spatial lag (SAR) and spatial Durbin (SDM) models, is the strength with which an area's outcome depends on the average outcome of its neighbours. lambda, in the spatial error model (SEM), is the strength of the spatial dependence in the error term, between the parts of the outcomes that the explanatory variables leave unexplained.

With row-standardised weights both lie below 1. A rho of zero turns the SAR model into least squares, and a lambda of zero turns the SEM model into least squares.
'''
wiki = "Overview"

[[faq]]
question = "How do I know the panel gives the same results as R?"
answer = '''
The Replicate group of the Next Steps downloads open data and prints Julia's estimates beside values recorded from R's spatialreg and spdep packages: Columbus crime and Boston house prices, from the spData package. A third step reproduces Tables 2, 14, 17 and 18 of Bivand and Piras (2015) from the article's own replication archive.

Each line shows the difference: differences in the last printed digit come from rounding.
'''
wiki = "Replications"

[[faq]]
question = "Why are the spatial lags of X called SLX?"
answer = '''
SLX stands for spatial lag of X: the model adds the average of each explanatory variable over an area's neighbours, WX, to the explanatory variables, and has no spatial lag of the outcome. It is estimated by least squares, and its coefficients on WX are the indirect effects directly.
'''
wiki = "Lag of X (SLX)"
hidden = true

[[faq]]
question = "What does the common factor test compare?"
answer = '''
The spatial Durbin model nests the spatial error model when the coefficients of the spatial lags of X equal minus rho times the coefficients of X. The likelihood ratio test of the SEM against the SDM tests that restriction: a small p-value rejects the spatial error model in favour of the spatial Durbin model.
'''
wiki = "Spatial Durbin (SDM)"
hidden = true

[[faq]]
question = "Why does the panel compute Moran's I of the residuals differently on the OLS tab?"
answer = '''
Least-squares residuals sum to zero and depend on each other through the explanatory variables, so the moments of Moran's I for a raw variable do not apply to them. The OLS and LM Tests tab uses the expectation and variance that Cliff and Ord (1972) derived for regression residuals. For the spatial models, the panel gives a pseudo p-value from random permutations of the residuals instead.
'''
wiki = "Lagrange Multiplier Tests"
hidden = true

[[faq]]
question = "What happens in the other areas when one area's explanatory variable changes in the spatial error model?"
answer = '''
Nothing: in the spatial error model the spatial dependence lies in the error term, so a change in an explanatory variable in one area changes the expected outcome of that area alone. The Change One Area step shows it: only the area changed moves on the map.
'''
wiki = "Spatial Error (SEM)"
hidden = true

[[faq]]
question = "Why does the panel's spatial lag model take longer on several thousand areas?"
answer = '''
The likelihood of the spatial lag and spatial error models holds the log-determinant of I - rho W, a matrix with one row per area. SpatialEconometrics.jl computes it exactly up to 1000 areas, by default, and with a Chebyshev approximation beyond; its traces, used by the standard errors and the effects, grow with the number of areas too.
'''
wiki = "Maximum Likelihood Estimation"
hidden = true

