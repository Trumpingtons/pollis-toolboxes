sem_fit = fit_spatial_error(W, X, y; varnames = xnames)
slx_fit = fit_slx(W, X, y; varnames = xnames)
sdm_fit = fit_spatial(SDM(), W, X, y; varnames = xnames)
for (question, restricted) in ("Are the spatial lags of X zero? SAR against SDM" => sar_fit, "Is rho zero? SLX against SDM" => slx_fit, "Does the common factor restriction hold? SEM against SDM" => sem_fit)
	println(question)
	println(lr_test(restricted, sdm_fit))
end
'''

