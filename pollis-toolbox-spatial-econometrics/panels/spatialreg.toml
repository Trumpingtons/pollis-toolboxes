id = "residual-moran"
label = "Moran's I of the Residuals"
desc = "Is there spatial dependence left in the residuals of the tab's model? For least squares with the moments of Cliff and Ord (1972), for the spatial models from random permutations"
code = '''
{{?model=ols}} mi, z = moran_residuals(y, hcat(ones(n), X), W)
{{?model=ols}} println("Moran's I of the least-squares residuals ", round(mi, digits = 4), ", z = ", round(z, digits = 2), " (beyond 1.96: significant at the 5% level)")
{{?model!=ols}} mr = moran_global(res, W; inference = :permutation, n_perm = 999, rng = Xoshiro(2026))  # a fixed seed: the same permutations every time
{{?model!=ols}} println("Moran's I of the residuals ", round(mr.I_stat, digits = 4), " (expected ", round(mr.E_I, digits = 4), "), pseudo p-value ", mr.p_value, " from 999 permutations")
'''

[[actionGroups.actions]]
id = "durbin-tests"
label = "LM Tests for the Durbin Terms"
desc = "Lagrange multiplier tests, from the least-squares residuals, of the spatial lag and of the spatial lags of X, jointly and each robust to the other"
models = ["ols", "slx", "sdm"]
code = '''
tests = sdm_tests(y, hcat(ones(n), X), W)
for t in (tests.joint, tests.lag, tests.robust_lag, tests.durbin, tests.robust_durbin)
	print(t)
end
'''

