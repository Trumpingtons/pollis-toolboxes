[[actionGroups.actions]]
id = "save-geoparquet"
label = "Save the Results as GeoParquet"
desc = "Write the areas, in longitude and latitude, with the residuals of the tab's model, to spatial-regression.parquet in the folder above"
code = '''
out = joinpath(folder, "spatial-regression.parquet")
DBInterface.execute(con, "CREATE OR REPLACE TABLE fit AS SELECT i, residual::DOUBLE AS residual FROM (VALUES $(join(("($i, $(res[i]))" for i in 1:n), ", "))) t(i, residual)")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "COPY (SELECT a.* EXCLUDE (geom), f.residual, a.geom FROM areas a JOIN fit f USING (i) ORDER BY i) TO '$(out)' (FORMAT PARQUET)")  # GeoParquet: DuckDB writes the geometry column's metadata
	println("Wrote ", out)
end
'''
