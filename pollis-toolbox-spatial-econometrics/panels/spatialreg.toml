[[actionGroups.actions]]
id = "map-residuals"
label = "Map of the Residuals"
desc = "The residuals of the tab's model on a base map: clusters of large residuals of the same sign are spatial dependence the model leaves"
code = '''
DBInterface.execute(con, "CREATE OR REPLACE TABLE fit AS SELECT i, residual::DOUBLE AS residual FROM (VALUES $(join(("($i, $(res[i]))" for i in 1:n), ", "))) t(i, residual)")
rmap = joinpath(mktempdir(), "residuals.geojson")
DBInterface.execute(con, "COPY (SELECT a.* EXCLUDE (geom), round(f.residual, 3) AS residual, a.geom FROM areas a JOIN fit f USING (i)) TO '$(rmap)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(rmap; name = "Residuals", column = "residual", opacity = 0.75)))
'''

