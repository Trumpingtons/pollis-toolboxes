# Spatial Lag and Error Models: least squares with Lagrange multiplier tests, and the spatial lag (SAR), spatial error (SEM),
# spatial lag of X (SLX) and spatial Durbin (SDM) models, with SpatialEconometrics.jl; the areas are read, and their
# neighbours found, through DuckDB's spatial extension. Replications of R spatialreg and of Bivand and Piras (2015).

[meta]
title = "Spatial Lag and Error Models"
viewType = "pollis.spatialreg"
defaultModel = "ols"
decisionFirstColumn = "Model"

[[packages]]
name = "SpatialEconometrics.jl"
# Fork of randsley/SpatialEconometrics.jl whose GWR and MGWR follow GWR4 and mgwr: Gaussian and exponential kernels without a cut-off, adaptive bandwidths counting the observation itself, AICc with n log(2 pi), golden section search and mgwr's back-fitting
