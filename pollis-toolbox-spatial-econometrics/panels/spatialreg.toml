ef = spatial_effects(m)
println("Spatial multiplier 1/(1 - rho) = ", round(multiplier, digits = 3))
println(rpad("variable", 14), rpad("first round", 14), rpad("x multiplier", 14), "total effect")
for k in 1:p
{{?model=sar}} 	start = m.coef[1 + k]  # beta: the change before it travels through the neighbours
{{?model=sdm}} 	start = m.coef[1 + k] + m.coef[1 + p + k]  # beta + theta: the change before it travels through the neighbours
	println(rpad(xnames[k], 14), rpad(round(start, digits = 4), 14), rpad(round(start * multiplier, digits = 4), 14), round(ef.total[k], digits = 4))
end
println("With row-standardised weights, the total effect is the first round times the multiplier")
