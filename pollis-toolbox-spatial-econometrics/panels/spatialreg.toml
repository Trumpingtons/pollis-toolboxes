[[actionGroups.actions]]
id = "replicate-article"
label = "Bivand and Piras (2015)"
desc = "Tables 2, 14, 17 and 18 of the article: least squares, the spatial lag and spatial error models, and the impacts, on its 3109 US counties, from the article's replication archive at the Journal of Statistical Software"
code = '''
using Downloads, p7zip_jll

let
	rcon = DBInterface.connect(DuckDB.DB)
	DBInterface.execute(rcon, "LOAD spatial")
	zip = joinpath(mktempdir(), "v063i18.zip")
	Downloads.download("https://www.jstatsoft.org/index.php/jss/article/download/v063i18/2971", zip)  # the article's replication archive
	DBInterface.execute(rcon, "CREATE TABLE counties AS SELECT row_number() OVER () AS i, * FROM ST_Read('/vsizip/$(zip)/ccountyR.shp')")  # GDAL reads the shapefile inside the zip
	cols(c) = Float64.(Tables.columntable(DBInterface.execute(rcon, "SELECT \"$c\"::DOUBLE AS v FROM counties ORDER BY i")).v)
	dir = mktempdir()
	run(pipeline(`$(p7zip_jll.p7zip()) e $(zip) -o$(dir) ccountyR_w.gal -y`, devnull))  # the queen contiguities of the counties
	Wg, ids = read_gal(joinpath(dir, "ccountyR_w.gal"))
	Wd = row_standardize(Wg)
	yd = cols("dui")
	Xd = hcat(cols("police"), cols("nondui"), cols("vehicles"), cols("dry"))
	nd = length(yd)
	function report(title, rows)
		println("\n", title)
		println(rpad("", 26), rpad("Julia", 14), rpad("article", 14), "difference")
		for (what, julia, published) in rows
			println(rpad(what, 26), rpad(round(julia, digits = 7), 14), rpad(published, 14), round(julia - published, sigdigits = 2))
		end
	end
	names = ["Intercept", "police", "nondui", "vehicles", "dry"]
	Xi = hcat(ones(nd), Xd)
	b = Xi \ yd
	e = yd - Xi * b
	se = sqrt.(diag(dot(e, e) / (nd - 5) * inv(transpose(Xi) * Xi)))
	report("Table 2, least squares (R lm)", [[(names[k], b[k], v) for (k, v) in enumerate([-5.4428237, 0.5990957, 0.0002746, 0.0156842, 0.1060904])];
		[("se " * names[k], se[k], v) for (k, v) in enumerate([0.229431, 0.014935, 0.001088, 0.000670, 0.035011])]])
	sar = fit_spatial(SAR(), Wd, Xd, yd; max_exact_n = 5000)  # exact log-determinants for the 3109 counties, as the article's eigenvalues
	ssar = sqrt.(diag(sar.vcov))
	report("Table 14, spatial lag model (R lagsarlm)", [[(names[k], sar.coef[k], v) for (k, v) in enumerate([-6.337479, 0.598157, 0.000249, 0.015711, 0.106131])];
		[("rho", sar.rho, 0.043423)]; [("se " * names[k], ssar[k], v) for (k, v) in enumerate([0.382022, 0.014908, 0.001086, 0.000668, 0.034931])];
		[("se rho", sar.rho_se, 0.014922), ("log-likelihood", sar.loglik, -2628.58)]])
	sem = fit_spatial_error(Wd, Xd, yd; max_exact_n = 5000)
	ssem = sqrt.(diag(sem.vcov))
	report("Table 17, spatial error model (R errorsarlm)", [[(names[k], sem.coef[k], v) for (k, v) in enumerate([-5.432939, 0.599777, 0.000258, 0.015619, 0.103890])];
		[("lambda", sem.lambda, 0.045856)]; [("se " * names[k], ssem[k], v) for (k, v) in enumerate([0.229072, 0.014891, 0.001087, 0.000667, 0.034967])];
		[("se lambda", sem.lambda_se, 0.029878)]])
	ef = spatial_effects(sar)
	report("Table 18, impacts of the spatial lag model (R)", [[("direct " * names[k + 1], ef.direct[k], v) for (k, v) in enumerate([0.598350, 0.000249, 0.015717, 0.106165])];
		[("total " * names[k + 1], ef.total[k], v) for (k, v) in enumerate([0.625310, 0.000261, 0.016425, 0.110948])]])
end
'''

[[actionGroups.actions]]
id = "replicate-columbus"
label = "Columbus Crime: R spatialreg"
desc = "Crime in the 49 neighbourhoods of Columbus, Ohio, explained by income and house value, from spData: every model of the panel beside the values of R's spatialreg and spdep, with queen contiguity"
code = '''
using Downloads

let
	rcon = DBInterface.connect(DuckDB.DB)
	DBInterface.execute(rcon, "LOAD spatial")
	file = joinpath(mktempdir(), "columbus.gpkg")
	Downloads.download("https://raw.githubusercontent.com/Nowosad/spData/master/inst/shapes/columbus.gpkg", file)  # spData, CC0
	DBInterface.execute(rcon, "CREATE TABLE areas AS SELECT row_number() OVER () AS i, * FROM ST_Read('$(file)')")
	cols(c) = Float64.(Tables.columntable(DBInterface.execute(rcon, "SELECT \"$c\"::DOUBLE AS v FROM areas ORDER BY i")).v)
	yc = cols("CRIME")
	Xc = hcat(cols("INC"), cols("HOVAL"))
	nc = length(yc)
	pairs = Tables.columntable(DBInterface.execute(rcon, "SELECT a.i, b.i AS j FROM areas a JOIN areas b ON a.i <> b.i AND ST_Intersects(a.geom, b.geom)"))  # queen contiguity, as poly2nb in R
	Wc = row_standardize(sparse(pairs.i, pairs.j, 1.0, nc, nc))
	function report(title, rows)
		println("\n", title)
		println(rpad("", 26), rpad("Julia", 14), rpad("R", 14), "difference")
		for (what, julia, published) in rows
			println(rpad(what, 26), rpad(round(julia, digits = 6), 14), rpad(published, 14), round(julia - published, sigdigits = 2))
		end
	end
	names = ["Intercept", "INC", "HOVAL"]
	Xi = hcat(ones(nc), Xc)
	b = Xi \ yc
	e = yc - Xi * b
	se = sqrt.(diag(dot(e, e) / (nc - 3) * inv(transpose(Xi) * Xi)))
	mi, z = moran_residuals(yc, Xi, Wc)
	lt = lm_tests(yc, Xi, Wc)
	report("Least squares (lm, lm.morantest, lm.RStests)", [[(names[k], b[k], v) for (k, v) in enumerate([68.61896, -1.597311, -0.273931])];
		[("se " * names[k], se[k], v) for (k, v) in enumerate([4.735486, 0.334131, 0.103199])];
		[("Moran's I of residuals", mi, 0.222109), ("z", z, 2.839319), ("LM error", lt.error.stat, 5.206214), ("LM lag", lt.lag.stat, 8.897999),
		("robust LM error", lt.robust_error.stat, 0.043906), ("robust LM lag", lt.robust_lag.stat, 3.735691)]])
	sar = fit_spatial(SAR(), Wc, Xc, yc)
	ssar = sqrt.(diag(sar.vcov))
	ef = spatial_effects(sar)
	report("Spatial lag model (lagsarlm, impacts)", [[(names[k], sar.coef[k], v) for (k, v) in enumerate([45.60325, -1.048728, -0.266335])];
		[("rho", sar.rho, 0.423325)]; [("se " * names[k], ssar[k], v) for (k, v) in enumerate([7.257404, 0.307406, 0.089096])];
		[("se rho", sar.rho_se, 0.11951), ("log-likelihood", sar.loglik, -182.674)];
		[("direct " * names[k + 1], ef.direct[k], v) for (k, v) in enumerate([-1.100895, -0.279583])];
		[("indirect " * names[k + 1], ef.indirect[k], v) for (k, v) in enumerate([-0.717683, -0.182263])]])
	sem = fit_spatial_error(Wc, Xc, yc)
	ssem = sqrt.(diag(sem.vcov))
	report("Spatial error model (errorsarlm)", [[(names[k], sem.coef[k], v) for (k, v) in enumerate([60.27947, -0.957305, -0.304559])];
		[("lambda", sem.lambda, 0.546753)]; [("se " * names[k], ssem[k], v) for (k, v) in enumerate([5.365594, 0.334231, 0.092047])];
		[("se lambda", sem.lambda_se, 0.138051), ("log-likelihood", sem.loglik, -183.7494)]])
	slx = fit_slx(Wc, Xc, yc)
	report("SLX model (lmSLX)", [(what, slx.coef[k], v) for (k, (what, v)) in enumerate(["Intercept" => 74.55343, "INC" => -1.09739, "HOVAL" => -0.29439, "lag INC" => -1.398746, "lag HOVAL" => 0.214841])])
	sdm = fit_spatial(SDM(), Wc, Xc, yc)
	ef = spatial_effects(sdm)
	report("Spatial Durbin model (lagsarlm, Durbin = TRUE)", [[(what, sdm.coef[k], v) for (k, (what, v)) in enumerate(["Intercept" => 44.32, "INC" => -0.919906, "HOVAL" => -0.297129, "lag INC" => -0.583913, "lag HOVAL" => 0.257684])];
		[("rho", sdm.rho, 0.403463), ("se rho", sdm.rho_se, 0.161334), ("log-likelihood", sdm.loglik, -181.6393)];
		[("direct " * names[k + 1], ef.direct[k], v) for (k, v) in enumerate([-1.024988, -0.281967])];
		[("indirect " * names[k + 1], ef.indirect[k], v) for (k, v) in enumerate([-1.495926, 0.215844])]])
end
'''

[[actionGroups.actions]]
id = "replicate-boston"
label = "Boston House Prices: R spatialreg"
desc = "The median house values of the 506 census tracts of Boston (Harrison and Rubinfeld, 1978, corrected by Gilley and Pace, 1996), from PollisDatasets: the model of Harrison and Rubinfeld, the tests and the spatial lag, error and Durbin models beside R's values, with queen contiguity"
code = '''
using PollisDatasets

let
	rcon = DBInterface.connect(DuckDB.DB)
	DBInterface.execute(rcon, "LOAD spatial")
	file = samplefile("boston_tracts.gpkg")  # the file of spData's boston_tracts, CC0
	DBInterface.execute(rcon, "CREATE TABLE tracts AS SELECT row_number() OVER () AS i, * FROM ST_Read('$(file)')")
	cols(c) = Float64.(Tables.columntable(DBInterface.execute(rcon, "SELECT \"$c\"::DOUBLE AS v FROM tracts ORDER BY i")).v)
	# The model of Harrison and Rubinfeld (1978): log(CMEDV) on 13 variables, some squared or in logs
	yb = log.(cols("CMEDV"))
	Xb = hcat(cols("CRIM"), cols("ZN"), cols("INDUS"), cols("CHAS"), cols("NOX") .^ 2, cols("RM") .^ 2, cols("AGE"), log.(cols("DIS")), log.(cols("RAD")), cols("TAX"), cols("PTRATIO"), cols("B"), log.(cols("LSTAT")))
	nb = length(yb)
	pairs = Tables.columntable(DBInterface.execute(rcon, "SELECT a.i, b.i AS j FROM tracts a JOIN tracts b ON a.i <> b.i AND ST_Intersects(a.geom, b.geom)"))  # queen contiguity, as poly2nb in R
	Wb = row_standardize(sparse(pairs.i, pairs.j, 1.0, nb, nb))
	function report(title, rows)
		println("\n", title)
		println(rpad("", 26), rpad("Julia", 14), rpad("R", 14), "difference")
		for (what, julia, published) in rows
			println(rpad(what, 26), rpad(round(julia, digits = 6), 14), rpad(published, 14), round(julia - published, sigdigits = 2))
		end
	end
	Xi = hcat(ones(nb), Xb)
	b = Xi \ yb
	e = yb - Xi * b
	mi, z = moran_residuals(yb, Xi, Wb)
	lt = lm_tests(yb, Xi, Wb)
	report("Least squares (lm, lm.morantest, lm.RStests)", [("Intercept", b[1], 4.562464), ("log(LSTAT)", b[14], -0.374895), ("log-likelihood", -nb / 2 * (log(2 * pi) + log(dot(e, e) / nb) + 1), 156.9788),
		("Moran's I of residuals", mi, 0.406682), ("z", z, 16.10539), ("LM error", lt.error.stat, 224.939688), ("LM lag", lt.lag.stat, 222.595622),
		("robust LM error", lt.robust_error.stat, 57.337026), ("robust LM lag", lt.robust_lag.stat, 54.99296)])
	sar = fit_spatial(SAR(), Wb, Xb, yb)
	ef = spatial_effects(sar)
	report("Spatial lag model (lagsarlm, impacts)", [("Intercept", sar.coef[1], 2.267616), ("CRIM", sar.coef[2], -0.007564), ("log(LSTAT)", sar.coef[14], -0.247399),
		("rho", sar.rho, 0.487356), ("se rho", sar.rho_se, 0.031095), ("log-likelihood", sar.loglik, 259.1874),
		("direct log(LSTAT)", ef.direct[13], -0.261106), ("indirect log(LSTAT)", ef.indirect[13], -0.221489)])
	sem = fit_spatial_error(Wb, Xb, yb)
	report("Spatial error model (errorsarlm)", [("Intercept", sem.coef[1], 3.814322), ("log(LSTAT)", sem.coef[14], -0.260021),
		("lambda", sem.lambda, 0.747892), ("se lambda", sem.lambda_se, 0.035346), ("log-likelihood", sem.loglik, 262.3411)])
	sdm = fit_spatial(SDM(), Wb, Xb, yb)
	ef = spatial_effects(sdm)
	report("Spatial Durbin model (lagsarlm, Durbin = TRUE)", [("Intercept", sdm.coef[1], 2.027665), ("rho", sdm.rho, 0.6116), ("se rho", sdm.rho_se, 0.044143),
		("log-likelihood", sdm.loglik, 289.9089), ("direct log(LSTAT)", ef.direct[13], -0.251883), ("indirect log(LSTAT)", ef.indirect[13], -0.27698)])
end
'''

