[[actionGroups.actions]]
id = "replicate-gwr4"
label = "Georgia Counties: GWR4"
desc = "The percentage with a bachelor's degree in Georgia's 159 counties on the percentages rural, in poverty and African American, with fixed bisquare and Gaussian kernels at GWR4's own bandwidths, beside GWR4's results kept in libpysal"
code = '''
using Downloads

let
	rcon = DBInterface.connect(DuckDB.DB)
	file = joinpath(mktempdir(), "GData_utm.csv")
	Downloads.download("https://raw.githubusercontent.com/pysal/libpysal/main/libpysal/examples/georgia/GData_utm.csv", file)  # libpysal, BSD-3
	DBInterface.execute(rcon, "CREATE TABLE georgia AS SELECT row_number() OVER () AS i, * FROM read_csv('$(file)')")
	cols(c) = Float64.(Tables.columntable(DBInterface.execute(rcon, "SELECT \"$c\"::DOUBLE AS v FROM georgia ORDER BY i")).v)
	yg = cols("PctBach")
	Xg = hcat(cols("PctRural"), cols("PctPov"), cols("PctBlack"))
	cg = hcat(cols("X"), cols("Y"))  # the county centroids, in UTM metres
	names = ["Intercept", "PctRural", "PctPov", "PctBlack"]
	function report(title, rows)
		println("\n", title)
		println(rpad("", 22), rpad("Julia", 14), rpad("GWR4", 14), "difference")
		for (what, julia, published) in rows
			println(rpad(what, 22), rpad(round(julia, digits = 6), 14), rpad(published, 14), round(julia - published, sigdigits = 2))
		end
	end
	# GWR4's summary files: georgia_BS_F_summary.txt and georgia_GS_F_summary.txt
	targets = [("Fixed bisquare, h = 209267.688808 m", BisquareKernel(), 209267.688808, 2012.563924, 16.722876, 894.982602, 0.607540,
			[23.100425, -0.115556, -0.284599, 0.058275], [17.723650, -0.197305, -0.772356, -0.075941], [30.349333, -0.054520, -0.072209, 0.308952]),
		("Fixed Gaussian, h = 87308.298470 m", GaussianKernel(), 87308.298470, 2030.010213, 16.304601, 895.290158, 0.604138,
			[23.315956, -0.116469, -0.290012, 0.053228], [18.016084, -0.185429, -0.661246, -0.064110], [29.440723, -0.058428, -0.100954, 0.222182])]
	for (title, kern, h, rss, trs, aicc, r2, means, mins, maxs) in targets
		g = fit_gwr(Xg, yg, cg; bandwidth = FixedBandwidth(h), kernel = kern, varnames = names[2:end])
		report(title, [[("RSS", sum(abs2, g.residuals), rss), ("tr(S)", g.hat_trace, trs), ("AICc", g.AICc, aicc), ("R-squared", g.R2, r2)];
			[("mean " * names[k], mean(g.coef_local[:, k]), means[k]) for k in 1:4];
			[("min " * names[k], minimum(g.coef_local[:, k]), mins[k]) for k in 1:4];
			[("max " * names[k], maximum(g.coef_local[:, k]), maxs[k]) for k in 1:4]])
	end
end
'''

[[actionGroups.actions]]
id = "replicate-article"
label = "Oshan and Coauthors (2019)"
desc = "Section 3 and 4.5.1 of Oshan, Li, Kang, Wolf and Fotheringham (2019): GWR of the percentage with a bachelor's degree in Georgia's 159 counties on the percentages foreign-born, African American and rural, with an adaptive bisquare kernel, and multiscale GWR on the standardised variables, beside the values the article prints from mgwr"
code = '''
using Downloads

let
	rcon = DBInterface.connect(DuckDB.DB)
	file = joinpath(mktempdir(), "GData_utm.csv")
	Downloads.download("https://raw.githubusercontent.com/pysal/libpysal/main/libpysal/examples/georgia/GData_utm.csv", file)  # libpysal, BSD-3
	DBInterface.execute(rcon, "CREATE TABLE georgia AS SELECT row_number() OVER () AS i, * FROM read_csv('$(file)')")
	cols(c) = Float64.(Tables.columntable(DBInterface.execute(rcon, "SELECT \"$c\"::DOUBLE AS v FROM georgia ORDER BY i")).v)
	yg = cols("PctBach")
	Xg = hcat(cols("PctFB"), cols("PctBlack"), cols("PctRural"))
	cg = hcat(cols("X"), cols("Y"))  # the county centroids, in UTM metres
	ng = length(yg)
	names = ["PctFB", "PctBlack", "PctRural"]
	function report(title, rows)
		println("\n", title)
		println(rpad("", 22), rpad("Julia", 16), rpad("article", 16), "difference")
		for (what, julia, published) in rows
			println(rpad(what, 22), rpad(round(julia, digits = 6), 16), rpad(published, 16), round(julia - published, sigdigits = 2))
		end
	end
	# GWR, adaptive bisquare: the bandwidth by AICc, then the fit at the article's 117 nearest counties
	selected = fit_gwr(Xg, yg, cg; kernel = BisquareKernel(), varnames = names)
	g = fit_gwr(Xg, yg, cg; bandwidth = AdaptiveBandwidth(117), kernel = BisquareKernel(), varnames = names)
	rss = sum(abs2, g.residuals)
	aic = 2 * ng * log(sqrt(rss / ng)) + ng * log(2 * pi) + ng + 2 * (g.hat_trace + 1)  # minus twice the log-likelihood, plus twice tr(S) and the variance
	report("GWR (sections 3.2 to 3.4)", [("bandwidth by AICc", selected.bandwidth, 117.0), ("RSS", rss, 1650.85969828), ("AIC", aic, 848.915407053),
		("AICc", g.AICc, 851.350292784), ("R-squared", g.R2, 0.678074266959)])
	# Multiscale GWR on the standardised variables, as numpy's std: divided by n
	zscore(v) = (v .- mean(v)) ./ std(v; corrected = false)
	mg = fit_mgwr(reduce(hcat, zscore.(eachcol(Xg))), zscore(yg), cg; kernel = BisquareKernel(), varnames = names)
	mg.converged || println("Back-fitting did not converge in ", mg.iterations, " iterations")
	report("Multiscale GWR bandwidths (section 4.5.1)", [(what, mg.bandwidths[k], v) for (k, (what, v)) in enumerate(["Intercept" => 92.0, "PctFB" => 101.0, "PctBlack" => 136.0, "PctRural" => 158.0])])
end
'''
