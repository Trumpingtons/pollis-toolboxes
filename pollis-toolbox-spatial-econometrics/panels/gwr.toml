[[faq]]
question = "Should I use a fixed or an adaptive bandwidth?"
answer = '''
A fixed bandwidth is the same distance everywhere, and suits areas of similar size spread evenly over the map, such as the cells of a grid. An adaptive bandwidth is a number of nearest areas, so each local regression has the same number of observations: it suits areas that are small and many in some places and large and few in others, such as counties or census tracts.
'''
wiki = "Kernels and Bandwidths"

[[faq]]
question = "How is the bandwidth chosen?"
answer = '''
With Bandwidth set to AICc, the panel chooses the bandwidth with the smallest corrected Akaike information criterion, which penalises the small bandwidths that make the model more complex. GWR, Fixed Bandwidth searches over distances by golden section; GWR, Adaptive and Multiscale GWR leave the search over numbers of nearest areas to SpatialEconometrics.jl. A number in Bandwidth fixes it instead.
'''
wiki = "Bandwidth Selection"

[[faq]]
question = "What does multiscale GWR add to GWR?"
answer = '''
GWR uses one bandwidth for every coefficient, so every relationship is assumed to vary at the same scale. Multiscale GWR gives each coefficient its own bandwidth: a small one for a relationship that varies locally, one close to the number of areas for a relationship that is nearly the same everywhere. Standardise the variables to compare the bandwidths between coefficients.
'''
wiki = "Multiscale GWR"

[[faq]]
question = "Are the local t-values of GWR significant at the usual 1.96?"
answer = '''
Not as they stand: GWR tests each coefficient at every area, so some local t-values exceed 1.96 by chance alone. da Silva and Fotheringham (2016) adjust the significance level by the effective number of parameters of the model, which gives a larger critical value; a Bonferroni correction for the number of areas is far too strict, because the local estimates are dependent.
'''
wiki = "Local Inference and Multiple Testing"

[[faq]]
question = "Why does the panel project the centroids before the fit?"
answer = '''
The kernels take Euclidean distances between coordinates, and Euclidean distances between longitudes and latitudes are distorted, as a degree of longitude covers fewer kilometres away from the equator. The panel moves the centroids into the Distance Coordinate System, a projected coordinate system in metres, so that distances, and a fixed bandwidth, are in metres.
'''
wiki = "Kernels and Bandwidths"
hidden = true

[[faq]]
question = "Which kernel does the panel use by default, and why?"
answer = '''
The bisquare kernel, which gives a weight of zero beyond the bandwidth, so that distant areas play no part in a local regression. The Gaussian and exponential kernels give every area some weight, however far. The adaptive bisquare kernel is also the default of mgwr in Python.
'''
wiki = "Kernels and Bandwidths"
hidden = true

[[faq]]
question = "What does it mean when back-fitting of multiscale GWR does not converge?"
answer = '''
Multiscale GWR is estimated by back-fitting, which updates each coefficient's surface and bandwidth in turn until they stop changing. If it stops at the maximum number of iterations first, the surfaces have not settled, and the Multiscale GWR tab prints a warning: its estimates are then unreliable.
'''
wiki = "Multiscale GWR"
hidden = true

[[faq]]
question = "How do I know whether a coefficient really varies over the map?"
answer = '''
A map of local estimates always shows some variation. Brunsdon, Fotheringham and Charlton (1996) test it by a Monte Carlo procedure: the observations are reassigned to random locations, the model refitted many times, and the variability of the local estimates on the real data compared with its distribution over the permutations.
'''
wiki = "Local Inference and Multiple Testing"
hidden = true

[[faq]]
question = "Which software are the panel's results checked against?"
answer = '''
GWR4, from its outputs for the Georgia counties kept in libpysal, and mgwr in Python, from the values printed in Oshan, Li, Kang, Wolf and Fotheringham (2019) for the same counties. The Replicate steps print Julia's values beside them.
'''
wiki = "Replications"
hidden = true

