[[actionGroups.actions]]
id = "replicate-munnell"
label = "Munnell's Production Function"
desc = "Millo and Piras (2012), pages 14 and 15: the gross product of the 48 continental US states, 1970 to 1986, on public capital, private capital, employment and unemployment, by a spatial error model with fixed effects of the states and with fixed effects of the years, the estimates and standard errors beside those splm printed"
models = ["semfe"]
code = '''
using PollisDatasets

let
	produc = dataset("produc")  # Munnell's data, from the R package plm
	states = sort(unique(produc.state))  # alphabetical: the order of the outlines and of the weights usaww of splm
	years = sort(unique(produc.year))
	Nu, Tu = length(states), length(years)
	row = Dict((produc.state[r], produc.year[r]) => r for r in eachindex(produc.year))
	order = [row[(s, year)] for year in years for s in states]  # year by year, the states varying fastest
	yu = log.(Float64.(produc.gsp[order]))  # log gross state product
	Xu = hcat(log.(Float64.(produc.pcap[order])), log.(Float64.(produc.pc[order])), log.(Float64.(produc.emp[order])), Float64.(produc.unemp[order]))
	names_u = ["log(pcap)", "log(pc)", "log(emp)", "unemp"]
	# usaww: queen contiguity of the states' outlines, Arizona and Colorado neighbours, each row summing to 1
	queen = Tables.columntable(DBInterface.execute(con, "WITH s AS (SELECT row_number() OVER (ORDER BY state) AS i, geom FROM ST_Read('$(samplefile("us_states.gpkg"))')) SELECT a.i, b.i AS j FROM s a JOIN s b ON a.i <> b.i AND ST_Intersects(a.geom, b.geom)"))
	Wu = row_standardize(sparse(queen.i, queen.j, 1.0, Nu, Nu))
	println(Nu, " states over ", Tu, " years, ", years[1], " to ", years[end])
	# splm's spml(log(gsp) ~ log(pcap) + log(pc) + log(emp) + unemp, model = "within", method = "eigen"), with its defaults lag = FALSE and spatial.error = "b": a spatial error model, whose parameter splm names rho
	for (title, fe_u, published, published_se) in (
			("Fixed effects of the states, page 14", IndivFE(),
				[0.5574013, 0.0051438, 0.2053026, 0.7822540, -0.0022317], [0.0330749, 0.0250109, 0.0231427, 0.0278057, 0.0010709]),
			("Fixed effects of the years, pages 14 and 15", TimeFE(),
				[0.4962301, 0.1432725, 0.3636539, 0.5619649, -0.0078930], [0.0357912, 0.0165720, 0.0109631, 0.0143684, 0.0018665]))
		# splm's direct approach: the data demeaned, then filtered, over all N T observations; the exact log-determinant, as its method = "eigen"
		fit = fit_spatial_error(fe_u, Wu, Xu, yu, Nu, Tu; varnames = names_u, method = ExactLU(), approach = DirectQML(bias_correct = false))
		se_u = sqrt.(max.(0.0, diag(fit.vcov)))
		shown = [length(fit.coef); 1:length(fit.coef) - 1]  # lambda first, as the article prints it
		println("\n", title)
		println(rpad("", 12), rpad("Julia", 12), rpad("Article", 12), rpad("Julia SE", 12), "Article SE")
		for (row_k, k) in enumerate(shown)
			label = k == length(fit.coef) ? "lambda" : fit.coefnames[k]
			println(rpad(label, 12), rpad(round(fit.coef[k], digits = 7), 12), rpad(published[row_k], 12), rpad(round(se_u[k], digits = 7), 12), published_se[row_k])
		end
	end
	println("\nThe article's rho is the spatial error parameter, lambda here")
end
'''

