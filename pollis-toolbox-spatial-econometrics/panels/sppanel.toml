[[faq]]
question = "When do the long-run effects of a dynamic spatial panel exist?"
answer = '''
Only when gamma, rho and eta sum to less than one, which the spectral radius of the system the model implies, printed on the Dynamic Panel tab, must show by being below one. As the sum approaches one the long-run effects diverge and their standard errors become unreliable well before that point.
'''
wiki = "Dynamic Spatial Panels"
hidden = true

[[faq]]
question = "Why is there no Driscoll–Kraay step on the SEM, Fixed Effects tab?"
answer = '''
SpatialEconometrics.jl computes Driscoll and Kraay's standard errors for the spatial lag and Durbin panels and for the dynamic panel, but not for the spatial error panel, so the step is offered only on the other three tabs.
'''
wiki = "SEM, Fixed Effects"
hidden = true

[[faq]]
question = "Which software and data are the panel's results checked against?"
answer = '''
splm, the R package of Millo and Piras (2012), on Munnell's data on the gross product of 48 US states from 1970 to 1986. The Munnell's Production Function step fits the article's two spatial error models, with fixed effects of the states and of the years, and prints Julia's estimates and standard errors beside those of the article.
'''
wiki = "Replications"
hidden = true
