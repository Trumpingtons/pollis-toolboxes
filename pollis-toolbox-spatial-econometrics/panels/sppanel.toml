[[faq]]
question = "Which fixed effects should I choose for a spatial panel?"
answer = '''
Fixed effects of the areas remove what is constant in each area over the periods, fixed effects of the periods what is common to all areas in each period, and Areas and Periods both. The documentation of SpatialEconometrics.jl calls the two together the usual specification for spatial panels, because a shock common to all areas in a period can otherwise pass for spatial dependence. With fixed effects of the areas a variable that does not change over time cannot be estimated. The Fixed-Effect Specifications step fits the tab's model under each choice.
'''
wiki = "Fixed Effects in Spatial Panels"

[[faq]]
question = "Should I use Lee and Yu's transformation or direct QML?"
answer = '''
Lee and Yu's transformation, the default. Lee and Yu (2010) show that estimating the fixed effects along with the other parameters leaves some estimators inconsistent or not properly centred, and their transformation removes the fixed effects with consistent, properly centred estimators. Direct QML demeans the data and corrects the bias afterwards; SpatialEconometrics.jl prefers the transformation unless the direct estimator is wanted specifically. The Lee and Yu Against Direct QML step sets them side by side.
'''
wiki = "Decision Guide"

[[faq]]
question = "How do I choose between the spatial lag, spatial error and spatial Durbin panels?"
answer = '''
Start with the Panel LM Tests, reading the joint test first, then the tests for a spatial lag and a spatial error. The spatial Durbin panel nests the other two: it reduces to the spatial lag panel when the coefficients of the spatially lagged explanatory variables are zero, and to the spatial error panel under the common factor restriction. The SAR, SEM and SDM step compares the three by AIC and BIC and tests both restrictions.
'''
wiki = "Decision Guide"

[[faq]]
question = "When should I use the Dynamic Panel tab?"
answer = '''
When the outcome persists from one period to the next. The dynamic spatial panel adds the area's own outcome and its neighbours' outcomes in the previous period to the spatial lag, separating persistence over time, gamma, from spillover in space, rho, and gives short-run and long-run effects. It needs fixed effects of the areas, and its estimates are corrected for the bias fixed effects leave with a lagged outcome. The Static Against Dynamic step compares the two on the same periods.
'''
wiki = "Dynamic Spatial Panels"

[[faq]]
question = "Why are the coefficients of the SAR and SDM tabs not the effects of the explanatory variables?"
answer = '''
Because a change in an explanatory variable in one area changes its outcome, which changes its neighbours' outcomes through rho, and through them its own again. The Direct, Indirect and Total Effects step summarises these changes by the direct effect, on an area's own outcome, the indirect effect, the spillover from the other areas, and the total effect, their sum, with delta-method standard errors. On the SEM tab the coefficients are the effects as they stand.
'''
wiki = "SAR, Fixed Effects"
hidden = true

[[faq]]
question = "Why does the Dynamic Panel tab stop with None or Periods as fixed effects?"
answer = '''
Because the dynamic spatial panel in SpatialEconometrics.jl treats only fixed effects of the areas, alone or with those of the periods, as meaningful choices, and adds no intercept. Choose Areas and Periods, or Areas, under Fixed Effects.
