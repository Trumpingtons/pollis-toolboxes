[[faq]]
question = "What does Learned Detection in Satellite Images compute?"
answer = '''
With Random Forest on Sentinel-2, Learned Detection in Satellite Images makes a composite of many Sentinel-2 scenes, the mean reflectance of ten bands at 10 m, and trains a random forest of 128 trees to tell the cells of known sites from cells away from them. With Enki, it reads an RGB image of 1 m and gives each cell of 350 m the share Enki's network gives it for a tell, with Enki's own weights or with its last layers trained again on the known sites. Cells above the Threshold are joined into features, each with its area, its roundness and its highest probability.
'''
wiki = "Factsheet"

[[faq]]
question = "What kind of sites can a Sentinel-2 composite show?"
answer = '''
A Sentinel-2 composite has cells of 10 m, so a site must be large, covering many cells, as the mounds of Orengo and 6 coauthors (2020) in Cholistan did, from under 5 ha to over 30 ha, or as hillforts do. The random forest sees no form at all: it learns the reflectance of the ground of the known sites, their soil, moisture and vegetation over the years. It finds ground like theirs, which may be a site or may be a field, a quarry or a village.
'''
wiki = "Overview"

[[faq]]
question = "Does Learned Detection in Satellite Images use a model trained by someone else?"
answer = '''
The random forest is not: it is trained each time on the known sites of Step 3, in the area of Step 1, as Orengo and 6 coauthors (2020) trained theirs on the mounds already known in Cholistan. Enki is: its author trained it on more than 21,500 images of Google and Bing imagery, centred on tells of the Ancient Near East or on other ground. Enki as Published uses those weights unchanged; Enki Fine-Tuned on Known Sites keeps its network and trains its last two layers again on the known sites of the area.
'''
wiki = "Overview"

[[faq]]
question = "What is Enki in Learned Detection in Satellite Images?"
answer = '''
Enki is a classifier of RGB images published by Rosati (2025): an EfficientNet-B0 network, with a layer of 256 units and a layer of two classes on top, trained to tell images of 350 by 350 m that contain a tell or a mound-like feature from images that do not. Learned Detection in Satellite Images reads Enki's published Keras file in Julia, without Python, and gives every cell of 350 m of the image Enki's share for a tell. Enki's README keeps the cells of 99% or more as candidates.
'''
wiki = "Enki on Imagery of 1 m"

[[faq]]
question = "How does the composite of Learned Detection in Satellite Images leave out clouds?"
right = "Each scene's cells that its scene classification marks as cloud, cloud shadow or cirrus are left out of the mean"
wrong = ["Scenes with any cloud over the area are left out whole", "The median of the scenes is taken, which ignores clouds", "Clouds are removed by a neural network before the mean is taken", "Only the clearest scene of each year is used", "Cells brighter than a threshold in the blue band are left out"]
explanation = "Sentinel-2 Level-2A comes with a scene classification: Step 2 leaves out of each scene the cells it marks as no data, saturated, cloud shadow, cloud of medium or high probability, or thin cirrus, and takes the mean of the rest. Step 1 also leaves out scenes with more clouds than the Maximum Cloud over the whole scene."
wiki = "Random Forest on Sentinel-2"
hidden = true

[[faq]]
question = "How long does the Random Forest on Sentinel-2 of Learned Detection in Satellite Images take on the example?"
right = "Several minutes for the composite, read once and saved, then seconds to train and run the random forest"
wrong = ["A few seconds for the composite, then hours to train the random forest", "About an hour for the composite, then hours to train the random forest", "A few seconds for everything, as the composite is downloaded ready-made", "About a minute to download a trained model, then seconds a tile", "A few minutes for each step, every time any input changes"]
explanation = "Step 2 reads only the cells of the area from each scene, a few seconds a scene, several at once when the Julia REPL has several threads: for the example, several minutes. It saves the composite to a GeoTIFF and reads it from there afterwards. Training the forest and running it take seconds to tens of seconds."
wiki = "Factsheet"
hidden = true

[[faq]]
question = "How was the Julia version of Enki in Learned Detection in Satellite Images checked?"
right = "Against Keras 3.8.0, the version that saved Enki, on eight of Enki's validation images: the shares agree to within about one ten-millionth"
wrong = ["It was not checked: the weights are read and used as they are", "Against PyTorch's EfficientNet-B0 trained on ImageNet", "By training it again from Enki's dataset and comparing the accuracy", "Against the shares printed in Enki's README for its test area", "By comparing its features with those of the random forest on the same area"]
explanation = "The Julia network was run on four positive and four negative images of Enki's validation set, and so was Enki's Keras file in Keras 3.8.0: the 1,280 pooled channels differ by at most 2.6e-6, and the shares for a tell by at most 1.2e-7."
wiki = "Enki on Imagery of 1 m"
hidden = true

[[faq]]
question = "What does Enki Fine-Tuned on Known Sites change in Enki?"
right = "Only the two layers on top, trained again on images of the known sites and of cells away from them; the EfficientNet-B0 network beneath is unchanged"
wrong = ["Every layer of the network, trained from the start on the known sites", "The threshold only, chosen to keep every known site", "The size of the cells, set to the size of the known sites", "The imagery, replaced by the Sentinel-2 composite", "Nothing: the known sites only check Enki's results"]
explanation = "The 1,280 pooled channels of each image are computed once by Enki's network, and the two dense layers on top start from Enki's weights and are trained with Adam, as the first stage of Enki's own training trained them. Enki's second stage, which trains part of the network too, is left out."
wiki = "Enki on Imagery of 1 m"
hidden = true

[[steps]]
id = "area"
title = "Area and Model"
intro = "Choose the model and the area. The random forest is trained on the known sites of the area, in a composite of Sentinel-2 scenes found in Earth Search's catalogue, which needs no account. Enki is a network its author trained on tells of the Ancient Near East, which reads imagery of 1 m: used as published, or with its last layers trained again on the known sites. Its trained weights, about 52 MB, are downloaded once."
code = '''
using ArchaeologicalDetection, SmartRegions, Rasters, ArchGDAL
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files
{{?method=forest}}box = ({{box}})  # west, south, east, north, in degrees
{{?method=forest}}scenes = sentinel_scenes(box; years = {{firstYear}}:{{lastYear}}, cloud = {{cloud}})
{{?method=forest}}println(length(scenes), " scenes with at most {{cloud}}% clouds, from ", minimum(s -> s.acquired, scenes)[1:10], " to ", maximum(s -> s.acquired, scenes)[1:10])
{{?method!=forest}}box = ({{enkiBox}})  # west, south, east, north, in degrees
{{?method!=forest}}enki = enki_model(enki_weights(folder))  # Enki's trained network, downloaded once to the folder
'''

[[steps.inputs]]
id = "method"
label = "Model"
kind = "select"
tooltip = "Random Forest on Sentinel-2 trains a random forest on the known sites, in a composite of Sentinel-2 at 10 m, after Orengo and 6 coauthors (2020). Enki as Published classifies cells of 350 m of an image of 1 m for tells with Enki's own weights (Rosati 2025). Enki Fine-Tuned on Known Sites trains Enki's last two layers again on the known sites first."
default = "forest"

[[steps.inputs.options]]
value = "forest"
label = "Random Forest on Sentinel-2"

[[steps.inputs.options]]
value = "tuned"
label = "Enki Fine-Tuned on Known Sites"

[[steps.inputs.options]]
value = "enki"
label = "Enki as Published"

[[steps.inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. A file given by an absolute path is read where it is. The composite or the image, the known sites and Enki's weights are kept there, and Steps 6 and 9 write there."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[steps.inputs]]
id = "box"
label = "Area (W, S, E, N)"
when = "method=forest"
tooltip = "The area, as west, south, east, north in degrees of longitude and latitude. The default is the Berkshire Downs, south-west of Oxford, 18 by 11 km, with four hillforts. Each scene is read for this area only, so a larger area takes longer."
default = "-1.66, 51.52, -1.40, 51.62"

[[steps.inputs]]
id = "enkiBox"
label = "Area (W, S, E, N)"
when = "method!=forest"
tooltip = "The area, as west, south, east, north in degrees of longitude and latitude. The default is around Tell Brak, in the Khabur basin of north-eastern Syria, 12.5 by 12 km, with ten placemarks named Tell. Enki reads a cell of 350 m in about a quarter of a second, so a larger area takes longer: the default has about 1,200 cells."
default = "41.02, 36.66, 41.16, 36.77"

[[steps.inputs]]
id = "firstYear"
label = "First Year"
when = "method=forest"
tooltip = "The first year of the scenes. Earth Search's Level-2A goes back to 2015, with most scenes from 2017."
default = "2024"

[[steps.inputs]]
id = "lastYear"
label = "Last Year"
when = "method=forest"
tooltip = "The last year of the scenes. More years give more scenes, so a steadier mean, and take longer to read."
default = "2025"

[[steps.inputs]]
id = "cloud"
label = "Maximum Cloud (%)"
when = "method=forest"
tooltip = "Scenes with more clouds than this share, over the whole scene, are left out. The clouds of the scenes kept are left out cell by cell in Step 2."
default = "20"

[[steps.inputs]]
id = "imageSource"
label = "Imagery Source"
kind = "select"
when = "method!=forest"
tooltip = "Where Step 2 reads the image of 1 m from. Esri World Imagery and Google's satellite map tiles need the user's own key, set on the Powered by line, and come under their terms, which are the user's to follow; their server learns where the area is. A WMS is any web map service of GDAL's WMS driver; a raster file of the user's own is a GeoTIFF or any raster GDAL reads, whose first three bands are red, green and blue."
default = "esri"

[[steps.inputs.options]]
value = "esri"
label = "Esri World Imagery (Your Key)"

[[steps.inputs.options]]
value = "google"
label = "Google Satellite (Your Key)"

[[steps.inputs.options]]
value = "wms"
label = "A WMS"

[[steps.inputs.options]]
value = "file"
label = "A Raster File of Your Own"

[[steps.inputs]]
id = "imageUrl"
label = "WMS or File"
when = "method!=forest&imageSource=wms|file"
tooltip = "For A WMS, the connection string of GDAL's WMS driver, starting WMS: and naming the layer, as WMS:https://example.org/wms?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=photo&SRS=EPSG:4326&BBOX=-180,-90,180,90. For A Raster File of Your Own, the path of the file."
default = ""

[[steps]]
id = "composite"
title = "Images"
intro = "Read the images the model works on. For the random forest, the multitemporal composite: at every cell of 10 m, the mean reflectance of each of ten bands over the scenes where the cell is clear, only the cells of the area read from each scene, several scenes at once when the Julia REPL has several threads. For Enki, an RGB image of 1 m, warped onto the UTM zone of the area. Either is saved, and read from the file afterwards."
code = '''
{{?method=forest}}composite = sentinel_composite(scenes, box; path = joinpath(folder, "{{compositeFile}}"))  # read from the file when it is there
{{?method!=forest}}{{?imageSource=esri|google}}image = aerial_image(box; source = :{{imageSource}}, path = joinpath(folder, "{{imageFile}}"))  # read from the file when it is there
{{?method!=forest}}{{?imageSource=wms}}image = aerial_image(box; source = raw"{{imageUrl}}", path = joinpath(folder, "{{imageFile}}"))  # read from the file when it is there
{{?method!=forest}}{{?imageSource=file}}image = aerial_image(box; source = expanduser(raw"{{imageUrl}}"), path = joinpath(folder, "{{imageFile}}"))  # read from the file when it is there
'''

[[steps.inputs]]
id = "compositeFile"
label = "Composite File"
when = "method=forest"
tooltip = "The GeoTIFF the composite is saved to, in the folder, or an absolute path. When the file is there, it is read and the scenes are not: give another name for another area or other years."
default = "berkshire-downs-sentinel2.tif"

[[steps.inputs]]
id = "imageFile"
label = "Image File"
when = "method!=forest"
tooltip = "The GeoTIFF the image of 1 m is saved to, in the folder, or an absolute path. When the file is there, it is read and the imagery is not: give another name for another area or another source."
default = "tell-brak-image.tif"

[[steps.sections]]
heading = "The Ten Bands of the Sentinel-2 Composite"
items = ["Blue (B2), green (B3), red (B4) and near infrared (B8), in cells of 10 m.", "Three red edge bands (B5, B6, B7), the narrow near infrared (B8A) and two short-wave infrared bands (B11, B12), in cells of 20 m, each 10 m cell taking the value of the nearest.", "Cells marked in a scene as cloud, cloud shadow, cirrus, saturated or no data are left out of that scene's part of the mean."]

[[steps.sections]]
heading = "The Image of Enki"
items = ["Red, green and blue, in cells of 1 m, as Enki's training images were.", "Map tiles are taken at the zoom level just finer than 1 m at the latitude of the area, and warped bilinearly onto the grid.", "Cells of the grid without imagery are black, and cells of 350 m that are black over half their area are left out."]

[[steps]]
id = "sites"
title = "Known Sites"
intro = "Read the known sites from a vector file. For the random forest, the cells of the composite inside polygons, or within a radius of points and lines, which teach it what a site looks like. For Enki, the centre of each site, around which images are cut to train its last layers, and which Interpret compares with the features."
code = '''
{{?method=forest}}{{?sitesFile=berkshire-downs-hillforts.gpkg}}using DuckDB
{{?method=forest}}sites_path = joinpath(folder, "{{sitesFile}}")  # an absolute path is kept as it is
{{?method=forest}}{{?sitesFile=berkshire-downs-hillforts.gpkg}}# Example file: the hillforts among Historic England's scheduled monuments in the area, from its open web service. Replace "berkshire-downs-hillforts.gpkg" with your own file of known sites.
{{?method=forest}}{{?sitesFile=berkshire-downs-hillforts.gpkg}}if !isfile(sites_path)
{{?method=forest}}{{?sitesFile=berkshire-downs-hillforts.gpkg}}	con = DBInterface.connect(DuckDB.DB)
{{?method=forest}}{{?sitesFile=berkshire-downs-hillforts.gpkg}}	DBInterface.execute(con, "LOAD spatial")
{{?method=forest}}{{?sitesFile=berkshire-downs-hillforts.gpkg}}	scheduled_monuments(con, box; crs = "EPSG:4326")
{{?method=forest}}{{?sitesFile=berkshire-downs-hillforts.gpkg}}	DBInterface.execute(con, "COPY (SELECT list_entry, name, geom FROM monuments WHERE name ILIKE '%hillfort%' OR name ILIKE '%promontory fort%') TO '$(sites_path)' WITH (FORMAT GDAL, DRIVER 'GPKG', SRS 'EPSG:4326')")
{{?method=forest}}{{?sitesFile=berkshire-downs-hillforts.gpkg}}end
{{?method=forest}}sites = site_cells(composite, sites_path; radius = {{radius}})
{{?method=forest}}println(count(sites), " cells of known sites")
{{?method!=forest}}{{?tellsFile=tell-brak-tells.gpkg}}using DuckDB, Downloads
{{?method!=forest}}sites_path = joinpath(folder, "{{tellsFile}}")  # an absolute path is kept as it is
{{?method!=forest}}{{?tellsFile=tell-brak-tells.gpkg}}# Example file: the placemarks named Tell in the area, from the Ancient Near East site placemarks of Pedersen (2007) on Zenodo. Replace "tell-brak-tells.gpkg" with your own file of known sites.
{{?method!=forest}}{{?tellsFile=tell-brak-tells.gpkg}}if !isfile(sites_path)
{{?method!=forest}}{{?tellsFile=tell-brak-tells.gpkg}}	kmz = joinpath(folder, "ANE.kmz")
{{?method!=forest}}{{?tellsFile=tell-brak-tells.gpkg}}	isfile(kmz) || Downloads.download("https://zenodo.org/records/6384045/files/ANE.kmz?download=1", kmz)
{{?method!=forest}}{{?tellsFile=tell-brak-tells.gpkg}}	con = DBInterface.connect(DuckDB.DB)
{{?method!=forest}}{{?tellsFile=tell-brak-tells.gpkg}}	DBInterface.execute(con, "LOAD spatial")
{{?method!=forest}}{{?tellsFile=tell-brak-tells.gpkg}}	DBInterface.execute(con, "COPY (SELECT Name AS name, geom FROM ST_Read('/vsizip/$(kmz)/doc.kml', layer = 'Sites') WHERE Name ILIKE '%tell%' AND ST_Intersects(geom, ST_MakeEnvelope($(box[1]), $(box[2]), $(box[3]), $(box[4])))) TO '$(sites_path)' WITH (FORMAT GDAL, DRIVER 'GPKG', SRS 'EPSG:4326')")
{{?method!=forest}}{{?tellsFile=tell-brak-tells.gpkg}}end
{{?method!=forest}}points = site_points(image, sites_path)  # the centre of each known site, in the coordinates of the image
{{?method!=forest}}println(length(points), " known sites in the image")
'''

[[steps.inputs]]
id = "sitesFile"
label = "Known Sites"
when = "method=forest"
tooltip = "A vector file of known sites (a GeoPackage, GeoJSON or Shapefile, in any coordinate system), in the folder, or an absolute path. With the default, berkshire-downs-hillforts.gpkg, the code first writes the hillforts among Historic England's scheduled monuments in the area, unless the folder has the file already."
default = "berkshire-downs-hillforts.gpkg"

[[steps.inputs]]
id = "radius"
label = "Radius (m)"
when = "method=forest"
tooltip = "Cells within this distance of a feature of the file are sites too, in metres: for points and lines, the size of a site. 0 takes the polygons as they are, and each point or line as half a cell."
default = "0"

[[steps.inputs]]
id = "tellsFile"
label = "Known Sites"
when = "method!=forest"
tooltip = "A vector file of known sites (a GeoPackage, GeoJSON, Shapefile or KML, in any coordinate system), in the folder, or an absolute path: the centre of each feature is taken. With the default, tell-brak-tells.gpkg, the code first writes the placemarks named Tell in the area, from the Ancient Near East site placemarks of Pedersen (2007), unless the folder has the file already."
default = "tell-brak-tells.gpkg"

[[steps]]
id = "train"
title = "Train the Model"
intro = "Train the model. The random forest of 128 trees, as Orengo and 6 coauthors (2020) did, on the cells of the known sites and on cells drawn at random away from them. Enki's network reads every cell of 350 m of the image once, the longest part, a quarter of a second a cell; Enki Fine-Tuned on Known Sites then trains its last two layers again on images centred on the known sites and on cells away from them."
code = '''
{{?method=forest}}model = forest_model(composite, sites; trees = {{trees}}, negatives = {{negatives}}, distance = {{distance}})
{{?method=forest}}println("Trained on ", model.positives, " cells of known sites and ", model.negatives, " cells at least {{distance}} m from them")
{{?method!=forest}}cells = enki_pooled(enki, image)  # the 1,280 channels Enki's network gives every cell of 350 m
{{?method=enki}}model = enki  # Enki's own weights, unchanged
{{?method=tuned}}examples = enki_examples(enki, image, cells, points; shift = {{shift}}, negatives = {{enkiNegatives}}, distance = {{enkiDistance}})
{{?method=tuned}}tuned = enki_finetune(enki, examples.pooled, examples.labels; epochs = {{epochs}})
{{?method=tuned}}model = tuned.model  # the last two layers of the epoch with the lowest loss on the images kept out
{{?method=tuned}}tuned.history  # the loss and accuracy of each epoch, on the images trained on and on those kept out
'''

[[steps.inputs]]
id = "trees"
label = "Trees"
when = "method=forest"
tooltip = "The number of trees of the random forest: 128 in Orengo and 6 coauthors (2020). More trees give smoother probabilities and take longer."
default = "128"

[[steps.inputs]]
id = "negatives"
label = "Negatives per Site Cell"
when = "method=forest"
tooltip = "How many cells away from the sites are drawn for each cell of a site, as the examples of what is not a site."
default = "10"

[[steps.inputs]]
id = "distance"
label = "Distance from Sites (m)"
when = "method=forest"
tooltip = "The negatives are drawn at least this far from every known site, in metres, so that the edges of a site, and the ground just around it, are not taught as not a site."
default = "500"

[[steps.inputs]]
id = "shift"
label = "Shift (m)"
when = "method=tuned"
tooltip = "Each known site gives nine images of 350 m: one centred on it, and eight centred this many metres from it to the north, south, east, west and the four corners, so that Enki also learns sites off the centre of a cell, as cells of the grid have them."
default = "50"

[[steps.inputs]]
id = "enkiNegatives"
label = "Negatives per Site Image"
when = "method=tuned"
tooltip = "How many cells of 350 m away from the sites are drawn for each image of a site, as the examples of what is not a site."
default = "5"

[[steps.inputs]]
id = "enkiDistance"
label = "Distance from Sites (m)"
when = "method=tuned"
tooltip = "The negatives are cells whose centre is at least this far from every known site, in metres: more than half a cell, 175 m, plus the Shift and the size of the sites, so that no negative shows a known site."
default = "700"

[[steps.inputs]]
id = "epochs"
label = "Epochs"
when = "method=tuned"
tooltip = "How many times the training goes through the images: 15 in Enki's own training of its last layers. A fifth of the images, drawn at random, are kept out, and the layers of the epoch with the lowest loss on them are kept."
default = "15"

[[steps]]
id = "run"
title = "Run the Model"
intro = "Run the model over every cell: for the random forest, the share of its 128 trees that vote for a site at each cell of 10 m; for Enki, the share its last layer gives a tell at each cell of 350 m, in seconds, as the network has read the cells in Step 4."
code = '''
{{?method=forest}}probability = forest_probability(model, composite)  # the share of the trees that vote for a site, at each cell
{{?method!=forest}}probability = enki_probability(model, cells)  # the share for a tell, at each cell of 350 m
'''

[[steps]]
id = "save-output"
title = "Save the Model's Output"
intro = "Save the probability map before any threshold is applied, so that the threshold can be changed later without training or running the model again, as a Cloud-Optimised GeoTIFF."

[[steps.actions]]
id = "save-probability"
label = "Probability Map as Cloud-Optimised GeoTIFF"
desc = "Write the probability map to a Cloud-Optimised GeoTIFF in the folder of the files, with DEFLATE compression, to open in a GIS beside other layers"
code = '''
{{?method=forest}}out = joinpath(folder, "forest-probability.tif")
{{?method=tuned}}out = joinpath(folder, "enki-tuned-probability.tif")
{{?method=enki}}out = joinpath(folder, "enki-probability.tif")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	write(out, Float32.(coalesce.(probability, NaN32)); driver = "COG", options = Dict("COMPRESS" => "DEFLATE"), missingval = NaN32)  # missing cells written as NaN
	println("Wrote ", out)
end
'''

[[steps]]
id = "features"
title = "Compute the Features"
intro = "The cells at or above the threshold are joined into regions through the sides of the cells. For Enki Fine-Tuned on Known Sites, the threshold is the one that keeps the Share of Cells. The minimum area and the minimum roundness then filter the regions, which are ranked by their highest probability."
code = '''
{{?method=forest}}found = forest_features(probability; threshold = {{threshold}}, min_area = {{minArea}}, min_roundness = {{minRoundness}});
{{?method=enki}}found = enki_features(probability; threshold = {{enkiThreshold}}, min_area = {{minArea}}, min_roundness = {{minRoundness}});
{{?method=tuned}}found = enki_features(probability; share = {{enkiShare}}, min_area = {{minArea}}, min_roundness = {{minRoundness}});
candidates = sort(found.candidates; by = c -> -c.probability);  # the features, ranked by their highest probability
println(length(candidates), " features")
candidates[1:min(15, end)]  # the first 15
'''

[[steps.inputs]]
id = "threshold"
label = "Threshold"
when = "method=forest"
tooltip = "The probability, from 0 to 1, a cell must reach to belong to a feature: 0.55 in Orengo and 6 coauthors (2020), as a compromise between finding small or partly covered sites and leaving out scattered cells."
default = "0.55"

[[steps.inputs]]
id = "enkiThreshold"
label = "Threshold"
when = "method=enki"
tooltip = "The share for a tell, from 0 to 1, a cell of 350 m must reach to belong to a feature: Enki's README keeps cells of 99% or more as candidates."
default = "0.99"

[[steps.inputs]]
id = "enkiShare"
label = "Share of Cells"
when = "method=tuned"
tooltip = "The share of the cells with imagery, from 0 to 1, kept for the features, those of highest share for a tell first. Enki trained again on known sites gives shares on a scale of its own, so Enki's 99% does not apply to it."
default = "0.1"

[[steps.inputs]]
id = "minArea"
label = "Minimum Area (m²)"
tooltip = "Features of this area or less are left out, in square metres: a cell of the composite is 100 m², a cell of Enki 122,500 m². 0 keeps every feature, single cells too."
default = "0"

[[steps.inputs]]
id = "minRoundness"
label = "Minimum Roundness"
tooltip = "Features of this roundness or less are left out: 4 pi times the area over the squared perimeter of the convex hull, 1 for a circle and 0.785 for a square. 0 keeps every feature."
default = "0"

[[steps]]
id = "look"
title = "Look at the Features"
intro = "See the features on the probability map, and for the random forest on two bands of the composite, beside imagery of the same ground, whole or around a place. The imagery is asked from the server of the source Imagery names, which learns where the area is."

[[steps.inputs]]
id = "zoomCentre"
label = "Zoom Centre"
when = "method=forest"
tooltip = "A point, as x, y in the coordinates of the composite (the UTM zone of the centre of the area), around which Zoom on the Place, on the maps of Zoom and Pan, looks: the default is Uffington Castle, in UTM zone 30 north."
default = "598983, 5715126"

[[steps.inputs]]
id = "enkiZoomCentre"
label = "Zoom Centre"
when = "method!=forest"
tooltip = "A point, as x, y in the coordinates of the image (the UTM zone of the centre of the area), around which Zoom on the Place, on the maps of Zoom and Pan, looks: the default is Tell Brak, in UTM zone 37 north."
default = "683913, 4059942"

[[steps.inputs]]
id = "zoomSize"
label = "Zoom Size (m)"
when = "method=forest"
tooltip = "The width of the square Zoom on the Place, on the maps of Zoom and Pan, goes to, in metres."
default = "1500"

[[steps.inputs]]
id = "enkiZoomSize"
label = "Zoom Size (m)"
when = "method!=forest"
tooltip = "The width of the square Zoom on the Place, on the maps of Zoom and Pan, goes to, in metres: 3,500 m are ten cells of Enki."
default = "3500"

[[steps.inputs]]
id = "imagery"
label = "Imagery"
kind = "select"
tooltip = "The imagery beside the maps. Automatic takes Google when a Google Maps key is set, otherwise Esri when an ArcGIS key is set, otherwise Sentinel-2: the keys are set on the Powered by line. Google and Esri need the user's own key and come under their terms, which are the user's to follow; EOX's Sentinel-2 cloudless of 2016 needs no key and is open (CC BY 4.0), but in cells of 10 m. The server of the imagery learns where the area is."
default = "auto"

[[steps.inputs.options]]
value = "auto"
label = "Automatic"

[[steps.inputs.options]]
value = "google"
label = "Google Satellite (Your Key)"

[[steps.inputs.options]]
value = "esri"
label = "Esri World Imagery (Your Key)"

[[steps.inputs.options]]
value = "sentinel"
label = "Sentinel-2 Cloudless, 10 m"

[[steps.inputs.options]]
value = "none"
label = "None"

[[steps.actions]]
id = "zoom"
label = "Zoom and Pan"
desc = "The probability of a site, and for the random forest the near infrared (B8) and the short-wave infrared (B11) of the composite, as separate maps, side by side with aerial or satellite imagery of the same ground, from the source Imagery names, with each feature outlined in yellow, on the whole area: the hand moves the maps together, + and − zoom them, Zoom on the Place goes to the square of the Zoom Size around the Zoom Centre and Reset back to the whole area, with a scale bar and N, E, S and W"
code = '''
{{?method=forest}}x0, y0 = {{zoomCentre}}
{{?method=forest}}d = {{zoomSize}} / 2
{{?method!=forest}}x0, y0 = {{enkiZoomCentre}}
{{?method!=forest}}d = {{enkiZoomSize}} / 2
println(count(c -> abs(c.x - x0) <= d && abs(c.y - y0) <= d, candidates), " features within ", d, " m of ", x0, ", ", y0)
{{?method=forest}}Pollis.browse(terrain_maps("Learned Detection in Satellite Images",
{{?method=forest}}	"Probability of a Site" => probability,
{{?method=forest}}	"Near Infrared (B8)" => (composite[Band(7)], 0.1, 0.4),
{{?method=forest}}	"Short-Wave Infrared (B11)" => (composite[Band(9)], 0.1, 0.35);
{{?method=forest}}	labels = found.labels, centre = (x0, y0), width = 2d, imagery = :{{imagery}}))
{{?method!=forest}}Pollis.browse(terrain_maps("Learned Detection in Satellite Images", "Share for a Tell" => probability;
{{?method!=forest}}	labels = found.labels, centre = (x0, y0), width = 2d, imagery = :{{imagery}}))
'''

[[steps]]
id = "save"
title = "Save Features"
intro = "Write the features for a GIS: the outline of each, with its area, its roundness and its probability."

[[steps.actions]]
id = "save-features"
label = "Features as GeoPackage"
desc = "Write the features as outlines with their measures to a GeoPackage in the folder of the files, to open in a GIS beside the probability map"
code = '''
using DuckDB
con = DBInterface.connect(DuckDB.DB)
DBInterface.execute(con, "LOAD spatial")
{{?method=forest}}out = save_candidates(con, candidates, joinpath(folder, "forest-features.gpkg"); crs = probability, labels = found.labels)
{{?method=tuned}}out = save_candidates(con, candidates, joinpath(folder, "enki-tuned-features.gpkg"); crs = probability, labels = found.labels)
{{?method=enki}}out = save_candidates(con, candidates, joinpath(folder, "enki-features.gpkg"); crs = probability, labels = found.labels)
println("Wrote ", length(candidates), " features to ", out)
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "known"
label = "Features and Known Sites"
desc = "Which known sites a feature meets, and how many features meet none: the features away from the known sites are the new candidates, while those on them show that the model finds the sites it knows, or, for a model trained on them, only that it learned them"
code = '''
{{?method=forest}}met = Set(parent(found.labels)[parent(sites) .& (parent(found.labels) .> 0)])  # the features with a cell on a known site
{{?method!=forest}}(west, east), (south, north) = Rasters.bounds(found.labels, X), Rasters.bounds(found.labels, Y)
{{?method!=forest}}on = [found.labels[X(Contains(x)), Y(Contains(y))] for (x, y) in points if west <= x < east && south < y <= north]  # the feature of each known site's cell, 0 for none
{{?method!=forest}}println(count(>(0), on), " of ", length(on), " known sites in a feature")
{{?method!=forest}}met = Set(filter(>(0), on))  # the features with a known site
away = filter(c -> !(c.id in met), candidates)
println(length(candidates) - length(away), " of ", length(candidates), " features meet a known site; ", length(away), " meet none")
away[1:min(15, end)]  # the first 15 features away from the known sites, by probability
'''

[[actionGroups.actions]]
id = "monuments"
label = "Features and Scheduled Monuments"
when = "method=forest"
desc = "The scheduled monuments of Historic England's National Heritage List for England within the area, from its open web service, with the features that meet each and the features that meet none (in England only)"
code = '''
using DuckDB
con = DBInterface.connect(DuckDB.DB)
DBInterface.execute(con, "LOAD spatial")
scheduled_monuments(con, probability)  # the table monuments, in the coordinates of the composite
candidates_table(con, candidates; crs = probability, labels = found.labels)  # the table candidates, the outline of each feature
met = [(list_entry = r.list_entry, name = r.name, features = r.n) for r in DBInterface.execute(con, "SELECT m.list_entry, m.name, count(c.id) AS n FROM monuments m LEFT JOIN candidates c ON ST_Intersects(m.geom, c.geom) GROUP BY ALL ORDER BY n DESC")]
apart = only(DBInterface.execute(con, "SELECT count(*) AS n FROM candidates c WHERE NOT EXISTS (SELECT 1 FROM monuments m WHERE ST_Intersects(m.geom, c.geom))")).n
println(length(met), " scheduled monuments in the area, ", count(r -> r.features > 0, met), " met by a feature; ", apart, " of ", length(candidates), " features meet no monument")
met
'''
