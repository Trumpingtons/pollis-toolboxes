# Learned Detection in Satellite Images: a random forest trained on known sites in a multitemporal Sentinel-2 composite, after Orengo and 6 coauthors (2020), or Enki, an EfficientNet-B0 classifier of 1 m RGB imagery for tells (Rosati 2025), as published or with its head trained again on known sites; run in Julia with ArchaeologicalDetection.jl, DecisionTree.jl and NNlib.jl, the scenes and the imagery read with ArchGDAL.jl and Rasters.jl, and SmartRegions.jl for the outlines and the scheduled monuments

[meta]
title = "Learned Detection in Satellite Images"
viewType = "pollis.learnedsatellite"
style = "timeArrow"
