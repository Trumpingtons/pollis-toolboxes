# Terrain Model from Point Cloud: a bare-earth terrain model made from a lidar point cloud, the ground kept as the survey classified it or found again with a morphological filter, the cells without ground filled from the cells around them, checked against the density of the ground points, and saved for Relief Visualisation, Candidate Features and Learned Detection in Lidar; read with PDAL_jll.jl and LazIO.jl, computed with ArchaeologicalDetection.jl, Geomorphometry.jl and NearestNeighbors.jl

[meta]
title = "Terrain Model from Point Cloud"
viewType = "pollis.pointcloud"
style = "timeArrow"
intro = "Make a bare-earth terrain model from a lidar point cloud: read the points of a survey, keep or find its ground, fill the cells without ground, see where the model stands on few ground points, and save it as the Terrain Model of the other panels of Archaeological Prospection. A step first runs the steps before it that have not run in the Julia REPL as they are now, so a new distance does not read the points again."

