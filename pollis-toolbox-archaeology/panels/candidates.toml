# Candidate Features: places in a lidar terrain model shaped like earthworks (mounds, pits, ring ditches, banks and ditches), found by inverse depression analysis, depression filling, template matching, or a threshold with shape rules, for archaeological prospection, with SmartRegions.jl and Rasters.jl

