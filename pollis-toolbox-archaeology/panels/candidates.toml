detail = "Inverse depression analysis: the surface turned upside down and its depressions filled; the regions higher than a minimum, of the right area and roundness"

[[bullets]]
text = "Pits and Hollows"
detail = "The depressions of the surface filled to their spill height; the regions deeper than a minimum, of the right area and roundness"

