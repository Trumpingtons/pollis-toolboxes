[[decisionRows]]
task = "Mounds"
context = "Raised, closed forms"
purpose = "Barrows, mounds and spoil heaps of any size, with their height above the ground they stand on"

[[decisionRows]]
task = "Pits and Hollows"
context = "Sunken, closed forms"
purpose = "Pits, hollows, kilns and shafts, with their depth below the rim"

[[decisionRows]]
task = "Template Matching"
context = "A known shape"
purpose = "Features of one shape and size, such as pits or ring ditches, scored by how closely they match"

[[decisionRows]]
task = "Threshold and Shape"
context = "Long features"
purpose = "Banks, ditches and hollow ways as well as round features, from one threshold on the local relief"

[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. A file given by an absolute path is read where it is. The Export steps write there."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[inputs]]
id = "demFile"
label = "Terrain Model"
tooltip = "A GeoTIFF of a bare-earth terrain model in metres, in the folder above, or an absolute path, in a projected coordinate system with square cells. With the default, wandlebury-dtm.tif, the example first reads the Environment Agency's 1 m lidar terrain model of 2 x 2 km south-east of Cambridge from its Web Coverage Service, unless the folder has the file already."
default = "wandlebury-dtm.tif"

[[inputs]]
id = "trendRadius"
label = "Trend Radius (m)"
tooltip = "The radius of the window whose mean height is the trend of the local relief model, in metres: forms wider than about twice this are taken as landform. Template Matching and Threshold and Shape search the local relief model; the depression tabs search it when Surface is Local Relief Model."
default = "20"
newRow = true

[[inputs]]
id = "surface"
label = "Surface"
kind = "select"
tooltip = "Local Relief Model: the depressions are sought after the landform is removed, so that mounds on hills and pits on slopes are found. Terrain Model: the heights themselves, as inverse depression analysis was first used on flat ground."
default = "lrm"
models = ["mounds", "pits"]

[[inputs.options]]
value = "lrm"
label = "Local Relief Model"

[[inputs.options]]
value = "dtm"
label = "Terrain Model"

[[inputs]]
id = "minHeight"
label = "Minimum Height (m)"
tooltip = "The height of a mound above its spill level, or the depth of a pit below it, that a cell must exceed to belong to a candidate, in metres."
default = "0.2"
models = ["mounds", "pits"]
newRow = true

[[inputs]]
id = "minRoundness"
label = "Minimum Roundness"
tooltip = "The ratio of the short to the long axis that a candidate must reach, from 0 to 1: 1 is a circle. 0.5 keeps forms up to twice as long as they are wide."
default = "0.5"
models = ["mounds", "pits"]

[[inputs]]
id = "templateShape"
label = "Template"
kind = "select"
tooltip = "Mound: a half-dome within a flat ring. Pit: the same, sunken. Ring Ditch: a ditch around a ring, with level ground inside and out."
default = "mound"
models = ["template"]
newRow = true

[[inputs.options]]
value = "mound"
label = "Mound"

[[inputs.options]]
value = "pit"
label = "Pit"

[[inputs.options]]
value = "ring"
label = "Ring Ditch"

[[inputs]]
id = "radii"
label = "Radii (m)"
tooltip = "The radii of the templates, in metres, separated by commas: each cell keeps the radius that matches best."
default = "3, 5, 8, 12"
models = ["template"]

[[inputs]]
id = "minScore"
label = "Minimum Score"
tooltip = "The normalised cross-correlation a place must reach to be a candidate, from -1 to 1. Ring ditches score lower than mounds and pits: try 0.5."
default = "0.7"
models = ["template"]

[[inputs]]
id = "side"
label = "Side"
kind = "select"
tooltip = "Raised: the ground more than the threshold above the trend. Sunken: more than the threshold below it."
default = "raised"
models = ["shape"]
newRow = true

[[inputs.options]]
value = "raised"
label = "Raised"

[[inputs.options]]
value = "sunken"
label = "Sunken"

[[inputs]]
id = "threshold"
label = "Threshold (m)"
tooltip = "How far above or below the trend, in metres, the ground must lie to belong to a region."
default = "0.25"
models = ["shape"]

[[inputs]]
id = "shapeKind"
label = "Shape"
kind = "select"
tooltip = "Round: roundness of at least 0.5, for mounds, pits and enclosures. Long: roundness of at most 0.25, for banks, ditches and hollow ways. Any: every region within the areas."
default = "round"
models = ["shape"]

[[inputs.options]]
value = "round"
label = "Round"

[[inputs.options]]
value = "long"
label = "Long"

[[inputs.options]]
value = "any"
label = "Any"

[[inputs]]
id = "minArea"
label = "Minimum Area (m²)"
tooltip = "The smallest area a candidate may have, in square metres: smaller regions are usually noise of the terrain model."
default = "20"
models = ["mounds", "pits", "shape"]
newRow = true

[[inputs]]
id = "maxArea"
label = "Maximum Area (m²)"
tooltip = "The largest area a candidate may have, in square metres: larger regions are usually landforms."
default = "5000"
models = ["mounds", "pits", "shape"]

[[inputs]]
id = "zoomCentre"
label = "Zoom Centre"
tooltip = "A point, as x, y in the coordinates of the terrain model, around which Zoom on the Place, on the maps of Zoom and Pan, and Profile Through a Place look: the default is the Wormwood Hill tumulus, in British National Grid."
default = "549716, 252899"
newRow = true

[[inputs]]
id = "zoomSize"
label = "Zoom Size (m)"
tooltip = "The width of the square Zoom on the Place, on the maps of Zoom and Pan, goes to, and the length of the line Profile Through a Place follows, in metres."
default = "300"

[[inputs]]
id = "imagery"
label = "Imagery"
kind = "select"
tooltip = "The imagery beside the maps. Automatic takes Google when a Google Maps key is set, otherwise Esri when an ArcGIS key is set, otherwise Sentinel-2: the keys are set on the Powered by line. Google and Esri need the user's own key and come under their terms, which are the user's to follow; EOX's Sentinel-2 cloudless of 2016 needs no key and is open (CC BY 4.0), but in cells of 10 m. The server of the imagery learns where the terrain model is."
default = "auto"

[[inputs.options]]
value = "auto"
label = "Automatic"

[[inputs.options]]
value = "google"
label = "Google Satellite (Your Key)"

[[inputs.options]]
value = "esri"
label = "Esri World Imagery (Your Key)"

[[inputs.options]]
value = "sentinel"
label = "Sentinel-2 Cloudless, 10 m"

[[inputs.options]]
value = "none"
label = "None"

[[codeBranches]]
model = "*"
code = '''
using SmartRegions, Rasters, ArchGDAL
{{?demFile=wandlebury-dtm.tif}}using Downloads: download
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files
dem_path = joinpath(folder, "{{demFile}}")  # an absolute path is kept as it is
{{?demFile=wandlebury-dtm.tif}}# Example file: the Environment Agency's 1 m lidar terrain model of 2 x 2 km south-east of Cambridge, from its Web Coverage Service. Replace "wandlebury-dtm.tif" with your own GeoTIFF.
{{?demFile=wandlebury-dtm.tif}}isfile(dem_path) || download("https://environment.data.gov.uk/spatialdata/lidar-composite-digital-terrain-model-dtm-1m/wcs?service=WCS&version=2.0.1&request=GetCoverage&CoverageId=13787b9a-26a4-4775-8523-806d13af58fc__Lidar_Composite_Elevation_DTM_1m&format=image%2Fgeotiff&subset=E%28548400%2C550400%29&subset=N%28252400%2C254400%29", dem_path)
dem = replace_missing(read(Raster(dem_path; lazy = true)), NaN32)
lrm = local_relief(dem; radius = {{trendRadius}})  # the local relief model, in metres: the heights less their mean within the trend radius
{{?model=mounds}}{{?surface=lrm}}found = find_mounds(lrm; min_height = {{minHeight}}, area = ({{minArea}}, {{maxArea}}), min_roundness = {{minRoundness}})  # inverse depression analysis
{{?model=mounds}}{{?surface=dtm}}found = find_mounds(dem; min_height = {{minHeight}}, area = ({{minArea}}, {{maxArea}}), min_roundness = {{minRoundness}})  # inverse depression analysis
{{?model=pits}}{{?surface=lrm}}found = find_pits(lrm; min_depth = {{minHeight}}, area = ({{minArea}}, {{maxArea}}), min_roundness = {{minRoundness}})  # depression filling
{{?model=pits}}{{?surface=dtm}}found = find_pits(dem; min_depth = {{minHeight}}, area = ({{minArea}}, {{maxArea}}), min_roundness = {{minRoundness}})  # depression filling
{{?model=template}}found = find_templates(lrm; shape = :{{templateShape}}, radii = [{{radii}}], min_score = {{minScore}})  # template matching
{{?model=shape}}found = find_regions(lrm; threshold = {{threshold}}, side = :{{side}}, shape = :{{shapeKind}}, area = ({{minArea}}, {{maxArea}}))  # threshold and shape
candidates = found.candidates
println(length(candidates), " candidates")
candidates
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "zoom"
label = "Zoom and Pan"
desc = "The local relief model in grey from -0.5 to 0.5 m beside aerial or satellite imagery of the same ground, from the source Imagery names, with the outline of each candidate in yellow, on the whole area: the hand moves the maps together, + and − zoom them, Zoom on the Place goes to the square of the Zoom Size around the Zoom Centre and Reset back to the whole area, with a scale bar and N, E, S and W"
code = '''
x0, y0 = {{zoomCentre}}
d = {{zoomSize}} / 2
println(count(c -> abs(c.x - x0) <= d && abs(c.y - y0) <= d, candidates), " candidates within ", d, " m of ", x0, ", ", y0)
Pollis.browse(terrain_maps("Candidate Features", "Local Relief Model" => (lrm, -0.5, 0.5); labels = found.labels, centre = (x0, y0), width = 2d, imagery = :{{imagery}}))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "highest"
label = "Highest Candidates"
desc = "The 15 candidates highest above or deepest below their surroundings (the best scores, for Template Matching), with their position, size and shape"
code = '''
{{?model=template}}sort(candidates; by = c -> -c.score)[1:min(15, end)]
{{?model=mounds|pits|shape}}sort(candidates; by = c -> -abs(c.height))[1:min(15, end)]
'''

[[actionGroups.actions]]
id = "monuments"
label = "Candidates and Scheduled Monuments"
desc = "The scheduled monuments of Historic England's National Heritage List for England within the terrain model, from its open web service, with the candidates that meet each and the candidates that meet none (in England only)"
code = '''
using DuckDB
con = DBInterface.connect(DuckDB.DB)
DBInterface.execute(con, "LOAD spatial")
scheduled_monuments(con, dem)  # the table monuments, in the coordinates of the terrain model
candidates_table(con, candidates; crs = dem, labels = found.labels)  # the table candidates, the outline of each
met = [(list_entry = r.list_entry, name = r.name, candidates = r.n) for r in DBInterface.execute(con, "SELECT m.list_entry, m.name, count(c.id) AS n FROM monuments m LEFT JOIN candidates c ON ST_Intersects(m.geom, c.geom) GROUP BY ALL ORDER BY n DESC")]
apart = only(DBInterface.execute(con, "SELECT count(*) AS n FROM candidates c WHERE NOT EXISTS (SELECT 1 FROM monuments m WHERE ST_Intersects(m.geom, c.geom))")).n
println(length(met), " scheduled monuments in the area, ", count(r -> r.candidates > 0, met), " met by a candidate; ", apart, " of ", length(candidates), " candidates meet no monument")
met
'''

[[actionGroups.actions]]
id = "profile"
label = "Profile Through a Place"
desc = "The height and the local relief along a line from west to east through the Zoom Centre, as long as the Zoom Size, every 5 m, with the candidate each point lies in (0 for none)"
code = '''
x0, y0 = {{zoomCentre}}
at(r, x) = r[X(Near(x)), Y(Near(y0))]
[(x = x, height = round(at(dem, x), digits = 2), local_relief = round(coalesce(at(lrm, x), NaN), digits = 2), candidate = at(found.labels, x)) for x in x0 - {{zoomSize}} / 2:5:x0 + {{zoomSize}} / 2]
'''

[[actionGroups]]
id = "export"
label = "Export"

[[actionGroups.actions]]
id = "save-candidates"
label = "Save the Candidates as GeoPackage"
desc = "Write the candidates as outlines with their measures to a GeoPackage in the folder of the files, to open in a GIS beside the terrain model"
code = '''
using DuckDB
con = DBInterface.connect(DuckDB.DB)
DBInterface.execute(con, "LOAD spatial")
out = save_candidates(con, candidates, joinpath(folder, "candidates-{{model}}.gpkg"); crs = dem, labels = found.labels)
println("Wrote ", length(candidates), " candidates to ", out)
'''
