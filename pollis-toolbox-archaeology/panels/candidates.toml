[[faq]]
question = "What is a candidate feature?"
answer = '''
A candidate feature is a place in a terrain model whose shape matches a rule for an earthwork: a mound, a pit, a ring ditch, a bank or a ditch. Each candidate has a position, an area, a height or depth and a measure of shape. A candidate is not a site: drains, quarries, tree throws and errors of the terrain model match the same rules, so every candidate is a place to check against maps, records and the ground.
'''
wiki = "Overview"

[[faq]]
question = "How does inverse depression analysis find mounds?"
answer = '''
Turned upside down, a mound becomes a depression. Inverse depression analysis negates the surface, fills every depression up to the height at which it would spill, and takes the depth of the filling as the height of the mound. The regions higher than the Minimum Height are kept when their area and roundness lie within the limits. The same filling on the surface the right way up finds pits and hollows.
'''
wiki = "Depressions: Mounds and Pits"

[[faq]]
question = "What does template matching measure?"
answer = '''
Template matching slides a small model of a feature, here a half-dome for a mound, its negative for a pit, or a ditch around a ring, over the local relief model, and computes at each cell the normalised cross-correlation between the model and the ground around the cell. The score runs from -1 to 1 and does not depend on the height of the feature, only on its shape. Templates of several radii are tried, and the best score is kept.
'''
wiki = "Template Matching"

[[faq]]
question = "Why search the local relief model rather than the terrain model?"
answer = '''
A mound on a hilltop, or a pit on a slope, is part of a larger landform. On the terrain model itself, the filling of the upside-down hill swallows the mound, and the filling of a valley swallows the pit. The local relief model removes the landform first, so that the filling and the thresholds see the feature alone. The Surface input keeps the terrain model as an option, as inverse depression analysis was first used on flat ground.
'''
wiki = "Decision Guide"
hidden = true

[[faq]]
question = "How are candidates checked against known sites?"
answer = '''
Candidates and Scheduled Monuments reads the scheduled monuments of the National Heritage List for England within the terrain model from Historic England's open web service, and counts for each monument the candidates whose outlines meet its boundary, and the candidates that meet none. A monument with no candidate shows what the rules miss; candidates that meet no monument are either unknown features or false alarms, which only the records and the ground can tell apart.
'''
wiki = "Diagnostics"
hidden = true

[[faq]]
question = "What does the roundness of a candidate measure?"
answer = '''
Roundness is the ratio of the short to the long axis of the ellipse with the same second moments as the cells of the candidate: 1 for a circle, near 0 for a long, thin region. Mounds, pits and barrows are round; banks, ditches and hollow ways are long. The Minimum Roundness input of the depression tabs, and the Shape input of Threshold and Shape, use it to keep one kind or the other.
'''
wiki = "Threshold and Shape"
hidden = true

