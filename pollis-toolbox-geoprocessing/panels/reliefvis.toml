[[decisionRows]]
task = "Local Relief Model"
context = "Heights of features"
purpose = "Measure how high a bank or how deep a ditch is, and map features on any slope"

[[decisionRows]]
task = "Sky-View and Openness"
context = "Shape, any direction"
purpose = "Bring out ditches, banks and mounds whatever their direction, without a light"

[[decisionRows]]
task = "Shaded Relief"
context = "Familiar view"
purpose = "See the landscape as a relief map, and check features against a light"

[[decisionRows]]
task = "Layered Image"
context = "One image for all"
purpose = "Map features on flat and steep ground at once, on screen or in the field"

[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. A file given by an absolute path is read where it is. The Export steps write there."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[inputs]]
id = "demFile"
label = "Terrain Model"
tooltip = "A GeoTIFF of a bare-earth terrain model in metres, in the folder above, or an absolute path, in a projected coordinate system with square cells. With the default, wandlebury-dtm.tif, the example first reads the Environment Agency's 1 m lidar terrain model of 2 x 2 km around Wandlebury Ring, south-east of Cambridge, from its Web Coverage Service, unless the folder has wandlebury-dtm.tif already."
default = "wandlebury-dtm.tif"

[[inputs]]
id = "trendRadius"
label = "Trend Radius (m)"
tooltip = "The radius of the window whose mean height is the trend, in metres: the local relief model keeps forms smaller than about one and a half times this. RVT takes 10 to 50 cells; 20 m suits mounds and ditches."
default = "20"
models = ["lrm"]
newRow = true

[[inputs]]
id = "skyMeasure"
label = "Measure"
kind = "select"
tooltip = "Sky-View Factor: the share of the sky seen, 0 to 1. Positive Openness: the mean angle from the zenith to the horizon, high on crests and banks. Negative Openness: the same seen from below, high in ditches and pits."
default = "svf"
models = ["sky"]
newRow = true

[[inputs.options]]
value = "svf"
label = "Sky-View Factor"

[[inputs.options]]
value = "positive"
label = "Positive Openness"

[[inputs.options]]
value = "negative"
label = "Negative Openness"

[[inputs]]
id = "searchRadius"
label = "Search Radius (m)"
tooltip = "How far, in metres, the horizon is looked for in each direction: about 10 m suits ditches, banks and mounds; a larger radius brings out broader forms."
default = "10"
models = ["sky", "vat"]

[[inputs]]
id = "directions"
label = "Directions"
tooltip = "The number of directions in which the horizon is looked for, spread evenly around the compass: 16 as in RVT; 8 is faster and coarser, 32 smoother."
default = "16"
models = ["sky", "vat"]

[[inputs]]
id = "shadeKind"
label = "Shading"
kind = "select"
tooltip = "Hillshade: the ground lit from the azimuth and elevation below. Several Directions: Mark's multidirectional hillshade, lit from 225, 270, 315 and 360 degrees. Slope: the steepness in degrees, steep ground dark when shown."
default = "hillshade"
models = ["shade"]
newRow = true

[[inputs.options]]
value = "hillshade"
label = "Hillshade"

[[inputs.options]]
value = "multi"
label = "Several Directions"

[[inputs.options]]
value = "slope"
label = "Slope"

[[inputs]]
id = "azimuth"
label = "Sun Azimuth"
tooltip = "The direction the light comes from, in degrees clockwise from north: 315, the north-west, by convention. Used by Hillshade."
default = "315"
models = ["shade"]

[[inputs]]
id = "sunElevation"
label = "Sun Elevation"
tooltip = "The height of the light above the horizon, in degrees: 35, as RVT and the layered image take it; lower values lengthen the shadows of small features."
default = "35"
models = ["shade"]

[[inputs]]
id = "overlayOpacity"
label = "Openness Overlay (%)"
tooltip = "The opacity of positive openness blended over the hillshade and slope: 50, as Kokalj and Somrak combine it; 100 gives the image RVT 2.2.3 renders."
default = "50"
models = ["vat"]
newRow = true

[[inputs]]
id = "zoomCentre"
label = "Zoom Centre"
tooltip = "A point, as x, y in the coordinates of the terrain model, around which Zoom on the Place, on the maps of Zoom and Pan, and Profile Through a Place look: the default is the centre of Wandlebury Ring, in British National Grid."
default = "549401, 253423"
newRow = true

[[inputs]]
id = "zoomSize"
label = "Zoom Size (m)"
tooltip = "The width of the square Zoom on the Place, on the maps of Zoom and Pan, goes to, and the length of the line Profile Through a Place follows, in metres."
default = "600"

[[inputs]]
id = "imagery"
label = "Imagery"
kind = "select"
tooltip = "The imagery beside the maps. Automatic takes Google when a Google Maps key is set, otherwise Esri when an ArcGIS key is set, otherwise Sentinel-2: the keys are set on the Powered by line. Google and Esri need the user's own key and come under their terms, which are the user's to follow; EOX's Sentinel-2 cloudless of 2016 needs no key and is open (CC BY 4.0), but in cells of 10 m. The server of the imagery learns where the terrain model is."
default = "auto"

[[inputs.options]]
value = "auto"
label = "Automatic"

[[inputs.options]]
value = "google"
label = "Google Satellite (Your Key)"

[[inputs.options]]
value = "esri"
label = "Esri World Imagery (Your Key)"

[[inputs.options]]
value = "sentinel"
label = "Sentinel-2 Cloudless, 10 m"

[[inputs.options]]
value = "none"
label = "None"

[[codeBranches]]
model = "*"
code = '''
using SmartRegions, Rasters, ArchGDAL, Statistics
{{?demFile=wandlebury-dtm.tif}}using Downloads: download
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files
dem_path = joinpath(folder, "{{demFile}}")  # an absolute path is kept as it is
{{?demFile=wandlebury-dtm.tif}}# Example file: the Environment Agency's 1 m lidar terrain model of 2 x 2 km around Wandlebury Ring, south-east of Cambridge, from its Web Coverage Service. Replace "wandlebury-dtm.tif" with your own GeoTIFF.
{{?demFile=wandlebury-dtm.tif}}isfile(dem_path) || download("https://environment.data.gov.uk/spatialdata/lidar-composite-digital-terrain-model-dtm-1m/wcs?service=WCS&version=2.0.1&request=GetCoverage&CoverageId=13787b9a-26a4-4775-8523-806d13af58fc__Lidar_Composite_Elevation_DTM_1m&format=image%2Fgeotiff&subset=E%28548400%2C550400%29&subset=N%28252400%2C254400%29", dem_path)
dem = replace_missing(read(Raster(dem_path; lazy = true)), NaN32)
{{?model=lrm}}result = local_relief(dem; radius = {{trendRadius}})  # metres above or below the mean height within the trend radius
{{?model=sky}}{{?skyMeasure=svf}}result = sky_view_factor(dem; radius = {{searchRadius}}, directions = {{directions}})  # the share of the sky seen, 0 to 1
{{?model=sky}}{{?skyMeasure=positive}}result = openness(dem; radius = {{searchRadius}}, directions = {{directions}})  # degrees, above 90 on crests and banks
{{?model=sky}}{{?skyMeasure=negative}}result = openness(dem; radius = {{searchRadius}}, directions = {{directions}}, negative = true)  # degrees, high in ditches and pits
{{?model=shade}}{{?shadeKind=hillshade}}result = shaded_relief(dem; azimuth = {{azimuth}}, elevation = {{sunElevation}})  # 0 in shadow to 1 facing the light
{{?model=shade}}{{?shadeKind=multi}}result = shaded_relief(dem; azimuth = [225, 270, 315, 360], elevation = {{sunElevation}})  # lights from four directions (Mark 1992)
{{?model=shade}}{{?shadeKind=slope}}result = terrain_slope(dem)  # degrees
{{?model=vat}}result = layered_image(dem; radius = {{searchRadius}}, directions = {{directions}}, overlay_opacity = {{overlayOpacity}} / 100)  # the Visualization for Archaeological Topography, 0 dark to 1 light
v = collect(skipmissing(result))
println("1% ", round(quantile(v, 0.01), digits = 4), ", median ", round(median(v), digits = 4), ", 99% ", round(quantile(v, 0.99), digits = 4))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "zoom"
label = "Zoom and Pan"
desc = "The result in grey, stretched from the 2% to the 98% quantile (the layered image from 0 to 1), beside aerial or satellite imagery of the same ground, from the source Imagery names, on the whole area: the hand moves the maps together, + and − zoom them, Zoom on the Place goes to the square of the Zoom Size around the Zoom Centre and Reset back to the whole area, with a scale bar and N, E, S and W"
code = '''
lo, hi = quantile(collect(skipmissing(result)), [0.02, 0.98])
{{?model=vat}}lo, hi = 0.0, 1.0
{{?model=shade}}{{?shadeKind=slope}}lo, hi = hi, lo  # steep ground dark
x0, y0 = {{zoomCentre}}
d = {{zoomSize}} / 2
Pollis.browse(terrain_maps("Relief Visualisation, {{model}}", "Relief Visualisation" => (result, lo, hi); centre = (x0, y0), width = 2d, imagery = :{{imagery}}))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "result-summary"
label = "Summary of the Result"
desc = "The mean, standard deviation and quantiles of the result"
code = '''
v = collect(skipmissing(result))
println("Cells with a value: ", length(v), " of ", length(result))
println("Mean ", round(mean(v), sigdigits = 5), ", standard deviation ", round(std(v), sigdigits = 5))
println("Quantiles 0, 1, 25, 50, 75, 99, 100%: ", join(round.(quantile(v, [0.0, 0.01, 0.25, 0.5, 0.75, 0.99, 1.0]), sigdigits = 5), ", "))
'''

[[actionGroups.actions]]
id = "profile"
label = "Profile Through a Place"
desc = "The height and the result along a line from west to east through the Zoom Centre, as long as the Zoom Size, every 10 m: a bank rises and a ditch sinks across it"
code = '''
x0, y0 = {{zoomCentre}}
d = {{zoomSize}} / 2
[(x = round(x, digits = 1), height = round(dem[X(Near(x)), Y(Near(y0))], digits = 2), value = (r = result[X(Near(x)), Y(Near(y0))]; ismissing(r) ? missing : round(r, sigdigits = 4))) for x in x0 - d:10:x0 + d]
'''

[[actionGroups.actions]]
id = "monuments"
label = "Scheduled Monuments in the Area"
desc = "The scheduled monuments of Historic England's National Heritage List for England within the terrain model, from its open web service: the sites already known, to set the features beside (in England only)"
code = '''
using DuckDB
using Downloads: download
wkt = convert(String, convert(WellKnownText, crs(dem)))
(x1, x2), (y1, y2) = Rasters.bounds(dem, X), Rasters.bounds(dem, Y)
db = DBInterface.connect(DuckDB.DB)
DBInterface.execute(db, "LOAD spatial")
DBInterface.execute(db, "SET geometry_always_xy = true")
box = only(DBInterface.execute(db, "SELECT ST_XMin(b), ST_YMin(b), ST_XMax(b), ST_YMax(b) FROM (SELECT ST_Extent(ST_Transform(ST_MakeEnvelope($x1, $y1, $x2, $y2), '$(wkt)', 'EPSG:4326')) AS b)"))
query = "https://services-eu1.arcgis.com/ZOdPfBS3aqqDYPUQ/arcgis/rest/services/National_Heritage_List_for_England_NHLE_v02_VIEW/FeatureServer/6/query?where=1%3D1&geometry=$(box[1]),$(box[2]),$(box[3]),$(box[4])&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=ListEntry,Name,area_ha&outSR=4326&f=geojson"
file = joinpath(mktempdir(), "monuments.geojson")
download(query, file)
monuments = [(list_entry = r.ListEntry, name = r.Name, hectares = round(r.area_ha, digits = 2)) for r in DBInterface.execute(db, "SELECT ListEntry, Name, area_ha FROM ST_Read('$(file)') ORDER BY area_ha DESC")]
println(length(monuments), " scheduled monuments in the area")
monuments
'''

[[actionGroups]]
id = "export"
label = "Export"

[[actionGroups.actions]]
id = "save-result"
label = "Save the Result as Cloud-Optimised GeoTIFF"
desc = "Write the result to a Cloud-Optimised GeoTIFF in the folder of the files, with DEFLATE compression, to open in a GIS beside other layers"
code = '''
out = joinpath(folder, "reliefvis-{{model}}.tif")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	write(out, Float32.(coalesce.(result, NaN32)); driver = "COG", options = Dict("COMPRESS" => "DEFLATE"), missingval = NaN32)  # missing cells written as NaN
	println("Wrote ", out)
end
'''
