[[actionGroups.actions]]
id = "profile"
label = "Profile Through a Place"
desc = "The height and the result along a line from west to east through the Zoom Centre, as long as the Zoom Size, every 10 m: a bank rises and a ditch sinks across it"
code = '''
x0, y0 = {{zoomCentre}}
d = {{zoomSize}} / 2
[(x = round(x, digits = 1), height = round(dem[X(Near(x)), Y(Near(y0))], digits = 2), value = (r = result[X(Near(x)), Y(Near(y0))]; ismissing(r) ? missing : round(r, sigdigits = 4))) for x in x0 - d:10:x0 + d]
'''

[[actionGroups.actions]]
id = "monuments"
label = "Scheduled Monuments in the Area"
desc = "The scheduled monuments of Historic England's National Heritage List for England within the terrain model, from its open web service: the sites already known, to set the features beside (in England only)"
code = '''
using DuckDB
using Downloads: download
wkt = convert(String, convert(WellKnownText, crs(dem)))
(x1, x2), (y1, y2) = Rasters.bounds(dem, X), Rasters.bounds(dem, Y)
db = DBInterface.connect(DuckDB.DB)
DBInterface.execute(db, "LOAD spatial")
DBInterface.execute(db, "SET geometry_always_xy = true")
box = only(DBInterface.execute(db, "SELECT ST_XMin(b), ST_YMin(b), ST_XMax(b), ST_YMax(b) FROM (SELECT ST_Extent(ST_Transform(ST_MakeEnvelope($x1, $y1, $x2, $y2), '$(wkt)', 'EPSG:4326')) AS b)"))
query = "https://services-eu1.arcgis.com/ZOdPfBS3aqqDYPUQ/arcgis/rest/services/National_Heritage_List_for_England_NHLE_v02_VIEW/FeatureServer/6/query?where=1%3D1&geometry=$(box[1]),$(box[2]),$(box[3]),$(box[4])&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=ListEntry,Name,area_ha&outSR=4326&f=geojson"
file = joinpath(mktempdir(), "monuments.geojson")
download(query, file)
monuments = [(list_entry = r.ListEntry, name = r.Name, hectares = round(r.area_ha, digits = 2)) for r in DBInterface.execute(db, "SELECT ListEntry, Name, area_ha FROM ST_Read('$(file)') ORDER BY area_ha DESC")]
println(length(monuments), " scheduled monuments in the area")
monuments
'''

