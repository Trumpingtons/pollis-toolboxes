[[faq]]
question = "Why look at a lidar terrain model through visualisations?"
answer = '''
Earthworks such as burial mounds, banks, ditches and old field boundaries often rise or sink only a few tens of centimetres, on hills and valleys tens of metres high. A map of the heights shows the hills, not the earthworks. Visualisations remove the broad shape of the land, or measure how open each place is to the sky, so that the small forms stand out.

The four tabs compute the visualisations archaeologists use most, from the same terrain model.
'''
wiki = "Overview"

[[faq]]
question = "What does the local relief model show?"
answer = '''
The local relief model is the terrain model less its mean over a window around each cell: the broad shape of the land, the trend, is removed and the small forms are left, in metres. Banks and mounds come out positive, ditches and pits negative. The window should be larger than the features sought: a radius of 20 m suits mounds and ditches up to about 30 m across.
'''
wiki = "Local Relief Model"

[[faq]]
question = "What is the difference between the sky-view factor and openness?"
answer = '''
Both look along 16 directions for the highest horizon within a search radius. The sky-view factor is the share of the sky seen from a cell, from 0 to 1: it is 1 on flat ground and on crests, and drops in ditches and hollows. Positive openness is the mean angle from the zenith to the horizon, in degrees: it is above 90 on crests and banks and below 90 in ditches, so it brings out both. Negative openness is the same angle seen from below the surface, high in ditches.
'''
wiki = "Sky-View Factor and Openness"

[[faq]]
question = "What is the layered image?"
answer = '''
The layered image is the Visualization for Archaeological Topography (VAT) of Kokalj and Somrak: a hillshade, with the slope, positive openness and sky-view factor blended over it, each stretched to a fixed range. It shows small features on flat and on steep ground at once, which no single visualisation does.
'''
wiki = "Layered Image"

[[faq]]
question = "Why does the layered image differ from RVT's?"
answer = '''
The Visualization for Archaeological Topography blends positive openness over the hillshade and slope with an opacity of 50%. The blend function of RVT 2.2.3 writes the overlay into the image below it, so its layered image applies the openness at full strength. The Openness Overlay input sets the opacity: 50 follows the published combination, 100 reproduces RVT's image, as Replicate with RVT shows.
'''
wiki = "Layered Image"
hidden = true

[[faq]]
question = "How large should the search radius be?"
answer = '''
The search radius of the sky-view factor and openness sets the size of the features that stand out: a horizon farther away than the radius is not seen. A radius of about 10 m suits ditches, banks and mounds a few metres to 20 m across; a larger radius brings out broader forms and darkens valleys. Search Radii Compared prints how the results change with the radius.
'''
wiki = "Decision Guide"
hidden = true

[[faq]]
question = "Is everything the visualisations show archaeological?"
answer = '''
No. Drainage ditches, field drains, tracks, quarries, bomb craters, tree throws and the edges of modern fields also stand out, and errors of the terrain model, such as the seams between surveys or buildings and vegetation left in it, can look like earthworks. A feature found in a visualisation is a place to check against maps, records and the ground.
'''
wiki = "Diagnostics"
hidden = true

