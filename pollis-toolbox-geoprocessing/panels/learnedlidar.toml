# Learned Detection in Lidar: trained neural networks applied to lidar terrain models to find archaeological features, starting with the published models of ADAF (HRNet segmentation of all archaeology, barrows, enclosures and ringforts) run in Julia with SmartRegions.jl, NNlib.jl and Pickle.jl

