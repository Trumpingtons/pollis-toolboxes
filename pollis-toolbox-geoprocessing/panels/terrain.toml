nx, ny = size(dem)
north_first = first(lookup(dem, Y)) > last(lookup(dem, Y))
inner = [CartesianIndex(i, j) for i in 3:nx - 2, j in 3:ny - 2 if dem[i, j] > 0]
fit(r) = (o = Stencils.offsets(Window(r)); x = [p[1] * cs[1] for p in o]; y = [p[2] * cs[2] for p in o];
	w = (weights(x .^ 2), weights(y .^ 2), weights(x .* y), weights(x), weights(y));
	mapstencil(s -> (z = collect(s); (a, b, c, d, e) = map(t -> sum(t .* z), w); p = d^2 + e^2; p == 0 ? (0.0, 0.0) : (-2 * (a * d^2 + c * d * e + b * e^2) / (p * (1 + p)^1.5), -2 * (a * e^2 - c * d * e + b * d^2) / (p * sqrt(1 + p)))), Window(r), Float64.(parent(dem)); boundary = Remove(NaN)))
for (r, (pm, tm)) in qfit
	q = fit(r)
	println(2r + 1, " x ", 2r + 1, " cells, mean profile: Julia ", round(mean(first(q[c]) for c in inner), sigdigits = 10), ", MultiscaleDTM ", pm, "; mean tangential: Julia ", round(mean(last(q[c]) for c in inner), sigdigits = 10), ", MultiscaleDTM ", tm)
