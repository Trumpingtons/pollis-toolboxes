[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. A file given by an absolute path is read where it is. Save the Result as Cloud-Optimised GeoTIFF writes there."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[inputs]]
id = "demFile"
label = "Elevation File"
tooltip = "A GeoTIFF of elevation in metres, in the folder above, or an absolute path. A projected coordinate system, in metres, is best. With the default, hong-kong-dem.tif, the example first reads the Copernicus DEM GLO-30 over Hong Kong Island, Kowloon and the hills of the New Territories from its Cloud-Optimised GeoTIFF on AWS, and reprojects it to UTM zone 50N in 30 m cells, unless the folder has a hong-kong-dem.tif already."
default = "hong-kong-dem.tif"

[[inputs]]
id = "seaLevel"
label = "Sea at or Below"
tooltip = "Cells at or below this elevation, in metres, are taken as sea and left out of the results; the Copernicus DEM records the sea as 0. -Inf keeps every cell. The flow is followed over every cell."
default = "0"

[[inputs]]
id = "slopeMethod"
label = "Method"
kind = "select"
tooltip = "Horn: the gradient from all eight neighbours, weighted, as GDAL and terra compute by default. Zevenbergen and Thorne: from the four neighbours that share a side."
default = "Horn"
models = ["slope"]
newRow = true

[[inputs.options]]
value = "Horn"
label = "Horn"

[[inputs.options]]
value = "ZevenbergenThorne"
label = "Zevenbergen and Thorne"

[[inputs]]
id = "slopeBreaks"
label = "Slope Classes"
tooltip = "The limits of the classes of slope, in degrees, from low to high: each class holds the slopes from one limit up to, but not including, the next."
default = "0, 5, 10, 15, 30, 90"
models = ["slope"]

[[inputs]]
id = "light"
label = "Light"
kind = "select"
tooltip = "One Direction: the sun from the azimuth below. Several Directions: light from 225, 270, 315 and 360 degrees combined, which shows ridges whatever their direction."
