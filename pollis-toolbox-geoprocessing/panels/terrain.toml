[[faq]]
question = "What can be computed from an elevation model?"
answer = '''
An elevation model gives the height of the ground in each cell of a grid. From the heights of a cell and its neighbours come the land surface parameters: slope and aspect, the shading of the ground under a light, the curvature of the surface, indices of how rugged it is, and, following the water downhill, the area that drains through each cell and how wet the ground tends to be.

The five tabs compute these in turn, from the same elevation model.
'''
wiki = "Overview"

[[faq]]
question = "Why must the elevation model be in metres?"
answer = '''
Slope is a rise over a distance, so the heights and the cell size must be in the same unit. In a grid of longitude and latitude, a cell is a fraction of a degree wide, and a degree is about 111 km north to south but less east to west away from the equator. Geomorphometry.jl converts such cells to metres approximately; a grid reprojected to a projected coordinate system, as the example is, avoids the approximation.

Grid and Cell Size prints the coordinate system and the size of a cell in metres.
'''
wiki = "Diagnostics"

[[faq]]
question = "What is the difference between profile and tangential curvature?"
answer = '''
Profile curvature measures how the slope changes along the line of steepest descent: negative where the ground becomes less steep downhill, as at the foot of a slope, and positive where it steepens, as below a crest. Tangential curvature measures the bending across the slope: negative in hollows and valleys, where water converges, and positive on spurs and ridges, where it diverges.
'''
wiki = "Curvature"

[[faq]]
question = "What does the Topographic Wetness Index say?"
answer = '''
The Topographic Wetness Index is the logarithm of the area that drains through a cell, per metre of contour, divided by the tangent of its slope. It is high where much water arrives and the ground is gentle, as in valley bottoms, and low on steep ground near ridges. It ranks places by their tendency to be wet; it is not a measure of soil moisture.
'''
wiki = "Flow and Wetness"

[[faq]]
question = "Why are depressions filled before the flow is followed?"
answer = '''
An elevation model has small pits, most of them errors of measurement, where water would stop. Filling raises each depression to the level at which it would spill, and a tiny rise from cell to cell across the filled area gives the water a way out, so that the flow from every cell reaches the edge of the grid.

Depressions Filled counts the cells raised and the largest rise.
'''
wiki = "Flow and Wetness"
hidden = true

[[faq]]
question = "Which slope method should I use?"
answer = '''
Horn's method weights the eight neighbours of a cell and smooths the noise of an elevation model; it is the default of GDAL and terra. Zevenbergen and Thorne's method uses only the four neighbours that share a side, follows the surface more closely and is more sensitive to noise. The two differ little on a smooth surface and most on rough or noisy ground.

Slope Methods Compared prints how far apart they are.
'''
wiki = "Slope and Aspect"
hidden = true

[[faq]]
question = "What is the Terrain Ruggedness Index?"
answer = '''
The Terrain Ruggedness Index of Riley, DeGloria and Elliot is the square root of the sum of the squared differences in elevation between a cell and its eight neighbours, in metres. It grows with the relief around the cell, whatever its direction, and is near zero on flat ground.
'''
wiki = "Relief Indices"
hidden = true

