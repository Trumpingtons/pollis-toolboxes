code = '''
# MultiscaleDTM 1.0.1, on hong-kong-dem.tif: Qfit(dem, w = c(3, 3) and c(5, 5), metrics = c("profc", "planc"), na.rm = FALSE); planc is the tangential (normal contour) curvature; cells above 0 m, 2 cells from the edge
qfit = [1 => (-0.0002618022556, 0.000344624238), 2 => (-0.0001909913065, 0.000280748486)]
