[[actionGroups.actions]]
id = "aspect-directions"
label = "Aspect by Direction"
desc = "The share of the land facing each of the eight directions of the compass, and the mean slope of each"
models = ["slope"]
code = '''
dirs = ["north", "north-east", "east", "south-east", "south", "south-west", "west", "north-west"]
sector(a) = mod(round(Int, a / 45), 8) + 1  # 0 degrees is north, 45 north-east
cells = [(sector(a), s) for (a, s) in zip(aspect_deg, slope_deg) if !ismissing(a) && !ismissing(s)]
[(facing = dirs[k], share = round(count(c -> c[1] == k, cells) / length(cells), digits = 4), mean_slope = round(mean(c[2] for c in cells if c[1] == k), digits = 2)) for k in 1:8]
'''

[[actionGroups.actions]]
id = "convex-concave"
label = "Convex and Concave Ground"
desc = "The share of the land where the surface is convex, concave or close to flat in both directions: crests and spurs, hollows and the feet of slopes, and plain slopes"
models = ["curvature"]
code = '''
t = quantile(abs.(collect(skipmissing(profile))), 0.25)  # close to flat: within the smallest quarter of the profile curvatures
classes = Dict{String, Int}()
for (p, q) in zip(profile, tangential)
	(ismissing(p) || ismissing(q)) && continue
	key = string(abs(p) < t ? "plain" : p > 0 ? "convex" : "concave", " along, ", abs(q) < t ? "plain" : q > 0 ? "convex" : "concave", " across")
	classes[key] = get(classes, key, 0) + 1
end
total = sum(values(classes))
[(form = k, share = round(n / total, digits = 4)) for (k, n) in sort(collect(classes); by = last, rev = true)]
'''

