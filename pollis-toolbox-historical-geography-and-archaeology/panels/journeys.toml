# Journeys: the maps of the Historical Geography and Archaeology Toolbox under this topic, a row per map with the
# work it follows, its kind, years, region, source and licence, and the Julia code that draws it

[meta]
title = "Journeys"
viewType = "pollis.journeys"
style = "minimal"
intro = "The stages of a journey, historical or legendary, each with its passage of the source, and the route through them where the source gives their order."
rowTitle = "Map"

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/DuckDB.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

# The table: the columns after the maps' titles, then a row per map

[[columns]]
id = "kind"
label = "Kind"

[[columns]]
id = "years"
label = "Years"

[[columns]]
id = "region"
label = "Region"

[[columns]]
id = "source"
label = "Source"

[[columns]]
id = "licence"
label = "Licence"

[[rows]]
id = "odysseus"
title = "The Wanderings of Odysseus"
subtitle = "Homer, Odyssey"
description = "From Troy to Ithaca, each stage with its lines of the Odyssey, the places of legend put where Strabo and Thucydides say they were identified. Its years are those of the traditional date of the fall of Troy, with the ten years of the wanderings."
kind = "Legendary"
years = "1184–1174 BCE"
region = "The Mediterranean"
source = "Odyssey, translated by A. T. Murray (Perseus)"
sourceUrl = "https://github.com/PerseusDL/canonical-greekLit/blob/master/data/tlg0012/tlg002/tlg0012.tlg002.perseus-eng3.xml"
licence = "CC BY-SA 4.0 (text), CC0 1.0 (places)"
licenceUrl = "https://creativecommons.org/licenses/by-sa/4.0/"
code = '''
using HistoricalGeography, DuckDB, Tables
con = DBInterface.connect(DuckDB.DB)
foreach(sql -> DBInterface.execute(con, sql), ["LOAD spatial", "SET geometry_always_xy = true"])
folder = mkpath(expanduser("~/.pollis/data/examples/topic-maps"))  # where the maps' files are kept
# The stages of the wanderings, each with its lines, and where ancient authors put the places of legend
trip = journey(con, :odysseus; folder)
display(Pollis.webmap(Pollis.layer(trip.route; name = "Route", color = "#c0392b", opacity = 0.8),
	Pollis.layer(trip.path; name = "Stages", column = "stage");
	title = "The Wanderings of Odysseus", center = (19, 38), zoom = 4.5))
'''

[[rows]]
id = "xuanzang"
title = "The Journey of Xuanzang"
subtitle = "Xuanzang and Bianji, Records of the Western Regions of the Great Tang"
description = "The countries the monk Xuanzang describes on his way to India and back, in the order of his Records, each with words of its section."
kind = "Historical"
years = "629–645"
region = "From the Tarim Basin to India and back"
source = "Records of the Western Regions (Wikisource)"
sourceUrl = "https://zh.wikisource.org/wiki/%E5%A4%A7%E5%94%90%E8%A5%BF%E5%9F%9F%E8%A8%98"
licence = "Public domain (text), CC0 1.0 (places)"
licenceUrl = "https://creativecommons.org/publicdomain/zero/1.0/"
code = '''
using HistoricalGeography, DuckDB, Tables
con = DBInterface.connect(DuckDB.DB)
foreach(sql -> DBInterface.execute(con, sql), ["LOAD spatial", "SET geometry_always_xy = true"])
folder = mkpath(expanduser("~/.pollis/data/examples/topic-maps"))  # where the maps' files are kept
# The countries of the Records along his way, each with words of its section, and the route through them
trip = journey(con, :xuanzang; folder)
# The realms of Cliopatria in the same area in the year 640, under the route
historical_borders(con, :cliopatria; folder, box = trip.box, since = 640, upto = 640)
display(Pollis.webmap(Pollis.layer(borders_geojson(con); name = "Realms", column = "name", opacity = 0.25),
	Pollis.layer(trip.route; name = "Route", color = "#c0392b", opacity = 0.8),
	Pollis.layer(trip.path; name = "Countries", column = "stage");
	title = "The Journey of Xuanzang", labels = false))
'''

