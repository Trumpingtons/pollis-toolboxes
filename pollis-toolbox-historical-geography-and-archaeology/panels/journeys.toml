[[rows]]
id = "zheng-he"
title = "The Voyages of Zheng He"
subtitle = "Zheng He and his officers, the Changle inscription"
description = "The seven voyages of the Ming fleet under Zheng He, voyage by voyage, each country with the words of the inscription his officers set up at Changle in 1431."
kind = "Historical"
years = "1405–1431"
region = "From China to Arabia and East Africa"
source = "Changle and Liujiagang inscriptions (Wikisource)"
sourceUrl = "https://zh.wikisource.org/wiki/%E5%A4%A9%E5%A6%83%E4%B9%8B%E7%A5%9E%E9%9D%88%E6%87%89%E8%A8%98"
licence = "Public domain (text), CC0 1.0 (places)"
licenceUrl = "https://creativecommons.org/publicdomain/zero/1.0/"
code = '''
using HistoricalGeography, DuckDB, Tables
con = DBInterface.connect(DuckDB.DB)
foreach(sql -> DBInterface.execute(con, sql), ["LOAD spatial", "SET geometry_always_xy = true"])
folder = mkpath(expanduser("~/.pollis/data/examples/topic-maps"))  # where the maps' files are kept
# The countries each voyage reached, with the inscription's words: the inscription does not give their order, so no route
trip = journey(con, :zhenghe; folder)
# The realms of Cliopatria in the same area and years, under the stages
historical_borders(con, :cliopatria; folder, box = trip.box, since = trip.since, upto = trip.upto)
display(Pollis.webmap(Pollis.layer(borders_geojson(con); name = "Realms", column = "name", opacity = 0.25, years = ("starts", "ends")),
	Pollis.layer(trip.path; name = "Voyages", column = "part", years = ("year", "until"));
	title = "The Voyages of Zheng He", year = trip.since, labels = false))
'''

