# Places: the maps of the Historical Geography and Archaeology Toolbox under this topic, a row per map with the
# work it follows, its kind, years, region, source and licence, and the Julia code that draws it

[meta]
title = "Places"
viewType = "pollis.places"
style = "minimal"
intro = "The places a work names, historical or fictional, each with the passages that name it."
rowTitle = "Map"

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"
minimum = "0.1.6"

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/DuckDB.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

# The table: the columns after the maps' titles, then a row per map

[[columns]]
id = "kind"
label = "Kind"

[[columns]]
id = "years"
label = "Years"

[[columns]]
id = "region"
label = "Region"

[[columns]]
id = "source"
label = "Source"

[[columns]]
id = "licence"
label = "Licence"

[[rows]]
id = "herodotus-places"
title = "Places in Herodotus' Histories"
subtitle = "Herodotus, Histories"
description = "Every place Herodotus names that the Perseus Digital Library identifies, with the passages that name it, in A. D. Godley's translation."
kind = "Historical"
years = "440–430 BCE"
region = "From the Atlantic to India"
source = "Perseus Digital Library, with the Getty Thesaurus of Geographic Names"
licence = "CC BY-SA 4.0 (text), ODC-By (TGN)"
code = '''
using HistoricalGeography, DuckDB, Tables
con = DBInterface.connect(DuckDB.DB)
foreach(sql -> DBInterface.execute(con, sql), ["LOAD spatial", "SET geometry_always_xy = true"])
folder = mkpath(expanduser("~/.pollis/data/examples/topic-maps"))  # where the downloads are kept
# The places the text names, each with the number of times it is named and the passages that name it
places = text_places(con, :herodotus; folder)
println(places.count, " places, named ", places.mentions, " times; without coordinates: ", join(places.unlocated, ", "))
# Opened on Herodotus' world: a few places are tagged far from it
display(Pollis.webmap(Pollis.layer(places.path; name = "Places", column = "mentions"); title = "Places in Herodotus' Histories",
	center = (32, 36), zoom = 3.5))
'''

[[rows]]
id = "periplus"
title = "Places of The Periplus of the Erythraean Sea"
subtitle = "The Periplus of the Erythraean Sea, translated by Wilfred H. Schoff"
description = "The ports and markets of a Greek merchant's guide to the Red Sea, Arabia, the Persian Gulf and India, from Mussel Harbor and Berenice to Barygaza, Muziris and Taprobane, each with its passage of Schoff's translation and its section. Its years are those to which Schoff dates it, early in the reign of Nero."
kind = "Historical"
years = "54–60"
region = "From the Red Sea to India and Ceylon"
source = "The Periplus of the Erythraean Sea, translated by Wilfred H. Schoff (Internet Archive)"
sourceUrl = "https://archive.org/details/cu31924030139236"
licence = "Public domain (text), CC0 1.0 (places)"
code = '''
using HistoricalGeography, DuckDB, Tables
con = DBInterface.connect(DuckDB.DB)
foreach(sql -> DBInterface.execute(con, sql), ["LOAD spatial", "SET geometry_always_xy = true"])
folder = mkpath(expanduser("~/.pollis/data/examples/topic-maps"))  # where the maps' files are kept
# The places the Periplus names, in the order it first names them, each with its passages and their sections
places = text_places(con, :periplus; folder)
println(places.count, " places, named in ", places.mentions, " passages")
display(Pollis.webmap(Pollis.layer(places.path; name = "Places", column = "order"); title = "Places of The Periplus of the Erythraean Sea",
	center = (58, 18), zoom = 3))
'''

