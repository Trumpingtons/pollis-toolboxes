# Learned Detection in Lidar: trained neural networks applied to lidar terrain models to find archaeological features, starting with the published models of ADAF (HRNet segmentation and Faster R-CNN object detection of all archaeology, barrows, enclosures and ringforts) run in Julia with ArchaeologicalDetection.jl, NNlib.jl and Pickle.jl, and SmartRegions.jl for their outlines and the scheduled monuments

[meta]
title = "Learned Detection in Lidar"
viewType = "pollis.learnedlidar"
style = "timeArrow"
intro = "Find archaeological features in a lidar terrain model with trained neural networks, from the terrain model to the features saved for a GIS. A step first runs the steps before it that have not run in the Julia REPL as they are now, so a new threshold does not run the network again."

