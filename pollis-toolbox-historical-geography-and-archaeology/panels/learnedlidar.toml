[[faq]]
question = "What does Learned Detection in Lidar compute?"
answer = '''
Learned Detection in Lidar runs one of the trained models of ADAF, the Automatic Detection of Archaeological Features tool, over a lidar terrain model. The model reads the Input Image of Step 3, the simple local relief model of the terrain, stretched from -0.5 to 0.5 m. An HRNet segmentation model gives at each cell the probability that it belongs to an archaeological feature of its kind; a Faster R-CNN object detection model gives boxes with scores, and each cell takes the score of the best box over it. In Step 6, cells with a probability at least the Threshold are joined into features, each with its area, its roundness and its highest probability.
'''
wiki = "ADAF Models"

[[faq]]
question = "Where were ADAF's models trained, and does that matter?"
answer = '''
ADAF's models were trained on airborne laser scanning data of Ireland, labelled by experts with barrows, enclosures and ringforts. A trained model recognises the forms it was shown, at the resolution and in the landscapes it was shown them. Applied elsewhere, it finds features of similar form and misses others: an ADAF model knows nothing of tells, terraces or mudbrick walls. Its detections are places to check, like the candidates of rule-based detection.
'''
wiki = "Overview"

[[faq]]
question = "Is the Julia model the same as ADAF's?"
answer = '''
The segmentation network of Learned Detection in Lidar is the HRNet of AiTLAS, the toolbox ADAF runs, rewritten in Julia in ArchaeologicalDetection.jl with NNlib.jl and loaded with ADAF's own trained weights. On a tile of 1024 by 1024 cells of a lidar terrain model, its probabilities differ from those of the PyTorch model by less than 0.0001 at every cell, and the same cells reach a probability of 0.5. The object detection network is torchvision's Faster R-CNN, rewritten in the same way: on the same tile, it finds the same boxes as torchvision, their sides within 0.0001 cells and their scores within 0.00001.
'''
wiki = "ADAF Models"

[[faq]]
question = "Why are there gaps along straight lines in the features of Learned Detection in Lidar?"
right = "The 8 cells along each edge of a tile are left out of the features"
wrong = ["The 16 cells along each edge of a tile are left out of the features", "The 10 cells along each edge of a tile are left out of the probability map", "The 8 cells along each edge of a tile are left out of the input image", "Each tile has a threshold of its own, set from its highest probability", "Features that cross the edge of a tile are removed whole"]
explanation = "For an HRNet model, Compute the Features, Step 6, leaves out the 8 cells along each edge of a tile of 1024 by 1024 cells, as ADAF does, so a feature that crosses an edge is cut or split. The probability map has no such gaps, and a Faster R-CNN model leaves no cells out."
wiki = "Diagnostics"
hidden = true

[[faq]]
question = "How long does Learned Detection in Lidar take in a new Julia session, once the model has been downloaded?"
right = "About a minute to load and compile, then seconds to tens of seconds a tile"
wrong = ["A few seconds to load and compile, then less than a second a tile", "About a minute to load and compile, then several minutes for each tile", "About ten minutes to load and compile, then a few seconds for each tile", "About half an hour to load and compile, then a minute or more for each tile", "A few seconds to load and compile, then one pass over the whole terrain model"]
explanation = "Loading the model and compiling the network take about a minute in a new session. The network then runs on the processor, each tile of 1024 by 1024 cells taking several seconds to tens of seconds, depending on the computer."
wiki = "Factsheet"
hidden = true

[[steps]]
id = "terrain"
title = "Terrain Model"
intro = "Read the terrain model, and check its coordinate system, its grid and its cell size. The models need heights in metres, in a projected coordinate system, on a regular grid of square cells."
code = '''
using ArchaeologicalDetection, SmartRegions, Rasters, ArchGDAL
{{?demFile=wandlebury-dtm.tif}}using Downloads: download
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files
dem_path = joinpath(folder, "{{demFile}}")  # an absolute path is kept as it is
{{?demFile=wandlebury-dtm.tif}}# Example file: the Environment Agency's 1 m lidar terrain model of 2 x 2 km south-east of Cambridge, from its Web Coverage Service. Replace "wandlebury-dtm.tif" with your own GeoTIFF.
{{?demFile=wandlebury-dtm.tif}}isfile(dem_path) || download("https://environment.data.gov.uk/spatialdata/lidar-composite-digital-terrain-model-dtm-1m/wcs?service=WCS&version=2.0.1&request=GetCoverage&CoverageId=13787b9a-26a4-4775-8523-806d13af58fc__Lidar_Composite_Elevation_DTM_1m&format=image%2Fgeotiff&subset=E%28548400%2C550400%29&subset=N%28252400%2C254400%29", dem_path)
dem = replace_missing(read(Raster(dem_path; lazy = true)), NaN32);
system = crs(dem)
(isnothing(system) || isempty(convert(String, system))) && error("The terrain model has no coordinate system")
ArchGDAL.GDAL.osrisprojected(ArchGDAL.importCRS(system)) == 1 || error("The coordinate system of the terrain model is not projected: reproject it to one in metres")
regular(l) = l isa Rasters.Lookups.AbstractSampled && Rasters.Lookups.isregular(l)
all(D -> regular(lookup(dem, D)), (X, Y)) || error("The grid of the terrain model is not regular")
dx, dy = abs(step(lookup(dem, X))), abs(step(lookup(dem, Y)))
isapprox(dx, dy; rtol = 0.001) || error("The cells of the terrain model are not square: $(dx) by $(dy)")
println(size(dem, X), " by ", size(dem, Y), " cells of ", dx, ", in a projected coordinate system")
'''

[[steps.inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. A file given by an absolute path is read where it is. The models are kept in its adaf folder, and Steps 5 and 8 write there."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[steps.inputs]]
id = "demFile"
label = "Terrain Model"
tooltip = "A GeoTIFF of a bare-earth terrain model in metres, in the folder, or an absolute path, in a projected coordinate system with square cells. With the default, wandlebury-dtm.tif, the code first reads the Environment Agency's 1 m lidar terrain model of 2 x 2 km south-east of Cambridge from its Web Coverage Service, unless the folder has the file already."
default = "wandlebury-dtm.tif"

[[steps]]
id = "network"
title = "Trained Network Model"
intro = "Choose one of ADAF's trained models. Four are HRNet segmentation models and four are Faster R-CNN object detection models, each for one class: all archaeology, barrows, enclosures or ringforts."
code = '''
{{?feature=all|barrow|enclosure|ringfort}}model = adaf_model(adaf_weights(folder; feature = :{{feature}}));  # ADAF's trained HRNet model, downloaded once (about 860 MB)
{{?feature=fasterrcnn-all}}model = adaf_model(adaf_weights(folder; feature = :all, network = :fasterrcnn));  # ADAF's trained Faster R-CNN model, downloaded once (about 520 MB)
{{?feature=fasterrcnn-barrow}}model = adaf_model(adaf_weights(folder; feature = :barrow, network = :fasterrcnn));  # ADAF's trained Faster R-CNN model, downloaded once (about 520 MB)
{{?feature=fasterrcnn-enclosure}}model = adaf_model(adaf_weights(folder; feature = :enclosure, network = :fasterrcnn));  # ADAF's trained Faster R-CNN model, downloaded once (about 520 MB)
{{?feature=fasterrcnn-ringfort}}model = adaf_model(adaf_weights(folder; feature = :ringfort, network = :fasterrcnn));  # ADAF's trained Faster R-CNN model, downloaded once (about 520 MB)
'''

[[steps.inputs]]
id = "feature"
label = "Trained Network Model"
kind = "select"
tooltip = "Each model was trained by ADAF's authors on lidar of Ireland to find one class: All Archaeology is any of barrows, enclosures and ringforts. An HRNet model is about 860 MB and a Faster R-CNN model about 520 MB, each downloaded once."
default = "all"

[[steps.inputs.options]]
value = "all"
label = "HRNet Segmentation: All Archaeology"

[[steps.inputs.options]]
value = "barrow"
label = "HRNet Segmentation: Barrows"

[[steps.inputs.options]]
value = "enclosure"
label = "HRNet Segmentation: Enclosures"

[[steps.inputs.options]]
value = "ringfort"
label = "HRNet Segmentation: Ringforts"

[[steps.inputs.options]]
value = "fasterrcnn-all"
label = "Faster R-CNN Object Detection: All Archaeology"

[[steps.inputs.options]]
value = "fasterrcnn-barrow"
label = "Faster R-CNN Object Detection: Barrows"

[[steps.inputs.options]]
value = "fasterrcnn-enclosure"
label = "Faster R-CNN Object Detection: Enclosures"

[[steps.inputs.options]]
value = "fasterrcnn-ringfort"
label = "Faster R-CNN Object Detection: Ringforts"

[[steps]]
id = "image"
title = "Input Image"
intro = "Prepare the terrain model as the chosen model expects it. For ADAF, that is the simple local relief model with a radius of 10 m, or 10 cells where cells are 1 m or more, from -0.5 to 0.5 m stretched onto 0 to 1."
code = '''
image = adaf_input(dem)
'''

[[steps]]
id = "run"
title = "Run the Network"
intro = "The network reads the input image on tiles of 1024 by 1024 cells, from the north-west corner. Each tile takes several seconds with HRNet, and about 40 seconds with Faster R-CNN."
code = '''
{{?feature=all|barrow|enclosure|ringfort}}probability = adaf_probability(model, dem)  # the probability of a feature at each cell, tile by tile
{{?feature=fasterrcnn-all|fasterrcnn-barrow|fasterrcnn-enclosure|fasterrcnn-ringfort}}probability = adaf_probability(model, dem)  # the score of the best box over each cell, tile by tile
'''

[[steps.sections]]
heading = "What the Network Gives"
items = ["An HRNet model gives a probability map: the probability of a feature at each cell.", "A Faster R-CNN model gives boxes, each with a score. Each cell takes the score of the best box over it, so the cells at or above a threshold are those of the boxes."]

[[steps]]
id = "save-output"
title = "Save the Network's Output"
intro = "Save what the network gives before any threshold is applied, so that the threshold can be changed later without running the network again. That is the probability map, or for Faster R-CNN the map of the scores of the boxes, as a Cloud-Optimised GeoTIFF."

[[steps.actions]]
id = "save-probability"
label = "Probability Map as Cloud-Optimised GeoTIFF"
desc = "Write the probability map to a Cloud-Optimised GeoTIFF in the folder of the files, with DEFLATE compression, to open in a GIS beside other layers"
code = '''
out = joinpath(folder, "adaf-{{feature}}.tif")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	write(out, Float32.(coalesce.(probability, NaN32)); driver = "COG", options = Dict("COMPRESS" => "DEFLATE"), missingval = NaN32)  # missing cells written as NaN
	println("Wrote ", out)
end
'''

[[steps]]
id = "features"
title = "Compute the Features"
intro = "The cells at or above the threshold are joined into regions: for HRNet, without the 8 cells along the edges of each tile, as ADAF does; for Faster R-CNN, the boxes, overlapping ones joined. The minimum area and the minimum roundness then filter the regions, which are ranked by their highest probability or score."
code = '''
{{?feature=all|barrow|enclosure|ringfort}}found = adaf_features(probability; threshold = {{threshold}}, min_area = {{minArea}}, min_roundness = {{minRoundness}});
{{?feature=fasterrcnn-all|fasterrcnn-barrow|fasterrcnn-enclosure|fasterrcnn-ringfort}}found = adaf_features(probability; threshold = {{threshold}}, min_area = {{minArea}}, min_roundness = {{minRoundness}}, margin = 0);  # boxes: no cells left out along the edges of the tiles
candidates = sort(found.candidates; by = c -> -c.probability);  # the features, ranked by their highest probability
println(length(candidates), " features")
candidates[1:min(15, end)]  # the first 15
'''

[[steps.inputs]]
id = "threshold"
label = "Threshold"
tooltip = "The probability, or for Faster R-CNN the score, from 0 to 1, a cell must reach to belong to a feature. ADAF's default is 0.5."
default = "0.5"

[[steps.inputs]]
id = "minArea"
label = "Minimum Area (m²)"
tooltip = "Features of this area or less are left out, in square metres. 0 keeps every feature, as ADAF does by default."
default = "0"

[[steps.inputs]]
id = "minRoundness"
label = "Minimum Roundness"
tooltip = "Features of this roundness or less are left out: 4 pi times the area over the squared perimeter of the convex hull, 1 for a circle and 0.785 for a square. 0 keeps every feature, as ADAF does by default."
default = "0"

[[steps]]
id = "look"
title = "Look at the Features"
intro = "See the features on the image the model reads, on the probability map and on imagery of the same ground, side by side, whole or around a place. The imagery is asked from the server of the source Imagery names, which learns where the terrain model is."

[[steps.inputs]]
id = "zoomCentre"
label = "Zoom Centre"
tooltip = "A point, as x, y in the coordinates of the terrain model, around which Zoom on the Place, on the maps of Zoom and Pan, looks: the default is the Wormwood Hill tumulus, in British National Grid."
default = "549716, 252899"

[[steps.inputs]]
id = "zoomSize"
label = "Zoom Size (m)"
tooltip = "The width of the square Zoom on the Place, on the maps of Zoom and Pan, goes to, in metres."
default = "300"

[[steps.inputs]]
id = "imagery"
label = "Imagery"
kind = "select"
tooltip = "The imagery beside the maps. Automatic takes Google when a Google Maps key is set, otherwise Esri when an ArcGIS key is set, otherwise Sentinel-2: the keys are set on the Powered by line. Google and Esri need the user's own key and come under their terms, which are the user's to follow; EOX's Sentinel-2 cloudless of 2016 needs no key and is open (CC BY 4.0), but in cells of 10 m. The server of the imagery learns where the terrain model is."
default = "auto"

[[steps.inputs.options]]
value = "auto"
label = "Automatic"

[[steps.inputs.options]]
value = "google"
label = "Google Satellite (Your Key)"

[[steps.inputs.options]]
value = "esri"
label = "Esri World Imagery (Your Key)"

[[steps.inputs.options]]
value = "sentinel"
label = "Sentinel-2 Cloudless, 10 m"

[[steps.inputs.options]]
value = "none"
label = "None"

[[steps.actions]]
id = "zoom"
label = "Zoom and Pan"
desc = "The image the model reads and the probability of a feature (for Faster R-CNN, the score of the best box), as separate maps, side by side with aerial or satellite imagery of the same ground, from the source Imagery names, with each feature outlined in yellow, on the whole area: the hand moves the maps together, + and − zoom them, Zoom on the Place goes to the square of the Zoom Size around the Zoom Centre and Reset back to the whole area, with a scale bar and N, E, S and W"
code = '''
x0, y0 = {{zoomCentre}}
d = {{zoomSize}} / 2
println(count(c -> abs(c.x - x0) <= d && abs(c.y - y0) <= d, candidates), " features within ", d, " m of ", x0, ", ", y0)
Pollis.browse(terrain_maps("Learned Detection in Lidar",
	"Image the Model Reads" => image,
{{?feature=all|barrow|enclosure|ringfort}}	"Probability of a Feature" => probability;
{{?feature=fasterrcnn-all|fasterrcnn-barrow|fasterrcnn-enclosure|fasterrcnn-ringfort}}	"Score of the Best Box" => probability;
	labels = found.labels, centre = (x0, y0), width = 2d, imagery = :{{imagery}}))
'''

[[steps]]
id = "save"
title = "Save Features"
intro = "Write the features for a GIS: the outline of each, with its area, its roundness and its probability."

[[steps.actions]]
id = "save-features"
label = "Features as GeoPackage"
desc = "Write the features as outlines with their measures to a GeoPackage in the folder of the files, to open in a GIS beside the terrain model"
code = '''
using DuckDB
con = DBInterface.connect(DuckDB.DB)
DBInterface.execute(con, "LOAD spatial")
out = save_candidates(con, candidates, joinpath(folder, "adaf-{{feature}}.gpkg"); crs = dem, labels = found.labels)
println("Wrote ", length(candidates), " features to ", out)
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "monuments"
label = "Features and Scheduled Monuments"
desc = "The scheduled monuments of Historic England's National Heritage List for England within the terrain model, from its open web service, with the features that meet each and the features that meet none (in England only)"
code = '''
using DuckDB
con = DBInterface.connect(DuckDB.DB)
DBInterface.execute(con, "LOAD spatial")
scheduled_monuments(con, dem)  # the table monuments, in the coordinates of the terrain model
candidates_table(con, candidates; crs = dem, labels = found.labels)  # the table candidates, the outline of each feature
met = [(list_entry = r.list_entry, name = r.name, features = r.n) for r in DBInterface.execute(con, "SELECT m.list_entry, m.name, count(c.id) AS n FROM monuments m LEFT JOIN candidates c ON ST_Intersects(m.geom, c.geom) GROUP BY ALL ORDER BY n DESC")]
apart = only(DBInterface.execute(con, "SELECT count(*) AS n FROM candidates c WHERE NOT EXISTS (SELECT 1 FROM monuments m WHERE ST_Intersects(m.geom, c.geom))")).n
println(length(met), " scheduled monuments in the area, ", count(r -> r.features > 0, met), " met by a feature; ", apart, " of ", length(candidates), " features meet no monument")
met
'''
