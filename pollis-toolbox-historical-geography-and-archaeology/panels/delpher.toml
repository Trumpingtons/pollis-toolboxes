# Delpher: the newspapers of Delpher, the digitised newspapers of the KB, National Library of the Netherlands, searched by words and dates through its SRU service, the articles found retrieved as a table, read in full with the words of the query marked, and saved as text files; with EzXML.jl

[meta]
title = "Delpher"
viewType = "pollis.delpher"
style = "timeArrow"
intro = "Find articles in the newspapers of Delpher, the KB's digitised Dutch newspapers from 1618 to 1995: query them by words and dates, retrieve the articles found as a table, read an article in full with the words of the query marked, and save the texts. The KB's search service needs no key; its texts are open to research. A step first runs the steps before it that have not run in the Julia REPL as they are now."

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"
minimum = "0.1.9"

[[steps]]
id = "query"
title = "Query"
intro = "Count the articles that have the words between two dates, and how many there are each year (each decade, over more than 60 years). Words are joined by AND, OR and NOT, with brackets; a phrase goes in quotes, and a word ending in * stands for all its endings. The newspapers are in Dutch, so are the words that find them."
code = '''
using HistoricalGeography, Dates
# The query: the words, the dates between which the articles were published, and optionally the newspaper (its title as
# Delpher gives it), the kind of article and the region where the newspaper was published
words = strip(raw""" {{words}} """)
from, to = Date("{{from}}"), Date("{{to}}")
newspaper = strip(raw""" {{newspaper}} """)
kind, region = "{{kind}}", "{{region}}"
# The query in CQL, the language of the KB's search service, and the articles it finds, then those of each year, or of
# each decade over more than 60 years, a request each
query = delpher_query(words, from, to; newspaper, kind, region)
total = delpher_count(query)
println(total, " articles found for ", query)
print_bars(delpher_periods(words, from, to; newspaper, kind, region))
'''

[[steps.inputs]]
id = "words"
label = "Words"
tooltip = "The words to find, in Dutch: spoorweg, or spoorweg AND Haarlem, or (spoorweg OR trein) NOT Amsterdam, or \"Hollandsche IJzeren Spoorweg\" for the words next to one another, or spoorweg* for spoorweg, spoorwegen, spoorwegmaatschappij and the other words it starts. Capitals do not matter."
default = "spoorweg"

[[steps.inputs]]
id = "from"
label = "From"
tooltip = "The first day of publication, as year-month-day: 1839-01-01. Delpher's newspapers run from 1618 to 1995."
default = "1839-01-01"

[[steps.inputs]]
id = "to"
label = "To"
tooltip = "The last day of publication, as year-month-day: 1845-12-31."
default = "1845-12-31"

[[steps.inputs]]
id = "newspaper"
label = "Newspaper"
tooltip = "Empty for all the newspapers, or the title of one exactly as Delpher gives it: Algemeen Handelsblad, Rotterdamsche courant, De Tijd, Leeuwarder courant. Step 2 shows the titles of the newspapers found."
default = ""

[[steps.inputs]]
id = "kind"
label = "Kind"
kind = "select"
tooltip = "The kind of text, as Delpher divides a newspaper: articles, advertisements, family notices (births, marriages and deaths), or illustrations with their captions."
default = "all"

[[steps.inputs.options]]
value = "all"
label = "All"

[[steps.inputs.options]]
value = "artikel"
label = "Articles"

[[steps.inputs.options]]
value = "advertentie"
label = "Advertisements"

[[steps.inputs.options]]
value = "familiebericht"
label = "Family Notices"

[[steps.inputs.options]]
value = "illustratie met onderschrift"
label = "Illustrations with Captions"

[[steps.inputs]]
id = "region"
label = "Region"
kind = "select"
tooltip = "Where the newspaper was published or for whom: the whole country, a region or town of the Netherlands, or the Dutch East Indies, Suriname, the Netherlands Antilles or the Dutch-language papers of the United States."
default = "all"

[[steps.inputs.options]]
value = "all"
label = "All"

[[steps.inputs.options]]
value = "Landelijk"
label = "National"

[[steps.inputs.options]]
value = "Regionaal/lokaal"
label = "Regional or Local"

[[steps.inputs.options]]
value = "Nederlands-Indië / Indonesië"
label = "Dutch East Indies"

[[steps.inputs.options]]
value = "Suriname"
label = "Suriname"

[[steps.inputs.options]]
value = "Nederlandse Antillen"
label = "Netherlands Antilles"

[[steps.inputs.options]]
value = "Verenigde Staten"
label = "United States"

[[steps]]
id = "retrieve"
title = "Retrieve"
intro = "Retrieve the articles found, up to a number, as a table: a row per article with its date, newspaper, title, kind, page, place and region, and its link on Delpher. The search service gives 1,000 articles a request, so 5,000 take five requests."
code = '''
# The articles found, the most relevant first, or by date, up to 1,000 a request, half a second apart
results = delpher_articles(query; at_most = {{atMost}}, order = "{{order}}")
println(length(results), " of ", total, " articles retrieved, from ", minimum(r -> r.date, results), " to ", maximum(r -> r.date, results))
println("By newspaper: ", tallied([r.newspaper for r in results]; top = 10))
println("By kind: ", tallied([r.kind for r in results]))
vscodedisplay(without(results, :text), "Delpher: $words")
'''

[[steps.inputs]]
id = "atMost"
label = "At Most"
tooltip = "The number of articles to retrieve at most: 1,000 by default. The search service gives 1,000 a request, with a pause of half a second between requests."
default = "1000"

[[steps.inputs]]
id = "order"
label = "Order"
kind = "select"
tooltip = "Most Relevant First: the articles in which the words count most, as the search service ranks them. Oldest First and Newest First: by date of publication."
default = "relevance"

[[steps.inputs.options]]
value = "relevance"
label = "Most Relevant First"

[[steps.inputs.options]]
value = "oldest"
label = "Oldest First"

[[steps.inputs.options]]
value = "newest"
label = "Newest First"

[[steps]]
id = "read"
title = "Read"
intro = "Read an article in full, by its number in the table of Step 2: its text, as the KB's OCR read it, opens in Pollis's browser with the words of the query marked, and the link to its page on Delpher, where the scan is."
code = '''
article = results[{{number}}]
# The text of the article, as the KB's OCR read it, with the words of the query marked where a word starts with them
text = delpher_text(article)
page = reading_page(text.title, text.paragraphs; marks = query_patterns(words; prefix = true), mark_title = true, passages = false,
	meta = "$(article.newspaper), $(Dates.format(article.date, "d U yyyy")), page $(article.page), $(article.place)",
	link = "The page on Delpher" => article.delpher)
Pollis.browse(page.file)
println(text.title, "\n", article.newspaper, ", ", article.date, ", page ", article.page, "\n\n", join(text.paragraphs, "\n\n"))
'''

[[steps.inputs]]
id = "number"
label = "Article"
tooltip = "The number of the article, in the column number of the table of Step 2."
default = "1"

[[steps.actions]]
id = "scan"
label = "The Page on Delpher"
desc = "Open the article's page on Delpher in Pollis's browser: the scan of the newspaper, with the article outlined"
code = '''
Pollis.browse(article.delpher)
'''

[[steps]]
id = "save"
title = "Save"
intro = "Save the texts of the articles retrieved as text files, a file each with its title, newspaper, date, page and link above its text, and the table of Step 2 as a CSV file beside them. Files already saved are kept, so a save stopped halfway goes on where it stopped."
code = '''
# The texts, a file each, fetched a fifth of a second apart, and the table of the articles, in a folder named after the
# words and the dates; the texts that did not come are saved by running the step again
saved = save_texts(joinpath(expanduser(raw"{{folder}}"), "delpher", plain_name(words) * "-$from-$to"), results; count = {{toSave}},
	table = "articles.csv", name = r -> "$(r.date)-$(plain_name(r.newspaper, 40))", text = r -> join(delpher_text(r).paragraphs, "\n\n"),
	header = r -> [r.title, "$(r.newspaper), $(r.date), page $(r.page)", r.delpher], pause = 0.2)
println(saved.saved, " texts and the table of the ", length(results), " articles in ", saved.folder)
isempty(saved.missed) || println("The texts of articles ", join(saved.missed, ", "), " did not come: run the step again to save them")
'''

[[steps.inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. The texts go into delpher, in a folder named after the words and dates."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[steps.inputs]]
id = "toSave"
label = "Articles to Save"
tooltip = "The number of articles whose texts are saved, the first in the table of Step 2: 100 by default, about half a minute. Each text is a request to the KB, with a pause of a fifth of a second."
default = "100"
