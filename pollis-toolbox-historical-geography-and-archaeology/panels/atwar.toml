[[rows]]
id = "american-civil-war"
title = "American Civil War"
subtitle = "American Civil War"
description = "The battles and campaigns between the Union and the Confederacy, from Fort Sumter to Appomattox, over the battlefields that the American Battlefield Protection Program of the National Park Service drew."
kind = "Historical"
years = "1861–1865"
region = "The United States"
source = "Wikidata, with the battlefield boundaries of the National Park Service"
licence = "CC0 1.0 (events), public domain (battlefields)"
code = '''
using HistoricalGeography, DuckDB, Tables
con = DBInterface.connect(DuckDB.DB)
foreach(sql -> DBInterface.execute(con, sql), ["LOAD spatial", "SET geometry_always_xy = true"])
folder = mkpath(expanduser("~/.pollis/data/examples/topic-maps"))  # where the downloads are kept
# The battles and campaigns of the American Civil War that Wikidata gives with a place and a date
war = war_events(con, "Q8676"; folder)
# The battlefields as the American Battlefield Protection Program of the National Park Service drew them
fields = battlefields(con, :civil; folder)
# The realms of Cliopatria in the same area and years, under the events
historical_borders(con, :cliopatria; folder, box = war.box, since = war.since, upto = war.upto)
display(Pollis.webmap(Pollis.layer(borders_geojson(con); name = "Realms", column = "name", opacity = 0.25, years = ("starts", "ends")),
	Pollis.layer(fields.path; name = "Battlefields", color = "#8e44ad", opacity = 0.5),
	Pollis.layer(war.path; name = "Events", column = "kind", years = ("starts", "until"));
	title = "American Civil War", year = war.since, labels = false))
'''

