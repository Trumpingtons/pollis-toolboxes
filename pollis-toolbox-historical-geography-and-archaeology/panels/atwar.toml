[[rows]]
id = "caesars-civil-war"
title = "Caesar's Civil War"
subtitle = "Caesar, Commentaries on the Civil War"
description = "The battles, sieges and sea fights between Caesar and Pompey and the Pompeians, from the crossing of the Rubicon to Munda, and those of the Alexandrian War in Egypt; Caesar recounts the war to 48 BCE."
kind = "Historical"
years = "49–45 BCE"
region = "Italy, Hispania, Illyria, Greece, Egypt, Asia Minor and Africa"
source = "Wikidata"
licence = "CC0 1.0"
code = '''
using HistoricalGeography, DuckDB, Tables
con = DBInterface.connect(DuckDB.DB)
foreach(sql -> DBInterface.execute(con, sql), ["LOAD spatial", "SET geometry_always_xy = true"])
folder = mkpath(expanduser("~/.pollis/data/examples/topic-maps"))  # where the downloads are kept
# The battles, sieges and sea fights of Caesar's Civil War that Wikidata gives with a place and a date,
# with those of the Alexandrian War (Q9377266), in Egypt, which Wikidata does not give as part of it
war = war_events(con, ["Q1238338", "Q9377266"]; folder)
# The realms of Cliopatria in the same area and years, under the events
historical_borders(con, :cliopatria; folder, box = war.box, since = war.since, upto = war.upto)
display(Pollis.webmap(Pollis.layer(borders_geojson(con); name = "Realms", column = "name", opacity = 0.25, years = ("starts", "ends")),
	Pollis.layer(war.path; name = "Events", column = "kind", years = ("starts", "until"));
	title = "Caesar's Civil War", year = war.since, labels = false))
'''

