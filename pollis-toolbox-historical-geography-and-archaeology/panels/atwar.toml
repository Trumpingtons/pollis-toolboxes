# At War: the maps of the Historical Geography and Archaeology Toolbox under this topic, a row per map with the
# work it follows, its kind, years, region, source and licence, and the Julia code that draws it

[meta]
title = "At War"
viewType = "pollis.atwar"
style = "minimal"
intro = "The battles, sieges and campaigns of a war, each where and when it took place, over the realms of its years."
rowTitle = "Map"

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/DuckDB.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

# The table: the columns after the maps' titles, then a row per map

[[columns]]
id = "kind"
label = "Kind"

[[columns]]
id = "years"
label = "Years"

[[columns]]
id = "region"
label = "Region"

[[columns]]
id = "source"
label = "Source"

[[columns]]
id = "licence"
label = "Licence"

[[rows]]
id = "greco-persian-wars"
title = "Greco-Persian Wars"
subtitle = "Herodotus, Histories"
description = "The battles, sieges and campaigns between the Achaemenid Empire and the Greek cities from the Ionian Revolt, which Herodotus tells to 479 BCE."
kind = "Historical"
years = "499–449 BCE"
region = "Greece, Asia Minor and the Aegean"
source = "Wikidata"
licence = "CC0 1.0"
code = '''
using HistoricalGeography, DuckDB, Tables
con = DBInterface.connect(DuckDB.DB)
foreach(sql -> DBInterface.execute(con, sql), ["LOAD spatial", "SET geometry_always_xy = true"])
folder = mkpath(expanduser("~/.pollis/data/examples/topic-maps"))  # where the downloads are kept
# The battles, sieges and campaigns of the Greco-Persian Wars that Wikidata gives with a place and a date
war = war_events(con, "Q76026"; folder)
# The realms of Cliopatria in the same area and years, under the events
historical_borders(con, :cliopatria; folder, box = war.box, since = war.since, upto = war.upto)
display(Pollis.webmap(Pollis.layer(borders_geojson(con); name = "Realms", column = "name", opacity = 0.25, years = ("starts", "ends")),
	Pollis.layer(war.path; name = "Events", column = "kind", years = ("starts", "until"));
	title = "Greco-Persian Wars", year = war.since, labels = false))
'''

