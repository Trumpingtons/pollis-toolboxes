[[faq]]
question = "Why does a city disappear from the map and come back later?"
answer = "A city is shown only in the years its source gives it a value, and each value for Years Shown at most, until the city's next value. Where the source has no value for a century or more, the city leaves the map until its next value, rather than keep an old number.\n\nRaise Years Shown to bridge longer gaps, and run Years with Values to see the years of the source."
wiki = "Diagnostics"

[[faq]]
question = "Which tab should I use for cities outside Europe?"
answer = "World Cities, which covers the whole world from 3700 BC to AD 2000 with the cities of Chandler and Modelski, and needs a free NASA Earthdata account. European Cities covers Europe only, from 700 to 2000.\n\nFor the population of a whole area, towns and countryside included, use HYDE 3.5."
wiki = "Decision Guide"

[[faq]]
question = "The HYDE 3.5 tab says that population.nc is missing: what do I do?"
answer = "Open the link that the message gives in a web browser, which downloads population.nc (640 MB), and move the file into the Folder of the panel. Utrecht University's server answers only web browsers, so the code cannot download it.\n\nThen run the Example Code again."
wiki = "HYDE 3.5"

[[faq]]
question = "How do I give World Cities my NASA Earthdata login?"
answer = "Press the key on the Powered by line of the Historical Populations panel, and enter the username and password of your Earthdata Login account, made free of charge at urs.earthdata.nasa.gov. Pollis keeps both in its Secret Storage and sets them for the Julia REPL when the code runs."
wiki = "Authentication"

[[faq]]
question = "In the World Cities tab of the Historical Populations panel, what does the certainty 1, 2 or 3 of a city describe?"
right = "How sure the location of the city's coordinates is"
wrong = ["How sure the population figure is", "How many sources give the city's population", "Whether the value was imputed or counted", "The class of size of the city", "The century of the city's earliest value"]
explanation = "Reba, Reitsma and Seto ranked the reliability of each geocoded location to assess its geographic uncertainty: certainty 1 where the location is sure, 2 and 3 where it is less so. The certainty is about the coordinates, not the population."
wiki = "World Cities"
hidden = true

[[faq]]
question = "In the European Cities tab of the Historical Populations panel, what does a value marked imputed mean?"
right = "A city-specific imputation that covers a year without a population figure"
wrong = ["A value copied from World Cities for the same city", "An estimate derived from a proxy rather than a quantitative source", "A value counted in a census", "A value rounded to the nearest thousand", "A value for the city's whole metropolitan area"]
explanation = "Buringh covered missing data with city-specific imputations, marked imputed in the column natureofestimate; an estimate derived from a proxy is marked proxied, and a value from the demographic sources has neither mark."
wiki = "European Cities"
hidden = true

[[faq]]
question = "What is the default Cell of the HYDE 3.5 tab of the Historical Populations panel, and how many of HYDE's cells does each square hold?"
right = "0.5 degrees, with 36 cells of 5 arc-minutes in each square"
wrong = ["5 arc-minutes, with one cell of HYDE in each square", "1 degree, with 144 cells of 5 arc-minutes in each square", "0.25 degrees, with 9 cells of 5 arc-minutes in each square", "0.5 degrees, with 6 cells of 5 arc-minutes in each square", "2 degrees, with 576 cells of 5 arc-minutes in each square"]
explanation = "The default Cell of 0.5 degrees keeps a map of a continent quick: a square of 0.5 degrees holds 6 by 6, that is 36, cells of 5 arc-minutes (1/12 of a degree)."
wiki = "Decision Guide"
hidden = true

[[faq]]
question = "How does the Historical Populations panel colour the cities of European Cities and World Cities on its map?"
right = "By their class of size, from below 10,000 to 1,000,000 and more"
wrong = ["By a continuous scale from the smallest to the largest population", "By the logarithm of their population, from light to dark", "By their country, with one colour for each country", "By the kind of estimate of their value, imputed or not", "By the year of their value, with older values paler"]
explanation = "Populations of the past span several orders of magnitude, so the map colours each city by its class of size: below 10,000, then classes up to 500,000 to 1,000,000, and 1,000,000 and more."
wiki = "Overview"
hidden = true

[[faq]]
question = "Which Next Step of the Historical Populations panel lists the cities whose value stays the same over 200 years or more?"
right = "Repeated Values"
wrong = ["Years with Values", "Kinds of Estimate", "Two Sources", "Largest Cities of the Year", "Population Over Time"]
explanation = "Repeated Values, in Diagnose, lists the runs of one value over 200 years or more in the Box, the largest cities first, with what the source says of the values."
wiki = "Diagnostics"
hidden = true

[[faq]]
question = "Until which year does the HYDE 3.5 tab of the Historical Populations panel show the grid of 1500 on the map?"
right = "Until 1599, as the next grid is that of 1600"
wrong = ["For Years Shown, 100 years after 1500", "In 1500 only", "Until 1509, as grids come every 10 years", "Until 1550, halfway to the next grid", "Until the last year of the slider"]
explanation = "Each grid of HYDE 3.5 stands for its year until the year before the next grid; HYDE has a grid every 100 years from 0 to 1700, so the grid of 1500 is shown until 1599."
wiki = "Overview"
hidden = true

