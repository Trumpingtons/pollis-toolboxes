# Historical Populations: the populations of the past, from Buringh's European cities, the world cities of Chandler and
# Modelski geolocated by Reba, Reitsma and Seto, and the HYDE 3.5 grid, read through HistoricalGeography.jl and drawn
# on a map with a year slider

