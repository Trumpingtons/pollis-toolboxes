[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Where the files of the sources are kept once downloaded, where population.nc of HYDE 3.5 must be put, and where Export saves: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[inputs]]
id = "box"
label = "Box"
tooltip = "The area mapped, as west, south, east, north in degrees. The default is Europe; the whole world is -180, -90, 180, 90."
default = "-12, 34, 45, 72"

[[inputs]]
id = "smallest"
label = "Smallest City"
tooltip = "The population from which a city is drawn on the map: a city shows from the year it reaches it."
default = "10000"
models = ["buringh", "reba"]

[[inputs]]
id = "reach"
label = "Years Shown"
tooltip = "The years for which a value is shown at most, until the city's next value: a city with no value for longer leaves the map until its next one."
default = "100"
models = ["buringh", "reba"]

[[inputs]]
id = "cell"
label = "Cell"
tooltip = "The side of a cell of the map, in degrees: the cells of HYDE 3.5, of 5 arc-minutes (1/12 of a degree), added up into squares of this size."
default = "0.5"
models = ["hyde"]

[[inputs]]
id = "since"
label = "From"
tooltip = "The first year of the slider. European Cities starts in 700, World Cities in 3700 BC (written -3700), HYDE 3.5 in 10,000 BCE (written -10000)."
default = "1000"
newRow = true

[[inputs]]
id = "upto"
label = "Until"
tooltip = "The last year of the slider. European Cities and World Cities end in 2000, HYDE 3.5 in 2025."
default = "2000"

[[inputs]]
id = "year"
label = "Year"
tooltip = "The year the slider opens on, and the year of the Next Steps. A year outside the source is moved to its first or last."
default = "1500"

[[inputs]]
id = "other"
label = "Other Year"
tooltip = "The year that Two Years sets beside Year."
default = "1800"

[[inputs]]
id = "place"
label = "Place"
tooltip = "A point as longitude, latitude, for History of a Place and Two Sources. The default is Bologna."
default = "11.3426, 44.4938"

[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables, HistoricalGeography
{{?model=hyde}}using ArchGDAL  # reads the NetCDF file of HYDE 3.5

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the toolbox installs
{{?model=reba}}DBInterface.execute(con, "LOAD excel")  # DuckDB's excel extension, which reads the spreadsheet of the source
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude
rows(sql) = Tables.columntable(DBInterface.execute(con, sql))
quoted(text) = replace(text, "'" => "''")
folder = mkpath(expanduser(raw"{{folder}}"))  # where the sources' files are kept once downloaded
box = ({{box}})  # west, south, east, north, in degrees

# the values of the source in the Box from From to Until, by year
{{?model=buringh}}p = city_populations(con, :buringh; folder, box, since = {{since}}, upto = {{upto}})  # the table cities
{{?model=reba}}p = city_populations(con, :reba; folder, box, since = {{since}}, upto = {{upto}})  # the table cities; the login is that of the key on the Powered by line
{{?model=hyde}}p = hyde_population(con; folder, box, since = {{since}}, upto = {{upto}}, cell = {{cell}})  # the table grid, from population.nc in the Folder
source, since, upto, years = p.source, p.since, p.upto, p.years  # the first and last years with values, and the years of the source
year = clamp({{year}}, since, upto)
{{?model=buringh|reba}}reach = {{reach}}  # the years for which a value is shown at most, until the city's next value

# the map, of which the slider shows one year
{{?model=buringh|reba}}points = cities_geojson(con; least = {{smallest}}, reach)  # each value of a city as a point, coloured by its class of size
{{?model=buringh|reba}}println(source, ": ", p.cities, " cities with values in ", length(years), " years from ", since, " to ", upto, "; the slider opens on ", year)
{{?model=buringh|reba}}display(Pollis.webmap(Pollis.layer(points; name = "Cities", column = "class", years = ("starts", "ends")); title = "Historical Populations: $(source)", year))
{{?model=hyde}}cells = grid_geojson(con)  # each cell as a square, coloured by its class of people per km²
{{?model=hyde}}println(source, ": ", length(years), " grids from ", since, " to ", upto, " in cells of ", p.cell, " degrees; the slider opens on ", year)
{{?model=hyde}}display(Pollis.webmap(Pollis.layer(cells; name = "People per km²", column = "class", opacity = 0.7, years = ("starts", "ends")); title = "Historical Populations: $(source)", year))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "population-over-time"
label = "Population Over Time"
desc = "The people of the source in the Box at each of its years, as a line drawn with ECharts: those of the cities counted, or those of the grid"
code = '''
using ECharts

{{?model=buringh|reba}}t = total_population(con; reach)  # the cities with a value up to Years Shown old, at each year of the source
{{?model=hyde}}t = total_population(con; table = "grid")  # every cell with people, at each year of the grid
EChart(ec_width = 700, ec_height = 400, title = [ECharts.Title(text = "Population in the Box, $(source)")],
	xAxis = [ECharts.Axis(_type = "value", name = "year", min = since, max = upto)], yAxis = [ECharts.Axis(_type = "value", name = "people")],
	series = [ECharts.XYSeries(name = "people", _type = "line", data = [[y, v] for (y, v) in zip(t.year, t.population)])])
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "years-with-values"
label = "Years with Values"
desc = "The years in which the source has values in the Box, by century: how many years, and how many cities or cells have a value"
code = '''
{{?model=buringh|reba}}table, place, what = "cities", "key", "cities"
{{?model=hyde}}table, place, what = "grid", "lon || ',' || lat", "cells with people"
v = rows("SELECT floor(year / 100)::INTEGER * 100 AS century, count(DISTINCT year) AS years, count(*) AS n, count(DISTINCT $(place)) AS places FROM $(table) GROUP BY century ORDER BY century")
println(source, ": the years with values from ", since, " to ", upto, ", by century")
for i in eachindex(v.century)
	println("  ", rpad(string(v.century[i], " to ", v.century[i] + 99), 14), lpad(v.years[i], 4), " years,", lpad(v.n[i], 8), " values of ", v.places[i], " ", what)
end
'''

[[actionGroups.actions]]
id = "kinds-of-estimate"
label = "Kinds of Estimate"
desc = "The values of the cities by what the source says of them: imputed or proxied in European Cities, the certainty of the place in World Cities"
models = ["buringh", "reba"]
code = '''
k = rows("SELECT coalesce(nullif(note, ''), 'not marked') AS kind, count(*) AS n, count(DISTINCT key) AS cities FROM cities GROUP BY ALL ORDER BY kind")
{{?model=buringh}}println(source, ": the values by the nature of the estimate")
{{?model=reba}}println(source, ": the values by the certainty of the city's place (1 sure, 2 and 3 less so)")
for i in eachindex(k.kind)
	println("  ", rpad(k.kind[i], 14), lpad(k.n[i], 8), " values of ", k.cities[i], " cities")
end
'''

[[actionGroups.actions]]
id = "repeated-values"
label = "Repeated Values"
desc = "The cities whose value stays the same over 200 years or more, from consecutive values of the source, the largest first"
models = ["buringh", "reba"]
code = '''
r = rows("""WITH v AS (SELECT key, name, year, population, note, CASE WHEN population = lag(population) OVER (PARTITION BY key ORDER BY year) THEN 0 ELSE 1 END AS fresh FROM cities)
	SELECT any_value(name) AS name, min(year) AS starts, max(year) AS ends, count(*) AS n, round(any_value(population))::BIGINT AS population, coalesce(string_agg(DISTINCT note, ', '), '') AS note
	FROM (SELECT *, sum(fresh) OVER (PARTITION BY key ORDER BY year) AS run FROM v) GROUP BY key, run
	HAVING count(*) >= 2 AND max(year) - min(year) >= 200 ORDER BY population DESC, max(year) - min(year) DESC""")
println(source, ": ", length(r.name), " runs of one value over 200 years or more, in ", p.cities, " cities")
for i in eachindex(r.name)[1:min(end, 25)]
	println("  ", rpad(r.name[i], 28), lpad(r.population[i], 10), "  ", r.starts[i], " to ", r.ends[i], " (", r.n[i], " values)  ", r.note[i])
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "two-years-cities"
label = "Two Years"
desc = "The largest cities of Other Year, each with its population in Year beside it"
models = ["buringh", "reba"]
code = '''
second = clamp({{other}}, since, upto)
second == year && error("Year and Other Year are both $(year) within $(source): choose two different years")
a, b = largest_cities(con, year; reach), largest_cities(con, second; reach)
name(t, i) = string(t.name[i], ", ", coalesce(t.country[i], ""))
before = Dict(name(a, i) => a.population[i] for i in eachindex(a.name))
println(source, ": ", length(a.name), " cities in ", year, " and ", length(b.name), " in ", second)
println(rpad("city", 36), lpad(year, 12), lpad(second, 12))
for i in eachindex(b.name)[1:min(end, 25)]
	println(rpad(name(b, i), 36), lpad(get(before, name(b, i), "-"), 12), lpad(b.population[i], 12))
end
'''

[[actionGroups.actions]]
id = "two-years-grid"
label = "Two Years"
desc = "The people of the Box in the grids nearest Year and Other Year, and the cells whose people grew the most"
models = ["hyde"]
code = '''
nearest(y) = years[argmin(abs.(years .- y))]  # the grid of HYDE 3.5 nearest a year
early, late = nearest(year), nearest(clamp({{other}}, since, upto))
early == late && error("Year and Other Year fall on the same grid of $(source), $(early): choose years further apart")
s = rows("SELECT year, round(sum(population))::BIGINT AS people, count(*) AS cells FROM grid WHERE year IN ($(early), $(late)) GROUP BY year ORDER BY year")
for i in eachindex(s.year)
	println(source, ", ", s.year[i], ": ", s.people[i], " people in ", s.cells[i], " cells with people")
end
g = rows("""SELECT round(lon, 3) AS lon, round(lat, 3) AS lat, round(coalesce(a.population, 0))::BIGINT AS early, round(b.population)::BIGINT AS late
	FROM (SELECT * FROM grid WHERE year = $(late)) b LEFT JOIN (SELECT * FROM grid WHERE year = $(early)) a USING (lon, lat)
	ORDER BY b.population - coalesce(a.population, 0) DESC LIMIT 10""")
println("The cells whose people grew the most from ", early, " to ", late, ", by their centres:")
for i in eachindex(g.lon)
	println("  ", rpad(string(g.lon[i], ", ", g.lat[i]), 22), lpad(g.early[i], 12), lpad(g.late[i], 12))
end
'''

[[actionGroups.actions]]
id = "two-sources"
label = "Two Sources"
desc = "The city nearest the Place in European Cities and in World Cities, their values side by side by year"
models = ["buringh", "reba"]
code = '''
lon, lat = parse.(Float64, split("{{place}}", ","))
DBInterface.execute(con, "LOAD excel")  # reads the spreadsheet of World Cities
{{?model=buringh}}o = city_populations(con, :reba; folder, box, since, upto, table = "other")  # World Cities, with the login of the key on the Powered by line
{{?model=reba}}o = city_populations(con, :buringh; folder, box, since, upto, table = "other")  # European Cities
a, b = city_history(con, lon, lat), city_history(con, lon, lat; table = "other")
println(source, ": ", a.name[1], ", ", a.km[1], " km from the Place; ", o.source, ": ", b.name[1], ", ", b.km[1], " km from the Place")
va, vb = Dict(zip(a.year, a.population)), Dict(zip(b.year, b.population))
println(lpad("year", 6), lpad(source, 30), lpad(o.source, 30))
for y in sort(union(a.year, b.year))
	println(lpad(y, 6), lpad(get(va, y, ""), 30), lpad(get(vb, y, ""), 30))
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "history-of-place"
label = "History of a Place"
desc = "The values of the city nearest the Place, or of the cell of the grid that holds it, at every year of the source"
code = '''
lon, lat = parse.(Float64, split("{{place}}", ","))
{{?model=buringh|reba}}h = city_history(con, lon, lat)  # the values of the city nearest the Place
{{?model=buringh|reba}}println(h.name[1], ", ", coalesce(h.country[1], ""), ", ", h.km[1], " km from the Place, in ", source, ":")
{{?model=buringh|reba}}for i in eachindex(h.year); println(lpad(h.year[i], 6), lpad(h.population[i], 12), "  ", coalesce(h.note[i], "")); end
{{?model=hyde}}h = cell_history(con, lon, lat)  # the people of the cell that holds the Place
{{?model=hyde}}isempty(h.year) && error("the Place is in no cell with people in the Box")
{{?model=hyde}}println("The cell of ", p.cell, " degrees that holds ", lon, ", ", lat, ", in ", source, ":")
{{?model=hyde}}for i in eachindex(h.year); println(lpad(h.year[i], 6), lpad(h.population[i], 12), " people", lpad(h.people_km2[i], 10), " per km²"); end
'''

[[actionGroups.actions]]
id = "largest-cities"
label = "Largest Cities of the Year"
desc = "The cities of Year in the Box, from the largest, each with the year of its value"
models = ["buringh", "reba"]
code = '''
l = largest_cities(con, year; reach, limit = 30)  # each city's latest value up to Year, if it is less than Years Shown old
println("The largest cities of ", source, " in ", year, ":")
for i in eachindex(l.name)
	println("  ", rpad(string(l.name[i], ", ", coalesce(l.country[i], "")), 36), lpad(l.population[i], 12), "  value of ", l.valued[i])
end
'''

[[actionGroups.actions]]
id = "densest-cells"
label = "Densest Cells of the Year"
desc = "The cells of the grid nearest Year with the most people per km², by their centres"
models = ["hyde"]
code = '''
g = years[argmin(abs.(years .- year))]  # the grid of HYDE 3.5 nearest Year
d = rows("SELECT round(lon, 3) AS lon, round(lat, 3) AS lat, round(population)::BIGINT AS people, round(population / km2, 1) AS people_km2 FROM grid WHERE year = $(g) ORDER BY population / km2 DESC LIMIT 15")
println("The densest cells of ", source, " in ", g, ", by their centres:")
for i in eachindex(d.lon)
	println("  ", rpad(string(d.lon[i], ", ", d.lat[i]), 22), lpad(d.people[i], 12), " people", lpad(d.people_km2[i], 10), " per km²")
end
'''

[[actionGroups]]
id = "export"
label = "Export"

[[actionGroups.actions]]
id = "save-geoparquet"
label = "Save as GeoParquet"
desc = "Every value in the Box with its year, as a GeoParquet file in the Folder: cities as points, cells as squares"
code = '''
