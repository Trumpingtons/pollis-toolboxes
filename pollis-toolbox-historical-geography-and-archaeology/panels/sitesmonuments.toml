# Sites and Monuments: the ancient places of an area from Pleiades and from the Ancient Near East site placemarks,
# read with DuckDB's spatial extension and drawn on Google's maps, Esri's imagery or a free map, and saved as KML for
# Google Earth and Google My Maps, as a GeoPackage, as GeoJSON or as CSV

