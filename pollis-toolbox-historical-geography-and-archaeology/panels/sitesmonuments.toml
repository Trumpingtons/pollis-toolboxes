[[faq]]
question = "How do I see the sites on Google Maps?"
answer = "Set the key of Google Maps with the keys on the Powered by line, choose Google Roadmap, Google Satellite or Google Satellite with Labels as Map, and run the Example Code. The sites are drawn on Google's map on a page of its own in Pollis's browser, and a click on one shows its name, kind, years and link.\n\nIn Google's Photorealistic 3D Maps shows the sites near the Place in 3D, with the same key."
wiki = "Decision Guide"

[[faq]]
question = "How do I open the sites in Google Earth or Google My Maps?"
answer = "Run the Example Code, then Save as KML. Google Earth opens the KML file as it is, or imports it into a project. Google My Maps imports it into a layer of a map from the legend, with Add layer and then Import, but takes at most 2,000 rows and 5 MB of KML: with more sites, narrow the Box or the filters first.\n\nSave as CSV gives a table with longitude and latitude, which My Maps and Google Earth also read."
wiki = "Decision Guide"

[[faq]]
question = "Which places does Pleiades mark as rough, and can I trust their position?"
answer = "A rough place has only a vague location, often the centre of a large box: its point shows where to look, not where the place is. Pleiades' own guidance is not to assume that the point of a rough place is accurate. Precise and Rough Places draws the two apart."
wiki = "Diagnostics"

[[faq]]
question = "Why do some sites of the Ancient Near East tab have their names in parentheses?"
answer = "In the Ancient Near East site placemarks, ancient names are written without parentheses and modern names within them. A name in parentheses alone is a site known only by its modern name, and its kind is modern name only."
wiki = "Ancient Near East Placemarks"

[[faq]]
question = "Can I use the sites as the Known Sites of the detection panels?"
answer = "Yes. Save as GeoPackage writes the sites of the Box as points, or outlines where the register has them, in longitude and latitude, which the Known Sites step of Learned Detection in Satellite Images reads and reprojects."
wiki = "Factsheet"
hidden = true

[[faq]]
question = "What does the remains column of Pleiades mean?"
answer = "Pleiades records for each location of a place whether archaeological remains are known to be visible there, and how substantive they are: substantive, restored, traces, not visible, none, not applicable or unknown. The Sites and Monuments panel keeps for each place the most visible remains among its locations."
wiki = "Pleiades"
hidden = true

[[faq]]
question = "What are the sites with no name in the Ancient Near East tab?"
answer = "The No names folder of the Ancient Near East site placemarks holds sites without a name, each labelled with a code of its region. The Sites and Monuments panel gives them the kind no name and keeps the code as their name."
wiki = "Ancient Near East Placemarks"
hidden = true

[[faq]]
question = "How often does Pleiades change?"
answer = "Pleiades is published continuously and its data for GIS is updated several times a week. The Sites and Monuments panel builds its table of places once from the download and keeps it in the Folder: delete pleiades-places.parquet to build it again from a new download."
wiki = "Pleiades"
hidden = true

