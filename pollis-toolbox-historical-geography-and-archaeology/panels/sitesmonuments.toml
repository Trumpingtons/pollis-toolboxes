[[codeBranches]]
model = "pleiades"
code = '''
using DuckDB, Tables, Downloads, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude
rows(sql) = Tables.columntable(DBInterface.execute(con, sql))
quoted(text) = replace(text, "'" => "''")
folder = mkpath(expanduser(raw"{{folder}}"))  # where Pleiades is kept once downloaded, and where Export saves
box = ({{box}})  # west, south, east, north, in degrees
place, distance = ({{place}}), {{distance}}  # a point as longitude, latitude, and a distance from it in km
register, colour = "Pleiades", "remains"  # the register, and the column that colours the map

# Pleiades' places, built once from its data for GIS into a Parquet file: each place's kinds, and the years and most visible remains of its locations
places = joinpath(folder, "pleiades-places.parquet")
if !isfile(places)
	zip = Downloads.download("https://atlantides.org/downloads/pleiades/gis/pleiades_gis_data.zip", joinpath(folder, "pleiades_gis_data.zip"))
	csv(name) = "ST_Read('/vsizip/$(quoted(zip))/data/gis/$(name).csv')"
	DBInterface.execute(con, """COPY (
		WITH t AS (SELECT place_id, string_agg(DISTINCT place_type, ', ' ORDER BY place_type) AS kinds FROM $(csv("places_place_types")) GROUP BY place_id),
		l AS (SELECT place_id, year_after_which AS a, year_before_which AS b, archaeological_remains AS r FROM $(csv("location_points"))
			UNION ALL SELECT place_id, year_after_which, year_before_which, archaeological_remains FROM $(csv("location_polygons"))),
		d AS (SELECT place_id, min(TRY_CAST(a AS INTEGER)) AS starts, max(TRY_CAST(b AS INTEGER)) AS ends,
			arg_max(r, CASE r WHEN 'substantive' THEN 5 WHEN 'restored' THEN 4 WHEN 'traces' THEN 3 WHEN 'notvisible' THEN 2 WHEN 'none' THEN 1 ELSE 0 END) AS remains
			FROM l GROUP BY place_id)
		SELECT p.title AS name, t.kinds, d.starts, d.ends, d.remains, p.location_precision AS precision, p.uri AS link,
			TRY_CAST(p.representative_longitude AS DOUBLE) AS lon, TRY_CAST(p.representative_latitude AS DOUBLE) AS lat
		FROM $(csv("places")) p LEFT JOIN t ON t.place_id = p.id LEFT JOIN d ON d.place_id = p.id
		WHERE TRY_CAST(p.representative_latitude AS DOUBLE) IS NOT NULL) TO '$(quoted(places))' (FORMAT parquet)""")
end

# the places in the Box of the Kinds and Remains chosen whose years meet From to Until, as the table sites
kinds = [strip(k) for k in split("{{kinds}}", ",") if !isempty(strip(k))]  # none keeps every kind
DBInterface.execute(con, """CREATE OR REPLACE TABLE sites AS
	SELECT name, coalesce(kinds, 'unknown') AS kinds, starts, ends, coalesce(remains, 'unknown') AS remains, precision, link, lon, lat, ST_Point(lon, lat) AS geom
	FROM '$(quoted(places))'
	WHERE lon BETWEEN $(box[1]) AND $(box[3]) AND lat BETWEEN $(box[2]) AND $(box[4])
		AND (starts IS NULL OR ends IS NULL OR (starts <= {{upto}} AND ends >= {{since}}))
{{?remains=visible}}		AND remains IN ('substantive', 'restored', 'traces')
{{?remains=substantive}}		AND remains = 'substantive'
		$(isempty(kinds) ? "" : "AND list_has_any(string_split(kinds, ', '), [$(join(["'$(quoted(k))'" for k in kinds], ", "))])")
	ORDER BY name""")
n = only(rows("SELECT count(*) AS n FROM sites").n)
println(n, " places of ", register, " in the Box")

# draws the rows of a query on the Map, coloured by a column; a click on a site shows its columns
{{?basemap=free}}draw(sql, column, title) = display(Pollis.webmap(Pollis.layer(geojson(con, sql); name = register, column); style = "liberty", title))
{{?basemap=esri}}haskey(ENV, "ARCGIS_API_KEY") || error("Esri's imagery needs an ArcGIS key: set it with the keys on the Powered by line")
{{?basemap=esri}}imagery = Pollis.tiles("https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}?token=$(ENV["ARCGIS_API_KEY"])";
{{?basemap=esri}}	name = "Esri World Imagery", attribution = "Powered by Esri. Esri, Vantor, Earthstar Geographics, and the GIS User Community", maxzoom = 19)
{{?basemap=esri}}draw(sql, column, title) = display(Pollis.webmap(imagery, Pollis.layer(geojson(con, sql); name = register, column); title))
{{?basemap=roadmap|satellite|hybrid}}draw(sql, column, title) = Pollis.browse(googlemap(title, (box[1] + box[3]) / 2, (box[2] + box[4]) / 2; types = "{{basemap}}", features = geojson(con, sql), column))
n > 0 && draw("SELECT * EXCLUDE (lon, lat) FROM sites", colour, "$(register): $(n) places")
'''

[[codeBranches]]
model = "ane"
code = '''
using DuckDB, Tables, Downloads, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude
rows(sql) = Tables.columntable(DBInterface.execute(con, sql))
quoted(text) = replace(text, "'" => "''")
folder = mkpath(expanduser(raw"{{folder}}"))  # where the placemarks are kept once downloaded, and where Export saves
box = ({{aneBox}})  # west, south, east, north, in degrees
place, distance = ({{anePlace}}), {{aneDistance}}  # a point as longitude, latitude, and a distance from it in km
register, colour = "Ancient Near East placemarks", "kind"  # the register, and the column that colours the map

# the placemarks of the Ancient Near East, downloaded once: the folders Sites, No names and Extensions of its KML
kmz = joinpath(folder, "ANE.kmz")
isfile(kmz) || Downloads.download("https://zenodo.org/records/6384045/files/ANE.kmz?download=1", kmz)
kml(layer) = "ST_Read('/vsizip/$(quoted(kmz))/doc.kml', layer = '$(layer)')"

# the sites in the Box whose name contains Name Contains, as the table sites: an ancient name is written without parentheses, a modern one within them
DBInterface.execute(con, """CREATE OR REPLACE TABLE sites AS
	SELECT Name AS name, kind, ST_X(ST_Centroid(geom)) AS lon, ST_Y(ST_Centroid(geom)) AS lat, ST_Force2D(geom) AS geom FROM (
		SELECT Name, CASE WHEN Name LIKE '(%' THEN 'modern name only' ELSE 'ancient name' END AS kind, geom FROM $(kml("Sites"))
		UNION ALL SELECT Name, 'no name', geom FROM $(kml("No names"))
		UNION ALL SELECT Name, 'outline', geom FROM $(kml("Extensions")))
	WHERE ST_X(ST_Centroid(geom)) BETWEEN $(box[1]) AND $(box[3]) AND ST_Y(ST_Centroid(geom)) BETWEEN $(box[2]) AND $(box[4])
		AND Name ILIKE '%$(quoted("{{nameContains}}"))%'
	ORDER BY name""")
n = only(rows("SELECT count(*) AS n FROM sites").n)
println(n, " sites of the ", register, " in the Box")

# draws the rows of a query on the Map, coloured by a column; a click on a site shows its columns
{{?basemap=free}}draw(sql, column, title) = display(Pollis.webmap(Pollis.layer(geojson(con, sql); name = register, column); style = "liberty", title))
{{?basemap=esri}}haskey(ENV, "ARCGIS_API_KEY") || error("Esri's imagery needs an ArcGIS key: set it with the keys on the Powered by line")
{{?basemap=esri}}imagery = Pollis.tiles("https://ibasemaps-api.arcgis.com/arcgis/rest/services/World_Imagery/MapServer/tile/{z}/{y}/{x}?token=$(ENV["ARCGIS_API_KEY"])";
{{?basemap=esri}}	name = "Esri World Imagery", attribution = "Powered by Esri. Esri, Vantor, Earthstar Geographics, and the GIS User Community", maxzoom = 19)
{{?basemap=esri}}draw(sql, column, title) = display(Pollis.webmap(imagery, Pollis.layer(geojson(con, sql); name = register, column); title))
{{?basemap=roadmap|satellite|hybrid}}draw(sql, column, title) = Pollis.browse(googlemap(title, (box[1] + box[3]) / 2, (box[2] + box[4]) / 2; types = "{{basemap}}", features = geojson(con, sql), column))
n > 0 && draw("SELECT * EXCLUDE (lon, lat) FROM sites", colour, "$(register): $(n) sites")
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "precise-rough"
label = "Precise and Rough Places"
desc = "The places on the Map coloured by Pleiades' precision: a rough place has only a vague location, whose point shows where to look"
models = ["pleiades"]
code = '''
draw("SELECT * EXCLUDE (lon, lat) FROM sites", "precision", "$(register): precise and rough places")
'''

[[actionGroups.actions]]
id = "roadmap-satellite"
label = "Roadmap and Satellite"
desc = "The sites on Google's roadmap and satellite map side by side, moving together, with the Google Maps key"
code = '''
Pollis.browse(googlemap("$(register): roadmap and satellite", (box[1] + box[3]) / 2, (box[2] + box[4]) / 2; types = ["roadmap", "satellite"],
	features = geojson(con, "SELECT * EXCLUDE (lon, lat) FROM sites"), column = colour))
'''

[[actionGroups.actions]]
id = "google-3d"
label = "In Google's Photorealistic 3D Maps"
desc = "The sites within the Distance of the Place in Google's Photorealistic 3D Maps, looking down on the Place, with the Google Maps key"
code = '''
near = "SELECT * EXCLUDE (lon, lat) FROM sites WHERE ST_Distance_Sphere(ST_Point(lon, lat), ST_Point($(place[1]), $(place[2]))) <= $(1000distance)"
Pollis.browse(googlemap3d("$(register) in 3D", place[1], place[2]; range = 1000distance, features = geojson(con, near), column = colour))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "sites-by-kind"
label = "Sites by Kind"
desc = "How many sites of each kind the Box holds, the commonest first: for Pleiades a place counts once for each of its kinds"
code = '''
{{?model=pleiades}}k = rows("SELECT kind, count(*) AS n FROM (SELECT unnest(string_split(kinds, ', ')) AS kind FROM sites) GROUP BY kind ORDER BY n DESC, kind")
{{?model=ane}}k = rows("SELECT kind, count(*) AS n FROM sites GROUP BY kind ORDER BY n DESC, kind")
println(register, ", ", n, " sites in the Box:")
for i in eachindex(k.kind)[1:min(end, 30)]
	println(lpad(k.n[i], 6), "  ", k.kind[i])
end
length(k.kind) > 30 && println("and ", length(k.kind) - 30, " kinds more")
'''

[[actionGroups.actions]]
id = "sites-by-century"
label = "Places by Century"
desc = "How many places of the Box have years that meet each century, from the year after which to the year before which their locations are dated"
models = ["pleiades"]
code = '''
c = rows("""SELECT c, count(*) AS n FROM (SELECT unnest(range(CAST(floor(starts / 100) AS INTEGER), CAST(floor((ends - 1) / 100) AS INTEGER) + 1)) AS c FROM sites WHERE starts IS NOT NULL AND ends IS NOT NULL)
	GROUP BY c ORDER BY c""")
undated = only(rows("SELECT count(*) AS u FROM sites WHERE starts IS NULL OR ends IS NULL").u)
println(register, ": places in use in each century, of the ", n - undated, " places of the Box with years")
for i in eachindex(c.c)
	century = c.c[i] < 0 ? string(-100c.c[i], " to ", -100c.c[i] - 99, " BC") : string(100c.c[i], " to ", 100c.c[i] + 99)
	println(rpad(century, 18), lpad(c.n[i], 6))
end
'''

[[actionGroups.actions]]
id = "sites-near-place"
label = "Sites Near the Place"
desc = "The sites within the Distance of the Place, the nearest first, with their distance in metres"
code = '''
s = rows("""SELECT name, round(ST_Distance_Sphere(ST_Point(lon, lat), ST_Point($(place[1]), $(place[2])))) AS m, * EXCLUDE (name, lon, lat, geom)
	FROM sites WHERE ST_Distance_Sphere(ST_Point(lon, lat), ST_Point($(place[1]), $(place[2]))) <= $(1000distance) ORDER BY m""")
println(length(s.name), " sites of the ", register, " within ", distance, " km of ", place, ":")
for i in eachindex(s.name)[1:min(end, 40)]
{{?model=pleiades}}	println(lpad(Int(s.m[i]), 7), " m  ", s.name[i], "  (", s.kinds[i], ")")
{{?model=ane}}	println(lpad(Int(s.m[i]), 7), " m  ", s.name[i], "  (", s.kind[i], ")")
end
'''

[[actionGroups]]
id = "export"
label = "Export"

[[actionGroups.actions]]
id = "save-kml"
label = "Save as KML"
desc = "The sites of the Box as KML in the Folder, for Google Earth and Google My Maps, each with its name and its details"
code = '''
out = joinpath(folder, "sites-{{model}}-$(join(box, "_")).kml")
{{?model=pleiades}}details = "concat_ws('; ', kinds, CASE WHEN starts IS NOT NULL THEN starts || ' to ' || ends END, 'remains: ' || remains, precision, link)"
{{?model=ane}}details = "kind"
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "COPY (SELECT name AS Name, $(details) AS Description, geom FROM sites) TO '$(quoted(out))' (FORMAT GDAL, DRIVER 'KML', SRS 'EPSG:4326')")
	println("Wrote ", out, ", ", n, " sites")
	n > 2000 && println("Google My Maps imports at most 2,000 rows a file: narrow the Box or the filters for My Maps")
end
'''

[[actionGroups.actions]]
id = "save-gpkg"
label = "Save as GeoPackage"
desc = "The sites of the Box as a GeoPackage in the Folder, for any GIS and for the Known Sites of the detection panels"
code = '''
out = joinpath(folder, "sites-{{model}}-$(join(box, "_")).gpkg")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "COPY (SELECT * EXCLUDE (lon, lat) FROM sites) TO '$(quoted(out))' (FORMAT GDAL, DRIVER 'GPKG', SRS 'EPSG:4326')")
	println("Wrote ", out, ", ", n, " sites")
end
'''

[[actionGroups.actions]]
id = "save-geojson"
label = "Save as GeoJSON"
desc = "The sites of the Box as a GeoJSON file in the Folder, for web maps and Google Earth"
code = '''
out = joinpath(folder, "sites-{{model}}-$(join(box, "_")).geojson")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	geojson(con, "SELECT * EXCLUDE (lon, lat) FROM sites"; file = out)
	println("Wrote ", out, ", ", n, " sites")
end
'''

[[actionGroups.actions]]
id = "save-csv"
label = "Save as CSV"
desc = "The sites of the Box as a CSV table in the Folder, with longitude and latitude, for spreadsheets and Google My Maps"
code = '''
out = joinpath(folder, "sites-{{model}}-$(join(box, "_")).csv")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "COPY (SELECT * EXCLUDE (geom) FROM sites) TO '$(quoted(out))' (HEADER)")
	println("Wrote ", out, ", ", n, " sites")
end
'''
