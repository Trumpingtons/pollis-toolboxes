# Epigraphy: the sources of epigraphy, a row per source with what it covers, its period, size, access and licence,
# and, where the source can be downloaded, the Julia code that downloads it and shows it as a table

[meta]
title = "Epigraphy"
viewType = "pollis.epigraphy"
style = "minimal"
intro = "The databases, corpora and data sets of inscriptions on stone, metal and other materials, each with its period, size, access and licence, and the Julia code that downloads it where it can be downloaded."
rowTitle = "Source"

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"
minimum = "0.1.8"

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/DuckDB.jl"

[[packages]]
name = "EzXML.jl"
github = "https://github.com/JuliaIO/EzXML.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

[[packages]]
name = "CodecZlib.jl"
github = "https://github.com/JuliaIO/CodecZlib.jl"

[[packages]]
name = "ZipArchives.jl"
github = "https://github.com/JuliaIO/ZipArchives.jl"

[[packages]]
name = "JSON.jl"
github = "https://github.com/JuliaIO/JSON.jl"

# The table: the columns after the sources' titles, then a row per source

[[columns]]
id = "covers"
label = "Covers"

[[columns]]
id = "period"
label = "Period"

[[columns]]
id = "size"
label = "Size"

[[columns]]
id = "access"
label = "Access"

[[columns]]
id = "licence"
label = "Licence"

[[rows]]
id = "edcs"
title = "Epigraphik-Datenbank Clauss/Slaby (EDCS)"
subtitle = "University of Zürich, since 2025; begun by Manfred Clauss and Wolfgang A. Slaby"
description = "The largest database of Latin inscriptions, each with its province, place, dating and the publications that print it, searched by the words of its text, its material, kind, language, province and place, and shown on a map of the places with coordinates. A search's results can be exported as a CSV file. Most of its inscriptions are also in LIST, below."
covers = "Latin inscriptions of the Roman world"
period = ""
size = "541,333 entries"
access = "Its site, edcs.hist.uzh.ch, a search at a time"
licence = "Not found"
code = '''
# The search of the EDCS, by the words of an inscription, its province, place, material or kind; a search's
# results can be exported as a CSV file
Pollis.browse("https://edcs.hist.uzh.ch/")
'''

[[rows]]
id = "edh"
title = "Epigraphic Database Heidelberg (EDH)"
subtitle = "Heidelberg Academy of Sciences and Humanities; Heidelberg University Library"
description = "Latin and bilingual inscriptions of the Roman Empire, each with its province, ancient and modern findspot, type, material, dating and text, and the coordinates of its findspot. The code reads the CSV file of the inscriptions, maps their findspots and shows them as a table."
covers = "Latin and bilingual inscriptions of the Roman Empire"
period = "Mostly 1st to 3rd century CE"
size = "82,450 inscriptions, 79,488 with their findspot's coordinates"
access = "Its Open Data Repository: CSV and EpiDoc dumps, and an API"
licence = "CC BY-SA 4.0"
code = '''
using HistoricalGeography, DuckDB, Tables
folder = expanduser("~/.pollis/data/examples/epigraphy")  # where the downloads are kept
con = DBInterface.connect(DuckDB.DB)  # an in-memory database
# The inscriptions of the EDH as the table edh, from a CSV file of 60 MB downloaded once
edh(con; folder)
inscriptions = Tables.rowtable(DBInterface.execute(con, "SELECT * FROM edh"))
println(length(inscriptions), " inscriptions, ", count(i -> !ismissing(i.lon), inscriptions), " with their findspot's coordinates, ",
	count(i -> !ismissing(i.year_from), inscriptions), " dated")
# The findspots on a map, each with its number of inscriptions; a click on one shows its name and number
places = findspots_geojson(inscriptions)
display(Pollis.webmap(Pollis.layer(places; name = "Findspots", column = "inscriptions"); title = "Epigraphic Database Heidelberg",
	center = (14, 42), zoom = 3.5))
vscodedisplay(inscriptions, "Epigraphic Database Heidelberg")
'''

[[rows]]
id = "list"
title = "Latin Inscriptions in Space and Time (LIST)"
subtitle = "Social Dynamics in the Ancient Mediterranean (SDAM), Aarhus University: Vojtěch Kaše, Petra Heřmánková and Adéla Sobotková"
description = "The inscriptions of the EDH and the EDCS in one data set, 77,091 of them in both, with 65 attributes: the cleaned texts, the dates, the coordinates, the type (predicted by a model for the inscriptions of the EDCS alone) and the urban context, whether the findspot is within 5 km of a large, medium or small city or rural. The code maps the findspots and counts the dated inscriptions by century."
covers = "Latin inscriptions of the EDH and the EDCS"
period = "Mostly 1st to 4th century CE"
size = "525,870 inscriptions, 511,977 with coordinates, 206,566 dated"
access = "Zenodo, version 1.2 (2024): a Parquet file of 110 MB, or GeoJSON of 1.2 GB"
licence = "CC BY 4.0"
code = '''
using HistoricalGeography, DuckDB, Tables
folder = expanduser("~/.pollis/data/examples/epigraphy")  # where the downloads are kept
con = DBInterface.connect(DuckDB.DB)  # an in-memory database
# LIST 1.2 as the table list, from a Parquet file of 110 MB downloaded once; the type is predicted by a model for the
# inscriptions of the EDCS alone
list_inscriptions(con; folder)
n = Tables.columntable(DBInterface.execute(con, "SELECT count(*) AS n, count(lon) AS located, count(year_from) AS dated FROM list"))
println(only(n.n), " inscriptions, ", only(n.located), " with coordinates, ", only(n.dated), " dated")
# The dated inscriptions by century of their earliest year, negative before the Common Era, those with 100 or more
years = Tables.columntable(DBInterface.execute(con, "SELECT year_from FROM list WHERE year_from IS NOT NULL")).year_from
println("By century: ", join(("$c: $k" for (c, k) in sort(tally(century.(years))) if k >= 100), ", "))
# The findspots on a map, each with its number of inscriptions
places = findspots_geojson(DBInterface.execute(con, "SELECT findspot, lon, lat FROM list WHERE lon IS NOT NULL"))
display(Pollis.webmap(Pollis.layer(places; name = "Findspots", column = "inscriptions"); title = "Latin Inscriptions in Space and Time",
	center = (14, 42), zoom = 3.5))
# The Table Viewer shows the first 100,000 inscriptions by their LIST number; the table list holds them all
vscodedisplay(Tables.rowtable(DBInterface.execute(con, "SELECT * FROM list LIMIT 100000")), "Latin Inscriptions in Space and Time")
'''

[[rows]]
id = "edr"
title = "Epigraphic Database Roma (EDR)"
subtitle = "Sapienza University of Rome"
description = "The Latin and Greek inscriptions of ancient Italy, with Sicily and Sardinia, in EpiDoc XML: an automatic conversion of some of the EDR's contents, published on Zenodo. Each has its number, region, place and findspot, type, object, material, dating and text; the records have no coordinates. The code reads the records from the archive without unpacking it."
covers = "Latin and Greek inscriptions of ancient Italy"
period = "Mostly 1st century BCE to 3rd century CE"
size = "115,590 inscriptions, 91,125 dated"
access = "Zenodo, version 12 (2026): EpiDoc XML, an archive of 268 MB"
licence = "CC BY 4.0 on Zenodo; the records state Reserved Rights, free access"
code = '''
using HistoricalGeography
folder = expanduser("~/.pollis/data/examples/epigraphy")  # where the downloads are kept
# The inscriptions of the EDR, from an archive of 268 MB downloaded once and read without unpacking it, which takes a few
# minutes; each text as written, its abbreviations expanded
inscriptions = edr(; folder)
println(length(inscriptions), " inscriptions, ", count(i -> !ismissing(i.from), inscriptions), " dated")
println("By type: ", tallied((i.type for i in inscriptions); top = 10))
println("By region: ", tallied((i.region for i in inscriptions); top = 10))
vscodedisplay(inscriptions, "Epigraphic Database Roma")
'''

