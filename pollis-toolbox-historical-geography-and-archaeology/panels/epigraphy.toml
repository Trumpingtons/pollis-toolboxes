# Epigraphy: the sources of epigraphy, a row per source with what it covers, its period, size, access and licence,
# and, where the source can be downloaded, the Julia code that downloads it and shows it as a table

[meta]
title = "Epigraphy"
viewType = "pollis.epigraphy"
style = "minimal"
intro = "The databases, corpora and data sets of inscriptions on stone, metal and other materials, each with its period, size, access and licence, and the Julia code that downloads it where it can be downloaded."
rowTitle = "Source"

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/DuckDB.jl"

[[packages]]
name = "EzXML.jl"
github = "https://github.com/JuliaIO/EzXML.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

[[packages]]
name = "CodecZlib.jl"
github = "https://github.com/JuliaIO/CodecZlib.jl"

[[packages]]
name = "ZipArchives.jl"
github = "https://github.com/JuliaIO/ZipArchives.jl"

[[packages]]
name = "JSON.jl"
github = "https://github.com/JuliaIO/JSON.jl"

# The table: the columns after the sources' titles, then a row per source

[[columns]]
id = "covers"
label = "Covers"

[[columns]]
id = "period"
label = "Period"

[[columns]]
id = "size"
label = "Size"

[[columns]]
id = "access"
label = "Access"

[[columns]]
id = "licence"
label = "Licence"

[[rows]]
id = "edcs"
title = "Epigraphik-Datenbank Clauss/Slaby (EDCS)"
subtitle = "University of Zürich, since 2025; begun by Manfred Clauss and Wolfgang A. Slaby"
description = "The largest database of Latin inscriptions, each with its province, place, dating and the publications that print it, searched by the words of its text, its material, kind, language, province and place, and shown on a map of the places with coordinates. A search's results can be exported as a CSV file. Most of its inscriptions are also in LIST, below."
covers = "Latin inscriptions of the Roman world"
period = ""
size = "541,333 entries"
access = "Its site, edcs.hist.uzh.ch, a search at a time"
licence = "Not found"

[[rows]]
id = "edh"
title = "Epigraphic Database Heidelberg (EDH)"
subtitle = "Heidelberg Academy of Sciences and Humanities; Heidelberg University Library"
description = "Latin and bilingual inscriptions of the Roman Empire, each with its province, ancient and modern findspot, type, material, dating and text, and the coordinates of its findspot. The code reads the CSV file of the inscriptions, maps their findspots and shows them as a table."
covers = "Latin and bilingual inscriptions of the Roman Empire"
period = "Mostly 1st to 3rd century CE"
size = "82,450 inscriptions, 79,488 with their findspot's coordinates"
access = "Its Open Data Repository: CSV and EpiDoc dumps, and an API"
licence = "CC BY-SA 4.0"
code = '''
using DuckDB, Tables, Downloads
folder = mkpath(expanduser("~/.pollis/data/examples/epigraphy"))  # where the downloads are kept
# The inscriptions of the EDH, a CSV file of 60 MB downloaded once
file = joinpath(folder, "edh_data_text.csv")
isfile(file) || Downloads.download("https://edh.ub.uni-heidelberg.de/data/download/edh_data_text.csv", file)
con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude
rows(sql) = Tables.columntable(DBInterface.execute(con, sql))
quoted(text) = replace(text, "'" => "''")
# A row per inscription: its number, province, ancient and modern findspot, type, material, years and text, and the
# coordinates of its findspot, which the EDH gives as latitude, longitude
DBInterface.execute(con, """CREATE OR REPLACE TABLE edh AS
	SELECT hd_nr AS edh, provinz AS province, fo_antik AS findspot, fo_modern AS modern_findspot, i_gattung AS type, material,
		TRY_CAST(dat_jahr_a AS INTEGER) AS year_from, TRY_CAST(dat_jahr_e AS INTEGER) AS year_to, atext AS text,
		TRY_CAST(split_part(koordinaten1, ',', 2) AS DOUBLE) AS lon, TRY_CAST(split_part(koordinaten1, ',', 1) AS DOUBLE) AS lat
	FROM read_csv('$(quoted(file))', header = true, all_varchar = true)""")
n = rows("SELECT count(*) AS n, count(lon) AS located, count(year_from) AS dated FROM edh")
println(only(n.n), " inscriptions, ", only(n.located), " with their findspot's coordinates, ", only(n.dated), " dated")
# The findspots on a map, each with its number of inscriptions; a click on one shows its name and number
places = tempname() * ".geojson"
DBInterface.execute(con, """COPY (SELECT any_value(findspot) AS findspot, count(*) AS inscriptions, ST_Point(lon, lat) AS geom
	FROM edh WHERE lon IS NOT NULL GROUP BY lon, lat) TO '$(quoted(places))' (FORMAT GDAL, DRIVER 'GeoJSON')""")
display(Pollis.webmap(Pollis.layer(places; name = "Findspots", column = "inscriptions"); title = "Epigraphic Database Heidelberg",
	center = (14, 42), zoom = 3.5))
vscodedisplay(Tables.rowtable(DBInterface.execute(con, "SELECT * EXCLUDE (lon, lat) FROM edh ORDER BY edh")), "Epigraphic Database Heidelberg")
'''

[[rows]]
id = "list"
title = "Latin Inscriptions in Space and Time (LIST)"
subtitle = "Social Dynamics in the Ancient Mediterranean (SDAM), Aarhus University: Vojtěch Kaše, Petra Heřmánková and Adéla Sobotková"
description = "The inscriptions of the EDH and the EDCS in one data set, 77,091 of them in both, with 65 attributes: the cleaned texts, the dates, the coordinates, the type (predicted by a model for the inscriptions of the EDCS alone) and the urban context, whether the findspot is within 5 km of a large, medium or small city or rural. The code maps the findspots and counts the dated inscriptions by century."
covers = "Latin inscriptions of the EDH and the EDCS"
period = "Mostly 1st to 4th century CE"
size = "525,870 inscriptions, 511,977 with coordinates, 206,566 dated"
access = "Zenodo, version 1.2 (2024): a Parquet file of 110 MB, or GeoJSON of 1.2 GB"
licence = "CC BY 4.0"
code = '''
using DuckDB, Tables, Downloads
folder = mkpath(expanduser("~/.pollis/data/examples/epigraphy"))  # where the downloads are kept
# LIST 1.2, a Parquet file of 110 MB downloaded once
file = joinpath(folder, "LIST_v1-2.parquet")
isfile(file) || Downloads.download("https://zenodo.org/records/10473706/files/LIST_v1-2.parquet?download=1", file)
con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude
rows(sql) = Tables.columntable(DBInterface.execute(con, sql))
quoted(text) = replace(text, "'" => "''")
# A row per inscription: its numbers in LIST, the EDCS and the EDH, its province, findspot, type (predicted by a model
# for the inscriptions of the EDCS alone), material, years, urban context and text, and its coordinates
DBInterface.execute(con, """CREATE OR REPLACE TABLE list AS
	SELECT "LIST-ID" AS list, "EDCS-ID" AS edcs, "EDH-ID" AS edh, province_label_clean AS province, findspot_ancient_clean AS findspot,
		coalesce(type_of_inscription_clean, type_of_inscription_auto) AS type, material_clean AS material,
		CAST(not_before AS INTEGER) AS year_from, CAST(not_after AS INTEGER) AS year_to, urban_context,
		clean_text_interpretive_word AS text, Longitude AS lon, Latitude AS lat
	FROM read_parquet('$(quoted(file))')""")
n = rows("SELECT count(*) AS n, count(lon) AS located, count(year_from) AS dated FROM list")
println(only(n.n), " inscriptions, ", only(n.located), " with coordinates, ", only(n.dated), " dated")
# The dated inscriptions by century of their earliest year, negative before the Common Era
c = rows("""SELECT CASE WHEN year_from > 0 THEN (year_from - 1) // 100 + 1 ELSE -((-year_from - 1) // 100 + 1) END AS century,
	count(*) AS n FROM list WHERE year_from IS NOT NULL GROUP BY 1 ORDER BY 1""")
println("By century: ", join(("$a: $b" for (a, b) in zip(c.century, c.n) if b >= 100), ", "), " (centuries with 100 or more)")
# The findspots on a map, each with its number of inscriptions
places = tempname() * ".geojson"
DBInterface.execute(con, """COPY (SELECT any_value(findspot) AS findspot, count(*) AS inscriptions, ST_Point(lon, lat) AS geom
	FROM list WHERE lon IS NOT NULL GROUP BY lon, lat) TO '$(quoted(places))' (FORMAT GDAL, DRIVER 'GeoJSON')""")
display(Pollis.webmap(Pollis.layer(places; name = "Findspots", column = "inscriptions"); title = "Latin Inscriptions in Space and Time",
	center = (14, 42), zoom = 3.5))
# The Table Viewer shows the first 100,000 inscriptions by their LIST number; the table list holds them all
vscodedisplay(Tables.rowtable(DBInterface.execute(con, "SELECT * EXCLUDE (lon, lat) FROM list ORDER BY list LIMIT 100000")), "Latin Inscriptions in Space and Time")
'''

[[rows]]
id = "edr"
title = "Epigraphic Database Roma (EDR)"
subtitle = "Sapienza University of Rome"
description = "The Latin and Greek inscriptions of ancient Italy, with Sicily and Sardinia, in EpiDoc XML: an automatic conversion of some of the EDR's contents, published on Zenodo. Each has its number, region, place and findspot, type, object, material, dating and text; the records have no coordinates. The code reads the records from the archive without unpacking it."
covers = "Latin and Greek inscriptions of ancient Italy"
period = "Mostly 1st century BCE to 3rd century CE"
size = "115,590 inscriptions, 91,125 dated"
access = "Zenodo, version 12 (2026): EpiDoc XML, an archive of 268 MB"
licence = "CC BY 4.0 on Zenodo; the records state Reserved Rights, free access"
code = '''
using EzXML, ZipArchives, Downloads, Tables, Logging
folder = mkpath(expanduser("~/.pollis/data/examples/epigraphy"))  # where the downloads are kept
# The inscriptions of the EDR, an archive of 268 MB downloaded once, read from the archive without unpacking it; reading
# its 115,600 records takes a minute or two
archive = joinpath(folder, "EDR.zip")
isfile(archive) || Downloads.download("https://zenodo.org/records/18468635/files/EDR.zip?download=1", archive)
reader = ZipReader(read(archive))
# A field of a record, by its path in the EpiDoc XML, "" when the record has none; a year, from a date such as -0050
tei = ["t" => "http://www.tei-c.org/ns/1.0"]
field(doc, path) = (node = findfirst(path, root(doc), tei); node === nothing ? "" : strip(nodecontent(node)))
year(date) = (m = match(r"^-?\d+", date); m === nothing ? missing : parse(Int, m.match))
counts(values) = sort!(collect(pairs(Dict(v => count(==(v), values) for v in unique(values)))); by = last, rev = true)
entries = filter(name -> endswith(name, ".xml"), zip_names(reader))
# A record that is not valid XML is left out, and the parser's warnings are not shown
records = with_logger(NullLogger()) do
	map(entries) do name
		doc = try parsexml(zip_readentry(reader, name, String)) catch; return nothing end
		edition = findfirst("//t:div[@type='edition']", root(doc), tei)
		text = ""
		if edition !== nothing
			# The text as written, its abbreviations expanded: the heading and the editors' corrections are left out, and a line break
			# that does not split a word is a space
			foreach(unlink!, findall("t:head | .//t:reg | .//t:corr", edition, tei))
			foreach(lb -> linkprev!(lb, TextNode(" ")), findall(".//t:lb[not(@break='no')]", edition, tei))
			text = join(split(nodecontent(edition)), " ")
		end
		(edr = field(doc, "//t:idno[@type='localID']"), region = field(doc, "//t:origPlace/t:placeName[@type='provinceItalicRegion']"),
			place = field(doc, "//t:origPlace/t:placeName[not(@type)]"),
			findspot = field(doc, "//t:provenance[@type='found']/t:placeName[@type='locus']"),
			country = field(doc, "//t:placeName[@type='modernCountry']"), type = field(doc, "//t:keywords/t:term"),
			object = field(doc, "//t:objectType"), material = field(doc, "//t:material"),
			from = year(field(doc, "//t:origDate/@notBefore-custom")), to = year(field(doc, "//t:origDate/@notAfter-custom")),
			text = text)
	end
end
unread = count(isnothing, records)
records = [r for r in records if r !== nothing]
unread > 0 && println(unread, " records could not be read as XML")
println(length(records), " inscriptions, ", count(r -> !ismissing(r.from), records), " dated")
println("By type: ", join(("$t ($n)" for (t, n) in first(counts([r.type for r in records]), 10)), ", "))
println("By region: ", join(("$p ($n)" for (p, n) in first(counts([r.region for r in records]), 10)), ", "))
vscodedisplay(records, "Epigraphic Database Roma")
'''

[[rows]]
id = "rib"
title = "Roman Inscriptions of Britain (RIB Online)"
subtitle = "Scott Vanderbilt, with the project LatinNow"
description = "Volume I of The Roman Inscriptions of Britain, the 2,401 monumental inscriptions found before 1955 with the Addenda and Corrigenda since, and Volume III, the 550 found between 1995 and 2006; with the Vindolanda writing tablets (Tabulae Vindolandenses II to IV) and the Bloomberg tablets from Roman London. Each inscription has its text, translation, findspot and commentary, and its TEI XML."
covers = "Inscriptions and writing tablets of Roman Britain"
period = "Roman Britain"
size = "2,951 monumental inscriptions, and the tablets"
access = "Its site, romaninscriptionsofbritain.org, an inscription at a time"
licence = "CC BY 4.0 for the texts and their TEI XML; the photographs reserved"

[[rows]]
id = "irt"
title = "Inscriptions of Roman Tripolitania (IRT)"
subtitle = "King's College London: the edition of J. M. Reynolds and J. B. Ward-Perkins (1952), online in 2009"
description = "The inscriptions of Tripolitania in Libya, mostly from Lepcis Magna and Sabratha, in EpiDoc XML, each with its title, type, object, material, findspot, dating, text and English translation. The code reads the records from the archive without unpacking it."
covers = "Latin, Greek and Libyan inscriptions of Roman Tripolitania"
period = "Mostly 1st to 4th century CE"
size = "1,018 inscriptions, 978 translated into English"
access = "Its site: an archive of the EpiDoc files, 3 MB"
licence = "CC BY 2.0 UK"
code = '''
using EzXML, ZipArchives, Downloads, Tables, Logging
folder = mkpath(expanduser("~/.pollis/data/examples/epigraphy"))  # where the downloads are kept
# The inscriptions of the IRT, an archive of 3 MB downloaded once, read from the archive without unpacking it
archive = joinpath(folder, "irt2009-P5.zip")
isfile(archive) || Downloads.download("https://inslib.kcl.ac.uk/irt2009/redist/inscr/irt2009-P5.zip", archive)
reader = ZipReader(read(archive))
# A field of a record, by its path in the EpiDoc XML, "" when the record has none; a year, from a date such as 0178
tei = ["t" => "http://www.tei-c.org/ns/1.0"]
field(doc, path) = (node = findfirst(path, root(doc), tei); node === nothing ? "" : strip(nodecontent(node)))
year(date) = (m = match(r"^-?\d+", date); m === nothing ? missing : parse(Int, m.match))
counts(values) = sort!(collect(pairs(Dict(v => count(==(v), values) for v in unique(values)))); by = last, rev = true)
# The text as written, its abbreviations expanded: the heading and the editors' corrections are left out, and a line
# break that does not split a word is a space
function text(div)
	div === nothing && return ""
	foreach(unlink!, findall("t:head | .//t:reg | .//t:corr", div, tei))
	foreach(lb -> linkprev!(lb, TextNode(" ")), findall(".//t:lb[not(@break='no')]", div, tei))
	return join(split(nodecontent(div)), " ")
end
entries = filter(name -> endswith(name, ".xml"), zip_names(reader))
# A record that is not valid XML is left out, and the parser's warnings are not shown
records = with_logger(NullLogger()) do
	map(entries) do name
		doc = try parsexml(zip_readentry(reader, name, String)) catch; return nothing end
		# The edition, not the reconstruction that follows it in a few records
		edition = findfirst("//t:div[@type='edition'][not(@subtype='reconstruction')]", root(doc), tei)
		(irt = field(doc, "//t:idno[@type='filename']"), title = join(split(field(doc, "//t:titleStmt/t:title")), " "),
			type = lowercase(field(doc, "//t:titleStmt/t:title/t:rs[@type='textType']")),
			language = edition === nothing || !haskey(edition, "xml:lang") ? "" : edition["xml:lang"],
			object = field(doc, "//t:rs[@type='objectType']"), material = field(doc, "//t:material"),
			findspot = field(doc, "//t:placeName[@type='ancientFindspot']"), modern_findspot = field(doc, "//t:placeName[@type='modernFindspot']"),
			from = year(field(doc, "(//t:origDate/@when | //t:origDate/@notBefore)[1]")),
			to = year(field(doc, "(//t:origDate/@when | //t:origDate/@notAfter)[1]")),
			text = text(edition), translation = text(findfirst("//t:div[@type='translation']", root(doc), tei)))
	end
end
unread = count(isnothing, records)
records = [r for r in records if r !== nothing]
unread > 0 && println(unread, " records could not be read as XML")
println(length(records), " inscriptions, ", count(r -> !ismissing(r.from), records), " dated, ",
	count(r -> !isempty(r.translation), records), " translated")
# The languages by their ISO 639 codes: la Latin, grc Ancient Greek, ber-Latn a Berber language in
# the Latin alphabet
println("By language: ", join(("$l ($n)" for (l, n) in counts([r.language for r in records])), ", "))
println("By type: ", join(("$t ($n)" for (t, n) in first(counts([r.type for r in records]), 8)), ", "))
println("By findspot: ", join(("$f ($n)" for (f, n) in first(counts([r.findspot for r in records]), 8)), ", "))
vscodedisplay(records, "Inscriptions of Roman Tripolitania")
'''

[[rows]]
id = "isicily"
title = "I.Sicily"
subtitle = "Jonathan Prag, University of Oxford"
description = "The inscriptions of ancient Sicily in all its languages, in EpiDoc XML, each with its title, language, type, object, material, ancient and modern place, coordinates, dating and text, and its numbers in Trismegistos, the EDR, the EDH and the EDCS. The code maps the findspots and counts the inscriptions by language."
covers = "Inscriptions of ancient Sicily: Greek, Latin, Elymian, Sicel, Punic, Oscan and Hebrew"
period = "Mostly 6th century BCE to 4th century CE"
size = "5,136 inscriptions, 5,003 with coordinates"
access = "GitHub (ISicily/ISicily), an archive of 9 MB"
licence = "CC BY 4.0"
code = '''
using EzXML, CodecZlib, Downloads, Tar, Tables, Logging
folder = mkpath(expanduser("~/.pollis/data/examples/epigraphy"))  # where the downloads are kept
# The inscriptions of I.Sicily, an archive of 9 MB downloaded once from GitHub
archive = joinpath(folder, "ISicily.tar.gz")
isfile(archive) || Downloads.download("https://codeload.github.com/ISicily/ISicily/tar.gz/refs/heads/master", archive)
dir = joinpath(folder, "ISicily")
isdir(dir) || open(io -> Tar.extract(h -> startswith(h.path, "ISicily-master/inscriptions"), GzipDecompressorStream(io), dir), archive)
# A field of a record, by its path in the EpiDoc XML, "" when the record has none; a year, from a date such as 0300
tei = ["t" => "http://www.tei-c.org/ns/1.0"]
field(doc, path) = (node = findfirst(path, root(doc), tei); node === nothing ? "" : strip(nodecontent(node)))
year(date) = (m = match(r"^-?\d+", date); m === nothing ? missing : parse(Int, m.match))
counts(values) = sort!(collect(pairs(Dict(v => count(==(v), values) for v in unique(values)))); by = last, rev = true)
# The coordinates of a findspot, given as latitude, longitude
coordinates(geo) = (m = match(r"^(?<lat>-?[\d.]+),\s*(?<lon>-?[\d.]+)$", geo); m === nothing ? (missing, missing) :
	(parse(Float64, m[:lon]), parse(Float64, m[:lat])))
files = [joinpath(root, name) for (root, _, names) in walkdir(dir) for name in names if endswith(name, ".xml")]
# A record that is not valid XML is left out, and the parser's warnings are not shown
records = with_logger(NullLogger()) do
	map(files) do file
		doc = try readxml(file) catch; return nothing end
		# The primary edition, not the lemmatised one that follows it in some records
		edition = something(findfirst("//t:div[@type='edition'][@subtype='primary']", root(doc), tei),
			findfirst("//t:div[@type='edition']", root(doc), tei), Some(nothing))
		text = ""
		if edition !== nothing
			# The text as written, its abbreviations expanded: the heading and the editors' corrections are left out,
			# and a line break that does not split a word is a space
			foreach(unlink!, findall("t:head | .//t:reg | .//t:corr", edition, tei))
			foreach(lb -> linkprev!(lb, TextNode(" ")), findall(".//t:lb[not(@break='no')]", edition, tei))
			text = join(split(nodecontent(edition)), " ")
		end
		lon, lat = coordinates(field(doc, "//t:origPlace/t:geo"))
		(isicily = field(doc, "//t:idno[@type='filename']"), title = field(doc, "//t:titleStmt/t:title"),
			language = field(doc, "//t:textLang/@mainLang"), type = field(doc, "//t:keywords/t:term"),
			object = field(doc, "//t:objectType"), material = field(doc, "//t:material"),
			place = field(doc, "//t:origPlace/t:placeName[@type='ancient']"), modern_place = field(doc, "//t:origPlace/t:placeName[@type='modern']"),
			from = year(field(doc, "//t:origDate/@notBefore-custom")), to = year(field(doc, "//t:origDate/@notAfter-custom")),
			text = text, lon = lon, lat = lat)
	end
end
unread = count(isnothing, records)
records = [r for r in records if r !== nothing]
unread > 0 && println(unread, " records could not be read as XML")
println(length(records), " inscriptions, ", count(r -> !ismissing(r.lon), records), " with their findspot's coordinates, ",
	count(r -> !ismissing(r.from), records), " dated")
# The languages by their ISO 639 codes: grc Ancient Greek, la Latin, xly Elymian, scx Sicel, xpu Punic, osc Oscan, he Hebrew
println("By language: ", join(("$l ($n)" for (l, n) in counts([r.language for r in records])), ", "))
println("By type: ", join(("$t ($n)" for (t, n) in first(counts([r.type for r in records]), 8)), ", "))
# The findspots on a map, each with its number of inscriptions; a click on one shows its ancient name, or else its modern
# one, and its number
spots = Dict{Tuple{Float64, Float64}, Vector{String}}()
foreach(filter(r -> !ismissing(r.lon), records)) do r
	push!(get!(spots, (r.lon, r.lat), String[]), isempty(r.place) ? r.modern_place : r.place)
end
features = ["""{"type":"Feature","geometry":{"type":"Point","coordinates":[$lon,$lat]},"properties":""" *
	"""{"findspot":"$(escape_string(first(names)))","inscriptions":$(length(names))}}""" for ((lon, lat), names) in spots]
places = tempname() * ".geojson"
write(places, """{"type":"FeatureCollection","features":[$(join(features, ","))]}""")
display(Pollis.webmap(Pollis.layer(places; name = "Findspots", column = "inscriptions"); title = "I.Sicily", center = (14.2, 37.5), zoom = 7))
vscodedisplay([Base.structdiff(r, NamedTuple{(:lon, :lat)}) for r in records], "I.Sicily")
'''

