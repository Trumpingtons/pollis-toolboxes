[[rows]]
id = "iip"
title = "Inscriptions of Israel/Palestine (IIP)"
subtitle = "Brown University Library"
description = "The inscriptions of Israel/Palestine, in EpiDoc XML, each with its language, type, religion, region, place and site, dating, text and English translation, and the coordinates of some places. The code maps those places and counts the inscriptions by language, religion and region."
covers = "Inscriptions in Greek, Aramaic, Hebrew, Latin and other languages"
period = "About 500 BCE to 640 CE"
size = "5,528 inscriptions, 4,695 translated into English"
access = "GitHub (Brown-University-Library/iip-texts), an archive of 7 MB"
licence = "CC BY-NC 4.0"
code = '''
using EzXML, CodecZlib, Downloads, Tar, Tables, Logging
folder = mkpath(expanduser("~/.pollis/data/examples/epigraphy"))  # where the downloads are kept
# The inscriptions of the IIP, an archive of 7 MB downloaded once from GitHub
archive = joinpath(folder, "iip-texts.tar.gz")
isfile(archive) || Downloads.download("https://codeload.github.com/Brown-University-Library/iip-texts/tar.gz/refs/heads/master", archive)
dir = joinpath(folder, "IIP")
isdir(dir) || open(io -> Tar.extract(h -> startswith(h.path, "iip-texts-master/epidoc-files"), GzipDecompressorStream(io), dir), archive)
# A field of a record, by its path in the EpiDoc XML, "" when the record has none; a year, from a date such as 0070;
# a class of the IIP's taxonomy, without its "#"
tei = ["t" => "http://www.tei-c.org/ns/1.0"]
field(doc, path) = (node = findfirst(path, root(doc), tei); node === nothing ? "" : strip(nodecontent(node)))
year(date) = (m = match(r"^-?\d+", date); m === nothing ? missing : parse(Int, m.match))
class(value) = replace(value, "#" => "")
counts(values) = sort!(collect(pairs(Dict(v => count(==(v), values) for v in unique(values)))); by = last, rev = true)
# The coordinates of a place, given as latitude,longitude
coordinates(geo) = (m = match(r"^(?<lat>-?[\d.]+),\s*(?<lon>-?[\d.]+)$", geo); m === nothing ? (missing, missing) :
	(parse(Float64, m[:lon]), parse(Float64, m[:lat])))
# The text as written, its abbreviations expanded: the heading and the editors' corrections are left out, and a line
# break that does not split a word is a space
function text(div)
	div === nothing && return ""
	foreach(unlink!, findall("t:head | .//t:reg | .//t:corr", div, tei))
	foreach(lb -> linkprev!(lb, TextNode(" ")), findall(".//t:lb[not(@break='no')]", div, tei))
	return join(split(nodecontent(div)), " ")
end
# The records, without the file on which the IIP tests its encoding
files = [joinpath(root, name) for (root, _, names) in walkdir(dir) for name in names
	if endswith(name, ".xml") && name != "aaTestFile.xml"]
# A record that is not valid XML is left out, and the parser's warnings are not shown
records = with_logger(NullLogger()) do
	map(files) do file
		doc = try readxml(file) catch; return nothing end
		# The transcription, else the transcription divided into words, else the diplomatic edition
		edition = something((findfirst("//t:div[@type='edition'][@subtype='$s']", root(doc), tei)
			for s in ("transcription", "transcription_segmented", "diplomatic"))..., Some(nothing))
		lon, lat = coordinates(field(doc, "//t:origin//t:settlement/t:geo"))
		(iip = field(doc, "//t:idno[@type='IIP']"), language = field(doc, "//t:textLang/@mainLang"),
			type = class(field(doc, "//t:msItem/@class")), religion = class(field(doc, "//t:msItem/@ana")),
			region = field(doc, "//t:origin//t:region"), place = field(doc, "//t:origin//t:settlement/text()"),
			site = field(doc, "//t:origin//t:geogName[@type='site']"),
			from = year(field(doc, "//t:origin/t:date/@notBefore")), to = year(field(doc, "//t:origin/t:date/@notAfter")),
			text = text(edition), translation = text(findfirst("//t:div[@type='translation']", root(doc), tei)), lon = lon, lat = lat)
	end
end
unread = count(isnothing, records)
records = [r for r in records if r !== nothing]
unread > 0 && println(unread, " records could not be read as XML")
println(length(records), " inscriptions, ", count(r -> !ismissing(r.from), records), " dated, ",
	count(r -> !isempty(r.translation), records), " translated")
# The languages by their ISO 639 codes: grc Ancient Greek, arc Aramaic, he Hebrew, la Latin, phn Phoenician
println("By language: ", join(("$l ($n)" for (l, n) in first(counts([r.language for r in records]), 8)), ", "))
println("By religion: ", join(("$c ($n)" for (c, n) in counts([r.religion for r in records])), ", "))
println("By region: ", join(("$p ($n)" for (p, n) in first(counts([r.region for r in records]), 8)), ", "))
# The places whose coordinates the records give, on a map, each with its number of inscriptions; a click on one shows
# its name and number
spots = Dict{Tuple{Float64, Float64}, Vector{String}}()
foreach(r -> push!(get!(spots, (r.lon, r.lat), String[]), r.place), filter(r -> !ismissing(r.lon), records))
features = ["""{"type":"Feature","geometry":{"type":"Point","coordinates":[$lon,$lat]},"properties":""" *
	"""{"place":"$(escape_string(first(names)))","inscriptions":$(length(names))}}""" for ((lon, lat), names) in spots]
places = tempname() * ".geojson"
write(places, """{"type":"FeatureCollection","features":[$(join(features, ","))]}""")
display(Pollis.webmap(Pollis.layer(places; name = "Places", column = "inscriptions"); title = "Inscriptions of Israel/Palestine",
	center = (35.2, 31.8), zoom = 7))
vscodedisplay([Base.structdiff(r, NamedTuple{(:lon, :lat)}) for r in records], "Inscriptions of Israel/Palestine")
'''

[[rows]]
id = "usep"
title = "U.S. Epigraphy Project (USEP)"
subtitle = "Brown University Library"
description = "The Greek and Latin inscriptions kept in the collections of the United States, in EpiDoc XML, each with the state, city and institution where it is, its summary, language, type, object, material, place of origin, dating and text. Its records are transcribed, described only, or known from the bibliography only."
covers = "Inscriptions in collections in the United States"
period = "About 800 BCE to 700 CE"
size = "3,440 records, 2,432 of them transcribed"
access = "GitHub (Brown-University-Library/usep-data), an archive of 8 MB"
licence = "Not found"
code = '''
using EzXML, CodecZlib, Downloads, Tar, Tables, Logging
folder = mkpath(expanduser("~/.pollis/data/examples/epigraphy"))  # where the downloads are kept
# The inscriptions of the USEP, an archive of 8 MB downloaded once from GitHub
archive = joinpath(folder, "usep-data.tar.gz")
isfile(archive) || Downloads.download("https://codeload.github.com/Brown-University-Library/usep-data/tar.gz/refs/heads/master", archive)
dir = joinpath(folder, "USEP")
isdir(dir) || open(io -> Tar.extract(h -> startswith(h.path, "usep-data-master/xml_inscriptions"), GzipDecompressorStream(io), dir), archive)
# A field of a record, by its path in the EpiDoc XML, "" when the record has none; a year, from a date such as 0199;
# a class of the USEP's taxonomy, without its "#"
tei = ["t" => "http://www.tei-c.org/ns/1.0"]
field(doc, path) = (node = findfirst(path, root(doc), tei); node === nothing ? "" : strip(nodecontent(node)))
year(date) = (m = match(r"^-?\d+", date); m === nothing ? missing : parse(Int, m.match))
class(value) = replace(value, "#" => "")
counts(values) = sort!(collect(pairs(Dict(v => count(==(v), values) for v in unique(values)))); by = last, rev = true)
# The records are in three folders: transcribed, metadata_only (described, not yet transcribed) and bib_only (known
# from the bibliography)
files = [(basename(root), joinpath(root, name)) for (root, _, names) in walkdir(dir) for name in names if endswith(name, ".xml")]
# A record that is not valid XML is left out, and the parser's warnings are not shown
records = with_logger(NullLogger()) do
	map(files) do (status, file)
		doc = try readxml(file) catch; return nothing end
		edition = findfirst("//t:div[@type='edition']", root(doc), tei)
		text = ""
		if edition !== nothing
			# The text as written, its abbreviations expanded: the heading and the editors' corrections are left out,
			# and a line break that does not split a word is a space
			foreach(unlink!, findall("t:head | .//t:reg | .//t:corr", edition, tei))
			foreach(lb -> linkprev!(lb, TextNode(" ")), findall(".//t:lb[not(@break='no')]", edition, tei))
			text = join(split(nodecontent(edition)), " ")
		end
		# Where the inscription is kept: the US state, or the country, the city and the institution
		(usep = field(doc, "//t:idno[@type='USEpigraphy']"), status = status, state = field(doc, "//t:msIdentifier/t:region"),
			city = field(doc, "//t:msIdentifier/t:settlement"), institution = field(doc, "//t:msIdentifier/t:institution"),
			summary = field(doc, "//t:msContents/t:summary"), language = field(doc, "//t:textLang/@mainLang"),
			type = class(field(doc, "//t:msItem/@class")), object = class(field(doc, "//t:objectDesc/@ana")),
			material = class(field(doc, "//t:supportDesc/@ana")), origin = field(doc, "//t:origin/t:placeName"),
			from = year(field(doc, "//t:origin/t:date/@notBefore")), to = year(field(doc, "//t:origin/t:date/@notAfter")),
			text = text)
	end
end
unread = count(isnothing, records)
records = [r for r in records if r !== nothing]
unread > 0 && println(unread, " records could not be read as XML")
println(length(records), " inscriptions: ", join(("$s ($n)" for (s, n) in counts([r.status for r in records])), ", "))
# The languages by their ISO 639 codes: lat Latin, grc Ancient Greek, grc-Cprt Greek in the Cypriot syllabary,
# ett Etruscan, phn Phoenician, und undetermined
println("By language: ", join(("$l ($n)" for (l, n) in first(counts([r.language for r in records]), 6)), ", "))
println("By state or country: ", join(("$s ($n)" for (s, n) in first(counts([r.state for r in records]), 10)), ", "))
println("The institutions with most inscriptions: ",
	join(("$i ($n)" for (i, n) in first(counts(["$(r.city) $(r.institution)" for r in records]), 8)), ", "))
vscodedisplay(records, "U.S. Epigraphy Project")
'''

[[rows]]
id = "cdli"
title = "Cuneiform Digital Library Initiative (CDLI)"
subtitle = "Oxford, Berlin and Los Angeles"
description = "The catalogue of the cuneiform objects in the world's collections, each with its period, provenience, genre, language, material, museum number and publications, and the transliterations in ATF of the objects edited, some with an English translation. The code reads the dump of August 2022 on GitHub, the last one there, and counts the objects by period, genre, language and provenience; the site, cdli.earth, exports a search at a time through its API."
covers = "Cuneiform tablets, seals, cones, bricks and other objects, in Sumerian, Akkadian, Hittite and other languages"
period = "Mostly Ur III, Old Babylonian and Neo-Assyrian (about 2100 to 612 BCE)"
size = "353,283 objects, 133,133 of them transliterated"
access = "GitHub (cdli-gh/data), the dump of August 2022: 155 MB and 87 MB; its site's API, a search at a time"
licence = "Texts free to re-use, citing the CDLI; images for non-commercial use"
code = '''
using DuckDB, Tables, Downloads
folder = mkpath(expanduser("~/.pollis/data/examples/epigraphy"))  # where the downloads are kept
# The catalogue and the transliterations of the CDLI, files of 155 MB and 87 MB downloaded once from its dump of
# August 2022 on GitHub
dump = "https://media.githubusercontent.com/media/cdli-gh/data/master/"
catalogue, atf = joinpath(folder, "cdli_cat.csv"), joinpath(folder, "cdliatf_unblocked.atf")
isfile(catalogue) || Downloads.download(dump * "cdli_cat.csv", catalogue)
isfile(atf) || Downloads.download(dump * "cdliatf_unblocked.atf", atf)
con = DBInterface.connect(DuckDB.DB)  # an in-memory database
rows(sql) = Tables.columntable(DBInterface.execute(con, sql))
quoted(text) = replace(text, "'" => "''")
# A row per object: its CDLI number (as P000001), designation, period, provenience, genre, language, material, object
# type, museum number, collection and the publication that first printed it
DBInterface.execute(con, """CREATE OR REPLACE TABLE cdli AS
	SELECT 'P' || lpad(id_text, 6, '0') AS cdli, designation, period, provenience, genre, subgenre, language, material,
		object_type AS object, museum_no AS museum_number, collection, primary_publication
	FROM read_csv('$(quoted(catalogue))', header = true, all_varchar = true)""")
# The transliterations in ATF: an object starts with a line "&P000001 = ...", and each line of its text starts with its
# number, as "1." or "2'."; "#tr.en:" starts a line of English translation, and the lines starting with @, $, # and >
# describe the object or its lines
transliterated, english = Dict{String, Vector{String}}(), Dict{String, Vector{String}}()
let current = ""
	for line in eachline(atf)
		if startswith(line, "&P")
			current = line[2:8]
		elseif startswith(line, "#tr.en:")
			push!(get!(english, current, String[]), strip(line[8:end]))
		elseif !isempty(line) && !(line[1] in "@\$#>&")
			m = match(r"^\S+\.\s+(?<text>.+)$", line)
			m === nothing || push!(get!(transliterated, current, String[]), strip(m[:text]))
		end
	end
end
n = rows("SELECT count(*) AS n FROM cdli")
println(only(n.n), " objects, ", length(transliterated), " transliterated, ", length(english), " translated into English")
for (column, label) in [("period", "By period"), ("genre", "By genre"), ("language", "By language"), ("provenience", "By provenience")]
	c = rows("SELECT coalesce($column, '(not given)') AS v, count(*) AS n FROM cdli GROUP BY 1 ORDER BY 2 DESC LIMIT 8")
	println(label, ": ", join(("$(c.v[i]) ($(c.n[i]))" for i in eachindex(c.n)), ", "))
end
# The objects with their number of lines, the start of their transliteration, a line after another, and of their
# translation; the Table Viewer shows the 100,000 first transliterated objects, the vector objects holds them all
objects = [merge(r, (lines = length(get(transliterated, r.cdli, String[])),
	transliteration = first(join(get(transliterated, r.cdli, String[]), " / "), 200),
	translation = first(join(get(english, r.cdli, String[]), " "), 200)))
	for r in Tables.rowtable(DBInterface.execute(con, "SELECT * FROM cdli ORDER BY cdli"))]
vscodedisplay(first(filter(o -> o.lines > 0, objects), 100000), "Cuneiform Digital Library Initiative")
'''

[[rows]]
id = "oracc"
title = "Open Richly Annotated Cuneiform Corpus (ORACC)"
subtitle = "University of Pennsylvania Museum, with the editors of its projects"
description = "Lemmatised editions of cuneiform texts in projects such as the Royal Inscriptions of the Neo-Assyrian Period (RINAP), the State Archives of Assyria (SAAo) and the Electronic Text Corpus of Sumerian Royal Inscriptions (ETCSRI): each word with its form as written, citation form, guide word and part of speech, and each project's catalogue with the coordinates of the proveniences from Pleiades. The code reads a project, RINAP unless another is named, with its subprojects, maps its proveniences and builds its glossary."
covers = "Lemmatised cuneiform texts in Sumerian, Akkadian and other languages"
period = "By project: RINAP, 744 to 612 BCE"
size = "208 JSON archives; RINAP, 1,037 texts and 198,281 words"
access = "Its JSON page, an archive per project and subproject: RINAP 24 MB, and 53 MB for its five subprojects"
licence = "CC0 for the data; the annotated editions under CC BY-SA 3.0, as their credits say"
code = '''
using JSON, ZipArchives, Downloads, Tables
# An ORACC project, by its name on ORACC's JSON page (oracc.museum.upenn.edu/json): rinap, the Royal Inscriptions of
# the Neo-Assyrian Period, or riao, ribo, etcsri, saao, dcclt and others
project = "rinap"
folder = mkpath(expanduser("~/.pollis/data/examples/epigraphy/oracc"))  # where the downloads are kept
# The JSON archive of a project or of a subproject, downloaded once: rinap/rinap4 is rinap-rinap4.zip
function archive(name)
	file = joinpath(folder, replace(name, "/" => "-") * ".zip")
	isfile(file) || Downloads.download("https://oracc.museum.upenn.edu/json/$(basename(file))", file)
	return ZipReader(read(file))
end
readjson(reader, name) = JSON.parse(zip_readentry(reader, name, String))
main = archive(project)
# The catalogue of the project's texts, and the subproject in whose archive each text is: a project with subprojects
# names them in its "proxies", one without lists its texts in its "members"
catalogue = readjson(main, "$project/catalogue.json")["members"]
corpus = readjson(main, "$project/corpus.json")
proxies = haskey(corpus, "proxies") ? corpus["proxies"] : Dict(id => project for id in keys(corpus["members"]))
readers = Dict(sub => sub == project ? main : archive(sub) for sub in unique(values(proxies)))
# The words of a text: the nodes "l" of its tree, each with its form as written, its citation form, guide word (a
# short English meaning) and part of speech
function words!(found, node)
	node isa AbstractDict || return found
	if get(node, "node", "") == "l" && haskey(node, "f")
		f = node["f"]
		push!(found, (form = get(node, "frag", ""), cf = get(f, "cf", ""), gw = get(f, "gw", ""), pos = get(f, "pos", "")))
	end
	foreach(child -> words!(found, child), get(node, "cdl", []))
	return found
end
# The words of each text that has an edition; the file of a text without one is missing or empty
names = Dict(sub => Set(zip_names(reader)) for (sub, reader) in readers)
texts = Dict{String, Vector{NamedTuple{(:form, :cf, :gw, :pos), NTuple{4, String}}}}()
for (id, sub) in proxies
	name = "$sub/corpusjson/$id.json"
	name in names[sub] || continue
	content = zip_readentry(readers[sub], name, String)
	isempty(content) || (texts[id] = words!(NamedTuple{(:form, :cf, :gw, :pos), NTuple{4, String}}[], JSON.parse(content)))
end
# The coordinates of a provenience, from Pleiades, given as [longitude,latitude]
coordinates(value) = (m = match(r"^\[(?<lon>-?[\d.]+),\s*(?<lat>-?[\d.]+)\]$", value); m === nothing ? (missing, missing) :
	(parse(Float64, m[:lon]), parse(Float64, m[:lat])))
field(entry, key) = string(get(entry, key, ""))
# A row per text of the catalogue: its designation and popular name, ruler, period, genre, object, material, provenience
# and date, its number of words, and the start of its transliteration
records = map(sort!(collect(keys(catalogue)))) do id
	entry = catalogue[id]
	words = get(texts, id, [])
	lon, lat = coordinates(field(entry, "pleiades_coord"))
	(text = id, designation = field(entry, "designation"), popular_name = field(entry, "popular_name"), ruler = field(entry, "ruler"),
		period = field(entry, "period"), genre = field(entry, "genre"), object = field(entry, "object_type"),
		material = field(entry, "material"), provenience = field(entry, "provenience"), date = field(entry, "date_of_origin"),
		words = length(words), transliteration = first(join((w.form for w in words), " "), 200), lon = lon, lat = lat)
end
counts(values) = sort!(collect(pairs(Dict(v => count(==(v), values) for v in unique(values)))); by = last, rev = true)
lemmas = [w for words in values(texts) for w in words if !isempty(w.cf)]
println(length(records), " texts, ", length(texts), " of them edited, ", sum(r -> r.words, records), " words, ", length(lemmas), " lemmatised")
println("By ruler: ", join(("$r ($n)" for (r, n) in first(counts([r.ruler for r in records]), 10)), ", "))
println("By object: ", join(("$o ($n)" for (o, n) in first(counts([r.object for r in records]), 8)), ", "))
# The parts of speech of ORACC: N noun, V verb, AJ adjective, AV adverb; RN royal name, GN geographical name, DN divine
# name, PN personal name and others
common = counts(["$(w.cf)[$(w.gw)]" for w in lemmas if w.pos in ("N", "V", "AJ", "AV")])
println("The most frequent words: ", join(("$w ($n)" for (w, n) in first(common, 15)), ", "))
named = counts(["$(w.cf) $(w.pos)" for w in lemmas if w.pos in ("RN", "GN", "DN", "PN")])
println("The most frequent names: ", join(("$w ($n)" for (w, n) in first(named, 15)), ", "))
# The proveniences on a map, each with its number of texts; a click on one shows its name and number
spots = Dict{Tuple{Float64, Float64}, Vector{String}}()
foreach(r -> push!(get!(spots, (r.lon, r.lat), String[]), r.provenience), filter(r -> !ismissing(r.lon), records))
features = ["""{"type":"Feature","geometry":{"type":"Point","coordinates":[$lon,$lat]},"properties":""" *
	"""{"provenience":"$(escape_string(first(proveniences)))","texts":$(length(proveniences))}}""" for ((lon, lat), proveniences) in spots]
places = tempname() * ".geojson"
write(places, """{"type":"FeatureCollection","features":[$(join(features, ","))]}""")
display(Pollis.webmap(Pollis.layer(places; name = "Proveniences", column = "texts"); title = "ORACC: $project", center = (44, 34), zoom = 5))
vscodedisplay([Base.structdiff(r, NamedTuple{(:lon, :lat)}) for r in records], "ORACC: $project")
# The glossary of the project's texts: each word by its citation form, guide word and part of speech, with its number
# of occurrences
glossary = [(cf = cf, gw = gw, pos = pos, occurrences = n) for ((cf, gw, pos), n) in counts([(w.cf, w.gw, w.pos) for w in lemmas])]
vscodedisplay(glossary, "ORACC: glossary of $project")
'''

[[rows]]
id = "dasi"
title = "Digital Archive for the Study of pre-Islamic Arabian Inscriptions (DASI)"
subtitle = "University of Pisa; Consiglio Nazionale delle Ricerche (CNR)"
description = "The inscriptions of pre-Islamic Arabia, each with its text, translation, object, place and bibliography, and their images, in corpora by language; the Corpus of South Arabian Inscriptions (CSAI) is the largest."
covers = "Inscriptions of pre-Islamic Arabia, in Ancient South Arabian and other languages"
period = "Pre-Islamic Arabia"
size = "Over 18,000 texts in the CSAI"
access = "Its site, dasi.cnr.it; it asks not to be read by programs"
