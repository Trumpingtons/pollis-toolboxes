[[rows]]
id = "dio"
title = "Deutsche Inschriften Online (DIO)"
subtitle = "Die Deutschen Inschriften, of the academies of Germany and Austria, on Epigraf"
description = "The articles of the volumes of Die Deutschen Inschriften, the inscriptions of the Middle Ages and early modern times, on Epigraf. The dump of them all gives each article's title, dating, the Wikidata ids of its city or district and links to its images; each volume has a dump of its own in EpiDoc, with the texts. The code reads the dump of them all with DuckDB."
covers = "Medieval and early modern inscriptions of Germany and Austria"
period = "Mostly 14th to 17th century"
size = "31,197 articles, 29,750 of them in 69 printed volumes"
access = "Epigraf's dumps: all articles in JSON-LD, 2 MB; each volume in EpiDoc, Turtle and RDF/XML"
licence = "CC BY 4.0; the images are links, for private use"
code = '''
using DuckDB, Tables, Downloads, ZipArchives
folder = mkpath(expanduser("~/.pollis/data/examples/epigraphy"))  # where the downloads are kept
# The articles of the German Inscriptions Online, a dump of 2 MB downloaded once and unpacked into a JSON-LD file of 54 MB
archive = joinpath(folder, "epigraf-public-cgif-001.zip")
isfile(archive) || Downloads.download("https://epigraf.inschriften.net/files/download/77936", archive)
file = joinpath(folder, "epigraf-public-cgif-001.jsonld")
isfile(file) || write(file, zip_readentry(ZipReader(read(archive)), "epigraf-public-cgif-001.jsonld"))
con = DBInterface.connect(DuckDB.DB)  # an in-memory database
rows(sql) = Tables.columntable(DBInterface.execute(con, sql))
quoted(text) = replace(text, "'" => "''")
# A row per article: its id, its volume and number in the series Die Deutschen Inschriften (DI) when it is printed in
# one (the others are online only, or come from other projects), its title, its years, the Wikidata ids of its city or
# district (and of some objects), and its number of images; the file is a single JSON object, larger than DuckDB reads
# by default
DBInterface.execute(con, """CREATE OR REPLACE TABLE dio AS
	WITH articles AS (SELECT unnest("@reverse"."schema:isPartOf") AS a
		FROM read_json('$(quoted(file))', maximum_object_size = 200000000))
	SELECT regexp_extract(a."@id", '/([^/]+)#dfi\$', 1) AS article,
		'DI ' || TRY_CAST(regexp_extract(a."@id", '~di(\\d+)-', 1) AS INTEGER) AS volume,
		nullif(regexp_extract(a."@id", '~di\\d+-0*(\\w+)', 1), '') AS number, a."schema:name" AS title,
		TRY_CAST(left(a."schema:temporalCoverage"."@value", 4) AS INTEGER) AS year_from,
		TRY_CAST(left(split_part(a."schema:temporalCoverage"."@value", '/', 2), 4) AS INTEGER) AS year_to,
		array_to_string(list_transform(list_filter(a."schema:keywords", lambda k: k."@id" LIKE 'wd:%'),
			lambda k: replace(k."@id", 'wd:', '')), ', ') AS wikidata,
		CAST(CASE WHEN a."schema:image" IS NULL THEN 0 WHEN json_type(a."schema:image") = 'ARRAY'
			THEN json_array_length(a."schema:image") ELSE 1 END AS INTEGER) AS images
	FROM articles""")
n = rows("""SELECT count(*) AS n, count(year_from) AS dated, count(DISTINCT volume) AS volumes, count(volume) AS printed,
	count_if(images > 0) AS illustrated FROM dio""")
println(only(n.n), " articles, ", only(n.printed), " of them in ", only(n.volumes), " printed volumes; ", only(n.dated), " dated, ",
	only(n.illustrated), " with images")
# The articles by century of their first year, from the century 1 (years 1 to 100)
c = rows("""SELECT (year_from - 1) // 100 + 1 AS century, count(*) AS n FROM dio WHERE year_from IS NOT NULL
	GROUP BY century ORDER BY century""")
println("By century: ", join(("$(c.century[i]) ($(c.n[i]))" for i in eachindex(c.n) if c.n[i] >= 100), ", "))
v = rows("SELECT volume, count(*) AS n FROM dio WHERE volume IS NOT NULL GROUP BY volume ORDER BY n DESC LIMIT 8")
println("The volumes with most articles: ", join(("$(v.volume[i]) ($(v.n[i]))" for i in eachindex(v.n)), ", "))
order = "TRY_CAST(regexp_extract(volume, '\\d+') AS INTEGER) NULLS LAST, article"  # by volume, then by article
vscodedisplay(Tables.rowtable(DBInterface.execute(con, "SELECT * FROM dio ORDER BY $order")), "German Inscriptions Online")
'''

[[rows]]
id = "rundata"
title = "Scandinavian Runic-text Database (Rundata)"
subtitle = "Runforum, Department of Scandinavian Languages, Uppsala University"
description = "The runic inscriptions of Scandinavia and of wherever Scandinavians wrote them, each with its place, parish and municipality, period, object, material, carver and style, transliterated, normalised in Old Norse and translated into English, with coordinates in the Swedish grid RT90 or in latitude and longitude. The code reads the files of Rundata 3.1, converts the RT90 coordinates and maps the findspots."
covers = "Runic inscriptions, transliterated, normalised and translated"
period = "Mostly the Viking Age and the Middle Ages"
size = "11,671 inscriptions, 5,196 with coordinates, 6,752 translated into English"
access = "Runforum's site: the files of Rundata 3.1 (2018), 5 MB; the version of 2020 is in Runor, online"
licence = "ODbL and DbCL"
code = '''
using DuckDB, Tables, Downloads, ZipArchives
folder = mkpath(expanduser("~/.pollis/data/examples/epigraphy"))  # where the downloads are kept
# Rundata 3.1, the files of the Windows program of the Scandinavian Runic-text Database (2018), an archive of 5 MB
# downloaded once and read without unpacking it
archive = joinpath(folder, "rundata_3-1_zip.zip")
isfile(archive) || Downloads.download("https://www.runforum.nordiska.uu.se/filer/rundata_3-1_zip.zip", archive)
reader = ZipReader(read(archive))
# The files are in Windows-1252: the bytes 0x80 to 0x9f are the characters of this table, the others the characters of
# the same code
windows = collect("€\u81‚ƒ„…†‡ˆ‰Š‹Œ\u8dŽ\u8f\u90‘’“”•–—˜™š›œ\u9džŸ")
decoded(bytes) = String([0x80 <= b <= 0x9f ? windows[b - 0x7f] : Char(b) for b in bytes])
# The records of a file, a line each, without the lines of its header, which start with "!"
lines(name) = filter(line -> !isempty(line) && !startswith(line, '!'), split(decoded(zip_readentry(reader, name)), "\r\n"))
# A record starts with its signum (as U 344) and its flags (as † for a lost inscription); in RUNDATA.INF its fields
# follow, each between two copies of a control character, the place of its letter in the alphabet: P (16) the place,
# X (24) the coordinates, D (4) the period and so on
signum(line) = join(first(split(line, ' '), 2), ' ')
head(line) = line[1:prevind(line, something(findfirst(c -> c < ' ', line), lastindex(line) + 1))]
function field(line, letter)
	mark = Char(letter - 'A' + 1)
	start = findfirst(mark, line)
	stop = start === nothing ? nothing : findnext(mark, line, nextind(line, start))
	return stop === nothing ? "" : strip(line[nextind(line, start):prevind(line, stop)])
end
info = lines("RUNDATA.INF")
heads = Dict(signum(line) => head(line) for line in info)
# The text of each inscription in RUNDATA.RUN (transliterated) and RUNDATA.ENG (translated into English), after its
# signum and flags
texts(name) = Dict(signum(line) => strip(chopprefix(line, get(heads, signum(line), ""))) for line in lines(name))
runes, english = texts("RUNDATA.RUN"), texts("RUNDATA.ENG")
# The coordinates of a findspot: latitude and longitude in brackets, as (59.3293 ; 18.0686), or northing and easting in
# the Swedish grid RT90, as 6275755.1538971, converted below
function coordinates(text)
	m = match(r"\((?<lat>-?[\d.]+) ; (?<lon>-?[\d.]+)\)", text)
	m === nothing || return (lon = parse(Float64, m[:lon]), lat = parse(Float64, m[:lat]), east = missing, north = missing)
	m = match(r"^(?<north>\d{7})\.(?<east>\d{7})$", text)
	m === nothing || return (lon = missing, lat = missing, east = parse(Float64, m[:east]), north = parse(Float64, m[:north]))
	return (lon = missing, lat = missing, east = missing, north = missing)
end
# A row per inscription: its place, parish and municipality, period, object, material, carver, style, runes and
# English translation; the coordinates of the findspot, else those of where the inscription is now
records = map(info) do line
	s = signum(line)
	x = field(line, 'X')
	(signum = s, place = field(line, 'P'), parish = field(line, 'S'), municipality = field(line, 'K'), period = field(line, 'D'),
		object = field(line, 'L'), material = field(line, 'I'), carver = field(line, 'R'), style = field(line, 'G'),
		runes = get(runes, s, ""), english = get(english, s, ""), coordinates(isempty(x) ? field(line, 'Y') : x)...)
end
# The RT90 coordinates as longitude and latitude, by DuckDB's spatial extension (EPSG:3021 to EPSG:4326)
con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the toolbox installs
grid = tempname() * ".csv"
write(grid, "signum,east,north\n" * join(("\"$(r.signum)\",$(r.east),$(r.north)" for r in records if !ismissing(r.east)), "\n"))
converted = Tables.columntable(DBInterface.execute(con, """SELECT signum, ST_X(p) AS lon, ST_Y(p) AS lat FROM (SELECT signum,
	ST_Transform(ST_Point(east, north), 'EPSG:3021', 'EPSG:4326', always_xy := true) AS p FROM read_csv('$grid', header = true))"""))
lonlat = Dict(converted.signum[i] => (converted.lon[i], converted.lat[i]) for i in eachindex(converted.signum))
records = [haskey(lonlat, r.signum) ? merge(r, (lon = lonlat[r.signum][1], lat = lonlat[r.signum][2])) : r for r in records]
counts(values) = sort!(collect(pairs(Dict(v => count(==(v), values) for v in unique(values)))); by = last, rev = true)
println(length(records), " inscriptions, ", count(r -> !ismissing(r.lon), records), " with coordinates, ",
	count(r -> !isempty(r.english), records), " translated into English")
# The periods by their first letter: V the Viking Age, M the Middle Ages, U the Proto-Norse period (urnordisk)
println("By period: ", join(("$p ($n)" for (p, n) in counts([first(r.period, 1) for r in records])), ", "))
# The first part of a signum is the region: a Swedish province (U Uppland, Sö Södermanland, Ög Östergötland), N Norway,
# DR Denmark, and others
println("By region: ", join(("$p ($n)" for (p, n) in first(counts([first(split(r.signum)) for r in records]), 12)), ", "))
# The findspots on a map, each with its number of inscriptions; a click on one shows its place and number
spots = Dict{Tuple{Float64, Float64}, Vector{String}}()
foreach(r -> push!(get!(spots, (r.lon, r.lat), String[]), r.place), filter(r -> !ismissing(r.lon), records))
features = ["""{"type":"Feature","geometry":{"type":"Point","coordinates":[$lon,$lat]},"properties":""" *
	"""{"place":"$(escape_string(first(names)))","inscriptions":$(length(names))}}""" for ((lon, lat), names) in spots]
places = tempname() * ".geojson"
write(places, """{"type":"FeatureCollection","features":[$(join(features, ","))]}""")
display(Pollis.webmap(Pollis.layer(places; name = "Findspots", column = "inscriptions"); title = "Scandinavian Runic-text Database",
	center = (14, 60), zoom = 4))
vscodedisplay([Base.structdiff(r, NamedTuple{(:lon, :lat, :east, :north)}) for r in records], "Scandinavian Runic-text Database")
'''
