dio(con; folder)
articles = Tables.rowtable(DBInterface.execute(con, "SELECT * FROM dio"))
println(length(articles), " articles, ", count(a -> !ismissing(a.volume), articles), " of them in ",
	length(unique(skipmissing(a.volume for a in articles))), " printed volumes; ", count(a -> !ismissing(a.year_from), articles),
	" dated, ", count(a -> a.images > 0, articles), " with images")
# The articles by century of their first year, those with 100 or more
println("By century: ", join(("$c ($k)" for (c, k) in sort(tally(century(a.year_from) for a in articles if !ismissing(a.year_from))) if k >= 100), ", "))
println("The volumes with most articles: ", tallied(skipmissing(a.volume for a in articles); top = 8))
vscodedisplay(articles, "German Inscriptions Online")
'''

[[rows]]
id = "rundata"
title = "Scandinavian Runic-text Database (Rundata)"
subtitle = "Runforum, Department of Scandinavian Languages, Uppsala University"
description = "The runic inscriptions of Scandinavia and of wherever Scandinavians wrote them, each with its place, parish and municipality, period, object, material, carver and style, transliterated, normalised in Old Norse and translated into English, with coordinates in the Swedish grid RT90 or in latitude and longitude. The code reads the files of Rundata 3.1, converts the RT90 coordinates and maps the findspots."
covers = "Runic inscriptions, transliterated, normalised and translated"
period = "Mostly the Viking Age and the Middle Ages"
size = "11,671 inscriptions, 5,196 with coordinates, 6,752 translated into English"
access = "Runforum's site: the files of Rundata 3.1 (2018), 5 MB; the version of 2020 is in Runor, online"
licence = "ODbL and DbCL"
code = '''
using HistoricalGeography, DuckDB
folder = expanduser("~/.pollis/data/examples/epigraphy")  # where the downloads are kept
con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the toolbox installs
# Rundata 3.1, from the files of its Windows program, an archive of 5 MB downloaded once; the coordinates of the Swedish
# grid RT90 converted to longitude and latitude by DuckDB's spatial extension
inscriptions = rundata(con; folder)
println(length(inscriptions), " inscriptions, ", count(i -> !ismissing(i.lon), inscriptions), " with coordinates, ",
	count(i -> !isempty(i.english), inscriptions), " translated into English")
# The periods by their first letter: V the Viking Age, M the Middle Ages, U the Proto-Norse period (urnordisk)
println("By period: ", tallied(first(i.period, 1) for i in inscriptions))
# The first part of a signum is the region: a Swedish province (U Uppland, Sö Södermanland, Ög Östergötland), N Norway,
# DR Denmark, and others
println("By region: ", tallied((first(split(i.signum)) for i in inscriptions); top = 12))
# The findspots on a map, each with its number of inscriptions; a click on one shows its place and number
