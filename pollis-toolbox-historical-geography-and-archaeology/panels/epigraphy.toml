[[rows]]
id = "dio"
title = "Deutsche Inschriften Online (DIO)"
subtitle = "Die Deutschen Inschriften, of the academies of Germany and Austria, on Epigraf"
description = "The articles of the volumes of Die Deutschen Inschriften, the inscriptions of the Middle Ages and early modern times, on Epigraf. The dump of them all gives each article's title, dating, the Wikidata ids of its city or district and links to its images; each volume has a dump of its own in EpiDoc, with the texts. The code reads the dump of them all with DuckDB."
covers = "Medieval and early modern inscriptions of Germany and Austria"
period = "Mostly 14th to 17th century"
size = "31,197 articles, 29,750 of them in 69 printed volumes"
access = "Epigraf's dumps: all articles in JSON-LD, 2 MB; each volume in EpiDoc, Turtle and RDF/XML"
licence = "CC BY 4.0; the images are links, for private use"
code = '''
using HistoricalGeography, DuckDB, Tables
folder = expanduser("~/.pollis/data/examples/epigraphy")  # where the downloads are kept
con = DBInterface.connect(DuckDB.DB)  # an in-memory database
# The articles of the German Inscriptions Online as the table dio, from a dump of 2 MB downloaded once: an article
# printed in the series Die Deutschen Inschriften (DI) has its volume and number there; the others are online only,
