[[rows]]
id = "cdli"
title = "Cuneiform Digital Library Initiative (CDLI)"
subtitle = "Oxford, Berlin and Los Angeles"
description = "The catalogue of the cuneiform objects in the world's collections, each with its period, provenience, genre, language, material, museum number and publications, and the transliterations in ATF of the objects edited, some with an English translation. The code reads the dump of August 2022 on GitHub, the last one there, and counts the objects by period, genre, language and provenience; the site, cdli.earth, exports a search at a time through its API."
covers = "Cuneiform tablets, seals, cones, bricks and other objects, in Sumerian, Akkadian, Hittite and other languages"
period = "Mostly Ur III, Old Babylonian and Neo-Assyrian (about 2100 to 612 BCE)"
size = "353,283 objects, 133,133 of them transliterated"
access = "GitHub (cdli-gh/data), the dump of August 2022: 155 MB and 87 MB; its site's API, a search at a time"
licence = "Texts free to re-use, citing the CDLI; images for non-commercial use"
code = '''
using HistoricalGeography, DuckDB, Tables
folder = expanduser("~/.pollis/data/examples/epigraphy")  # where the downloads are kept
con = DBInterface.connect(DuckDB.DB)  # an in-memory database
# The catalogue and the transliterations of the CDLI as the table cdli, from files of 155 MB and 87 MB downloaded once
# from its dump of August 2022: each object with its number of lines and the start of its transliteration and of its
# English translation
cdli(con; folder)
n = Tables.columntable(DBInterface.execute(con, "SELECT count(*) AS n, count_if(lines > 0) AS transliterated, count_if(translation <> '') AS translated FROM cdli"))
println(only(n.n), " objects, ", only(n.transliterated), " transliterated, ", only(n.translated), " translated into English")
for column in ("period", "genre", "language", "provenience")
	values = Tables.columntable(DBInterface.execute(con, "SELECT coalesce($column, '(not given)') AS v FROM cdli")).v
	println("By ", column, ": ", tallied(values; top = 8))
end
# The Table Viewer shows the first 100,000 transliterated objects; the table cdli holds them all
vscodedisplay(Tables.rowtable(DBInterface.execute(con, "SELECT * FROM cdli WHERE lines > 0 LIMIT 100000")), "Cuneiform Digital Library Initiative")
'''

[[rows]]
id = "oracc"
title = "Open Richly Annotated Cuneiform Corpus (ORACC)"
subtitle = "University of Pennsylvania Museum, with the editors of its projects"
description = "Lemmatised editions of cuneiform texts in projects such as the Royal Inscriptions of the Neo-Assyrian Period (RINAP), the State Archives of Assyria (SAAo) and the Electronic Text Corpus of Sumerian Royal Inscriptions (ETCSRI): each word with its form as written, citation form, guide word and part of speech, and each project's catalogue with the coordinates of the proveniences from Pleiades. The code reads a project, RINAP unless another is named, with its subprojects, maps its proveniences and builds its glossary."
covers = "Lemmatised cuneiform texts in Sumerian, Akkadian and other languages"
period = "By project: RINAP, 744 to 612 BCE"
size = "208 JSON archives; RINAP, 1,037 texts and 198,281 words"
access = "Its JSON page, an archive per project and subproject: RINAP 24 MB, and 53 MB for its five subprojects"
licence = "CC0 for the data; the annotated editions under CC BY-SA 3.0, as their credits say"
code = '''
using HistoricalGeography
# An ORACC project, by its name on ORACC's JSON page (oracc.museum.upenn.edu/json): rinap, the Royal Inscriptions of
# the Neo-Assyrian Period, or riao, ribo, etcsri, saao, dcclt and others
project = "rinap"
folder = expanduser("~/.pollis/data/examples/epigraphy")  # where the downloads are kept
# The texts of the project and the glossary of its edited texts, from its JSON archives, downloaded once
texts, glossary = oracc(project; folder)
println(length(texts), " texts, ", count(t -> t.words > 0, texts), " of them edited, ", sum(t -> t.words, texts), " words, ",
	sum(g -> g.occurrences, glossary), " lemmatised")
println("By ruler: ", tallied((t.ruler for t in texts); top = 10))
println("By object: ", tallied((t.object for t in texts); top = 8))
# The parts of speech of ORACC: N noun, V verb, AJ adjective, AV adverb; RN royal name, GN geographical name, DN divine
# name, PN personal name and others
println("The most frequent words: ", join(("$(g.cf)[$(g.gw)] ($(g.occurrences))" for g in first(filter(g -> g.pos in ("N", "V", "AJ", "AV"), glossary), 15)), ", "))
println("The most frequent names: ", join(("$(g.cf) $(g.pos) ($(g.occurrences))" for g in first(filter(g -> g.pos in ("RN", "GN", "DN", "PN"), glossary), 15)), ", "))
# The proveniences on a map, each with its number of texts
places = findspots_geojson(texts; name = :provenience, count = :texts)
display(Pollis.webmap(Pollis.layer(places; name = "Proveniences", column = "texts"); title = "ORACC: $project", center = (44, 34), zoom = 5))
vscodedisplay(texts, "ORACC: $project")
vscodedisplay(glossary, "ORACC: glossary of $project")
'''

