# Conquests: the maps of the Historical Geography and Archaeology Toolbox under this topic, a row per map with the
# work it follows, its kind, years, region, source and licence, and the Julia code that draws it

[meta]
title = "Conquests"
viewType = "pollis.conquests"
style = "minimal"
intro = "The battles and campaigns of a conqueror, from the first to the last, over the realms of their years."
rowTitle = "Map"

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"
minimum = "0.1.6"

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/DuckDB.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

# The table: the columns after the maps' titles, then a row per map

[[columns]]
id = "kind"
label = "Kind"

[[columns]]
id = "years"
label = "Years"

[[columns]]
id = "region"
label = "Region"

[[columns]]
id = "source"
label = "Source"

[[columns]]
id = "licence"
label = "Licence"

[[rows]]
id = "alexander"
title = "Conquests of Alexander the Great"
subtitle = "Arrian, Anabasis of Alexander"
description = "The battles and sieges of Alexander's campaigns, from the Balkans to the Indus."
kind = "Historical"
years = "336–323 BCE"
region = "From Macedonia to Egypt and the Indus"
source = "Wikidata"
licence = "CC0 1.0"
code = '''
using HistoricalGeography, DuckDB, Tables
con = DBInterface.connect(DuckDB.DB)
foreach(sql -> DBInterface.execute(con, sql), ["LOAD spatial", "SET geometry_always_xy = true"])
folder = mkpath(expanduser("~/.pollis/data/examples/topic-maps"))  # where the downloads are kept
# The battles and sieges of Alexander's campaigns that Wikidata gives with a place and a date
war = war_events(con, "Q551888"; folder)
# The realms of Cliopatria in the same area and years, under the events
historical_borders(con, :cliopatria; folder, box = war.box, since = war.since, upto = war.upto)
display(Pollis.webmap(Pollis.layer(borders_geojson(con); name = "Realms", column = "name", opacity = 0.25, years = ("starts", "ends")),
	Pollis.layer(war.path; name = "Events", column = "kind", years = ("starts", "until"));
	title = "Conquests of Alexander the Great", year = war.since, labels = false))
'''

