# American Stories: the articles of American Stories, the text of the newspapers of Chronicling America read article by article by Dell and nine coauthors (2023), downloaded a year at a time from Hugging Face, searched in Julia by words and dates, the articles found retrieved as a table, read with the words of the query marked, and saved as text files; with JSON.jl and CodecZlib.jl

[meta]
title = "American Stories"
viewType = "pollis.americanstories"
style = "timeArrow"
intro = "Find articles in American Stories, the text of the American newspapers of Chronicling America, 1774 to 1963, read article by article with their headlines and bylines by Dell and nine coauthors (2023): download the years you need once, query them by words and dates, retrieve the articles found as a table, read an article with the words of the query marked, and save the texts. American Stories has no search service: its years are archives on Hugging Face, from a few MB for the 1770s to 7.6 GB for 1910, and Julia searches the archives downloaded. A step first runs the steps before it that have not run in the Julia REPL as they are now."

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"
minimum = "0.1.9"

[[steps]]
id = "download"
title = "Download"
intro = "Download the archives of the years between two dates into the folder, those not there yet, once: each year of American Stories is one archive, of every article of that year's scans. The step shows the size of each before it downloads, and stops if they come to more than the most you allow."
code = '''
using HistoricalGeography, Dates
# The dates of the articles to search, the folder of the archives, and the most to download now, in GB
from, to = Date("{{from}}"), Date("{{to}}")
folder = expanduser(raw"{{folder}}")
# The archives of American Stories on Hugging Face, a year each, downloaded once into the folder americanstories
years = americanstories_download(from, to; at_most_gb = {{downloadAtMost}}, folder)
'''

[[steps.inputs]]
id = "from"
label = "From"
tooltip = "The first day of publication, as year-month-day: 1830-01-01. American Stories runs from 1774 to 1963, with few newspapers before 1830."
default = "1830-01-01"

[[steps.inputs]]
id = "to"
label = "To"
tooltip = "The last day of publication, as year-month-day: 1830-12-31. Each year from the first to the last is downloaded: 0.16 GB for 1830, 1.7 GB for 1865, 6 GB for 1900, 7.6 GB for 1910, 1 GB for 1930."
default = "1830-12-31"

[[steps.inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. The archives go into americanstories, and stay there for the next queries."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[steps.inputs]]
id = "downloadAtMost"
label = "Download at Most"
tooltip = "The most to download now, in GB: 5 by default. The step stops before downloading if the years not yet in the folder come to more."
default = "5"

[[steps]]
id = "query"
title = "Query"
intro = "Search the articles of the years downloaded for the words, and count those that have them, year by year (decade by decade, over more than 60 years). Words are joined by AND, OR and NOT, words without an operator by AND, with brackets; a phrase goes in quotes, and a word ending in * stands for all its endings. Julia reads each archive through, about 30 MB a second, so a year of the 1900s takes a few minutes."
code = '''
# The query: the words, and optionally the newspaper and the state, a part of their names
words = strip(raw""" {{words}} """)
newspaper = strip(raw""" {{newspaper}} """)
state = strip(raw""" {{state}} """)
kept = {{keepAtMost}}
# The articles with the words, in the scans of the dates asked, read from each archive as it is decompressed, each with
# how often the words are in it; a phrase's words apart by spaces, line breaks or a hyphen, as the OCR left them
query = text_query(words)
found = americanstories_articles(query, from, to; newspaper, state, keep = kept, folder)
total = sum(values(found.years); init = 0)
println(total, " articles found for ", words, " from ", from, " to ", to, isempty(newspaper) ? "" : " in the newspapers called $newspaper",
	isempty(state) ? "" : " of $state", total > kept ? ", the $kept most relevant kept" : "")
print_bars(period_counts(found.years, year(from), year(to)))
'''

[[steps.inputs]]
id = "words"
label = "Words"
tooltip = "The words to find: railroad, or railroad AND Baltimore, or (railroad OR canal) NOT Erie, or \"rail road\" for the words next to one another, or rail* for railroad, railway, rails and the other words it starts. Capitals do not matter."
default = "railroad OR \"rail road\" OR railway"

[[steps.inputs]]
id = "newspaper"
label = "Newspaper"
tooltip = "Empty for all the newspapers, or a part of the title of one as Chronicling America gives it: Richmond Whig, Northern star, Evening star. Step 3 shows the titles of the newspapers found."
default = ""

[[steps.inputs]]
id = "state"
label = "State"
tooltip = "Empty for all the states, or the state where the newspaper was published, or a part of its name: Virginia, New York, District of Columbia."
default = ""

[[steps.inputs]]
id = "keepAtMost"
label = "Keep at Most"
tooltip = "The number of articles found that are kept for the next steps, the most relevant (those where the words come most often): 50,000 by default. All the articles found are counted."
default = "50000"

[[steps]]
id = "retrieve"
title = "Retrieve"
intro = "Retrieve the articles found, up to a number, as a table: a row per article with its date, newspaper, state, page, headline and byline, how often the words are in it, and the link to its page on Chronicling America. The articles come from the search of Step 2, with no further request."
code = '''
total == 0 && error("Step 2 found no articles: change its words, newspaper or state, or the dates of Step 1")
results = ranked(found.articles, "{{order}}"; at_most = {{atMost}}, date = :date)
println(length(results), " of ", total, " articles retrieved, from ", minimum(r -> r.date, results), " to ", maximum(r -> r.date, results))
println("By newspaper: ", tallied([r.newspaper for r in results]; top = 10))
println("By state: ", tallied([r.state for r in results]; top = 10))
vscodedisplay(without([merge(r, (words = length(split(r.text)),)) for r in results], :text), "American Stories: $words")
'''

[[steps.inputs]]
id = "atMost"
label = "At Most"
tooltip = "The number of articles to retrieve at most: 1,000 by default."
default = "1000"

[[steps.inputs]]
id = "order"
label = "Order"
kind = "select"
tooltip = "Most Relevant First: the articles where the words come most often. Oldest First and Newest First: by date of publication."
default = "relevance"

[[steps.inputs.options]]
value = "relevance"
label = "Most Relevant First"

[[steps.inputs.options]]
value = "oldest"
label = "Oldest First"

[[steps.inputs.options]]
value = "newest"
label = "Newest First"

[[steps]]
id = "read"
title = "Read"
intro = "Read an article in full, by its number in the table of Step 3: its headline, byline and text, as American Stories read them from the scan, open in Pollis's browser with the words of the query marked, and the link to its page on Chronicling America, where the scan is."
code = '''
article = results[{{number}}]
# The article, with the words of the query marked where it has them
paragraphs = [strip(p) for p in split(article.text, r"\n\s*\n") if !isempty(strip(p))]
page = reading_page(isempty(article.headline) ? article.newspaper : article.headline, paragraphs; marks = query.patterns, mark_title = true,
	passages = false, meta = (isempty(article.byline) ? "" : article.byline * " · ") *
	"$(article.newspaper), $(article.state), $(Dates.format(article.date, "d U yyyy")), page $(article.page)",
	link = "The page on Chronicling America" => article.chronicling_america)
Pollis.browse(page.file)
println(article.headline, "\n", article.newspaper, ", ", article.date, ", page ", article.page, "\n\n", article.text)
'''

[[steps.inputs]]
id = "number"
label = "Article"
tooltip = "The number of the article, in the column number of the table of Step 3."
default = "1"

[[steps.actions]]
id = "scan"
label = "The Page on Chronicling America"
desc = "Open the article's page on Chronicling America, at the Library of Congress, in Pollis's browser: the scan of the newspaper page"
code = '''
Pollis.browse(article.chronicling_america)
'''

[[steps]]
id = "save"
title = "Save"
intro = "Save the texts of the articles retrieved as text files, a file each with its headline, byline, newspaper, date, page and link above its text, and the table of Step 3 as a CSV file beside them, in the folder of Step 1. The texts came with the search, so saving makes no request."
code = '''
# The texts, a file each, and the table of the articles, in a folder named after the words and the dates
saved = save_texts(joinpath(folder, "americanstories", "articles", plain_name(words) * "-$from-$to"), results; count = {{toSave}},
	table = "articles.csv", name = r -> "$(r.date)-$(plain_name(r.newspaper, 40))",
	header = r -> [r.headline, r.byline, "$(r.newspaper), $(r.state), $(r.date), page $(r.page)", r.chronicling_america])
println(saved.saved, " texts and the table of the ", length(results), " articles in ", saved.folder)
'''

[[steps.inputs]]
id = "toSave"
label = "Articles to Save"
tooltip = "The number of articles whose texts are saved, the first in the table of Step 3: all of those retrieved by default."
default = "1000"
