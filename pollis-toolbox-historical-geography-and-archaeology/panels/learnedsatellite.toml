title = "Learned Detection in Satellite Images"
viewType = "pollis.learnedsatellite"
style = "timeArrow"
intro = "Find archaeological sites in satellite images with a model trained on sites already known, from the scenes of Sentinel-2 to the features saved for a GIS. A step first runs the steps before it that have not run in the Julia REPL as they are now, so a new threshold does not train the model again."

