# Learned Detection in Satellite Images: a random forest trained on known sites in a multitemporal Sentinel-2 composite, after Orengo and 6 coauthors (2020), run in Julia with ArchaeologicalDetection.jl and DecisionTree.jl, the scenes read from Earth Search with ArchGDAL.jl and Rasters.jl, and SmartRegions.jl for the outlines and the scheduled monuments

