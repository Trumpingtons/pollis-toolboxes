# Encyclopédie: the articles of the Encyclopédie of Diderot and d'Alembert in the ARTFL Encyclopédie of the University of Chicago, searched by words, class of knowledge and author through its PhiloLogic service, the articles found retrieved as a table, read with the words marked beside the scan of their first page, and saved as text files; with JSON.jl

[meta]
title = "Encyclopédie"
viewType = "pollis.encyclopedie"
style = "timeArrow"
intro = "Find articles of the Encyclopédie, ou dictionnaire raisonné des sciences, des arts et des métiers, edited by Denis Diderot and Jean le Rond d'Alembert from 1751 to 1772, about 74,000 articles in 17 volumes of text: query them by words, and optionally by their class of knowledge and their author, retrieve the articles found as a table, read an article with the words marked, and save the texts. The text is that of the ARTFL Encyclopédie of the University of Chicago, edited by Robert Morrissey and Glenn Roe, whose PhiloLogic service answers the queries, with the authors that Frank Kafker identified. A step first runs the steps before it that have not run in the Julia REPL as they are now."

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"
minimum = "0.1.9"

[[steps]]
id = "query"
title = "Query"
intro = "Find the articles that have the words, and count them volume by volume, with their classes and authors. Words are joined by AND, OR and NOT, words without an operator by AND, with brackets, and a phrase goes in quotes; a word ending in * stands for all its endings, and capitals do not matter, nor accents but in quotes. ARTFL is asked once for each word or phrase, and Julia joins the articles found."
code = '''
using HistoricalGeography
# The query: the words, and optionally the class of knowledge and the author of the articles
words = strip(raw""" {{words}} """)
class = strip(raw""" {{class}} """)
author = strip(raw""" {{author}} """)
# The articles with the words, from ARTFL's counts of the hits of each word or phrase broken up by article, half a second
# apart; in quotes as written, with its accents
found = encyclopedie_search(words; class, author)
total = length(found)
println(total, " articles have ", words, isempty(class) ? "" : ", in the class $class", isempty(author) ? "" : ", by $author")
print_bars(["Volume " * lpad(v, 2) => count(a -> a.volume == v, found) for v in 1:17])
println("Classes: ", tallied(filter(!isempty, [a.class for a in found]); top = 8))
println("Authors: ", tallied(filter(!isempty, [a.author for a in found]); top = 8))
'''

[[steps.inputs]]
id = "words"
label = "Words"
tooltip = "The words to find, in French: vapeur, or machine* AND feu, or (\"thé\" OR café) NOT sucre, or machine à feu in quotes for the words next to one another. A word ending in * finds all its endings. Capitals do not matter, and accents only in quotes: \"thé\" finds thé and not the English the."
default = "vapeur"

[[steps.inputs]]
id = "class"
label = "Class"
tooltip = "Empty for all the classes of knowledge, or one as the Encyclopédie names it: Physique, Chimie, Géographie moderne, Grammaire, Jurisprudence, Médecine, Marine, Histoire naturelle; several joined by |, such as Physique | Chimie. Step 1 shows the classes of the articles found."
default = ""

[[steps.inputs]]
id = "author"
label = "Author"
tooltip = "Empty for all the authors, or a name, or a part of one, as Frank Kafker identified the authors: Diderot, Alembert, Jaucourt, Rousseau, Voltaire, Turgot. Step 1 shows the authors of the articles found."
default = ""

[[steps]]
id = "retrieve"
title = "Retrieve"
intro = "Retrieve the articles found, up to a number, as a table: a row per article with its volume, headword, author and whether the article is signed or attributed to the author, its class of knowledge as the Encyclopédie gives it and as ARTFL's classifier gives it, how often the words are in it, and its page on ARTFL. The table makes no request: Read and Save get the texts."
code = '''
total == 0 && error("Step 1 found no articles: change its words, class or author")
results = ranked(found, "{{order}}" == "relevance" ? "relevance" : "work"; at_most = {{atMost}})
println(length(results), " of ", total, " articles retrieved")
vscodedisplay(without(results, :id), "Encyclopédie: $words")
'''

[[steps.inputs]]
id = "atMost"
label = "At Most"
tooltip = "The number of articles to retrieve at most: 1,000 by default."
default = "1000"

[[steps.inputs]]
id = "order"
label = "Order"
kind = "select"
tooltip = "Most Relevant First: the articles where the words come most often. In the Order of the Work: volume by volume, as the articles follow one another."
default = "relevance"

[[steps.inputs.options]]
value = "relevance"
label = "Most Relevant First"

[[steps.inputs.options]]
value = "work"
label = "In the Order of the Work"

[[steps]]
id = "read"
title = "Read"
intro = "Read an article, by its number in the table of Step 2: its text, which ARTFL gives in a request, opens in Pollis's browser with the words marked where they are, and its page on ARTFL and the scan of its first page."
code = '''
chosen = results[{{number}}]
# The text of the article, without ARTFL's index fields and page images, with the words marked, capitals apart, and
# accents apart unless they were in quotes; and the scans of its pages
read_article = encyclopedie_article(chosen.id)
Pollis.browse(encyclopedie_page(chosen, read_article, words))
println(chosen.headword, ", volume ", chosen.volume, ", ", chosen.author, "\n\n", read_article.text)
'''

[[steps.inputs]]
id = "number"
label = "Article"
tooltip = "The number of the article, in the column number of the table of Step 2."
default = "1"

[[steps.actions]]
id = "artfl"
label = "The Article on ARTFL"
desc = "Open the article on ARTFL in Pollis's browser, with the articles before and after it"
code = '''
Pollis.browse(chosen.artfl)
'''

[[steps.actions]]
id = "scan"
label = "The Scan of Its First Page"
desc = "Open the scan of the page where the article starts in Pollis's browser, as printed"
code = '''
isempty(read_article.scans) ? println("ARTFL has no scan of the page of this article") : Pollis.browse(first(read_article.scans))
'''

[[steps]]
id = "save"
title = "Save"
intro = "Save the texts of the articles retrieved as text files, a file each with its headword, volume, class, author and link above its text, and the table of Step 2 as a CSV file beside them. ARTFL gives the text of each article in a request, with a pause of half a second."
code = '''
# The texts, a file each, fetched from ARTFL, and the table of the articles, in a folder named after the words, the class
# and the author
saved = save_texts(joinpath(expanduser(raw"{{folder}}"), "encyclopedie", plain_name(join(filter(!isempty, [words, class, author]), " "))), results;
	count = {{toSave}}, table = "articles.csv", name = r -> "volume$(r.volume)-$(plain_name(r.headword, 40))", text = r -> encyclopedie_article(r.id).text,
	header = r -> [r.headword, "Encyclopédie, volume $(r.volume), $(r.class)", r.author * (isempty(r.attribution) ? "" : " ($(r.attribution))"), r.artfl],
	columns = (:number, :volume, :headword, :author, :attribution, :class, :machine_class, :entry_type, :hits, :artfl))
println(saved.saved, " texts and the table of the ", length(results), " articles in ", saved.folder)
isempty(saved.missed) || println("The texts of articles ", join(saved.missed, ", "), " did not come: run the step again to save them")
'''

[[steps.inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. The texts go into encyclopedie, in a folder named after the words."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[steps.inputs]]
id = "toSave"
label = "Articles to Save"
tooltip = "The number of articles whose texts are saved, the first in the table of Step 2: 100 by default, a request each."
default = "100"
