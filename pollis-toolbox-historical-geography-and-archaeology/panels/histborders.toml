[[faq]]
question = "Why does the map stay the same for several years when I move the slider?"
answer = "The slider moves year by year, and each source records borders at its own years. Cliopatria gives each shape a range of years, sampled at varying steps; Historical Basemaps has maps at chosen years, each shown until the next; CShapes 2.0 dates each change from 1886.\n\nThe map names the last year in which a border changes in the source, and Years of Change lists those years by century."
wiki = "Diagnostics"

[[faq]]
question = "Should I choose Realms or Their Parts?"
answer = "Choose Realms for a map of kingdoms, empires and other states, each drawn once as a whole: a kingdom stands for the duchies and counties Cliopatria places inside it.\n\nChoose Their Parts for those duchies, counties and other members, drawn separately. The two levels are never drawn together, as they cover the same land."
wiki = "Decision Guide"

[[faq]]
question = "How do I find which states ruled my town over the centuries?"
answer = "Give the town's longitude and latitude as Place, set From and Until, run the Example Code and then History of a Place. The action lists, in order, each state whose territory holds the point and the years for which the source has it.\n\nRead the years as those of the source: near a border, or in years between two recorded shapes, check a history of the region."
wiki = "Decision Guide"

[[faq]]
question = "Which source should I use for the twentieth century?"
answer = "CShapes 2.0, which maps independent states and dependencies from 1886 to 2019 with the dates on which their borders change. The Historical Borders panel shows a shape for a year when it is in force on 31 December of that year.\n\nFor the years after 2019, choose Cliopatria, whose records run to 2024."
wiki = "CShapes 2.0"

[[faq]]
question = "What does a border precision of 1 mean in Historical Basemaps?"
answer = "BORDERPRECISION 1 means an approximate border, 2 a moderately precise one, and 3 a border determined by international law."
wiki = "Historical Basemaps"
hidden = true

[[faq]]
question = "From which year does CShapes 2.0 have borders?"
answer = "CShapes 2.0 has borders from 1886 to 2019. An earlier From is moved to 1886."
wiki = "CShapes 2.0"
hidden = true

[[faq]]
question = "Are Cliopatria's relations between polities, such as personal unions, drawn as states?"
answer = "No. The Historical Borders panel leaves out the rows of type RELATION, such as personal unions, vassalages, alliances and allegiances, and keeps the rows of type POLITY."
wiki = "Cliopatria"
hidden = true

