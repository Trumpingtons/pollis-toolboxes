[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Where the files of the sources are kept once downloaded, and where Export saves: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[inputs]]
id = "box"
label = "Box"
tooltip = "The area mapped, as west, south, east, north in degrees. The default is Europe."
default = "-12, 34, 45, 72"

[[inputs]]
id = "units"
label = "Units"
kind = "select"
default = "realms"
tooltip = "Realms: each kingdom, empire or other state once, as a whole. Their Parts: the members Cliopatria places inside them."
models = ["cliopatria"]

[[inputs.options]]
value = "realms"
label = "Realms"

[[inputs.options]]
value = "parts"
label = "Their Parts"

[[inputs]]
id = "since"
label = "From"
tooltip = "The first year of the slider. Cliopatria starts in 3400 BCE (written -3400), Historical Basemaps in the year 100 here, CShapes 2.0 in 1886."
default = "1300"
newRow = true

[[inputs]]
id = "upto"
label = "Until"
tooltip = "The last year of the slider. Cliopatria ends in 2024, Historical Basemaps in 2010, CShapes 2.0 in 2019."
default = "2024"

[[inputs]]
id = "year"
label = "Year"
tooltip = "The year the slider opens on, and the year of the Next Steps. A year outside the source is moved to its first or last."
default = "1500"

[[inputs]]
id = "other"
label = "Other Year"
tooltip = "The year that Two Years sets beside Year."
default = "1914"

[[inputs]]
id = "place"
label = "Place"
tooltip = "A point as longitude, latitude, for History of a Place. The default is Bologna."
default = "11.3426, 44.4938"

[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables, HistoricalGeography

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude
rows(sql) = Tables.columntable(DBInterface.execute(con, sql))
quoted(text) = replace(text, "'" => "''")
folder = mkpath(expanduser(raw"{{folder}}"))  # where the sources' files are kept once downloaded
box = ({{box}})  # west, south, east, north, in degrees

# the borders of the source in the Box, from From to Until, as the table borders: name, starts, ends, geom and km2, the area in the Box
{{?model=cliopatria}}b = historical_borders(con, :cliopatria; folder, box, since = {{since}}, upto = {{upto}}, units = :{{units}})
{{?model=basemaps}}b = historical_borders(con, :basemaps; folder, box, since = {{since}}, upto = {{upto}})
{{?model=cshapes}}b = historical_borders(con, :cshapes; folder, box, since = {{since}}, upto = {{upto}})
source, since, upto, changes = b.source, b.since, b.upto, b.changes  # the years with borders in the Box, and those in which one changes
year = clamp({{year}}, since, upto)

# the map: every shape with its years, simplified for drawing, of which the slider shows those of one year
shapes = borders_geojson(con)
println(source, ": ", length(changes), " years of change from ", since, " to ", upto, "; the slider opens on ", year)
display(Pollis.webmap(Pollis.layer(shapes; name = "States", column = "name", opacity = 0.75, years = ("starts", "ends"));
	title = "Historical Borders: $(source)", year, labels = false))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "map-of-year"
label = "Map of the Year"
desc = "The states of Year on an OpenStreetMap base map in Pollis's map view, with the Place marked; click a state for its name, years and area"
code = '''
lon, lat = parse.(Float64, split("{{place}}", ","))
dir = mktempdir()
DBInterface.execute(con, "COPY (SELECT name, starts, ends, round(km2) AS km2, geom FROM borders WHERE starts <= $(year) AND ends >= $(year)) TO '$(quoted(joinpath(dir, "year.geojson")))' (FORMAT GDAL, DRIVER 'GeoJSON')")
marker = """{"type":"FeatureCollection","features":[{"type":"Feature","properties":{"name":"Place"},"geometry":{"type":"Point","coordinates":[$(lon),$(lat)] } }]}"""
display(Pollis.webmap(Pollis.layer(joinpath(dir, "year.geojson"); name = "$(source), $(year)", column = "name"),
	Pollis.layer(marker; name = "Place", color = "#d62728"); title = "$(source), $(year)"))
'''

[[actionGroups.actions]]
id = "states-over-time"
label = "States Over Time"
desc = "How many states the source has in the Box in each year, as a line drawn with ECharts"
code = '''
using ECharts

d = rows("SELECT y.y, count(DISTINCT b.name) AS n FROM (SELECT unnest(range($(since), $(upto) + 1)) AS y) y LEFT JOIN borders b ON y.y BETWEEN b.starts AND b.ends GROUP BY y.y ORDER BY y.y")
EChart(ec_width = 700, ec_height = 400, title = [ECharts.Title(text = "States in the Box, $(source)")],
	xAxis = [ECharts.Axis(_type = "category", data = string.(d.y))], yAxis = [ECharts.Axis(_type = "value", name = "states")],
	series = [ECharts.XYSeries(name = "states", _type = "line", data = Int.(d.n))])
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "years-of-change"
label = "Years of Change"
desc = "The years in which the source changes a border in the Box, by century: between them the map stays the same"
code = '''
for century in sort(unique(fld.(changes, 100)))
	recorded = [y for y in changes if fld(y, 100) == century]
	println(rpad(string(100century, " to ", 100century + 99), 16), lpad(length(recorded), 3), ": ", join(recorded, ", "))
end
'''

[[actionGroups.actions]]
id = "overlaps"
label = "Overlapping States"
desc = "The pairs of states that the source draws on the same land in Year, by the area they share"
code = '''
o = rows("""SELECT * FROM (SELECT a.name AS one, b.name AS two, ST_Area_Spheroid(ST_CollectionExtract(ST_Intersection(a.geom, b.geom), 3)) / 1e6 AS km2
	FROM borders a JOIN borders b ON a.name < b.name AND ST_Intersects(a.geom, b.geom)
	WHERE $(year) BETWEEN a.starts AND a.ends AND $(year) BETWEEN b.starts AND b.ends) WHERE km2 >= 100 ORDER BY km2 DESC""")
println("Pairs of states sharing at least 100 km² in ", year, ": ", length(o.one))
for i in eachindex(o.one)[1:min(end, 20)]
	println("  ", o.one[i], " and ", o.two[i], ": ", round(Int, o.km2[i]), " km²")
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "two-years"
label = "Two Years"
desc = "Year beside Other Year: each state's area in the Box in both, the largest changes first"
code = '''
second = clamp({{other}}, since, upto)
second == year && error("Year and Other Year are both $(year) within $(source): choose two different years")
c = area_change(con, year, second; limit = 30)  # each state's km² in the Box in both years, the largest changes first
w = maximum(length, c.name; init = 5) + 2
println(rpad("state", w), lpad("$(year), km²", 16), lpad("$(second), km²", 16))
for i in eachindex(c.name)
	println(rpad(c.name[i], w), lpad(c.one[i], 16), lpad(c.two[i], 16))
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "history-of-place"
label = "History of a Place"
desc = "The states whose territory holds the Place, in order, with the years the source gives each"
code = '''
lon, lat = parse.(Float64, split("{{place}}", ","))
h = place_history(con, lon, lat)  # the states that held the Place, in order, each once for each unbroken stretch of years
println("The place at ", lon, ", ", lat, " in ", source, ", ", since, " to ", upto, ":")
isempty(h.name) && println("  no state of the source holds it: is it inside the Box?")
for i in eachindex(h.name)
	println("  ", rpad(string(h.starts[i], " to ", h.ends[i]), 16), h.name[i])
end
'''

[[actionGroups.actions]]
id = "states-of-year"
label = "States of the Year"
desc = "Every state of Year in the Box, by the area it has there, with the years of the shape shown"
code = '''
s = rows("SELECT name, round(sum(km2))::BIGINT AS km2, min(starts) AS starts, max(ends) AS ends FROM borders WHERE $(year) BETWEEN starts AND ends GROUP BY name ORDER BY km2 DESC")
println(source, ", ", year, ": ", length(s.name), " states in the Box")
w = maximum(length, s.name; init = 5) + 2
for i in eachindex(s.name)
	println(rpad(s.name[i], w), lpad(s.km2[i], 10), " km²  shape of ", s.starts[i], " to ", s.ends[i])
end
'''

[[actionGroups]]
id = "export"
label = "Export"

[[actionGroups.actions]]
id = "save-geoparquet"
label = "Save as GeoParquet"
desc = "Every shape in the Box with its years and area, as a GeoParquet file in the Folder"
code = '''
kind = "{{model}}"
{{?model=cliopatria}}kind *= "-{{units}}"
out = joinpath(folder, "historical-borders-$(kind)-$(join(box, "_"))-$(since)-$(upto).parquet")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "COPY borders TO '$(quoted(out))' (FORMAT parquet)")  # DuckDB writes GeoParquet metadata
	println("Wrote ", out)
end
'''
