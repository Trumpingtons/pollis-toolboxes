# Paleography: the sources of paleography, a row per source with what it covers, its period, size, access and licence,
# and, where the source can be downloaded, the Julia code that downloads it and shows it as a table

[meta]
title = "Paleography"
viewType = "pollis.paleography"
style = "minimal"
intro = "The digitised manuscripts, catalogues, dictionaries of abbreviations and data sets of transcribed and classified handwriting, each with its period, size, access and licence, and the Julia code that downloads it where it can be downloaded."
rowTitle = "Source"

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/DuckDB.jl"

[[packages]]
name = "EzXML.jl"
github = "https://github.com/JuliaIO/EzXML.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

[[packages]]
name = "CodecZlib.jl"
github = "https://github.com/JuliaIO/CodecZlib.jl"

[[packages]]
name = "ZipArchives.jl"
github = "https://github.com/JuliaIO/ZipArchives.jl"

[[packages]]
name = "JSON.jl"
github = "https://github.com/JuliaIO/JSON.jl"

[[packages]]
name = "NPZ.jl"
github = "https://github.com/fhs/NPZ.jl"

# The table: the columns after the sources' titles, then a row per source

[[columns]]
id = "covers"
label = "Covers"

[[columns]]
id = "period"
label = "Period"

[[columns]]
id = "size"
label = "Size"

[[columns]]
id = "access"
label = "Access"

[[columns]]
id = "licence"
label = "Licence"

[[rows]]
id = "ecodices"
title = "e-codices, Virtual Manuscript Library of Switzerland"
subtitle = "University of Fribourg"
description = "The medieval and some modern manuscripts of the libraries, archives and monasteries of Switzerland, each photographed whole, with its scholarly description, through IIIF: a manifest per manuscript with its title, date, place of origin, language, material, size and summary, and its pages on an image server. The code lists the libraries, reads the manifests of one, the Aargauer Kantonsbibliothek unless another is named, and saves a page's image."
covers = "Manuscripts in Swiss collections, mostly Latin and German"
period = "The Middle Ages, and some modern manuscripts"
size = "3,107 manuscripts in 100 collections"
access = "Its site and IIIF manifests, a manuscript at a time"
licence = "Manifests CC0; images by the terms of each library, most free to re-use with citation"
code = '''
using JSON, Downloads
# A library of e-codices, by the name of its collection on e-codices' IIIF pages: kba is the Aargauer Kantonsbibliothek
# in Aarau, csg the Stiftsbibliothek of St. Gallen, ubb the Universitätsbibliothek of Basel, bge the Bibliothèque de Genève
library = "kba"
folder = mkpath(expanduser("~/.pollis/data/examples/paleography/e-codices"))  # where the downloads are kept
site = "https://e-codices.ch/metadata/iiif/"
# e-codices refuses Julia's own user agent, so the downloads give a generic one; it refuses too many requests in a row,
# so they come a second apart
download(url, file) = (sleep(1); Downloads.download(url, file; headers = ["User-Agent" => "research-script/1.0"]))
# A IIIF file of e-codices, downloaded once: the collections (a library each) and the manifests (a manuscript each)
function iiif(url)
	file = joinpath(folder, replace(chopprefix(url, site), "/" => "-"))
	isfile(file) || download(url, file)
	return JSON.parse(read(file, String))
end
# The libraries, each by the name of its collection
libraries = [(library = chopsuffix(basename(c["@id"]), ".json"), name = c["label"])
	for c in iiif(site * "collection.json")["collections"]]
println(length(libraries), " libraries")
vscodedisplay(libraries, "e-codices: the libraries")
# The manuscripts of the library, from their manifests: a field may come more than once, as Century for a manuscript of
# two centuries, and its values are then joined
manifests = [iiif(m["@id"]) for m in iiif(site * "collection/$library.json")["manifests"]]
function field(manifest, label)
	values = [string(m["value"]) for m in manifest["metadata"] if m["label"] == label]
	return replace(join(values, "; "), r"<[^>]+>" => "")
end
manuscripts = map(manifests) do m
	(manuscript = m["label"], title = field(m, "Title (English)"), date = field(m, "Date of Origin (English)"),
		century = field(m, "Century"), origin = field(m, "Place of Origin (English)"), language = field(m, "Text Language"),
		material = field(m, "Material"), pages = field(m, "Number of Pages"), dimensions = field(m, "Dimensions"),
		images = length(m["sequences"][1]["canvases"]), summary = field(m, "Summary (English)"), doi = field(m, "DOI"))
end
counts(values) = sort!(collect(pairs(Dict(v => count(==(v), values) for v in unique(values)))); by = last, rev = true)
println(manuscripts[1].manuscript[1:findlast(',', manuscripts[1].manuscript) - 1], ": ", length(manuscripts), " manuscripts, ",
	sum(m -> m.images, manuscripts), " images")
println("By century: ", join(("$v ($n)" for (v, n) in counts([c for m in manuscripts for c in split(m.century, "; ")])), ", "))
println("By language: ", join(("$v ($n)" for (v, n) in counts([l for m in manuscripts for l in split(m.language, "; ")])), ", "))
vscodedisplay(manuscripts, "e-codices: $library")
# An image of a manuscript, by the numbers of the manuscript and of its image, 1000 pixels wide, from the IIIF image
# server
function image(manuscript, n)
	canvas = manifests[manuscript]["sequences"][1]["canvases"][n]
	url = replace(canvas["images"][1]["resource"]["@id"], "/full/full/" => "/full/1000,/")
	file = joinpath(folder, chopsuffix(basename(dirname(dirname(dirname(dirname(url))))), ".jp2") * ".jpg")
	isfile(file) || download(url, file)
	return file
end
println(manuscripts[1].manuscript, ", ", manifests[1]["sequences"][1]["canvases"][3]["label"], ": ", image(1, 3))
'''

