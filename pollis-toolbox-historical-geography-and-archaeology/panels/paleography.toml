# Paleography: the sources of paleography, a row per source with what it covers, its period, size, access and licence,
# and, where the source can be downloaded, the Julia code that downloads it and shows it as a table

[meta]
title = "Paleography"
viewType = "pollis.paleography"
style = "minimal"
intro = "The digitised manuscripts, catalogues, dictionaries of abbreviations and data sets of transcribed and classified handwriting, each with its period, size, access and licence, and the Julia code that downloads it where it can be downloaded."
rowTitle = "Source"

[[packages]]
name = "HistoricalGeography.jl"
github = "https://github.com/Trumpingtons/HistoricalGeography.jl"
minimum = "0.1.10"

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/DuckDB.jl"

[[packages]]
name = "EzXML.jl"
github = "https://github.com/JuliaIO/EzXML.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

[[packages]]
name = "CodecZlib.jl"
github = "https://github.com/JuliaIO/CodecZlib.jl"

[[packages]]
name = "ZipArchives.jl"
github = "https://github.com/JuliaIO/ZipArchives.jl"

[[packages]]
name = "JSON.jl"
github = "https://github.com/JuliaIO/JSON.jl"

# The table: the columns after the sources' titles, then a row per source

[[columns]]
id = "covers"
label = "Covers"

[[columns]]
id = "period"
label = "Period"

[[columns]]
id = "size"
label = "Size"

[[columns]]
id = "access"
label = "Access"

[[columns]]
id = "licence"
label = "Licence"

[[rows]]
id = "ecodices"
title = "e-codices, Virtual Manuscript Library of Switzerland"
subtitle = "University of Fribourg"
description = "The medieval and some modern manuscripts of the libraries, archives and monasteries of Switzerland, each photographed whole, with its scholarly description, through IIIF: a manifest per manuscript with its title, date, place of origin, language, material, size and summary, and its pages on an image server. Step 1 lists the libraries with their codes; Step 2 reads the manifests of the library whose code it is given, the Aargauer Kantonsbibliothek unless another is named, as a table of its manuscripts, each linked to its page on e-codices, and opens the image of a page."
covers = "Manuscripts in Swiss collections, mostly Latin and German"
period = "The Middle Ages, and some modern manuscripts"
size = "3,107 manuscripts in 100 collections"
access = "Its site and IIIF manifests, a manuscript at a time"
licence = "Manifests CC0; images by the terms of each library, most free to re-use with citation"

[[rows.steps]]
id = "libraries"
title = "Libraries"
intro = "The libraries, archives and monasteries of e-codices, each with the code of its collection, which Step 2 takes to read its manuscripts."
code = '''
using HistoricalGeography
folder = expanduser("~/.pollis/data/examples/paleography")  # where the downloads are kept
libraries = ecodices_libraries(; folder)
println(length(libraries), " libraries, in the order of their places: choose one by its code in the column library, and give it to Step 2")
vscodedisplay(libraries, "e-codices: Libraries and Their Codes")
'''

[[rows.steps]]
id = "manuscripts"
title = "Manuscripts"
intro = "The manuscripts of the library whose code is given, from their IIIF manifests, downloaded once, a second apart: a row each, in the order of their shelfmarks, the shelfmark a link to the manuscript's page on e-codices, the summary beside the date. The image of the third page of the first opens in Pollis's browser."
code = '''
library = "{{ecodicesLibrary}}"
name = ecodices_library(library; folder)
manuscripts = ecodices(library; folder)
println(name, ": ", length(manuscripts), " manuscripts, ", sum(m -> m.images, manuscripts), " images, in the order of their shelfmarks")
println("By century: ", tallied(c for m in manuscripts for c in split(m.century, "; ")))
println("By language: ", tallied(l for m in manuscripts for l in split(m.language, "; ")))
# The table without the century, which the date gives, and the address of the manifest, which the image below reads
vscodedisplay(without(linked(manuscripts, :manuscript => :page), :century, :manifest), "e-codices: Manuscripts of $name")
# The third image of the first manuscript, 1000 pixels wide, from the IIIF image server
image = ecodices_image(manuscripts[1].manifest, 3; folder)
println(manuscripts[1].manuscript, ", ", image.label, ": ", image.file)
Pollis.browse(image.file)
'''

[[rows.steps.inputs]]
id = "ecodicesLibrary"
label = "Library"
tooltip = "The code of the library, in the column library of the table of Step 1: kba the Aargauer Kantonsbibliothek in Aarau, csg the Stiftsbibliothek of St. Gallen, ubb the Universitätsbibliothek of Basel, bge the Bibliothèque de Genève."
default = "kba"

[[rows]]
id = "biblissima"
title = "Biblissima"
subtitle = "Biblissima+ (2021 to 2029), after Biblissima (2012 to 2021)"
description = "One search of the catalogues, digital libraries and databases of manuscripts and early printed books: their historical collections, inscriptions, bindings, illuminations, coats of arms, people, organisations, works and places. IIIF Collections searches the digitised manuscripts and early books of many libraries, and the authority files give the people, places, organisations and shelfmarks they name, as structured data."
covers = "Manuscripts and early printed books, mostly of Western Europe"
period = "8th to 18th century"
size = "885,829 items in the authority files"
access = "Its portal and IIIF Collections; the authority files on a Wikibase, whose SPARQL access is restricted"
licence = "Authority files Etalab Open License 2.0"
code = '''
# Biblissima's portal, which searches the catalogues, digital libraries and databases of manuscripts and early printed
# books at once; IIIF Collections, https://iiif.biblissima.fr/collections/, searches their digitised manuscripts
Pollis.browse("https://portail.biblissima.fr/fr/search")
'''

[[rows]]
id = "pinakes"
title = "Pinakes"
subtitle = "Institut de recherche et d'histoire des textes (IRHT), Paris; begun in 1971 at the Pontifical Institute of Mediaeval Studies, Toronto"
description = "The manuscript tradition of Greek texts before the 16th century, mostly from the catalogues of the world's libraries: for each work its manuscripts, and for each manuscript its city, library, fonds and shelfmark, the works it holds and its century or date, with links to digitisations. The database is concise and sends the reader back to the catalogues."
covers = "Greek texts and the manuscripts that hold them"
period = "Up to the 16th century"
size = "About 200,000 records of 40,000 manuscripts in 1,300 libraries, at its launch in 2008"
access = "Its site, pinakes.irht.cnrs.fr, a search at a time"
licence = "Its legal notice permits private use, not re-use"
code = '''
# Pinakes, searched by a work, an author, a manuscript or a library
Pollis.browse("https://pinakes.irht.cnrs.fr/")
'''

[[rows]]
id = "digipal"
title = "Digital Resource and Database of Palaeography, Manuscript Studies and Diplomatic (DigiPal)"
subtitle = "King's College London, 2010 to 2014; since 2026 AOROC, École pratique des hautes études, with Biblissima+"
description = "English handwriting of the 11th century: the manuscripts and charters, their scribes, and the images of their letters (graphs) cut out and described one by one, so that the letter forms of different scribes, places and dates can be compared side by side."
covers = "English handwriting in Latin and Old English"
period = "Mostly 1000 to 1100"
size = "1,675 manuscripts and charters, 995 images, 64,033 images of letters, 1,478 scribal hands"
access = "Its site, digipal.eu, to browse and search"
licence = "Data CC BY 4.0; the images may not be downloaded"
code = '''
# DigiPal's search of its manuscripts, charters, scribal hands and images of letters
Pollis.browse("https://www.digipal.eu/digipal/search/")
'''

[[rows]]
id = "cappelli"
title = "Lexicon Abbreviaturarum of Adriano Cappelli"
subtitle = "Ad fontes, University of Zürich: the hackathon of 2015"
description = "The abbreviations of Latin and Italian manuscripts in Cappelli's dictionary (Leipzig, 1928), each cut out of its page as an image, with its page, the letters it starts with, its transcription, category and the period of the manuscripts it comes from. The code reads the spreadsheet of the abbreviations with DuckDB and saves an abbreviation's image."
covers = "Abbreviations of Latin and Italian manuscripts"
period = "Mostly 13th to 15th century"
size = "14,329 abbreviations of 9,466 words and numbers"
access = "Ad fontes: an archive of 49 MB with the spreadsheet and the images"
licence = "Public domain"
code = '''
using HistoricalGeography, DuckDB, Tables
folder = expanduser("~/.pollis/data/examples/paleography")  # where the downloads are kept
con = DBInterface.connect(DuckDB.DB)  # an in-memory database
# The abbreviations of Cappelli's Lexicon Abbreviaturarum as the table cappelli, read with DuckDB's Excel extension,
# which the toolbox installs: the period XV m. is the middle of the 15th century, p. the start, f. the end; the
# categories are in German, as the hackathon gave them: römische Zahl is a Roman numeral, Westgotisch Visigothic
cappelli(con; folder)
abbreviations = Tables.rowtable(DBInterface.execute(con, "SELECT * FROM cappelli"))
println(length(abbreviations), " abbreviations of ", length(unique(a.transcription for a in abbreviations)), " words")
println("By century: ", tallied((coalesce(a.century, "(not given)") for a in abbreviations); top = 10))
println("By language: ", tallied((coalesce(a.language, "(not given)") for a in abbreviations); top = 10))
println("By category: ", tallied((coalesce(a.category, "(not given)") for a in abbreviations); top = 10))
# The words with the most abbreviations, each written in many ways in the manuscripts
println("The most abbreviated words: ", tallied((a.transcription for a in abbreviations); top = 15))
vscodedisplay(abbreviations, "Cappelli's abbreviations")
println("An abbreviation of \"", abbreviations[1].transcription, "\": ", cappelli_image(abbreviations[1].id; folder))
'''

[[rows]]
id = "htrunited"
title = "HTR-United"
subtitle = "A catalogue kept on GitHub by Thibault Clérice, Alix Chagué and others"
description = "The catalogue of the data sets made to train handwritten text recognition (HTR) and OCR, each with its languages, scripts, whether handwritten or printed, its dates, format (ALTO or PAGE XML), size, licence and link. The code reads the catalogue and counts the data sets by language, script, format and licence."
covers = "Data sets of transcribed manuscripts and prints, mostly French and Latin"
period = "Mostly the Middle Ages to the 20th century"
size = "138 data sets, 2.1 million lines in those that count lines"
access = "GitHub (HTR-United/htr-united): its catalogue, 0.5 MB"
licence = "Each data set its own: 110 CC BY 4.0, 18 CC BY-SA 4.0"
code = '''
using HistoricalGeography
folder = expanduser("~/.pollis/data/examples/paleography")  # where the downloads are kept
# The catalogue of HTR-United, downloaded again each day: languages as ISO 639 codes (lat Latin, fro Old French), scripts
# as ISO 15924 (Latn Latin, Grek Greek, Arab Arabic)
datasets = htr_united(; folder)
println(length(datasets), " data sets, ", sum(d -> d.lines, datasets), " lines in those that count lines")
println("By language: ", tallied((l for d in datasets for l in split(d.languages, ", ")); top = 12))
println("By script: ", tallied(s for d in datasets for s in split(d.scripts, ", ")))
println("By kind: ", tallied(d.kind for d in datasets))
println("By format: ", tallied(d.format for d in datasets))
println("By licence: ", tallied((d.licence for d in datasets); top = 6))
vscodedisplay(datasets, "HTR-United")
'''

[[rows]]
id = "catmus"
title = "CATMuS Medieval"
subtitle = "Consistent Approaches to Transcribing Manuscripts: Thibault Clérice, Ariane Pinche and others"
description = "The lines of medieval manuscripts and incunabula transcribed by the same rules, each with its image and the language, century, script, genre and region of its manuscript, for training and testing handwritten text recognition, and the dating and classification of scripts. The code lists the files on Hugging Face, a manuscript each, reads the lines of one, Paris, BnF, esp. 33 unless another is named, and saves a line's image."
covers = "Medieval manuscripts in Latin, French, Castilian, Italian, Middle Dutch and other languages"
period = "8th to 16th century, mostly 13th to 15th"
size = "313 manuscripts, over 160,000 lines"
access = "Hugging Face (CATMuS/medieval): 346 Parquet files, 26.5 GB"
licence = "CC BY 4.0"
code = '''
using HistoricalGeography, DuckDB, Tables
folder = expanduser("~/.pollis/data/examples/paleography")  # where the downloads are kept
# A manuscript of CATMuS Medieval, by its shelfmark as in the names of the files (its parts joined by __, the spaces
# by _): Paris__BnF__esp__33 is Paris, BnF, esp. 33
manuscript = "Paris__BnF__esp__33"
# The files on Hugging Face, a Parquet file per manuscript or part of one; the languages as Lat Latin, Fre French, Cas
# Castilian, Mid_Dut Middle Dutch, Ita Italian; the scripts as Tex Textualis, Cur Cursiva, Hyb Hybrida, Car Caroline
files = catmus_files()
println(length(unique(f.shelfmark for f in files)), " manuscripts in ", length(files), " files of ",
	round(sum(f -> f.megabytes, files) / 1000; digits = 1), " GB")
first_parts = filter(f -> f.part == 0, files)
println("By language: ", tallied(f.language for f in first_parts))
println("By century: ", tallied((f.century for f in first_parts); ordered = true))
println("By script: ", tallied(f.script for f in first_parts))
vscodedisplay(files, "CATMuS Medieval: the files")
# The lines of the manuscript as the view catmus, its files downloaded once: its text with the metadata of its
# manuscript, and its image
con = DBInterface.connect(DuckDB.DB)  # an in-memory database
catmus(con, manuscript; folder)
lines = Tables.rowtable(DBInterface.execute(con, """SELECT line, text, shelfmark, language, century, script_type, genre, region,
	project, line_type FROM catmus ORDER BY line"""))
println(first(lines).shelfmark, ": ", length(lines), " lines, ", sum(l -> length(l.text), lines), " characters; ",
	first(lines).script_type, ", ", first(lines).genre, ", ", first(lines).century, "th century")
vscodedisplay(lines, "CATMuS Medieval: $(first(lines).shelfmark)")
println("Line 1, \"", first(lines).text, "\": ", catmus_image(con, 1; folder))
'''

[[rows]]
id = "clamm"
title = "Classification of Medieval Handwritings in Latin Script (CLaMM)"
subtitle = "ICDAR 2017 competition: Florence Cloppet, Dominique Stutzmann and others"
description = "Images of pages of Latin manuscripts, each labelled with one of 12 scripts (Caroline, Textualis, Hybrida and others) and one of 15 date classes, from before 1000 to 1600, for training and testing the classification of scripts and the dating of manuscripts. The code reads the labels of the training set from its archive, counts the images by script and date, and saves an image."
covers = "Latin scripts of medieval manuscripts"
period = "Before 1000 to 1600"
size = "3,540 images to train on; 2,000 and 1,000 to test on"
access = "Zenodo: the training set 5.5 GB, the test sets 3.1 GB and 3.3 GB"
licence = "CC BY 4.0"
code = '''
using HistoricalGeography
folder = expanduser("~/.pollis/data/examples/paleography")  # where the downloads are kept
# The training set of CLaMM, an archive of 5.5 GB downloaded once and read without unpacking it: each image with its
# script and date
training = clamm(; folder)
println(length(training.images), " images")
println("By script: ", tallied(i.script for i in training.images))
# The images by date, in the order of the dates, from the table of scripts by date
dates = propertynames(first(training.scripts))[2:end]
println("By date: ", join(("$d ($(sum(s -> s[d], training.scripts)))" for d in dates), ", "))
vscodedisplay(training.images, "CLaMM: the training images")
# The images of each script by date: a script is written over a span of centuries, and a date has several scripts
vscodedisplay(training.scripts, "CLaMM: scripts by date")
image = first(training.images)
println(image.script, ", ", image.date, ": ", clamm_image(image.image; folder))
'''

[[rows]]
id = "divahisdb"
title = "DIVA-HisDB"
subtitle = "DIVA group, University of Fribourg, with e-codices"
description = "Pages of three manuscripts of complex layout, Cod. Sang. 18 (a composite manuscript) and Cod. Sang. 863 (Lucan's Pharsalia) of St. Gallen and Cod. Bodmer 55 (Dante's Inferno and Purgatorio) of Cologny, with their layout drawn by hand: the regions of main text, comments (glosses) and decoration, and the polygon of each line, in PAGE XML and in images labelled pixel by pixel. The code takes the PAGE XML out of the archive and counts each page's regions and lines."
covers = "The layout of three medieval manuscripts"
period = "Around 1000 to the first half of the 14th century"
size = "150 pages, about 4,400 lines of main text and 8,400 of comments"
access = "Zenodo: the archive of the DIVA group's site, 1.3 GB"
licence = "CC BY 4.0"
code = '''
using HistoricalGeography
folder = expanduser("~/.pollis/data/examples/paleography")  # where the downloads are kept
# The layout of the pages of DIVA-HisDB in PAGE XML, from an archive of 1.3 GB downloaded once: CB55 is Cologny,
# Fondation Martin Bodmer, Cod. Bodmer 55; CSG18 and CSG863 the Codices Sangallenses 18 and 863 of St. Gallen
pages = divahisdb(; folder)
for m in sort!(unique(p.manuscript for p in pages))
	these = filter(p -> p.manuscript == m, pages)
	println(m, ": ", length(these), " pages (", tallied(p.split for p in these), "), ", sum(p -> p.main_lines, these),
		" lines of main text, ", sum(p -> p.comment_lines, these), " of comments, ", sum(p -> p.decorations, these), " decorations")
end
vscodedisplay(pages, "DIVA-HisDB: the pages")
'''

[[rows]]
id = "biblia"
title = "BiblIA"
subtitle = "Daniel Stökl Ben Ezra and others, École pratique des hautes études (EPHE)"
description = "Pages of medieval Hebrew manuscripts of the Bibliothèque nationale de France and the Vatican Library, transcribed line by line in ALTO XML with their regions and line polygons, each with its script (Ashkenazi, Italian or Sephardi), shelfmark, date and genre, Biblical or Rabbinic. The code reads the catalogue and the transcriptions from the archive."
covers = "Medieval Hebrew manuscripts"
period = "11th to 16th century, mostly the 13th and 14th"
size = "202 pages of 94 manuscripts, 12,461 lines"
access = "Zenodo: an archive of 546 MB, with the BnF's images; the Vatican's at their IIIF links"
licence = "CC BY-NC-SA 4.0"
code = '''
using HistoricalGeography
folder = expanduser("~/.pollis/data/examples/paleography")  # where the downloads are kept
# BiblIA, pages of medieval Hebrew manuscripts of the BnF and the Vatican Library transcribed line by line, from an
# archive of 546 MB downloaded once: the images of the BnF's pages are in the archive, those of the Vatican's at
# their link
biblia_pages, biblia_lines = biblia(; folder)
println(length(biblia_pages), " pages of ", length(unique(p.shelfmark for p in biblia_pages)), " manuscripts, ",
	length(biblia_lines), " lines, ", sum(p -> p.characters, biblia_pages), " characters")
println("By script: ", tallied(p.script for p in biblia_pages))
println("By library: ", tallied(p.library for p in biblia_pages))
println("By genre: ", tallied(p.genre for p in biblia_pages))
println("By part: ", tallied(p.split for p in biblia_pages))
vscodedisplay(biblia_pages, "BiblIA: the pages")
# A row per line, for the training of a model or a search of the texts
vscodedisplay(biblia_lines, "BiblIA: the lines")
'''

[[rows]]
id = "muharaf"
title = "Muharaf"
subtitle = "Mehreen Saeed, Adrian Chan, Anupam Mijar and others"
description = "Manuscripts of Handwritten Arabic: letters, poems, histories, church and legal records and other documents, transcribed line by line for training the recognition of cursive Arabic. The public part has the images of the pages and their lines with their transcriptions; the code reads the summary and keywords of each page."
covers = "Handwritten Arabic documents"
period = ""
size = "1,216 pages in the public part"
access = "Zenodo: the summaries 0.8 MB, the line images 1.3 GB, the pages 3.1 GB"
licence = "CC BY-NC-SA"
code = '''
using HistoricalGeography
folder = expanduser("~/.pollis/data/examples/paleography")  # where the downloads are kept
# The summaries and keywords of the pages of Muharaf's public part, an archive of 0.8 MB downloaded once; the images
# and their transcriptions are in the other archives of the record, of 1.3 GB (the lines) and 3.1 GB (the pages)
pages = muharaf(; folder)
println(length(pages), " pages")
println("By keyword: ", tallied((k for p in pages for k in split(p.keywords, ", ") if !isempty(k)); top = 20))
vscodedisplay(pages, "Muharaf: the pages")
'''

[[rows]]
id = "kuzushiji"
title = "Kuzushiji-49"
subtitle = "ROIS-DS Center for Open Data in the Humanities (CODH), from the Kuzushiji Dataset of the National Institute of Japanese Literature"
description = "The hiragana of pre-modern Japanese books in kuzushiji, the cursive script, each cut out as an image of 28 by 28 pixels and labelled with one of 48 hiragana or the iteration mark, for training the recognition of characters. The code reads the training and test sets and saves an image of a character."
covers = "Hiragana in kuzushiji, the cursive script of pre-modern Japanese books"
period = ""
size = "270,912 images in 49 classes"
access = "CODH: NumPy files, 66 MB to train on and 11 MB to test on"
licence = "CC BY-SA 4.0"
code = '''
using HistoricalGeography
folder = expanduser("~/.pollis/data/examples/paleography")  # where the downloads are kept
# Kuzushiji-49, the hiragana of 49 classes cut out of books of the Edo period, images of 28 by 28 pixels downloaded
# once: the training set of 66 MB and the test set of 11 MB
k49 = kuzushiji(; folder)
println(size(k49.train.images, 1), " images to train on and ", size(k49.test.images, 1), " to test on, of ",
	size(k49.train.images, 2), " by ", size(k49.train.images, 3), " pixels, in ", length(k49.classes), " classes")
# The classes are very unequal, as the characters are in the books
println("The most frequent: ", join(("$(c.character) ($(c.train))" for c in first(sort(k49.classes; by = c -> -c.train), 8)), ", "))
println("The least frequent: ", join(("$(c.character) ($(c.train))" for c in first(sort(k49.classes; by = c -> c.train), 8)), ", "))
vscodedisplay(k49.classes, "Kuzushiji-49: the classes")
# An image of the training set as a grey-scale PGM file: white strokes on black
println("Image 1, ", k49.classes[k49.train.labels[1] + 1].character, ": ", kuzushiji_image(k49.train, 1))
'''
