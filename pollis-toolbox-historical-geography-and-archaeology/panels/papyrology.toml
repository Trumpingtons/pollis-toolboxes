			author = field(doc, "//t:bibl[@subtype='ancient']/t:author"), work = field(doc, "//t:bibl[@subtype='ancient']/t:title"),
			contents = field(doc, "//t:term[@type='overview']"), material = field(doc, "//t:material"),
			from = year(field(doc, "(//t:origDate/@when | //t:origDate/@notBefore)[1]")),
