[[rows]]
id = "icdar2023"
title = "ICDAR 2023: Detection and Recognition of Greek Letters on Papyri"
subtitle = "D-Scribes project, on Zenodo"
description = "185 surfaces of 136 papyri of the Iliad, in book hands over a millennium, annotated letter by letter for the competition of ICDAR 2023, with the answers of its test set released after it, and each papyrus's Trismegistos number and link to papyri.info."
covers = "Greek letters on papyri of the Iliad, located and named"
period = ""
size = "152 training images with 35,597 letters, 37 test images with 9,773; 424 MB"
access = "Zenodo"
licence = "CC BY-NC 4.0"
code = '''
using DuckDB, Tables, Downloads, ZipArchives
folder = mkpath(expanduser("~/.pollis/data/examples/papyrology"))  # where the downloads are kept
# The data set of the competition, an archive of 424 MB downloaded once; its images stay in it
archive = joinpath(folder, "ICDAR2023-Greek-Letters-on-Papyri.zip")
isfile(archive) || Downloads.download("https://zenodo.org/records/13825619/files/ICDAR2023_Competition_on_Detection_and_Recognition_of_Greek_Letters_on_Papyri_Dataset.zip?download=1", archive)
reader = ZipReader(read(archive))
# The letters located and named on the images, in COCO's format: the training set, and the answers of the test set
sets = ["training" => "2a.Training/HomerCompTraining.json", "test" => "2c.Answers/AnswersToTesting.json"]
for (set, name) in sets
	entry = only(filter(n -> endswith(n, name) && !startswith(n, "__MACOSX"), zip_names(reader)))
	write(joinpath(folder, "icdar2023-$set.json"), zip_readentry(reader, entry))
end
con = DBInterface.connect(DuckDB.DB)
json(set) = "read_json('$(escape_string(joinpath(folder, "icdar2023-$set.json")))', maximum_object_size = 100000000)"
# A row per image of the training set: its file, size and number of letters. The answers of the test set give their
# letters by image ids its list of images does not have, so they are counted as a whole
images = DBInterface.execute(con, """
	SELECT i.file_name AS image, i.width, i.height, count(a.id) AS letters
	FROM (SELECT unnest(images) AS i FROM $(json("training"))) LEFT JOIN (SELECT unnest(annotations) AS a FROM $(json("training"))) ON a.image_id = i.id
	GROUP BY ALL ORDER BY image""") |> Tables.columntable
test = DBInterface.execute(con, "SELECT len(images) AS images, len(annotations) AS letters FROM $(json("test"))") |> Tables.columntable
println("Training set: ", length(images.image), " images, ", sum(images.letters), " letters located and named; test set: ",
	only(test.images), " images, ", only(test.letters), " letters")
# The letters most often found in the training set
letters = DBInterface.execute(con, """
	SELECT c.name AS letter, count(*) AS n FROM (SELECT unnest(annotations) AS a FROM $(json("training")))
	JOIN (SELECT unnest(categories) AS c FROM $(json("training"))) ON a.category_id = c.id GROUP BY 1 ORDER BY 2 DESC LIMIT 12""") |> Tables.columntable
println("The letters most often found in the training set: ", join(("$l ($n)" for (l, n) in zip(letters.letter, letters.n)), ", "))
vscodedisplay(Tables.rowtable(images), "ICDAR 2023: Greek Letters on Papyri")
'''

[[rows]]
id = "helldate"
title = "Hell-Date: Hellenistic Dated Papyri"
subtitle = "EGRAPSA project, on Zenodo"
description = "Images of Greek papyri dated within two years, about 50 a century, with their characters annotated, for dating by handwriting and for character recognition. The images stay with their holders: the data set gives each one's link and licence, and the code shows them in a table."
covers = "Dated Greek cursive hands"
period = "310 to 3 BCE"
size = "194 images of 157 papyri; 2.7 MB without the images"
access = "Zenodo; the images from their holders"
licence = "CC BY-NC 4.0; each image under its holder's terms"
code = '''
using DuckDB, Tables, Downloads, ZipArchives
folder = mkpath(expanduser("~/.pollis/data/examples/papyrology"))  # where the downloads are kept
# Hell-Date, an archive of 2.7 MB downloaded once: the list of its images and the dates of its papyri
archive = joinpath(folder, "Hell-Date.zip")
isfile(archive) || Downloads.download("https://zenodo.org/records/15830980/files/Hell-Date.zip?download=1", archive)
reader = ZipReader(read(archive))
for name in ("data.csv", "metadata.csv")
	write(joinpath(folder, "hell-date-$name"), zip_readentry(reader, name))
end
con = DBInterface.connect(DuckDB.DB)
# data.csv ends its lines in CR LF but its last line in nothing, which DuckDB reads only when it is not strict
# A row per image: its papyrus, the years it is dated to, its nome, its kind of document, its holder and the licence of the image
images = DBInterface.execute(con, """
	SELECT m.image_name AS image, m.checklist, m.TM, m."Year post quem" AS year_from, m."Year ante quem" AS year_to,
		m."Production Nome (supposed)" AS nome, m.Function AS kind, d.Collection AS collection, d."Inventory Number" AS inventory,
		d."License name" AS licence, d."Image link" AS link
	FROM read_csv('$(escape_string(joinpath(folder, "hell-date-metadata.csv")))', header = true) m
	JOIN read_csv('$(escape_string(joinpath(folder, "hell-date-data.csv")))', header = true, strict_mode = false) d USING (image_name) ORDER BY year_from""") |> Tables.columntable
println(length(images.image), " images, dated from ", minimum(images.year_from), " to ", maximum(images.year_to))
licences = DBInterface.execute(con, "SELECT \"License name\" AS licence, count(*) AS images FROM read_csv('$(escape_string(joinpath(folder, "hell-date-data.csv")))', header = true, strict_mode = false) GROUP BY 1 ORDER BY 2 DESC") |> Tables.columntable
println("Licences of the images: ", join(("$l ($n)" for (l, n) in zip(licences.licence, licences.images)), ", "))
vscodedisplay(Tables.rowtable(images), "Hell-Date: Hellenistic Dated Papyri")
'''

[[rows]]
id = "zenon"
title = "Zenon Papyri for Handwritten Text Recognition"
subtitle = "D-Scribes project, on Zenodo"
description = "Diplomatic transcriptions of papyri of the archive of Zenon of Kaunos, line by line in PageXML made with Transkribus, with their images, as ground truth for handwritten text recognition. Version 0.9."
covers = "Transcribed lines of Greek papyri, with their images"
period = ""
size = "27 transcriptions and 32 images, 5 MB"
access = "Zenodo"
licence = "CC BY 4.0"
code = '''
using DuckDB, Tables, Downloads, EzXML
folder = mkpath(expanduser("~/.pollis/data/examples/papyrology"))  # where the downloads are kept
dir = mkpath(joinpath(folder, "zenon-htr"))
# The data set's record on Zenodo lists its files, a PageXML transcription and an image for each papyrus: about 5 MB, downloaded once
record = Downloads.download("https://zenodo.org/api/records/6565706")
con = DBInterface.connect(DuckDB.DB)
files = DBInterface.execute(con, "SELECT f.key AS name, f.links.self AS url FROM (SELECT unnest(files) AS f FROM read_json('$(escape_string(record))'))") |> Tables.columntable
for (name, url) in zip(files.name, files.url)
	path = joinpath(dir, name)
	isfile(path) || Downloads.download(url, path)
end
# Each papyrus with the lines of its transcription, as they were drawn on the image in Transkribus
page = ["p" => "http://schema.primaresearch.org/PAGE/gts/pagecontent/2013-07-15"]
papyri = map(filter(endswith(".xml"), readdir(dir; join = true))) do file
	lines = [nodecontent(n) for n in findall("//p:TextLine/p:TextEquiv/p:Unicode", root(readxml(file)), page)]
	(papyrus = first(splitext(basename(file))), lines = length(lines), words = sum(l -> length(split(l)), lines; init = 0),
		first_line = isempty(lines) ? "" : first(lines), image = isfile(replace(file, r"\.xml$" => ".jpg")))
end
println(length(papyri), " papyri transcribed, in ", sum(p -> p.lines, papyri), " lines; ", count(endswith(".jpg"), readdir(dir)), " images")
vscodedisplay(papyri, "Zenon Papyri for Handwritten Text Recognition")
'''
