# Papyrology: the sources of papyrology, a row per source with what it covers, its period, size, access and licence,
# and, where the source can be downloaded, the Julia code that downloads it and shows it as a table

[meta]
title = "Papyrology"
viewType = "pollis.papyrology"
style = "minimal"
intro = "The texts, catalogues, images and data sets of papyri, ostraca and tablets, each with its period, size, access and licence, and the Julia code that downloads it where it can be downloaded."
rowTitle = "Source"

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/DuckDB.jl"

[[packages]]
name = "EzXML.jl"
github = "https://github.com/JuliaIO/EzXML.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

[[packages]]
name = "CodecZlib.jl"
github = "https://github.com/JuliaIO/CodecZlib.jl"

[[packages]]
name = "ZipArchives.jl"
github = "https://github.com/JuliaIO/ZipArchives.jl"

# The table: the columns after the sources' titles, then a row per source

[[columns]]
id = "covers"
label = "Covers"

[[columns]]
id = "period"
label = "Period"

[[columns]]
id = "size"
label = "Size"

[[columns]]
id = "access"
label = "Access"

[[columns]]
id = "licence"
label = "Licence"


[[rows]]
id = "ddbdp"
title = "Duke Databank of Documentary Papyri (DDbDP)"
subtitle = "Papyri.info, Duke Collaboratory for Classics Computing (DC3)"
description = "The texts of documentary papyri and ostraca as their editions print them, in EpiDoc XML, each with its Trismegistos number and its edition, from the Papyrological Editor of papyri.info. The code takes the texts as written, leaving out the regularised spellings and the editors' corrections."
covers = "Documentary texts in Greek, Coptic and Latin"
period = "Dated in the HGV"
size = "67,980 texts, 4.8 million words"
access = "GitHub (papyri/idp.data), an archive of 180 MB updated every hour"
licence = "CC BY 3.0"
code = '''
using EzXML, CodecZlib, Downloads, Tar, Tables, Logging
folder = mkpath(expanduser("~/.pollis/data/examples/papyrology"))  # where the downloads are kept
# The data of papyri.info, an archive of about 180 MB downloaded once, from which the texts of the DDbDP are taken
archive = joinpath(folder, "idp.data.tar.gz")
isfile(archive) || Downloads.download("https://codeload.github.com/papyri/idp.data/tar.gz/refs/heads/master", archive)
dir = joinpath(folder, "DDbDP")
isdir(dir) || open(io -> Tar.extract(h -> startswith(h.path, "idp.data-master/DDbDP"), GzipDecompressorStream(io), dir), archive)
# A field of a record, by its path in the TEI XML, "" when the record has none
tei = ["t" => "http://www.tei-c.org/ns/1.0"]
field(doc, path) = (node = findfirst(path, root(doc), tei); node === nothing ? "" : strip(nodecontent(node)))
counts(values) = sort!(collect(pairs(Dict(v => count(==(v), values) for v in unique(values)))); by = last, rev = true)
files = [joinpath(root, name) for (root, _, names) in walkdir(dir) for name in names if endswith(name, ".xml")]
# A record that is not valid XML is left out; the parser's warnings about ids that are not XML names are not shown
records = with_logger(NullLogger()) do
	map(files) do file
		doc = try readxml(file) catch; return nothing end
		edition = findfirst("//t:div[@type='edition']", root(doc), tei)
		# The text as written: the regularised spellings and the editors' corrections are left out
		edition === nothing || foreach(unlink!, findall(".//t:reg | .//t:corr", edition, tei))
		text = edition === nothing ? "" : join(split(nodecontent(edition)), " ")
		(tm = field(doc, "//t:idno[@type='TM']"), edition = field(doc, "//t:body/t:head//t:title"),
			series = first(split(field(doc, "//t:idno[@type='ddb-hybrid']"), ';')),
			language = edition === nothing || !haskey(edition, "xml:lang") ? "" : edition["xml:lang"],
			words = length(split(text)), text = first(text, 200))
	end
end
unread = count(isnothing, records)
records = [r for r in records if r !== nothing]
unread > 0 && println(unread, " records could not be read as XML")
println(length(records), " texts, ", sum(r -> r.words, records), " words")
println("By language: ", join(("$l ($n)" for (l, n) in counts([r.language for r in records])), ", "))
println("The series with most texts: ", join(("$s ($n)" for (s, n) in first(counts([r.series for r in records]), 10)), ", "))
vscodedisplay(records, "Duke Databank of Documentary Papyri")
'''

[[rows]]
id = "hgv"
title = "Heidelberger Gesamtverzeichnis der griechischen Papyrusurkunden Ägyptens (HGV)"
subtitle = "Papyri.info, with the Institut für Papyrologie, Heidelberg"
description = "The metadata of the documentary papyri of the DDbDP: an English title, the date, the place of writing and of finding, the material and keywords, the places in German. Its translations of 8,001 texts are in the same archive, in the folder Translations."
covers = "Dates, places and materials of documentary papyri"
period = "Mostly 3rd century BCE to 8th century CE"
size = "68,027 records, 66,640 of them dated"
access = "GitHub (papyri/idp.data), an archive of 180 MB updated every hour"
licence = "CC BY 3.0"
code = '''
using EzXML, CodecZlib, Downloads, Tar, Tables, Logging
folder = mkpath(expanduser("~/.pollis/data/examples/papyrology"))  # where the downloads are kept
# The data of papyri.info, an archive of about 180 MB downloaded once, from which the HGV's records are taken
archive = joinpath(folder, "idp.data.tar.gz")
isfile(archive) || Downloads.download("https://codeload.github.com/papyri/idp.data/tar.gz/refs/heads/master", archive)
dir = joinpath(folder, "HGV_meta_EpiDoc")
isdir(dir) || open(io -> Tar.extract(h -> startswith(h.path, "idp.data-master/HGV_meta_EpiDoc"), GzipDecompressorStream(io), dir), archive)
# A field of a record, by its path in the TEI XML, "" when the record has none; a year, from a date such as -0249-01-28
tei = ["t" => "http://www.tei-c.org/ns/1.0"]
field(doc, path) = (node = findfirst(path, root(doc), tei); node === nothing ? "" : strip(nodecontent(node)))
year(date) = (m = match(r"^-?\d+", date); m === nothing ? missing : parse(Int, m.match))
files = [joinpath(root, name) for (root, _, names) in walkdir(dir) for name in names if endswith(name, ".xml")]
# A record that is not valid XML is left out; the parser's warnings about ids that are not XML names are not shown
records = with_logger(NullLogger()) do
	map(files) do file
		doc = try readxml(file) catch; return nothing end
		(tm = field(doc, "//t:idno[@type='TM']"), title = field(doc, "//t:titleStmt/t:title"),
			place = field(doc, "//t:origPlace"), material = field(doc, "//t:material"),
			from = year(field(doc, "(//t:origDate/@when | //t:origDate/@notBefore)[1]")),
			to = year(field(doc, "(//t:origDate/@when | //t:origDate/@notAfter)[1]")))
	end
end
unread = count(isnothing, records)
records = [r for r in records if r !== nothing]
unread > 0 && println(unread, " records could not be read as XML")
century(year) = year > 0 ? (year - 1) ÷ 100 + 1 : -((-year - 1) ÷ 100 + 1)
counts(values) = sort!(collect(pairs(Dict(v => count(==(v), values) for v in unique(values)))); by = last, rev = true)
println(length(records), " records, ", count(r -> !ismissing(r.from), records), " of them dated")
println("By century of the earliest date (negative before the Common Era): ",
	join(("$c: $n" for (c, n) in sort(counts([century(r.from) for r in records if !ismissing(r.from)]))), ", "))
println("The places with most records: ", join(("$p ($n)" for (p, n) in first(counts([r.place for r in records]), 10)), ", "))
vscodedisplay(records, "Heidelberger Gesamtverzeichnis")
'''

