[[rows]]
id = "tlademotic"
title = "Thesaurus Linguae Aegyptiae: Demotic Sentences"
subtitle = "Berlin-Brandenburg and Saxon Academies of Sciences and Humanities, on Hugging Face"
description = "The Demotic sentences of the TLA's corpus 18 that are intact, unambiguously readable and fully lemmatised, 13,383 of its 31,156, each in transliteration with its lemmas, parts of speech, glosses, German translation and the dates of its text. The TLA publishes Late Egyptian and Earlier Egyptian sentences in the same way."
covers = "Demotic sentences, with German translations"
period = "7th century BCE to 5th century CE"
size = "13,383 sentences, 7 MB"
access = "Hugging Face, JSON lines"
licence = "CC BY-SA 4.0"
code = '''
using DuckDB, Tables, Downloads
folder = mkpath(expanduser("~/.pollis/data/examples/papyrology"))  # where the downloads are kept
# The intact Demotic sentences of the TLA's corpus 18, a file of 7 MB from Hugging Face, downloaded once
file = joinpath(folder, "tla-demotic-v18.jsonl")
isfile(file) || Downloads.download("https://huggingface.co/datasets/thesaurus-linguae-aegyptiae/tla-demotic-v18-premium/resolve/main/train.jsonl", file)
con = DBInterface.connect(DuckDB.DB)
DBInterface.execute(con, "CREATE OR REPLACE TABLE demotic AS SELECT * FROM read_json('$(escape_string(file))')")
# The sentences by century of the earliest date of their text, negative before the Common Era
centuries = DBInterface.execute(con, """
	SELECT CASE WHEN y > 0 THEN (y - 1) // 100 + 1 ELSE -((-y - 1) // 100 + 1) END AS century, count(*) AS sentences
	FROM (SELECT TRY_CAST(dateNotBefore AS INTEGER) AS y FROM demotic) WHERE y IS NOT NULL GROUP BY century ORDER BY century""") |> Tables.columntable
println(DBInterface.execute(con, "SELECT count(*) AS n FROM demotic") |> Tables.columntable |> t -> only(t.n), " sentences")
println("By century: ", join(("$c: $n" for (c, n) in zip(centuries.century, centuries.sentences)), ", "))
# Each sentence in transliteration, with its lemmas, parts of speech, German translation and dates
vscodedisplay(Tables.rowtable(DBInterface.execute(con, "SELECT transliteration, translation, lemmatization, UPOS, dateNotBefore, dateNotAfter FROM demotic")),
	"Thesaurus Linguae Aegyptiae: Demotic Sentences")
'''

