[[rows]]
id = "vesuvius"
title = "Vesuvius Challenge: CT Scans of Herculaneum Papyri"
subtitle = "Vesuvius Challenge, with EduceLab-Scrolls"
description = "Synchrotron micro-CT scans of the scrolls and detached fragments of Herculaneum carbonised by the eruption of Vesuvius in 79: the volumes, the papyrus surfaces extracted from them, and predictions such as ink detection, in OME-Zarr, TIFF and OBJ. The volumes run to terabytes, and OME-Zarr lets a part of one be read alone."
covers = "Herculaneum scrolls and fragments, in 3D"
period = "Buried in 79"
size = "45 samples: 35 scrolls and 10 fragments, 330 segments"
access = "Open S3 bucket, without an account"
licence = "CC BY-NC 4.0; Scrolls 1–4 and Fragments 1–6 scanned at DLS before 2025: EduceLab-Scrolls"
code = '''
using DuckDB, Tables, Downloads, CodecZlib
folder = mkpath(expanduser("~/.pollis/data/examples/papyrology"))  # where the downloads are kept
# The index of the samples of the Vesuvius Challenge's open data, about 85 KB compressed, read again each time as it grows
index = joinpath(folder, "vesuvius-metadata.json")
write(index, transcode(GzipDecompressor, read(Downloads.download("https://vesuvius-challenge-open-data.s3.amazonaws.com/metadata.min.json"))))
con = DBInterface.connect(DuckDB.DB)
# A row per scroll or fragment: its kind, the numbers of its scans, volumes and segments, and the licences of its volumes
samples = DBInterface.execute(con, """
	WITH m AS (SELECT content::JSON AS j FROM read_text('$(escape_string(index))')),
		s AS (SELECT key AS sample, json_extract(j, '\$.samples."' || key || '"') AS d FROM m, unnest(json_keys(j, '\$.samples')) AS t(key))
	SELECT sample, d->'sample'->'properties'->>'type' AS kind,
		coalesce(len(json_keys(d->'scans')), 0) AS scans, coalesce(len(json_keys(d->'volumes')), 0) AS volumes,
		coalesce(len(json_keys(d->'segments')), 0) AS segments,
		array_to_string(list_distinct(json_extract_string(d, '\$.volumes.*.properties.license.name')), '; ') AS licences
	FROM s ORDER BY kind, sample""") |> Tables.columntable
println(length(samples.sample), " samples: ", count(==("scroll"), samples.kind), " scrolls and ", count(==("fragment"), samples.kind), " fragments, with ",
	sum(samples.segments), " segments")
# Each sample's files are under s3://vesuvius-challenge-open-data/<sample>/, also over https at the address below
println("https://vesuvius-challenge-open-data.s3.amazonaws.com/index.html")
vscodedisplay(Tables.rowtable(samples), "Vesuvius Challenge: Herculaneum Papyri")
'''

