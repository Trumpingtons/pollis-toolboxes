id = "save-geotiff"
label = "Save as GeoTIFF"
desc = "The old map around the Place, at Zoom, as a GeoTIFF in Web Mercator in the Folder, for a GIS"
models = ["france", "allmaps"]
code = '''
using ArchGDAL
reach = 360 / 2^zoom * 2  # four tiles wide around the Place
box = (lon - reach, lat - reach / 2, lon + reach, lat + reach / 2)
{{?model=france}}url, name = old.url, "ign-$(old.id)"
{{?model=allmaps}}url, name = m.tiles[pick], "allmaps-$(m.id[pick])"
out = joinpath(folder, "old-map-$(name)-$(lon)_$(lat)-z$(zoom).tif")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	save_geotiff(url, box; zoom, path = out)  # GDAL reads the tiles and writes red, green, blue and alpha bands
	println("Wrote ", out)
{{?model=france}}	println("Source to name: ", old.attribution)
end
