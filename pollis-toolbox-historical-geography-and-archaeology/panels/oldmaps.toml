[[faq]]
question = "How do I compare an old map with today's map of the same place?"
answer = "Give the place as longitude, latitude in Place, choose a tab and run the Example Code. The old map is drawn on the left of a line across the map and today's map on its right; drag the line, or move it with the arrow keys, to uncover one or the other, while moving and zooming both together.\n\nOld Map Over Today draws the old map half transparent over today's instead, which shows where streets and rivers have moved."
wiki = "Overview"

[[faq]]
question = "Why does Georeferenced Maps find maps of a whole country when I look for a town?"
answer = "Allmaps returns every georeferenced map that covers the Place, whatever its scale, so maps of a region, a country or a continent that include the town are found too. Largest keeps the maps that cover at most that many km²: 1,000 km² leaves mostly plans of towns and their surroundings.\n\nMap Outlines draws the outline of every map found, coloured by its year, to see which maps cover what."
wiki = "Georeferenced Maps"

[[faq]]
question = "Why are the famous maps not swiped over today's map?"
answer = "The Famous Maps are images without coordinates: none of the eight is georeferenced, so they cannot be laid on today's map. The Famous Maps tab sets the image on the left, where it can be moved and enlarged on its own, and today's map of the region it shows on the right, with that region outlined."
wiki = "Famous Maps"

[[faq]]
question = "Can I use the map of Cassini in my own work?"
answer = "IGN publishes the two copies of the map of Cassini under the Licence Ouverte: they may be reused freely and at no cost, for any purpose including commercial, provided the data are not altered and every redistribution names the source that the metadata give. The Maps of France tab shows that source on the map, and Save as GeoTIFF saves the tiles of the Place."
wiki = "Maps of France"

[[faq]]
question = "Between which years was the map of Cassini made?"
right = "Between 1756 and 1815, by the Cassini family of cartographers"
wrong = ["Between 1820 and 1866, together with the map of the état-major", "Between 1818 and 1824, at 1:10,000 for the surroundings of Paris", "In 1950, as IGN's first map of France at 1:50,000", "Between 1950 and 1965, from aerial photographs taken by IGN"]
explanation = "IGN's metadata date the map of Cassini to 1756 to 1815; the map of the état-major is of 1820 to 1866."
wiki = "Maps of France"
hidden = true

[[faq]]
question = "Which copy of the map of Cassini did the Archives nationales scan?"
right = "The copy commissioned by the King"
wrong = ["The copy said to have been made for Marie-Antoinette", "The copy of the Bibliothèque nationale de France", "A copy printed for the surroundings of Paris", "A copy held by the University Library of Basel"]
explanation = "The Archives nationales scanned the King's copy; the copy said to have been made for Marie-Antoinette was scanned by the Bibliothèque nationale de France."
wiki = "Maps of France"
hidden = true

[[faq]]
question = "Where does the Georeferenced Maps tab take the year of a map from?"
right = "From the IIIF manifest of the map, its navDate or a metadata entry named as a date"
wrong = ["From the Allmaps API, which gives the year of each map it lists", "From the area of the map, by Allmaps' scale", "From the date on which the map was georeferenced in Allmaps Editor", "From the title, as the first number in it"]
explanation = "Allmaps gives no year; the tab reads each map's IIIF manifest, where navDate or a metadata entry may give one."
wiki = "Georeferenced Maps"
hidden = true

[[faq]]
question = "What does Largest leave out in the Georeferenced Maps tab?"
right = "The maps that cover more than Largest km²"
wrong = ["The maps with fewer than Largest ground control points", "The maps made before the year Largest", "The maps whose image is wider than Largest pixels", "The maps more than Largest km from the Place"]
explanation = "Largest is an area: maps covering more km² than it, such as maps of whole countries, are left out."
wiki = "Georeferenced Maps"
hidden = true

[[faq]]
question = "Which library holds the Tabula Peutingeriana that the Famous Maps tab shows?"
right = "The Austrian National Library, in Vienna"
wrong = ["The Library of Congress, in Washington", "The University Library of Basel", "The Biblioteca Nazionale Marciana, in Venice", "The Bibliothèque nationale de France, in Paris"]
explanation = "The Tabula Peutingeriana is Cod. 324 of the Austrian National Library."
wiki = "Famous Maps"
hidden = true

[[faq]]
question = "Is the image of a famous map placed on today's coordinates?"
right = "No: it stands beside today's map of its region"
wrong = ["Yes: Allmaps warps it onto today's map", "Yes: its corners are placed on the region's box", "Yes: the swipe lays it over today's map", "Yes: Save as GeoTIFF gives it coordinates"]
explanation = "None of the famous maps is georeferenced: the image has no coordinates, so it is shown beside today's map."
wiki = "Famous Maps"
hidden = true

