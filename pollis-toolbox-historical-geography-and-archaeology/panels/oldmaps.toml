[[codeBranches]]
model = "france"
code = '''
using HistoricalGeography

lon, lat = parse.(Float64, split("{{place}}", ","))  # the centre of the map
zoom = {{zoom}}
folder = mkpath(expanduser(raw"{{folder}}"))

# an old map of France that IGN serves as tiles: its title, years, tile address, zooms and the source it names
old = ign_layer(:{{old}})
println(old.title, ", ", old.years, ": tiles from zoom ", old.minzoom, " to ", old.maxzoom)
layers = [Pollis.tiles(old.url; name = "$(old.title), $(old.years)", attribution = old.attribution, maxzoom = old.maxzoom, side = "left")]
{{?today!=osm}}today = ign_layer(:{{today}})
{{?today!=osm}}push!(layers, Pollis.tiles(today.url; name = today.title, attribution = today.attribution, maxzoom = today.maxzoom, side = "right"))

# the old map on the left of the line, today's on the right: drag the line to uncover one or the other
display(Pollis.webmap(layers...; center = (lon, lat), zoom, title = "Historical Maps: $(old.title)", labels = "{{today}}" == "osm"))
'''

[[codeBranches]]
model = "allmaps"
code = '''
using DuckDB, Tables, HistoricalGeography

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude
rows(sql) = Tables.columntable(DBInterface.execute(con, sql))
quoted(text) = replace(text, "'" => "''")
lon, lat = parse.(Float64, split("{{place}}", ","))  # the centre of the map
zoom = {{zoom}}
folder = mkpath(expanduser(raw"{{folder}}"))  # where the list of maps and the manifests read are kept

# the georeferenced maps of Allmaps that cover the Place, each of at most Largest km², as the table maps:
# id, title, year, library, km2, tiles, image, manifest, editor and geom (the outline of the map)
n = allmaps(con; at = (lon, lat), largest = {{largest}}, folder)
m = rows("SELECT id, title, year, library, km2, tiles, editor FROM maps ORDER BY year NULLS LAST, km2")  # the oldest map with a year first
println(n, " maps of Allmaps cover the Place:")
for i in eachindex(m.id)[1:min(end, 30)]
	println(lpad(i, 3), "  ", rpad(coalesce(m.year[i], "none"), 6), rpad(first(m.title[i], 60), 62), m.library[i], ", ", m.km2[i], " km²")
end
pick = clamp({{pick}}, 1, n)
named(i) = string(isempty(m.title[i]) ? "Map $(m.id[i])" : m.title[i], ismissing(m.year[i]) ? "" : ", $(m.year[i])")

# the map warped by Allmaps on the left of the line, today's map on the right
display(Pollis.webmap(Pollis.tiles(m.tiles[pick]; name = named(pick), attribution = "Allmaps; $(m.library[pick])", side = "left");
	center = (lon, lat), zoom, title = "Historical Maps: $(named(pick))"))
println("Map ", pick, " in Allmaps Editor: ", m.editor[pick])
'''

[[codeBranches]]
model = "famous"
code = '''
using HistoricalGeography

folder = mkpath(expanduser(raw"{{folder}}"))
f = famous_map(:{{famous}})  # title, year, author, library, image, page, terms, the region it shows and a note
println(f.title, ", ", f.year, ", by ", f.author, "; ", f.library)
println("Image: ", f.page, " (", f.terms, ")")
isempty(f.note) || println("Shown: ", f.note)

# the region of the map on today's coordinates, outlined on today's map
region = """{"type":"FeatureCollection","features":[{"type":"Feature","properties":{"name":"Region of the map"},"geometry":{"type":"Polygon",
	"coordinates":[[[$(f.west),$(f.south)],[$(f.east),$(f.south)],[$(f.east),$(f.north)],[$(f.west),$(f.north)],[$(f.west),$(f.south)]]]}}]}"""

# the old map on the left, which moves and enlarges on its own, and today's map of its region on the right
display(Pollis.webmap(Pollis.layer(region; name = "Region of the map", color = "#d62728", opacity = 0.05);
	beside = Pollis.picture(f.image; name = "$(f.title), $(f.year)", attribution = "$(f.library); $(f.terms)"), title = "Historical Maps: $(f.title)"))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "overlay"
label = "Old Map Over Today"
desc = "The old map half transparent over today's map, without the line, to see where streets, rivers and coasts have moved"
models = ["france", "allmaps"]
code = '''
{{?model=france}}top = Pollis.tiles(old.url; name = "$(old.title), $(old.years)", attribution = old.attribution, maxzoom = old.maxzoom, opacity = 0.5)
{{?model=allmaps}}top = Pollis.tiles(m.tiles[pick]; name = named(pick), attribution = "Allmaps; $(m.library[pick])", opacity = 0.5)
display(Pollis.webmap(top; style = "liberty", center = (lon, lat), zoom, title = "Old Map Over Today"))
'''

[[actionGroups.actions]]
id = "outlines"
label = "Map Outlines"
desc = "The outline of every map found, coloured by its year: click one for its title, library and area"
models = ["allmaps"]
code = '''
outlines = joinpath(mktempdir(), "outlines.geojson")
DBInterface.execute(con, "COPY (SELECT title, year, library, km2, id, geom FROM maps) TO '$(quoted(outlines))' (FORMAT GDAL, DRIVER 'GeoJSON')")
marker = """{"type":"FeatureCollection","features":[{"type":"Feature","properties":{"name":"Place"},"geometry":{"type":"Point","coordinates":[$(lon),$(lat)]}}]}"""
display(Pollis.webmap(Pollis.layer(outlines; name = "Maps of Allmaps", column = "year", opacity = 0.15),
	Pollis.layer(marker; name = "Place", color = "#d62728"); title = "Outlines of the Maps Found"))
'''

[[actionGroups.actions]]
id = "full-image"
label = "Whole Image"
desc = "The image of the famous map alone, at its full size, in Pollis's browser"
models = ["famous"]
code = '''
Pollis.browse(f.image)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "zooms"
label = "Zooms of the Maps"
desc = "The zooms at which IGN has tiles of each map of France: beyond its last zoom a map is enlarged, not more detailed"
models = ["france"]
code = '''
l = ign_layers()
println(rpad("map", 52), rpad("years", 12), "zooms")
for i in eachindex(l.id)
	println(rpad(l.title[i], 52), rpad(l.years[i], 12), l.minzoom[i], " to ", l.maxzoom[i], l.id[i] == old.id ? "  (Old Map)" : "")
end
zoom > old.maxzoom && println("\nZoom ", zoom, " is beyond the last zoom of ", old.title, ", ", old.maxzoom, ": its tiles are enlarged.")
zoom < old.minzoom && println("\nZoom ", zoom, " is below the first zoom of ", old.title, ", ", old.minzoom, ": zoom in to see it.")
'''

[[actionGroups.actions]]
id = "missing"
label = "Missing Titles and Years"
desc = "How many maps found have no title or no year, library by library"
models = ["allmaps"]
code = '''
g = rows("""SELECT coalesce(nullif(library, ''), '(no library given)') AS library, count(*) AS maps,
	count(*) FILTER (WHERE title = '') AS untitled, count(*) FILTER (WHERE year IS NULL) AS undated FROM maps GROUP BY 1 ORDER BY maps DESC""")
println(rpad("library", 48), lpad("maps", 6), lpad("no title", 10), lpad("no year", 9))
for i in eachindex(g.library)
	println(rpad(first(g.library[i], 46), 48), lpad(g.maps[i], 6), lpad(g.untitled[i], 10), lpad(g.undated[i], 9))
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "two-old-maps"
label = "Two Old Maps"
desc = "Old Map on the left of the line and Other Old Map on its right, such as Cassini beside the état-major"
models = ["france"]
code = '''
other = ign_layer(:{{other}})
other.id == old.id && error("Old Map and Other Old Map are both $(old.title): choose two different maps")
display(Pollis.webmap(Pollis.tiles(old.url; name = "$(old.title), $(old.years)", attribution = old.attribution, maxzoom = old.maxzoom, side = "left"),
	Pollis.tiles(other.url; name = "$(other.title), $(other.years)", attribution = other.attribution, maxzoom = other.maxzoom, side = "right");
	center = (lon, lat), zoom, title = "$(old.title) and $(other.title)", labels = false))
'''

[[actionGroups.actions]]
id = "two-maps"
label = "Two Maps of the Place"
desc = "Map Number on the left of the line and Other Map Number on its right, both warped by Allmaps"
models = ["allmaps"]
code = '''
second = clamp({{second}}, 1, n)
second == pick && error("Map Number and Other Map Number are both $(pick): choose two different maps")
display(Pollis.webmap(Pollis.tiles(m.tiles[pick]; name = named(pick), attribution = "Allmaps; $(m.library[pick])", side = "left"),
	Pollis.tiles(m.tiles[second]; name = named(second), attribution = "Allmaps; $(m.library[second])", side = "right");
	center = (lon, lat), zoom, title = "$(named(pick)) and $(named(second))"))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "borders-over-map"
label = "Borders over the Map"
desc = "The borders of the states of Cliopatria in the year of the map, or Year of Borders, drawn over the old map"
models = ["france", "allmaps"]
code = '''
using DuckDB
b = DBInterface.connect(DuckDB.DB)
DBInterface.execute(b, "LOAD spatial")
DBInterface.execute(b, "SET geometry_always_xy = true")
{{?model=france}}when = {{year}}
{{?model=allmaps}}when = coalesce(m.year[pick], {{year}})
reach = 360 / 2^zoom * 8  # a box some screens wide around the Place
historical_borders(b, :cliopatria; folder, box = (lon - reach, lat - reach / 2, lon + reach, lat + reach / 2), since = when, upto = when)
{{?model=france}}under = Pollis.tiles(old.url; name = "$(old.title), $(old.years)", attribution = old.attribution, maxzoom = old.maxzoom)
{{?model=allmaps}}under = Pollis.tiles(m.tiles[pick]; name = named(pick), attribution = "Allmaps; $(m.library[pick])")
display(Pollis.webmap(under, Pollis.layer(borders_geojson(b); name = "Cliopatria, $(when)", column = "name", opacity = 0.1);
	center = (lon, lat), zoom = max(zoom - 3, 4), title = "Borders of $(when) over the Old Map", labels = false))
'''

[[actionGroups.actions]]
id = "libraries"
label = "Libraries of the Maps"
desc = "The libraries whose maps cover the Place, with how many, their years and the smallest area"
models = ["allmaps"]
code = '''
g = rows("""SELECT coalesce(nullif(library, ''), '(no library given)') AS library, count(*) AS maps, min(year) AS first, max(year) AS last,
	min(km2) AS smallest FROM maps GROUP BY 1 ORDER BY maps DESC""")
for i in eachindex(g.library)
	years = ismissing(g.first[i]) ? "no years" : "$(g.first[i]) to $(g.last[i])"
	println(rpad(first(g.library[i], 46), 48), lpad(g.maps[i], 4), " maps, ", years, ", the smallest of ", g.smallest[i], " km²")
end
'''

[[actionGroups.actions]]
id = "famous-list"
label = "The Famous Maps"
desc = "The eight famous maps in order of year, with the library that holds each and the terms of its image"
models = ["famous"]
code = '''
