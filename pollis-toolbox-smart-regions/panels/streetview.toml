# Mapillary Street-Level Viewer: a street-level image of Mapillary near a place, or one given by its id, opened in an
# interactive viewer in the plot pane (MapillaryJS), alone or beside a map of Mapillary's coverage kept in step with it

[meta]
title = "Mapillary Street-Level Viewer"
viewType = "pollis.streetview"
defaultModel = "nearest"
decisionFirstColumn = "Tab"

# The user's Mapillary client access token, kept by Pollis in Secret Storage and set in the Julia REPL
[apiKey]
label = "Mapillary"
noun = "access token"

