[[faq]]
question = "What do I need to use the panel?"
answer = '''
A Mapillary client access token, free from the developer dashboard of Mapillary once an application is registered there. The tabs need it to search the images, and the viewer to load them; it is set with the key on the Powered by line.
'''
wiki = "Access Token"

[[faq]]
question = "How do I move around in the viewer?"
answer = '''
Drag the image to look around, and use the arrows on the image to step to the next or the previous image of the sequence, or to a nearby image of another sequence. A panorama turns all the way round. With Map and Viewer, a click on a line or a dot of the map opens the image there.
'''
wiki = "Using the Viewer"

[[faq]]
question = "Which tab should I use?"
answer = '''
Nearest Image opens the image closest to a point, or the newest one near it; Nearest Panorama does the same with panoramas only; Image by ID opens an image whose id or link is known; and Map and Viewer opens the nearest image beside a map of the coverage, to walk the streets around the point.
'''
wiki = "Decision Guide"

[[faq]]
question = "Why does a notebook keep my token?"
answer = '''
The viewer runs in the page of the output and asks Mapillary for the images itself, so the token goes into the output with the image's id. A notebook saved with that output keeps the token: clear the outputs before sharing the notebook.
'''
wiki = "Access Token"
hidden = true

[[faq]]
question = "What if there is no image near the point?"
answer = '''
The tab stops and says so: make the Search Radius larger, or move the point onto a street. Nearest Panorama finds fewer images than Nearest Image, as panoramas are a part of Mapillary's images.
'''
wiki = "Diagnostics"
hidden = true

[[faq]]
question = "Where do I find the id of an image?"
answer = '''
In a link of mapillary.com, as the number after pKey=, and in the column id of the tables of Mapillary Street-Level Imagery and of this panel. Image by ID takes the number or the whole link.
'''
wiki = "Finding an Image"
hidden = true

