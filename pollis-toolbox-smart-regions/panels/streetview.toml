[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables, Downloads

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))
place = mkpath(joinpath(folder, "mapillary"))  # where the Next Steps save their files
haskey(ENV, "MAPILLARY_ACCESS_TOKEN") || error("Set your Mapillary access token with the key on the Powered by line, or set ENV[\"MAPILLARY_ACCESS_TOKEN\"]: see the Access Token wiki")
function mly_get(url, path)  # one request of the Mapillary API, written to path; stops with the API's message
	part = path * ".part"
	r = open(io -> Downloads.request(url; output = io, headers = ["Authorization" => "OAuth " * ENV["MAPILLARY_ACCESS_TOKEN"]], throw = false), part, "w")
	r isa Downloads.Response || (rm(part; force = true); error("Mapillary could not be reached: $(r.message)"))
	if r.status != 200
		answer = read(part, String)
		rm(part; force = true)
		m = match(r"\"message\"\s*:\s*\"(.*?)\""s, answer)
		error("Mapillary answered HTTP $(r.status): $(m === nothing ? first(answer, 300) : m[1])")
	end
	return mv(part, path; force = true)
end
name, lon, lat = "{{placeName}}", {{lon}}, {{lat}}  # the point, in degrees of longitude and latitude: replace it with your own place
radius = {{radius}}  # how far from the point to look for images, in metres
0 < radius <= 500 || error("The Search Radius is $(radius) m: give one above 0 and at most 500")
fields = "id,captured_at,compass_angle,computed_compass_angle,geometry,computed_geometry,is_pano,camera_type,make,model,sequence,creator,width,height,thumb_1024_url,thumb_2048_url"
function read_images(answer; list = true)  # the images of an answer of the API, as the table images, with their distance from the point
	rows = list ? "unnest(CAST(coalesce(json_extract(content, '/data'), '[]') AS JSON[]))" : "CAST(content AS JSON)"
	DBInterface.execute(con, """
	CREATE OR REPLACE TABLE images AS
	SELECT *, ST_Distance_Sphere(geom, ST_Point($(lon), $(lat))) AS metres FROM (
		SELECT DISTINCT ON (id) x->>'id' AS id, x->>'sequence' AS sequence_id, epoch_ms(CAST(x->>'captured_at' AS BIGINT)) AS captured_at,
			TRY_CAST(coalesce(x->>'computed_compass_angle', x->>'compass_angle') AS DOUBLE) AS compass_angle, coalesce(TRY_CAST(x->>'is_pano' AS BOOLEAN), false) AS is_pano,
			x->>'camera_type' AS camera_type, x->>'make' AS make, x->>'model' AS camera_model, TRY_CAST(x->>'width' AS INTEGER) AS width, TRY_CAST(x->>'height' AS INTEGER) AS height,
			x->'creator'->>'username' AS creator, x->>'thumb_1024_url' AS thumb_url, x->>'thumb_2048_url' AS large_url,
			ST_GeomFromGeoJSON(coalesce(x->'computed_geometry', x->'geometry')) AS geom, ST_GeomFromGeoJSON(x->'geometry') AS camera_geom
		FROM (SELECT $(rows) AS x FROM read_text(?)))
	""", [answer])  # one row per image: its sequence, date, heading, panorama, camera, creator, thumbnails, and its computed and camera positions
	rm(answer)
end
function nearby(filters = String[])  # the images within the radius of the point, from the image search over a box around it
	dlon, dlat = radius / (111320 * cosd(lat)), radius / 110574  # the radius in degrees of longitude and latitude
	read_images(mly_get("https://graph.mapillary.com/images?" * join(["fields=$(fields)"; "bbox=$(lon - dlon),$(lat - dlat),$(lon + dlon),$(lat + dlat)"; "limit=2000"; filters], "&"), tempname() * ".json"))
	only(query("SELECT count(*) AS n FROM images").n) >= 2000 && println("The search returned 2,000 images, as many as Mapillary gives to one request: some within the radius may be missing, so make the Search Radius smaller")
	DBInterface.execute(con, "DELETE FROM images WHERE metres > $(radius)")  # the corners of the box are farther than the radius
end
{{?model=nearest|mapview}} nearby()
{{?model=pano}} nearby(["is_pano=true"])  # panoramas only, filtered by the API
{{?model!=byid}} order = "{{pick}}" == "newest" ? "captured_at DESC" : "metres"  # the nearest image, or the newest within the radius
{{?model=byid}} given = strip(raw"{{imageId}}")
{{?model=byid}} link = match(r"pKey=(\d+)", given)  # a link of mapillary.com names its image with pKey
{{?model=byid}} image = link !== nothing ? String(link[1]) : occursin(r"^\d+$", given) ? String(given) : given == "nearest" ? "" : error("Image ID or Link is neither the id of an image, nor a link of mapillary.com with pKey=, nor nearest")
{{?model=byid}} isempty(image) ? nearby() : read_images(mly_get("https://graph.mapillary.com/$(image)?fields=$(fields)", tempname() * ".json"); list = false)  # nearest: the image nearest the point
{{?model=byid}} order = "metres"
chosen = query("SELECT id, CAST(CAST(captured_at AS DATE) AS VARCHAR) AS day, round(metres, 1) AS metres, coalesce(CAST(round(compass_angle) AS VARCHAR) || ' degrees', 'unknown') AS heading, is_pano, coalesce(camera_type, 'unknown') AS camera FROM images ORDER BY $(order) LIMIT 1")
{{?model!=pano}} isempty(chosen.id) && error("Mapillary has no image within $(radius) m of the point: make the Search Radius larger, or move the point onto a street")
{{?model=pano}} isempty(chosen.id) && error("Mapillary has no panorama within $(radius) m of the point: make the Search Radius larger, or use Nearest Image")
image = chosen.id[1]  # the image the viewer opens, and the Next Steps look at
println("Image ", image, ", captured ", chosen.day[1], ", ", chosen.metres[1], " m from the point, heading ", chosen.heading[1], chosen.is_pano[1] ? ", a panorama" : ", camera " * chosen.camera[1], "; ", only(query("SELECT count(*) AS n FROM images").n), " images in the table images")
{{?model!=mapview}} display(Pollis.streetview(image; title = name))  # drag to look around; the arrows walk along the sequence
{{?model=mapview}} display(Pollis.streetview(image; map = true, title = name))  # a click on the map opens the image there, and the marker follows the viewer
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "viewer-and-map"
label = "Viewer and Map"
desc = "The image in the street-level viewer beside a map of Mapillary's sequences and images, kept in step: a click on the map opens the image there, and the marker follows the viewer as it walks"
models = ["nearest", "byid", "pano"]
code = '''
display(Pollis.streetview(image; map = true, title = name))
'''

[[actionGroups.actions]]
id = "images-around"
label = "Images Around the Point"
desc = "The images within the Search Radius as points coloured by the year they were captured, with the point, on an OpenStreetMap base map in Pollis's map view; click an image for its id, date and distance"
models = ["nearest", "pano", "mapview"]
code = '''
shown = joinpath(mktempdir(), "images.geojson")
DBInterface.execute(con, "COPY (SELECT id, CAST(captured_at AS VARCHAR) AS captured, year(captured_at) AS year, round(metres, 1) AS metres, compass_angle, is_pano, geom FROM images) TO '$(shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")
point = """{"type":"FeatureCollection","features":[{"type":"Feature","properties":{"name":"$(name)"},"geometry":{"type":"Point","coordinates":[$(lon),$(lat)]}}]}"""
display(Pollis.webmap(Pollis.layer(shown; name = "Images by year", column = "year"), Pollis.layer(point; name = name, color = "#e15759"); title = "Mapillary Images Around $(name)"))
'''

[[actionGroups.actions]]
id = "look-at-image"
label = "Look at the Image"
desc = "The thumbnail of the image, 1024 pixels wide, downloaded into the folder mapillary and shown with its date, heading and creator on a page in Pollis's browser, linked to the image on Mapillary"
code = '''
t = only(query("SELECT thumb_url, CAST(CAST(captured_at AS DATE) AS VARCHAR) AS day, coalesce(CAST(round(compass_angle) AS VARCHAR) || '°', 'unknown') AS heading, coalesce(creator, 'unknown') AS creator FROM images WHERE id = ?", [image]) |> Tables.rows)
ismissing(t.thumb_url) && error("Mapillary gives no thumbnail of image $(image)")
thumb = joinpath(mkpath(joinpath(place, "thumbnails")), image * ".jpg")
isfile(thumb) || mv(Downloads.download(t.thumb_url, thumb * ".part"), thumb)
sheet = joinpath(place, "mapillary-image-$(image).html")
write(sheet, """<!doctype html><html><head><meta charset="utf-8"><title>Mapillary Image $(image)</title>
<style>body{font-family:sans-serif;margin:16px}img{max-width:100%;border-radius:4px}p{color:#666}</style></head>
<body><h2>$(name)</h2><a href="https://www.mapillary.com/app/?pKey=$(image)"><img src="thumbnails/$(image).jpg" alt="Image $(image)"></a>
<p>Image $(image) · $(t.day) · heading $(t.heading) · by $(t.creator). Image from Mapillary.</p></body></html>""")
Pollis.browse(sheet)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "image-details"
label = "Image Details"
desc = "Everything the API gives of the image: date, camera, size, heading, panorama, creator and sequence, and how far Mapillary moved the camera's own position when it computed the image's position"
code = '''
d = only(query("SELECT id, CAST(captured_at AS VARCHAR) AS captured, camera_type, make, camera_model, width, height, round(compass_angle, 1) AS heading, is_pano, creator, sequence_id, round(metres, 1) AS from_point, round(ST_Distance_Sphere(geom, camera_geom), 1) AS moved FROM images WHERE id = ?", [image]) |> Tables.rows)
labels = (id = "Image", captured = "Captured", camera_type = "Projection", make = "Camera make", camera_model = "Camera model", width = "Width (px)", height = "Height (px)", heading = "Heading (deg)", is_pano = "Panorama", creator = "Creator", sequence_id = "Sequence", from_point = "From point (m)", moved = "Position moved (m)")
for (k, v) in pairs(d)
	println(rpad(labels[k], 20), ismissing(v) ? "not given" : v)
end
'''

[[actionGroups.actions]]
id = "distances"
label = "Images by Distance"
desc = "How many images, and how many panoramas, lie within each 10 m of the point: whether the Search Radius is too small, or larger than needed"
models = ["nearest", "pano", "mapview"]
code = '''
r = query("SELECT CAST(greatest(ceil(metres / 10), 1) * 10 AS INTEGER) AS ring, count(*) AS n, count(*) FILTER (WHERE is_pano) AS panoramas FROM images GROUP BY ring ORDER BY ring")
println("Images within each 10 m of the point, up to ", radius, " m:")
for i in eachindex(r.n)
	println(lpad("$(r.ring[i] - 10) to $(r.ring[i]) m", 14), lpad(r.n[i], 7), " images, ", r.panoramas[i], " panoramas  ", repeat("#", round(Int, 40 * r.n[i] / maximum(r.n))))
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "oldest-newest"
label = "Oldest and Newest"
desc = "The oldest and the newest image within the Search Radius, each in its own street-level viewer: how the place has changed between them"
models = ["nearest", "pano", "mapview"]
code = '''
o = query("SELECT id, CAST(CAST(captured_at AS DATE) AS VARCHAR) AS day, round(metres, 1) AS metres FROM images ORDER BY captured_at")
length(o.id) < 2 && error("There is only one image within $(radius) m of the point: make the Search Radius larger")
println("Oldest: image ", o.id[1], ", ", o.day[1], ", ", o.metres[1], " m from the point")
println("Newest: image ", o.id[end], ", ", o.day[end], ", ", o.metres[end], " m from the point")
display(Pollis.streetview(o.id[1]; title = "$(name), $(o.day[1])"))
display(Pollis.streetview(o.id[end]; title = "$(name), $(o.day[end])"))
'''

[[actionGroups.actions]]
id = "panoramas-others"
label = "Panoramas and Others"
desc = "The panoramas beside the other images within the Search Radius: how many, in how many sequences, the nearest of each, and their first and last dates"
models = ["nearest", "mapview"]
code = '''
p = query("SELECT is_pano, count(*) AS n, count(DISTINCT sequence_id) AS k, round(min(metres), 1) AS nearest, CAST(min(captured_at) AS DATE) AS t0, CAST(max(captured_at) AS DATE) AS t1 FROM images GROUP BY is_pano ORDER BY is_pano")
println(rpad("", 14), rpad("images", 9), rpad("sequences", 11), rpad("nearest", 10), "first and last")
for i in eachindex(p.n)
	println(rpad(p.is_pano[i] ? "Panoramas" : "Other images", 14), rpad(p.n[i], 9), rpad(p.k[i], 11), rpad("$(p.nearest[i]) m", 10), p.t0[i], " to ", p.t1[i])
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "point-in-view"
label = "Is the Point in View?"
desc = "The compass direction from the image to the point, beside the direction the camera faced: how far to turn the viewer to look at the point"
code = '''
p = only(query("SELECT ST_X(geom) AS x, ST_Y(geom) AS y, compass_angle, is_pano, metres FROM images WHERE id = ?", [image]) |> Tables.rows)
bearing = mod(atand(sind(lon - p.x) * cosd(lat), cosd(p.y) * sind(lat) - sind(p.y) * cosd(lat) * cosd(lon - p.x)), 360)  # the initial great-circle bearing from the image to the point
println("From image ", image, ", ", name, " is ", round(p.metres; digits = 1), " m away, towards ", round(Int, bearing), " degrees")
if p.is_pano
	println("A panorama sees all round: turn the viewer to ", round(Int, bearing), " degrees")
elseif ismissing(p.compass_angle)
	println("Mapillary gives no heading for this image")
else
	turn = mod(bearing - p.compass_angle + 180, 360) - 180  # from -180 to 180: negative to the left
	println("The camera faced ", round(Int, p.compass_angle), " degrees: the point is ", round(Int, abs(turn)), " degrees to the ", turn >= 0 ? "right" : "left", " of the centre of the image")
end
'''

[[actionGroups.actions]]
id = "coverage-by-year"
label = "Coverage by Year"
desc = "The images within the Search Radius by the year they were captured: how many, in how many sequences, and how many panoramas"
models = ["nearest", "pano", "mapview"]
code = '''
y = query("SELECT year(captured_at) AS year, count(*) AS n, count(DISTINCT sequence_id) AS k, count(*) FILTER (WHERE is_pano) AS panoramas FROM images GROUP BY year ORDER BY year")
for i in eachindex(y.n)
	println(y.year[i], lpad(y.n[i], 7), " images", lpad(y.k[i], 5), " sequences", lpad(y.panoramas[i], 6), " panoramas  ", repeat("#", round(Int, 40 * y.n[i] / maximum(y.n))))
end
'''

[[actionGroups]]
id = "export"
label = "Export"

[[actionGroups.actions]]
id = "save-image"
label = "Save the Image"
desc = "Download the image, 2048 pixels wide, as a JPEG file in the folder mapillary, named by its id"
code = '''
u = only(query("SELECT large_url FROM images WHERE id = ?", [image]).large_url)
ismissing(u) && error("Mapillary gives no image 2048 pixels wide of image $(image)")
saved = joinpath(place, "mapillary-$(image)-2048.jpg")
mv(Downloads.download(u, saved * ".part"), saved; force = true)
println("Wrote ", saved, ", ", round(filesize(saved) / 2^10; digits = 1), " KB")
'''

[[actionGroups.actions]]
id = "save-geoparquet"
label = "Save as GeoParquet"
desc = "Write the table images, every image the tab found with its attributes and computed position, as a GeoParquet file in the folder mapillary"
code = '''
parquet_file = joinpath(place, "mapillary-images-near-point.parquet")
DBInterface.execute(con, "COPY (SELECT * EXCLUDE (camera_geom) FROM images ORDER BY metres) TO '$(parquet_file)' (FORMAT parquet)")
println("Wrote ", only(query("SELECT count(*) AS n FROM images").n), " images to ", parquet_file)
'''

[[actionGroups.actions]]
id = "open-on-mapillary"
label = "Open on Mapillary"
desc = "The link of the image on mapillary.com, printed and opened in Pollis's browser"
code = '''
link = "https://www.mapillary.com/app/?pKey=$(image)"
println(link)
Pollis.browse(link)
'''
