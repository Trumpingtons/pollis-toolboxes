[[faq]]
question = "Why are some GTFS times later than 24:00:00?"
answer = '''
GTFS measures times from noon minus 12 hours of the service day, which is midnight except on days when daylight saving time changes. A trip that runs past midnight keeps counting: 25:35:00 is 1:35 in the morning of the next calendar day, but belongs to the service day before.

The GTFS tab reads times as text and turns them into seconds since the start of the service day, so times past 24:00:00 are kept.
'''
wiki = "GTFS"

[[faq]]
question = "Which day does the GTFS tab analyse?"
answer = '''
The Service Date input names it, as YYYY-MM-DD, or is busiest, the date with the most trips in the feed. The tab expands calendar.txt into dates, by weekday between start_date and end_date, adds the dates calendar_dates.txt adds and removes those it removes, and keeps the trips whose service runs on the date.

Service Calendar shows the trips of every date of the feed.
'''
wiki = "Service Frequency"

[[faq]]
question = "How are intersections and dead ends counted in an OpenStreetMap network?"
answer = '''
Network Measures counts, for each node, the line segments of the network that meet there: one for a node at the end of a way, two for a node inside it, summed over the ways that use the node. A node where three or more segments meet is an intersection; a node with one is a dead end.

Ways that cross without a shared node, as at bridges, do not meet.
'''
wiki = "Street Networks"

[[faq]]
question = "Is OpenStreetMap complete enough for my area?"
answer = '''
It depends on the area. Barrington-Leigh and Millard-Ball estimated in 2017 that OpenStreetMap's road network was about 83% complete worldwide, and fully mapped in more than 40% of countries; better-governed countries with good internet access were more complete, and both sparsely populated areas and dense cities were the best mapped.

Tag Check shows which tags of a network are filled in.
'''
wiki = "OpenStreetMap PBF"

[[faq]]
question = "What is a headway?"
answer = '''
The time between two departures of the same route, in the same direction, from the same stop. Routes Side by Side gives the median headway of each route at its first stop, and Service at Stops the median headway over all departures at each stop.

A feed that defines trips by frequencies.txt, by a headway between a start and an end time, has fewer rows in stop_times.txt than trips run; Feed Check says when a feed has that file.
'''
wiki = "Service Frequency"
hidden = true

[[faq]]
question = "Which files must a GTFS feed have?"
answer = '''
agency.txt, routes.txt, trips.txt and stop_times.txt are required; stops.txt is required unless all stops are demand-responsive zones in locations.geojson. calendar.txt is required unless every service date is in calendar_dates.txt, which is then required.

Feed Check lists the required files a feed lacks.
'''
wiki = "GTFS"
hidden = true

[[faq]]
question = "How much smaller is PBF than OpenStreetMap XML?"
answer = '''
According to the OpenStreetMap wiki, the PBF format is about half the size of a gzipped planet file and about 30% smaller than a bzipped one, and it is about five times faster to write and six times faster to read than a gzipped planet.

PBF files end in .osm.pbf, and Geofabrik and other sites publish extracts of countries and regions in it.
'''
wiki = "OpenStreetMap PBF"
hidden = true

