[[actionGroups.actions]]
id = "service-at-stops"
label = "Service at Stops"
desc = "The busiest stops of the service day, with their departures, departures in their busiest hour and median headway"
models = ["gtfs"]
code = '''
s = Tables.columntable(DBInterface.execute(con, """
WITH d AS (SELECT x.stop_id, x.departure, t.route_id, t.direction_id FROM times x JOIN day_trips t USING (trip_id) WHERE NOT x.last_stop AND x.departure IS NOT NULL),
gaps AS (SELECT stop_id, departure - lag(departure) OVER (PARTITION BY stop_id, route_id, direction_id ORDER BY departure) AS gap FROM d),
hours AS (SELECT stop_id, departure // 3600 AS hour, count(*) AS n FROM d GROUP BY ALL)
SELECT p.stop_id, coalesce(p.stop_name, p.stop_id) AS name, (SELECT count(*) FROM d WHERE d.stop_id = p.stop_id) AS departures,
	(SELECT max(n) FROM hours h WHERE h.stop_id = p.stop_id) AS peak, (SELECT median(gap) FROM gaps g WHERE g.stop_id = p.stop_id) AS headway
FROM stop_points p ORDER BY departures DESC LIMIT 20
"""))
w = maximum(length, s.name; init = 4) + 2
println("Busiest stops on ", day, "\n", rpad("stop", w), rpad("departures", 12), rpad("in busiest hour", 17), "median headway of a route")
for i in eachindex(s.stop_id)
	println(rpad(s.name[i], w), rpad(s.departures[i], 12), rpad(coalesce(s.peak[i], 0), 17), ismissing(s.headway[i]) ? "" : string(round(s.headway[i] / 60, digits = 1), " min"))
end
'''

[[actionGroups.actions]]
id = "network-measures"
label = "Network Measures"
desc = "The length of the network, its nodes, intersections and dead ends, and its length per square kilometre of its extent"
models = ["osmpbf"]
code = '''
m = Tables.columntable(DBInterface.execute(con, """
WITH ends AS (SELECT id, refs[1] AS first, refs[len(refs)] AS last, refs FROM ways WHERE id IN (SELECT id FROM network)),
uses AS (SELECT UNNEST(refs) AS node, first, last FROM ends),
degree AS (SELECT node, sum(CASE WHEN node = first OR node = last THEN 1 ELSE 2 END) AS d FROM uses GROUP BY node)
SELECT (SELECT round(sum(metres) / 1000, 2) FROM network_m) AS km, count(*) AS nodes, count(*) FILTER (WHERE d >= 3) AS intersections, count(*) FILTER (WHERE d = 1) AS dead_ends,
	round(avg(d), 2) AS mean_degree, (SELECT ST_Area_Spheroid(ST_ConvexHull(ST_Union_Agg(geom))) / 1e6 FROM network) AS area FROM degree
"""))
println("Network of the ways tagged $(key)")
println("Length: ", m.km[1], " km; nodes: ", m.nodes[1], "; intersections (3 or more segments): ", m.intersections[1], "; dead ends (1 segment): ", m.dead_ends[1], "; mean segments per node: ", m.mean_degree[1])
println("Convex hull of the network: ", round(m.area[1], digits = 2), " km²; ", round(m.km[1] / m.area[1], digits = 1), " km of network and ", round(m.intersections[1] / m.area[1], digits = 1), " intersections per km²")
'''

[[actionGroups.actions]]
id = "service-calendar"
label = "Service Calendar"
desc = "The trips of each weekday on average over the feed's dates, and the dates without service"
models = ["gtfs"]
code = '''
c = Tables.columntable(DBInterface.execute(con, "WITH per AS (SELECT s.date, count(t.trip_id) AS trips FROM service_dates s JOIN trips t USING (service_id) GROUP BY s.date) SELECT dayname(date) AS weekday, isodow(date) AS dow, count(*) AS days, round(avg(trips), 1) AS mean, min(trips) AS low, max(trips) AS high FROM per GROUP BY ALL ORDER BY dow"))
println(rpad("weekday", 12), rpad("dates", 8), rpad("mean trips", 12), "range")
for i in eachindex(c.weekday)
	println(rpad(c.weekday[i], 12), rpad(c.days[i], 8), rpad(c.mean[i], 12), c.low[i], " to ", c.high[i])
end
gaps = Tables.columntable(DBInterface.execute(con, "SELECT CAST(d AS DATE) AS date FROM generate_series((SELECT min(date) FROM service_dates), (SELECT max(date) FROM service_dates), INTERVAL 1 DAY) g(d) WHERE CAST(d AS DATE) NOT IN (SELECT date FROM service_dates) ORDER BY date")).date
println("Dates without service between the first and the last: ", isempty(gaps) ? "none" : join(first(gaps, 15), ", ") * (length(gaps) > 15 ? ", ... ($(length(gaps)) in all)" : ""))
'''

