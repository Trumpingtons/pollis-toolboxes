end
a = Tables.columntable(DBInterface.execute(con, "SELECT agency_name, agency_timezone FROM agency"))
println("Agencies: ", join(["$(a.agency_name[i]) ($(a.agency_timezone[i]))" for i in eachindex(a.agency_name)], "; "))
"feed_info" in tables && println("Feed info: ", Tables.columntable(DBInterface.execute(con, "SELECT * FROM feed_info LIMIT 1")))
'''

[[actionGroups.actions]]
id = "file-contents"
label = "File Contents"
desc = "The nodes, ways and relations of the file, and the ways of the network and their extent"
models = ["osmpbf"]
code = '''
k = Tables.columntable(DBInterface.execute(con, "SELECT kind::VARCHAR AS kind, count(*) AS n FROM ST_ReadOSM('$(path)') GROUP BY kind ORDER BY kind"))
println("File ", basename(path), ", ", round(filesize(path) / 2^20, digits = 2), " MB: ", join(["$(k.n[i]) $(k.kind[i])s" for i in eachindex(k.kind)], ", "))
e = Tables.columntable(DBInterface.execute(con, "SELECT count(*) AS ways, sum(nodes) AS refs, sum(found) AS found, ST_XMin(ST_Extent_Agg(geom)) AS w, ST_XMax(ST_Extent_Agg(geom)) AS e, ST_YMin(ST_Extent_Agg(geom)) AS s, ST_YMax(ST_Extent_Agg(geom)) AS n FROM network"))
println("Ways tagged $(key): ", e.ways[1], ", with ", e.refs[1], " node references, ", e.found[1], " of them in the file")
println("Extent of the network: longitude ", round(e.w[1], digits = 4), " to ", round(e.e[1], digits = 4), ", latitude ", round(e.s[1], digits = 4), " to ", round(e.n[1], digits = 4))
'''

[[actionGroups.actions]]
id = "feed-check"
label = "Feed Check"
desc = "Required files, stops without coordinates, references to unknown stops and trips, trips without times, times that go backwards, times past midnight, frequencies.txt"
models = ["gtfs"]
code = '''
required = ["agency", "routes", "trips", "stop_times", "stops"]
missing_files = [setdiff(required, tables); ("calendar" in tables || "calendar_dates" in tables) ? String[] : ["calendar or calendar_dates"]]
println("Required files missing: ", isempty(missing_files) ? "none" : join(missing_files .* ".txt", ", "))
checks = [
	"Stops without valid coordinates" => "SELECT count(*) FROM stop_points WHERE geom IS NULL",
	"Stop times at stops not in stops.txt" => "SELECT count(*) FROM times WHERE stop_id NOT IN (SELECT stop_id FROM stops)",
	"Stop times of trips not in trips.txt" => "SELECT count(*) FROM times WHERE trip_id NOT IN (SELECT trip_id FROM trips)",
	"Trips without stop times" => "SELECT count(*) FROM trips WHERE trip_id NOT IN (SELECT trip_id FROM times)",
	"Trips of routes not in routes.txt" => "SELECT count(*) FROM trips WHERE route_id NOT IN (SELECT route_id FROM routes)",
	"Routes without trips" => "SELECT count(*) FROM routes WHERE route_id NOT IN (SELECT route_id FROM trips)",
	"Stop times whose departure is earlier than the arrival or the time before" => "SELECT count(*) FROM (SELECT arrival, departure, lag(departure) OVER (PARTITION BY trip_id ORDER BY sequence) AS before FROM times) WHERE departure < arrival OR arrival < before",
	"Stop times without times (allowed between timepoints)" => "SELECT count(*) FROM times WHERE arrival IS NULL AND departure IS NULL",
	"Stop times past 24:00:00, after midnight of the service day" => "SELECT count(*) FROM times WHERE departure >= 86400"]
for (label, sql) in checks
	println(rpad(label, 76), only(only(Tables.columntable(DBInterface.execute(con, sql)))))
end
println("frequencies.txt: ", "frequencies" in tables ? "present, so trips defined by headway run more often than stop_times.txt lists" : "none")
'''

[[actionGroups.actions]]
id = "tag-check"
label = "Tag Check"
desc = "How many ways of the network have each common tag, and ways with nodes missing from the extract"
models = ["osmpbf"]
code = '''
t = Tables.columntable(DBInterface.execute(con, "SELECT k AS tag, count(*) AS ways, round(100 * count(*) / (SELECT count(*) FROM network), 1) AS percent FROM network, UNNEST(map_keys(tags)) t(k) WHERE k <> '$(key)' GROUP BY k ORDER BY ways DESC LIMIT 20"))
println(rpad("tag", 26), rpad("ways", 10), "% of the network")
for i in eachindex(t.tag)
	println(rpad(t.tag[i], 26), rpad(t.ways[i], 10), t.percent[i])
end
m = Tables.columntable(DBInterface.execute(con, "SELECT count(*) FILTER (WHERE found < nodes) AS cut, (SELECT count(*) FROM ways) - count(*) AS dropped FROM network"))
println("Ways with nodes outside the extract, cut at its edge: ", m.cut[1], "; ways left out, with fewer than two nodes in it: ", m.dropped[1])
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "routes-side-by-side"
label = "Routes Side by Side"
desc = "Each route on the service day, its trips, stops, first and last departure, median headway at its first stop and median trip time"
models = ["gtfs"]
code = '''
r = Tables.columntable(DBInterface.execute(con, """
WITH first_stops AS (SELECT d.route_id, d.direction_id, x.trip_id, x.departure FROM day_trips d JOIN times x USING (trip_id) WHERE x.sequence = (SELECT min(sequence) FROM times y WHERE y.trip_id = x.trip_id)),
gaps AS (SELECT route_id, departure - lag(departure) OVER (PARTITION BY route_id, direction_id ORDER BY departure) AS gap FROM first_stops),
spans AS (SELECT trip_id, max(arrival) - min(departure) AS span FROM times GROUP BY trip_id)
SELECT r.route_id, coalesce(r.route_short_name, '') || ' ' || coalesce(r.route_long_name, '') AS name,
	(SELECT count(*) FROM day_trips d WHERE d.route_id = r.route_id) AS trips,
	(SELECT count(DISTINCT x.stop_id) FROM day_trips d JOIN times x USING (trip_id) WHERE d.route_id = r.route_id) AS stops,
	(SELECT min(departure) FROM first_stops f WHERE f.route_id = r.route_id) AS first, (SELECT max(departure) FROM first_stops f WHERE f.route_id = r.route_id) AS last,
	(SELECT median(gap) FROM gaps g WHERE g.route_id = r.route_id) AS headway,
	(SELECT median(span) FROM day_trips d JOIN spans USING (trip_id) WHERE d.route_id = r.route_id) AS duration
FROM routes r ORDER BY trips DESC
"""))
clock(s) = ismissing(s) ? "" : join(lpad.([s ÷ 3600, s % 3600 ÷ 60], 2, '0'), ":")
w = maximum(length, strip.(r.name); init = 5) + 2
println("Routes on ", day, "\n", rpad("route", w), rpad("trips", 8), rpad("stops", 8), rpad("first", 8), rpad("last", 8), rpad("headway", 10), "trip time")
for i in eachindex(r.route_id)
	println(rpad(strip(r.name[i]), w), rpad(r.trips[i], 8), rpad(r.stops[i], 8), rpad(clock(r.first[i]), 8), rpad(clock(r.last[i]), 8), rpad(ismissing(r.headway[i]) ? "" : string(round(r.headway[i] / 60, digits = 1), " min"), 10), ismissing(r.duration[i]) ? "" : string(round(r.duration[i] / 60, digits = 1), " min"))
end
'''

[[actionGroups.actions]]
id = "classes-side-by-side"
label = "Classes Side by Side"
desc = "Each class of the network, its ways, kilometres, and the share named, with a speed limit and one-way"
models = ["osmpbf"]
code = '''
c = Tables.columntable(DBInterface.execute(con, """
SELECT class, count(*) AS ways, round(sum(metres) / 1000, 2) AS km, round(100 * avg((name IS NOT NULL)::INT), 1) AS named,
	round(100 * avg((tags['maxspeed'] IS NOT NULL)::INT), 1) AS maxspeed, round(100 * avg(coalesce(tags['oneway'] = 'yes', false)::INT), 1) AS oneway
FROM network_m GROUP BY class ORDER BY km DESC
"""))
w = maximum(length, c.class; init = 5) + 2
println(rpad(key, w), rpad("ways", 8), rpad("km", 10), rpad("% named", 10), rpad("% maxspeed", 12), "% one-way")
for i in eachindex(c.class)
	println(rpad(c.class[i], w), rpad(c.ways[i], 8), rpad(c.km[i], 10), rpad(c.named[i], 10), rpad(c.maxspeed[i], 12), c.oneway[i])
end
'''

