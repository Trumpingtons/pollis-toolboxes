[[actionGroups.actions]]
id = "stops-routes-map"
label = "Show on a Map"
desc = "The stops and one line per route and direction, through the stops of its longest trip, or along its shape when the feed has shapes.txt"
models = ["gtfs"]
code = '''
dir = mktempdir()
shape = "shapes" in tables && "shape_id" in Tables.columntable(DBInterface.execute(con, "DESCRIBE trips")).column_name
DBInterface.execute(con, """
CREATE OR REPLACE TABLE route_lines AS
WITH stops_per_trip AS (SELECT trip_id, count(*) AS n FROM times GROUP BY trip_id),
longest AS (SELECT t.*, row_number() OVER (PARTITION BY t.route_id, t.direction_id ORDER BY s.n DESC, t.trip_id) AS k FROM trips t JOIN stops_per_trip s USING (trip_id) QUALIFY k = 1)  -- the trip with the most stops of each route and direction
SELECT l.route_id AS route, coalesce(r.route_short_name, r.route_long_name, l.route_id) AS name, l.direction_id AS direction,
	$(shape ? "coalesce(any_value(s.geom), ST_MakeLine(list(p.geom ORDER BY x.sequence)))" : "ST_MakeLine(list(p.geom ORDER BY x.sequence))") AS geom
FROM longest l JOIN routes r USING (route_id) JOIN times x USING (trip_id) JOIN stop_points p USING (stop_id)
$(shape ? "LEFT JOIN (SELECT shape_id, ST_MakeLine(list(ST_Point(CAST(shape_pt_lon AS DOUBLE), CAST(shape_pt_lat AS DOUBLE)) ORDER BY CAST(shape_pt_sequence AS INTEGER))) AS geom FROM shapes GROUP BY shape_id) s USING (shape_id)" : "")
GROUP BY ALL
""")
DBInterface.execute(con, "COPY (SELECT * EXCLUDE (geom), geom FROM route_lines) TO '$(joinpath(dir, "routes.geojson"))' (FORMAT GDAL, DRIVER 'GeoJSON')")
DBInterface.execute(con, "COPY (SELECT stop_id, stop_name, geom FROM stop_points WHERE geom IS NOT NULL) TO '$(joinpath(dir, "stops.geojson"))' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(joinpath(dir, "routes.geojson"); name = "Routes", column = "name", opacity = 0.9), Pollis.layer(joinpath(dir, "stops.geojson"); name = "Stops", color = "#333333")))
'''

[[actionGroups.actions]]
id = "network-map"
label = "Show on a Map"
desc = "The network on an OpenStreetMap base map in Pollis's map view, coloured by class; click a way for its class, name and length"
models = ["osmpbf"]
code = '''
dir = mktempdir()
shown = 50_000  # a map of more ways is slow to draw: the longest are kept
DBInterface.execute(con, "COPY (SELECT id, class, name, round(metres) AS metres, geom FROM network_m ORDER BY metres DESC LIMIT $(shown)) TO '$(joinpath(dir, "network.geojson"))' (FORMAT GDAL, DRIVER 'GeoJSON')")
total = only(only(Tables.columntable(DBInterface.execute(con, "SELECT count(*) FROM network_m"))))
total > shown && println("The map shows the ", shown, " longest of ", total, " ways")
display(Pollis.webmap(Pollis.layer(joinpath(dir, "network.geojson"); name = "$(key)", column = "class", opacity = 0.9)))
'''

[[actionGroups.actions]]
id = "departures-by-hour"
label = "Departures by Hour"
desc = "The departures from all stops in each hour of the service day, as a bar chart drawn with ECharts"
models = ["gtfs"]
code = '''
using ECharts

d = Tables.columntable(DBInterface.execute(con, "SELECT departure // 3600 AS hour, count(*) AS n FROM times JOIN day_trips USING (trip_id) WHERE NOT last_stop AND departure IS NOT NULL GROUP BY hour ORDER BY hour"))
EChart(ec_width = 700, ec_height = 400, title = [ECharts.Title(text = "Departures by hour, $(day)")],
	xAxis = [ECharts.Axis(_type = "category", name = "Hour", data = string.(d.hour))], yAxis = [ECharts.Axis(_type = "value", name = "Departures")],
	series = [ECharts.XYSeries(name = "Departures", _type = "bar", data = collect(d.n))])
'''

[[actionGroups.actions]]
id = "length-by-class"
label = "Kilometres by Class"
desc = "The kilometres of each class of the network, as a bar chart drawn with ECharts"
models = ["osmpbf"]
code = '''
using ECharts

d = Tables.columntable(DBInterface.execute(con, "SELECT class, round(sum(metres) / 1000, 2) AS km FROM network_m GROUP BY class ORDER BY km DESC LIMIT 25"))
EChart(ec_width = 700, ec_height = 400, title = [ECharts.Title(text = "Kilometres by $(key)")],
	xAxis = [ECharts.Axis(_type = "category", name = "$(key)", data = collect(d.class), axisLabel = ECharts.AxisLabel(rotate = 45))], yAxis = [ECharts.Axis(_type = "value", name = "km")],
	series = [ECharts.XYSeries(name = "km", _type = "bar", data = collect(d.km))])
'''

