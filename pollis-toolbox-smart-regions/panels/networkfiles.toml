[[codeBranches]]
model = "gtfs"
code = '''
using ZipArchives, DuckDB, Tables, Dates, Downloads

con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the feed stays where it is
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files
path = joinpath(folder, "{{gtfsFile}}")  # an absolute path is kept as it is
{{?gtfsFile=sample-feed.zip}}# Example feed: the sample feed of the GTFS reference, a small fictional Demo Transit Authority written by the authors of the specification, about 3 KB. Downloaded unless the folder has it already. Replace "sample-feed.zip" with your own feed.
{{?gtfsFile=sample-feed.zip}}isfile(path) || Downloads.download("https://developers.google.com/static/transit/gtfs/examples/sample-feed.zip", path)

feed = isdir(path) ? path : mktempdir()  # the .txt files of the feed
if !isdir(path)
	archive = ZipReader(read(path))  # a .zip feed, unpacked to a temporary folder
	for name in zip_names(archive)
		endswith(name, ".txt") && write(joinpath(feed, basename(name)), zip_readentry(archive, name))
	end
end
tables = String[]  # one DuckDB table per file, every column as text, as GTFS writes it
for file in sort(readdir(feed))
	endswith(file, ".txt") || continue
	push!(tables, first(splitext(file)))
	DBInterface.execute(con, "CREATE OR REPLACE TABLE \"$(tables[end])\" AS SELECT * FROM read_csv('$(joinpath(feed, file))', header = true, all_varchar = true, delim = ',', quote = '\"', escape = '\"', null_padding = true)")  # GTFS files are comma-separated, quotes doubled inside quoted values
end
DBInterface.execute(con, "CREATE OR REPLACE MACRO seconds(t) AS TRY_CAST(split_part(t, ':', 1) AS INTEGER) * 3600 + TRY_CAST(split_part(t, ':', 2) AS INTEGER) * 60 + TRY_CAST(split_part(t, ':', 3) AS INTEGER)")  # HH:MM:SS as seconds since the start of the service day, past 86400 after midnight
DBInterface.execute(con, "CREATE OR REPLACE TABLE stop_points AS SELECT *, ST_Point(TRY_CAST(stop_lon AS DOUBLE), TRY_CAST(stop_lat AS DOUBLE)) AS geom FROM stops")
DBInterface.execute(con, "CREATE OR REPLACE TABLE times AS SELECT trip_id, stop_id, CAST(stop_sequence AS INTEGER) AS sequence, seconds(arrival_time) AS arrival, seconds(departure_time) AS departure, CAST(stop_sequence AS INTEGER) = max(CAST(stop_sequence AS INTEGER)) OVER (PARTITION BY trip_id) AS last_stop FROM stop_times")
calendars = String[]  # the dates of each service: calendar.txt by weekday between its dates, plus the dates calendar_dates.txt adds
"calendar" in tables && push!(calendars, "SELECT CAST(d AS DATE) AS date, service_id FROM calendar, generate_series(strptime(start_date, '%Y%m%d'), strptime(end_date, '%Y%m%d'), INTERVAL 1 DAY) g(d) WHERE [monday, tuesday, wednesday, thursday, friday, saturday, sunday][isodow(d)] = '1'")
"calendar_dates" in tables && push!(calendars, "SELECT CAST(strptime(date, '%Y%m%d') AS DATE), service_id FROM calendar_dates WHERE exception_type = '1'")
removed = "calendar_dates" in tables ? " EXCEPT SELECT CAST(strptime(date, '%Y%m%d') AS DATE), service_id FROM calendar_dates WHERE exception_type = '2'" : ""  # minus the dates it removes
DBInterface.execute(con, "CREATE OR REPLACE TABLE service_dates AS SELECT * FROM ($(join(calendars, " UNION "))$(removed))")
day = "{{serviceDate}}" == "busiest" ? Tables.columntable(DBInterface.execute(con, "SELECT date FROM service_dates JOIN trips USING (service_id) GROUP BY date ORDER BY count(*) DESC, date LIMIT 1")).date[1] : Date("{{serviceDate}}")
DBInterface.execute(con, "CREATE OR REPLACE TABLE day_trips AS SELECT t.* FROM trips t JOIN service_dates s USING (service_id) WHERE s.date = DATE '$(day)'")  # the trips that run on the service day analysed
n = Tables.columntable(DBInterface.execute(con, "SELECT (SELECT count(*) FROM routes) AS routes, (SELECT count(*) FROM stops) AS stops, (SELECT count(*) FROM trips) AS trips, (SELECT count(*) FROM stop_times) AS times, (SELECT count(*) FROM day_trips) AS today, (SELECT min(date) FROM service_dates) AS first, (SELECT max(date) FROM service_dates) AS last"))
println("GTFS feed with ", n.routes[1], " routes, ", n.stops[1], " stops, ", n.trips[1], " trips and ", n.times[1], " stop times, service from ", n.first[1], " to ", n.last[1], "; ", n.today[1], " trips on ", day, " (", dayname(day), ")")
'''

[[codeBranches]]
model = "osmpbf"
code = '''
using DuckDB, Tables, Downloads

con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the file stays where it is
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files
path = joinpath(folder, "{{pbfFile}}")  # an absolute path is kept as it is
{{?pbfFile=monaco-latest.osm.pbf}}# Example file: Geofabrik's OpenStreetMap extract of Monaco, about 0.7 MB, © OpenStreetMap contributors, under the Open Database License (ODbL). Downloaded unless the folder has it already. Replace "monaco-latest.osm.pbf" with your own extract.
{{?pbfFile=monaco-latest.osm.pbf}}isfile(path) || Downloads.download("https://download.geofabrik.de/europe/monaco-latest.osm.pbf", path)

key = "{{osmKey}}"  # the ways with this tag form the network
DBInterface.execute(con, "CREATE OR REPLACE TABLE ways AS SELECT id, tags, refs FROM ST_ReadOSM('$(path)') WHERE kind = 'way' AND tags['$(key)'] IS NOT NULL")  # first pass over the file: the ways of the network
DBInterface.execute(con, "CREATE OR REPLACE TABLE nodes AS SELECT id, lon, lat FROM ST_ReadOSM('$(path)') WHERE kind = 'node' AND id IN (SELECT UNNEST(refs) FROM ways)")  # second pass: the nodes those ways use
DBInterface.execute(con, """
CREATE OR REPLACE TABLE network AS
WITH points AS (SELECT w.id, UNNEST(w.refs) AS node, generate_subscripts(w.refs, 1) AS i FROM ways w)
SELECT w.id, w.tags['$(key)'] AS class, w.tags['name'] AS name, w.tags, len(w.refs) AS nodes, count(n.id) AS found,
	ST_MakeLine(list(ST_Point(n.lon, n.lat) ORDER BY p.i) FILTER (WHERE n.id IS NOT NULL)) AS geom
FROM ways w JOIN points p ON p.id = w.id LEFT JOIN nodes n ON n.id = p.node
GROUP BY w.id, w.tags, w.refs HAVING count(n.id) >= 2
""")  # each way as a line through its nodes in order; nodes outside the extract are skipped
DBInterface.execute(con, "CREATE OR REPLACE TABLE network_m AS SELECT *, ST_Length_Spheroid(geom) AS metres FROM network")  # lengths in metres on the WGS 84 ellipsoid
n = Tables.columntable(DBInterface.execute(con, "SELECT count(*) AS ways, count(DISTINCT class) AS classes, round(sum(metres) / 1000, 1) AS km FROM network_m"))
println("Network of the ways tagged $(key): ", n.ways[1], " ways in ", n.classes[1], " classes, ", n.km[1], " km")
'''

