[[actionGroups.actions]]
id = "save-stops-gpkg"
label = "Save Stops as GeoPackage"
desc = "The stops, with the departures of the service day, to a GeoPackage next to the feed, for the Geospatial Vector Files panel and any GIS"
models = ["gtfs"]
code = '''
out = replace(path, r"\.zip$" => "") * "-stops.gpkg"
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "COPY (SELECT p.stop_id, p.stop_name, count(x.trip_id) AS departures, p.geom FROM stop_points p LEFT JOIN (SELECT * FROM times WHERE NOT last_stop AND trip_id IN (SELECT trip_id FROM day_trips)) x USING (stop_id) WHERE p.geom IS NOT NULL GROUP BY p.stop_id, p.stop_name, p.geom) TO '$(out)' (FORMAT GDAL, DRIVER 'GPKG', LAYER_NAME 'stops', SRS 'EPSG:4326')")
	println("Wrote ", out)
end
'''

[[actionGroups.actions]]
id = "save-network-gpkg"
label = "Save Network as GeoPackage"
desc = "The network lines with their class, name and length, to a GeoPackage next to the file read, for the Geospatial Vector Files panel and any GIS"
models = ["osmpbf"]
code = '''
out = replace(path, r"\.osm\.pbf$|\.pbf$" => "") * "-$(key).gpkg"
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "COPY (SELECT id AS osm_id, class, name, metres, geom FROM network_m) TO '$(out)' (FORMAT GDAL, DRIVER 'GPKG', LAYER_NAME '$(key)', SRS 'EPSG:4326')")
	println("Wrote ", out)
end
'''

[[actionGroups.actions]]
id = "save-feed-duckdb"
label = "Save Feed as DuckDB Database"
desc = "Every file of the feed as a table, with the stops as points and the service dates, in a DuckDB database next to the feed, for SQL with DuckDB"
models = ["gtfs"]
code = '''
out = replace(path, r"\.zip$" => "") * ".duckdb"
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "ATTACH '$(out)' AS saved")
	foreach(t -> DBInterface.execute(con, "CREATE TABLE saved.\"$(t)\" AS SELECT * FROM \"$(t)\""), [tables; "stop_points"; "service_dates"])
	DBInterface.execute(con, "DETACH saved")
	println("Wrote ", out)
end
'''

[[actionGroups.actions]]
id = "save-network-duckdb"
label = "Save Network as DuckDB Database"
desc = "The ways of the network with all their tags and their lines, in a DuckDB database next to the file read, for SQL with DuckDB"
models = ["osmpbf"]
code = '''
out = replace(path, r"\.osm\.pbf$|\.pbf$" => "") * "-$(key).duckdb"
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "ATTACH '$(out)' AS saved")
	DBInterface.execute(con, "CREATE TABLE saved.network AS SELECT * FROM network_m")
	DBInterface.execute(con, "DETACH saved")
	println("Wrote ", out)
end
'''
