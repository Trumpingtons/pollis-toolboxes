[[actionGroups.actions]]
id = "save-geoparquet"
label = "Save the Estimates as GeoParquet"
desc = "Write the cells, in longitude and latitude, with the estimates, and for kriging their standard deviations, or the mean of the realisations and the probability above the threshold, to kriging.parquet in the folder above"
models = ["ordinary", "universal", "idw", "simulation"]
code = '''
out = joinpath(folder, "kriging.parquet")
{{?model=ordinary|universal}} cells_table("estimate" => estimate, "sd" => sd)
{{?model=idw}} cells_table("estimate" => estimate)
{{?model=simulation}} cells_table("mean" => vec(sum(realisations; dims = 2)) ./ {{realisations}}, "probability" => vec(sum(realisations .> {{threshold}}; dims = 2)) ./ {{realisations}})
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "COPY (SELECT * EXCLUDE (geom), ST_Transform(geom, '{{workCrs}}', 'EPSG:4326') AS geom FROM cells) TO '$(out)' (FORMAT PARQUET)")  # GeoParquet: DuckDB writes the geometry column's metadata
	println("Wrote ", out)
end
