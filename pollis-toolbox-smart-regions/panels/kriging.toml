[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. Choose... picks another. A file given by an absolute path is read where it is. Save the Estimates as GeoParquet writes there."
default = "~/.pollis/data/examples"
folder = "data/examples"

[[inputs]]
id = "file"
label = "File"
tooltip = "The file of the stations, as points: GeoPackage (its first layer), GeoJSON, Shapefile, FlatGeobuf, KML or GPX, in the folder above, or an absolute path. With the default, stations.gpkg, the example first writes 80 air quality stations scattered over a square of 15 km around Coimbra with a simulated annual mean of nitrogen dioxide (no2, in micrograms per cubic metre), unless the folder has a stations.gpkg already."
default = "stations.gpkg"

[[inputs]]
id = "column"
label = "Column"
tooltip = "The numeric column measured at the stations. Stations without a value in it are left out."
default = "no2"

[[inputs]]
id = "fileCrs"
label = "File Coordinate System"
tooltip = "The coordinate system of the file's coordinates, as an EPSG code. The example's stations are in EPSG:3763, PT-TM06/ETRS89. GeoJSON, KML and GPX are always EPSG:4326."
default = "EPSG:3763"

[[inputs]]
id = "workCrs"
label = "Metric Coordinate System"
tooltip = "A projected coordinate system in metres, as an EPSG code, into which the stations are moved before distances are measured: EPSG:3763 for mainland Portugal, EPSG:3035 for Europe as a whole, or the UTM zone of the area. The grid of cells is drawn in it."
default = "EPSG:3763"

[[inputs]]
id = "cell"
label = "Cell Size (m)"
tooltip = "The side of the square cells of the grid over the stations' bounding box, in metres. Halving it makes four times as many cells, and four times the work."
default = "250"

[[inputs]]
id = "variogramModel"
label = "Variogram Model"
tooltip = "The model fitted to the empirical variogram, which the kriging and simulation tabs use: Spherical reaches its sill at the range; Exponential and Gaussian approach it; Matérn has a smoothness parameter between the two."
kind = "select"
default = "SphericalVariogram"
newRow = true

[[inputs.options]]
value = "SphericalVariogram"
label = "Spherical"

[[inputs.options]]
value = "ExponentialVariogram"
label = "Exponential"

[[inputs.options]]
value = "GaussianVariogram"
label = "Gaussian"

[[inputs.options]]
value = "MaternVariogram"
label = "Matérn"

[[inputs]]
id = "nlags"
label = "Lags"
tooltip = "The number of distance classes of the empirical variogram, from 0 to the Maximum Lag."
default = "15"

[[inputs]]
id = "maxlag"
label = "Maximum Lag (m)"
tooltip = "The largest distance between two stations taken into the empirical variogram, in metres: about half the width of the area is usual, as pairs farther apart are few."
default = "8000"

[[inputs]]
id = "estimator"
label = "Estimator"
tooltip = "The estimator of the empirical variogram: Matheron, half the mean squared difference between the values of the pairs of stations in each distance class; Cressie and Hawkins, a robust estimator less sensitive to outlying values."
kind = "select"
default = "matheron"

[[inputs.options]]
value = "matheron"
label = "Matheron"

[[inputs.options]]
value = "cressie"
label = "Cressie and Hawkins"

[[inputs]]
id = "degree"
label = "Trend Degree"
tooltip = "The degree of the polynomial of the coordinates that makes the mean: 1, a plane rising in one direction; 2, a surface that can curve."
default = "1"
models = ["universal"]
newRow = true

[[inputs]]
id = "exponent"
label = "Power"
tooltip = "The power of the distance in the weights, 1 / distance^power: the larger it is, the more the nearest stations count."
default = "2"
models = ["idw"]
newRow = true

[[inputs]]
id = "realisations"
label = "Realisations"
tooltip = "The number of simulated maps. Probabilities are shares of the realisations, so 100 realisations give them to the nearest 0.01."
default = "20"
models = ["simulation"]
newRow = true

[[inputs]]
id = "threshold"
label = "Threshold"
tooltip = "The value, in the units of the column, whose exceedance Probability above a Threshold maps."
default = "35"
models = ["simulation"]

[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables, GeoStats, Random, ECharts

con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the file stays where it is
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files: Choose... picks another
path = joinpath(folder, "{{file}}")  # an absolute path is kept as it is
{{?file=stations.gpkg}} # Example file: 80 air quality stations scattered over a square of 15 km around Coimbra, in EPSG:3763, with a simulated annual mean of nitrogen dioxide in micrograms per cubic metre, written to stations.gpkg unless the folder has one already. Replace "stations.gpkg" with your own file.
{{?file=stations.gpkg}} if !isfile(path)
{{?file=stations.gpkg}} 	rng = Xoshiro(2026)  # a fixed seed: the same stations and values every time
{{?file=stations.gpkg}} 	xy = [(-31000 + round(15000 * rand(rng)), 52000 + round(15000 * rand(rng))) for s in 1:80]  # metres east and north
{{?file=stations.gpkg}} 	field = rand(rng, GaussianProcess(SphericalVariogram(sill = 16.0, range = 3000.0, nugget = 2.0)), PointSet(xy); showprogress = false).field  # variation correlated over 3 km
{{?file=stations.gpkg}} 	rows = ["('S$(lpad(s, 2, '0'))', $(round(30 + 0.6 * (x + 23500) / 1000 + f, digits = 1)), ST_Point($x, $y))" for (s, ((x, y), f)) in enumerate(zip(xy, field))]  # 30 at the centre, rising 0.6 a kilometre to the east
{{?file=stations.gpkg}} 	DBInterface.execute(con, "COPY (SELECT station, no2::DOUBLE AS no2, geom FROM (VALUES $(join(rows, ", "))) t(station, no2, geom)) TO '$(path)' (FORMAT GDAL, DRIVER 'GPKG', LAYER_NAME 'stations', SRS 'EPSG:3763')")
{{?file=stations.gpkg}} end
# The stations, numbered i = 1, 2, ... in the order of the file, in the metric coordinate system; stations without a value are left out
DBInterface.execute(con, "CREATE OR REPLACE TABLE stations AS SELECT row_number() OVER () AS i, * EXCLUDE (geom), ST_Transform(geom, '{{fileCrs}}', '{{workCrs}}') AS geom FROM ST_Read('$(path)') WHERE \"{{column}}\" IS NOT NULL")
DBInterface.execute(con, "ALTER TABLE stations DROP COLUMN IF EXISTS ogc_fid")  # GDAL's own feature number, not a column of the file
s = Tables.columntable(DBInterface.execute(con, "SELECT ST_X(geom) AS x, ST_Y(geom) AS y, \"{{column}}\"::DOUBLE AS z FROM stations ORDER BY i"))
n = length(s.z)
data = georef((; z = s.z), collect(zip(s.x, s.y)))  # GeoStats.jl's geotable: the values z of {{column}} at points, in metres

# The empirical variogram, and the variogram model fitted to it by weighted least squares
g = variogram(data, :z; nlags = {{nlags}}, maxlag = {{maxlag}}, estimator = :{{estimator}})
vario = GeoStatsFunctions.fit({{variogramModel}}, g)
println(vario)

# The grid of square cells over the stations' bounding box: cell k is in column (k - 1) % nx and row (k - 1) ÷ nx, from the south-west
cell = Float64({{cell}})
x0, x1 = extrema(s.x)
y0, y1 = extrema(s.y)
nx, ny = ceil(Int, (x1 - x0) / cell), ceil(Int, (y1 - y0) / cell)
grid = CartesianGrid((x0, y0), (x0 + nx * cell, y0 + ny * cell), (cell, cell))

# The cells as a DuckDB table with columns of values, and GeoJSON files of the cells and stations for the map, in longitude and latitude
function cells_table(columns...)
	rows = map(1:nelements(grid)) do k
		i, j = (k - 1) % nx, (k - 1) ÷ nx
		"($(join((round(last(c)[k], digits = 4) for c in columns), ", ")), ST_MakeEnvelope($(x0 + i * cell), $(y0 + j * cell), $(x0 + (i + 1) * cell), $(y0 + (j + 1) * cell)))"
	end
	names = first.(columns)
	DBInterface.execute(con, "CREATE OR REPLACE TABLE cells AS SELECT $(join(("$(c)::DOUBLE AS $(c)" for c in names), ", ")), geom FROM (VALUES $(join(rows, ", "))) t($(join(names, ", ")), geom)")
end
function cells_geojson(columns...)
	cells_table(columns...)
	file = joinpath(mktempdir(), "cells.geojson")
	DBInterface.execute(con, "COPY (SELECT * EXCLUDE (geom), ST_Transform(geom, '{{workCrs}}', 'EPSG:4326') AS geom FROM cells) TO '$(file)' (FORMAT GDAL, DRIVER 'GeoJSON')")
	return file
end
function stations_layer(; column = nothing)
	file = joinpath(mktempdir(), "stations.geojson")
	DBInterface.execute(con, "COPY (SELECT * EXCLUDE (geom), ST_Transform(geom, '{{workCrs}}', 'EPSG:4326') AS geom FROM stations) TO '$(file)' (FORMAT GDAL, DRIVER 'GeoJSON')")
	return isnothing(column) ? Pollis.layer(file; name = "Stations", color = "#222222") : Pollis.layer(file; name = "{{column}}", column = column)
end

# The empirical variogram, as points, and the model, as a line, drawn with ECharts.jl
function variogram_chart(g, vario)
	h = [ustrip(l) for l in g.abscissas]
	curve = [[d, round(vario(Point(0.0, 0.0), Point(d, 0.0)), digits = 3)] for d in range(0, maximum(h), length = 101)]
	EChart(ec_width = 700, ec_height = 440, title = [ECharts.Title(text = "Variogram of {{column}}: $(nameof(typeof(vario)))")],
		xAxis = [ECharts.Axis(_type = "value", name = "Distance (m)")], yAxis = [ECharts.Axis(_type = "value", name = "Semivariance")],
		series = [ECharts.XYSeries(name = "Empirical", _type = "scatter", data = [[round(h[l], digits = 1), round(g.ordinates[1][l], digits = 3)] for l in eachindex(h) if g.counts[l] > 0]),
			ECharts.XYSeries(name = "Model", _type = "line", data = curve, showSymbol = false)])
end
{{?model=variogram}} display(variogram_chart(g, vario))
{{?model=ordinary}} fitted = GeoStatsModels.fit(Kriging(vario), data)  # ordinary kriging with every station: an unknown constant mean
{{?model=universal}} fitted = GeoStatsModels.fit(Kriging(vario, {{degree}}, 2), data)  # universal kriging with every station: a mean that is a polynomial of degree {{degree}} in x and y
{{?model=idw}} fitted = GeoStatsModels.fit(IDW({{exponent}}), data)  # inverse distance weighting with every station: weights 1 / distance^{{exponent}}
{{?model=ordinary|universal}} predictions = [GeoStatsModels.predictprob(fitted, :z, centroid(grid, k)) for k in 1:nelements(grid)]  # a normal distribution at the centre of every cell
{{?model=ordinary|universal}} estimate, sd = mean.(predictions), std.(predictions)
{{?model=idw}} estimate = [GeoStatsModels.predict(fitted, :z, centroid(grid, k)) for k in 1:nelements(grid)]
{{?model=ordinary|universal|idw}} println("Estimates of {{column}} in ", nelements(grid), " cells of {{cell}} m: from ", round(minimum(estimate), digits = 2), " to ", round(maximum(estimate), digits = 2))
{{?model=ordinary|universal}} layer = Pollis.layer(cells_geojson("estimate" => estimate, "sd" => sd); name = "Estimate of {{column}}", column = "estimate", opacity = 0.7)
{{?model=idw}} layer = Pollis.layer(cells_geojson("estimate" => estimate); name = "Estimate of {{column}}", column = "estimate", opacity = 0.7)
{{?model=ordinary|universal|idw}} display(Pollis.webmap(layer, stations_layer(); title = "{{column}}: Estimates"))  # drawn in the plot pane, on OpenFreeMap's tiles
{{?model=simulation}} sims = rand(Xoshiro(2026), GaussianProcess(vario, sum(s.z) / n), grid, {{realisations}}; data, showprogress = false)  # conditional: every realisation honours the stations' values
{{?model=simulation}} realisations = reduce(hcat, [sims[r].z for r in 1:{{realisations}}])  # one row per cell, one column per realisation
{{?model=simulation}} println({{realisations}}, " realisations of {{column}} in ", nelements(grid), " cells of {{cell}} m: from ", round(minimum(realisations), digits = 2), " to ", round(maximum(realisations), digits = 2))
{{?model=simulation}} display(Pollis.webmap(Pollis.layer(cells_geojson("realisation" => realisations[:, 1]); name = "Realisation 1", column = "realisation", opacity = 0.7), stations_layer(); title = "{{column}}: Realisation 1"))
'''

# Next Steps action groups
