[[faq]]
question = "What do the nugget, the sill and the range of a variogram mean?"
answer = '''
The nugget is the semivariance at distances near zero: measurement error, and variation at distances shorter than those between the nearest stations. The sill is the semivariance at which the variogram levels off, the variance of values far apart. The range is the distance at which it levels off: stations farther apart than the range are uncorrelated.

Nugget, Sill and Range prints the three for the model fitted, with the ratio of the nugget to the sill.
'''
wiki = "Variograms"

[[faq]]
question = "What is the difference between ordinary and universal kriging?"
answer = '''
Ordinary kriging assumes that the mean of the value is constant but unknown over the area. Universal kriging lets the mean change across the area as a polynomial of the coordinates, a trend, whose coefficients are estimated with the weights.

Universal kriging suits values with a steady rise or fall across the map, such as pollution that grows towards a city centre or a motorway.
'''
wiki = "Kriging Systems"

[[faq]]
question = "What does the kriging standard deviation tell me?"
answer = '''
The kriging standard deviation measures the uncertainty of each estimate, given the variogram: it is small near stations and grows with the distance to them, up to about the square root of the sill.

It depends on where the stations are, not on the values measured there, so it shows where more stations would help, not where the values are uncertain because they vary more.
'''
wiki = "Ordinary Kriging"

[[faq]]
question = "When should I use Gaussian simulation instead of kriging?"
answer = '''
Kriging gives the best estimate at each cell, and its map is smoother than the values themselves. Gaussian simulation gives many maps, realisations, each with the variability of the data and each honouring the station values.

Use simulation when the question is about the variability or about many cells at once: the probability that a cell exceeds a threshold, or the area above it.
'''
wiki = "Gaussian Simulation"

[[faq]]
question = "Why does the variogram keep rising without levelling off?"
answer = '''
A variogram that keeps rising up to the largest lag usually means a trend: the mean of the value changes across the area, so values far apart differ more and more. A variogram model with a sill then fits badly.

Universal kriging models the trend. A shorter Maximum Lag, or a larger study area, may also show whether a sill is reached.
'''
wiki = "Variograms"
hidden = true

[[faq]]
question = "How does inverse distance weighting differ from kriging?"
answer = '''
Inverse distance weighting gives each station a weight proportional to one over its distance to the cell, raised to a power, without a model of spatial correlation. It is simple and needs no variogram, but gives no measure of uncertainty and ignores clusters of stations.

Kriging chooses the weights from the variogram, accounts for stations that cluster together, and gives a standard deviation with each estimate.
'''
wiki = "Inverse Distance Weighting"
hidden = true

[[faq]]
question = "How do I know whether the variogram model is good?"
answer = '''
Leave-one-out cross-validation leaves out each station in turn, estimates its value from the others, and compares the estimate with the value measured. A smaller root mean squared error is better, and the standardised errors should have a mean near 0 and a variance near 1.

Variogram Models Compared does this for four models, and Kriging and Inverse Distance for five methods.
'''
wiki = "Cross-Validation"
hidden = true

[[faq]]
question = "Why must the coordinates be in metres?"
answer = '''
Distances between stations are computed from their coordinates, so a coordinate system in degrees of longitude and latitude would give distances in degrees, which do not have the same length east to west as north to south.

The stations are moved into the Metric Coordinate System, a projected system in metres such as EPSG:3763 for mainland Portugal, before the variogram is computed.
'''
wiki = "Factsheet"
hidden = true

[[faq]]
question = "Can kriging weights be negative?"
answer = '''
Yes. A station hidden behind a nearer station, as seen from the cell, can get a small negative weight: the nearer station screens it.

Negative weights can give estimates outside the range of the data. Kriging Weights of the Nearest Stations prints the weights of the stations around the centre of the map.
'''
wiki = "Kriging Systems"
hidden = true

