desc = "The cells coloured by the kriging standard deviation of their estimate: small near the stations, larger away from them"
models = ["ordinary", "universal"]
code = '''
display(Pollis.webmap(Pollis.layer(cells_geojson("sd" => sd, "estimate" => estimate); name = "Standard deviation", column = "sd", opacity = 0.7), stations_layer(); title = "{{column}}: Kriging Standard Deviation"))
'''

[[actionGroups.actions]]
id = "map-ensemble"
label = "Map of the Mean of the Realisations"
desc = "The cells coloured by the mean of the realisations, with their standard deviation when an area is clicked"
models = ["simulation"]
code = '''
average = vec(sum(realisations; dims = 2)) ./ {{realisations}}
spread = sqrt.(vec(sum((realisations .- average) .^ 2; dims = 2)) ./ ({{realisations}} - 1))
display(Pollis.webmap(Pollis.layer(cells_geojson("mean" => average, "sd" => spread); name = "Mean of the realisations", column = "mean", opacity = 0.7), stations_layer(); title = "{{column}}: Mean of {{realisations}} Realisations"))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "directional"
label = "Directional Variograms"
desc = "The empirical variogram of the pairs of stations lying west to east, and of those lying south to north: different ones show anisotropy"
code = '''
band = {{maxlag}} / 8  # the pairs within this distance of the direction's line, in metres
lines = [name => variogram(data, :z; dir, dirtol = band, nlags = {{nlags}}, maxlag = {{maxlag}}, estimator = :{{estimator}}) for (name, dir) in ("West to East" => (1.0, 0.0), "South to North" => (0.0, 1.0))]
EChart(ec_width = 700, ec_height = 440, title = [ECharts.Title(text = "Directional Variograms of {{column}}")],
	xAxis = [ECharts.Axis(_type = "value", name = "Distance (m)")], yAxis = [ECharts.Axis(_type = "value", name = "Semivariance")],
	series = [ECharts.XYSeries(name = name, _type = "line", data = [[round(ustrip(d.abscissas[l]), digits = 1), round(d.ordinates[1][l], digits = 3)] for l in eachindex(d.counts) if d.counts[l] > 0]) for (name, d) in lines])
'''

[[actionGroups.actions]]
id = "leave-one-out"
label = "Leave-One-Out Cross-Validation"
desc = "Each station left out in turn and estimated from the others: the mean error, the root mean squared error, the largest errors, and for kriging the standardised errors"
models = ["variogram", "ordinary", "universal", "idw"]
code = '''
{{?model=variogram|ordinary}} model = Kriging(vario)
{{?model=universal}} model = Kriging(vario, {{degree}}, 2)
{{?model=idw}} model = IDW({{exponent}})
errors, standardised = zeros(n), zeros(n)
for i in 1:n
	others = GeoStatsModels.fit(model, data[setdiff(1:n, [i]), :])
	p = Point(s.x[i], s.y[i])
	if model isa IDW
		errors[i] = GeoStatsModels.predict(others, :z, p) - s.z[i]
	else
		d = GeoStatsModels.predictprob(others, :z, p)
		errors[i] = mean(d) - s.z[i]
		standardised[i] = errors[i] / std(d)
	end
end
println("Leave-one-out over ", n, " stations: mean error ", round(sum(errors) / n, digits = 3), ", root mean squared error ", round(sqrt(sum(errors .^ 2) / n), digits = 3))
model isa IDW || println("Standardised errors: mean ", round(sum(standardised) / n, digits = 3), " (near 0 is unbiased), mean square ", round(sum(standardised .^ 2) / n, digits = 3), " (near 1 when the kriging standard deviation is right)")
println("Largest errors: ", join(("station $(i): $(round(errors[i], digits = 2))" for i in sortperm(abs.(errors), rev = true)[1:3]), ", "))
'''

[[actionGroups]]
id = "predict"
label = "Predict"

[[actionGroups.actions]]
id = "estimate-at"
label = "Estimate at a Location"
desc = "The estimate at one location, the centre of the stations' bounding box, and for kriging its standard deviation and 95% interval"
models = ["ordinary", "universal", "idw"]
code = '''
p = Point((x0 + x1) / 2, (y0 + y1) / 2)  # x and y in {{workCrs}}, in metres: put your own location here
{{?model=ordinary|universal}} d = GeoStatsModels.predictprob(fitted, :z, p)
{{?model=ordinary|universal}} println("Estimate ", round(mean(d), digits = 2), ", standard deviation ", round(std(d), digits = 2), ", 95% interval ", round(mean(d) - 1.96 * std(d), digits = 2), " to ", round(mean(d) + 1.96 * std(d), digits = 2))
{{?model=idw}} println("Estimate ", round(GeoStatsModels.predict(fitted, :z, p), digits = 2))
'''

[[actionGroups.actions]]
id = "exceedance"
label = "Probability above a Threshold"
desc = "The cells coloured by the share of the realisations in which they exceed the threshold"
models = ["simulation"]
code = '''
probability = vec(sum(realisations .> {{threshold}}; dims = 2)) ./ {{realisations}}
println("Cells above {{threshold}} in at least half the realisations: ", count(>=(0.5), probability), " of ", nelements(grid))
display(Pollis.webmap(Pollis.layer(cells_geojson("probability" => probability); name = "Probability above {{threshold}}", column = "probability", opacity = 0.7), stations_layer(); title = "{{column}}: Probability above {{threshold}}"))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "variogram-models"
label = "Variogram Models Compared"
desc = "The spherical, exponential, Gaussian and Matérn models fitted to the same empirical variogram: their range, sill and nugget, and the leave-one-out error of ordinary kriging with each"
code = '''
println(rpad("model", 22), rpad("range (m)", 12), rpad("sill", 10), rpad("nugget", 10), "leave-one-out RMSE")
for V in (SphericalVariogram, ExponentialVariogram, GaussianVariogram, MaternVariogram)
	v = GeoStatsFunctions.fit(V, g)
	rmse = sqrt(cverror(Kriging(v), data, LeaveOneOut())[:z])  # cverror gives the mean squared error
	println(rpad(nameof(V), 22), rpad(round(Int, ustrip(range(v))), 12), rpad(round(sill(v), digits = 3), 10), rpad(round(nugget(v), digits = 3), 10), round(rmse, digits = 3))
end
'''

[[actionGroups.actions]]
id = "methods-compared"
label = "Kriging and Inverse Distance"
desc = "The leave-one-out error of ordinary kriging, universal kriging with a trend of degree 1, and inverse distance weighting with powers 1, 2 and 3"
code = '''
methods = ["Ordinary kriging" => Kriging(vario), "Universal kriging, degree 1" => Kriging(vario, 1, 2), "Inverse distance, power 1" => IDW(1), "Inverse distance, power 2" => IDW(2), "Inverse distance, power 3" => IDW(3)]
println(rpad("method", 30), "leave-one-out RMSE")
for (name, m) in methods
	println(rpad(name, 30), round(sqrt(cverror(m, data, LeaveOneOut())[:z]), digits = 3))
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "nugget-sill-range"
label = "Nugget, Sill and Range"
desc = "The three parameters of the variogram model, the ratio of the nugget to the sill, and the variance of the values at the stations"
code = '''
average = sum(s.z) / n
println("Nugget ", round(nugget(vario), digits = 3), ": the semivariance near distance 0, measurement error and variation closer than the nearest stations")
println("Sill ", round(sill(vario), digits = 3), ": the semivariance of stations far apart; the variance of {{column}} at the stations is ", round(sum((s.z .- average) .^ 2) / (n - 1), digits = 3))
println("Range ", round(Int, ustrip(range(vario))), " m: stations farther apart than this are uncorrelated")
println("Nugget to sill ", round(nugget(vario) / sill(vario), digits = 3), ": the share of the variance that is not spatially correlated at the distances between stations")
'''

[[actionGroups.actions]]
id = "kriging-weights"
label = "Kriging Weights of the Nearest Stations"
desc = "The weights of the eight stations with the largest weights in the estimate at the centre of the stations' bounding box, with their distances, and the sum of all weights"
models = ["ordinary", "universal"]
code = '''
xc, yc = (x0 + x1) / 2, (y0 + y1) / 2
w = vec(getfield(GeoStatsModels.weights(fitted, Point(xc, yc)), 1))  # the kriging weights, one per station in the order i; the second field holds the Lagrange multipliers
distance = sqrt.((s.x .- xc) .^ 2 .+ (s.y .- yc) .^ 2)
println(rpad("station i", 12), rpad("distance (m)", 14), "weight")
for i in sortperm(abs.(w), rev = true)[1:min(8, n)]
	println(rpad(i, 12), rpad(round(Int, distance[i]), 14), round(w[i], digits = 4))
end
println("Sum of the weights ", round(sum(w), digits = 4), "; negative weights: ", count(<(0), w), " of ", n)
'''

