[[faq]]
question = "What do I need to use the panel?"
answer = '''
An OpenTopography API key, free from myOpenTopo on the OpenTopography portal, for Global DEM and USGS 3DEP; it is set with the key on the Powered by line. Find Datasets searches the catalogue without a key.
'''
wiki = "Authentication"

[[faq]]
question = "Which global elevation model should I choose?"
answer = '''
The Copernicus DEM at 30 m is the default: a surface model from the TanDEM-X mission, with buildings and vegetation. SRTM and NASADEM come from the radar mission of February 2000, ALOS World 3D from optical stereo images, and GEDTM30 and the EU DTM estimate the bare ground. SRTM15+ and GEBCO also cover the sea floor, at about 500 m.
'''
wiki = "Decision Guide"

[[faq]]
question = "Why does USGS 3DEP return no data?"
answer = '''
The 3D Elevation Program covers the United States only: for an area elsewhere, OpenTopography answers with no content, and the tab stops with a message. Its 1 m data are open to academic users only.
'''
wiki = "USGS 3D Elevation Program"

[[faq]]
question = "How large an area can I download?"
answer = '''
OpenTopography limits each request by area: 450,000 km² for most global models, 4,050,000 km² for the 90 m models, 125,000,000 km² for SRTM15+ and GEBCO; 225,000 km² for 3DEP at 30 m, 25,000 km² at 10 m and 250 km² at 1 m. The tabs stop before the request when the Area is larger.
'''
wiki = "Diagnostics"
hidden = true

[[faq]]
question = "Does Find Datasets download point clouds?"
answer = '''
No: Find Datasets lists the point cloud and raster datasets over the Area, with their dates, sources and outlines, and the datasets of other catalogues, such as the USGS 3D Elevation Program and NOAA, with their identifiers. The catalogue does not give their files; LAS and LAZ files downloaded elsewhere are read with the Point Cloud Files panel.
'''
wiki = "The OpenTopography Catalogue"
hidden = true

[[faq]]
question = "What is the difference between a surface model and a terrain model?"
answer = '''
A digital surface model gives the height of the surface that the instrument sees, with buildings and the canopy of forests; a digital terrain model gives the height of the bare ground. The Copernicus DEM is a surface model; GEDTM30 and the EU DTM are terrain models.
'''
wiki = "The Global Elevation Models"
hidden = true

