label = "Sources Side by Side"
desc = "The datasets of each source, OpenTopography, the USGS 3D Elevation Program and NOAA, and of each format: how many, and their first and last dates"
models = ["find"]
code = '''
p = query("SELECT source, format, count(*) AS n, min(first_day) AS t0, max(coalesce(last_day, first_day)) AS t1 FROM datasets GROUP BY ALL ORDER BY source, format")
println(rpad("source", 16), rpad("format", 13), rpad("datasets", 10), "first and last")
for i in eachindex(p.n)
	println(rpad(p.source[i], 16), rpad(p.format[i], 13), rpad(p.n[i], 10), coalesce(string(p.t0[i]), ""), " to ", coalesce(string(p.t1[i]), ""))
end
'''

[[actionGroups.actions]]
id = "two-models"
label = "Two Models Side by Side"
desc = "The elevation downloaded beside the global model chosen in Compare With, over the same area: the second is downloaded, resampled to the cells of the first, and their difference summarised by quantiles, its mean and root mean square, and their correlation; the difference is left in the variable difference"
models = ["globaldem", "usgsdem"]
code = '''
using Statistics

other_model = "{{otherModel}}"
other, other_path = elevation_of("globaldem", "demtype", other_model, 4.5e5)
on_same_cells = resample(Raster(other; missingval = missing); to = elevation, method = :bilinear)  # the second model on the cells of the first
difference = map((a, b) -> ismissing(a) || ismissing(b) ? missing : a - b, elevation, on_same_cells)
both = [(a, b) for (a, b) in zip(elevation, on_same_cells) if !ismissing(a) && !ismissing(b)]
d = collect(skipmissing(difference))
println(model, " minus ", other_model, " over ", length(d), " cells, in metres:")
println("  quantiles 5, 25, 50, 75, 95%: ", join(round.(quantile(d, [0.05, 0.25, 0.5, 0.75, 0.95]); digits = 2), ", "))
println("  mean ", round(mean(d); digits = 2), ", root mean square ", round(sqrt(mean(abs2, d)); digits = 2), ", correlation ", round(cor(first.(both), last.(both)); digits = 4))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "elevation-summary"
label = "Elevation Summary"
desc = "The quantiles of the elevation over the area, its range, and where its highest and lowest cells are"
models = ["globaldem", "usgsdem"]
code = '''
using Statistics

v = collect(skipmissing(elevation))
println("Elevation of ", model, " over ", length(v), " cells: quantiles 5, 25, 50, 75, 95%: ", join(round.(quantile(v, [0.05, 0.25, 0.5, 0.75, 0.95]); digits = 1), ", "), " m")
for (label, f) in (("Highest", argmax), ("Lowest", argmin))
	idx = f(map(x -> ismissing(x) ? (label == "Highest" ? -Inf32 : Inf32) : x, elevation))
	println(label, ": ", elevation[idx], " m at longitude ", round(lookup(elevation, X)[idx[1]]; digits = 5), ", latitude ", round(lookup(elevation, Y)[idx[2]]; digits = 5))
end
'''

[[actionGroups.actions]]
id = "area-by-elevation"
label = "Area by Elevation"
desc = "The share of the cells of the area in each of ten bands of elevation of equal height, from the lowest cell to the highest"
models = ["globaldem", "usgsdem"]
code = '''
v = collect(skipmissing(elevation))
lo, hi = extrema(v)
band_height = (hi - lo) / 10
println("Share of the ", length(v), " cells of ", model, " in each band of ", round(band_height; digits = 1), " m:")
for b in 1:10
	n = count(x -> (b == 1 ? x >= lo : x > lo + (b - 1) * band_height) && x <= lo + b * band_height, v)
	println(lpad(round(lo + (b - 1) * band_height; digits = 1), 9), " to ", rpad(round(lo + b * band_height; digits = 1), 9), lpad(round(100 * n / length(v); digits = 1), 6), "%  ", repeat("#", round(Int, 50 * n / length(v))))
end
'''

