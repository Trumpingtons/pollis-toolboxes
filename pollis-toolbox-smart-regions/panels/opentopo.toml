[[codeBranches]]
model = "find"
code = '''
using DuckDB, Tables, Downloads

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))  # where the Next Steps save their files
west, south, east, north = parse.(Float64, split("{{area}}", ","))  # the area, in degrees of longitude and latitude
area = "ST_MakeEnvelope($(west), $(south), $(east), $(north))"
product = "{{product}}"
params = ["minx" => west, "miny" => south, "maxx" => east, "maxy" => north, "detail" => true, "outputFormat" => "json", "include_federated" => {{federated}}]
product == "all" || push!(params, "productFormat" => product)
found = Downloads.download("https://portal.opentopography.org/API/otCatalog?" * join(["$(k)=$(v)" for (k, v) in params], "&"), tempname() * ".json")  # the catalogue needs no key
DBInterface.execute(con, """
CREATE OR REPLACE TABLE datasets AS
SELECT d->>'name' AS name, d->'identifier'->>'value' AS id,
	CASE d->'identifier'->>'propertyID' WHEN 'opentopoID' THEN 'OpenTopography' WHEN 'USGS_3DEP_ID' THEN 'USGS 3DEP' WHEN 'NOAAID' THEN 'NOAA' ELSE d->'identifier'->>'propertyID' END AS source,
	CASE WHEN d->>'fileFormat' ILIKE 'point%' THEN 'Point cloud' ELSE 'Raster' END AS format, d->>'alternateName' AS short_name,
	TRY_CAST(split_part(d->>'temporalCoverage', ' / ', 1) AS DATE) AS first_day, TRY_CAST(nullif(split_part(d->>'temporalCoverage', ' / ', 2), '') AS DATE) AS last_day,
	d->>'url' AS doi, ST_GeomFromGeoJSON(d->'spatialCoverage'->'geo'->'geojson'->'features'->0->'geometry') AS geom
FROM (SELECT x->'Dataset' AS d FROM (SELECT unnest(CAST(coalesce(json_extract(content, '/Datasets'), '[]') AS JSON[])) AS x FROM read_text('$(found)')))
""")  # one row per dataset: its name, identifier, source, format, dates, DOI and outline
DBInterface.execute(con, "ALTER TABLE datasets ADD COLUMN covered DOUBLE")
DBInterface.execute(con, "UPDATE datasets SET covered = round(100 * ST_Area(ST_Intersection(ST_MakeValid(geom), $(area))) / ST_Area($(area)), 1)")  # the share of the area each dataset covers, in per cent
s = query("SELECT name, source, format, first_day, covered FROM datasets ORDER BY format, first_day DESC NULLS LAST")
isempty(s.name) && error("The catalogue of OpenTopography has no dataset over the area: widen the area, or include the other catalogues")
println(length(s.name), " datasets over the area, the most recent first:")
for i in eachindex(s.name)
	println(rpad(s.format[i], 13), rpad(s.source[i], 16), rpad(coalesce(string(s.first_day[i]), ""), 12), lpad("$(s.covered[i])%", 7), "  ", s.name[i])
end
'''

[[codeBranches]]
model = "globaldem"
code = '''
using DuckDB, Tables, Downloads, Rasters, ArchGDAL

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))  # where the elevation is kept once downloaded, and the Next Steps save theirs
west, south, east, north = parse.(Float64, split("{{area}}", ","))  # the area, in degrees of longitude and latitude
km2 = 6371.0088^2 * deg2rad(east - west) * (sind(north) - sind(south))  # the size of the area, in square kilometres
function ot_download(endpoint, params, path)  # one request of the OpenTopography API, written to path; stops with the API's message
	haskey(ENV, "OPENTOPOGRAPHY_API_KEY") || error("Set your OpenTopography API key with the key on the Powered by line, or set ENV[\"OPENTOPOGRAPHY_API_KEY\"]: see the Authentication wiki")
	url = "https://portal.opentopography.org/API/$(endpoint)?" * join(["$(k)=$(v)" for (k, v) in [params; "outputFormat" => "GTiff"; "API_Key" => ENV["OPENTOPOGRAPHY_API_KEY"]]], "&")
	part = path * ".part"
	r = open(io -> Downloads.request(url; output = io, throw = false), part, "w")
	r isa Downloads.Response || (rm(part; force = true); error("OpenTopography could not be reached: $(r.message)"))
	if r.status != 200
		answer = read(part, String)
		rm(part; force = true)
		r.status == 204 && error("OpenTopography has no data of $(endpoint) over the area")
		m = match(r"<error>(.*?)</error>"s, answer)
		error("OpenTopography answered HTTP $(r.status): $(m === nothing ? first(answer, 300) : strip(m[1]))")
	end
	return mv(part, path; force = true)
end
function elevation_of(endpoint, kind, model, limit)  # the elevation of the area from a model, downloaded once into its folder
	km2 > limit && error("The area is $(round(Int, km2)) km², more than the $(round(Int, limit)) km² OpenTopography serves of $(model): make it smaller")
	dir = mkpath(joinpath(folder, "opentopography", model))
	path = joinpath(dir, "$(model)_$(west)_$(south)_$(east)_$(north).tif")  # one file for each model and area
	isfile(path) || ot_download(endpoint, [kind => model, "south" => south, "north" => north, "west" => west, "east" => east], path)
	return map(v -> ismissing(v) ? missing : Float32(v), read(Raster(path; lazy = true))), path
end
limits = Dict("SRTMGL3" => 4.05e6, "COP90" => 4.05e6, "SRTM15Plus" => 1.25e8, "GEBCOIceTopo" => 1.25e8)  # the largest areas OpenTopography serves, in km²; 450,000 for the other models
model = "{{demtype}}"
elevation, path = elevation_of("globaldem", "demtype", model, get(limits, model, 4.5e5))
crs = ArchGDAL.read(ArchGDAL.getproj, path)  # the coordinate system of the file
place = dirname(path)  # the folder of the model, which the Next Steps write to
println(model, ": ", size(elevation, X), " x ", size(elevation, Y), " cells, ", count(ismissing, elevation), " without data; elevation from ", minimum(skipmissing(elevation)), " to ", maximum(skipmissing(elevation)), " m, from ", path)
'''

[[codeBranches]]
model = "usgsdem"
code = '''
using DuckDB, Tables, Downloads, Rasters, ArchGDAL

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))  # where the elevation is kept once downloaded, and the Next Steps save theirs
west, south, east, north = parse.(Float64, split("{{area}}", ","))  # the area, in degrees of longitude and latitude
km2 = 6371.0088^2 * deg2rad(east - west) * (sind(north) - sind(south))  # the size of the area, in square kilometres
function ot_download(endpoint, params, path)  # one request of the OpenTopography API, written to path; stops with the API's message
	haskey(ENV, "OPENTOPOGRAPHY_API_KEY") || error("Set your OpenTopography API key with the key on the Powered by line, or set ENV[\"OPENTOPOGRAPHY_API_KEY\"]: see the Authentication wiki")
	url = "https://portal.opentopography.org/API/$(endpoint)?" * join(["$(k)=$(v)" for (k, v) in [params; "outputFormat" => "GTiff"; "API_Key" => ENV["OPENTOPOGRAPHY_API_KEY"]]], "&")
	part = path * ".part"
	r = open(io -> Downloads.request(url; output = io, throw = false), part, "w")
	r isa Downloads.Response || (rm(part; force = true); error("OpenTopography could not be reached: $(r.message)"))
	if r.status != 200
		answer = read(part, String)
		rm(part; force = true)
		r.status == 204 && error(endpoint == "usgsdem" ? "USGS 3DEP has no data over the area: it covers the United States" : "OpenTopography has no data of $(endpoint) over the area")
		m = match(r"<error>(.*?)</error>"s, answer)
		error("OpenTopography answered HTTP $(r.status): $(m === nothing ? first(answer, 300) : strip(m[1]))")
	end
	return mv(part, path; force = true)
end
function elevation_of(endpoint, kind, model, limit)  # the elevation of the area from a model, downloaded once into its folder
	km2 > limit && error("The area is $(round(Int, km2)) km², more than the $(round(Int, limit)) km² OpenTopography serves of $(model): make it smaller")
	dir = mkpath(joinpath(folder, "opentopography", model))
	path = joinpath(dir, "$(model)_$(west)_$(south)_$(east)_$(north).tif")  # one file for each model and area
	isfile(path) || ot_download(endpoint, [kind => model, "south" => south, "north" => north, "west" => west, "east" => east], path)
	return map(v -> ismissing(v) ? missing : Float32(v), read(Raster(path; lazy = true))), path
end
limits = Dict("USGS30m" => 2.25e5, "USGS10m" => 2.5e4, "USGS1m" => 250.0)  # the largest areas OpenTopography serves of each resolution, in km²
model = "{{resolution}}"
elevation, path = elevation_of("usgsdem", "datasetName", model, limits[model])
crs = ArchGDAL.read(ArchGDAL.getproj, path)  # the coordinate system of the file, NAD83 for 3DEP
place = dirname(path)  # the folder of the resolution, which the Next Steps write to
println(model, ": ", size(elevation, X), " x ", size(elevation, Y), " cells, ", count(ismissing, elevation), " without data; elevation from ", minimum(skipmissing(elevation)), " to ", maximum(skipmissing(elevation)), " m, from ", path)
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "dataset-outlines"
label = "Dataset Outlines on a Map"
desc = "The outline of each survey found, coloured by its source, with the area, on an OpenStreetMap base map in Pollis's map view; the global models, whose outlines cover the Earth, are left out"
models = ["find"]
code = '''
shown, box = joinpath(mktempdir(), "datasets.geojson"), joinpath(mktempdir(), "area.geojson")
DBInterface.execute(con, "COPY (SELECT name, source, format, CAST(first_day AS VARCHAR) AS first_day, geom FROM datasets WHERE ST_Area(geom) < 1000) TO '$(shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")  # less than 1,000 square degrees: the surveys, not the global models
DBInterface.execute(con, "COPY (SELECT 'Area' AS name, $(area) AS geom) TO '$(box)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(shown; name = "Datasets", column = "source", opacity = 0.15), Pollis.layer(box; name = "Area", color = "#e15759", opacity = 0.3); title = "Datasets over the Area"))
'''

[[actionGroups.actions]]
id = "datasets-over-time"
label = "Datasets over Time"
desc = "When each dataset was collected, from its first to its last day, one row per dataset, coloured by its format, drawn with ECharts"
models = ["find"]
code = '''
using ECharts

t = query("SELECT name, format, CAST(first_day AS VARCHAR) AS t0, CAST(coalesce(last_day, first_day) AS VARCHAR) AS t1 FROM datasets WHERE first_day IS NOT NULL ORDER BY first_day")
EChart(ec_width = 760, ec_height = 120 + 22 * length(t.name), title = [ECharts.Title(text = "Datasets over the Area")], tooltip = ECharts.Tooltip(),
	legend = ECharts.Legend(), xAxis = [ECharts.Axis(_type = "time", name = "Date", axisLabel = ECharts.AxisLabel(formatter = "{yyyy}"))], yAxis = [ECharts.Axis(_type = "category", data = first.(t.name, 40), axisLabel = ECharts.AxisLabel(fontSize = 10))],
	grid = [ECharts.Grid(left = 260)],
	series = [ECharts.XYSeries(name = f, _type = "line", showSymbol = true, lineStyle = ECharts.LineStyle(width = 6), data = reduce(vcat, [[[t.t0[i], i - 1], [t.t1[i], i - 1], "-"] for i in eachindex(t.name) if t.format[i] == f]; init = Any[])) for f in unique(t.format)])  # "-" breaks the line between datasets
'''

[[actionGroups.actions]]
id = "elevation-map"
label = "Show the Elevation on a Map"
desc = "The elevation, cells coloured by value, on an OpenStreetMap base map in Pollis's map view, at most 80 cells a side (larger areas averaged over blocks of cells); click a cell for its value"
models = ["globaldem", "usgsdem"]
code = '''
using Statistics

f = max(1, cld(max(size(elevation, X), size(elevation, Y)), 80))  # at most 80 cells a side
small = permutedims(f > 1 ? Rasters.aggregate(mean, Raster(elevation; missingval = missing), f; skipmissingval = true) : elevation, (X, Y))
edges(d) = [(min(lo, hi), max(lo, hi)) for (lo, hi) in Rasters.intervalbounds(small, d)]  # each cell's two edges
xe, ye = edges(X), edges(Y)
rows = ["($(round(Float64(small[i, j]), digits = 2)), $(xe[i][1]), $(ye[j][1]), $(xe[i][2]), $(ye[j][2]))" for i in axes(small, 1), j in axes(small, 2) if !ismissing(small[i, j])]
shown = joinpath(mktempdir(), "cells.geojson")
DBInterface.execute(con, "COPY (SELECT value, ST_Transform(ST_MakeEnvelope(x0, y0, x1, y1), ?, 'EPSG:4326') AS geom FROM (VALUES $(join(rows, ", "))) t(value, x0, y0, x1, y1)) TO '$(shown)' (FORMAT GDAL, DRIVER 'GeoJSON')", [crs])
display(Pollis.webmap(Pollis.layer(shown; name = "Elevation of $(model) (m)", column = "value", opacity = 0.7)))
'''

[[actionGroups.actions]]
id = "elevation-plot"
label = "Plot the Elevation"
desc = "The elevation as a heat map drawn with ECharts, north up, at most 200 cells a side (larger areas averaged over blocks of cells)"
models = ["globaldem", "usgsdem"]
code = '''
using ECharts, Statistics

f = max(1, cld(max(size(elevation, X), size(elevation, Y)), 200))  # at most 200 cells a side
small = permutedims(f > 1 ? Rasters.aggregate(mean, Raster(elevation; missingval = missing), f; skipmissingval = true) : elevation, (X, Y))
north_first = first(lookup(small, Y)) > last(lookup(small, Y))
nx, ny = size(small)
cells = [[i - 1, (north_first ? ny - j : j - 1), round(Float64(small[i, j]), digits = 2)] for i in 1:nx, j in 1:ny if !ismissing(small[i, j])]  # column, row from the south, value
lo, hi = extrema(skipmissing(small))
EChart(ec_width = 760, ec_height = round(Int, 60 + 680 * ny / nx), title = [ECharts.Title(text = "Elevation of $(model) (m)")], tooltip = ECharts.Tooltip(),
	xAxis = [ECharts.Axis(_type = "category", data = string.(round.(lookup(small, X); digits = 4)), name = "Longitude")],
	yAxis = [ECharts.Axis(_type = "category", data = string.(round.(north_first ? reverse(lookup(small, Y)) : lookup(small, Y); digits = 4)), name = "Latitude")],
	visualMap = ECharts.VisualMap(min = lo, max = hi, calculable = true, orient = "vertical", right = "1%", top = "middle", inRange = Dict("color" => ["#313695", "#74add1", "#ffffbf", "#f46d43", "#a50026"])),
	series = [ECharts.HeatmapSeries(name = "Elevation", data = cells)])
'''

