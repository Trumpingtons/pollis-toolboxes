label = "Save as Cloud-Optimised GeoTIFF"
desc = "Write the elevation of the area as a Cloud-Optimised GeoTIFF in the folder of the model, tiled, with overviews and DEFLATE compression"
models = ["globaldem", "usgsdem"]
code = '''
out = joinpath(place, "$(model)-area-cog.tif")
write(out, Raster(map(v -> ismissing(v) ? -9999f0 : v, elevation); missingval = -9999f0); driver = "COG", options = Dict("COMPRESS" => "DEFLATE"), force = true)
println("Wrote ", out)
'''

