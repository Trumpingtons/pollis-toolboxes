if !isempty(gone)
	xs, ys = lookup(elevation, X)[[I[1] for I in gone]], lookup(elevation, Y)[[I[2] for I in gone]]
	println("  between longitudes ", round(minimum(xs); digits = 4), " and ", round(maximum(xs); digits = 4), ", latitudes ", round(minimum(ys); digits = 4), " and ", round(maximum(ys); digits = 4))
end
gx, gy = extrema(lookup(elevation, X)), extrema(lookup(elevation, Y))
println("The grid spans longitudes ", round.(gx; digits = 4), " and latitudes ", round.(gy; digits = 4), "; the area ", (west, east), " and ", (south, north))
