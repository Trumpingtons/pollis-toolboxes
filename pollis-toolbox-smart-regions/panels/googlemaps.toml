# Google Maps: Google's road, satellite and terrain maps of a place, drawn by the Maps JavaScript API on a page of
# their own in Pollis's browser, with a Maps Demo Key; Sydney Harbour and Midtown Manhattan as example places

[meta]
title = "Google Maps"
viewType = "pollis.googlemaps"
defaultModel = "roadmap"
decisionFirstColumn = "Map"

# The user's Maps Demo Key, kept by Pollis in Secret Storage and set in the Julia REPL
[apiKey]
label = "Google Maps"
noun = "Maps Demo Key"

[[apiKey.fields]]
name = "googleMapsKey"
envVar = "GOOGLE_MAPS_API_KEY"
prompt = "Maps Demo Key, from developers.google.com/maps/demo-key with a personal Google Account"

