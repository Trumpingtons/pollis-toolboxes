[[faq]]
question = "What do I need to use the panel?"
answer = '''
A Maps Demo Key, which Google gives at no cost to a personal Google Account, without billing information. It is meant for evaluation and testing only, and allows 100 calls a day to each API. It is set with the key on the Powered by line.
'''
wiki = "The Demo Key"

[[faq]]
question = "Which tab should I use?"
answer = '''
Roadmap for streets and places, Satellite for what the ground looks like from above, Terrain for relief, and 3D Map for buildings and landscape seen at an angle, which the camera can turn around.
'''
wiki = "Decision Guide"

[[faq]]
question = "Can I put a Google map beside an OpenStreetMap map?"
answer = '''
No. The Google Maps Platform Terms forbid using Google's maps with or near a non-Google map, so the panel opens each Google map on a page of its own, with nothing but Google's maps and the user's own features on it.
'''
wiki = "Terms of Use"

[[faq]]
question = "Can I save the map as an image, or measure things on the satellite view?"
answer = '''
No. The terms forbid caching, scraping or downloading Google's maps, and creating content from them, such as tracing roads or buildings from the satellite images. The panel saves nothing of Google's maps: for images and measurements, use Copernicus Imagery Layers or the files of the toolbox.
'''
wiki = "Terms of Use"
hidden = true

[[faq]]
question = "How many maps can I open in a day?"
answer = '''
The Maps Demo Key allows 100 calls a day to each API, and the Maps JavaScript API counts its use in map loads, one for each map a page opens. When the limit is reached, the maps stop until the next day, with no charge.
'''
wiki = "The Demo Key"
hidden = true

[[faq]]
question = "Why does the 3D map stay blank?"
answer = '''
Google refused the Maps Demo Key, and the title over the map says so, or the day's limit has been reached. The photorealistic imagery of the satellite and hybrid modes covers some places only, so a place without it shows less.
'''
wiki = "Diagnostics"
hidden = true

[[faq]]
question = "How do I turn the 3D map?"
answer = '''
With the controls on the map: the arrows move the centre, the plus and minus buttons zoom, the rotate and tilt controls turn and tilt the camera, and the compass turns it back to north. Range, Tilt and Heading set the view the map opens on, and Orbit the Place turns the camera once around the centre.
'''
wiki = "3D Maps and the Camera"
hidden = true

