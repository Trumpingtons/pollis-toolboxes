[[faq]]
question = "What do I need to use the panel?"
answer = '''
A Maps Demo Key, which Google gives at no cost to a personal Google Account, without billing information. It is meant for evaluation and testing only, and allows 100 calls a day to each API. It is set with the key on the Powered by line.
'''
wiki = "The Demo Key"

[[faq]]
question = "Which tab should I use?"
answer = '''
Roadmap for streets and places, Satellite for what the ground looks like from above, and Terrain for relief. For buildings and landscape in 3D, seen at an angle, use Google Photorealistic 3D Maps.
'''
wiki = "Decision Guide"

[[faq]]
question = "Can I put a Google map beside an OpenStreetMap map?"
answer = '''
No. The Google Maps Platform Terms forbid using Google's maps with or near a non-Google map, so the panel opens each Google map on a page of its own, with nothing but Google's maps and the user's own features on it.
'''
wiki = "Terms of Use"

[[faq]]
question = "Can I save the map as an image, or measure things on the satellite view?"
answer = '''
No. The terms forbid caching, scraping or downloading Google's maps, and creating content from them, such as tracing roads or buildings from the satellite images. The panel saves nothing of Google's maps: for images and measurements, use Copernicus Imagery Layers or the files of the toolbox.
'''
wiki = "Terms of Use"
hidden = true

[[faq]]
question = "How many maps can I open in a day?"
answer = '''
The Maps Demo Key allows 100 calls a day to each API, and the Maps JavaScript API counts its use in map loads, one for each map a page opens. When the limit is reached, the maps stop until the next day, with no charge.
'''
wiki = "The Demo Key"
hidden = true

[[models]]
id = "roadmap"
label = "Roadmap"

[[models]]
id = "satellite"
label = "Satellite"

[[models]]
id = "terrain"
label = "Terrain"

[[bullets]]
text = "Roadmap"
detail = "Google's street map of the place: roads, buildings, transit, parks and the names of places"

[[bullets]]
text = "Satellite"
detail = "Aerial and satellite images of the place, with or without Google's labels of roads and places"

[[bullets]]
text = "Terrain"
detail = "Relief shading and contours under roads, water and names, for the lie of the land"

[[decisionRows]]
task = "Roadmap"
context = "Streets and places"
purpose = "Find a place, see its streets, transit and neighbourhood, and the features of a file on them"

[[decisionRows]]
task = "Satellite"
context = "The ground from above"
purpose = "See buildings, green space and water as they look from the air"

[[decisionRows]]
task = "Terrain"
context = "Relief"
purpose = "See hills and valleys under the roads and places"

[[inputs]]
id = "place"
label = "Place"
tooltip = "Sydney Harbour and Midtown Manhattan come with eight places each for the Next Steps; Your Own Place takes the name, longitude and latitude below."
kind = "select"
default = "sydney"

[[inputs.options]]
value = "sydney"
label = "Sydney Harbour"

[[inputs.options]]
value = "manhattan"
label = "Midtown Manhattan"

[[inputs.options]]
value = "own"
label = "Your Own Place"

[[inputs]]
id = "placeName"
label = "Place Name"
tooltip = "The name of the place, used in the titles of the pages."
default = "Colosseum, Rome"
when = "place=own"
newRow = true

[[inputs]]
id = "lon"
label = "Longitude"
tooltip = "Longitude of the centre of the map, in degrees on WGS 84: negative west of Greenwich."
default = "12.4922"
when = "place=own"

[[inputs]]
id = "lat"
label = "Latitude"
tooltip = "Latitude of the centre of the map, in degrees on WGS 84: negative south of the equator."
default = "41.8902"
when = "place=own"

[[inputs]]
id = "zoom"
label = "Zoom"
tooltip = "From 0, the whole world as one tile: each level up shows half the width and height of the one before. 12 shows a city, 15 a neighbourhood."
default = "15"
newRow = true

[[inputs]]
id = "labels"
label = "Labels"
tooltip = "Whether Google's names of roads and places are drawn over the imagery: Satellite with labels is Google's hybrid map."
kind = "select"
default = "no"
models = ["satellite"]

[[inputs.options]]
value = "no"
label = "Without Labels"

[[inputs.options]]
value = "yes"
label = "With Labels"

[[inputs]]
id = "column"
label = "Colour By"
tooltip = "The column that colours the features in Coloured by a Column: a colour scale for numbers, a colour per value for text. The example places have name, kind and distance_m, their distance from the centre in metres."
default = "distance_m"

[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database, for the places of the Next Steps
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude
{{?place=sydney}} name, lon, lat = "Sydney Harbour", 151.2125, -33.858  # between the Opera House and the Harbour Bridge
{{?place=manhattan}} name, lon, lat = "Midtown Manhattan", -73.98, 40.756  # around Fifth Avenue and 42nd Street
{{?place=own}} name, lon, lat = "{{placeName}}", {{lon}}, {{lat}}  # the centre, in degrees of longitude and latitude
# The places of the Next Steps, as points in longitude and latitude (WGS 84) at their approximate centres. Replace them with your own features, e.g. SELECT * FROM ST_Read('file.gpkg')
{{?place=sydney}} points = "VALUES ('Sydney Opera House', 'Landmark', 151.2153, -33.8568), ('Sydney Harbour Bridge', 'Landmark', 151.2108, -33.8523), ('Circular Quay', 'Station', 151.2111, -33.8612), ('Royal Botanic Garden', 'Park', 151.2166, -33.8642), ('Barangaroo Reserve', 'Park', 151.2026, -33.8577), ('Darling Harbour', 'Waterfront', 151.1993, -33.8737), ('Art Gallery of New South Wales', 'Museum', 151.2173, -33.8688), ('Australian Museum', 'Museum', 151.2132, -33.8743)"
{{?place=manhattan}} points = "VALUES ('Empire State Building', 'Landmark', -73.9857, 40.7484), ('Chrysler Building', 'Landmark', -73.9755, 40.7516), ('Grand Central Terminal', 'Station', -73.9772, 40.7527), ('Rockefeller Center', 'Landmark', -73.9787, 40.7587), ('Times Square', 'Square', -73.9855, 40.758), ('Bryant Park', 'Park', -73.9837, 40.7536), ('Museum of Modern Art', 'Museum', -73.9776, 40.7614), ('American Museum of Natural History', 'Museum', -73.974, 40.7813)"
{{?place=own}} points = "VALUES ('$(name)', 'Place', $(lon), $(lat))"
places = "SELECT name, kind, round(ST_Distance_Sphere(ST_Point(x, y), ST_Point($(lon), $(lat)))) AS distance_m, ST_Point(x, y) AS geom FROM ($(points)) t(name, kind, x, y)"
labels = Dict("roadmap" => "Roadmap", "satellite" => "Satellite", "hybrid" => "Satellite with Labels", "terrain" => "Terrain")
zoom = {{zoom}}  # from 0, the whole world: each level up shows half the width
{{?model=roadmap}} maptype = "roadmap"
{{?model=satellite}} maptype = "{{labels}}" == "yes" ? "hybrid" : "satellite"  # hybrid: the satellite map with Google's labels
{{?model=terrain}} maptype = "terrain"
# Google's map on a page of its own in Pollis's browser, with the Maps Demo Key set with the key on the Powered by line
Pollis.browse(googlemap("$(name), $(labels[maptype])", lon, lat; types = maptype, zoom, place = name))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "every-map-type"
label = "Every Map Type"
desc = "The place as a roadmap, a satellite map, a satellite map with labels and a terrain map, each on its own page: four map loads, each counted against the Demo Key's daily limit"
code = '''
for t in ["roadmap", "satellite", "hybrid", "terrain"]
	Pollis.browse(googlemap("$(name), $(labels[t])", lon, lat; types = t, zoom, place = name))
end
'''

[[actionGroups.actions]]
id = "features-on-map"
label = "Features on the Map"
desc = "The places of the example, or the features of your own query, on Google's Data layer over the map: the map fits them, and a click on one shows its name, kind and distance from the centre"
code = '''
shown = geojson(con, places)  # the places as a GeoJSON file
n = only(Tables.columntable(DBInterface.execute(con, "SELECT count(*) AS n FROM ($(places))")).n)
Pollis.browse(googlemap("$(name), Places", lon, lat; types = maptype, zoom, place = name, features = shown, note = "$(n) places of the example, as points, in one colour."))
'''

[[actionGroups.actions]]
id = "coloured-by-column"
label = "Coloured by a Column"
desc = "The area within 300 m of each place, coloured by the Colour By column, with a legend: a colour scale for numbers, a colour per value for text"
code = '''
utm = utmzone(lon, lat)  # the UTM zone of the place, in metres
areas = geojson(con, "SELECT * EXCLUDE (geom), ST_Transform(ST_Buffer(ST_Transform(geom, 'EPSG:4326', '$(utm)'), 300), '$(utm)', 'EPSG:4326') AS geom FROM ($(places))")
Pollis.browse(googlemap("$(name), {{column}}", lon, lat; types = maptype, zoom, place = name, features = areas, column = "{{column}}", note = "The areas within 300 m of the places of the example, coloured by {{column}}."))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "layer-size"
label = "Layer Size"
desc = "The features of the places query by geometry type, their vertices and the kilobytes of GeoJSON the page would hold: a large layer makes the Data layer slow to draw"
code = '''
file = geojson(con, places)
s = Tables.columntable(DBInterface.execute(con, "SELECT ST_GeometryType(geom)::VARCHAR AS type, count(*) AS n, sum(ST_NPoints(geom))::BIGINT AS vertices FROM ($(places)) WHERE geom IS NOT NULL GROUP BY ALL ORDER BY n DESC"))
println("The layer the page would hold: ", round(filesize(file) / 1024, digits = 1), " KB of GeoJSON")
println(rpad("geometry type", 22), rpad("features", 10), "vertices")
for i in eachindex(s.type)
	println(rpad(s.type[i], 22), rpad(s.n[i], 10), s.vertices[i])
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "side-by-side"
label = "Two Map Types Side by Side"
desc = "The roadmap beside the satellite map, or beside the map of the tab, on one page: panning or zooming either moves both. Two map loads"
code = '''
pair = maptype == "roadmap" ? ["roadmap", "satellite"] : ["roadmap", maptype]
Pollis.browse(googlemap("$(name), $(labels[pair[1]]) and $(labels[pair[2]])", lon, lat; types = pair, zoom, place = name))
'''
