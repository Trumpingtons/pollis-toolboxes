[[inputs]]
id = "column"
label = "Colour By"
tooltip = "The column that colours the features in Coloured by a Column: a colour scale for numbers, a colour per value for text. The example places have name, kind and distance_m, their distance from the centre in metres."
default = "distance_m"
models = ["roadmap", "satellite", "terrain"]

[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables

haskey(ENV, "GOOGLE_MAPS_API_KEY") || error("Set your Maps Demo Key with the key on the Powered by line, or set ENV[\"GOOGLE_MAPS_API_KEY\"]: see The Demo Key wiki")
key = ENV["GOOGLE_MAPS_API_KEY"]
con = DBInterface.connect(DuckDB.DB)  # an in-memory database, for the places of the Next Steps
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude
{{?place=sydney}} name, lon, lat = "Sydney Harbour", 151.2125, -33.858  # between the Opera House and the Harbour Bridge
{{?place=manhattan}} name, lon, lat = "Midtown Manhattan", -73.98, 40.756  # around Fifth Avenue and 42nd Street
{{?place=own}} name, lon, lat = "{{placeName}}", {{lon}}, {{lat}}  # the centre, in degrees of longitude and latitude
# The places of the Next Steps, as points in longitude and latitude (WGS 84) at their approximate centres. Replace them with your own features, e.g. SELECT * FROM ST_Read('file.gpkg')
{{?place=sydney}} points = "VALUES ('Sydney Opera House', 'Landmark', 151.2153, -33.8568), ('Sydney Harbour Bridge', 'Landmark', 151.2108, -33.8523), ('Circular Quay', 'Station', 151.2111, -33.8612), ('Royal Botanic Garden', 'Park', 151.2166, -33.8642), ('Barangaroo Reserve', 'Park', 151.2026, -33.8577), ('Darling Harbour', 'Waterfront', 151.1993, -33.8737), ('Art Gallery of New South Wales', 'Museum', 151.2173, -33.8688), ('Australian Museum', 'Museum', 151.2132, -33.8743)"
{{?place=manhattan}} points = "VALUES ('Empire State Building', 'Landmark', -73.9857, 40.7484), ('Chrysler Building', 'Landmark', -73.9755, 40.7516), ('Grand Central Terminal', 'Station', -73.9772, 40.7527), ('Rockefeller Center', 'Landmark', -73.9787, 40.7587), ('Times Square', 'Square', -73.9855, 40.758), ('Bryant Park', 'Park', -73.9837, 40.7536), ('Museum of Modern Art', 'Museum', -73.9776, 40.7614), ('American Museum of Natural History', 'Museum', -73.974, 40.7813)"
{{?place=own}} points = "VALUES ('$(name)', 'Place', $(lon), $(lat))"
places = "SELECT name, kind, round(ST_Distance_Sphere(ST_Point(x, y), ST_Point($(lon), $(lat)))) AS distance_m, ST_Point(x, y) AS geom FROM ($(points)) t(name, kind, x, y)"
pages = mktempdir()  # the pages hold the key, so they stay in a folder Julia removes when it exits
slug(s) = lowercase(join((m.match for m in eachmatch(r"[A-Za-z0-9]+", s)), "-"))
html(s) = replace(string(s), "&" => "&amp;", "<" => "&lt;", ">" => "&gt;", "\"" => "&quot;")
labels = Dict("roadmap" => "Roadmap", "satellite" => "Satellite", "hybrid" => "Satellite with Labels", "terrain" => "Terrain")
# A page with a map of Google's and nothing else, opened in Pollis's browser: the same title opens again in its tab.
# Its text says what the map shows, from the inputs only, for screen readers.
function page(title, about, body)
	file = joinpath(pages, slug(title) * ".html")
	write(file, """<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>$(html(title))</title>
<style>
html, body { height: 100%; margin: 0; font: 13px sans-serif; }
.maps { display: flex; height: 100%; } .maps > div { flex: 1; height: 100%; } gmp-map-3d { display: block; height: 100%; }
.about { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); }
.box { position: absolute; z-index: 1; top: 10px; left: 10px; max-width: 60%; padding: 6px 10px; background: #fff; border-radius: 4px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); font-weight: 600; }
.legend { margin: 0 0 10px 10px; padding: 6px 10px; background: #fff; border-radius: 4px; box-shadow: 0 1px 4px rgba(0, 0, 0, 0.3); }
.swatch { display: inline-block; width: 10px; height: 10px; margin-right: 6px; border-radius: 2px; }
</style>
<script>function gm_authFailure() { document.getElementById("title").textContent = "Google refused the Maps Demo Key: check it with the key on the Powered by line, and see the Diagnostics wiki." }</script>
</head><body>
<section class="about" aria-label="What the map shows"><h1>$(html(title))</h1><ul>$(join("<li>" .* html.(about) .* "</li>"))</ul></section>
<div class="box" id="title">$(html(title))</div>
$(body)
</body></html>""")
	Pollis.browse(file)
	return file
end
# Google's 2D maps of the types given, side by side and moving together, with the features of a GeoJSON file
# on Google's Data layer, coloured by a column; a click on a feature shows its columns
function map2d(title, types; features = "", column = "", note = "")
	geojson = isempty(features) ? "null" : replace(read(features, String), "</" => "<\\/")
	about = ["Google Maps, $(join([labels[t] for t in types], " and ")), centred on $(name): longitude $(lon), latitude $(lat), zoom $(zoom)."]
	isempty(note) || push!(about, note)
	page(title, about, """<div class="maps">$(join(["<div id=\"map$(i - 1)\"></div>" for i in eachindex(types)]))</div>
<script>
const TYPES = [$(join(repr.(types), ", "))], GEOJSON = $(geojson), COLUMN = $(repr(column));
const RAMP = ["#440154", "#3b528b", "#21918c", "#5ec962", "#fde725"], PALETTE = ["#4e79a7", "#f28e2b", "#e15759", "#76b7b2", "#59a14f", "#edc948", "#b07aa1", "#ff9da7"];
async function start() {
	const { Map, InfoWindow } = await google.maps.importLibrary("maps");
	const maps = TYPES.map((type, i) => new Map(document.getElementById("map" + i), { center: { lat: $(lat), lng: $(lon) }, zoom: $(zoom), mapTypeId: type, mapTypeControl: false, streetViewControl: false }));
	if (maps.length > 1) {
		let moving = false;
		const follow = (a, b) => a.addListener("bounds_changed", () => { if (!moving) { moving = true; b.setCenter(a.getCenter()); b.setZoom(a.getZoom()); moving = false; } });
		follow(maps[0], maps[1]);
		follow(maps[1], maps[0]);
	}
	if (!GEOJSON) {
		return;
	}
	const values = GEOJSON.features.map(f => f.properties ? f.properties[COLUMN] : undefined).filter(v => v !== null && v !== undefined);
	const numeric = values.length > 0 && values.every(v => typeof v === "number");
	const lo = numeric ? Math.min(...values) : 0, hi = numeric ? Math.max(...values) : 0;
	const kinds = [...new Set(values.map(String))];
	const step = v => hi > lo ? Math.min(4, Math.floor((v - lo) / (hi - lo) * 5)) : 2;
	const colour = v => !COLUMN ? PALETTE[0] : v === null || v === undefined ? "#999999" : numeric ? RAMP[step(v)] : PALETTE[kinds.indexOf(String(v)) % PALETTE.length];
	const info = new InfoWindow();
	const bounds = new google.maps.LatLngBounds();
	maps.forEach(map => {
		map.data.addGeoJson(GEOJSON);
		map.data.setStyle(f => {
			const c = colour(f.getProperty(COLUMN));
			return { icon: { path: google.maps.SymbolPath.CIRCLE, scale: 7, fillColor: c, fillOpacity: 1, strokeColor: "#ffffff", strokeWeight: 2 }, fillColor: c, fillOpacity: 0.5, strokeColor: c, strokeWeight: 1 };
		});
		map.data.addListener("click", e => {
			const lines = document.createElement("div");
			e.feature.forEachProperty((v, k) => { const line = document.createElement("div"); line.textContent = k + ": " + v; lines.append(line); });
			info.setContent(lines);
			info.setPosition(e.latLng);
			info.open({ map });
		});
		map.data.forEach(f => f.getGeometry().forEachLatLng(p => bounds.extend(p)));
	});
	if (!bounds.getNorthEast().equals(bounds.getSouthWest())) {
		maps[0].fitBounds(bounds, 40);
	}
	if (COLUMN && values.length) {
		const legend = document.createElement("div");
		legend.className = "legend";
		const row = (c, text) => { const line = document.createElement("div"); const swatch = document.createElement("span"); swatch.className = "swatch"; swatch.style.background = c; line.append(swatch, text); legend.append(line); };
		const title = document.createElement("div");
		title.textContent = COLUMN;
		title.style.fontWeight = "600";
		legend.append(title);
		const format = v => Number(v.toPrecision(4)).toLocaleString();
		if (numeric) {
			RAMP.forEach((c, i) => row(c, format(lo + (hi - lo) * i / 5) + " to " + format(lo + (hi - lo) * (i + 1) / 5)));
		} else {
			kinds.slice(0, PALETTE.length).forEach((k, i) => row(PALETTE[i], k));
		}
		maps[maps.length - 1].controls[google.maps.ControlPosition.LEFT_BOTTOM].push(legend);
	}
}
</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=$(key)&v=weekly&loading=async&callback=start"></script>""")
end
# Google's 3D map, from a camera at the range, tilt and heading given; with orbit = true, the camera turns once around the centre
function map3d(title; orbit = false)
	camera = "range $(range_m) m, tilt $(tilt) degrees, heading $(heading) degrees"
	about = ["Google's 3D map, mode $(mode), centred on $(name): longitude $(lon), latitude $(lat); camera at $(camera)." * (orbit ? " The camera turns once around the centre." : "")]
	turn = orbit ? """<script>customElements.whenDefined("gmp-map-3d").then(() => document.getElementById("map").flyCameraAround({ camera: { center: { lat: $(lat), lng: $(lon), altitude: 0 }, range: $(range_m), tilt: $(tilt), heading: $(heading) }, durationMillis: 60000, repeatCount: 1 }));</script>""" : ""
	page(title, about, """<gmp-map-3d id="map" center="$(lat),$(lon),0" range="$(range_m)" tilt="$(tilt)" heading="$(heading)" mode="$(mode)"></gmp-map-3d>
<script>document.getElementById("map").addEventListener("gmp-error", () => { document.getElementById("title").textContent = "Google could not open the 3D map: check the Maps Demo Key with the key on the Powered by line, and see the Diagnostics wiki." });</script>
<script async src="https://maps.googleapis.com/maps/api/js?key=$(key)&v=weekly&loading=async&libraries=maps3d"></script>
$(turn)""")
end
{{?model!=map3d}} zoom = {{zoom}}  # from 0, the whole world: each level up shows half the width
{{?model=roadmap}} maptype = "roadmap"
{{?model=satellite}} maptype = "{{labels}}" == "yes" ? "hybrid" : "satellite"  # hybrid: the satellite map with Google's labels
{{?model=terrain}} maptype = "terrain"
{{?model!=map3d}} map2d("$(name), $(labels[maptype])", [maptype])
{{?model=map3d}} range_m, tilt, heading = {{range}}, {{tilt}}, {{heading}}  # the camera: metres from the centre, degrees from straight down, degrees from north
{{?model=map3d}} mode = "{{labels}}" == "yes" ? "hybrid" : "satellite"
{{?model=map3d}} map3d("$(name), 3D Map")  # the controls on the map move, zoom, turn and tilt the camera
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "every-map-type"
label = "Every Map Type"
desc = "The place as a roadmap, a satellite map, a satellite map with labels and a terrain map, each on its own page: four map loads, each counted against the Demo Key's daily limit"
models = ["roadmap", "satellite", "terrain"]
code = '''
for t in ["roadmap", "satellite", "hybrid", "terrain"]
	map2d("$(name), $(labels[t])", [t])
end
'''

[[actionGroups.actions]]
id = "features-on-map"
label = "Features on the Map"
desc = "The places of the example, or the features of your own query, on Google's Data layer over the map: the map fits them, and a click on one shows its name, kind and distance from the centre"
models = ["roadmap", "satellite", "terrain"]
code = '''
shown = joinpath(mktempdir(), "places.geojson")
DBInterface.execute(con, "COPY ($(places)) TO '$(shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")
n = only(Tables.columntable(DBInterface.execute(con, "SELECT count(*) AS n FROM ($(places))")).n)
map2d("$(name), Places", [maptype]; features = shown, note = "$(n) places of the example, as points, in one colour.")
'''

[[actionGroups.actions]]
id = "coloured-by-column"
label = "Coloured by a Column"
desc = "The area within 300 m of each place, coloured by the Colour By column, with a legend: a colour scale for numbers, a colour per value for text"
models = ["roadmap", "satellite", "terrain"]
code = '''
utm = "EPSG:$((lat >= 0 ? 32600 : 32700) + floor(Int, (lon + 180) / 6) + 1)"  # the UTM zone of the place, in metres
areas = joinpath(mktempdir(), "areas.geojson")
DBInterface.execute(con, "COPY (SELECT * EXCLUDE (geom), ST_Transform(ST_Buffer(ST_Transform(geom, 'EPSG:4326', '$(utm)'), 300), '$(utm)', 'EPSG:4326') AS geom FROM ($(places))) TO '$(areas)' (FORMAT GDAL, DRIVER 'GeoJSON')")
map2d("$(name), {{column}}", [maptype]; features = areas, column = "{{column}}", note = "The areas within 300 m of the places of the example, coloured by {{column}}.")
'''

[[actionGroups.actions]]
id = "orbit"
label = "Orbit the Place"
desc = "The 3D map, its camera turning once around the centre in a minute at the Range and Tilt given, clockwise"
models = ["map3d"]
code = '''
map3d("$(name), Orbit"; orbit = true)
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "layer-size"
label = "Layer Size"
desc = "The features of the places query by geometry type, their vertices and the kilobytes of GeoJSON the page would hold: a large layer makes the Data layer slow to draw"
models = ["roadmap", "satellite", "terrain"]
code = '''
file = joinpath(mktempdir(), "places.geojson")
DBInterface.execute(con, "COPY ($(places)) TO '$(file)' (FORMAT GDAL, DRIVER 'GeoJSON')")
s = Tables.columntable(DBInterface.execute(con, "SELECT ST_GeometryType(geom)::VARCHAR AS type, count(*) AS n, sum(ST_NPoints(geom))::BIGINT AS vertices FROM ($(places)) WHERE geom IS NOT NULL GROUP BY ALL ORDER BY n DESC"))
println("The layer the page would hold: ", round(filesize(file) / 1024, digits = 1), " KB of GeoJSON")
println(rpad("geometry type", 22), rpad("features", 10), "vertices")
for i in eachindex(s.type)
	println(rpad(s.type[i], 22), rpad(s.n[i], 10), s.vertices[i])
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "side-by-side"
label = "Two Map Types Side by Side"
desc = "The roadmap beside the satellite map, or beside the map of the tab, on one page: panning or zooming either moves both. Two map loads"
models = ["roadmap", "satellite", "terrain"]
code = '''
pair = maptype == "roadmap" ? ["roadmap", "satellite"] : ["roadmap", maptype]
map2d("$(name), $(labels[pair[1]]) and $(labels[pair[2]])", pair)
'''
