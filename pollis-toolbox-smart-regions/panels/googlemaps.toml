# Google Maps: Google's road, satellite, terrain and 3D maps of a place, drawn by the Maps JavaScript API on a page of
# their own in Pollis's browser, with a Maps Demo Key, and the user's own features in 3D on the 3D map: polygons raised
# to a height, values as columns and lines at an altitude; Sydney Harbour and Midtown Manhattan as example places

[meta]
title = "Google Maps"
viewType = "pollis.googlemaps"
defaultModel = "roadmap"
decisionFirstColumn = "Map"

# The user's Maps Demo Key, kept by Pollis in Secret Storage and set in the Julia REPL
[apiKey]
label = "Google Maps"
noun = "Maps Demo Key"

