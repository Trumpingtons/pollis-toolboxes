[[actionGroups.actions]]
id = "image-quality"
label = "Image Quality"
desc = "The quality score Mapillary predicts for each image, from 0 to 1: how many images have one, its quantiles, and the share of images in each tenth of the scale"
models = ["coverage", "images"]
code = '''
q = only(query("SELECT count(*) AS n, count(quality_score) AS scored, quantile_cont(quality_score, [0.05, 0.25, 0.5, 0.75, 0.95]) AS qs FROM images") |> Tables.rows)
println(q.scored, " of ", q.n, " images have a quality score (", round(100 * q.scored / max(q.n, 1); digits = 1), "%)")
if q.scored > 0
	println("Quantiles 5, 25, 50, 75, 95%: ", join(round.(q.qs; digits = 3), ", "))
	b = query("SELECT least(floor(quality_score * 10), 9) AS bin, count(*) AS n FROM images WHERE quality_score IS NOT NULL GROUP BY bin ORDER BY bin")
	for i in eachindex(b.n)
		println(lpad(b.bin[i] / 10, 4), " to ", rpad((b.bin[i] + 1) / 10, 4), lpad(round(100 * b.n[i] / q.scored; digits = 1), 6), "%  ", repeat("#", round(Int, 50 * b.n[i] / q.scored)))
	end
end
'''

[[actionGroups.actions]]
id = "cells-without-images"
label = "Cells Without Images"
desc = "The area divided into cells of about 100 m: how many have at least one image, and how many one of the last three years; cells without streets, such as water and parks, count among those without"
models = ["coverage", "images"]
code = '''
dx, dy = 100 / (111320 * cosd((south + north) / 2)), 100 / 110574  # about 100 m, in degrees at the middle of the area
nx, ny = ceil(Int, (east - west) / dx), ceil(Int, (north - south) / dy)
c = only(query("SELECT count(DISTINCT i * 1000000 + j) AS n, count(DISTINCT i * 1000000 + j) FILTER (WHERE captured_at >= now() - INTERVAL 3 YEAR) AS recent FROM (SELECT floor((ST_X(geom) - $(west)) / $(dx)) AS i, floor((ST_Y(geom) - $(south)) / $(dy)) AS j, captured_at FROM images)") |> Tables.rows)
println(nx * ny, " cells of about 100 m over the area:")
println("  ", c.n, " with an image (", round(100 * c.n / (nx * ny); digits = 1), "%), ", c.recent, " with one of the last three years (", round(100 * c.recent / (nx * ny); digits = 1), "%)")
println("  ", nx * ny - c.n, " without an image")
'''

[[actionGroups.actions]]
id = "downloaded-files"
label = "Files Downloaded"
desc = "The files in the folder mapillary: the coverage tiles of each day, and the thumbnails, with how many and their size"
models = ["coverage", "images"]
code = '''
groups = Dict{String, Vector{Int}}()
for (root, _, names) in walkdir(place), name in names
	root == place && continue  # the files the Next Steps saved
	bucket = relpath(root, place)
	bucket = startswith(bucket, "tiles") ? joinpath(splitpath(bucket)[1:min(2, end)]...) : bucket
	push!(get!(groups, bucket, Int[]), filesize(joinpath(root, name)))
end
for g in sort(collect(keys(groups)))
	println(rpad(g, 24), lpad(length(groups[g]), 7), " files", lpad(round(sum(groups[g]) / 2^20; digits = 2), 9), " MB")
end
isempty(groups) && println("No tiles or thumbnails have been downloaded into ", place)
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "two-periods"
label = "Two Periods Side by Side"
desc = "The cells of about 100 m with images before the Split Year, from it on, or both, counted and on an OpenStreetMap base map in Pollis's map view: where the area has been photographed again"
models = ["coverage", "images"]
code = '''
split_year = {{splitYear}}
dx, dy = 100 / (111320 * cosd((south + north) / 2)), 100 / 110574  # about 100 m, in degrees at the middle of the area
cells = """SELECT i, j, CASE WHEN max(year(captured_at)) < $(split_year) THEN 'Before $(split_year) only' WHEN min(year(captured_at)) >= $(split_year) THEN 'From $(split_year) only' ELSE 'Both' END AS period
	FROM (SELECT floor((ST_X(geom) - $(west)) / $(dx)) AS i, floor((ST_Y(geom) - $(south)) / $(dy)) AS j, captured_at FROM images) GROUP BY i, j"""
p = query("SELECT period, count(*) AS n FROM ($(cells)) GROUP BY period ORDER BY period")
for i in eachindex(p.n)
	println(rpad(p.period[i], 22), lpad(p.n[i], 7), " cells")
end
shown = joinpath(mktempdir(), "periods.geojson")
DBInterface.execute(con, "COPY (SELECT period, ST_MakeEnvelope($(west) + i * $(dx), $(south) + j * $(dy), $(west) + (i + 1) * $(dx), $(south) + (j + 1) * $(dy)) AS geom FROM ($(cells))) TO '$(shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(shown; name = "Cells by period", column = "period", opacity = 0.5); title = "Images Before and From $(split_year)"))
'''

[[actionGroups.actions]]
id = "panoramas-and-others"
label = "Panoramas and Others"
desc = "The panoramas beside the other images: how many, in how many sequences, their median quality score, and their first and last dates"
models = ["coverage", "images"]
code = '''
p = query("SELECT coalesce(is_pano, false) AS pano, count(*) AS n, count(DISTINCT sequence_id) AS k, median(quality_score) AS q, CAST(min(captured_at) AS DATE) AS t0, CAST(max(captured_at) AS DATE) AS t1 FROM images GROUP BY pano ORDER BY pano")
println(rpad("", 14), rpad("images", 9), rpad("sequences", 11), rpad("quality", 9), "first and last")
for i in eachindex(p.n)
	println(rpad(p.pano[i] ? "Panoramas" : "Other images", 14), rpad(p.n[i], 9), rpad(p.k[i], 11), rpad(ismissing(p.q[i]) ? "none" : round(p.q[i]; digits = 3), 9), p.t0[i], " to ", p.t1[i])
end
'''

[[actionGroups.actions]]
id = "signs-and-points"
label = "Traffic Signs and Points"
desc = "The traffic signs beside the other map features: how many, of how many kinds, and when they were first and last seen"
models = ["features"]
