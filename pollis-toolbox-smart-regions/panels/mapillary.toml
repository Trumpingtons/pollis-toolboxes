filters = String[]
wanted = "{{values}}"
wanted == "all" || push!(filters, "object_values=" * replace(wanted, " " => ""))
kind = "{{kind}}"
answers = search("map_features", "id,object_value,object_type,first_seen_at,last_seen_at,aligned_direction,geometry", filters)
DBInterface.execute(con, """
CREATE OR REPLACE TABLE features AS
SELECT DISTINCT ON (id) x->>'id' AS id, x->>'object_value' AS value, x->>'object_type' AS kind, split_part(x->>'object_value', '--', 1) AS family,
	TRY_CAST(left(x->>'first_seen_at', 19) AS TIMESTAMP) AS first_seen, TRY_CAST(left(x->>'last_seen_at', 19) AS TIMESTAMP) AS last_seen,
	TRY_CAST(x->>'aligned_direction' AS DOUBLE) AS aligned_direction, ST_GeomFromGeoJSON(x->'geometry') AS geom
FROM (SELECT unnest(CAST(coalesce(json_extract(content, '/data'), '[]') AS JSON[])) AS x FROM read_text(?))
""", [answers])  # one row per map feature: its value, kind, family, first and last seen, direction and point
foreach(rm, answers)
kind == "all" || DBInterface.execute(con, "DELETE FROM features WHERE kind <> ?", [kind])
kept = ["features"]  # the tables Save as GeoParquet writes
s = query("SELECT kind, count(*) AS n, count(DISTINCT value) AS k FROM features GROUP BY kind ORDER BY kind")
isempty(s.n) && error("Mapillary has no map features over the area with these filters")
for i in eachindex(s.n)
	println(s.n[i], " ", s.kind[i] == "traffic_sign" ? "traffic signs" : "points", " of ", s.k[i], " kinds over the area")
