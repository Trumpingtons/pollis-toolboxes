# Mapillary Street-Level Imagery: the street-level images of an area from the coverage tiles of Mapillary, the images found by
# its image search with their cameras and thumbnails, and the map features located from them, read with an access token

[meta]
title = "Mapillary Street-Level Imagery"
viewType = "pollis.mapillary"
defaultModel = "coverage"
decisionFirstColumn = "Tab"

# The user's Mapillary client access token, kept by Pollis in Secret Storage and set in the Julia REPL
[apiKey]
label = "Mapillary"
noun = "access token"

[[apiKey.fields]]
name = "mapillaryToken"
envVar = "MAPILLARY_ACCESS_TOKEN"
prompt = "Mapillary client access token, from the developer dashboard of Mapillary"

[[packages]]
name = "DuckDB.jl"
github = "https://github.com/duckdb/DuckDB.jl"

[[packages]]
name = "Tables.jl"
github = "https://github.com/JuliaData/Tables.jl"

# Further packages the examples use: checked by the install indicator, not listed on the Powered-by line
[requires]
packages = ["ECharts.jl"]

