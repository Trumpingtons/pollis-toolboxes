println(rpad("", 16), rpad("features", 10), rpad("kinds", 7), rpad("first seen", 13), rpad("median last", 13), "last seen")
for i in eachindex(p.n)
	println(rpad(p.kind[i] == "traffic_sign" ? "Traffic signs" : "Points", 16), rpad(p.n[i], 10), rpad(p.k[i], 7), rpad(string(p.t0[i]), 13), rpad(string(p.tm[i]), 13), p.t1[i])
end
'''

