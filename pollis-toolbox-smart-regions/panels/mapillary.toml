id = "images-map"
label = "Images on a Map"
desc = "The images as points coloured by the year they were captured, on an OpenStreetMap base map in Pollis's map view, at most 20,000 (a sample when there are more); click an image for its date, heading and sequence"
models = ["coverage", "images"]
code = '''
shown = joinpath(mktempdir(), "images.geojson")
DBInterface.execute(con, "COPY (SELECT id, sequence_id, CAST(captured_at AS VARCHAR) AS captured, year(captured_at) AS year, compass_angle, is_pano, quality_score, geom FROM images USING SAMPLE reservoir(20000 ROWS) REPEATABLE (1)) TO '$(shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(shown; name = "Images by year", column = "year"); title = "Mapillary Images"))
'''

[[actionGroups.actions]]
id = "images-over-time"
label = "Images over Time"
desc = "How many images were captured each month, panoramas and the others stacked, drawn with ECharts"
models = ["coverage", "images"]
code = '''
using ECharts

m = query("SELECT CAST(date_trunc('month', captured_at) AS VARCHAR) AS month, count(*) FILTER (WHERE NOT coalesce(is_pano, false)) AS others, count(*) FILTER (WHERE is_pano) AS panoramas FROM images GROUP BY month ORDER BY month")
EChart(ec_width = 760, ec_height = 380, title = [ECharts.Title(text = "Images Captured Each Month")], tooltip = ECharts.Tooltip(trigger = "axis"), legend = ECharts.Legend(),
	xAxis = [ECharts.Axis(_type = "time", name = "Month", axisLabel = ECharts.AxisLabel(formatter = "{yyyy}"))], yAxis = [ECharts.Axis(_type = "value", name = "Images")],
	series = [ECharts.XYSeries(name = name, _type = "bar", stack = "images", barMaxWidth = 12, data = [[m.month[i], counts[i]] for i in eachindex(m.month)]) for (name, counts) in (("Other images", m.others), ("Panoramas", m.panoramas))])  # both series on the same months, as stacking pairs them by position
'''

[[actionGroups.actions]]
id = "look-at-images"
label = "Look at the Images"
desc = "The thumbnails downloaded, newest first, with the date, heading and camera of each, on a page in Pollis's browser; each links to the image on Mapillary"
models = ["images"]
code = '''
t = query("SELECT id, thumbnail, CAST(CAST(captured_at AS DATE) AS VARCHAR) AS day, CAST(round(compass_angle) AS INTEGER) AS heading, coalesce(camera_type, '') AS camera, is_pano FROM images WHERE thumbnail IS NOT NULL ORDER BY captured_at DESC")
isempty(t.id) && error("No thumbnail has been downloaded: choose 20 or 100 Thumbnails and run the Images tab again")
figures = ["<figure><a href=\"https://www.mapillary.com/app/?pKey=$(t.id[i])\"><img src=\"thumbnails/$(basename(t.thumbnail[i]))\" alt=\"Image $(t.id[i])\"></a><figcaption>$(t.day[i]) · heading $(coalesce(t.heading[i], "unknown"))° · $(t.camera[i])$(coalesce(t.is_pano[i], false) ? " · panorama" : "")</figcaption></figure>" for i in eachindex(t.id)]
sheet = joinpath(place, "mapillary-images.html")
write(sheet, """<!doctype html><html><head><meta charset="utf-8"><title>Mapillary Images</title>
<style>body{font-family:sans-serif;margin:16px}div{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:12px}figure{margin:0}img{width:100%;border-radius:4px}figcaption{font-size:12px;color:#666;margin-top:4px}</style></head>
<body><h2>Mapillary Images over the Area</h2><p>$(length(t.id)) images, newest first. Images from Mapillary.</p><div>$(join(figures))</div></body></html>""")
Pollis.browse(sheet)
'''

