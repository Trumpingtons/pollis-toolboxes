[[actionGroups.actions]]
id = "newest-per-cell"
label = "Newest Image per Cell"
desc = "The area in cells of about 100 m coloured by the year of the newest image in each, on an OpenStreetMap base map in Pollis's map view, and the share of cells by that year: how old the coverage is"
models = ["coverage", "images"]
code = '''
dx, dy = 100 / (111320 * cosd((south + north) / 2)), 100 / 110574  # about 100 m, in degrees at the middle of the area
cells = "SELECT i, j, max(year(captured_at)) AS newest FROM (SELECT floor((ST_X(geom) - $(west)) / $(dx)) AS i, floor((ST_Y(geom) - $(south)) / $(dy)) AS j, captured_at FROM images) GROUP BY i, j"
y = query("SELECT newest, count(*) AS n FROM ($(cells)) GROUP BY newest ORDER BY newest")
for i in eachindex(y.n)
	println(y.newest[i], lpad(round(100 * y.n[i] / sum(y.n); digits = 1), 7), "%  ", repeat("#", round(Int, 50 * y.n[i] / sum(y.n))))
end
shown = joinpath(mktempdir(), "newest.geojson")
DBInterface.execute(con, "COPY (SELECT newest, ST_MakeEnvelope($(west) + i * $(dx), $(south) + j * $(dy), $(west) + (i + 1) * $(dx), $(south) + (j + 1) * $(dy)) AS geom FROM ($(cells))) TO '$(shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(shown; name = "Year of the newest image", column = "newest", opacity = 0.6); title = "Newest Image per Cell"))
'''

[[actionGroups.actions]]
id = "contributors"
label = "Contributors"
desc = "How many people captured the images of the area, and the share of the images captured by the largest ten; the Coverage tab knows them by number, the Images tab by name"
models = ["coverage", "images"]
code = '''
c = query("SELECT coalesce(creator, 'unknown') AS creator, count(*) AS n, count(DISTINCT sequence_id) AS k, CAST(max(captured_at) AS DATE) AS t1 FROM images GROUP BY ALL ORDER BY n DESC")
total = sum(c.n)
println(length(c.n), " contributors; the largest ten captured ", round(100 * sum(c.n[1:min(10, end)]) / total; digits = 1), "% of the ", total, " images")
for i in 1:min(10, length(c.n))
	println(rpad(c.creator[i], 24), lpad(c.n[i], 8), " images", lpad(round(100 * c.n[i] / total; digits = 1), 7), "%", lpad(c.k[i], 6), " sequences, last ", c.t1[i])
end
'''

