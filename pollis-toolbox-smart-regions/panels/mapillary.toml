[[faq]]
question = "What do I need to use the panel?"
answer = '''
A Mapillary client access token, free from the developer dashboard of Mapillary once an application is registered there, for every tab: Mapillary answers no request without one. It is set with the key on the Powered by line.
'''
wiki = "Authentication"

[[faq]]
question = "Which tab should I use?"
answer = '''
Coverage reads the coverage tiles, which Mapillary recommends for larger areas: every image with its date, heading, sequence and quality score, up to a whole city. Images searches a smaller area for the images with their cameras, filters by date and panorama, and downloads thumbnails. Map Features lists the traffic signs and other objects located from the images.
'''
wiki = "Decision Guide"

[[faq]]
question = "Why does the Images tab make so many requests?"
answer = '''
Mapillary answers an image search only over a box of less than 0.01 square degrees, with at most 2,000 images and no further pages. The tab splits the Area into boxes of that size, and splits again into four any box that returns 2,000 images, so that no image is left out.
'''
wiki = "Image Search"

[[faq]]
question = "How large an area can I read?"
answer = '''
Coverage reads at most 400 tiles of zoom 14 in one run, an area of about a city; Mapillary serves 50,000 tiles a day. Images and Map Features search at most one square degree, in boxes of less than 0.01 square degrees.
'''
wiki = "Diagnostics"
hidden = true

[[faq]]
question = "Are the positions of the images those of the camera?"
answer = '''
The panel uses the computed positions: those Mapillary estimates after processing the images together, in the computed coverage tiles and the computed geometry of the image search, with the original position from the camera where no computed one is given.
'''
wiki = "Coverage Tiles"
hidden = true

[[faq]]
question = "What is a map feature?"
answer = '''
An object with a location, such as a traffic sign or a utility pole, which Mapillary derives from detections of the object in several images. Each has a value naming its kind, the dates it was first and last seen, and the compass direction it faces.
'''
wiki = "Map Features"
hidden = true

