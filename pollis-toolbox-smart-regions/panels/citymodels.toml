[[faq]]
question = "Where does the CityGML tab find the geometry of a building?"
answer = '''
Under the building's geometry properties, whose names start with the level of detail: lod1Solid, lod2Solid, lod2MultiSurface and the others. From LoD2, a building's geometry is often in its boundary surfaces, WallSurface, RoofSurface and GroundSurface, and in its BuildingParts, each with its own lod2MultiSurface; the tab collects the polygons under all of them.

A property given only as xlink:href references holds no polygons of its own, so the polygons are read where they are written. The Level of Detail input picks the level kept.
'''
wiki = "CityGML"

[[faq]]
question = "Which level of detail should I read?"
answer = '''
The one with the detail the work needs. In CityGML 2.0, LoD1 is the block model, buildings as prisms with flat roofs, which gives heights and footprints; LoD2 adds the shapes of roofs and the wall, roof and ground surfaces; LoD3 adds doors and windows.

An object can have geometries of several levels at once. The Level of Detail input of the CityJSON tab keeps the highest or the lowest of each object.
'''
wiki = "Levels of Detail"

[[faq]]
question = "Should I keep my city model in CityGML or CityJSON?"
answer = '''
CityJSON encodes the CityGML data model in JSON, each vertex stored once, which makes files about six times smaller and simpler in structure, read by any JSON parser. CityGML, as XML, is what many national agencies publish and what GML software reads.

CityJSON 2.0 implements part of the CityGML 3.0 data model, not all its modules, and keeps a whole file in one coordinate system, where CityGML allows one per object.
'''
wiki = "Decision Guide"

[[faq]]
question = "How is the footprint of a building computed?"
answer = '''
Building Measures takes the faces of each building's geometry, drops the vertical ones, whose plan area is zero, projects the rest onto the ground plane, and unites them: the union is the footprint, the building's outline in plan.

For an LoD1 or LoD2 building, the footprint is the outline of its walls, and its area the built-up area. Save Footprints as GeoPackage writes the footprints with height and area for the Geospatial Vector Files panel.
'''
wiki = "Measuring Buildings"

[[faq]]
question = "Why are the coordinates of a CityJSON file integers?"
answer = '''
A CityJSON file stores each vertex once, in the array vertices, as integers, and gives a transform with a scale and a translate for each axis: the real coordinate is the integer times the scale plus the translate. A scale of 0.001 keeps coordinates to the millimetre.

Integers make the file smaller and keep a fixed number of digits. The CityJSON tab applies the transform in SQL before building the geometries.
'''
wiki = "CityJSON"
hidden = true

[[faq]]
question = "What are the levels of detail of CityGML 2.0?"
answer = '''
CityGML 2.0 defines five levels of detail. LoD0 is a regional model, terrain and footprints or roof edges in 2.5D. LoD1 is the block model, buildings as prisms with flat roofs. LoD2 adds roof structures and thematic boundary surfaces, wall, roof and ground. LoD3 is the architectural model, with openings such as windows and doors. LoD4 adds interiors.

The same object may be represented at several levels of detail at once, and the standard gives each level its own accuracy, 5 m for LoD1 down to 0.2 m for LoD4.
'''
wiki = "Levels of Detail"
hidden = true

[[faq]]
question = "What do the city object types of CityJSON include?"
answer = '''
Every CityJSON city object has a type: Building, Bridge, CityFurniture, CityObjectGroup, GenericCityObject, LandUse, OtherConstruction, PlantCover, SolitaryVegetationObject, TINRelief, the transportation objects, Tunnel or WaterBody, and second-level types such as BuildingPart and BuildingInstallation, which need a parent.

Parents list their children and children their parents. File Contents counts the objects of each type and level of detail.
'''
wiki = "CityJSON"
hidden = true

