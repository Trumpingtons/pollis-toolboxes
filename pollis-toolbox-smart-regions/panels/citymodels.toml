[[actionGroups.actions]]
id = "building-measures"
label = "Building Measures"
desc = "For each object: the footprint area, the height, and the volume of the prism of footprint and height, with totals for the file"
code = '''
DBInterface.execute(con, """
CREATE OR REPLACE TABLE measures AS
WITH faces AS (SELECT id, UNNEST(ST_Dump(geom)).geom AS face, ST_ZMax(geom) - ST_ZMin(geom) AS height FROM features WHERE geom IS NOT NULL)
SELECT id, ST_Area(ST_Union_Agg(ST_Force2D(face))) AS footprint, any_value(height) AS height FROM faces WHERE ST_Area(ST_Force2D(face)) > 1e-6 GROUP BY id
""")  # the footprint is the union of the faces with an area in plan
m = Tables.columntable(DBInterface.execute(con, "SELECT id, round(footprint, 1) AS footprint, round(height, 2) AS height, round(footprint * height, 1) AS volume FROM measures ORDER BY volume DESC"))
w = maximum(length, m.id; init = 6) + 2  # the width of the longest identifier
println(rpad("object", w), rpad("footprint", 12), rpad("height", 10), "prism volume")
for i in 1:min(20, length(m.id))
	println(rpad(m.id[i], w), rpad(m.footprint[i], 12), rpad(m.height[i], 10), m.volume[i])
end
println("Totals over ", length(m.id), " objects: footprint ", round(sum(m.footprint), digits = 1), ", prism volume ", round(sum(m.volume), digits = 1), " (square and cubic units of the coordinate system)")
'''

