[[actionGroups.actions]]
id = "save-footprints"
label = "Save Footprints as GeoPackage"
desc = "Write each object's footprint, with its height and area, to a GeoPackage next to the file read, for the Geospatial Vector Files panel and any GIS"
code = '''
out = replace(path, r"(\.city)?\.json$|\.[^./]*$" => "") * "-footprints.gpkg"  # buildings.city.json gives buildings-footprints.gpkg
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, """
	COPY (
		WITH faces AS (SELECT id, UNNEST(ST_Dump(geom)).geom AS face, ST_ZMax(geom) - ST_ZMin(geom) AS height FROM features WHERE geom IS NOT NULL)
		SELECT id AS object_id, any_value(height) AS height, ST_Area(ST_Union_Agg(ST_Force2D(face))) AS area, ST_Union_Agg(ST_Force2D(face)) AS geom
		FROM faces WHERE ST_Area(ST_Force2D(face)) > 1e-6 GROUP BY id
	) TO '$(out)' (FORMAT GDAL, DRIVER 'GPKG', LAYER_NAME 'footprints'$(isempty(file_crs) ? "" : ", SRS '$(file_crs)'"))
	""")
	println("Wrote ", out)
end
'''

