[[actionGroups.actions]]
id = "geometry-check"
label = "Geometry Check"
desc = "Objects without geometry, the faces of each geometry, how many are vertical walls and how many have an area in plan, and objects with no face in plan"
code = '''
{{?model=citygml}}missing_geometry = Tables.columntable(DBInterface.execute(con, "SELECT count(*) FILTER (WHERE geom IS NULL OR ST_IsEmpty(geom)) AS n FROM features")).n[1]
{{?model=cityjson}}missing_geometry = Tables.columntable(DBInterface.execute(con, "SELECT count(*) AS n FROM $city, UNNEST(map_entries(CityObjects)) t(e) WHERE json_array_length(e.value->'\$.geometry') IS NULL OR json_array_length(e.value->'\$.geometry') = 0")).n[1]
c = Tables.columntable(DBInterface.execute(con, """
WITH faces AS (SELECT id, UNNEST(ST_Dump(geom)).geom AS face FROM features WHERE geom IS NOT NULL),
per AS (SELECT id, count(*) AS faces, count(*) FILTER (WHERE ST_Area(ST_Force2D(face)) <= 1e-6) AS walls FROM faces GROUP BY id)
SELECT count(*) AS objects, min(faces) AS fmin, round(avg(faces), 1) AS fmean, max(faces) AS fmax, sum(walls) AS walls, sum(faces - walls) AS flat, count(*) FILTER (WHERE faces = walls) AS no_plan FROM per
"""))
println("Objects without geometry: ", missing_geometry)
println("Objects with geometry: ", c.objects[1], "; faces per object from ", c.fmin[1], " to ", c.fmax[1], ", mean ", c.fmean[1])
println("Faces that are vertical walls: ", c.walls[1], "; faces with an area in plan (floors, roofs, slopes): ", c.flat[1])
println("Objects with no face in plan, so no footprint: ", c.no_plan[1])
'''

