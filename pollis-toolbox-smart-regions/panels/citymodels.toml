[[codeBranches]]
model = "citygml"
code = '''
using EzXML, DuckDB, Tables

con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the file stays where it is
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files
path = joinpath(folder, "{{gmlFile}}")  # an absolute path is kept as it is
{{?gmlFile=buildings.gml}}# Example file: three buildings in the centre of Coimbra in ETRS89 / Portugal TM06 (EPSG:3763), heights in metres, in CityGML 2.0: two LoD1 blocks, and a third both as an LoD1 block and in LoD2, with a gabled roof and its wall, roof and ground surfaces. Written to buildings.gml unless the folder has one already. Replace "buildings.gml" with your own file.
{{?gmlFile=buildings.gml}}if !isfile(path)
{{?gmlFile=buildings.gml}}	face(points) = "<gml:surfaceMember><gml:Polygon><gml:exterior><gml:LinearRing><gml:posList srsDimension=\"3\">" * join([join(p, " ") for p in [points; points[1:1]]], " ") * "</gml:posList></gml:LinearRing></gml:exterior></gml:Polygon></gml:surfaceMember>"
{{?gmlFile=buildings.gml}}	function block(x, y, w, d, h; ground = 60.0)  # an LoD1 solid of six faces: floor, roof and four walls
{{?gmlFile=buildings.gml}}		corners = [(x, y), (x + w, y), (x + w, y + d), (x, y + d)]
{{?gmlFile=buildings.gml}}		faces = [face([(c..., ground) for c in reverse(corners)]), face([(c..., ground + h) for c in corners])]
{{?gmlFile=buildings.gml}}		for i in 1:4
{{?gmlFile=buildings.gml}}			a, b = corners[i], corners[mod1(i + 1, 4)]
{{?gmlFile=buildings.gml}}			push!(faces, face([(a..., ground), (b..., ground), (b..., ground + h), (a..., ground + h)]))
{{?gmlFile=buildings.gml}}		end
{{?gmlFile=buildings.gml}}		return "<bldg:lod1Solid><gml:Solid><gml:exterior><gml:CompositeSurface>" * join(faces) * "</gml:CompositeSurface></gml:exterior></gml:Solid></bldg:lod1Solid>"
{{?gmlFile=buildings.gml}}	end
{{?gmlFile=buildings.gml}}	function gabled(x, y, w, d, eaves, ridge; ground = 60.0)  # LoD2 boundary surfaces: a ground surface, two roof planes and four walls, the ridge along x
{{?gmlFile=buildings.gml}}		surface(kind, polygons) = "<bldg:boundedBy><bldg:$kind><bldg:lod2MultiSurface><gml:MultiSurface>" * join(face.(polygons)) * "</gml:MultiSurface></bldg:lod2MultiSurface></bldg:$kind></bldg:boundedBy>"
{{?gmlFile=buildings.gml}}		e, r, m = ground + eaves, ground + ridge, y + d / 2
{{?gmlFile=buildings.gml}}		return join([surface("GroundSurface", [[(x, y, ground), (x, y + d, ground), (x + w, y + d, ground), (x + w, y, ground)]]),
{{?gmlFile=buildings.gml}}			surface("RoofSurface", [[(x, y, e), (x + w, y, e), (x + w, m, r), (x, m, r)], [(x, m, r), (x + w, m, r), (x + w, y + d, e), (x, y + d, e)]]),
{{?gmlFile=buildings.gml}}			surface("WallSurface", [[(x, y, ground), (x + w, y, ground), (x + w, y, e), (x, y, e)], [(x + w, y + d, ground), (x, y + d, ground), (x, y + d, e), (x + w, y + d, e)],
{{?gmlFile=buildings.gml}}				[(x, y + d, ground), (x, y, ground), (x, y, e), (x, m, r), (x, y + d, e)], [(x + w, y, ground), (x + w, y + d, ground), (x + w, y + d, e), (x + w, m, r), (x + w, y, e)]])])
{{?gmlFile=buildings.gml}}	end
{{?gmlFile=buildings.gml}}	blocks = [("B1", -23640.0, 59420.0, 20.0, 12.0, 15.0, 15.0, "residential", 1965, 5), ("B2", -23610.0, 59420.0, 18.0, 18.0, 9.0, 9.0, "office", 1990, 3), ("B3", -23640.0, 59445.0, 30.0, 10.0, 22.0, 24.5, "residential", 2008, 8)]  # id, west edge, south edge, width, depth, LoD1 height, measured height, function, year, storeys
{{?gmlFile=buildings.gml}}	members = ["<core:cityObjectMember><bldg:Building gml:id=\"$id\"><bldg:function>$fn</bldg:function><bldg:yearOfConstruction>$year</bldg:yearOfConstruction><bldg:measuredHeight uom=\"m\">$measured</bldg:measuredHeight><bldg:storeysAboveGround>$storeys</bldg:storeysAboveGround>$(block(x, y, w, d, h))$(id == "B3" ? gabled(x, y, w, d, 20.0, measured) : "")</bldg:Building></core:cityObjectMember>" for (id, x, y, w, d, h, measured, fn, year, storeys) in blocks]
{{?gmlFile=buildings.gml}}	write(path, join(["<?xml version=\"1.0\" encoding=\"UTF-8\"?>", "<core:CityModel xmlns:core=\"http://www.opengis.net/citygml/2.0\" xmlns:bldg=\"http://www.opengis.net/citygml/building/2.0\" xmlns:gml=\"http://www.opengis.net/gml\">", "<gml:boundedBy><gml:Envelope srsName=\"EPSG:3763\" srsDimension=\"3\"><gml:lowerCorner>-23640 59420 60</gml:lowerCorner><gml:upperCorner>-23592 59455 84.5</gml:upperCorner></gml:Envelope></gml:boundedBy>", members..., "</core:CityModel>"], "\n"))
{{?gmlFile=buildings.gml}}end

doc = readxml(path)  # the whole XML tree
nons = Pair{String, String}[]  # XPath below matches elements by local-name(), without namespace prefixes, so CityGML 1.0, 2.0 and 3.0 read alike
function rings(polygon)  # the exterior and interior rings of a gml:Polygon or gml:Triangle, as WKT
	map(findall("./*[local-name()='exterior' or local-name()='interior']", polygon, nons)) do boundary
		coordinates = findall(".//*[local-name()='posList' or local-name()='pos']", boundary, nons)
		dim = haskey(first(coordinates), "srsDimension") ? parse(Int, first(coordinates)["srsDimension"]) : 3  # 3D unless the file says 2D
		v = parse.(Float64, split(join(nodecontent.(coordinates), " ")))
		"(" * join([join(dim == 3 ? v[i:i + 2] : [v[i], v[i + 1], 0.0], " ") for i in 1:dim:length(v) - dim + 1], ", ") * ")"
	end
end
pick = "{{lod}}" == "highest" ? maximum : minimum  # keep each object's geometry of the highest or the lowest level of detail
objects, attrs, classes = [], [], Dict{String, Tuple{Int, Set{Int}}}()  # the objects read, their attributes, and every class of the file with its objects and levels of detail
for member in findall("./*[local-name()='cityObjectMember']/*", root(doc), nons)  # the top-level city objects
	levels = Dict{Int, Vector{String}}()  # the polygons under each level's geometry properties: lod1Solid, lod2MultiSurface of the boundary surfaces, those of building parts, ...
	names = Dict{Int, Set{String}}()
	for property in findall(".//*[starts-with(local-name(), 'lod') and not(contains(local-name(), 'Implicit'))]", member, nons)
		level = match(r"^lod(\d)", nodename(property))
		level === nothing && continue
		polygons = ["(" * join(rings(p), ", ") * ")" for p in findall(".//*[local-name()='Polygon' or local-name()='Triangle']", property, nons)]
		isempty(polygons) && continue  # a property given only by xlink:href to polygons read elsewhere
		append!(get!(levels, parse(Int, level[1]), String[]), polygons)
		push!(get!(names, parse(Int, level[1]), Set{String}()), nodename(property))
	end
	n, seen = get(classes, nodename(member), (0, Set{Int}()))
	classes[nodename(member)] = (n + 1, union(seen, keys(levels)))
	nodename(member) == "{{gmlClass}}" || continue
	id = haskey(member, "gml:id") ? member["gml:id"] : string("object ", length(objects) + 1)
	kept = isempty(levels) ? nothing : pick(keys(levels))
	push!(objects, (id, nodename(member), kept === nothing ? missing : string(kept), kept === nothing ? missing : join(sort(collect(names[kept])), ", "), kept === nothing ? missing : "MULTIPOLYGON Z (" * join(levels[kept], ", ") * ")"))
	for e in eachelement(member)  # attributes: elements with text only, and generic attributes
		if countelements(e) == 0 && !isempty(strip(nodecontent(e)))
			push!(attrs, (id, nodename(e), strip(nodecontent(e))))
		elseif haskey(e, "name") && countelements(e) == 1 && nodename(firstelement(e)) == "value"  # CityGML 2.0: <gen:stringAttribute name="..."><gen:value>
			push!(attrs, (id, e["name"], strip(nodecontent(firstelement(e)))))
		elseif nodename(e) == "genericAttribute" && countelements(e) == 1  # CityGML 3.0: <core:genericAttribute><gen:StringAttribute><gen:name>, <gen:value>
			g = Dict(nodename(c) => strip(nodecontent(c)) for c in eachelement(firstelement(e)))
			haskey(g, "name") && haskey(g, "value") && push!(attrs, (id, g["name"], g["value"]))
		end
	end
end
DBInterface.execute(con, "CREATE OR REPLACE TABLE objects (id VARCHAR, type VARCHAR, lod VARCHAR, geometry_type VARCHAR, wkt VARCHAR)")
DBInterface.execute(con, "CREATE OR REPLACE TABLE attrs (id VARCHAR, name VARCHAR, value VARCHAR)")
for (table, rows) in (("objects", objects), ("attrs", attrs))
	appender = DuckDB.Appender(con, table)  # row by row into DuckDB
	for row in rows
		foreach(x -> DuckDB.append(appender, x), row)
		DuckDB.end_row(appender)
	end
	DuckDB.close(appender)
end
DBInterface.execute(con, "CREATE OR REPLACE TABLE features AS SELECT o.id, o.type, a.attributes, o.lod, o.geometry_type, ST_GeomFromText(o.wkt) AS geom FROM objects o LEFT JOIN (SELECT id, json_group_object(name, value) AS attributes FROM attrs GROUP BY id) a USING (id)")  # one row per city object, with its attributes as JSON and its geometry as a MultiPolygon Z, one polygon per face
srs = findfirst("//*[@srsName]", root(doc), nons)  # the first srsName of the file, usually on the envelope of the whole model
{{?fileCrs=file}}code = srs === nothing ? nothing : match(r"EPSG[:/]+(?:[\d.]*[:/]+)?(\d+)", srs["srsName"])
{{?fileCrs=file}}file_crs = code === nothing ? "" : "EPSG:" * code[1]  # the first EPSG code: EPSG:3763, urn:ogc:def:crs:EPSG::25832, a compound urn:ogc:def:crs,crs:EPSG::25832,crs:EPSG::7837
{{?fileCrs!=file}}file_crs = "{{fileCrs}}"
println(length(objects), " objects of class {{gmlClass}}, ", count(o -> !ismissing(o[5]), objects), " with geometry; srsName ", srs === nothing ? "none recorded" : srs["srsName"], ", coordinate system ", isempty(file_crs) ? "none recognised" : file_crs)
'''

[[codeBranches]]
model = "cityjson"
code = '''
using DuckDB, Tables

con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the file stays where it is
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files
path = joinpath(folder, "{{jsonFile}}")  # an absolute path is kept as it is
{{?jsonFile=buildings.city.json}}# Example file: three buildings in the centre of Coimbra as LoD1 blocks, flat roofs over straight walls, in ETRS89 / Portugal TM06 (EPSG:3763) with heights in metres, in CityJSON 2.0, written to buildings.city.json unless the folder has one already. Replace "buildings.city.json" with your own file.
{{?jsonFile=buildings.city.json}}if !isfile(path)
{{?jsonFile=buildings.city.json}}	blocks = [("B1", -23640.0, 59420.0, 20.0, 12.0, 15.0, "residential", 1965, 5), ("B2", -23610.0, 59420.0, 18.0, 18.0, 9.0, "office", 1990, 3), ("B3", -23640.0, 59445.0, 30.0, 10.0, 24.5, "residential", 2008, 8)]  # id, west edge, south edge, width, depth, height, function, year, storeys
{{?jsonFile=buildings.city.json}}	vertices, objects = String[], String[]
{{?jsonFile=buildings.city.json}}	for (id, x, y, w, d, h, fn, year, storeys) in blocks
{{?jsonFile=buildings.city.json}}		first_vertex = length(vertices)  # vertices are numbered from 0, shared by all objects
{{?jsonFile=buildings.city.json}}		for z in (60.0, 60.0 + h), (cx, cy) in ((x, y), (x + w, y), (x + w, y + d), (x, y + d))
{{?jsonFile=buildings.city.json}}			push!(vertices, "[$(round(Int, (cx + 24000) * 1000)), $(round(Int, (cy - 59000) * 1000)), $(round(Int, z * 1000))]")  # integers in millimetres from the translate
{{?jsonFile=buildings.city.json}}		end
{{?jsonFile=buildings.city.json}}		floor, roof = collect(first_vertex .+ (0:3)), collect(first_vertex .+ (4:7))
{{?jsonFile=buildings.city.json}}		surfaces = [[reverse(floor)], [roof]]
{{?jsonFile=buildings.city.json}}		for i in 1:4
{{?jsonFile=buildings.city.json}}			j = mod1(i + 1, 4)
{{?jsonFile=buildings.city.json}}			push!(surfaces, [[floor[i], floor[j], roof[j], roof[i]]])  # a wall
{{?jsonFile=buildings.city.json}}		end
{{?jsonFile=buildings.city.json}}		push!(objects, "\"$id\": {\"type\": \"Building\", \"attributes\": {\"function\": \"$fn\", \"yearOfConstruction\": $year, \"measuredHeight\": $h, \"storeysAboveGround\": $storeys}, \"geometry\": [{\"type\": \"Solid\", \"lod\": \"1\", \"boundaries\": [$(string(surfaces))]}]}")
{{?jsonFile=buildings.city.json}}	end
{{?jsonFile=buildings.city.json}}	write(path, "{\"type\": \"CityJSON\", \"version\": \"2.0\", \"transform\": {\"scale\": [0.001, 0.001, 0.001], \"translate\": [-24000.0, 59000.0, 0.0]}, \"metadata\": {\"referenceSystem\": \"https://www.opengis.net/def/crs/EPSG/0/3763\"}, \"CityObjects\": {$(join(objects, ", "))}, \"vertices\": [$(join(vertices, ", "))]}")
{{?jsonFile=buildings.city.json}}end

order = "{{lod}}" == "highest" ? "DESC" : "ASC"  # keep each object's geometry of the highest or the lowest level of detail
city = "read_json('$(path)', columns = {version: 'VARCHAR', metadata: 'JSON', transform: 'STRUCT(scale DOUBLE[], translate DOUBLE[])', CityObjects: 'MAP(VARCHAR, JSON)', vertices: 'BIGINT[][]'}, maximum_object_size = 1000000000)"  # the whole file is one JSON object, read whole up to 1 GB
DBInterface.execute(con, """
CREATE OR REPLACE TABLE features AS
WITH file AS (SELECT * FROM $city),
v AS (SELECT list_transform(vertices, lambda p: [p[1] * transform.scale[1] + transform.translate[1], p[2] * transform.scale[2] + transform.translate[2], p[3] * transform.scale[3] + transform.translate[3]]) AS xyz FROM file),
objects AS (SELECT e.key AS id, e.value AS obj FROM file, UNNEST(map_entries(CityObjects)) t(e) WHERE '{{jsonType}}' = 'all' OR e.value->>'\$.type' = '{{jsonType}}'),
geometries AS (SELECT id, obj, UNNEST(CAST(obj->'\$.geometry' AS JSON[])) AS g FROM objects),
kept AS (SELECT *, row_number() OVER (PARTITION BY id ORDER BY TRY_CAST(g->>'\$.lod' AS DOUBLE) $order) AS k FROM geometries WHERE g->>'\$.type' IN ('MultiSurface', 'CompositeSurface', 'Solid', 'MultiSolid', 'CompositeSolid'))
SELECT id, obj->>'\$.type' AS type, obj->'\$.attributes' AS attributes, g->>'\$.lod' AS lod, g->>'\$.type' AS geometry_type,
	ST_GeomFromText('MULTIPOLYGON Z (' || array_to_string(list_transform(
		CASE g->>'\$.type' WHEN 'Solid' THEN flatten(CAST(g->'\$.boundaries' AS BIGINT[][][][])) WHEN 'MultiSolid' THEN flatten(flatten(CAST(g->'\$.boundaries' AS BIGINT[][][][][]))) WHEN 'CompositeSolid' THEN flatten(flatten(CAST(g->'\$.boundaries' AS BIGINT[][][][][]))) ELSE CAST(g->'\$.boundaries' AS BIGINT[][][]) END,  -- solids and their shells, flattened into their surfaces
		lambda surface: '(' || array_to_string(list_transform(surface, lambda ring: '(' || array_to_string(list_transform(ring || [ring[1]], lambda i: array_to_string(v.xyz[i + 1], ' ')), ', ') || ')'), ', ') || ')'), ', ') || ')') AS geom
FROM kept, v WHERE k = 1
""")  # one row per city object, with the geometry of the level of detail chosen, as a MultiPolygon Z, one polygon per surface
header = Tables.columntable(DBInterface.execute(con, "SELECT version, metadata->>'\$.referenceSystem' AS crs, len(vertices) AS n FROM $city"))
{{?fileCrs=file}}file_crs = ismissing(header.crs[1]) ? "" : "EPSG:" * match(r"(\d+)\D*$", header.crs[1])[1]  # the EPSG code at the end of the referenceSystem the file records
{{?fileCrs!=file}}file_crs = "{{fileCrs}}"
tbl = Tables.columntable(DBInterface.execute(con, "SELECT id, type, lod, geometry_type, attributes FROM features"))
println("CityJSON ", header.version[1], ": ", length(tbl.id), " objects with geometry, ", header.n[1], " vertices, coordinate system ", isempty(file_crs) ? "none recorded" : file_crs)
'''

