[[actionGroups.actions]]
id = "show-on-map"
label = "Show on a Map"
desc = "The footprints of the objects on an OpenStreetMap base map in Pollis's map view, coloured by height; click one for its attributes"
code = '''
if isempty(file_crs)
	println("The file records no coordinate system: give its EPSG code in the File Coordinate System input")
else
	shown = joinpath(mktempdir(), "footprints.geojson")
	DBInterface.execute(con, """
	COPY (
		WITH faces AS (SELECT id, UNNEST(ST_Dump(geom)).geom AS face, ST_ZMax(geom) - ST_ZMin(geom) AS height FROM features WHERE geom IS NOT NULL)
		SELECT id, round(any_value(height), 2) AS height, ST_Transform(ST_Union_Agg(ST_Force2D(face)), '$(file_crs)', 'EPSG:4326') AS geom
		FROM faces WHERE ST_Area(ST_Force2D(face)) > 1e-6 GROUP BY id
	) TO '$(shown)' (FORMAT GDAL, DRIVER 'GeoJSON')
	""")  # the faces with an area in plan, vertical walls left out, united into a footprint
	display(Pollis.webmap(Pollis.layer(shown; name = "Footprints", column = "height", opacity = 0.75)))
end
'''

[[actionGroups.actions]]
id = "heights-chart"
label = "Heights of the Objects"
desc = "How tall the objects are, from the lowest to the highest point of each geometry, as a histogram drawn with ECharts"
code = '''
using ECharts

h = Tables.columntable(DBInterface.execute(con, "SELECT ST_ZMax(geom) - ST_ZMin(geom) AS height FROM features WHERE geom IS NOT NULL")).height
width = max(1.0, ceil((maximum(h) - minimum(h)) / 30))  # about 30 bins of whole metres
lo = floor(minimum(h))
bins = Dict{Float64, Int}()
for x in h
	b = lo + width * floor((x - lo) / width)
	bins[b] = get(bins, b, 0) + 1
end
EChart(ec_width = 700, ec_height = 400, title = [ECharts.Title(text = "Heights of $(length(h)) objects")],
	xAxis = [ECharts.Axis(_type = "value", name = "Height", scale = true)], yAxis = [ECharts.Axis(_type = "value", name = "Objects")],
	series = [ECharts.XYSeries(name = "Objects", _type = "bar", data = [[b + width / 2, c] for (b, c) in sort(collect(bins))])])
'''

