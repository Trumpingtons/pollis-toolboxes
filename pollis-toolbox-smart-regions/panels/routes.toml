[[codeBranches]]
model = "route"
code = '''
using DuckDB, Tables, SmartRegions, Graphs

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))
place = mkpath(joinpath(folder, "routes"))  # where the networks downloaded are kept, and the Next Steps save their files
city, mode = "{{city}}", "{{mode}}"
presets = Dict("cambridge" => (area = "0.105, 52.188, 0.145, 52.216", origin = "0.13772, 52.19411", destination = "0.11654, 52.20478", county = "cambridgeshire"),
	"oxford" => (area = "-1.275, 51.745, -1.240, 51.762", origin = "-1.26995, 51.75345", destination = "-1.25399, 51.75344", county = "oxfordshire"))  # the stations, King's College Chapel and the Radcliffe Camera
chosen = city == "custom" ? (area = raw"{{area}}", origin = raw"{{origin}}", destination = raw"{{destination}}", county = "") : presets[city]
west, south, east, north = parse.(Float64, split(chosen.area, ","))  # the area, in degrees of longitude and latitude
area = "ST_MakeEnvelope($(west), $(south), $(east), $(north))"
lonlat(text) = Tuple(parse.(Float64, split(text, ",")))
pbf = "{{source}}" == "overpass" ? nothing : raw"{{pbfFile}}" == "auto" ? joinpath(folder, "$(chosen.county)-latest.osm.pbf") : joinpath(folder, raw"{{pbfFile}}")  # an absolute path is kept as it is
if pbf !== nothing && raw"{{pbfFile}}" == "auto"  # Geofabrik's extract of the county, downloaded once, © OpenStreetMap contributors, ODbL
	city == "custom" && error("Give the PBF File of the Area: auto downloads only the extracts of Cambridgeshire and Oxfordshire")
	geofabrik_file("https://download.geofabrik.de/europe/united-kingdom/england/$(chosen.county)/$(chosen.county)-latest.osm.pbf", pbf) || error("Geofabrik has no extract of $(chosen.county)")
end
osm_streets(con, (west, south, east, north); pbf, folder = place)  # the ways with a highway tag over the area, from Overpass (kept in the folder) or the PBF file, cut into segments: the tables ways, points and segments
net = street_network(con, mode)  # the directed graph of the streets the mode may use, with the seconds and metres of each edge, and the table network
(origin_lon, origin_lat), (destination_lon, destination_lat) = lonlat(chosen.origin), lonlat(chosen.destination)
from, from_off = nearest_node(con, net, origin_lon, origin_lat)  # the node of the largest strongly connected part nearest to the point, and its distance in metres
to, to_off = nearest_node(con, net, destination_lon, destination_lat)
snapped = [("Origin", origin_lon, origin_lat, from, from_off), ("Destination", destination_lon, destination_lat, to, to_off)]
from == to && error("The Origin and the Destination are nearest the same node: move one of them")
path, minutes, km = fastest_route(net, from, to)  # by Dijkstra's algorithm on the seconds of the edges
DBInterface.execute(con, "CREATE OR REPLACE TABLE route AS SELECT ? AS mode, ? AS minutes, ? AS km, ST_GeomFromText(?) AS geom", [mode, minutes, km, "LINESTRING($(join(["$(net.lon[k]) $(net.lat[k])" for k in path], ", ")))"])
kept = ["route", "network"]  # the tables Save as GeoParquet writes
println("Fastest route to ", mode, ": ", round(minutes; digits = 1), " minutes, ", round(km; digits = 2), " km, through ", length(path), " nodes of a network of ", nv(net.g), " nodes and ", ne(net.g), " directed edges")
'''

[[codeBranches]]
model = "reach"
code = '''
using DuckDB, Tables, SmartRegions, Graphs

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))
place = mkpath(joinpath(folder, "routes"))  # where the networks downloaded are kept, and the Next Steps save their files
city, mode = "{{city}}", "{{mode}}"
presets = Dict("cambridge" => (area = "0.105, 52.188, 0.145, 52.216", origin = "0.13772, 52.19411", county = "cambridgeshire"),
	"oxford" => (area = "-1.275, 51.745, -1.240, 51.762", origin = "-1.26995, 51.75345", county = "oxfordshire"))  # from the stations
chosen = city == "custom" ? (area = raw"{{area}}", origin = raw"{{origin}}", county = "") : presets[city]
west, south, east, north = parse.(Float64, split(chosen.area, ","))  # the area, in degrees of longitude and latitude
area = "ST_MakeEnvelope($(west), $(south), $(east), $(north))"
lonlat(text) = Tuple(parse.(Float64, split(text, ",")))
pbf = "{{source}}" == "overpass" ? nothing : raw"{{pbfFile}}" == "auto" ? joinpath(folder, "$(chosen.county)-latest.osm.pbf") : joinpath(folder, raw"{{pbfFile}}")  # an absolute path is kept as it is
if pbf !== nothing && raw"{{pbfFile}}" == "auto"  # Geofabrik's extract of the county, downloaded once, © OpenStreetMap contributors, ODbL
	city == "custom" && error("Give the PBF File of the Area: auto downloads only the extracts of Cambridgeshire and Oxfordshire")
	geofabrik_file("https://download.geofabrik.de/europe/united-kingdom/england/$(chosen.county)/$(chosen.county)-latest.osm.pbf", pbf) || error("Geofabrik has no extract of $(chosen.county)")
end
osm_streets(con, (west, south, east, north); pbf, folder = place)  # the ways with a highway tag over the area, from Overpass (kept in the folder) or the PBF file, cut into segments: the tables ways, points and segments
net = street_network(con, mode)  # the directed graph of the streets the mode may use, with the seconds and metres of each edge, and the table network
bands = sort(parse.(Float64, split("{{bands}}", ",")))  # the travel times, in minutes
minutes_text(b) = isinteger(b) ? string(Int(b)) : string(b)
origin_lon, origin_lat = lonlat(chosen.origin)
from, from_off = nearest_node(con, net, origin_lon, origin_lat)  # the node of the largest strongly connected part nearest to the point, and its distance in metres
snapped = [("Origin", origin_lon, origin_lat, from, from_off)]
travel_times(con, net, from, maximum(bands))  # the seconds to every node reached within the longest band, as the table reached
DBInterface.execute(con, "CREATE OR REPLACE TABLE reach AS SELECT *, round(ST_Area_Spheroid(geom) / 1e6, 3) AS km2 FROM ($(service_areas("reached", mode, bands))) ORDER BY band")
kept = ["reach", "network"]  # the tables Save as GeoParquet writes
r = query("SELECT band, km2, street_km, nodes FROM reach ORDER BY band")
println("Reached from the Origin by ", mode, ", on a network of ", nv(net.g), " nodes:")
for i in eachindex(r.band)
	println("  within ", lpad(minutes_text(r.band[i]), 4), " minutes: ", lpad(r.km2[i], 7), " km², ", lpad(r.street_km[i], 7), " km of street, ", r.nodes[i], " nodes")
end
'''

[[codeBranches]]
model = "matrix"
code = '''
using DuckDB, Tables, SmartRegions, Graphs

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))
place = mkpath(joinpath(folder, "routes"))  # where the networks downloaded are kept, and the Next Steps save their files
city, mode = "{{city}}", "{{mode}}"
presets = Dict("cambridge" => (area = "0.105, 52.188, 0.145, 52.216", county = "cambridgeshire",
		places = "Cambridge Station: 0.13772, 52.19411; King's College Chapel: 0.11654, 52.20478; Fitzwilliam Museum: 0.11977, 52.19985; Parker's Piece: 0.12817, 52.20199; Jesus Green: 0.12281, 52.21167"),
	"oxford" => (area = "-1.275, 51.745, -1.240, 51.762", county = "oxfordshire",
		places = "Oxford Station: -1.26995, 51.75345; Radcliffe Camera: -1.25399, 51.75344; Ashmolean Museum: -1.26038, 51.75549; Carfax Tower: -1.25815, 51.75196; Christ Church: -1.25523, 51.75005"))
chosen = city == "custom" ? (area = raw"{{area}}", places = raw"{{places}}", county = "") : presets[city]
west, south, east, north = parse.(Float64, split(chosen.area, ","))  # the area, in degrees of longitude and latitude
area = "ST_MakeEnvelope($(west), $(south), $(east), $(north))"
lonlat(text) = Tuple(parse.(Float64, split(text, ",")))
pbf = "{{source}}" == "overpass" ? nothing : raw"{{pbfFile}}" == "auto" ? joinpath(folder, "$(chosen.county)-latest.osm.pbf") : joinpath(folder, raw"{{pbfFile}}")  # an absolute path is kept as it is
if pbf !== nothing && raw"{{pbfFile}}" == "auto"  # Geofabrik's extract of the county, downloaded once, © OpenStreetMap contributors, ODbL
	city == "custom" && error("Give the PBF File of the Area: auto downloads only the extracts of Cambridgeshire and Oxfordshire")
	geofabrik_file("https://download.geofabrik.de/europe/united-kingdom/england/$(chosen.county)/$(chosen.county)-latest.osm.pbf", pbf) || error("Geofabrik has no extract of $(chosen.county)")
end
osm_streets(con, (west, south, east, north); pbf, folder = place)  # the ways with a highway tag over the area, from Overpass (kept in the folder) or the PBF file, cut into segments: the tables ways, points and segments
net = street_network(con, mode)  # the directed graph of the streets the mode may use, with the seconds and metres of each edge, and the table network
named = [(String(strip(first(split(p, ":")))), lonlat(last(split(p, ":")))...) for p in split(chosen.places, ";") if occursin(":", p)]  # name, longitude, latitude
length(named) < 2 && error("Give at least two Places, each as Name: longitude, latitude")
snapped = [(name, x, y, nearest_node(con, net, x, y)...) for (name, x, y) in named]  # name, longitude, latitude, node, metres to the node
minutes, km = travel_matrix(net, [s[4] for s in snapped])  # the fastest path between every pair, Inf where there is none
rows = ["('$(replace(snapped[i][1], "'" => "''"))', '$(replace(snapped[j][1], "'" => "''"))', $(isfinite(minutes[i, j]) ? minutes[i, j] : "NULL"), $(isfinite(km[i, j]) ? km[i, j] : "NULL"), $(snapped[i][2]), $(snapped[i][3]), $(snapped[j][2]), $(snapped[j][3]))" for i in eachindex(snapped), j in eachindex(snapped) if i != j]
DBInterface.execute(con, "CREATE OR REPLACE TABLE matrix AS SELECT origin, destination, round(minutes, 2) AS minutes, round(km, 3) AS km, round(ST_Distance_Spheroid(ST_Point(x0, y0), ST_Point(x1, y1)) / 1000, 3) AS straight_km FROM (VALUES $(join(rows, ", "))) t(origin, destination, minutes, km, x0, y0, x1, y1)")
kept = ["matrix", "network"]  # the tables Save as GeoParquet writes
println("Minutes by ", mode, " from each place (rows) to each place (columns):")
println(rpad("", 24), join([lpad(first(s[1], 10), 11) for s in snapped]))
for i in eachindex(snapped)
	println(rpad(first(snapped[i][1], 23), 24), join([lpad(i == j ? "-" : isfinite(minutes[i, j]) ? string(round(minutes[i, j]; digits = 1)) : "none", 11) for j in eachindex(snapped)]))
end
'''

[[codeBranches]]
model = "measures"
code = '''
using DuckDB, Tables, SmartRegions, Graphs

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))
place = mkpath(joinpath(folder, "routes"))  # where the networks downloaded are kept, and the Next Steps save their files
city, mode = "{{city}}", "{{mode}}"
presets = Dict("cambridge" => (area = "0.105, 52.188, 0.145, 52.216", county = "cambridgeshire"), "oxford" => (area = "-1.275, 51.745, -1.240, 51.762", county = "oxfordshire"))
chosen = city == "custom" ? (area = raw"{{area}}", county = "") : presets[city]
west, south, east, north = parse.(Float64, split(chosen.area, ","))  # the area, in degrees of longitude and latitude
area = "ST_MakeEnvelope($(west), $(south), $(east), $(north))"
pbf = "{{source}}" == "overpass" ? nothing : raw"{{pbfFile}}" == "auto" ? joinpath(folder, "$(chosen.county)-latest.osm.pbf") : joinpath(folder, raw"{{pbfFile}}")  # an absolute path is kept as it is
if pbf !== nothing && raw"{{pbfFile}}" == "auto"  # Geofabrik's extract of the county, downloaded once, © OpenStreetMap contributors, ODbL
	city == "custom" && error("Give the PBF File of the Area: auto downloads only the extracts of Cambridgeshire and Oxfordshire")
	geofabrik_file("https://download.geofabrik.de/europe/united-kingdom/england/$(chosen.county)/$(chosen.county)-latest.osm.pbf", pbf) || error("Geofabrik has no extract of $(chosen.county)")
end
osm_streets(con, (west, south, east, north); pbf, folder = place)  # the ways with a highway tag over the area, from Overpass (kept in the folder) or the PBF file, cut into segments: the tables ways, points and segments
net = street_network(con, mode)  # the directed graph of the streets the mode may use, with the seconds and metres of each edge, and the table network
streets = SimpleGraph(net.g)  # the same nodes, each pair of neighbours joined once, whatever the direction
degrees = degree(streets)
parts = connected_components(streets)
samples = "{{samples}}"
k = samples == "all" ? nv(net.g) : min(nv(net.g), parse(Int, samples))
betweenness = k == nv(net.g) ? betweenness_centrality(net.g, vertices(net.g), net.seconds) : betweenness_centrality(net.g, k, net.seconds; seed = 1)  # the share of fastest paths through each node; from k nodes drawn with a fixed seed
csv = tempname() * ".csv"
write(csv, "id,degree,betweenness\n" * join(["$(net.ids[v]),$(degrees[v]),$(betweenness[v])" for v in vertices(net.g)], "\n"))
DBInterface.execute(con, "CREATE OR REPLACE TABLE nodes AS SELECT c.*, ST_Point(p.lon, p.lat) AS geom FROM read_csv('$(csv)', columns = {'id': 'BIGINT', 'degree': 'INTEGER', 'betweenness': 'DOUBLE'}, header = true) c JOIN points p USING (id)")
DBInterface.execute(con, "CREATE OR REPLACE TABLE network AS SELECT n.*, (na.betweenness + nb.betweenness) / 2 AS betweenness FROM network n JOIN nodes na ON na.id = n.a JOIN nodes nb ON nb.id = n.b")  # each segment, with the mean betweenness of its ends
km2 = only(query("SELECT ST_Area_Spheroid($(area)) / 1e6 AS a").a)
street_km = only(query("SELECT sum(metres) / 1000 AS km FROM network").km)
kept = ["nodes", "network"]  # the tables Save as GeoParquet writes
println("Network of ", mode, " over ", round(km2; digits = 2), " km²: ", round(street_km; digits = 1), " km of street, ", nv(streets), " nodes, ", ne(streets), " links")
println("  intersections (3 links or more): ", count(>=(3), degrees), ", ", round(count(>=(3), degrees) / km2; digits = 1), " per km²; dead ends: ", count(==(1), degrees))
println("  mean links per node: ", round(2 * ne(streets) / nv(streets); digits = 2), "; connected parts: ", length(parts), ", the largest with ", round(100 * maximum(length, parts) / nv(streets); digits = 1), "% of the nodes")
println("  betweenness from ", k, " of the ", nv(net.g), " nodes", k < nv(net.g) ? " (a sample, seed 1)" : "", "; largest ", round(maximum(betweenness); digits = 4))
'''

