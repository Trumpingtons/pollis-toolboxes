[[actionGroups.actions]]
id = "street-orientation"
label = "Street Orientation"
desc = "The compass bearings of the streets, weighted by their length, in 36 bins of 10 degrees, as a polar chart drawn with ECharts, with the entropy of the orientations and their order, from 0 (no order) to 1 (a single grid)"
models = ["measures"]
code = '''
using ECharts

b = query("SELECT metres, ST_X(ST_StartPoint(geom)) AS x0, ST_Y(ST_StartPoint(geom)) AS y0, ST_X(ST_EndPoint(geom)) AS x1, ST_Y(ST_EndPoint(geom)) AS y1 FROM network")
bearing = [mod(atand(sind(b.x1[i] - b.x0[i]) * cosd(b.y1[i]), cosd(b.y0[i]) * sind(b.y1[i]) - sind(b.y0[i]) * cosd(b.y1[i]) * cosd(b.x1[i] - b.x0[i])), 360) for i in eachindex(b.metres)]  # the initial bearing of each segment
weights, drawn = zeros(36), zeros(36)
for i in eachindex(bearing), angle in (bearing[i], mod(bearing[i] + 180, 360))  # each street counted in both directions
	weights[mod(round(Int, angle / 10), 36) + 1] += b.metres[i]  # bins centred on 0, 10, 20... degrees, for the entropy
	drawn[floor(Int, angle / 10) + 1] += b.metres[i]  # bins from 0 to 10, 10 to 20... degrees, as the chart draws them
end
p = weights ./ sum(weights)
entropy = -sum(x * log(x) for x in p if x > 0)
order = 1 - ((entropy - 1.386) / (log(36) - 1.386))^2  # Boeing's orientation order: 1.386 is the entropy of a perfect grid, log(36) that of uniform bearings
println("Orientation entropy ", round(entropy; digits = 3), " (at most ", round(log(36); digits = 3), "); orientation order ", round(order; digits = 3))
EChart(ec_width = 520, ec_height = 520, title = [ECharts.Title(text = "Street Orientation, $(mode)")], tooltip = ECharts.Tooltip(), polar = ECharts.Polar(),
	angleAxis = ECharts.AngleAxis(_type = "category", data = string.(0:10:350), startAngle = 90, clockwise = true, boundaryGap = false, axisLine = ECharts.AxisLine(show = false)), radiusAxis = ECharts.RadiusAxis(axisLabel = ECharts.AxisLabel(show = false), axisLine = ECharts.AxisLine(show = false), axisTick = ECharts.AxisTick(show = false)),
	series = [ECharts.XYSeries(name = "Share of length", _type = "bar", coordinateSystem = "polar", data = round.(drawn ./ sum(drawn); digits = 4))])
'''

