[[faq]]
question = "Where does the street network come from?"
answer = '''
From OpenStreetMap: by default, the ways with a highway tag over the Area, downloaded from the Overpass API and kept in the folder; or, with Network From set to PBF File, read from an extract such as those of Geofabrik. No account or key is needed.
'''
wiki = "Building the Network"

[[faq]]
question = "How does the panel decide which streets a mode can use?"
answer = '''
Walk uses footways, paths, steps and the roads other than motorways, in both directions, at 4.8 km/h; Cycle uses cycleways, paths and roads, and footways where cycling is allowed, respecting one-way streets unless they are open to cycles, at 15 km/h; Drive uses the roads open to motor vehicles, respecting one-way streets, at their speed limit or a speed for their class. Ways tagged private or closed to the mode are left out.
'''
wiki = "Building the Network"

[[faq]]
question = "What is a service area?"
answer = '''
The part of the network reachable from the Origin within a travel time, drawn as an area around the street points reached in each of the Time Bands, with its size and the length of street it contains.
'''
wiki = "Service Areas"

[[faq]]
question = "Why is the betweenness computed on a sample?"
answer = '''
Betweenness needs a shortest-path search from every node, which is slow on a city's network; from a random sample of nodes, with a fixed seed, it gives an estimate. Betweenness Sample sets how many, or all the nodes.
'''
wiki = "Network Measures"
hidden = true

[[faq]]
question = "Why does the route start on a different street from the Origin?"
answer = '''
The Origin, the Destination and the Places are snapped to the nearest node of the largest part of the network the mode can travel in both directions. Snapping Distances shows how far each point is from its node.
'''
wiki = "Diagnostics"
hidden = true

