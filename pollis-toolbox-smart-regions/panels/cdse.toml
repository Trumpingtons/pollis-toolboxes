[[codeBranches]]
model = "find"
code = '''
using DuckDB, Tables, Downloads

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
query(sql) = Tables.columntable(DBInterface.execute(con, sql))
folder = mkpath(expanduser(raw"{{folder}}"))  # where the Next Steps save their files
west, south, east, north = parse.(Float64, split("{{area}}", ","))  # the area, in degrees of longitude and latitude
area = "ST_MakeEnvelope($(west), $(south), $(east), $(north))"
collection, first_day, last_day = "{{collection}}", "{{firstDay}}", "{{lastDay}}"
enc(s) = join(isletter(c) && isascii(c) || isdigit(c) || c in "-_.~," ? string(c) : join("%" * uppercase(string(b; base = 16, pad = 2)) for b in codeunits(string(c))) for c in s)  # a value in the address of a request
stac = "https://stac.dataspace.copernicus.eu/v1/search"  # the STAC catalogue of the Copernicus Data Space Ecosystem, searched without an account
function search(collection; extra = "", most = 100)  # the scenes of a collection over the area and between the dates, page after page
	url = "$(stac)?collections=$(collection)&bbox=$(west),$(south),$(east),$(north)&datetime=$(enc("$(first_day)T00:00:00Z/$(last_day)T23:59:59Z"))&limit=100$(extra)"
	pages, files = mktempdir(), String[]
	while url !== nothing && 100 * length(files) < most
		push!(files, Downloads.download(url, joinpath(pages, "page-$(length(files) + 1).json")))
		next = query("SELECT l->>'href' AS href FROM (SELECT unnest(CAST(coalesce(json_extract(content, '/links'), '[]') AS JSON[])) AS l FROM read_text('$(files[end])')) WHERE l->>'rel' = 'next'").href
		url = isempty(next) ? nothing : first(next)
	end
	return files
end
extra = ""
{{?collection=sentinel-2-l2a|sentinel-2-l1c|sentinel-3-olci-2-lfr-ntc|sentinel-3-sl-2-lst-ntc}}extra = "&filter=$(enc("eo:cloud_cover <= {{maxCloud}}"))&filter-lang=cql2-text"  # scenes with at most this share of clouds
files = search(collection; extra = extra, most = {{rows}})
DBInterface.execute(con, """
CREATE OR REPLACE TABLE scenes AS
SELECT f->>'id' AS id, CAST(f->>'/properties/datetime' AS TIMESTAMP) AS acquired, TRY_CAST(f->>'/properties/eo:cloud_cover' AS DOUBLE) AS cloud,
	f->>'/properties/platform' AS platform, f->>'/properties/grid:code' AS tile, f->>'/properties/sat:orbit_state' AS orbit,
	ST_GeomFromGeoJSON(f->'geometry') AS geom, f->'assets' AS assets
FROM (SELECT unnest(CAST(coalesce(json_extract(content, '/features'), '[]') AS JSON[])) AS f FROM read_text($(repr(files))))
QUALIFY row_number() OVER (PARTITION BY id) = 1
""")  # one row per scene: its date, cloud cover, satellite, tile, orbit, outline and assets
DBInterface.execute(con, "ALTER TABLE scenes ADD COLUMN covered DOUBLE")
DBInterface.execute(con, "UPDATE scenes SET covered = round(100 * ST_Area(ST_Intersection(geom, $(area))) / ST_Area($(area)), 1)")  # the share of the area each scene covers, in per cent
DBInterface.execute(con, "DELETE FROM scenes WHERE id NOT IN (SELECT id FROM scenes ORDER BY coalesce(cloud, 0), acquired DESC LIMIT {{rows}})")
s = query("SELECT id, acquired, cloud, covered FROM scenes ORDER BY coalesce(cloud, 0), acquired DESC")
isempty(s.id) && error("The catalogue has no scenes of $(collection) over the area from $(first_day) to $(last_day)$(isempty(extra) ? "" : " with at most {{maxCloud}}% of clouds"): widen the dates, the area or the cloud cover")
println(length(s.id), " scenes of ", collection, " over the area from ", first_day, " to ", last_day, ismissing(first(s.cloud)) ? ", the latest first:" : ", the least cloudy first:")
for i in eachindex(s.id)
	println(rpad(s.id[i], 66), " ", s.acquired[i], ismissing(s.cloud[i]) ? "" : "  cloud $(round(s.cloud[i]; digits = 1))%", "  covers $(s.covered[i])% of the area")
end
'''

[[codeBranches]]
model = "s2"
code = '''
using DuckDB, Tables, Downloads, Rasters, ArchGDAL

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
query(sql) = Tables.columntable(DBInterface.execute(con, sql))
folder = mkpath(expanduser(raw"{{folder}}"))  # where the bands are kept once downloaded, and the Next Steps save theirs
west, south, east, north = parse.(Float64, split("{{area}}", ","))  # the area, in degrees of longitude and latitude
area = "ST_MakeEnvelope($(west), $(south), $(east), $(north))"
first_day, last_day = "{{firstDay}}", "{{lastDay}}"
enc(s) = join(isletter(c) && isascii(c) || isdigit(c) || c in "-_.~," ? string(c) : join("%" * uppercase(string(b; base = 16, pad = 2)) for b in codeunits(string(c))) for c in s)  # a value in the address of a request
scene = "{{scene}}"
url = "https://stac.dataspace.copernicus.eu/v1/search?collections=sentinel-2-l2a&limit=100&" * (isempty(scene) ? "bbox=$(west),$(south),$(east),$(north)&datetime=$(enc("$(first_day)T00:00:00Z/$(last_day)T23:59:59Z"))&filter=$(enc("eo:cloud_cover <= {{maxCloud}}"))&filter-lang=cql2-text" : "ids=$(scene)")
page = Downloads.download(url, joinpath(mktempdir(), "scenes.json"))  # the scenes of the catalogue, searched without an account
DBInterface.execute(con, """
CREATE OR REPLACE TABLE scenes AS
SELECT f->>'id' AS id, CAST(f->>'/properties/datetime' AS TIMESTAMP) AS acquired, TRY_CAST(f->>'/properties/eo:cloud_cover' AS DOUBLE) AS cloud,
	ST_GeomFromGeoJSON(f->'geometry') AS geom, f->'assets' AS assets
FROM (SELECT unnest(CAST(coalesce(json_extract(content, '/features'), '[]') AS JSON[])) AS f FROM read_text('$(page)'))
""")
pick = query("SELECT id, acquired, cloud, round(100 * ST_Area(ST_Intersection(geom, $(area))) / ST_Area($(area)), 1) AS covered FROM scenes ORDER BY covered DESC, cloud, acquired DESC LIMIT 1")  # the least cloudy of the scenes that cover the most of the area
isempty(pick.id) && error(isempty(scene) ? "No Sentinel-2 Level-2A scene over the area from $(first_day) to $(last_day) has at most {{maxCloud}}% of clouds: widen the dates or the cloud cover" : "The catalogue has no Sentinel-2 Level-2A scene $(scene)")
scene = only(pick.id)
println("Scene ", scene, ", ", only(pick.acquired), ", cloud ", round(only(pick.cloud); digits = 1), "%, covering ", only(pick.covered), "% of the area")

function token()  # an access token of the Copernicus Data Space Ecosystem, for the user's account
	for v in ("CDSE_USERNAME", "CDSE_PASSWORD")
		haskey(ENV, v) || error("Set the credentials of your Copernicus Data Space account with the key on the Powered by line, or set ENV[\"$(v)\"]: see the Authentication wiki")
	end
	out = IOBuffer()
	r = Downloads.request("https://identity.dataspace.copernicus.eu/auth/realms/CDSE/protocol/openid-connect/token"; method = "POST", output = out, throw = false,
		input = IOBuffer("grant_type=password&client_id=cdse-public&username=$(enc(ENV["CDSE_USERNAME"]))&password=$(enc(ENV["CDSE_PASSWORD"]))"),
		headers = ["Content-Type" => "application/x-www-form-urlencoded"])
	answer = String(take!(out))
	r isa Downloads.Response && r.status == 200 || error("The Copernicus Data Space refused the account (HTTP $(r isa Downloads.Response ? r.status : r.message)): $(first(answer, 300))")
	return match(r"\"access_token\"\s*:\s*\"([^\"]+)\"", answer)[1]
end
function download_once(href, path)  # a file of the download service, kept in the folder: a new token for each, as a token lasts minutes
	isfile(path) && return path
	Downloads.download(href, path * ".part"; headers = ["Authorization" => "Bearer $(token())"])
	return mv(path * ".part", path)
end

chosen = strip.(split("{{bands}}", ","))
known = query("SELECT unnest(json_keys(assets)) AS k FROM scenes WHERE id = '$(scene)'").k
for b in chosen
	b in known || error("The scene has no band $(b): its assets are $(join(sort(known), ", "))")
end
bands = Dict{String, Any}()  # each band, cut to the area: reflectance, or the classes of SCL
crs = ""
for b in chosen
	a = query("SELECT assets->'$(b)'->'alternate'->'https'->>'href' AS href, assets->'$(b)'->>'proj:code' AS code, TRY_CAST(assets->'$(b)'->>'raster:scale' AS DOUBLE) AS scale, TRY_CAST(assets->'$(b)'->>'raster:offset' AS DOUBLE) AS offset, TRY_CAST(assets->'$(b)'->>'nodata' AS DOUBLE) AS nodata FROM scenes WHERE id = '$(scene)'")
	path = download_once(only(a.href), joinpath(mkpath(joinpath(folder, "cdse", scene)), "$(b).jp2"))
	global crs = only(a.code)  # the coordinate system of the tile, a zone of UTM
	box = query("SELECT ST_XMin(g) AS x0, ST_YMin(g) AS y0, ST_XMax(g) AS x1, ST_YMax(g) AS y1 FROM (SELECT ST_Transform($(area), 'EPSG:4326', '$(crs)') AS g)")
	cut = read(crop(Raster(path; lazy = true); to = Extent(X = (only(box.x0), only(box.x1)), Y = (only(box.y0), only(box.y1)))))  # the cells of the area only
	scale, offset, nodata = only(a.scale), only(a.offset), only(a.nodata)
	bands[b] = map(v -> ismissing(v) || (!ismissing(nodata) && v == nodata) ? missing : ismissing(scale) ? Int(v) : Float32(v * scale + coalesce(offset, 0.0)), cut)  # reflectance from the stored integers, by the catalogue's scale and offset
	println(rpad(b, 9), size(cut, X), " x ", size(cut, Y), " cells, ", count(ismissing, bands[b]), " without data, from ", path)
end
grid = bands[first(chosen)]  # the first band, for the Next Steps that read one
'''

