bands = Dict{String, Any}()  # the backscatter of each polarisation, cut to the area
crs = ""
for b in chosen
	b in ("VV", "VH") || error("The monthly mosaics of IW have the polarisations VV and VH, not $(b)")
	a = query("SELECT assets->'$(b)'->'alternate'->'https'->>'href' AS href, assets->'$(b)'->>'proj:code' AS code, TRY_CAST(assets->'$(b)'->>'nodata' AS DOUBLE) AS nodata FROM scenes WHERE id = '$(scene)'")
	ismissing(only(a.href)) && error("The mosaic $(scene) has no $(b)")
	path = download_once(only(a.href), joinpath(mkpath(joinpath(folder, "cdse", scene)), "$(b).tif"))
	global crs = only(a.code)  # the coordinate system of the tile, a zone of UTM
	box = query("SELECT ST_XMin(g) AS x0, ST_YMin(g) AS y0, ST_XMax(g) AS x1, ST_YMax(g) AS y1 FROM (SELECT ST_Transform($(area), 'EPSG:4326', '$(crs)') AS g)")
	cut = read(crop(Raster(path; lazy = true); to = Extent(X = (only(box.x0), only(box.x1)), Y = (only(box.y0), only(box.y1)))))  # the cells of the area only
	nodata = only(a.nodata)
	bands[b] = map(v -> ismissing(v) || (!ismissing(nodata) && v == nodata) || !isfinite(v) || v <= 0 ? missing : Float32(v), cut)  # the backscatter, missing where the mosaic has no observation
	println(rpad(b, 4), size(cut, X), " x ", size(cut, Y), " cells, ", count(ismissing, bands[b]), " without data, from ", path)
end
grid = bands[first(chosen)]  # the first polarisation, for the Next Steps that read one
'''

