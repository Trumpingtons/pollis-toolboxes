id = "collections-side-by-side"
label = "Collections Side by Side"
desc = "How many scenes four collections have over the area between the dates: Sentinel-2 Level-2A, Sentinel-1 GRD, Sentinel-3 OLCI Land and Sentinel-5P nitrogen dioxide"
models = ["find"]
code = '''
println(rpad("collection", 30), rpad("scenes", 8), "first and last")
for c in ("sentinel-2-l2a", "sentinel-1-grd", "sentinel-3-olci-2-lfr-ntc", "sentinel-5p-l2-no2-offl")
	pages = search(c; most = 1000)
	counts = query("SELECT count(DISTINCT f->>'id') AS n, min(f->>'/properties/datetime') AS t0, max(f->>'/properties/datetime') AS t1 FROM (SELECT unnest(CAST(coalesce(json_extract(content, '/features'), '[]') AS JSON[])) AS f FROM read_text($(repr(pages))))")
	println(rpad(c, 30), rpad(only(counts.n), 8), only(counts.n) == 0 ? "" : "$(first(only(counts.t0), 10)) to $(first(only(counts.t1), 10))")
end
'''

[[actionGroups.actions]]
id = "satellites-side-by-side"
