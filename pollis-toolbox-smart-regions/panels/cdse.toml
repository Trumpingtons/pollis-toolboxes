# Copernicus Data Space: the scenes of the Copernicus Sentinel missions found in the STAC catalogue of the Copernicus Data
# Space Ecosystem, and the bands of a Sentinel-2 scene or a Sentinel-1 monthly mosaic downloaded with the user's account

[meta]
title = "Copernicus Data Space"
viewType = "pollis.cdse"
defaultModel = "find"
decisionFirstColumn = "Tab"

# The user's account of the Copernicus Data Space Ecosystem, kept by Pollis in Secret Storage and set in the Julia REPL
[apiKey]
label = "Copernicus Data Space"
noun = "credentials"

[[apiKey.fields]]
name = "username"
envVar = "CDSE_USERNAME"
prompt = "Copernicus Data Space username (the email address of the account)"
password = false

[[apiKey.fields]]
name = "password"
envVar = "CDSE_PASSWORD"
prompt = "Copernicus Data Space password"

