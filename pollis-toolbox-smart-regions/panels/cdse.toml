id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "scene-outlines"
label = "Scene Outlines on a Map"
desc = "The outline of each scene found, coloured by its cloud cover, or by its date where scenes have none, with the area, on an OpenStreetMap base map in Pollis's map view"
models = ["find"]
code = '''
shown, box = joinpath(mktempdir(), "scenes.geojson"), joinpath(mktempdir(), "area.geojson")
DBInterface.execute(con, "COPY (SELECT id, CAST(acquired AS VARCHAR) AS acquired, cloud, ST_Intersection(geom, ST_MakeEnvelope(-180, -90, 180, 90)) AS geom FROM scenes) TO '$(shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")
DBInterface.execute(con, "COPY (SELECT 'Area' AS name, $(area) AS geom) TO '$(box)' (FORMAT GDAL, DRIVER 'GeoJSON')")
by = all(ismissing, s.cloud) ? "acquired" : "cloud"
display(Pollis.webmap(Pollis.layer(shown; name = "Scenes of $(collection)", column = by, opacity = 0.15), Pollis.layer(box; name = "Area", color = "#e15759", opacity = 0.3); title = "$(length(s.id)) Scenes"))
