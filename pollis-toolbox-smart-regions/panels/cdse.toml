[[actionGroups.actions]]
id = "area-coverage"
label = "How Scenes Cover the Area"
desc = "For each tile and orbit of the scenes found, how many scenes and how much of the area they cover: a scene of a neighbouring tile may cover only part of it"
models = ["find"]
code = '''
c = query("SELECT coalesce(tile, '') AS tile, coalesce(orbit, '') AS orbit, count(*) AS n, min(covered) AS least, max(covered) AS most FROM scenes GROUP BY ALL ORDER BY most DESC, n DESC")
println(rpad("tile", 16), rpad("orbit", 12), rpad("scenes", 8), "covers (% of the area)")
for i in eachindex(c.n)
	println(rpad(c.tile[i], 16), rpad(c.orbit[i], 12), rpad(c.n[i], 8), c.least[i] == c.most[i] ? c.most[i] : "$(c.least[i]) to $(c.most[i])")
end
'''

[[actionGroups.actions]]
id = "scene-classes"
label = "Scene Classes over the Area"
desc = "The classes of the scene classification band SCL of Sentinel-2 Level-2A over the area: cloud, cloud shadow, vegetation, water and the others, as shares of the cells"
models = ["s2"]
code = '''
haskey(bands, "SCL_20m") || error("Add SCL_20m to the Bands: the scene classification")
classes = ["No data", "Saturated or defective", "Topographic casted shadows", "Cloud shadows", "Vegetation", "Not vegetated", "Water", "Unclassified", "Cloud, medium probability", "Cloud, high probability", "Thin cirrus", "Snow or ice"]  # the classes 0 to 11 of the scene classification of Sen2Cor
v = collect(skipmissing(bands["SCL_20m"]))
println("Scene classification of ", scene, " over the area, ", length(v), " cells of 20 m:")
for k in 0:11
	n = count(==(k), v)
	n > 0 && println(rpad(classes[k + 1], 30), lpad(n, 8), "  ", round(100 * n / length(v); digits = 2), "%")
end
'''

