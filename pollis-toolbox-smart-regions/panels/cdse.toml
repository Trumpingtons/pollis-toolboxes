code = '''
p = query("SELECT coalesce(platform, 'not recorded') AS platform, count(*) AS n, round(avg(cloud), 1) AS cloud, CAST(min(acquired) AS DATE) AS t0, CAST(max(acquired) AS DATE) AS t1 FROM scenes GROUP BY ALL ORDER BY platform")
println(rpad("satellite", 16), rpad("scenes", 8), rpad("mean cloud (%)", 16), "first and last")
for i in eachindex(p.n)
	println(rpad(p.platform[i], 16), rpad(p.n[i], 8), rpad(coalesce(p.cloud[i], ""), 16), p.t0[i], " to ", p.t1[i])
end
