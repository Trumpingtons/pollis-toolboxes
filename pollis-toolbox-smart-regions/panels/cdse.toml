[[actionGroups.actions]]
id = "vv-beside-vh"
label = "VV Beside VH"
desc = "The two polarisations of the mosaic side by side, in decibels: their quantiles over the area and how closely they vary together"
models = ["s1"]
code = '''
using Statistics

all(in(chosen), ("VV", "VH")) || error("Set the Polarisations to VV, VH")
db(v) = 10 * log10(v)  # decibels of a backscatter coefficient
both = [(db(a), db(b)) for (a, b) in zip(bands["VV"], bands["VH"]) if !ismissing(a) && !ismissing(b)]
vv, vh = first.(both), last.(both)
println(rpad("", 6), join(lpad.(["5%", "25%", "50%", "75%", "95%"], 9)))
for (n, v) in ("VV" => vv, "VH" => vh)
	println(rpad(n, 6), join(lpad.(round.(quantile(v, [0.05, 0.25, 0.5, 0.75, 0.95]); digits = 2), 9)), "  dB")
end
println("Correlation of VV and VH in dB over ", length(vv), " cells: ", round(cor(vv, vh); digits = 3), "; VH - VV median ", round(median(vh .- vv); digits = 2), " dB")
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "ndvi"
label = "NDVI over the Area"
desc = "The normalised difference vegetation index from the red band B04 and the near-infrared band B08, cells classed as cloud, cloud shadow, cirrus or snow left out when SCL_20m is among the Bands, with its quantiles and a map"
models = ["s2"]
code = '''
using Statistics

all(in(chosen), ("B04_10m", "B08_10m")) || error("Add B04_10m and B08_10m to the Bands: red and near infrared at 10 m")
red, nir = bands["B04_10m"], bands["B08_10m"]
ndvi = map((r, n) -> ismissing(r) || ismissing(n) || r + n <= 0 ? missing : Float32((n - r) / (n + r)), red, nir)  # near infrared minus red, over their sum
if haskey(bands, "SCL_20m")
	scl = resample(Raster(bands["SCL_20m"]; missingval = missing); to = ndvi, method = :near)  # the classes on the cells of 10 m
	ndvi = map((v, c) -> ismissing(c) || c in (3, 8, 9, 10, 11) ? missing : v, ndvi, scl)  # cloud shadow, cloud, cirrus and snow left out
end
v = collect(skipmissing(ndvi))
println("NDVI of ", scene, " over ", length(v), " cells of 10 m: quantiles 5, 25, 50, 75, 95%: ", join(round.(quantile(v, [0.05, 0.25, 0.5, 0.75, 0.95]); digits = 3), ", "))
println("Cells above 0.5: ", round(100 * count(>(0.5), v) / length(v); digits = 1), "%; below 0: ", round(100 * count(<(0), v) / length(v); digits = 1), "%")
grid, chosen = ndvi, ["NDVI"]  # Show the Band on a Map and Plot the Band now draw NDVI
'''

