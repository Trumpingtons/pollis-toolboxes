[[actionGroups.actions]]
id = "scenes-over-time"
label = "Scenes over Time"
desc = "When the scenes were taken, each a point at its date, by its cloud cover where scenes have one, drawn with ECharts"
models = ["find"]
code = '''
using ECharts

t = query("SELECT CAST(acquired AS VARCHAR) AS day, coalesce(cloud, 0) AS cloud, coalesce(platform, '') AS platform FROM scenes ORDER BY acquired")
EChart(ec_width = 760, ec_height = 380, title = [ECharts.Title(text = "Scenes of $(collection)")], tooltip = ECharts.Tooltip(),
	xAxis = [ECharts.Axis(_type = "time", name = "Date")], yAxis = [ECharts.Axis(_type = "value", name = all(ismissing, s.cloud) ? "" : "Cloud (%)", min = 0)],
	series = [ECharts.XYSeries(name = p, _type = "scatter", data = [[t.day[i], t.cloud[i]] for i in eachindex(t.day) if t.platform[i] == p]) for p in unique(t.platform)])
'''

[[actionGroups.actions]]
id = "band-map"
label = "Show the Band on a Map"
desc = "The first band, cells coloured by value, on an OpenStreetMap base map in Pollis's map view, at most 80 cells a side (larger areas averaged over blocks of cells); click a cell for its value"
models = ["s2", "s1"]
code = '''
using Statistics

f = max(1, cld(max(size(grid, X), size(grid, Y)), 80))  # at most 80 cells a side
small = permutedims(f > 1 ? Rasters.aggregate(mean, Raster(grid; missingval = missing), f; skipmissingval = true) : grid, (X, Y))
edges(d) = [(min(lo, hi), max(lo, hi)) for (lo, hi) in Rasters.intervalbounds(small, d)]  # each cell's two edges
xe, ye = edges(X), edges(Y)
rows = ["($(round(Float64(small[i, j]), digits = 4)), $(xe[i][1]), $(ye[j][1]), $(xe[i][2]), $(ye[j][2]))" for i in axes(small, 1), j in axes(small, 2) if !ismissing(small[i, j])]
shown = joinpath(mktempdir(), "cells.geojson")
DBInterface.execute(con, "COPY (SELECT value, ST_Transform(ST_MakeEnvelope(x0, y0, x1, y1), '$(crs)', 'EPSG:4326') AS geom FROM (VALUES $(join(rows, ", "))) t(value, x0, y0, x1, y1)) TO '$(shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(shown; name = "$(first(chosen)) of $(scene)", column = "value", opacity = 0.7)))
'''

[[actionGroups.actions]]
id = "band-plot"
label = "Plot the Band"
desc = "The first band as a heat map drawn with ECharts, north up, at most 200 cells a side (larger areas averaged over blocks of cells)"
models = ["s2", "s1"]
code = '''
using ECharts, Statistics

f = max(1, cld(max(size(grid, X), size(grid, Y)), 200))  # at most 200 cells a side
small = permutedims(f > 1 ? Rasters.aggregate(mean, Raster(grid; missingval = missing), f; skipmissingval = true) : grid, (X, Y))
north_first = first(lookup(small, Y)) > last(lookup(small, Y))
nx, ny = size(small)
cells = [[i - 1, (north_first ? ny - j : j - 1), round(Float64(small[i, j]), digits = 4)] for i in 1:nx, j in 1:ny if !ismissing(small[i, j])]  # column, row from the south, value
lo, hi = extrema(skipmissing(small))
EChart(ec_width = 760, ec_height = round(Int, 60 + 680 * ny / nx), title = [ECharts.Title(text = "$(first(chosen)) of $(scene)")], tooltip = ECharts.Tooltip(),
	xAxis = [ECharts.Axis(_type = "category", data = string.(round.(Int, lookup(small, X))), name = "x")],
	yAxis = [ECharts.Axis(_type = "category", data = string.(round.(Int, north_first ? reverse(lookup(small, Y)) : lookup(small, Y))), name = "y")],
	visualMap = ECharts.VisualMap(min = lo, max = hi, calculable = true, orient = "vertical", right = "1%", top = "middle", inRange = Dict("color" => ["#313695", "#74add1", "#ffffbf", "#f46d43", "#a50026"])),
	series = [ECharts.HeatmapSeries(name = first(chosen), data = cells)])
'''

