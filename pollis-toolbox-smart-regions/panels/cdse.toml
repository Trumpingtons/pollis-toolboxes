[[faq]]
question = "Do I need an account to use the panel?"
answer = '''
Not for Find Scenes: the STAC catalogue of the Copernicus Data Space Ecosystem is searched without one. Sentinel-2 Bands and Sentinel-1 Radar download files, and the download service asks for an access token, which the panel obtains with the username and password of a free account of the Copernicus Data Space Ecosystem, set with the key on the Powered by line.
'''
wiki = "Authentication"

[[faq]]
question = "Why does Sentinel-2 Bands download a whole tile for a small area?"
answer = '''
The bands of a Sentinel-2 product are JPEG 2000 files of a whole tile of 110 by 110 km, and the panel downloads each band it reads once, to the Folder, before cutting it to the Area: a band of 10 m is some 70 to 120 MB. Later runs on the same scene read the files from the Folder.
'''
wiki = "Sentinel-2 Bands"

[[faq]]
question = "Why does Sentinel-1 Radar read monthly mosaics and not single scenes?"
answer = '''
A single Sentinel-1 GRD scene is in the geometry of the radar and needs calibration and terrain correction before its cells can be set on a map. The monthly mosaics of the Copernicus Data Space Ecosystem are already calibrated, terrain-flattened and geocoded, composited over a month in tiles of about 100 km, as cloud-optimised GeoTIFFs of VV and VH at 20 m.
'''
wiki = "Sentinel-1 Monthly Mosaics"

[[faq]]
question = "May I use the Sentinel data in my own work?"
answer = '''
The data of the Sentinel missions are made available on a full, open and free-of-charge basis under the data policy of the Copernicus programme, Commission Delegated Regulation (EU) No 1159/2013, for any lawful use.
'''
wiki = "Overview"

[[faq]]
question = "What does the cloud cover of a scene measure?"
answer = '''
The share of the whole scene, the tile of the product, that its processing classed as cloud: a scene can be cloudy over its tile and clear over a small Area, or the other way round. Scene Classes counts the classes of the Sentinel-2 scene classification over the Area itself.
'''
wiki = "Searching the STAC Catalogue"
hidden = true

[[faq]]
question = "Which bands does NDVI need?"
answer = '''
The red band, B04, and the near-infrared band, B08, both at 10 m: NDVI is the difference of near-infrared and red divided by their sum. With the scene classification band SCL among the Bands, cells classed as cloud, cloud shadow, cirrus or snow are left out.
'''
wiki = "Sentinel-2 Bands"
hidden = true

[[faq]]
question = "Why does the panel stop with HTTP 401?"
answer = '''
The download service of the Copernicus Data Space Ecosystem refused the request: the username or the password is wrong, the account has two-factor authentication, which the panel does not handle, or the access token expired during a long download. The panel asks for a new token for each file.
'''
wiki = "Diagnostics"
hidden = true

[[faq]]
question = "Why are some cells of the band missing?"
answer = '''
The cells the product records as without data: those outside the satellite's swath at the edge of a tile, for Sentinel-2, and those without observations in the month or in radar shadow, for a Sentinel-1 mosaic. The panel reads the no-data value of each band from the catalogue and leaves those cells out.
'''
wiki = "Diagnostics"
hidden = true

