[[actionGroups]]
id = "export"
label = "Export"

[[actionGroups.actions]]
id = "save-geoparquet"
label = "Save as GeoParquet"
desc = "Write the tables of the tab as GeoParquet files in the folder mobility: the zones and the flows as lines, the modelled flows, the count points, or the routes"
code = '''
{{?model=commuting|trips}}saved = ["zones" => "SELECT z.zone, z.name, coalesce(i.flow, 0) AS inflow, coalesce(o.flow, 0) AS outflow, z.geom FROM zones z LEFT JOIN (SELECT destination AS zone, sum(flow) AS flow FROM flows GROUP BY ALL) i USING (zone) LEFT JOIN (SELECT origin AS zone, sum(flow) AS flow FROM flows GROUP BY ALL) o USING (zone)",
{{?model=commuting|trips}}	"flows" => "SELECT f.origin, f.destination, f.flow, ST_MakeLine(ST_Point(o.lon, o.lat), ST_Point(d.lon, d.lat)) AS geom FROM flows f JOIN zones o ON o.zone = f.origin JOIN zones d ON d.zone = f.destination"]
{{?model=interaction}}saved = ["modelled" => "SELECT m.*, ST_MakeLine(ST_Point(o.lon, o.lat), ST_Point(d.lon, d.lat)) AS geom FROM modelled m JOIN zones o ON o.zone = m.origin JOIN zones d ON d.zone = m.destination"]
{{?model=counts}}saved = ["counts" => "SELECT *, ST_Point(lon, lat) AS geom FROM counts WHERE lon IS NOT NULL"]
{{?model=air}}saved = ["routes" => "SELECT r.*, ST_MakeLine(ST_Point(a.lon, a.lat), ST_Point(b.lon, b.lat)) AS geom FROM routes r JOIN airports a ON a.icao = r.origin JOIN airports b ON b.icao = r.destination",
{{?model=air}}	"modelled" => "SELECT m.*, ST_MakeLine(ST_Point(a.lon, a.lat), ST_Point(b.lon, b.lat)) AS geom FROM modelled m JOIN airports a ON a.icao = m.origin JOIN airports b ON b.icao = m.destination"]
for (t, sql) in saved
	parquet_file = joinpath(place, "$(t)-$(city)-{{model}}.parquet")
	execute("COPY ($(sql)) TO '$(parquet_file)' (FORMAT parquet)")
	println("Wrote ", only(query("SELECT count(*) AS n FROM read_parquet('$(parquet_file)')").n), " rows to ", parquet_file)
end
'''

[[actionGroups.actions]]
id = "save-csv"
label = "Save Flows as CSV"
desc = "The flows between the zones or airports, with their names, and the fitted flows and distances of a model, as a CSV file in the folder mobility"
models = ["commuting", "trips", "interaction", "air"]
code = '''
{{?model=commuting|trips}}listed = "SELECT f.origin, o.name AS origin_name, f.destination, d.name AS destination_name, f.flow FROM flows f JOIN zones o ON o.zone = f.origin JOIN zones d ON d.zone = f.destination ORDER BY f.flow DESC"
{{?model=interaction}}listed = "SELECT m.origin, o.name AS origin_name, m.destination, d.name AS destination_name, m.flow, round(m.fitted, 3) AS fitted, round(m.km, 3) AS km FROM modelled m JOIN zones o ON o.zone = m.origin JOIN zones d ON d.zone = m.destination ORDER BY m.flow DESC"
{{?model=air}}listed = "SELECT m.origin, a.name AS origin_name, m.destination, b.name AS destination_name, m.flow AS flights, round(m.fitted, 3) AS fitted, round(m.km, 1) AS km FROM modelled m JOIN airports a ON a.icao = m.origin JOIN airports b ON b.icao = m.destination ORDER BY m.flow DESC"
csv_file = joinpath(place, "flows-$(city)-{{model}}.csv")
execute("COPY ($(listed)) TO '$(csv_file)' (HEADER, DELIMITER ',')")
println("Wrote ", only(query("SELECT count(*) AS n FROM read_csv('$(csv_file)')").n), " rows to ", csv_file)
'''
