	FROM modelled m JOIN zones o ON o.zone = m.origin JOIN zones d ON d.zone = m.destination WHERE m.fitted > 0) QUALIFY row_number() OVER (ORDER BY residual DESC) <= 150 OR row_number() OVER (ORDER BY residual) <= 150) TO '$(residuals_file)' (FORMAT GDAL, DRIVER 'GeoJSON')""")
