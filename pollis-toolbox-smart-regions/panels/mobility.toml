# Mobility and Flows: flows between the zones of a city, from censuses, job registers and trip records, gravity models fitted
# to them, traffic counts on its roads, and the flights between airports, from open data of the United Kingdom, the Netherlands,
# France, Germany, the United States, Japan, Hong Kong, Singapore and the OpenSky Network

[meta]
title = "Mobility and Flows"
viewType = "pollis.mobility"
defaultModel = "commuting"
