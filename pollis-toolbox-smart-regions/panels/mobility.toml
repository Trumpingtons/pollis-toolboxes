[[faq]]
question = "Where do the flows of each city come from?"
answer = '''
From open data of the city's statistical office or transport authority: the Census 2021 for Cambridge, Oxford and London, Statistics Netherlands for Amsterdam, INSEE for Paris, the Federal Employment Agency for Frankfurt, LODES for New York, the 2020 Census for Tokyo, the 2021 Population Census for Hong Kong, and LTA DataMall for Singapore. Commuting Data lists each source, its date and what it counts.
'''
wiki = "Commuting Data"

[[faq]]
question = "Which constraint should the gravity model use?"
answer = '''
Doubly when both the flows leaving each zone and those arriving are known and only their pattern between zones is of interest; Production to predict where the flows of each origin go; Attraction to predict where the flows to each destination come from; Unconstrained to explain the totals themselves by the sizes of the places. Four Constraints compares them.
'''
wiki = "Spatial Interaction Models"

[[faq]]
question = "Why does Singapore ask for a key?"
answer = '''
The bus trips and bus stops of Singapore come from LTA DataMall, whose API needs an account key. The key on the Powered by line keeps it in Secret Storage and sets it as LTA_ACCOUNT_KEY when the code runs in the Julia REPL. The other cities need no account.
'''
wiki = "Authentication"

[[faq]]
question = "What does Air Routes count?"
answer = '''
The flights the OpenSky Network's receivers saw in a month, from its flight list on Zenodo, between airports OurAirports lists: for Global, the routes among the busiest airports of the world; for a city, the routes from its airports to the busiest others. The flight list runs from January 2019 to December 2022.
'''
wiki = "Air Route Data"

[[faq]]
question = "Why are there no flows within a district for Frankfurt?"
answer = '''
The tables of the Federal Employment Agency count as commuters only those who work outside the district where they live, so the employees who live and work in the same district are not in them, and self-containment cannot be measured.
'''
wiki = "Commuting Data"
hidden = true

[[faq]]
question = "How is a gravity model fitted in Mobility and Flows?"
answer = '''
As a Poisson regression of the flow of each pair of zones on the distance, with fixed effects for the origins, the destinations or both, which reproduce the totals of the constraint, and the sizes of the places as further terms where the constraint leaves them free, fitted with GLFixedEffectModels.jl with robust standard errors.
'''
wiki = "Spatial Interaction Models"
hidden = true

[[faq]]
question = "What are the common part of the flows and the SRMSE?"
answer = '''
Two measures of how closely the fitted flows follow the observed ones: the common part of the flows runs from 0, no overlap, to 1, a perfect fit; the standardised root mean square error is 0 for a perfect fit and grows as the fit worsens.
'''
wiki = "Spatial Interaction Models"
hidden = true

[[faq]]
question = "Why do the traffic counts of Paris cover only two years?"
answer = '''
The Ville de Paris publishes the data of its permanent sensors over a rolling thirteen months, so the counts of the panel span the current year and the one before, and the current year is not complete.
'''
wiki = "Traffic Counts"
hidden = true

[[faq]]
question = "Which flights count for a country in Air Routes?"
answer = '''
The domestic flights: those whose airports of departure and arrival both lie in the country, by the country OurAirports gives each airport. With Flights set to Airline Flights, only flights with an airline callsign between airports with scheduled service count; with All Flights, general and business aviation count too.
'''
wiki = "Air Route Data"
hidden = true

[[faq]]
question = "Why do some countries have so few routes in Air Routes?"
answer = '''
The OpenSky Network sees only the flights within reach of its receivers. Where few receivers cover the approaches, many flights lack their airport of arrival and drop out of the routes; Countries Compared gives, for each country, the share of departures seen whose airport of arrival is known.
'''
wiki = "Air Route Data"
hidden = true

