[[bullets]]
text = "Spatial Interaction"
detail = "Gravity models of the flows between zones, with four constraints and a power or exponential distance function"

[[bullets]]
text = "Traffic Counts"
detail = "The daily flows of vehicles at the count points of the roads, by year, and by kind of vehicle or hour where published"

[[bullets]]
