text = "Trips"
detail = "The trips of a month between zones, from bike-sharing journeys, taxi trips or bus tap-ins, with their hours"

[[bullets]]
text = "Spatial Interaction"
detail = "Gravity models of the flows between zones, with four constraints and a power or exponential distance function"

[[bullets]]
text = "Traffic Counts"
detail = "The daily flows of vehicles at the count points of the roads, by year, and by kind of vehicle or hour where published"

[[bullets]]
text = "Air Routes"
detail = "The flights of a month between airports, from the OpenSky Network, worldwide or from a city's airports, with a gravity model"

