{{?model=counts}}{{?city=newyork}}file = fetch(socrata * "\$select=" * enc("segmentid, boro, street, fromst, tost, direction, wktgeom, yr, avg(vol) * 96 AS daily") * "&\$group=" * enc("segmentid, boro, street, fromst, tost, direction, wktgeom, yr") * "&\$limit=500000", "nyc-dot-counts-$(today()).csv")  # the mean count of a quarter hour, times 96
