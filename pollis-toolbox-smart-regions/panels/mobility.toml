{{?model=counts}}{{?city=cambridge|oxford|london}}box = Dict("cambridge" => (-0.05, 52.13, 0.25, 52.28), "oxford" => (-1.40, 51.68, -1.13, 51.82), "london" => (-0.52, 51.28, 0.34, 51.70))[city]  # the area around the city, in degrees of longitude and latitude
