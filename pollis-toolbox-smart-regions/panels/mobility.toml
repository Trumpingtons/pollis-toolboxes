[[actionGroups.actions]]
id = "overdispersion"
label = "Overdispersion"
desc = "The Pearson statistic over its degrees of freedom, near 1 when the flows vary as much as a Poisson model expects and above 1 when they vary more, and the share of pairs with no flow, observed and expected"
models = ["interaction", "air"]
code = '''
usable = isfinite.(fitted) .& (fitted .> 0)
levels = Dict("doubly" => length(unique(data.origin)) + length(unique(data.destination)) - 1, "production" => length(unique(data.origin)), "attraction" => length(unique(data.destination)), "none" => 1)[constraint]
dof = count(usable) - length(coef(fit)) - levels
pearson = sum((data.flow[usable] .- fitted[usable]) .^ 2 ./ fitted[usable])
println("Pearson statistic over its degrees of freedom: ", round(pearson / dof; digits = 2), " (", dof, " degrees of freedom)")
println("Pairs with no flow: ", round(100 * count(==(0), data.flow[usable]) / count(usable); digits = 1), "% observed, ", round(100 * sum(exp.(-fitted[usable])) / count(usable); digits = 1), "% expected by the Poisson model")
println("The standard errors of the tab are robust, and stay valid when the flows are overdispersed")
'''

[[actionGroups.actions]]
id = "counts-check"
label = "Count Points Check"
desc = "For each of the last ten years, the count points and how their flows were obtained, and the points with no flow or no position"
models = ["counts"]
code = '''
methods = query("SELECT year, method, count(*) AS points, count(*) FILTER (WHERE flow IS NULL) AS no_flow, count(*) FILTER (WHERE lon IS NULL OR lat IS NULL) AS no_position FROM counts WHERE year > $(s.last[1]) - 10 GROUP BY ALL ORDER BY year, method")
println(rpad("year", 6), rpad("method", 22), lpad("points", 8), lpad("no flow", 9), lpad("no position", 13))
for i in eachindex(methods.year)
	println(rpad(methods.year[i], 6), rpad(coalesce(methods.method[i], ""), 22), lpad(methods.points[i], 8), lpad(methods.no_flow[i], 9), lpad(methods.no_position[i], 13))
end
'''

[[actionGroups.actions]]
id = "unknown-airports"
label = "Flights Without an Airport"
desc = "The flights whose airport of departure or arrival the OpenSky Network could not tell, those that return to where they left, and the airport codes OurAirports does not list"
models = ["air"]
code = '''
unseen = query("SELECT count(*) AS n, count(*) FILTER (WHERE origin IS NULL) AS no_origin, count(*) FILTER (WHERE destination IS NULL) AS no_destination, count(*) FILTER (WHERE origin = destination) AS returned FROM flights")
println(unseen.n[1], " flights: ", round(100 * unseen.no_origin[1] / unseen.n[1]; digits = 1), "% with no airport of departure, ", round(100 * unseen.no_destination[1] / unseen.n[1]; digits = 1), "% with no airport of arrival, ", unseen.returned[1], " back where they left")
unlisted = query("SELECT code, count(*) AS n FROM (SELECT origin AS code FROM flights UNION ALL SELECT destination FROM flights) WHERE code IS NOT NULL AND code NOT IN (SELECT icao FROM airports) GROUP BY code ORDER BY n DESC LIMIT 10")
println("Codes not in OurAirports: ", isempty(unlisted.code) ? "none" : join(["$(unlisted.code[i]) ($(unlisted.n[i]))" for i in eachindex(unlisted.code)], ", "))
