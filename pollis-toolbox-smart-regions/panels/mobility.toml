[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables, SmartRegions
{{?model=interaction|air}}using GLM, GLFixedEffectModels

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
execute(sql) = DBInterface.execute(con, sql)
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))
place = mkpath(joinpath(folder, "mobility"))  # where the files downloaded are kept, and the Next Steps save theirs
city = "{{city}}"
{{?city=custom}}given(name) = isabspath(expanduser(name)) ? expanduser(name) : joinpath(folder, name)  # a file of your own, by its path or its name in the folder
{{?model=commuting}}{{?city!=custom}}(; unit, source, away, home) = commuting_flows(con, city; folder = place)  # the census or employment statistics of the city's country, downloaded once: the tables zones and flows
{{?model=interaction}}{{?city!=singapore|custom}}(; unit, source, away, home) = commuting_flows(con, city; folder = place)  # the commuters between the zones: the tables zones and flows
{{?model=trips}}{{?city=london|newyork}}(; unit, source, away, home) = trip_flows(con, city; month = "{{month}}", folder = place)  # the trips of the month: the tables zones, flows, hours and trips
{{?model=trips|interaction}}{{?city=singapore}}(; unit, source, away, home) = trip_flows(con, city; month = "{{month}}", folder = place)  # the bus trips of the month, with the key of LTA DataMall: the tables zones, flows and hours
{{?model=commuting|trips|interaction}}{{?city=custom}}(; unit, source, away, home) = given_flows(con, given(raw"{{flowsFile}}"), given(raw"{{zonesFile}}"))  # your flows and zones: the tables zones and flows
{{?model=counts}}{{?city!=custom}}(; unit, source) = traffic_counts(con, city; folder = place)  # the city's counts of road traffic, downloaded once: the table counts, with classes or hours
{{?model=counts}}{{?city=custom}}(; unit, source) = given_counts(con, given(raw"{{countsFile}}"))  # your counts: the table counts
{{?model=air}}flights_file = air_flights(con, "{{airMonth}}"; folder = place)  # the flights of the month seen by the OpenSky Network's receivers (150 to 200 MB, once), and the airports of OurAirports: the tables flights and airports
{{?model=air}}key = basename(flights_file)
{{?model=commuting|trips|interaction}}totals = query("SELECT count(*) AS pairs, sum(flow) AS flow, sum(flow) FILTER (WHERE origin = destination) AS within FROM flows")
{{?model=commuting|trips}}println(source, ": ", only(query("SELECT count(*) AS n FROM zones").n), " zones, ", totals.pairs[1], " pairs of zones with a flow, ", round(Int, totals.flow[1]), " ", unit, " between them, ", round(Int, coalesce(totals.within[1], 0)), " within a zone")
{{?model=commuting|trips}}ismissing(away) || println(round(Int, away), " more ", unit, " start or end outside the zones", ismissing(home) ? "" : ", and $(round(Int, home)) work mainly at or from home")
{{?model=interaction}}execute("""CREATE OR REPLACE TABLE pairs AS SELECT a.zone AS origin, b.zone AS destination, coalesce(f.flow, 0) AS flow, ST_Distance_Spheroid(ST_Point(a.lon, a.lat), ST_Point(b.lon, b.lat)) / 1000 AS km
{{?model=interaction}}	FROM zones a CROSS JOIN zones b LEFT JOIN flows f ON f.origin = a.zone AND f.destination = b.zone WHERE a.zone <> b.zone""")  # every ordered pair of different zones, with no flow as 0, and the distance between their centroids
{{?model=air}}hubs = Dict("global" => String[], "london" => ["EGLL", "EGKK", "EGSS", "EGGW", "EGLC"], "amsterdam" => ["EHAM"], "paris" => ["LFPG", "LFPO"], "frankfurt" => ["EDDF"], "newyork" => ["KJFK", "KEWR", "KLGA"], "tokyo" => ["RJTT", "RJAA"], "hongkong" => ["VHHH"], "singapore" => ["WSSS"], "usa" => String[], "canada" => String[], "india" => String[], "brazil" => String[], "australia" => String[])[city]  # the ICAO codes of the city's airports
{{?model=air}}countries = Dict("usa" => ("US", "the United States"), "canada" => ("CA", "Canada"), "india" => ("IN", "India"), "brazil" => ("BR", "Brazil"), "australia" => ("AU", "Australia"))  # the ISO codes of the countries whose domestic flights the tab reads
{{?model=air}}served = "{{flightKind}}" == "airline" ? "AND regexp_matches(f.callsign, '^[A-Z]{3}[0-9]') AND a.scheduled AND b.scheduled" : ""  # flights with an airline's callsign between airports with scheduled service, or all
{{?model=air}}routes_of(source, scope = "") = """SELECT f.origin, f.destination, count(*)::DOUBLE AS flights, ST_Distance_Spheroid(ST_Point(a.lon, a.lat), ST_Point(b.lon, b.lat)) / 1000 AS km
{{?model=air}}	FROM $(source) f JOIN airports a ON a.icao = f.origin JOIN airports b ON b.icao = f.destination WHERE f.origin <> f.destination $(served) $(scope) GROUP BY f.origin, f.destination, a.lon, a.lat, b.lon, b.lat"""  # the flights between two known airports
{{?model=air}}domestic(code) = "AND a.country = '$(code)' AND b.country = '$(code)'"  # both airports in the country
{{?model=air}}execute("CREATE OR REPLACE TABLE routes AS " * routes_of("flights", haskey(countries, city) ? domestic(countries[city][1]) : ""))
{{?model=air}}execute("CREATE OR REPLACE TABLE traffic AS SELECT icao, sum(flights) AS flights FROM (SELECT origin AS icao, flights FROM routes UNION ALL SELECT destination, flights FROM routes) GROUP BY icao")  # departures and arrivals of each airport
{{?model=air}}execute("CREATE OR REPLACE TABLE busiest AS SELECT icao FROM traffic WHERE NOT list_contains([$(join(["'$(h)'" for h in hubs], ", "))]::VARCHAR[], icao) ORDER BY flights DESC LIMIT {{kept}}")  # the busiest airports, other than the city's
{{?model=air}}{{?city=global|usa|canada|india|brazil|australia}}execute("""CREATE OR REPLACE TABLE pairs AS SELECT a.icao AS origin, b.icao AS destination, coalesce(r.flights, 0) AS flow, ST_Distance_Spheroid(ST_Point(pa.lon, pa.lat), ST_Point(pb.lon, pb.lat)) / 1000 AS km
{{?model=air}}{{?city=global|usa|canada|india|brazil|australia}}	FROM busiest a CROSS JOIN busiest b JOIN airports pa ON pa.icao = a.icao JOIN airports pb ON pb.icao = b.icao LEFT JOIN routes r ON r.origin = a.icao AND r.destination = b.icao WHERE a.icao <> b.icao""")  # every ordered pair of the busiest airports, of the world or of the country
{{?model=air}}{{?city!=global|usa|canada|india|brazil|australia}}execute("""CREATE OR REPLACE TABLE pairs AS SELECT h.icao AS origin, b.icao AS destination, coalesce(r.flights, 0) AS flow, ST_Distance_Spheroid(ST_Point(ph.lon, ph.lat), ST_Point(pb.lon, pb.lat)) / 1000 AS km
{{?model=air}}{{?city!=global|usa|canada|india|brazil|australia}}	FROM (SELECT unnest([$(join(["'$(h)'" for h in hubs], ", "))]) AS icao) h CROSS JOIN busiest b JOIN airports ph ON ph.icao = h.icao JOIN airports pb ON pb.icao = b.icao LEFT JOIN routes r ON r.origin = h.icao AND r.destination = b.icao""")  # from each of the city's airports to each of the busiest others
{{?model=air}}unit = "flights"
{{?model=air}}seen = query("SELECT count(*) AS n, count(*) FILTER (WHERE origin IS NOT NULL AND destination IS NOT NULL) AS both_known FROM flights")
{{?model=air}}println(key, ": ", seen.n[1], " flights seen, ", seen.both_known[1], " with an airport of departure and of arrival; ", only(query("SELECT count(*) AS n FROM routes").n), haskey(countries, city) ? " domestic routes between airports of $(countries[city][2])" : " routes between airports")
{{?model=air}}{{?city!=global|usa|canada|india|brazil|australia}}masses = query("SELECT p.*, o.flights AS outflow, d.flights AS inflow FROM pairs p JOIN traffic o ON o.icao = p.origin JOIN traffic d ON d.icao = p.destination WHERE p.km > 0")  # each airport's departures and arrivals measure its size
{{?model=interaction}}masses = query("SELECT p.*, o.total AS outflow, d.total AS inflow FROM pairs p JOIN (SELECT origin, sum(flow) AS total FROM pairs GROUP BY ALL) o USING (origin) JOIN (SELECT destination, sum(flow) AS total FROM pairs GROUP BY ALL) d USING (destination) WHERE o.total > 0 AND d.total > 0 AND p.km > 0")  # the flows from each origin and to each destination measure their size
{{?model=air}}{{?city=global|usa|canada|india|brazil|australia}}masses = query("SELECT p.*, o.total AS outflow, d.total AS inflow FROM pairs p JOIN (SELECT origin, sum(flow) AS total FROM pairs GROUP BY ALL) o USING (origin) JOIN (SELECT destination, sum(flow) AS total FROM pairs GROUP BY ALL) d USING (destination) WHERE o.total > 0 AND d.total > 0 AND p.km > 0")
{{?model=interaction|air}}decay = "{{decay}}"
{{?model=interaction}}per_km = 1  # the exponential's distance in km
{{?model=air}}per_km = 1000  # the exponential's distance in thousands of km, on which the fit stays stable
{{?model=interaction|air}}data = (flow = masses.flow, x = decay == "power" ? log.(masses.km) : masses.km ./ per_km, log_outflow = log.(masses.outflow), log_inflow = log.(masses.inflow), origin = masses.origin, destination = masses.destination, everywhere = fill("all", length(masses.flow)))  # x: the log of the distance (power), or the distance (exponential)
{{?model=interaction|air}}formulas = Dict("doubly" => @formula(flow ~ x + fe(origin) + fe(destination)), "production" => @formula(flow ~ x + log_inflow + fe(origin)), "attraction" => @formula(flow ~ x + log_outflow + fe(destination)), "none" => @formula(flow ~ x + log_outflow + log_inflow + fe(everywhere)))  # everywhere: one group, whose effect is the intercept
{{?model=interaction|air}}fit_of(c; d = data) = nlreg(d, formulas[c], Poisson(), LogLink(), Vcov.robust(); save = [:mu])  # a Poisson model of the flows, whose fixed effects keep the totals of the constraint
{{?model=interaction|air}}function goodness(flow, fitted)  # the common part of the flows and the standardised root mean square error
{{?model=interaction|air}}	cpc = 2 * sum(min.(flow, fitted)) / (sum(flow) + sum(fitted))
{{?model=interaction|air}}	srmse = sqrt(sum((flow .- fitted) .^ 2) / length(flow)) / (sum(flow) / length(flow))
{{?model=interaction|air}}	return cpc, srmse
{{?model=interaction|air}}end
{{?model=air}}function network_fit(routes_sql)  # the doubly constrained model of the routes among the busiest airports of a set of routes, which Countries Compared and Months Compared use
{{?model=air}}	execute("CREATE OR REPLACE TEMP TABLE scope_routes AS $(routes_sql)")
{{?model=air}}	execute("CREATE OR REPLACE TEMP TABLE scope_traffic AS SELECT icao, sum(flights) AS flights FROM (SELECT origin AS icao, flights FROM scope_routes UNION ALL SELECT destination, flights FROM scope_routes) GROUP BY icao")
{{?model=air}}	totals = query("SELECT count(*) AS airports, sum(flights) / 2 AS flights, (SELECT count(*) FROM scope_routes) AS routes, (SELECT sum(flights * km) / sum(flights) FROM scope_routes) AS mean_km, (SELECT sum(flights) FROM (SELECT flights FROM scope_traffic ORDER BY flights DESC LIMIT 5)) / sum(flights) AS top5 FROM scope_traffic")
{{?model=air}}	p = query("""SELECT * FROM (SELECT a.icao AS origin, b.icao AS destination, coalesce(r.flights, 0) AS flow, ST_Distance_Spheroid(ST_Point(pa.lon, pa.lat), ST_Point(pb.lon, pb.lat)) / 1000 AS km,
{{?model=air}}		sum(coalesce(r.flights, 0)) OVER (PARTITION BY a.icao) AS outflow, sum(coalesce(r.flights, 0)) OVER (PARTITION BY b.icao) AS inflow
{{?model=air}}		FROM (SELECT icao FROM scope_traffic ORDER BY flights DESC LIMIT {{kept}}) a CROSS JOIN (SELECT icao FROM scope_traffic ORDER BY flights DESC LIMIT {{kept}}) b JOIN airports pa ON pa.icao = a.icao JOIN airports pb ON pb.icao = b.icao
{{?model=air}}		LEFT JOIN scope_routes r ON r.origin = a.icao AND r.destination = b.icao WHERE a.icao <> b.icao) WHERE outflow > 0 AND inflow > 0 AND km > 0""")
{{?model=air}}	d = (flow = p.flow, x = decay == "power" ? log.(p.km) : p.km ./ per_km, log_outflow = log.(p.outflow), log_inflow = log.(p.inflow), origin = p.origin, destination = p.destination, everywhere = fill("all", length(p.flow)))
{{?model=air}}	f = fit_of("doubly"; d = d)
{{?model=air}}	mu = coalesce.(f.augmentdf.mu, NaN)
{{?model=air}}	j = findfirst(==("x"), coefnames(f))
{{?model=air}}	ok = isfinite.(mu)
{{?model=air}}	return (airports = totals.airports[1], flights = totals.flights[1], routes = totals.routes[1], mean_km = totals.mean_km[1], top5 = totals.top5[1], beta = coef(f)[j], beta_se = stderror(f)[j], cpc = goodness(d.flow[ok], mu[ok])[1])
{{?model=air}}end
{{?model=interaction}}constraint = "{{constraint}}"
{{?model=air}}constraint = city == "global" || haskey(countries, city) ? "doubly" : "production"  # all the busiest airports both ways, of the world or of the country, or the departures from the city's airports
{{?model=interaction|air}}fit = fit_of(constraint)
{{?model=interaction|air}}fitted = coalesce.(fit.augmentdf.mu, NaN)
{{?model=interaction|air}}k = findfirst(==("x"), coefnames(fit))
{{?model=interaction|air}}beta, beta_se = coef(fit)[k], stderror(fit)[k]
{{?model=interaction|air}}cpc, srmse = goodness(data.flow[isfinite.(fitted)], fitted[isfinite.(fitted)])
{{?model=interaction|air}}modelled_csv = joinpath(mktempdir(), "modelled.csv")
{{?model=interaction|air}}open(io -> foreach(i -> println(io, data.origin[i], ",", data.destination[i], ",", data.flow[i], ",", fitted[i], ",", masses.km[i]), eachindex(fitted)), modelled_csv, "w")
{{?model=interaction|air}}execute("CREATE OR REPLACE TABLE modelled AS SELECT * FROM read_csv('$(modelled_csv)', header = false, names = ['origin', 'destination', 'flow', 'fitted', 'km'], types = {'origin': 'VARCHAR', 'destination': 'VARCHAR'})")  # the observed and fitted flow of each pair, which the Next Steps use
{{?model=interaction|air}}println(Dict("doubly" => "Doubly constrained", "production" => "Production constrained", "attraction" => "Attraction constrained", "none" => "Unconstrained")[constraint], " model, ", decay, " distance function, ", length(data.flow), " pairs, ", round(Int, sum(data.flow)), " ", unit)
{{?model=interaction|air}}println("Distance parameter ", round(beta; digits = 4), decay == "power" ? "" : per_km == 1 ? " a km" : " a thousand km", " (robust standard error ", round(beta_se; digits = 4), "); common part of the flows ", round(cpc; digits = 3), ", SRMSE ", round(srmse; digits = 3))
{{?model=counts}}s = query("SELECT count(DISTINCT site) AS sites, min(year) AS first, max(year) AS last FROM counts")
{{?model=counts}}y = query("SELECT count(*) AS sites, avg(flow) AS mean, median(flow) AS median, max(flow) AS top FROM counts WHERE year = $(s.last[1])")
{{?model=counts}}println(source, ": ", s.sites[1], " count points, ", s.first[1], " to ", s.last[1])
{{?model=counts}}println("In ", s.last[1], ", ", y.sites[1], " points: mean ", round(Int, y.mean[1]), ", median ", round(Int, y.median[1]), ", highest ", round(Int, y.top[1]), " ", unit)
'''

