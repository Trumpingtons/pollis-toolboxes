[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables, Downloads, ZipArchives, Dates
{{?model=interaction|air}}using GLM, GLFixedEffectModels

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
execute(sql) = DBInterface.execute(con, sql)
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))
place = mkpath(joinpath(folder, "mobility"))  # where the files downloaded are kept, and the Next Steps save theirs
city = "{{city}}"
enc(s) = join(isletter(c) && isascii(c) || isdigit(c) || c in "-_.~," ? string(c) : join("%" * uppercase(string(b; base = 16, pad = 2)) for b in codeunits(string(c))) for c in s)  # a value in the address of a request
function fetch(url, name; headers = Pair{String, String}[])  # a file downloaded once into the folder mobility: a later run reads it from there
	path = joinpath(place, name)
	isfile(path) && return path
	for k in 0:4
		try
			Downloads.download(url, path * ".part"; headers = ["User-Agent" => "Pollis (https://pollis.org)"; headers])
			return mv(path * ".part", path; force = true)
		catch e
			status = e isa Downloads.RequestError ? e.response.status : 0
			(k == 4 || 400 <= status < 500 && status != 429) && rethrow()
			println("Download of ", name, " failed (", status, "): trying again in ", 5 * 2^k, " s")
			sleep(5 * 2^k)
		end
	end
end
unzipped(zip, entry) = (path = joinpath(place, entry); isfile(path) || write(path, zip_readentry(ZipReader(read(zip)), entry)); path)  # one file of a zip archive, extracted once
{{?model=commuting|trips|interaction}}{{?city=cambridge|oxford|london}}authorities = Dict("cambridge" => ["Cambridge", "South Cambridgeshire"], "oxford" => ["Oxford", "Cherwell", "South Oxfordshire", "Vale of White Horse", "West Oxfordshire"],
{{?model=commuting|trips|interaction}}{{?city=cambridge|oxford|london}}	"london" => ["City of London", "Barking and Dagenham", "Barnet", "Bexley", "Brent", "Bromley", "Camden", "Croydon", "Ealing", "Enfield", "Greenwich", "Hackney", "Hammersmith and Fulham", "Haringey", "Harrow", "Havering", "Hillingdon",
{{?model=commuting|trips|interaction}}{{?city=cambridge|oxford|london}}	"Hounslow", "Islington", "Kensington and Chelsea", "Kingston upon Thames", "Lambeth", "Lewisham", "Merton", "Newham", "Redbridge", "Richmond upon Thames", "Southwark", "Sutton", "Tower Hamlets", "Waltham Forest", "Wandsworth", "Westminster"])[city]  # the local authorities whose areas are the zones
{{?model=commuting|trips|interaction}}{{?city=cambridge|oxford|london}}boundaries = fetch("https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services/MSOA_2021_EW_BSC_V3_RUC/FeatureServer/0/query?where=" * enc(join(["MSOA21NM LIKE '$(a) 0%'" for a in authorities], " OR ")) * "&outFields=MSOA21CD,MSOA21NM&outSR=4326&f=geojson", "msoa-2021-$(city).geojson")
{{?model=commuting|trips|interaction}}{{?city=cambridge|oxford|london}}execute("CREATE OR REPLACE TABLE zones AS SELECT MSOA21CD AS zone, MSOA21NM AS name, geom FROM ST_Read('$(boundaries)')")  # the middle layer super output areas (MSOAs) of 2021, Office for National Statistics
{{?model=commuting|interaction}}{{?city=cambridge|oxford|london}}census = unzipped(fetch("https://www.nomisweb.co.uk/output/census/2021/odwp01ew.zip", "odwp01ew.zip"), "ODWP01EW_MSOA.csv")  # Census 2021, residence and place of work by MSOA, ONS through Nomis (77 MB, once)
{{?model=commuting|interaction}}{{?city=cambridge|oxford|london}}execute("""CREATE OR REPLACE TABLE census AS SELECT "Middle layer Super Output Areas code" AS origin, "MSOA of workplace code" AS destination, "Place of work indicator (4 categories) code" AS kind, "Count" AS people FROM read_csv('$(census)') WHERE origin IN (SELECT zone FROM zones)""")
{{?model=commuting|interaction}}{{?city=cambridge|oxford|london}}execute("CREATE OR REPLACE TABLE flows AS SELECT origin, destination, sum(people)::DOUBLE AS flow FROM census WHERE kind = 3 AND destination IN (SELECT zone FROM zones) GROUP BY ALL")  # those who travel to a place of work in the UK, between the zones
{{?model=commuting|interaction}}{{?city=cambridge|oxford|london}}left = query("SELECT sum(people) FILTER (WHERE kind = 3 AND destination NOT IN (SELECT zone FROM zones)) AS away, sum(people) FILTER (WHERE kind = 1) AS home FROM census")
{{?model=commuting|interaction}}{{?city=cambridge|oxford|london}}unit, source = "workers", "Census 2021 (March 2021), workers aged 16 and over"
{{?model=commuting|interaction}}{{?city=amsterdam}}boundaries = fetch("https://api.pdok.nl/cbs/gebiedsindelingen/ogc/v1/collections/gemeente_gegeneraliseerd/items?f=json&limit=1000&jaarcode=2024&bbox=4.5,52.2,5.35,52.58", "gemeenten-2024-amsterdam.geojson")
{{?model=commuting|interaction}}{{?city=amsterdam}}execute("CREATE OR REPLACE TABLE zones AS SELECT statcode AS zone, statnaam AS name, geom FROM ST_Read('$(boundaries)')")  # the municipalities around Amsterdam in 2024, Statistics Netherlands (CBS) through PDOK
{{?model=commuting|interaction}}{{?city=amsterdam}}codes = query("SELECT zone FROM zones").zone
{{?model=commuting|interaction}}{{?city=amsterdam}}selection = "Perioden eq '2024MM12' and (" * join(["WoonregioS eq '$(c)'" for c in codes], " or ") * ") and (WerkregioS eq 'NL00  ' or " * join(["WerkregioS eq '$(c)'" for c in codes], " or ") * ")"
{{?model=commuting|interaction}}{{?city=amsterdam}}jobs = fetch("https://opendata.cbs.nl/ODataApi/odata/85481NED/TypedDataSet?\$format=json&\$filter=" * enc(selection), "cbs-85481NED-2024-amsterdam.json")  # jobs of employees by municipality of residence and of work, CBS table 85481NED
{{?model=commuting|interaction}}{{?city=amsterdam}}execute("CREATE OR REPLACE TABLE cbs AS SELECT trim(r.WoonregioS) AS origin, trim(r.WerkregioS) AS destination, coalesce(r.BanenVanWerknemers_1, 0) * 1000 AS jobs FROM (SELECT unnest(value) AS r FROM read_json('$(jobs)'))")  # the table counts thousands of jobs
{{?model=commuting|interaction}}{{?city=amsterdam}}execute("CREATE OR REPLACE TABLE flows AS SELECT origin, destination, jobs AS flow FROM cbs WHERE destination <> 'NL00' AND jobs > 0")
{{?model=commuting|interaction}}{{?city=amsterdam}}left = query("SELECT sum(jobs) FILTER (WHERE destination = 'NL00') - sum(jobs) FILTER (WHERE destination <> 'NL00') AS away, NULL::DOUBLE AS home FROM cbs")
{{?model=commuting|interaction}}{{?city=amsterdam}}unit, source = "jobs", "Statistics Netherlands, jobs of employees in December 2024 (provisional)"
{{?model=commuting|interaction}}{{?city=paris}}geo = "https://geo.api.gouv.fr/communes?format=geojson&geometry=contour&fields=code,nom&codeDepartement="
{{?model=commuting|interaction}}{{?city=paris}}parts = [fetch(geo * "75&type=arrondissement-municipal", "paris-arrondissements.geojson"); [fetch(geo * d, "communes-$(d).geojson") for d in ("92", "93", "94")]]  # Paris and the three departments around it, from geo.api.gouv.fr
{{?model=commuting|interaction}}{{?city=paris}}execute("CREATE OR REPLACE TABLE zones AS " * join(["SELECT code AS zone, nom AS name, geom FROM ST_Read('$(p)')" for p in parts], " UNION ALL "))  # the 20 arrondissements of Paris and the communes of Hauts-de-Seine, Seine-Saint-Denis and Val-de-Marne
{{?model=commuting|interaction}}{{?city=paris}}flux = unzipped(fetch("https://www.insee.fr/fr/statistiques/fichier/8582949/base-flux-mobilite-domicile-lieu-travail-2022_csv.zip", "insee-flux-domicile-travail-2022.zip"), "base-flux-mobilite-domicile-lieu-travail-2022.csv")  # INSEE, 2022 census
{{?model=commuting|interaction}}{{?city=paris}}execute("CREATE OR REPLACE TABLE insee AS SELECT CODGEO AS origin, DCLT AS destination, NBFLUX_C22_ACTOCC15P AS workers FROM read_csv('$(flux)', delim = ';', types = {'CODGEO': 'VARCHAR', 'DCLT': 'VARCHAR'}) WHERE CODGEO IN (SELECT zone FROM zones)")
{{?model=commuting|interaction}}{{?city=paris}}execute("CREATE OR REPLACE TABLE flows AS SELECT origin, destination, sum(workers) AS flow FROM insee WHERE destination IN (SELECT zone FROM zones) GROUP BY ALL")
{{?model=commuting|interaction}}{{?city=paris}}left = query("SELECT sum(workers) FILTER (WHERE destination NOT IN (SELECT zone FROM zones)) AS away, NULL::DOUBLE AS home FROM insee")
{{?model=commuting|interaction}}{{?city=paris}}unit, source = "workers", "INSEE, 2022 census, employed people aged 15 and over by commune of residence and of work"
{{?model=commuting|interaction}}{{?city=frankfurt}}boundaries = fetch("https://sgx.geodatenzentrum.de/wfs_vg250?service=WFS&version=2.0.0&request=GetFeature&typeNames=vg250:vg250_krs&outputFormat=application/json&srsName=EPSG:4326&bbox=49.75,8.15,50.45,9.3,urn:ogc:def:crs:EPSG::4326", "vg250-kreise-frankfurt.geojson")
{{?model=commuting|interaction}}{{?city=frankfurt}}execute("CREATE OR REPLACE TABLE zones AS SELECT ags AS zone, gen AS name, ST_Union_Agg(geom) AS geom FROM ST_Read('$(boundaries)') WHERE gf = 4 GROUP BY ALL")  # the districts (Kreise) around Frankfurt, VG250 of the Federal Agency for Cartography and Geodesy (BKG)
{{?model=commuting|interaction}}{{?city=frankfurt}}execute("INSTALL excel"); execute("LOAD excel")  # DuckDB's extension for Excel files
{{?model=commuting|interaction}}{{?city=frankfurt}}pendler = fetch("https://statistik.arbeitsagentur.de/Statistikdaten/Detail/202306/iiia6/beschaeftigung-pendler-krpend/krpend-k-0-202306-xlsx.xlsx?__blob=publicationFile&v=1", "krpend-k-0-202306.xlsx")  # Federal Employment Agency, commuters between districts on 30 June 2023
{{?model=commuting|interaction}}{{?city=frankfurt}}execute("""CREATE OR REPLACE TABLE ba AS WITH r AS (SELECT row_number() OVER () AS i, * FROM read_xlsx('$(pendler)', sheet = 'Auspendler Kreise', all_varchar = true, header = false, range = 'A1:E400000', stop_at_empty = false))
{{?model=commuting|interaction}}{{?city=frankfurt}}	SELECT origin, destination, people FROM (SELECT last_value(A IGNORE NULLS) OVER (ORDER BY i) AS origin, C AS destination, TRY_CAST(E AS DOUBLE) AS people FROM r)
{{?model=commuting|interaction}}{{?city=frankfurt}}	WHERE length(destination) = 5 AND origin IN (SELECT zone FROM zones)""")  # a residence row, then one row per district of work; codes of 5 digits are districts, the shorter ones totals
