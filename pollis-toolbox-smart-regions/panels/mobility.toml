{{?model=counts}}{{?city=cambridge|oxford|london}}execute("CREATE OR REPLACE TABLE counts AS SELECT CAST(count_point_id AS VARCHAR) AS site, road_name || coalesce(' (' || start_junction_road_name || ' to ' || end_junction_road_name || ')', '') AS name, road_type AS kind, longitude AS lon, latitude AS lat, year, all_motor_vehicles::DOUBLE AS flow, estimation_method AS method FROM dft")
{{?model=counts}}{{?city=cambridge|oxford|london}}execute("""CREATE OR REPLACE TABLE classes AS UNPIVOT (SELECT CAST(count_point_id AS VARCHAR) AS site, year, pedal_cycles AS "Pedal cycles", two_wheeled_motor_vehicles AS "Motorcycles", cars_and_taxis AS "Cars and taxis", buses_and_coaches AS "Buses and coaches", lgvs AS "Light goods vehicles", all_hgvs AS "Heavy goods vehicles" FROM dft) ON COLUMNS(* EXCLUDE (site, year)) INTO NAME class VALUE flow""")
