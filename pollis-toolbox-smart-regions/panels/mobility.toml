println("Mean distance between the centroids, weighted by the flows: ", round(sum(travelled.flow_km) / sum(travelled.flow); digits = 2), " km")
EChart(ec_width = 680, ec_height = 380, title = [ECharts.Title(text = "Flows between Zones by Distance")], tooltip = ECharts.Tooltip(),
	xAxis = [ECharts.Axis(_type = "category", data = bands_text)], yAxis = [ECharts.Axis(_type = "value", name = "% of the $(unit)")],
	series = [ECharts.XYSeries(name = "Share", _type = "bar", data = round.(shares; digits = 2))])
