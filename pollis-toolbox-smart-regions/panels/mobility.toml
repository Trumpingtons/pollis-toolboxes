[[actionGroups.actions]]
id = "distances"
label = "Distances Travelled"
desc = "The share of the flows between two different zones in each band of distance between their centroids, as a bar chart drawn with ECharts, with the mean distance"
models = ["commuting", "trips"]
code = '''
using ECharts

travelled = query("""SELECT CASE WHEN km < 2 THEN 1 WHEN km < 5 THEN 2 WHEN km < 10 THEN 3 WHEN km < 20 THEN 4 WHEN km < 50 THEN 5 ELSE 6 END AS band, sum(flow) AS flow, sum(flow * km) AS flow_km
	FROM (SELECT f.flow, ST_Distance_Spheroid(ST_Point(o.lon, o.lat), ST_Point(d.lon, d.lat)) / 1000 AS km FROM flows f JOIN zones o ON o.zone = f.origin JOIN zones d ON d.zone = f.destination WHERE f.origin <> f.destination) GROUP BY band ORDER BY band""")
bands_text = ["Under 2 km", "2 to 5 km", "5 to 10 km", "10 to 20 km", "20 to 50 km", "50 km or more"]
shares = zeros(6)
shares[travelled.band] .= 100 .* travelled.flow ./ sum(travelled.flow)
println("Mean distance between the centroids, weighted by the flows: ", round(sum(travelled.flow_km) / sum(travelled.flow); digits = 2), " km")
EChart(ec_width = 680, ec_height = 380, title = [ECharts.Title(text = "Flows between Zones by Distance")], tooltip = ECharts.Tooltip(),
	xAxis = [ECharts.Axis(_type = "category", data = bands_text)], yAxis = [ECharts.Axis(_type = "value", name = "% of the $(unit)")],
	series = [ECharts.XYSeries(name = "Share", _type = "bar", data = round.(shares; digits = 2))])
'''

