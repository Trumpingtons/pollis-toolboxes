levels = Dict("doubly" => length(unique(data.origin)) + length(unique(data.destination)) - 1, "production" => length(unique(data.origin)), "attraction" => length(unique(data.destination)), "none" => 1)[constraint]
dof = count(usable) - length(coef(fit)) - levels
pearson = sum((data.flow[usable] .- fitted[usable]) .^ 2 ./ fitted[usable])
println("Pearson statistic over its degrees of freedom: ", round(pearson / dof; digits = 2), " (", dof, " degrees of freedom)")
println("Pairs with no flow: ", round(100 * count(==(0), data.flow[usable]) / count(usable); digits = 1), "% observed, ", round(100 * sum(exp.(-fitted[usable])) / count(usable); digits = 1), "% expected by the Poisson model")
println("The standard errors of the tab are robust, and stay valid when the flows are overdispersed")
'''

