[[actionGroups.actions]]
id = "countries-compared"
label = "Countries Compared"
desc = "The domestic flights of the United States, Canada, India, Brazil and Australia in the month: airports, routes, flights, the share of the five busiest airports, the mean distance flown, the share of the departures seen whose airport of arrival is known, and the distance parameter and common part of the flows of a doubly constrained model among the busiest airports of each"
models = ["air"]
code = '''
println(rpad("country", 19), lpad("airports", 9), lpad("routes", 8), lpad("flights", 9), lpad("top 5 %", 9), lpad("mean km", 9), lpad("distance", 10), lpad("CPC", 7), lpad("ends %", 8))
for (code, title) in sort(collect(values(countries)); by = last)
	r = network_fit(routes_of("flights", domestic(code)))
	ends = only(query("SELECT avg((f.destination IS NOT NULL)::INTEGER) AS share FROM flights f JOIN airports a ON a.icao = f.origin WHERE a.country = ?", [code]).share)  # how often the receivers saw both ends of a flight from the country
	println(rpad(replace(title, r"^the " => ""), 19), lpad(r.airports, 9), lpad(r.routes, 8), lpad(round(Int, r.flights), 9), lpad(round(100 * r.top5; digits = 1), 9), lpad(round(Int, r.mean_km), 9), lpad(round(r.beta; digits = 3), 10), lpad(round(r.cpc; digits = 3), 7), lpad(round(100 * ends; digits = 1), 8))
end
println("Domestic flights of {{airMonth}}; each model among the {{kept}} busiest airports of the country, with the ", decay, " distance function")
'''

[[actionGroups.actions]]
id = "months-compared"
label = "Months Compared"
desc = "The same month of each year from 2019 to 2022, worldwide or within the country: airports, routes, flights, the share of the five busiest airports, the mean distance flown, and the distance parameter of a doubly constrained model; downloads the flight lists of the other three years"
models = ["air"]
when = "city=global|usa|canada|india|brazil|australia"
code = '''
month_of_year = "{{airMonth}}"[6:7]
println(rpad("month", 9), lpad("airports", 9), lpad("routes", 8), lpad("flights", 9), lpad("top 5 %", 9), lpad("mean km", 9), lpad("distance", 10), lpad("CPC", 7))
for y in 2019:2022
	file_y = flight_list("$(y)-$(month_of_year)"; folder = place)  # a flight list of 150 to 200 MB, downloaded once
	r = network_fit(routes_of("read_csv('$(file_y)', types = {'callsign': 'VARCHAR', 'origin': 'VARCHAR', 'destination': 'VARCHAR'})", haskey(countries, city) ? domestic(countries[city][1]) : ""))
	println(rpad("$(y)-$(month_of_year)", 9), lpad(r.airports, 9), lpad(r.routes, 8), lpad(round(Int, r.flights), 9), lpad(round(100 * r.top5; digits = 1), 9), lpad(round(Int, r.mean_km), 9), lpad(round(r.beta; digits = 3), 10), lpad(round(r.cpc; digits = 3), 7))
end
'''

[[actionGroups.actions]]
id = "weekdays-weekends"
label = "Weekdays and Weekends"
desc = "The share of each kind of day's trips that start in each hour, weekdays beside weekends, as a line chart drawn with ECharts, with the busiest hour of each"
models = ["trips"]
when = "city!=custom"
code = '''
using ECharts

profile = query("SELECT day, hour, 100 * flow / sum(flow) OVER (PARTITION BY day) AS share FROM (SELECT day, hour, sum(flow) AS flow FROM hours GROUP BY ALL) ORDER BY day, hour")
kinds = unique(profile.day)
for k in kinds
	rows = findall(==(k), profile.day)
	top = rows[argmax(profile.share[rows])]
	println(k, ": busiest hour ", profile.hour[top], ":00, ", round(profile.share[top]; digits = 1), "% of the trips")
end
EChart(ec_width = 720, ec_height = 400, title = [ECharts.Title(text = "Trips by Hour, Weekdays and Weekends")], tooltip = ECharts.Tooltip(trigger = "axis"), legend = ECharts.Legend(data = kinds),
	xAxis = [ECharts.Axis(_type = "value", name = "Hour", min = 0, max = 23)], yAxis = [ECharts.Axis(_type = "value", name = "% of the day's trips")],
	series = [ECharts.XYSeries(name = k, _type = "line", data = [[profile.hour[i], round(profile.share[i]; digits = 2)] for i in eachindex(profile.hour) if profile.day[i] == k]) for k in kinds])
'''

[[actionGroups.actions]]
id = "counts-years"
label = "Counts over the Years"
desc = "The count points and their median daily flow in each year, as a line chart drawn with ECharts, and the change at the points counted in both the first and the latest of the last ten years"
models = ["counts"]
code = '''
using ECharts

yearly_counts = query("SELECT year, count(*) AS points, median(flow) AS median FROM counts GROUP BY year ORDER BY year")
start_year = max(s.first[1], s.last[1] - 10)
both = query("SELECT median(b.flow / a.flow - 1) AS change, count(*) AS points FROM counts a JOIN counts b ON a.site = b.site AND a.year = $(start_year) AND b.year = $(s.last[1]) WHERE a.flow > 0")
println(both.points[1], " points counted in both ", start_year, " and ", s.last[1], both.points[1] > 0 ? ": median change $(round(100 * both.change[1]; digits = 1))%" : "")
EChart(ec_width = 720, ec_height = 400, title = [ECharts.Title(text = "Median Daily Flow by Year")], tooltip = ECharts.Tooltip(trigger = "axis"), legend = ECharts.Legend(data = ["Median flow", "Count points"]),
	xAxis = [ECharts.Axis(_type = "category", data = string.(yearly_counts.year))], yAxis = [ECharts.Axis(_type = "value", name = unit), ECharts.Axis(_type = "value", name = "Points")],
	series = [ECharts.XYSeries(name = "Median flow", _type = "line", data = round.(yearly_counts.median)), ECharts.XYSeries(name = "Count points", _type = "bar", yAxisIndex = 1, data = yearly_counts.points)])
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "net-flows"
label = "Net Flows"
desc = "The zones that draw the most from the others and those that send the most: inflow, outflow, their difference, and self-containment, the share of the flows leaving a zone that end in it"
models = ["commuting", "trips"]
when = "city!=hongkong"
code = '''
balance = query("""SELECT z.name, coalesce(i.flow, 0) AS inflow, coalesce(o.flow, 0) AS outflow, coalesce(w.flow, 0) AS within FROM zones z
	LEFT JOIN (SELECT destination AS zone, sum(flow) AS flow FROM flows WHERE origin <> destination GROUP BY ALL) i ON i.zone = z.zone
	LEFT JOIN (SELECT origin AS zone, sum(flow) AS flow FROM flows WHERE origin <> destination GROUP BY ALL) o ON o.zone = z.zone
	LEFT JOIN (SELECT origin AS zone, flow FROM flows WHERE origin = destination) w ON w.zone = z.zone ORDER BY inflow - outflow DESC""")
row_of(i) = println(rpad(first(balance.name[i], 30), 32), lpad(round(Int, balance.inflow[i]), 10), lpad(round(Int, balance.outflow[i]), 10), lpad(round(Int, balance.inflow[i] - balance.outflow[i]), 10), lpad(balance.within[i] + balance.outflow[i] > 0 ? round(100 * balance.within[i] / (balance.within[i] + balance.outflow[i]); digits = 1) : 0.0, 14))
println(rpad("zone", 32), lpad("inflow", 10), lpad("outflow", 10), lpad("net", 10), lpad("self-cont. %", 14))
foreach(row_of, 1:min(10, length(balance.name)))
println("...")
foreach(row_of, max(11, length(balance.name) - 9):length(balance.name))
sum(balance.within) == 0 && println("The source counts no flows within a zone, so self-containment is 0")
'''

[[actionGroups.actions]]
id = "largest-flows"
label = "Largest Flows"
desc = "The twenty largest flows between two different zones, with the distance between their centroids"
models = ["commuting", "trips", "interaction"]
code = '''
largest = query("SELECT o.name AS origin, d.name AS destination, f.flow, ST_Distance_Spheroid(ST_Point(o.lon, o.lat), ST_Point(d.lon, d.lat)) / 1000 AS km FROM flows f JOIN zones o ON o.zone = f.origin JOIN zones d ON d.zone = f.destination WHERE f.origin <> f.destination ORDER BY f.flow DESC LIMIT 20")
for i in eachindex(largest.flow)
	println(rpad(first(largest.origin[i], 30), 32), rpad(first(largest.destination[i], 30), 32), lpad(round(Int, largest.flow[i]), 10), " ", unit, lpad(round(largest.km[i]; digits = 1), 8), " km")
end
'''

[[actionGroups.actions]]
id = "distance-parameter"
label = "Distance Parameter"
desc = "What the distance parameter says: how much the model's flows change when the distance doubles (power) or grows by a fixed step (exponential), with a 95% confidence interval from the robust standard error"
models = ["interaction", "air"]
code = '''
low, high = beta - 1.96 * beta_se, beta + 1.96 * beta_se
{{?model=interaction}}step = 10  # km
{{?model=air}}step = 1000  # km
if decay == "power"
	println("When the distance doubles, the flow the model expects is multiplied by ", round(2^beta; digits = 3), " (95% interval ", round(2^low; digits = 3), " to ", round(2^high; digits = 3), ")")
else
	println("For each further ", step, " km, the flow the model expects is multiplied by ", round(exp(step * beta / per_km); digits = 3), " (95% interval ", round(exp(step * low / per_km); digits = 3), " to ", round(exp(step * high / per_km); digits = 3), ")")
end
println("The other terms of the model held fixed: the totals of the constraint and the sizes of the places")
'''

