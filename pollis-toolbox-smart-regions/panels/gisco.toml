[[faq]]
question = "Why do some codes of a Eurostat table find no region?"
answer = '''
NUTS changes every few years, and a Eurostat table may hold codes of several NUTS versions, or of several levels: a region that was split, merged or renumbered has a code that the regions of another version do not have. Codes and Eurostat lists the codes of the table that are not among the regions read, and the regions that have no value.

Read the regions of the NUTS version the table uses, with the Year input, or leave those codes out.
'''
wiki = "Diagnostics"

[[faq]]
question = "Which scale should I use for NUTS regions?"
answer = '''
GISCO derives its 1:1 million, 3, 10, 20 and 60 million versions by generalising its 1:100,000 data, and its metadata says the small-scale versions are meant for cartographic purposes. 1:20 million draws a map of Europe quickly; 1:1 million follows the boundaries more closely, for maps of one country and for areas.

Scales Side by Side shows how the number of vertices and the areas change from one scale to another.
'''
wiki = "Decision Guide"

[[faq]]
question = "Can I use GISCO boundaries in a commercial product?"
answer = '''
GISCO's page for administrative units grants the use of the data it distributes for communes, countries and postal codes on condition that they are not used for commercial purposes and that the source is acknowledged, with the notice © EuroGeographics for the administrative boundaries on any map or publication. For commercial use, it refers to EuroGeographics' licence agreements.

Check the page of each dataset on GISCO's website for its own terms.
'''
wiki = "GISCO Distribution"

[[faq]]
question = "What is a functional urban area?"
answer = '''
A city together with its commuting zone, as the EU-OECD method defines it: it encompasses the economic and functional extent of a city, based on people's daily movements. The Cities and Functional Urban Areas tab reads either the cities or the functional urban areas of GISCO's Urban Audit; Cities and Their Areas sets each city beside its functional urban area.
'''
wiki = "Overview"

[[faq]]
question = "What are the NUTS levels?"
answer = '''
NUTS divides each member state into NUTS 1 regions, each divided into NUTS 2 regions, each divided into NUTS 3 regions; GISCO also distributes a country level, NUTS 0. Eurostat describes NUTS 1 as major socio-economic regions, NUTS 2 as basic regions for regional policies and NUTS 3 as small regions for specific diagnoses.
'''
wiki = "NUTS Classification"
hidden = true

[[faq]]
question = "How often does NUTS change?"
answer = '''
Regulation (EC) No 1059/2003 allows amendments to the NUTS classification not more frequently than every three years, and Eurostat says the classification should stay stable for at least three years. GISCO distributes the versions of 2003, 2006, 2010, 2013, 2016, 2021 and 2024; Versions Side by Side shows the codes a version added and removed.
'''
wiki = "NUTS Classification"
hidden = true

[[faq]]
question = "What does an SDMX key such as A.PER_KM2. select?"
answer = '''
One value for each dimension of a Eurostat table, in the order of its dimensions, separated by dots; an empty position selects every value of that dimension. For demo_r_d3dens, whose dimensions are frequency, unit and region, A.PER_KM2. selects the annual values in persons per km² for every region.
'''
wiki = "Eurostat Statistics by Region"
hidden = true

[[faq]]
question = "Why does the panel download the LAU file only once?"
answer = '''
GISCO publishes the local administrative units of all of Europe in one file, at 1:1 million: about 78 MB as GeoPackage for 2024. The panel downloads it to the folder the first time and reads it from there afterwards, keeping the units of the Country chosen.
'''
wiki = "Local Administrative Units"
hidden = true

