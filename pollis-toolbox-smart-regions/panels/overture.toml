[[faq]]
question = "Does the panel download whole Overture files?"
answer = '''
No. Overture's catalogue lists every GeoParquet file of a release with the bounding box of its features, so the panel reads only the files that overlap the area. Inside those files, DuckDB reads only the row groups whose bounding boxes overlap it, over HTTPS, so a few square kilometres of a city take seconds, not the hundreds of megabytes of a file.

Divisions take longer: the polygons of a country or a region overlap any area inside them, and are large.
'''
wiki = "GeoParquet in the Cloud"

[[faq]]
question = "Why did an Overture release I used last month stop working?"
answer = '''
Overture keeps a release in its public buckets for at most 60 days, two monthly releases, to comply with data protection rules such as the right to be forgotten. A release name that has expired finds no files. The Release input set to latest asks Overture's catalogue for the newest release each time; Release and Files lists the releases the catalogue still has.

To keep the data of a release, save it with Save as GeoParquet.
'''
wiki = "Diagnostics"

[[faq]]
question = "Which licence does Overture data have?"
answer = '''
It depends on the theme and the source. Buildings, transportation, divisions and the base theme are under the Open Database License (ODbL), since they contain OpenStreetMap data; places are under CDLA Permissive 2.0 for most sources, with Foursquare's under Apache 2.0; addresses come from open address registers, each with its own licence.

Every feature names its sources and their licences; Sources and Licences counts them for the features read.
'''
wiki = "Sources and Licences"

[[faq]]
question = "Is Overture the same as OpenStreetMap?"
answer = '''
No. Overture uses OpenStreetMap as one of its sources, for most buildings, roads and boundaries, and adds other sources: machine-learned building footprints from Microsoft and Google, places from Meta, Microsoft, Foursquare and others, roads from TomTom, and national address registers. It conflates them into one schema, with stable identifiers, released every month.

Sources Side by Side shows what each source gives in the area.
'''
wiki = "Overture and OpenStreetMap"

[[faq]]
question = "What is the confidence of an Overture place?"
answer = '''
A number between 0 and 1, which Overture computes for each place as its confidence that the place exists. Places with low confidence are more likely to be closed, duplicated or wrong.

The Minimum Confidence input of the Places tab leaves out the places below it; Confidence Check shows how confidence is spread over the places of the area.
'''
wiki = "Diagnostics"
hidden = true

[[faq]]
question = "Why do buildings at the edge of the area cross its boundary?"
answer = '''
The panel keeps every feature whose bounding box overlaps the area, so features that cross the boundary are kept whole. The totals of the Next Steps count them whole, except Building Measures and Division Areas, which also give the part of each footprint or polygon inside the area.
'''
wiki = "Diagnostics"
hidden = true

[[faq]]
question = "What are the themes of Overture Maps?"
answer = '''
Six: addresses, base (land, water, land use, land cover, infrastructure and bathymetry), buildings (buildings and building parts), divisions (countries, regions, counties, localities and neighbourhoods, as points, areas and boundaries), places (points of interest), and transportation (road, rail and water segments and the connectors between them).

The tabs of the panel read five of them; the base theme is left to the GeoParquet files themselves.
'''
wiki = "Themes and Types"
hidden = true

[[faq]]
question = "How does DuckDB find the latest Overture release?"
answer = '''
Overture publishes a STAC catalogue at stac.overturemaps.org whose catalog.json has a field latest, the name of the newest release, such as 2026-11-18.0. DuckDB reads the JSON over HTTPS, and the release's collections.parquet then lists its files.
'''
wiki = "GeoParquet in the Cloud"
hidden = true

