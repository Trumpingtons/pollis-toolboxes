label = "Folder"
tooltip = "Where Save as GeoPackage and Save as GeoParquet write: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[inputs]]
id = "bbox"
label = "Area"
tooltip = "The area as west, south, east, north: longitudes and latitudes in degrees, WGS 84. The default is the centre of Coimbra, about 4 by 4.5 km. A larger area reads more data and takes longer."
default = "-8.45, 40.19, -8.40, 40.23"

[[inputs]]
id = "release"
label = "Release"
tooltip = "The Overture release, such as 2026-11-18.0, or latest: the newest release in Overture's catalogue. Overture keeps a release for at most 60 days."
