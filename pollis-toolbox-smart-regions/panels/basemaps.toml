[[actionGroups.actions]]
id = "coordinates-in-range"
label = "Coordinates in Range"
desc = "How many features have no geometry, coordinates outside longitude -180 to 180 or latitude -90 to 90, or lie beyond 85.05 degrees, where web maps end"
code = '''
r = Tables.columntable(DBInterface.execute(con, """
SELECT count(*) AS n,
	count(*) FILTER (WHERE geom IS NULL OR ST_IsEmpty(geom)) AS missing,
	count(*) FILTER (WHERE ST_XMin(geom) < -180 OR ST_XMax(geom) > 180 OR ST_YMin(geom) < -90 OR ST_YMax(geom) > 90) AS outside,
	count(*) FILTER (WHERE ST_YMin(geom) < -85.0511 OR ST_YMax(geom) > 85.0511) AS polar,
	min(ST_XMin(geom)) AS xmin, max(ST_XMax(geom)) AS xmax, min(ST_YMin(geom)) AS ymin, max(ST_YMax(geom)) AS ymax
FROM features
"""))
println(r.n[1], " features: ", r.missing[1], " without a geometry, ", r.outside[1], " outside longitude -180 to 180 or latitude -90 to 90, ", r.polar[1], " beyond latitude 85.05 north or south, where web maps end")
ismissing(r.xmin[1]) || println("Longitude from ", r.xmin[1], " to ", r.xmax[1], ", latitude from ", r.ymin[1], " to ", r.ymax[1])
r.outside[1] > 0 &&println("Coordinates outside those ranges are not longitude and latitude: give the file's own system in the File Coordinate System input")
'''

[[actionGroups.actions]]
id = "layer-size"
label = "Layer Size"
desc = "The size of the GeoJSON layer the map draws, and its features and vertices by geometry type"
models = ["features", "column"]
code = '''
s = Tables.columntable(DBInterface.execute(con, "SELECT ST_GeometryType(geom)::VARCHAR AS type, count(*) AS n, sum(ST_NPoints(geom))::BIGINT AS vertices FROM features WHERE geom IS NOT NULL GROUP BY ALL ORDER BY n DESC"))
println("The layer drawn on the map: ", round(filesize(layer) / 1024, digits = 1), " KB of GeoJSON")
println(rpad("geometry type", 22), rpad("features", 10), "vertices")
for i in eachindex(s.type)
	println(rpad(s.type[i], 22), rpad(s.n[i], 10), s.vertices[i])
end
'''

