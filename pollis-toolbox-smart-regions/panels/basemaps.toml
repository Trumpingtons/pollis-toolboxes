[[actionGroups.actions]]
id = "all-and-filtered"
label = "All and Filtered Features"
desc = "Every feature of the file in grey, and the ones the Filter keeps in colour, on one map"
models = ["features", "column"]
code = '''
DBInterface.execute(con, "CREATE OR REPLACE TABLE everything AS SELECT * EXCLUDE (geom), ST_Transform(geom, '{{fileCrs}}', 'EPSG:4326') AS geom FROM $reader")  # every feature of the file
DBInterface.execute(con, "ALTER TABLE everything DROP COLUMN IF EXISTS ogc_fid")
everything = joinpath(mktempdir(), "all.geojson")
DBInterface.execute(con, "COPY (SELECT * FROM everything WHERE geom IS NOT NULL) TO '$(everything)' (FORMAT GDAL, DRIVER 'GeoJSON')")
n_all = only(Tables.columntable(DBInterface.execute(con, "SELECT count(*) AS n FROM everything")).n)
n_kept = only(Tables.columntable(DBInterface.execute(con, "SELECT count(*) AS n FROM features")).n)
println(n_kept, " of ", n_all, " features kept by the filter ", raw"{{filter}}")
display(Pollis.webmap(Pollis.layer(everything; name = "All Features", color = "#9e9e9e"), shown; style = "{{style}}"))
'''

[[actionGroups.actions]]
id = "simplified-and-original"
label = "Simplified and Original"
desc = "The lines and polygons simplified with ST_SimplifyPreserveTopology, at a tolerance of half a percent of their extent, beside the originals: vertices, size and shapes"
models = ["features", "column"]
code = '''
ext = Tables.columntable(DBInterface.execute(con, "SELECT max(ST_XMax(geom)) - min(ST_XMin(geom)) AS w, max(ST_YMax(geom)) - min(ST_YMin(geom)) AS h FROM features"))
tolerance = max(coalesce(ext.w[1], 0.0), coalesce(ext.h[1], 0.0)) / 200  # in degrees: half a percent of the extent
simple = joinpath(mktempdir(), "simplified.geojson")
DBInterface.execute(con, "COPY (SELECT * EXCLUDE (geom), ST_SimplifyPreserveTopology(geom, $(tolerance)) AS geom FROM features WHERE geom IS NOT NULL) TO '$(simple)' (FORMAT GDAL, DRIVER 'GeoJSON')")
v = Tables.columntable(DBInterface.execute(con, "SELECT sum(ST_NPoints(geom))::BIGINT AS original, sum(ST_NPoints(ST_SimplifyPreserveTopology(geom, $(tolerance))))::BIGINT AS simplified FROM features WHERE geom IS NOT NULL"))
println("Tolerance ", round(tolerance, sigdigits = 3), " degrees")
println(rpad("Original", 12), rpad(string(coalesce(v.original[1], 0), " vertices"), 18), round(filesize(layer) / 1024, digits = 1), " KB")
println(rpad("Simplified", 12), rpad(string(coalesce(v.simplified[1], 0), " vertices"), 18), round(filesize(simple) / 1024, digits = 1), " KB")
display(Pollis.webmap(Pollis.layer(layer; name = "Original", color = "#9e9e9e", opacity = 0.3), Pollis.layer(simple; name = "Simplified", color = "#e15759", opacity = 0.3); style = "{{style}}"))
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "map-scale"
label = "Map Scale"
desc = "The ground a pixel covers at the place's latitude and zoom, on Web Mercator, and the width of 1,000 pixels"
models = ["place"]
code = '''
metres_per_pixel = 2 * pi * 6378137 * cosd({{lat}}) / (512 * 2^{{zoom}})  # MapLibre draws the world 512 pixels wide at zoom 0, on a sphere of radius 6,378,137 m
println("At latitude {{lat}} and zoom {{zoom}}: ", round(metres_per_pixel, sigdigits = 3), " metres a pixel; 1,000 pixels cover ", round(metres_per_pixel, sigdigits = 3), " km")
'''

[[actionGroups.actions]]
id = "distance-from-centre"
label = "Distance from the Centre"
desc = "The ten features nearest the centre of the bounding box, with the great-circle distance from it to their centroids, in km"
models = ["features", "column"]
code = '''
near = Tables.columntable(DBInterface.execute(con, """
WITH c AS (SELECT ST_Centroid(ST_Envelope_Agg(geom)) AS centre FROM features)
SELECT * EXCLUDE (geom, centre), round(ST_Distance_Sphere(ST_Centroid(geom), centre) / 1000, 1) AS km
FROM features, c WHERE geom IS NOT NULL ORDER BY km LIMIT 10
"""))
label = first(keys(near))  # the first column of the file, a name say
println(rpad(string(label), 24), "km from the centre")
for i in eachindex(near.km)
	println(rpad(first(string(coalesce(getproperty(near, label)[i], "")), 22), 24), near.km[i])
end
'''

[[actionGroups]]
id = "export"
label = "Export"

[[actionGroups.actions]]
id = "save-layer"
label = "Save the Map Layer"
desc = "Write the layer the map draws, in longitude and latitude on WGS 84, to map-layer.geojson in the folder above"
code = '''
out = joinpath(folder, "map-layer.geojson")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	cp(layer, out)
	println("Wrote ", out)
end
'''
