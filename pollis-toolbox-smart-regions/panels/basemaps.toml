[[faq]]
question = "Why are my features in the wrong place on the map, or not on it at all?"
answer = '''
A web map takes longitude and latitude on WGS 84. When the File Coordinate System input is not the system the file is really in, the features are moved from the wrong system and land elsewhere, or get coordinates that are not longitude and latitude at all.

Coordinates in Range counts the features outside longitude -180 to 180 and latitude -90 to 90. Layers and Coordinate System, in the Geospatial Vector Files panel, shows the system the file records.
'''
wiki = "Features"

[[faq]]
question = "Do I need an API key or an account to show a base map?"
answer = '''
No. The base maps come from OpenFreeMap's public instance, which needs no registration, no API key and no cookies, and sets no limit on map views or requests. Commercial use is allowed.

The map must show the attribution OpenFreeMap © OpenMapTiles Data from OpenStreetMap, which MapLibre GL JS adds at the bottom right of every map.
'''
wiki = "Tile Usage and Attribution"

[[faq]]
question = "Which base map style should I choose?"
answer = '''
Positron, light grey with few colours, keeps the eye on the features drawn on it, and suits colour scales. Dark does the same on a dark ground. Bright and Liberty show roads, parks, water and buildings in their usual colours, for a map read as a map. Fiord is a dark blue-grey style.

Every Style shows the same map in all five, one after another.
'''
wiki = "Base Map Styles"

[[faq]]
question = "Why do areas far from the equator look so large on a web map?"
answer = '''
Web maps use Web Mercator, a projection that keeps the shapes of small areas, but enlarges areas more and more away from the equator.

Areas and distances should be measured in a projected coordinate system chosen for the region, such as EPSG:3035 in Europe, never on the screen of a web map.
'''
wiki = "Web Mercator"

[[faq]]
question = "What is the difference between vector tiles and raster tiles?"
answer = '''
A raster tile is a picture, drawn on the server, such as the PNG tiles of tile.openstreetmap.org. A vector tile holds the geometries and attributes of the features in the tile, encoded with Protocol Buffers, and the browser draws them following a style.

One set of vector tiles therefore serves any number of styles: OpenFreeMap's five styles all draw the same OpenMapTiles tiles.
'''
wiki = "Vector Tiles and Raster Tiles"
hidden = true

[[faq]]
question = "Can I use tile.openstreetmap.org for my maps?"
answer = '''
The tile servers of the OpenStreetMap Foundation serve the map on openstreetmap.org, on a best-effort basis, with no guarantee. Their Tile Usage Policy forbids offline use, bulk downloading and prefetching, and says access may be blocked without notice when usage degrades the service.

The policy points to other tile providers, self-hosting, and vector tiles. Pollis uses OpenFreeMap's vector tiles.
'''
wiki = "Tile Usage and Attribution"
hidden = true

[[faq]]
question = "How far in can the map zoom?"
answer = '''
The Zoom input runs from 0, the whole world, to about 18, a few streets. At each level up the map shows half the width it showed.

Map Scale prints the metres a pixel covers at the place's latitude and zoom.
'''
wiki = "Place"
hidden = true

[[faq]]
question = "How is a numeric column coloured, and how a text column?"
answer = '''
A numeric column gets a colour scale from its smallest to its largest value, from dark purple through green to yellow, and the legend shows both ends. A text column gets a colour for each of its ten most common values, and one grey for the rest, which the legend counts.

Features without a value in the column are drawn in grey.
'''
wiki = "Colour by Column"
hidden = true

[[faq]]
question = "Why is my map slow to draw?"
answer = '''
Every vertex of every feature goes to the browser as GeoJSON text. A layer of many detailed polygons, such as municipal boundaries surveyed to the metre, can run into tens of megabytes.

Layer Size prints the size of the layer and its vertices by geometry type. Simplified and Original shows how ST_SimplifyPreserveTopology cuts the vertices, and how the shapes change.
'''
wiki = "Features"
hidden = true

