[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables

con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the file stays where it is
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files: Choose... picks another
{{?model=place}} # The place, as a point at the centre in longitude and latitude (WGS 84), with its name. Replace the centre and the name with your own place.
{{?model=place}} DBInterface.execute(con, "CREATE OR REPLACE TABLE features AS SELECT '{{placeName}}' AS name, ST_Point({{lon}}, {{lat}}) AS geom")
{{?model=place}} center, zoom = ({{lon}}, {{lat}}), {{zoom}}  # the map opens on the place
{{?model=features}} path = joinpath(folder, "{{featuresFile}}")  # an absolute path is kept as it is
{{?model=column}} path = joinpath(folder, "{{columnFile}}")  # an absolute path is kept as it is
{{?model=features}}{{?featuresFile=places.geojson}} # Example file: six European cities, as points at their approximate centres in longitude and latitude (WGS 84), written to places.geojson unless the folder has one already. Replace "places.geojson" with your own file.
{{?model=column}}{{?columnFile=areas.geojson}} # Example file: the areas within 20 km of six European cities, with their distance from Amsterdam in km, as polygons in longitude and latitude (WGS 84), written to areas.geojson unless the folder has one already. Replace "areas.geojson" with your own file.
{{?model!=place}} cities = "SELECT name, ST_Point(lon, lat) AS geom FROM (VALUES ('Rome', 12.4964, 41.9028), ('Paris', 2.3522, 48.8566), ('London', -0.1276, 51.5072), ('Amsterdam', 4.9041, 52.3676), ('Munich', 11.582, 48.1351), ('Prague', 14.4378, 50.0755)) t(name, lon, lat)"
{{?model=features}}{{?featuresFile=places.geojson}} isfile(path) || DBInterface.execute(con, "COPY ($cities) TO '$(path)' (FORMAT GDAL, DRIVER 'GeoJSON')")
{{?model=column}}{{?columnFile=areas.geojson}} laea(g) = "ST_Transform($g, 'EPSG:4326', 'EPSG:3035')"  # ETRS89 / LAEA Europe, in metres
{{?model=column}}{{?columnFile=areas.geojson}} areas = "SELECT name, round(ST_Distance($(laea("geom")), $(laea("ST_Point(4.9041, 52.3676)"))) / 1000, 1) AS km_to_amsterdam, ST_Transform(ST_Buffer($(laea("geom")), 20000), 'EPSG:3035', 'EPSG:4326') AS geom FROM ($cities)"
{{?model=column}}{{?columnFile=areas.geojson}} isfile(path) || DBInterface.execute(con, "COPY ($areas) TO '$(path)' (FORMAT GDAL, DRIVER 'GeoJSON')")
{{?model!=place}} reader = "ST_Read('$(path)')"
{{?model!=place}} DBInterface.execute(con, "CREATE OR REPLACE TABLE features AS SELECT * EXCLUDE (geom), ST_Transform(geom, '{{fileCrs}}', 'EPSG:4326') AS geom FROM $reader WHERE {{filter}}")  # in longitude and latitude, as web maps need
{{?model!=place}} DBInterface.execute(con, "ALTER TABLE features DROP COLUMN IF EXISTS ogc_fid")  # GDAL's own feature number, not a column of the file
{{?model!=place}} center, zoom = nothing, nothing  # the map fits the features
layer = joinpath(mktempdir(), "layer.geojson")
DBInterface.execute(con, "COPY (SELECT * FROM features WHERE geom IS NOT NULL) TO '$(layer)' (FORMAT GDAL, DRIVER 'GeoJSON')")  # the layer the map draws
{{?model=place}} shown = Pollis.layer(layer; name = "{{placeName}}")
{{?model=features}} shown = Pollis.layer(layer; name = "Features")
{{?model=column}} shown = Pollis.layer(layer; name = "{{column}}", column = "{{column}}", opacity = {{opacity}})  # a colour scale for a number, a colour per value for text
display(Pollis.webmap(shown; style = "{{style}}", center = center, zoom = zoom))  # drawn in the plot pane by MapLibre GL JS, on OpenFreeMap's tiles
'''

# Next Steps action groups
