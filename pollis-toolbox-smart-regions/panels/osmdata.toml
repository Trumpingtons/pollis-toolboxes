		from = "ST_Read('$(path)', layer = '$(layer)', $(osm))"
		named = setdiff(Tables.columntable(DBInterface.execute(con, "DESCRIBE SELECT * FROM $(from)")).column_name, ["OGC_FID", "osm_id", "osm_way_id", "other_tags", "z_order", "geom"])  # tags with a column of their own in osmconf.ini
		tags = "json_merge_patch(coalesce(other_tags, '{}'), json_object($(join(["'$(c)', \"$(c)\"" for c in named], ", "))))"  # every tag; one the element lacks, null, is left out
		type, id = layer == "points" ? ("'node'", "osm_id") : layer == "lines" ? ("'way'", "osm_id") : layer == "multipolygons" ? ("CASE WHEN osm_id IS NULL THEN 'way' ELSE 'relation' END", "coalesce(osm_id, osm_way_id)") : ("'relation'", "osm_id")
		push!(parts, "SELECT $(type) AS osm_type, CAST($(id) AS BIGINT) AS osm_id, '$(layer)' AS layer, CAST($(tags) AS JSON) AS tags, geom FROM $(from)")
	end
	wanted = isempty(value) ? "tags->>'$(key)' IS NOT NULL" : "tags->>'$(key)' = '$(value)'"
	DBInterface.execute(con, "CREATE OR REPLACE TABLE $(table) AS SELECT osm_type, osm_id, tags->>'$(key)' AS value, tags->>'name' AS name, layer, tags, geom FROM ($(join(parts, " UNION ALL "))) WHERE $(wanted)")
	return only(only(Tables.columntable(DBInterface.execute(con, "SELECT count(*) FROM $(table)"))))
end

n = read_osm(path, "features")  # a large region takes minutes: GDAL builds every geometry of the file
n == 0 && error("No feature of $(r.name[1]) has the tag {{tagKey}}")
println(n, " features of ", r.name[1], " with {{tagKey}}, from ", path, " (", round(filesize(path) / 2^20, digits = 1), " MB); © OpenStreetMap contributors, ODbL")
'''

