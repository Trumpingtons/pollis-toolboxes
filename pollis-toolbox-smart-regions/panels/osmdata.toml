[[actionGroups.actions]]
id = "then-and-now"
label = "Then and Now"
desc = "The same features as OpenStreetMap held them at the Earlier Date (Overpass API) or on 1 January of the Earlier Year (Geofabrik): how many then and now, kept, added and removed, and by value"
code = '''
{{?model=overpass}}earlier_query, earlier_path = overpass("{{earlierDate}}")
{{?model=overpass}}read_osm(earlier_path, "earlier")
{{?model=overpass}}when, same = "{{earlierDate}}", "osm_type, osm_id"
{{?model=layers|extract}}yy = lpad(parse(Int, "{{earlierYear}}") % 100, 2, '0')
{{?model=layers}}earlier_url = replace(url, "-latest-free.gpkg.zip" => "-$(yy)0101-free.shp.zip")  # older files are shape files
{{?model=extract}}earlier_url = replace(url, "-latest.osm.pbf" => "-$(yy)0101.osm.pbf")
{{?model=layers|extract}}earlier_path = joinpath(folder, basename(earlier_url))
{{?model=layers|extract}}if !geofabrik_file(earlier_url, earlier_path)  # downloaded once
{{?model=layers|extract}}	listing = String(take!(Downloads.download(replace(url, r"-latest[^/]*$" => ".html"), IOBuffer(); headers = agent, downloader = patient)))  # the region's page, which lists its older files
{{?model=layers|extract}}	years = sort(unique(["20" * m[:y] for m in eachmatch(Regex("$(replace(basename(earlier_url), "$(yy)0101" => "(?<y>\\d\\d)0101"))"), listing)]))
{{?model=layers|extract}}	error("Geofabrik has no file of 1 January {{earlierYear}} for $(r.name[1]); it has ", isempty(years) ? "none" : join(years, ", "))
{{?model=layers|extract}}end
{{?model=layers}}files = filter(f -> f in zip_names(earlier_path), ["gis_osm_$(theme)_free_1.shp", "gis_osm_$(theme)_a_free_1.shp"])
{{?model=layers}}isempty(files) && error("The file of {{earlierYear}} has no $(theme) layer")
{{?model=layers}}DBInterface.execute(con, "CREATE OR REPLACE TABLE earlier AS " * join(["SELECT CAST(osm_id AS VARCHAR) AS osm_id, fclass AS value, '$(replace(f, "_1.shp" => ""))' AS layer FROM ST_Read('/vsizip/$(earlier_path)/$(f)')" for f in files], " UNION ALL "))
{{?model=layers}}DBInterface.execute(con, "CREATE OR REPLACE TABLE current_features AS SELECT CAST(osm_id AS VARCHAR) AS osm_id, value, layer FROM features")
{{?model=extract}}read_osm(earlier_path, "earlier")
{{?model=layers|extract}}when = "1 January {{earlierYear}}"
{{?model=layers}}same, current = "layer, osm_id", "current_features"
{{?model=overpass|extract}}current = "features"
{{?model=extract}}same = "osm_type, osm_id"
c = Tables.columntable(DBInterface.execute(con, "SELECT (SELECT count(*) FROM earlier) AS earlier_n, (SELECT count(*) FROM $(current)) AS current_n, (SELECT count(*) FROM (SELECT $(same) FROM $(current) INTERSECT SELECT $(same) FROM earlier)) AS kept"))
println(title, ": ", c.earlier_n[1], " features on ", when, ", ", c.current_n[1], " now; ", c.kept[1], " kept, ", c.current_n[1] - c.kept[1], " added, ", c.earlier_n[1] - c.kept[1], " removed")
v = Tables.columntable(DBInterface.execute(con, "SELECT coalesce(value, '(none)') AS value, count(*) FILTER (WHERE t = 'earlier') AS earlier_n, count(*) FILTER (WHERE t = 'current') AS current_n FROM (SELECT value, 'earlier' AS t FROM earlier UNION ALL SELECT value, 'current' FROM $(current)) GROUP BY ALL ORDER BY current_n + earlier_n DESC LIMIT 15"))
println(rpad("value", 28), rpad(when, 18), "now")
for i in eachindex(v.value)
	println(rpad(v.value[i], 28), rpad(v.earlier_n[i], 18), v.current_n[i])
end
'''

