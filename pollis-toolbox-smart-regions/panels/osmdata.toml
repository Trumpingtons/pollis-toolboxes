[[codeBranches]]
model = "overpass"
code = '''
using DuckDB, Tables, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # where GDAL's osmconf.ini is kept, and the Next Steps save their files
server, tag = "{{server}}", "{{tag}}"  # an Overpass API instance, the public one or your own, and key=value, or a key alone for every value
box = Tuple(parse.(Float64, split("{{bbox}}", ",")))  # the area, west, south, east, north, in degrees of longitude and latitude
title, stem = "{{tag}}, Overpass API", replace("overpass-{{tag}}", r"[^A-Za-z0-9_-]" => "-")
answer = osm_overpass(box, tag; server)  # the features with the tag, and the ways and nodes they are made of, as an OSM XML file
overpass_query, path, osm_base = answer.query, answer.file, answer.base  # the query sent, the file, and the time of the OpenStreetMap data the server holds
n = osm_read(con, path, tag; folder)  # from the five layers of GDAL's OSM driver, each feature with all its tags as JSON, as the table features
n == 0 && error("No feature with {{tag}} in the area: widen the area, or try a key alone")
println(n, " features with {{tag}} in the area, OpenStreetMap data as of ", osm_base, "; © OpenStreetMap contributors, ODbL")
'''

[[codeBranches]]
model = "layers"
code = '''
using DuckDB, Tables, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # where Geofabrik's files are kept, and the Next Steps save theirs
theme = "{{layer}}"
g = geofabrik_layer(con, "{{region}}", theme; folder)  # the GeoPackage of the region's layers, downloaded once, read inside its zip, as the table features
url, path, n = g.url, g.path, g.n
title, stem = "$(g.name), $(theme)", replace("{{region}}-$(theme)", "/" => "-")
println(n, " features of ", join(g.layers, " and "), ", ", g.name, ", from ", path, " (", round(filesize(path) / 2^20, digits = 1), " MB); © OpenStreetMap contributors, ODbL")
'''

[[codeBranches]]
model = "extract"
code = '''
using DuckDB, Tables, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # where Geofabrik's files and GDAL's osmconf.ini are kept, and the Next Steps save theirs
g = geofabrik_extract(con, "{{region}}", "{{tagKey}}"; folder)  # the region's PBF file, downloaded once; a large region takes minutes, as GDAL builds every geometry of the file
url, path, n = g.url, g.path, g.n
n == 0 && error("No feature of $(g.name) has the tag {{tagKey}}")
title, stem = "$(g.name), {{tagKey}}", replace("{{region}}-{{tagKey}}", r"[^A-Za-z0-9_-]" => "-")
println(n, " features of ", g.name, " with {{tagKey}}, from ", path, " (", round(filesize(path) / 2^20, digits = 1), " MB); © OpenStreetMap contributors, ODbL")
'''

# Next Steps action groups
[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "show-on-map"
label = "Show on a Map"
desc = "The features on an OpenStreetMap base map in Pollis's map view, coloured by the value of the tag (or Geofabrik's class), at most 50,000; click a feature for its OSM id, value and name"
code = '''
dir = mktempdir()
shown = 50_000  # a map of more features is slow to draw
{{?model=overpass|extract}}DBInterface.execute(con, "COPY (SELECT osm_type, osm_id, value, name, layer, geom FROM features LIMIT $(shown)) TO '$(joinpath(dir, "features.geojson"))' (FORMAT GDAL, DRIVER 'GeoJSON')")
{{?model=layers}}DBInterface.execute(con, "COPY (SELECT * EXCLUDE (geom), geom FROM features LIMIT $(shown)) TO '$(joinpath(dir, "features.geojson"))' (FORMAT GDAL, DRIVER 'GeoJSON')")
n > shown && println("The map shows ", shown, " of ", n, " features")
display(Pollis.webmap(Pollis.layer(joinpath(dir, "features.geojson"); name = title, column = "value", opacity = 0.7)))
println("© OpenStreetMap contributors, ODbL")
'''

[[actionGroups.actions]]
id = "counts-chart"
label = "Counts by Value"
desc = "The features of each value of the tag (Overpass API, Full Extract) or of each class (Layers), the 25 most frequent, as a bar chart drawn with ECharts"
code = '''
using ECharts

d = Tables.columntable(DBInterface.execute(con, "SELECT coalesce(value, '(none)') AS value, count(*) AS n FROM features GROUP BY ALL ORDER BY n DESC LIMIT 25"))
EChart(ec_width = 700, ec_height = 400, title = [ECharts.Title(text = "$(title): features by value")],
	xAxis = [ECharts.Axis(_type = "category", data = collect(d.value), axisLabel = ECharts.AxisLabel(rotate = 45))], yAxis = [ECharts.Axis(_type = "value", name = "Features")],
	series = [ECharts.XYSeries(name = "Features", _type = "bar", data = collect(d.n))])
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "query-and-date"
label = "Query and Date"
desc = "The Overpass query sent and the time of the data the server holds, or the Geofabrik file read, its size, when it was downloaded and the date of Geofabrik's current file"
code = '''
{{?model=overpass}}println("Server: ", server)
{{?model=overpass}}println("Query:\n", overpass_query)
{{?model=overpass}}println("OpenStreetMap data as of ", osm_base, " (osm_base of the response); ", round(filesize(path) / 2^20, digits = 2), " MB returned")
{{?model=layers|extract}}using Dates, Downloads
{{?model=layers|extract}}h = try Downloads.request(url; method = "HEAD", headers = ["User-Agent" => "Pollis (https://pollis.org)"], timeout = 120) catch; nothing end
{{?model=layers|extract}}current = h === nothing ? "unknown (the server did not answer)" : get(Dict(lowercase(k) => v for (k, v) in h.headers), "last-modified", "unknown")
{{?model=layers|extract}}println(url)
{{?model=layers|extract}}println("Read from ", path, ", ", round(filesize(path) / 2^20, digits = 1), " MB, downloaded ", Dates.format(Dates.unix2datetime(mtime(path)), "yyyy-mm-dd HH:MM"), " UTC")
{{?model=layers|extract}}println("Geofabrik's current file: ", current, ". Delete the file in the folder to download the current one")
'''

[[actionGroups.actions]]
id = "tag-completeness"
label = "Tag Completeness"
desc = "The tags the features carry, the 30 most frequent, with the share of the features that have each (Overpass API, Full Extract), or the share with a value in each column (Layers)"
code = '''
{{?model=overpass|extract}}t = Tables.columntable(DBInterface.execute(con, "SELECT k AS tag, count(*) AS features FROM (SELECT unnest(json_keys(tags)) AS k FROM features) GROUP BY k ORDER BY features DESC, tag LIMIT 30"))
{{?model=overpass|extract}}for i in eachindex(t.tag)
{{?model=overpass|extract}}	println(rpad(t.tag[i], 28), rpad(t.features[i], 9), round(100 * t.features[i] / n, digits = 1), "%")
{{?model=overpass|extract}}end
{{?model=layers}}columns = setdiff(Tables.columntable(DBInterface.execute(con, "DESCRIBE features")).column_name, ["geom", "layer"])
{{?model=layers}}for c in columns
{{?model=layers}}	k = only(only(Tables.columntable(DBInterface.execute(con, "SELECT count(*) FROM features WHERE \"$(c)\" IS NOT NULL AND CAST(\"$(c)\" AS VARCHAR) <> ''"))))
{{?model=layers}}	println(rpad(c, 14), rpad(k, 9), round(100 * k / n, digits = 1), "% with a value")
{{?model=layers}}end
'''

[[actionGroups.actions]]
id = "geometry-check"
label = "Geometry Check"
desc = "The features of each layer and geometry type, with the invalid and empty geometries"
code = '''
g = Tables.columntable(DBInterface.execute(con, "SELECT layer, ST_GeometryType(geom)::VARCHAR AS type, count(*) AS features, count(*) FILTER (WHERE NOT ST_IsValid(geom)) AS invalid, count(*) FILTER (WHERE ST_IsEmpty(geom)) AS empty FROM features GROUP BY ALL ORDER BY features DESC"))
println(rpad("layer", 28), rpad("geometry", 20), rpad("features", 10), rpad("invalid", 9), "empty")
for i in eachindex(g.layer)
	println(rpad(g.layer[i], 28), rpad(g.type[i], 20), rpad(g.features[i], 10), rpad(g.invalid[i], 9), g.empty[i])
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "then-and-now"
label = "Then and Now"
desc = "The same features as OpenStreetMap held them at the Earlier Date (Overpass API) or on 1 January of the Earlier Year (Geofabrik): how many then and now, kept, added and removed, and by value"
code = '''
{{?model=overpass}}osm_read(con, osm_overpass(box, tag; date = "{{earlierDate}}", server).file, tag; folder, table = "earlier")  # the same query, as of the date
{{?model=overpass}}when, same, current = "{{earlierDate}}", "osm_type, osm_id", "features"
{{?model=layers}}geofabrik_earlier(con, url, {{earlierYear}}, theme; folder)  # Geofabrik's file of 1 January, downloaded once, as the table earlier
{{?model=extract}}geofabrik_earlier(con, url, {{earlierYear}}, "{{tagKey}}"; folder)
{{?model=layers}}DBInterface.execute(con, "CREATE OR REPLACE TABLE current_features AS SELECT CAST(osm_id AS VARCHAR) AS osm_id, value, layer FROM features")
{{?model=layers}}when, same, current = "1 January {{earlierYear}}", "layer, osm_id", "current_features"
{{?model=extract}}when, same, current = "1 January {{earlierYear}}", "osm_type, osm_id", "features"
c = Tables.columntable(DBInterface.execute(con, "SELECT (SELECT count(*) FROM earlier) AS earlier_n, (SELECT count(*) FROM $(current)) AS current_n, (SELECT count(*) FROM (SELECT $(same) FROM $(current) INTERSECT SELECT $(same) FROM earlier)) AS kept"))
println(title, ": ", c.earlier_n[1], " features on ", when, ", ", c.current_n[1], " now; ", c.kept[1], " kept, ", c.current_n[1] - c.kept[1], " added, ", c.earlier_n[1] - c.kept[1], " removed")
v = Tables.columntable(DBInterface.execute(con, "SELECT coalesce(value, '(none)') AS value, count(*) FILTER (WHERE t = 'earlier') AS earlier_n, count(*) FILTER (WHERE t = 'current') AS current_n FROM (SELECT value, 'earlier' AS t FROM earlier UNION ALL SELECT value, 'current' FROM $(current)) GROUP BY ALL ORDER BY current_n + earlier_n DESC LIMIT 15"))
println(rpad("value", 28), rpad(when, 18), "now")
for i in eachindex(v.value)
	println(rpad(v.value[i], 28), rpad(v.earlier_n[i], 18), v.current_n[i])
end
'''

[[actionGroups]]
id = "export"
label = "Export"

[[actionGroups.actions]]
id = "save-gpkg"
label = "Save as GeoPackage"
desc = "The features with their OSM id, value, name and every tag (as JSON) or column, to a GeoPackage in the folder, for the Geospatial Vector Files panel and any GIS"
code = '''
out = joinpath(folder, "$(stem).gpkg")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
{{?model=overpass|extract}}	DBInterface.execute(con, "COPY (SELECT * EXCLUDE (tags, geom), CAST(tags AS VARCHAR) AS tags, geom FROM features) TO '$(out)' (FORMAT GDAL, DRIVER 'GPKG', LAYER_NAME 'features', SRS 'EPSG:4326')")
{{?model=layers}}	DBInterface.execute(con, "COPY features TO '$(out)' (FORMAT GDAL, DRIVER 'GPKG', LAYER_NAME 'features', SRS 'EPSG:4326')")
	println("Wrote ", out, "; © OpenStreetMap contributors, ODbL")
end
'''

[[actionGroups.actions]]
id = "save-geoparquet"
label = "Save as GeoParquet"
desc = "The features with their OSM id, value, name and every tag or column, to a GeoParquet file in the folder"
code = '''
out = joinpath(folder, "$(stem).parquet")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "COPY features TO '$(out)' (FORMAT parquet)")  # DuckDB writes GeoParquet metadata for the geometry column
	println("Wrote ", out, "; © OpenStreetMap contributors, ODbL")
end
'''
