[[faq]]
question = "Why does the Overpass API tab sometimes wait, or stop with a busy server?"
answer = '''
The public Overpass API instances are shared by many users and defend themselves against overuse: a query waits for a free slot, and a query refused because of the rate limit is answered with HTTP status 429. The public instance at overpass-api.de answers 502 when all its workers are busy, and asks clients to retry with exponential backoff. The panel retries up to five times, waiting twice as long each time.

As a guideline, the Overpass API's manual asks users to send at most about 10,000 queries and to download less than about 1 GB a day; above that, run your own instance and give its address in Server.
'''
wiki = "Overpass API and Overpass QL"

[[faq]]
question = "Which tab should I use?"
answer = '''
Overpass API for the features with one tag in an area, as OpenStreetMap holds them now or at an earlier date. Geofabrik Layers for ready-made layers of a whole region, such as its roads, buildings or points of interest, with a fixed set of columns. Geofabrik Full Extract for every feature of a region with a tag and all its tags, read from the region's .osm.pbf file.

Both Geofabrik tabs download the file once to the Folder and read it from there afterwards, without a connection.
'''
wiki = "Decision Guide"

[[faq]]
question = "How do I credit OpenStreetMap?"
answer = '''
OpenStreetMap's data is licensed under the Open Data Commons Open Database License (ODbL). Wherever its data is used, the OpenStreetMap Foundation requires two things: credit to OpenStreetMap by its attribution notice, © OpenStreetMap contributors, and a statement that the data is available under the Open Database License, for example by a link to openstreetmap.org/copyright.

If you alter or build upon the data, you may distribute the result only under the same licence.
'''
wiki = "Licence and Attribution"

[[faq]]
question = "Why do the Geofabrik Layers have fewer tags than the full extract?"
answer = '''
Geofabrik's .osm.pbf files are un-filtered OpenStreetMap data, with every tag. Its shape files and GeoPackages are a selection of features and attributes, mapped into layers such as roads, buildings and points of interest, each feature with an OSM id, a code, a class (fclass) and a name, and a few columns of its layer.

The Geofabrik Full Extract tab reads the .osm.pbf, with every tag of each feature.
'''
wiki = "Geofabrik Downloads"

[[faq]]
question = "How far back can Then and Now go with the Overpass API?"
answer = '''
The date setting of Overpass QL runs a query against the database as of a date. The OpenStreetMap wiki says there is no attic data earlier than 2012-09-12T06:55:00Z, the first change in the ODbL-compliant planet file; an earlier date returns the database as of that moment.
'''
wiki = "Overpass API and Overpass QL"
hidden = true

[[faq]]
question = "What is an OpenStreetMap tag?"
answer = '''
A key and a value, both free text, attached to a node, way or relation to describe what it is, such as amenity=school or highway=residential. An element may carry any number of tags, each key at most once, and the community documents the tags in common use on the OpenStreetMap wiki.
'''
wiki = "OpenStreetMap Tags"
hidden = true

[[faq]]
question = "How does the panel tell areas from lines?"
answer = '''
It reads the OpenStreetMap files with GDAL's OSM driver and its configuration file, osmconf.ini. The driver puts multipolygon and boundary relations, and the ways it recognises as areas, in its multipolygons layer; osmconf.ini lists the tags that make a closed way an area, such as building, landuse, amenity and natural. Other ways go to the lines layer.
'''
wiki = "Diagnostics"
hidden = true

[[faq]]
question = "Does an older OpenStreetMap file show what a place was like then?"
answer = '''
No: Geofabrik notes that an OpenStreetMap data set of a date tells what OpenStreetMap knew about the world at that time, not what the world was like. A building that has stood for a century but was added to OpenStreetMap in 2020 is missing from the data of 2018.
'''
wiki = "Geofabrik Downloads"
hidden = true

