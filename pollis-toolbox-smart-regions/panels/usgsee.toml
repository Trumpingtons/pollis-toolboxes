[[faq]]
question = "What do I need to use the panel?"
answer = '''
An account of the USGS EROS Registration System, access to the Machine-to-Machine API, which is requested from the account's profile and granted by USGS, and an application token made in the same profile. Every request of the API needs a login, Find Scenes included; the username and the token are set with the key on the Powered by line.
'''
wiki = "Authentication"

[[faq]]
question = "Why the application token and not the password?"
answer = '''
USGS deprecated the login of the M2M API with a password in February 2025: the endpoint login-token takes the username and an application token, which the user makes in the profile of the EROS Registration System and can revoke there without changing the password.
'''
wiki = "Authentication"

[[faq]]
question = "Why does Landsat Download wait before downloading?"
answer = '''
The M2M API prepares some files before they can be downloaded: a download request returns the files ready at once and those still being prepared, and the tab asks for the others every 15 seconds, for up to ten minutes, before it stops with the files it has. A run later downloads the rest, as the files already in the Folder are kept.
'''
wiki = "The M2M API"

[[faq]]
question = "How are the stored integers of Landsat turned into reflectance?"
answer = '''
By the scale factor and offset of the Collection 2 Level-2 product guide: surface reflectance is the stored value times 0.0000275 minus 0.2, and surface temperature, in kelvin, the stored value times 0.00341802 plus 149.0, with 0 as the fill value of both.
'''
wiki = "Landsat Collection 2 Level-2"

[[faq]]
question = "What does the QA_PIXEL band of Landsat hold?"
answer = '''
The quality of each cell as bits: fill, dilated cloud, cirrus, cloud, cloud shadow, snow, clear and water, set by the CFMask algorithm among others. Cloud Mask over the Area counts them, and NDVI over the Area leaves out the cells with dilated cloud, cloud, cloud shadow or snow when QA_PIXEL is among the Bands.
'''
wiki = "Landsat Collection 2 Level-2"
hidden = true

[[faq]]
question = "Which SRTM product does Elevation read?"
answer = '''
The one chosen in the Elevation Product: SRTM 1 Arc-Second Global, at about 30 m, or SRTM Void Filled, at 3 arc-seconds outside the United States, with the gaps of the original data filled. The tab downloads the tiles of 1 by 1 degree that cover the Area as GeoTIFF and joins them.
'''
wiki = "SRTM Elevation"
hidden = true

[[faq]]
question = "Why does the M2M API answer with an error code?"
answer = '''
The API answers every request with an error code and message when it cannot serve it: an unknown dataset name, a login that has expired, or an account without access to the M2M API. The panel stops with that code and message, which say what to change.
'''
wiki = "Diagnostics"
hidden = true

