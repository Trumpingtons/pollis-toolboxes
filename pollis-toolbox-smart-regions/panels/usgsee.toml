models = ["landsat"]
code = '''
using Statistics

haskey(bands, "ST_B10") || error("Add ST_B10 to the Bands: surface temperature")
celsius = map(k -> ismissing(k) ? missing : k - 273.15f0, bands["ST_B10"])  # kelvin to degrees Celsius
v = collect(skipmissing(celsius))
println("Surface temperature of ", scene, " over ", length(v), " cells: quantiles 5, 25, 50, 75, 95%: ", join(round.(quantile(v, [0.05, 0.25, 0.5, 0.75, 0.95]); digits = 1), ", "), " °C")
println("Coolest ", round(minimum(v); digits = 1), " °C, hottest ", round(maximum(v); digits = 1), " °C")
grid, chosen = celsius, ["Surface temperature (°C)"]  # Show the Band on a Map and Plot the Band now draw it
'''

