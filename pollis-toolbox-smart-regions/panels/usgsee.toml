[[codeBranches]]
model = "find"
code = '''
using DuckDB, Tables, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))  # where the Next Steps save their files
west, south, east, north = parse.(Float64, split("{{area}}", ","))  # the area, in degrees of longitude and latitude
area = "ST_MakeEnvelope($(west), $(south), $(east), $(north))"
first_day, last_day, dataset = "{{firstDay}}", "{{lastDay}}", "{{dataset}}"
usgs_scenes(con, dataset; box = (west, south, east, north), days = (first_day, last_day), cloud = {{maxCloud}}, most = {{rows}})  # the table scenes, from the M2M API of USGS EarthExplorer, with the account on the Powered by line
DBInterface.execute(con, "DELETE FROM scenes WHERE entity NOT IN (SELECT entity FROM scenes ORDER BY coalesce(cloud, 0), acquired DESC LIMIT {{rows}})")
s = query("SELECT id, acquired, cloud, covered FROM scenes ORDER BY coalesce(cloud, 0), acquired DESC")
isempty(s.id) && error("EarthExplorer has no scenes of $(dataset) over the area from $(first_day) to $(last_day) with at most {{maxCloud}}% of clouds: widen the dates, the area or the cloud cover")
println(length(s.id), " scenes of ", dataset, " over the area from ", first_day, " to ", last_day, ", the least cloudy first:")
for i in eachindex(s.id)
	println(rpad(s.id[i], 44), " ", s.acquired[i], ismissing(s.cloud[i]) ? "" : "  cloud $(round(s.cloud[i]; digits = 1))%", "  covers $(s.covered[i])% of the area")
end
'''

[[codeBranches]]
model = "landsat"
code = '''
using DuckDB, Tables, SmartRegions, Rasters, ArchGDAL

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))  # where the bands are kept once downloaded, and the Next Steps save theirs
west, south, east, north = parse.(Float64, split("{{area}}", ","))  # the area, in degrees of longitude and latitude
first_day, last_day, dataset = "{{firstDay}}", "{{lastDay}}", "landsat_ot_c2_l2"  # Landsat 8-9 Collection 2 Level-2
usgs_scenes(con, dataset; box = (west, south, east, north), days = (first_day, last_day), cloud = {{maxCloud}}, unknown = false)  # the table scenes, from the M2M API of USGS EarthExplorer, with the account on the Powered by line
scene = "{{scene}}"
pick = query("SELECT entity, id, acquired, cloud, covered FROM scenes WHERE ? = '' OR id = ? ORDER BY covered DESC, cloud, acquired DESC LIMIT 1", [scene, scene])  # the least cloudy of the scenes that cover the most of the area
isempty(pick.id) && error(isempty(scene) ? "No Landsat 8-9 Level-2 scene over the area from $(first_day) to $(last_day) has at most {{maxCloud}}% of clouds: widen the dates or the cloud cover" : "The scene $(scene) is not among those over the area from $(first_day) to $(last_day): set the dates around it")
entity, scene = only(pick.entity), only(pick.id)
println("Scene ", scene, ", ", only(pick.acquired), ", cloud ", only(pick.cloud), "%, covering ", only(pick.covered), "% of the area")

chosen = uppercase.(strip.(split("{{bands}}", ",")))
place = mkpath(joinpath(folder, "usgs", scene))  # the folder of the scene, which the Next Steps write to
files = usgs_bands(con, dataset, entity, scene, chosen; folder = place)  # each band downloaded once
usgs_logout()  # the API key ends with the session
crs = ArchGDAL.read(ArchGDAL.getproj, files[first(chosen)])  # the coordinate system of the scene, a zone of UTM
x0, y0, x1, y1 = projected_box(con, (west, south, east, north), crs)
bands = Dict{String, Any}()  # each band, cut to the area: reflectance, temperature in kelvin, or the bits of QA_PIXEL
for b in chosen
	cut = read(crop(Raster(files[b]; lazy = true); to = Extent(X = (x0, x1), Y = (y0, y1))))  # the cells of the area only
	scale, offset = startswith(b, "SR_") ? (2.75e-5, -0.2) : startswith(b, "ST_B") ? (0.00341802, 149.0) : (nothing, nothing)  # the scale factors of the Collection 2 Level-2 product guide
	bands[b] = map(v -> ismissing(v) ? missing : scale === nothing ? Int(v) : v == 0 ? missing : Float32(v * scale + offset), cut)  # 0 is the fill value of reflectance and temperature
	println(rpad(b, 9), size(cut, X), " x ", size(cut, Y), " cells, ", count(ismissing, bands[b]), " without data, from ", files[b])
end
grid = bands[first(chosen)]  # the first band, for the Next Steps that read one
'''

[[codeBranches]]
model = "elevation"
code = '''
using DuckDB, Tables, SmartRegions, Rasters, ArchGDAL

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))  # where the tiles are kept once downloaded, and the Next Steps save theirs
west, south, east, north = parse.(Float64, split("{{area}}", ","))  # the area, in degrees of longitude and latitude
product = "{{dem}}"
tiles = usgs_dem(con, product; box = (west, south, east, north), folder = joinpath(folder, "usgs"))  # the tiles of 1 by 1 degree over the area, each downloaded once, with the account on the Powered by line
usgs_logout()  # the API key ends with the session
parts = [read(crop(Raster(f; lazy = true); to = Extent(X = (west, east), Y = (south, north)))) for f in tiles.files]  # the tiles of the area, each cut to it
grid = map(v -> ismissing(v) ? missing : Float32(v), length(parts) == 1 ? only(parts) : mosaic(first, parts...))  # the elevation in metres, missing where the tiles have no data
crs, chosen, scene, bands = "EPSG:4326", ["Elevation"], product, Dict{String, Any}("Elevation" => grid)
place = joinpath(folder, "usgs", tiles.dataset)  # the folder of the product, which the Next Steps write to
println(product, ": ", size(grid, X), " x ", size(grid, Y), " cells from ", length(parts), " tile(s), ", count(ismissing, grid), " without data; elevation from ", minimum(skipmissing(grid)), " to ", maximum(skipmissing(grid)), " m")
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "scene-outlines"
label = "Scene Outlines on a Map"
desc = "The outline of each scene found, coloured by its cloud cover, with the area, on an OpenStreetMap base map in Pollis's map view"
models = ["find"]
code = '''
shown, box = joinpath(mktempdir(), "scenes.geojson"), joinpath(mktempdir(), "area.geojson")
DBInterface.execute(con, "COPY (SELECT id, CAST(acquired AS VARCHAR) AS acquired, cloud, geom FROM scenes) TO '$(shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")
DBInterface.execute(con, "COPY (SELECT 'Area' AS name, $(area) AS geom) TO '$(box)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(shown; name = "Scenes of $(dataset)", column = all(ismissing, s.cloud) ? "acquired" : "cloud", opacity = 0.15), Pollis.layer(box; name = "Area", color = "#e15759", opacity = 0.3); title = "$(length(s.id)) Scenes"))
'''

[[actionGroups.actions]]
id = "scenes-over-time"
label = "Scenes over Time"
desc = "When the scenes were taken, each a point at its date by its cloud cover, one series for each satellite, drawn with ECharts"
models = ["find"]
code = '''
using ECharts

t = query("SELECT CAST(acquired AS VARCHAR) AS day, coalesce(cloud, 0) AS cloud, split_part(id, '_', 1) AS satellite FROM scenes ORDER BY acquired")
EChart(ec_width = 760, ec_height = 380, title = [ECharts.Title(text = "Scenes of $(dataset)")], tooltip = ECharts.Tooltip(),
	legend = ECharts.Legend(), xAxis = [ECharts.Axis(_type = "time", name = "Date", axisLabel = ECharts.AxisLabel(formatter = ECharts.JSON.JSONText("""{"month": "{MMM}", "day": "{d}"}""")))], yAxis = [ECharts.Axis(_type = "value", name = "Cloud (%)", min = 0)],
	series = [ECharts.XYSeries(name = p, _type = "scatter", data = [[t.day[i], t.cloud[i]] for i in eachindex(t.day) if t.satellite[i] == p]) for p in unique(t.satellite)])
'''

[[actionGroups.actions]]
id = "band-map"
label = "Show the Band on a Map"
desc = "The first band, or the elevation, cells coloured by value, on an OpenStreetMap base map in Pollis's map view, at most 80 cells a side (larger areas averaged over blocks of cells); click a cell for its value"
models = ["landsat", "elevation"]
code = '''
using Statistics

f = max(1, cld(max(size(grid, X), size(grid, Y)), 80))  # at most 80 cells a side
small = permutedims(f > 1 ? Rasters.aggregate(mean, Raster(grid; missingval = missing), f; skipmissingval = true) : grid, (X, Y))
edges(d) = [(min(lo, hi), max(lo, hi)) for (lo, hi) in Rasters.intervalbounds(small, d)]  # each cell's two edges
xe, ye = edges(X), edges(Y)
rows = ["($(round(Float64(small[i, j]), digits = 4)), $(xe[i][1]), $(ye[j][1]), $(xe[i][2]), $(ye[j][2]))" for i in axes(small, 1), j in axes(small, 2) if !ismissing(small[i, j])]
shown = joinpath(mktempdir(), "cells.geojson")
DBInterface.execute(con, "SET geometry_always_xy = true")
DBInterface.execute(con, "COPY (SELECT value, ST_Transform(ST_MakeEnvelope(x0, y0, x1, y1), ?, 'EPSG:4326') AS geom FROM (VALUES $(join(rows, ", "))) t(value, x0, y0, x1, y1)) TO '$(shown)' (FORMAT GDAL, DRIVER 'GeoJSON')", [crs])
display(Pollis.webmap(Pollis.layer(shown; name = "$(first(chosen)) of $(scene)", column = "value", opacity = 0.7)))
'''

[[actionGroups.actions]]
id = "band-plot"
label = "Plot the Band"
desc = "The first band, or the elevation, as a heat map drawn with ECharts, north up, at most 200 cells a side (larger areas averaged over blocks of cells)"
models = ["landsat", "elevation"]
code = '''
using ECharts, Statistics

f = max(1, cld(max(size(grid, X), size(grid, Y)), 200))  # at most 200 cells a side
small = permutedims(f > 1 ? Rasters.aggregate(mean, Raster(grid; missingval = missing), f; skipmissingval = true) : grid, (X, Y))
north_first = first(lookup(small, Y)) > last(lookup(small, Y))
nx, ny = size(small)
cells = [[i - 1, (north_first ? ny - j : j - 1), round(Float64(small[i, j]), digits = 4)] for i in 1:nx, j in 1:ny if !ismissing(small[i, j])]  # column, row from the south, value
lo, hi = extrema(skipmissing(small))
EChart(ec_width = 760, ec_height = round(Int, 60 + 680 * ny / nx), title = [ECharts.Title(text = "$(first(chosen)) of $(scene)")], tooltip = ECharts.Tooltip(),
	xAxis = [ECharts.Axis(_type = "category", data = string.(round.(lookup(small, X); digits = 4)), name = "x")],
	yAxis = [ECharts.Axis(_type = "category", data = string.(round.(north_first ? reverse(lookup(small, Y)) : lookup(small, Y); digits = 4)), name = "y")],
	visualMap = ECharts.VisualMap(min = lo, max = hi, calculable = true, orient = "vertical", right = "1%", top = "middle", inRange = Dict("color" => ["#313695", "#74add1", "#ffffbf", "#f46d43", "#a50026"])),
	series = [ECharts.HeatmapSeries(name = first(chosen), data = cells)])
'''

[[actionGroups.actions]]
id = "elevation-profile"
label = "Elevation Profile"
desc = "The elevation along the row of cells through the middle of the area, from west to east, drawn with ECharts"
models = ["elevation"]
code = '''
using ECharts

row = grid[Y = Near((south + north) / 2)]  # the cells of the middle row, west to east
x = collect(lookup(row, X))
EChart(ec_width = 760, ec_height = 360, title = [ECharts.Title(text = "Elevation at latitude $(round((south + north) / 2; digits = 4))")], tooltip = ECharts.Tooltip(trigger = "axis"),
	xAxis = [ECharts.Axis(_type = "value", name = "Longitude", scale = true)], yAxis = [ECharts.Axis(_type = "value", name = "Metres", scale = true)],
	series = [ECharts.XYSeries(name = "Elevation", _type = "line", showSymbol = false, data = [[x[i], row[i]] for i in eachindex(x) if !ismissing(row[i])])])
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "area-coverage"
label = "How Scenes Cover the Area"
desc = "For each path and row of the Landsat scenes found, how many scenes and how much of the area they cover: a scene of a neighbouring path or row may cover only part of it"
models = ["find"]
code = '''
c = query("SELECT coalesce(split_part(id, '_', 3), '') AS pathrow, count(*) AS n, min(covered) AS least, max(covered) AS most FROM scenes GROUP BY ALL ORDER BY most DESC, n DESC")
println(rpad("path and row", 16), rpad("scenes", 8), "covers (% of the area)")
for i in eachindex(c.n)
	println(rpad(c.pathrow[i], 16), rpad(c.n[i], 8), c.least[i] == c.most[i] ? c.most[i] : "$(c.least[i]) to $(c.most[i])")
end
'''

[[actionGroups.actions]]
id = "cloud-mask"
label = "Cloud Mask over the Area"
desc = "The bits of the QA_PIXEL band of Landsat over the area: fill, dilated cloud, cirrus, cloud, cloud shadow, snow, clear and water, as shares of the cells"
models = ["landsat"]
code = '''
haskey(bands, "QA_PIXEL") || error("Add QA_PIXEL to the Bands: the quality of each cell")
flags = ["Fill", "Dilated cloud", "Cirrus", "Cloud", "Cloud shadow", "Snow", "Clear", "Water"]  # bits 0 to 7 of QA_PIXEL
v = collect(skipmissing(bands["QA_PIXEL"]))
println("Quality of ", scene, " over the area, ", length(v), " cells of 30 m:")
for (bit, name) in enumerate(flags)
	n = count(q -> (q >> (bit - 1)) & 1 == 1, v)
	println(rpad(name, 16), lpad(n, 9), "  ", round(100 * n / length(v); digits = 2), "%")
end
'''

[[actionGroups.actions]]
id = "downloaded-files"
label = "Files Downloaded"
desc = "The files of the scene or of the elevation product in the folder, with their sizes, and the cells each band has over the area"
models = ["landsat", "elevation"]
code = '''
for (root, _, names) in walkdir(place), f in sort(names)
	println(rpad(f, 52), lpad(round(filesize(joinpath(root, f)) / 2^20; digits = 1), 8), " MB")
end
for b in chosen
