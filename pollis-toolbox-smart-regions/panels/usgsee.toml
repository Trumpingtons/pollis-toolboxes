[[actionGroups.actions]]
id = "ndvi"
label = "NDVI over the Area"
desc = "The normalised difference vegetation index from the red band SR_B4 and the near-infrared band SR_B5 of Landsat 8-9, cells with dilated cloud, cloud, cloud shadow or snow left out when QA_PIXEL is among the Bands, with its quantiles"
models = ["landsat"]
code = '''
using Statistics

all(in(chosen), ("SR_B4", "SR_B5")) || error("Add SR_B4 and SR_B5 to the Bands: red and near infrared")
ndvi = map((r, n) -> ismissing(r) || ismissing(n) || r + n <= 0 ? missing : Float32((n - r) / (n + r)), bands["SR_B4"], bands["SR_B5"])  # near infrared minus red, over their sum
if haskey(bands, "QA_PIXEL")
	ndvi = map((v, q) -> ismissing(q) || any(bit -> (q >> bit) & 1 == 1, (1, 3, 4, 5)) ? missing : v, ndvi, bands["QA_PIXEL"])  # dilated cloud, cloud, cloud shadow and snow left out
end
v = collect(skipmissing(ndvi))
println("NDVI of ", scene, " over ", length(v), " cells of 30 m: quantiles 5, 25, 50, 75, 95%: ", join(round.(quantile(v, [0.05, 0.25, 0.5, 0.75, 0.95]); digits = 3), ", "))
println("Cells above 0.5: ", round(100 * count(>(0.5), v) / length(v); digits = 1), "%; below 0: ", round(100 * count(<(0), v) / length(v); digits = 1), "%")
grid, chosen = ndvi, ["NDVI"]  # Show the Band on a Map and Plot the Band now draw NDVI
'''

