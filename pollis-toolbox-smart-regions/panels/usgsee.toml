# USGS EarthExplorer: the scenes of the datasets of USGS EarthExplorer found through its Machine-to-Machine API, the bands of
# a Landsat 8-9 Collection 2 Level-2 scene and the SRTM elevation of an area, downloaded with the user's account

[meta]
title = "USGS EarthExplorer"
viewType = "pollis.usgsee"
defaultModel = "find"
decisionFirstColumn = "Tab"

# The user's EROS Registration System account and its application token, kept by Pollis in Secret Storage and set in the Julia REPL
[apiKey]
label = "USGS EarthExplorer"
noun = "credentials"

[[apiKey.fields]]
name = "usgsUsername"
envVar = "USGS_USERNAME"
prompt = "USGS EROS Registration System username"
password = false

[[apiKey.fields]]
name = "usgsToken"
envVar = "USGS_TOKEN"
prompt = "USGS M2M application token (not the password)"

