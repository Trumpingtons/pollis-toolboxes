desc = "Write each band, or the elevation, cut to the area as a Cloud-Optimised GeoTIFF in the folder of the scene or the product, tiled, with overviews and DEFLATE compression"
models = ["landsat", "elevation"]
code = '''
for b in keys(bands)
	out = joinpath(place, "$(replace(b, r"[^A-Za-z0-9_]" => "-"))-area.tif")
	write(out, Raster(map(v -> ismissing(v) ? -9999f0 : Float32(v), bands[b]); missingval = -9999f0); driver = "COG", options = Dict("COMPRESS" => "DEFLATE"), force = true)
	println("Wrote ", out)
end
'''

