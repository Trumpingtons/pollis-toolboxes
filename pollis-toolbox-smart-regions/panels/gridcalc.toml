	println(rpad(k, 6), rpad(count(isequal(k), jb), 15), rpad(terra_cells[k + 1], 10), rpad(ismissing(share) ? "none" : round(share, digits = 6), 24), k < 7 ? terra_built[k + 1] : "none")
end
