[[codeBranches]]
model = "*"
code = '''
using Rasters, ArchGDAL, Statistics
using Rasters.Lookups: Intervals, Center, Points
{{?model=local}}import Proj  # for the areas of the cells on the sphere
{{?model=focal}}using Stencils
{{?model=zonal|rasterize}}using DuckDB, Tables, Downloads
{{?model=rasterize}}using Rasters.Lookups: order, ReverseOrdered

folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files
dem_path = joinpath(folder, "{{demFile}}")  # an absolute path is kept as it is
{{?demFile=london-dem.tif}}# Example file: the Copernicus DEM GLO-30 over west and central London, about 30 m cells, read from the Cloud-Optimised GeoTIFF of its tile on AWS unless the folder has london-dem.tif already. Replace "london-dem.tif" with your own GeoTIFF.
{{?demFile=london-dem.tif}}isfile(dem_path) || write(dem_path, read(Raster("/vsicurl/https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N51_00_W001_00_DEM/Copernicus_DSM_COG_10_N51_00_W001_00_DEM.tif"; lazy = true)[X(-0.6 .. 0.0), Y(51.3 .. 51.7)]); driver = "COG", options = Dict("COMPRESS" => "DEFLATE"))
ArchGDAL.setconfigoption("GTIFF_POINT_GEO_IGNORE", "TRUE")  # a GeoTIFF that records its cells as points, as the Copernicus DEM does: GDAL gives the points themselves, not the corners of cells around them
dem = read(Raster(dem_path; lazy = true))  # the elevation in memory
Rasters.Lookups.sampling(lookup(dem, X)) isa Points && (dem = set(dem, X => Intervals(Center()), Y => Intervals(Center())))  # each point the centre of its cell, as GDAL and terra take it
{{?model=local|zonal|resample}}cover_path = joinpath(folder, "{{coverFile}}")
{{?model=local|zonal|resample}}{{?coverFile=london-worldcover.tif}}# Example file: ESA WorldCover 2021, land cover in 11 classes in 10 m cells, over central and west London, read from the Cloud-Optimised GeoTIFF of its tile on AWS unless the folder has london-worldcover.tif already. Replace "london-worldcover.tif" with your own GeoTIFF of classes.
{{?model=local|zonal|resample}}{{?coverFile=london-worldcover.tif}}isfile(cover_path) || write(cover_path, read(Raster("/vsicurl/https://esa-worldcover.s3.eu-central-1.amazonaws.com/v200/2021/map/ESA_WorldCover_10m_2021_v200_N51W003_Map.tif"; lazy = true)[X(-0.3 .. 0.0), Y(51.4 .. 51.6)]); driver = "COG", options = Dict("COMPRESS" => "DEFLATE"))
{{?model=local|zonal|resample}}cover = read(Raster(cover_path; lazy = true))  # the land cover in memory, missing where the file has no data
{{?model=zonal|rasterize}}con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the file stays where it is
{{?model=zonal|rasterize}}DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
{{?model=zonal|rasterize}}DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
{{?model=zonal|rasterize}}zones_path = joinpath(folder, "{{zonesFile}}")
{{?model=zonal|rasterize}}{{?zonesFile=london-msoa.gpkg}}# Example file: the middle layer super output areas (MSOAs) of London, boundaries of the Office for National Statistics, with no_car, the percentage of households without a car or van in the Census 2021 (table TS045, through Nomis), written to london-msoa.gpkg unless the folder has one already. Replace "london-msoa.gpkg" with your own file.
{{?model=zonal|rasterize}}{{?zonesFile=london-msoa.gpkg}}if !isfile(zones_path)
{{?model=zonal|rasterize}}{{?zonesFile=london-msoa.gpkg}}	boundaries = Downloads.download("https://services1.arcgis.com/ESMARspQHYMw9BZ9/arcgis/rest/services/MSOA_2021_EW_BSC_V3_RUC/FeatureServer/0/query?geometry=-0.52,51.28,0.34,51.70&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=MSOA21CD,MSOA21NM&outSR=4326&f=geojson")  # the MSOAs in a box around London
{{?model=zonal|rasterize}}{{?zonesFile=london-msoa.gpkg}}	census = Downloads.download("https://www.nomisweb.co.uk/api/v01/dataset/NM_2063_1.data.csv?date=latest&geography=2013265927TYPE152&c2021_cars_5=0,1&measures=20100&select=geography_code,c2021_cars_5,obs_value")  # all households, and those without a car or van, in each MSOA of the London region
{{?model=zonal|rasterize}}{{?zonesFile=london-msoa.gpkg}}	DBInterface.execute(con, """COPY (SELECT b.MSOA21CD AS msoa, b.MSOA21NM AS name, round(100 * sum(c.OBS_VALUE) FILTER (WHERE c.C2021_CARS_5 = 1) / sum(c.OBS_VALUE) FILTER (WHERE c.C2021_CARS_5 = 0), 2) AS no_car, any_value(b.geom) AS geom
{{?model=zonal|rasterize}}{{?zonesFile=london-msoa.gpkg}}		FROM ST_Read('$(boundaries)') b JOIN read_csv('$(census)') c ON c.GEOGRAPHY_CODE = b.MSOA21CD GROUP BY ALL) TO '$(zones_path)' (FORMAT GDAL, DRIVER 'GPKG', LAYER_NAME 'msoa', SRS 'EPSG:4326')""")
{{?model=zonal|rasterize}}{{?zonesFile=london-msoa.gpkg}}end
{{?model=zonal|rasterize}}raster_crs = convert(String, convert(WellKnownText, crs(dem)))  # the coordinate system of the rasters, as WKT
{{?model=zonal|rasterize}}DBInterface.execute(con, "CREATE OR REPLACE TABLE areas AS SELECT * EXCLUDE (geom), ST_Transform(geom, '{{zonesCrs}}', '$(raster_crs)') AS geom FROM ST_Read('$(zones_path)')")  # the areas, in the coordinate system of the rasters
{{?model=local}}
{{?model=local}}# Local: each cell computed from the same cell of one or more grids, here by broadcasting a function over the cells
{{?model=local}}breaks = Float64[{{breaks}}]  # the limits of the bands, in metres
{{?model=local}}band_of(h) = ismissing(h) ? missing : (k = searchsortedlast(breaks, h); 1 <= k < length(breaks) ? k : 0)  # band k holds breaks[k] <= h < breaks[k + 1]; 0 outside the breaks
{{?model=local}}bands = band_of.(dem)  # a raster of band numbers on the grid of the elevation
{{?model=local}}cell_m2 = cellarea(dem)  # the area of each cell on the sphere, in square metres
{{?model=local}}# Two rasters are combined cell by cell only on one grid: the elevation is put onto the 10 m grid of the land cover, interpolated bilinearly
{{?model=local}}dem10 = resample(dem; to = cover, method = :bilinear)
{{?model=local}}in_class = cover .== UInt8({{coverClass}})  # true where the land cover is of the class chosen, missing where it has no data
{{?model=local}}bands10 = band_of.(dem10)
{{?model=local}}label(k) = k == 0 ? "outside the breaks" : "$(breaks[k]) to $(breaks[k + 1]) m"
{{?model=local}}result = bands
{{?model=local}}[(band = label(k), cells = count(isequal(k), bands), km2 = round(sum(cell_m2[isequal.(bands, k)]) / 1e6, digits = 2), class_share = (v = collect(skipmissing(in_class[isequal.(bands10, k)])); isempty(v) ? missing : round(mean(v), digits = 4))) for k in 0:length(breaks) - 1 if any(isequal(k), bands)]  # the share is missing for a band the land cover does not reach
{{?model=focal}}
{{?model=focal}}# Focal: each cell computed from a window of cells around it
{{?model=focal}}relief(v) = maximum(v) - minimum(v)  # the range of the values in the window
{{?model=focal}}window = {{shape}}({{radius}})  # Window(1): 3 x 3 cells; Circle(r): the cells within r of the centre
{{?model=focal}}cells = Matrix{Union{Missing, Float64}}(parent(dem))  # the cells, as a matrix that can hold missing values
{{?model=focal}}{{?edges=inside}}values = mapstencil(v -> {{focalStat}}(skipmissing(v)), window, cells; boundary = Remove(missing))  # beyond the edge the window holds missing cells, which the statistic skips
{{?model=focal}}{{?edges=missing}}values = mapstencil({{focalStat}}, window, cells; boundary = Remove(missing))  # missing wherever the window reaches past the edge
{{?model=focal}}result = rebuild(dem; data = values, missingval = missing)  # the values on the grid of the elevation
{{?model=focal}}println(size(result, X), " x ", size(result, Y), " cells, ", count(ismissing, result), " missing; values from ", round(minimum(skipmissing(result)), digits = 2), " to ", round(maximum(skipmissing(result)), digits = 2))
{{?model=zonal}}
{{?model=zonal}}# Zonal: one value for each area from the cells whose centres lie inside it; the areas within the land cover
{{?model=zonal}}(xa, xb), (ya, yb) = Rasters.bounds(cover, X), Rasters.bounds(cover, Y)  # the edges of the land cover
{{?model=zonal}}t = Tables.columntable(DBInterface.execute(con, "SELECT \"{{areaId}}\"::VARCHAR AS id, ST_AsWKB(geom) AS wkb FROM areas WHERE ST_Within(geom, ST_MakeEnvelope($xa, $ya, $xb, $yb)) ORDER BY id"))
{{?model=zonal}}geoms = [ArchGDAL.fromWKB(Vector{UInt8}(w)) for w in t.wkb]  # the polygons, as GDAL geometries
{{?model=zonal}}elevation = zonal({{zonalStat}}, dem; of = geoms, skipmissing = true, progress = false)  # the statistic of the elevation in each area
{{?model=zonal}}class_share = zonal(v -> mean(==(UInt8({{coverClass}})), v), cover; of = geoms, skipmissing = true, progress = false)  # the share of the cells of the class chosen
{{?model=zonal}}DBInterface.execute(con, "CREATE OR REPLACE TABLE zonal_result AS SELECT * FROM (VALUES $(join(["('$(id)', $(e), $(s))" for (id, e, s) in zip(t.id, elevation, class_share)], ", "))) v(id, elevation, class_share)")  # for the maps of the Next Steps
{{?model=zonal}}println(length(geoms), " areas")
{{?model=zonal}}[(id = id, elevation = round(e, digits = 2), class_share = round(s, digits = 4)) for (id, e, s) in zip(t.id, elevation, class_share)]
{{?model=resample}}
{{?model=resample}}# Resample: coarser cells, from blocks of cells of the elevation, and the land cover put onto the same grid
{{?model=resample}}coarse = Rasters.aggregate({{demMethod}}, dem, {{factor}})  # blocks of {{factor}} x {{factor}} cells; a partial block at the edge is left out
{{?model=resample}}cover_coarse = resample(cover; to = coarse, method = :{{coverMethod}})  # classes are never averaged: the most common class, or the nearest cell's
{{?model=resample}}shares(r) = (v = collect(skipmissing(r)); [Int(k) => round(count(==(k), v) / length(v), digits = 4) for k in sort(unique(v))])
{{?model=resample}}result = coarse
{{?model=resample}}println("Elevation: ", size(dem, X), " x ", size(dem, Y), " cells, now ", size(coarse, X), " x ", size(coarse, Y))
{{?model=resample}}println("Land cover classes, share of cells: before ", shares(cover))
{{?model=resample}}println("                                    after  ", shares(cover_coarse))
{{?model=rasterize}}
{{?model=rasterize}}# Rasterize: the areas onto a grid of blocks of {{factor}} x {{factor}} cells of the elevation
{{?model=rasterize}}grid = Rasters.aggregate(mean, dem, {{factor}})
{{?model=rasterize}}(xa, xb), (ya, yb) = Rasters.bounds(grid, X), Rasters.bounds(grid, Y)  # the edges of the grid
{{?model=rasterize}}t = Tables.columntable(DBInterface.execute(con, "SELECT \"{{valueColumn}}\"::DOUBLE AS value, ST_AsWKB(geom) AS wkb FROM areas WHERE \"{{valueColumn}}\" IS NOT NULL AND ST_Intersects(geom, ST_MakeEnvelope($xa, $ya, $xb, $yb))"))  # the areas that reach the grid
{{?model=rasterize}}geoms = [ArchGDAL.fromWKB(Vector{UInt8}(w)) for w in t.wkb]
{{?model=rasterize}}# The share of each cell of grid g inside the areas, from 0 to 1. Rasters.jl 0.15 places these shares one row off on a grid whose rows run from north to south, as in most GeoTIFFs, so on such a grid they are computed with the rows turned, then turned back
{{?model=rasterize}}covered(geoms, g) = coverage(union, geoms; to = g, progress = false, verbose = false)
{{?model=rasterize}}cell_cover(geoms, g) = rebuild(order(lookup(g, Y)) isa ReverseOrdered ? reverse(covered(geoms, reverse(g; dims = Y)); dims = Y) : covered(geoms, g); missingval = nothing)  # a share of 0 is a value, not a missing cell
{{?model=rasterize}}{{?rasterizeMethod=value}}result = rasterize(last, geoms; to = grid, fill = t.value, missingval = missing, progress = false, verbose = false)  # each cell takes the value of the area its centre lies in
{{?model=rasterize}}{{?rasterizeMethod=coverage}}result = cell_cover(geoms, grid)  # the share of each cell inside the areas, from 0 to 1
{{?model=rasterize}}{{?rasterizeMethod=value}}println(size(result, X), " x ", size(result, Y), " cells, ", count(!ismissing, result), " with a value; from ", round(minimum(skipmissing(result)), digits = 3), " to ", round(maximum(skipmissing(result)), digits = 3))
{{?model=rasterize}}{{?rasterizeMethod=coverage}}println(size(result, X), " x ", size(result, Y), " cells, ", count(>(0), result), " covered in part or whole, ", count(x -> 0 < x < 1, result), " of them in part")
'''

