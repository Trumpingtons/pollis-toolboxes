for (name, r) in (("Elevation", dem), ("Land cover", @isdefined(cover) ? cover : nothing), ("Result", @isdefined(result) ? result : nothing))
	r === nothing && continue
	m = count(ismissing, r)
	println(rpad(name, 12), m, " of ", length(r), " cells missing (", round(100 * m / length(r), digits = 2), "%)")
end
