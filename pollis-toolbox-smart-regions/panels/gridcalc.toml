[[faq]]
question = "What are local, focal and zonal operations?"
answer = '''
They are the three kinds of map algebra on a grid of cells. A local operation computes each cell from the same cell of one or more grids, such as a reclassification or the sum of two layers. A focal operation computes each cell from the cells around it, in a window such as 3 by 3 cells: a moving average or the range of heights. A zonal operation computes one value for each zone, such as the mean of the cells inside each area of a polygon layer.

The Local, Focal and Zonal tabs compute one of each; Resample and Rasterize move values between grids, and from polygons onto a grid.
'''
wiki = "Overview"

[[faq]]
question = "Why must two rasters be on the same grid before I combine them?"
answer = '''
A local operation pairs each cell of one raster with the cell at the same place in the other. When the grids differ in cell size, origin or coordinate system, the cells do not match one to one, and one raster must first be resampled onto the grid of the other.

The Local tab puts the elevation onto the 10 m grid of the land cover before it compares the two; Grids Side by Side prints the coordinate system, cell size and extent of each raster.
'''
wiki = "Diagnostics"

[[faq]]
question = "Which resampling method should I use for land cover?"
answer = '''
A raster of categories, such as land cover classes, must be resampled by a method that returns one of its classes: the most common class in each new cell (mode) or the class of the nearest cell. An average of class codes is not a class.

Continuous values, such as elevation, can be averaged, or interpolated bilinearly when the new cells are smaller.
'''
wiki = "Resampling and Aggregation"

[[faq]]
question = "What happens at the edges of a focal window?"
answer = '''
Near the edge of the grid, part of the window lies outside it. The Edges input decides what then happens: Cells Inside computes the statistic from the cells of the window that lie in the grid, as terra's focal does with na.rm = TRUE; Missing returns missing wherever the window reaches past the edge.

Edges Compared counts the cells whose value differs between the two.
'''
wiki = "Focal Operations"
hidden = true

[[faq]]
question = "Which cells does a zonal statistic count as inside an area?"
answer = '''
Rasters.jl and terra count a cell as inside an area when its centre is. A small area can then hold few cells, or none, and a cell on the boundary belongs to only one of the areas it touches.

Cells per Area lists the number of cells each area counts.
'''
wiki = "Zonal Operations"
hidden = true

[[faq]]
question = "How is an area measured on a grid in longitude and latitude?"
answer = '''
A cell of a grid in degrees spans a fixed angle, so its area shrinks towards the poles. cellarea of Rasters.jl computes the area of each cell on the sphere, in square metres; the Local tab sums those areas within each elevation band.
'''
wiki = "Diagnostics"
hidden = true

