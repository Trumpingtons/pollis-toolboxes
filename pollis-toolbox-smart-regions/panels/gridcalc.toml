desc = "The bands of 0, 20, 40, 60, 80, 100, 150 and 250 m and their share of built-up land, recomputed beside the values of R's terra 1.9.60 (classify, resample and zonal) on the example files"
models = ["local"]
when = "demFile=london-dem.tif"
code = '''
# terra 1.9.60 with GDAL 3.8.5, on london-dem.tif and london-worldcover.tif: classify(dem, rcl, right = FALSE, others = 0), freq; resample(dem, cover, "bilinear"), zonal(cover == 50, bands10, mean)
terra_cells = [274, 456350, 582600, 350779, 235404, 193478, 206855, 46420]
terra_built = [0.664019337, 0.6087972588, 0.6031256709, 0.5128887885, 0.4422478791, 0.3669873171, 0.2588640436]
