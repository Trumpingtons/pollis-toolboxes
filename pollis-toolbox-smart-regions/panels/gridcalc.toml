[[bullets]]
text = "Local"
detail = "Each cell computed from the same cell of one or more grids: elevation bands, and the share of a land cover class in each band"

[[bullets]]
text = "Focal"
detail = "Each cell computed from a window of cells around it: moving mean, median, maximum, minimum, standard deviation or relief"

[[bullets]]
text = "Zonal"
detail = "One value for each area of a polygon layer from the cells inside it: elevation and the share of a land cover class"

[[bullets]]
text = "Resample"
detail = "Coarser cells from blocks of the elevation's cells, and the land cover put onto that grid by the most common or the nearest class"

[[bullets]]
text = "Rasterize"
detail = "Polygons onto a grid: each cell takes the value of the area at its centre, or the share of the cell the areas cover"

[[decisionRows]]
task = "Local"
context = "Cell by cell"
purpose = "Reclassify a raster, or combine rasters on the same grid, such as land cover by elevation"

[[decisionRows]]
task = "Focal"
context = "Neighbourhood"
purpose = "Smooth a raster, or measure how much it varies around each cell, such as local relief"

[[decisionRows]]
task = "Zonal"
context = "By area"
purpose = "Summarise a raster within each area, such as the mean elevation or the tree cover of each district"

[[decisionRows]]
task = "Resample"
context = "Change of grid"
purpose = "Coarser or finer cells, or one raster put onto the grid of another"

[[decisionRows]]
task = "Rasterize"
context = "Polygons to cells"
purpose = "Put the values of areas onto a grid, to combine them with rasters"

[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. A file given by an absolute path is read where it is. Save the Result as Cloud-Optimised GeoTIFF writes there."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[inputs]]
id = "demFile"
label = "Elevation File"
tooltip = "A GeoTIFF of one band of continuous values, in the folder above, or an absolute path. With the default, london-dem.tif, the example first reads the Copernicus DEM GLO-30 over west and central London, about 30 m cells, from its Cloud-Optimised GeoTIFF on AWS, unless the folder has a london-dem.tif already: the file of the Raster Files panel."
default = "london-dem.tif"

[[inputs]]
id = "coverFile"
label = "Land Cover File"
tooltip = "A GeoTIFF of categories in the coordinate system of the elevation, in the folder above, or an absolute path. With the default, london-worldcover.tif, the example first reads ESA WorldCover 2021 over central and west London, 10 m cells, from its Cloud-Optimised GeoTIFF on AWS, unless the folder has a london-worldcover.tif already."
default = "london-worldcover.tif"
models = ["local", "zonal", "resample"]

[[inputs]]
id = "zonesFile"
label = "Areas File"
tooltip = "The areas, as polygons: GeoPackage (its first layer), GeoJSON, Shapefile, FlatGeobuf or KML, in the folder above, or an absolute path. With the default, london-msoa.gpkg, the example first downloads the middle layer super output areas (MSOAs) of London with the percentage of households without a car or van in the Census 2021 (no_car), unless the folder has a london-msoa.gpkg already: the file of the Spatial Autocorrelation panel."
default = "london-msoa.gpkg"
models = ["zonal", "rasterize"]

[[inputs]]
id = "zonesCrs"
label = "Areas Coordinate System"
tooltip = "The coordinate system of the areas file, such as EPSG:4326 for longitude and latitude or EPSG:27700 for the British National Grid. The areas are transformed to the coordinate system of the elevation."
default = "EPSG:4326"
models = ["zonal", "rasterize"]

[[inputs]]
id = "areaId"
label = "Area Column"
tooltip = "The column of the areas file that names each area."
default = "msoa"
models = ["zonal"]

[[inputs]]
id = "valueColumn"
label = "Value Column"
tooltip = "The numeric column of the areas file whose values are put onto the grid."
default = "no_car"
models = ["rasterize"]

[[inputs]]
id = "breaks"
label = "Breaks"
tooltip = "The limits of the elevation bands, in metres, from low to high: each band holds the values from one limit up to, but not including, the next. Cells outside the breaks form a band of their own."
default = "0, 20, 40, 60, 80, 100, 150, 250"
models = ["local"]
newRow = true

[[inputs]]
