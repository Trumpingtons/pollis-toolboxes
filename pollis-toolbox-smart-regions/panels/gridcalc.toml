[[actionGroups.actions]]
id = "grids"
label = "Grids Side by Side"
desc = "The coordinate system, size, cell size, extent and sampling of each raster of the tab: grids that differ in any of them must be resampled before they are combined cell by cell"
code = '''
crs_name(r) = (m = match(r"^\w+\[\"([^\"]+)\"", convert(String, convert(WellKnownText, crs(r)))); m === nothing ? "none recorded" : m[1])
function describe(name, r)
	println(name, ": ", size(r, X), " x ", size(r, Y), " cells of ", round(abs(step(lookup(r, X))), sigdigits = 6), " by ", round(abs(step(lookup(r, Y))), sigdigits = 6), ", ", crs_name(r))
	println("    x from ", round.(Rasters.bounds(r, X), digits = 6), ", y from ", round.(Rasters.bounds(r, Y), digits = 6), "; cells as ", nameof(typeof(Rasters.Lookups.sampling(lookup(r, X)))))
end
describe("Elevation", dem)
@isdefined(cover) && describe("Land cover", cover)
@isdefined(result) && describe("Result", result)
'''

