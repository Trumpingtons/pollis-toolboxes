desc = "The result as a heat map drawn with ECharts, north up, at most 200 cells a side (larger grids averaged over blocks of cells)"
models = ["local", "focal", "resample", "rasterize"]
code = '''
using ECharts

f = max(1, cld(max(size(result, X), size(result, Y)), 200))  # at most 200 cells a side
small = permutedims(f > 1 ? Rasters.aggregate(mean, result, f; skipmissingval = true) : result, (X, Y))
north_first = first(lookup(small, Y)) > last(lookup(small, Y))
nx, ny = size(small)
heat = [[i - 1, (north_first ? ny - j : j - 1), round(Float64(small[i, j]), digits = 3)] for i in 1:nx, j in 1:ny if !ismissing(small[i, j])]  # column, row from the south, value
lo, hi = extrema(skipmissing(small))
EChart(ec_width = 760, ec_height = round(Int, 60 + 680 * ny / nx), title = [ECharts.Title(text = "{{model}}")], tooltip = ECharts.Tooltip(),
	xAxis = [ECharts.Axis(_type = "category", data = string.(round.(lookup(small, X), digits = 3)), name = "x")],
	yAxis = [ECharts.Axis(_type = "category", data = string.(round.(north_first ? reverse(lookup(small, Y)) : lookup(small, Y), digits = 3)), name = "y")],
	visualMap = ECharts.VisualMap(min = lo, max = hi, calculable = true, orient = "vertical", right = "1%", top = "middle", inRange = Dict("color" => ["#313695", "#74add1", "#ffffbf", "#f46d43", "#a50026"])),
	series = [ECharts.HeatmapSeries(name = "Value", data = heat)])
'''

[[actionGroups.actions]]
id = "map-result"
label = "Show on a Map"
desc = "The result on an OpenStreetMap base map in Pollis's map view, at most 80 cells a side (larger grids averaged over blocks of cells); click a cell for its value"
models = ["local", "focal", "resample", "rasterize"]
code = '''
using DuckDB

f = max(1, cld(max(size(result, X), size(result, Y)), 80))  # at most 80 cells a side
small = permutedims(f > 1 ? Rasters.aggregate(mean, result, f; skipmissingval = true) : result, (X, Y))
edges(d) = [(min(lo, hi), max(lo, hi)) for (lo, hi) in Rasters.intervalbounds(small, d)]  # each cell's two edges
xe, ye = edges(X), edges(Y)
rows = ["($(round(Float64(small[i, j]), digits = 3)), $(xe[i][1]), $(ye[j][1]), $(xe[i][2]), $(ye[j][2]))" for i in axes(small, 1), j in axes(small, 2) if !ismissing(small[i, j])]
db = DBInterface.connect(DuckDB.DB)
DBInterface.execute(db, "LOAD spatial")
DBInterface.execute(db, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
file = joinpath(mktempdir(), "cells.geojson")
DBInterface.execute(db, "COPY (SELECT value, ST_Transform(ST_MakeEnvelope(x0, y0, x1, y1), '$(convert(String, convert(WellKnownText, crs(dem))))', 'EPSG:4326') AS geom FROM (VALUES $(join(rows, ", "))) t(value, x0, y0, x1, y1)) TO '$(file)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(file; name = "{{model}}", column = "value", opacity = 0.7)))
'''

