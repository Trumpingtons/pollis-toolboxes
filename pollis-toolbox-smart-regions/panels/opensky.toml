[[actionGroups.actions]]
id = "save-geoparquet"
label = "Save as GeoParquet"
desc = "Write the table of the tab as a GeoParquet file in the folder opensky: the aircraft as points, the flights as lines to the airport at the other end, or the waypoints of the track as points"
code = '''
{{?model=live}}saved = "aircraft" => "SELECT *, CASE WHEN lon IS NOT NULL THEN ST_Point(lon, lat) END AS geom FROM aircraft"
{{?model=airport}}saved = "flights" => "SELECT f.*, CASE WHEN a.lon IS NOT NULL THEN ST_MakeLine(ST_Point($(only(here.lon)), $(only(here.lat))), ST_Point(a.lon, a.lat)) END AS geom FROM flights f LEFT JOIN airports a ON a.icao = f.other"
{{?model=track}}saved = "track" => "SELECT *, CASE WHEN lon IS NOT NULL THEN ST_Point(lon, lat) END AS geom FROM track"
parquet_file = joinpath(place, "$(first(saved))-$(tag).parquet")
execute("COPY ($(last(saved))) TO '$(parquet_file)' (FORMAT parquet)")
println("Wrote ", only(query("SELECT count(*) AS n FROM read_parquet('$(parquet_file)')").n), " rows to ", parquet_file)
'''

[[actionGroups.actions]]
id = "save-csv"
label = "Save as CSV"
desc = "Write the table of the tab as a CSV file in the folder opensky: the aircraft, the flights or the waypoints"
code = '''
{{?model=live}}listed = "aircraft"
{{?model=airport}}listed = "flights"
{{?model=track}}listed = "track"
csv_file = joinpath(place, "$(listed)-$(tag).csv")
execute("COPY $(listed) TO '$(csv_file)' (HEADER, DELIMITER ',')")
println("Wrote ", only(query("SELECT count(*) AS n FROM read_csv('$(csv_file)')").n), " rows to ", csv_file)
'''
