[[codeBranches]]
model = "live"
code = '''
using DuckDB, Tables, Dates, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
execute(sql) = DBInterface.execute(con, sql)
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))
place = mkpath(joinpath(folder, "opensky"))  # where the Next Steps save their files
has_account = has_opensky_client()  # an OpenSky API client, set with the key on the Powered by line

area = "{{area}}"
boxes = Dict("london" => (-0.7, 51.2, 0.4, 51.8), "paris" => (1.9, 48.6, 2.9, 49.2), "frankfurt" => (8.2, 49.8, 9.1, 50.4), "newyork" => (-74.4, 40.4, -73.5, 41.0), "singapore" => (103.5, 1.1, 104.2, 1.6),
	"usa" => (-125.0, 24.5, -66.9, 49.5), "canada" => (-141.0, 41.7, -52.6, 70.0), "india" => (68.1, 6.7, 97.4, 35.7), "brazil" => (-74.0, -33.8, -34.8, 5.3), "australia" => (112.9, -43.7, 153.7, -10.6))  # west, south, east, north
west, south, east, north = area == "custom" ? Tuple(parse.(Float64, strip.(split(raw"{{box}}", ",")))) : boxes[area]
snapshot() = opensky_states((west, south, east, north))  # the SQL of the state vectors of the aircraft over the box now: one request
execute("CREATE OR REPLACE TABLE aircraft AS " * snapshot())  # the state vectors of the aircraft over the box now
tag = "$(area)-$(Dates.format(now(UTC), "yyyymmdd-HHMM"))"
seen = query("SELECT count(*) AS n, count(*) FILTER (WHERE NOT on_ground) AS airborne, count(*) FILTER (WHERE lon IS NULL) AS unplaced, max(seen) AS seen FROM aircraft")
println(only(seen.n), " aircraft over the box at ", only(seen.seen), " UTC: ", only(seen.airborne), " airborne, ", only(seen.n) - only(seen.airborne), " on the ground, ", only(seen.unplaced), " without a position")
println("States credits left today: ", get(opensky_credits(), "states", "not reported"), has_account ? " (API client)" : " (anonymous)")
'''

[[codeBranches]]
model = "airport"
code = '''
using DuckDB, Tables, Downloads, Dates, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
execute(sql) = DBInterface.execute(con, sql)
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))
place = mkpath(joinpath(folder, "opensky"))  # where the airports and the flights of past days are kept, and the Next Steps save their files
has_account = has_opensky_client()  # an OpenSky API client, set with the key on the Powered by line
function fetch(url, name)  # a file downloaded once into the folder opensky: a later run reads it from there
	path = joinpath(place, name)
	isfile(path) || mv(Downloads.download(url, path * ".part"; headers = ["User-Agent" => "Pollis (https://pollis.org)"]), path)
	return path
end

airport = uppercase(strip("{{airport}}"))
day = "{{day}}" == "yesterday" ? Date(now(UTC)) - Day(1) : Date("{{day}}")
airports_file = fetch("https://davidmegginson.github.io/ourairports-data/airports.csv", "ourairports-airports.csv")  # the airports of the world, OurAirports
execute("CREATE OR REPLACE TABLE airports AS SELECT ident AS icao, name, iso_country AS country, municipality, longitude_deg AS lon, latitude_deg AS lat FROM read_csv('$(airports_file)')")
here = query("SELECT name, country, lon, lat FROM airports WHERE icao = ?", [airport])
isempty(here.name) && error("OurAirports lists no airport with the ICAO code $(airport)")
flights_of(airport, day) = opensky_flights(airport, day; folder = place)  # the SQL of the arrivals and departures of an airport on a day (UTC), each downloaded once into the folder opensky
execute("CREATE OR REPLACE TABLE flights AS " * flights_of(airport, day))  # one row per flight; other is the estimated airport at the other end, times in UTC
tag = "$(airport)-$(day)"
counts = query("SELECT count(*) FILTER (WHERE direction = 'arrival') AS arrivals, count(*) FILTER (WHERE direction = 'departure') AS departures FROM flights")
println(only(here.name), " (", airport, ") on ", day, " (UTC): ", only(counts.arrivals), " arrivals and ", only(counts.departures), " departures seen by the OpenSky Network")
haskey(opensky_credits(), "flights") && println("Flights credits left today: ", opensky_credits()["flights"])
'''

[[codeBranches]]
model = "track"
code = '''
using DuckDB, Tables, Dates, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
execute(sql) = DBInterface.execute(con, sql)
query(sql, params = ()) = Tables.columntable(DBInterface.execute(con, sql, params))
folder = mkpath(expanduser(raw"{{folder}}"))
place = mkpath(joinpath(folder, "opensky"))  # where the Next Steps save their files
has_account = has_opensky_client()  # an OpenSky API client, set with the key on the Powered by line

area = "{{area}}"
boxes = Dict("london" => (-0.7, 51.2, 0.4, 51.8), "paris" => (1.9, 48.6, 2.9, 49.2), "frankfurt" => (8.2, 49.8, 9.1, 50.4), "newyork" => (-74.4, 40.4, -73.5, 41.0), "singapore" => (103.5, 1.1, 104.2, 1.6),
	"usa" => (-125.0, 24.5, -66.9, 49.5), "canada" => (-141.0, 41.7, -52.6, 70.0), "india" => (68.1, 6.7, 97.4, 35.7), "brazil" => (-74.0, -33.8, -34.8, 5.3), "australia" => (112.9, -43.7, 153.7, -10.6))  # west, south, east, north
west, south, east, north = area == "custom" ? Tuple(parse.(Float64, strip.(split(raw"{{box}}", ",")))) : boxes[area]
aircraft = lowercase(strip("{{aircraft}}"))
moment = strip("{{trackTime}}")
at = moment == "live" ? 0 : round(Int, datetime2unix(DateTime(moment, dateformat"yyyy-mm-dd HH:MM")))  # 0 asks for the flight the aircraft is on now
if aircraft == "nearest"
	at == 0 || error("Set Aircraft to the address of a transponder for a past flight: nearest picks an aircraft in the air now")
	candidates = query("""SELECT icao24 FROM ($(opensky_states((west, south, east, north); extended = false)))
		WHERE NOT on_ground AND lon IS NOT NULL ORDER BY (lon - ?) * (lon - ?) + (lat - ?) * (lat - ?) LIMIT 5""",
		[(west + east) / 2, (west + east) / 2, (south + north) / 2, (south + north) / 2]).icao24  # the five airborne aircraft nearest the centre of the box
	isempty(candidates) && error("No aircraft in the air over the Example Area now")
else
	candidates = [aircraft]
end
track = let found = nothing
	for a in candidates  # the first of them whose track the OpenSky Network has
		found = opensky_track(a; time = at)
		found === nothing || break
	end
	found
end
track === nothing && error("The OpenSky Network has no track of $(join(candidates, ", ")) at that time")
execute("CREATE OR REPLACE TABLE track AS " * track)  # one row per waypoint; times in UTC, altitudes in metres
flown = query("""SELECT any_value(icao24) AS icao24, any_value(callsign) AS callsign, count(*) AS waypoints, min(time) AS first, max(time) AS last, sum(km) AS km
	FROM (SELECT *, ST_Distance_Spheroid(ST_Point(lag(lon) OVER (ORDER BY time), lag(lat) OVER (ORDER BY time)), ST_Point(lon, lat)) / 1000 AS km FROM track)""")
tag = only(flown.icao24)
println("Track of ", only(flown.icao24), " (", coalesce(only(flown.callsign), "no callsign"), "): ", only(flown.waypoints), " waypoints from ", only(flown.first), " to ", only(flown.last), " UTC, ", round(coalesce(only(flown.km), 0.0); digits = 1), " km along them")
println("Tracks credits left today: ", get(opensky_credits(), "tracks", "not reported"), has_account ? " (API client)" : " (anonymous)")
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "aircraft-map"
label = "Aircraft on a Map"
desc = "The aircraft with a position, coloured by their barometric altitude, on an OpenStreetMap base map in Pollis's map view"
models = ["live"]
code = '''
aircraft_shown = joinpath(mktempdir(), "aircraft.geojson")
execute("COPY (SELECT icao24, callsign, country, round(coalesce(altitude, 0)) AS altitude, round(velocity * 3.6) AS km_h, round(heading) AS heading, on_ground, ST_Point(lon, lat) AS geom FROM aircraft WHERE lon IS NOT NULL) TO '$(aircraft_shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(aircraft_shown; name = "Aircraft, barometric altitude (m)", column = "altitude"); title = "Aircraft Seen by the OpenSky Network"))
'''

[[actionGroups.actions]]
id = "altitudes-speeds"
label = "Altitudes and Speeds"
desc = "The barometric altitude against the speed over ground of each airborne aircraft, as a scatter chart drawn with ECharts: aircraft climbing out or on approach sit low and slow, those cruising high and fast"
models = ["live"]
code = '''
using ECharts

airborne = query("SELECT round(velocity * 3.6) AS km_h, round(altitude) AS altitude FROM aircraft WHERE NOT on_ground AND velocity IS NOT NULL AND altitude IS NOT NULL")
println(length(airborne.km_h), " airborne aircraft with an altitude and a speed")
EChart(ec_width = 680, ec_height = 420, title = [ECharts.Title(text = "Altitude and Speed of the Airborne Aircraft")], tooltip = ECharts.Tooltip(),
	xAxis = [ECharts.Axis(_type = "value", name = "km/h")], yAxis = [ECharts.Axis(_type = "value", name = "m")],
	series = [ECharts.XYSeries(name = "Aircraft", _type = "scatter", symbolSize = 5, data = [[airborne.km_h[i], airborne.altitude[i]] for i in eachindex(airborne.km_h)])])
'''

[[actionGroups.actions]]
id = "flights-by-hour"
label = "Flights by Hour"
desc = "The arrivals and departures of the airport in each hour of the day, in UTC, by the time of the last and first position seen, as a bar chart drawn with ECharts"
models = ["airport"]
code = '''
using ECharts

by_hour = query("""SELECT h.hour, count(f.direction) FILTER (WHERE f.direction = 'arrival') AS arrivals, count(f.direction) FILTER (WHERE f.direction = 'departure') AS departures
	FROM range(24) h(hour) LEFT JOIN flights f ON hour(CASE f.direction WHEN 'arrival' THEN f.last_seen ELSE f.first_seen END) = h.hour GROUP BY h.hour ORDER BY h.hour""")
println("Busiest hour: ", by_hour.hour[argmax(by_hour.arrivals .+ by_hour.departures)], ":00 UTC")
EChart(ec_width = 720, ec_height = 400, title = [ECharts.Title(text = "Arrivals and Departures by Hour, $(airport), $(day)")], tooltip = ECharts.Tooltip(trigger = "axis"), legend = ECharts.Legend(data = ["Arrivals", "Departures"]),
	xAxis = [ECharts.Axis(_type = "category", name = "UTC", data = string.(by_hour.hour))], yAxis = [ECharts.Axis(_type = "value", name = "Flights")],
	series = [ECharts.XYSeries(name = "Arrivals", _type = "bar", data = collect(by_hour.arrivals)), ECharts.XYSeries(name = "Departures", _type = "bar", data = collect(by_hour.departures))])
'''

[[actionGroups.actions]]
id = "airport-routes-map"
label = "Routes on a Map"
desc = "The airports the flights came from or went to, with their number of flights, linked to the airport by straight lines, on an OpenStreetMap base map in Pollis's map view"
models = ["airport"]
code = '''
ends_shown, links_shown = joinpath(mktempdir(), "airports.geojson"), joinpath(mktempdir(), "links.geojson")
linked = "SELECT f.other AS icao, a.name, a.country, count(*) AS flights, a.lon, a.lat FROM flights f JOIN airports a ON a.icao = f.other WHERE f.other <> '$(airport)' GROUP BY ALL"
execute("COPY (SELECT icao, name, country, flights, ST_Point(lon, lat) AS geom FROM ($(linked))) TO '$(ends_shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")
execute("COPY (SELECT icao, name, flights, ST_MakeLine(ST_Point($(only(here.lon)), $(only(here.lat))), ST_Point(lon, lat)) AS geom FROM ($(linked))) TO '$(links_shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(links_shown; name = "Routes, flights on the day", column = "flights", opacity = 0.5), Pollis.layer(ends_shown; name = "Airports, flights on the day", column = "flights"); title = "Routes of $(airport), $(day)"))
'''

[[actionGroups.actions]]
id = "track-map"
label = "Track on a Map"
desc = "The track as a line through its waypoints, and the waypoints coloured by their barometric altitude, on an OpenStreetMap base map in Pollis's map view"
models = ["track"]
code = '''
line_shown, points_shown = joinpath(mktempdir(), "track.geojson"), joinpath(mktempdir(), "waypoints.geojson")
execute("COPY (SELECT any_value(icao24) AS icao24, any_value(callsign) AS callsign, ST_MakeLine(list(ST_Point(lon, lat) ORDER BY time)) AS geom FROM track WHERE lon IS NOT NULL) TO '$(line_shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")
execute("COPY (SELECT strftime(time, '%H:%M:%S') AS time, round(coalesce(altitude, 0)) AS altitude, round(heading) AS heading, on_ground, ST_Point(lon, lat) AS geom FROM track WHERE lon IS NOT NULL) TO '$(points_shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(line_shown; name = "Track", color = "#3b82f6"), Pollis.layer(points_shown; name = "Waypoints, barometric altitude (m)", column = "altitude"); title = "Track of $(tag)"))
'''

[[actionGroups.actions]]
id = "altitude-profile"
label = "Altitude Profile"
desc = "The barometric altitude of each waypoint against the minutes since the first, as a line chart drawn with ECharts"
models = ["track"]
code = '''
using ECharts

profile = query("SELECT round((epoch(time) - min(epoch(time)) OVER ()) / 60, 1) AS minutes, round(altitude) AS altitude FROM track WHERE altitude IS NOT NULL ORDER BY time")
println("Highest waypoint: ", isempty(profile.altitude) ? "none" : string(maximum(profile.altitude), " m"))
EChart(ec_width = 720, ec_height = 380, title = [ECharts.Title(text = "Altitude Profile of $(tag)")], tooltip = ECharts.Tooltip(trigger = "axis"),
	xAxis = [ECharts.Axis(_type = "value", name = "Minutes")], yAxis = [ECharts.Axis(_type = "value", name = "m")],
	series = [ECharts.XYSeries(name = "Barometric altitude", _type = "line", data = [[profile.minutes[i], profile.altitude[i]] for i in eachindex(profile.minutes)])])
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "position-sources"
label = "Position Sources"
desc = "How the position of each aircraft was obtained, from ADS-B, ASTERIX, multilateration (MLAT) or FLARM, the aircraft without a position, and how old the positions and last contacts are"
models = ["live"]
code = '''
sources = query("SELECT coalesce(['ADS-B', 'ASTERIX', 'MLAT', 'FLARM'][source + 1], 'unknown') AS source, count(*) AS aircraft FROM aircraft GROUP BY ALL ORDER BY aircraft DESC")
for (s, n) in zip(sources.source, sources.aircraft)
	println(rpad(s, 10), lpad(n, 6), " aircraft")
end
ages = query("SELECT count(*) FILTER (WHERE positioned IS NULL) AS unplaced, median(epoch(seen) - epoch(positioned)) AS position_age, max(epoch(seen) - epoch(last_contact)) AS contact_age FROM aircraft")
println(only(ages.unplaced), " aircraft without a position report in the last 15 seconds; median age of the positions ", coalesce(only(ages.position_age), 0), " s; oldest last contact ", coalesce(only(ages.contact_age), 0), " s")
'''

[[actionGroups.actions]]
id = "airport-estimates"
label = "Airport Estimates"
desc = "For the arrivals and the departures: the share of flights whose airport at the other end is unknown, the median distance of the first or last airborne position to the airport, and the share of flights with other candidate airports nearby"
models = ["airport"]
code = '''
estimates = query("""SELECT direction, count(*) AS flights, count(*) FILTER (WHERE other IS NULL) AS unknown,
	median(CASE direction WHEN 'arrival' THEN destination_distance ELSE origin_distance END) AS distance,
	count(*) FILTER (WHERE (CASE direction WHEN 'arrival' THEN destination_candidates ELSE origin_candidates END) > 0) AS ambiguous
	FROM flights GROUP BY direction ORDER BY direction""")
for r in Tables.rows(estimates)
	println(rpad(r.direction == "arrival" ? "Arrivals" : "Departures", 12), r.flights, " flights; other airport unknown for ", round(100 * r.unknown / max(r.flights, 1); digits = 1), "%; median distance of the ",
		r.direction == "arrival" ? "last" : "first", " airborne position to ", airport, ": ", coalesce(round(r.distance), "none"), " m; other candidate airports for ", round(100 * r.ambiguous / max(r.flights, 1); digits = 1), "%")
end
'''

[[actionGroups.actions]]
id = "track-gaps"
label = "Gaps in the Track"
desc = "The longest intervals between successive waypoints, how many exceed the 15 minutes within which the OpenSky Network places a waypoint in flight, and the waypoints without a position"
models = ["track"]
code = '''
gaps = query("SELECT lag(time) OVER (ORDER BY time) AS after, time AS before, epoch(time) - epoch(lag(time) OVER (ORDER BY time)) AS seconds FROM track QUALIFY seconds IS NOT NULL ORDER BY seconds DESC")
println(count(>(900), gaps.seconds), " gaps longer than 15 minutes; ", only(query("SELECT count(*) AS n FROM track WHERE lon IS NULL").n), " waypoints without a position")
for i in 1:min(5, length(gaps.seconds))
	println(gaps.after[i], " to ", gaps.before[i], " UTC: ", round(gaps.seconds[i] / 60; digits = 1), " minutes")
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "snapshots"
label = "Snapshots over Time"
desc = "Four more snapshots of the area a minute apart, compared with the first: the aircraft, those airborne, their mean altitude, and how many aircraft appear in every snapshot; uses four more states requests"
models = ["live"]
code = '''
execute("CREATE OR REPLACE TABLE snapshots AS SELECT 1 AS k, * FROM aircraft")
for k in 2:5
	sleep(60)
	execute("INSERT INTO snapshots SELECT $(k) AS k, * FROM ($(snapshot()))")
end
compared = query("SELECT k, min(seen) AS seen, count(*) AS aircraft, count(*) FILTER (WHERE NOT on_ground) AS airborne, round(avg(altitude) FILTER (WHERE NOT on_ground)) AS altitude FROM snapshots GROUP BY k ORDER BY k")
println(rpad("UTC", 22), lpad("aircraft", 9), lpad("airborne", 9), lpad("mean m", 8))
for r in Tables.rows(compared)
	println(rpad(string(r.seen), 22), lpad(r.aircraft, 9), lpad(r.airborne, 9), lpad(coalesce(r.altitude, 0), 8))
end
println(only(query("SELECT count(*) AS n FROM (SELECT icao24 FROM snapshots GROUP BY icao24 HAVING count(DISTINCT k) = 5)").n), " aircraft in all five snapshots, of ", only(query("SELECT count(DISTINCT icao24) AS n FROM snapshots").n), " seen; states credits left today: ", get(opensky_credits(), "states", "not reported"))
'''

[[actionGroups.actions]]
id = "week-before"
label = "A Week Before"
desc = "The same airport on the same day of the week a week earlier: arrivals, departures and airports linked on each day, and the ten airports with the most flights on either; uses two more flights requests"
models = ["airport"]
code = '''
execute("CREATE OR REPLACE TABLE flights_before AS " * flights_of(airport, day - Day(7)))
both_days = "SELECT '$(day)' AS day, * FROM flights UNION ALL SELECT '$(day - Day(7))' AS day, * FROM flights_before"
totals = query("SELECT day, count(*) FILTER (WHERE direction = 'arrival') AS arrivals, count(*) FILTER (WHERE direction = 'departure') AS departures, count(DISTINCT other) AS airports FROM ($(both_days)) GROUP BY day ORDER BY day")
for r in Tables.rows(totals)
	println(r.day, ": ", r.arrivals, " arrivals, ", r.departures, " departures, ", r.airports, " airports linked")
end
top = query("""SELECT other, count(*) FILTER (WHERE day = '$(day - Day(7))') AS before, count(*) FILTER (WHERE day = '$(day)') AS now FROM ($(both_days)) WHERE other IS NOT NULL AND other <> '$(airport)'
	GROUP BY other ORDER BY greatest(before, now) DESC LIMIT 10""")
println("\n", rpad("Airport", 9), lpad(string(day - Day(7)), 12), lpad(string(day), 12))
for r in Tables.rows(top)
	println(rpad(r.other, 9), lpad(r.before, 12), lpad(r.now, 12))
end
'''

[[actionGroups.actions]]
id = "flown-direct"
label = "Flown and Direct"
desc = "The distance along the waypoints of the track against the great-circle distance between its first and last positions, their ratio, the time between them and the mean speed"
models = ["track"]
code = '''
ends = query("""SELECT ST_Distance_Spheroid(ST_Point(first(lon ORDER BY time), first(lat ORDER BY time)), ST_Point(last(lon ORDER BY time), last(lat ORDER BY time))) / 1000 AS direct,
	(max(epoch(time)) - min(epoch(time))) / 3600 AS hours FROM track WHERE lon IS NOT NULL""")
along, direct, hours = coalesce(only(flown.km), 0.0), only(ends.direct), only(ends.hours)
println("Along the waypoints: ", round(along; digits = 1), " km; direct between the first and last positions: ", round(direct; digits = 1), " km; ratio ", round(along / max(direct, 1e-9); digits = 3))
println("Time between them: ", round(hours; digits = 2), " h; mean speed along the waypoints: ", round(along / max(hours, 1e-9)), " km/h")
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "countries"
label = "Countries of Registration"
desc = "The aircraft by the country the OpenSky Network infers from their ICAO 24-bit address, the fifteen most frequent"
models = ["live"]
code = '''
registered = query("SELECT coalesce(country, 'unknown') AS country, count(*) AS aircraft FROM aircraft GROUP BY ALL ORDER BY aircraft DESC LIMIT 15")
total = only(query("SELECT count(*) AS n FROM aircraft").n)
for (c, n) in zip(registered.country, registered.aircraft)
	println(rpad(c, 28), lpad(n, 6), lpad(round(100 * n / total; digits = 1), 7), "%")
end
'''

[[actionGroups.actions]]
id = "callsign-prefixes"
label = "Callsign Prefixes"
desc = "The callsigns written as three letters and a number, the form airlines use, grouped by their three letters, the fifteen most frequent, and the share of the other callsigns"
models = ["live", "airport"]
code = '''
{{?model=live}}listed_table = "aircraft"
{{?model=airport}}listed_table = "flights"
prefixes = query("SELECT left(callsign, 3) AS prefix, count(*) AS n FROM $(listed_table) WHERE regexp_matches(callsign, '^[A-Z]{3}[0-9]') GROUP BY ALL ORDER BY n DESC LIMIT 15")
shares = query("SELECT count(*) AS n, count(*) FILTER (WHERE regexp_matches(callsign, '^[A-Z]{3}[0-9]')) AS airline, count(*) FILTER (WHERE callsign IS NULL) AS none FROM $(listed_table)")
for (p, n) in zip(prefixes.prefix, prefixes.n)
	println(rpad(p, 6), lpad(n, 6))
end
println("Callsigns of three letters and a number: ", round(100 * only(shares.airline) / max(only(shares.n), 1); digits = 1), "%; other callsigns: ", round(100 * (only(shares.n) - only(shares.airline) - only(shares.none)) / max(only(shares.n), 1); digits = 1), "%; no callsign: ", round(100 * only(shares.none) / max(only(shares.n), 1); digits = 1), "%")
'''

[[actionGroups.actions]]
id = "categories"
label = "Aircraft Categories"
desc = "The aircraft by the emitter category their transponder broadcasts, from light aircraft to heavy jets, rotorcraft and gliders, with the share that broadcasts none"
models = ["live"]
code = '''
names = ["No information", "No ADS-B emitter category", "Light", "Small", "Large", "High vortex large", "Heavy", "High performance", "Rotorcraft", "Glider or sailplane", "Lighter than air",
	"Parachutist or skydiver", "Ultralight, hang-glider or paraglider", "Reserved", "Unmanned aerial vehicle", "Space vehicle", "Emergency surface vehicle", "Service surface vehicle", "Point obstacle", "Cluster obstacle", "Line obstacle"]
by_category = query("SELECT coalesce(category, 0) AS category, count(*) AS aircraft FROM aircraft GROUP BY ALL ORDER BY aircraft DESC")
for (c, n) in zip(by_category.category, by_category.aircraft)
	println(rpad(c + 1 <= length(names) ? names[c + 1] : "Category $(c)", 38), lpad(n, 6))
end
'''

[[actionGroups.actions]]
id = "busiest-routes"
label = "Busiest Routes"
desc = "The fifteen airports with the most flights from or to the airport on the day, with their arrivals from and departures to each, the distance, and the share of flights within the airport's country"
models = ["airport"]
code = '''
routes = query("""SELECT f.other, a.name, a.country, count(*) FILTER (WHERE f.direction = 'arrival') AS arrivals, count(*) FILTER (WHERE f.direction = 'departure') AS departures,
	ST_Distance_Spheroid(ST_Point(?, ?), ST_Point(a.lon, a.lat)) / 1000 AS km FROM flights f JOIN airports a ON a.icao = f.other WHERE f.other <> ? GROUP BY ALL ORDER BY arrivals + departures DESC""", [only(here.lon), only(here.lat), airport])
println(rpad("Airport", 8), rpad("Name", 40), rpad("", 4), lpad("from", 6), lpad("to", 6), lpad("km", 8))
for i in 1:min(15, length(routes.other))
	println(rpad(routes.other[i], 8), rpad(first(routes.name[i], 38), 40), rpad(routes.country[i], 4), lpad(routes.arrivals[i], 6), lpad(routes.departures[i], 6), lpad(round(Int, routes.km[i]), 8))
end
within = sum(routes.arrivals[routes.country .== only(here.country)]) + sum(routes.departures[routes.country .== only(here.country)])
println("Flights with a known airport at the other end within ", only(here.country), ": ", round(100 * within / max(sum(routes.arrivals) + sum(routes.departures), 1); digits = 1), "%")
'''

[[actionGroups.actions]]
id = "flight-phases"
label = "Phases of Flight"
desc = "The time between successive airborne waypoints, split into climbing, level and descending by whether the altitude rose or fell by more than 100 metres between them, and the time on the ground"
models = ["track"]
code = '''
phases = query("""SELECT CASE WHEN on_ground THEN 'on the ground' WHEN rise > 100 THEN 'climbing' WHEN rise < -100 THEN 'descending' ELSE 'level' END AS phase, sum(seconds) / 60 AS minutes
	FROM (SELECT on_ground, altitude - lag(altitude) OVER (ORDER BY time) AS rise, epoch(time) - epoch(lag(time) OVER (ORDER BY time)) AS seconds FROM track) WHERE seconds IS NOT NULL GROUP BY ALL ORDER BY minutes DESC""")
for (p, m) in zip(phases.phase, phases.minutes)
	println(rpad(p, 15), lpad(round(m; digits = 1), 8), " minutes")
end
'''

