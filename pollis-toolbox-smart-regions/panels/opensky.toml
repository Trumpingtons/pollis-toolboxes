# Air Traffic: the aircraft the receivers of the OpenSky Network see now over an area, the flights that arrived at and
# departed from an airport on a day, and the track of one aircraft, from the OpenSky REST API

[meta]
title = "Air Traffic"
viewType = "pollis.opensky"
defaultModel = "live"
decisionFirstColumn = "Tab"

[apiKey]
label = "OpenSky Network"
noun = "API client"

