[[faq]]
question = "Which tabs need an OpenSky account?"
answer = '''
Live Aircraft and the live track of Aircraft Track work without one, within the daily credits of anonymous users. Flights by Airport, and the track of a past flight, need an OpenSky API client, whose client id and secret are set with the key on the Powered by line. With the client set, every tab uses it, and draws on the larger credits of a registered user.
'''
wiki = "Authentication"

[[faq]]
question = "Why are yesterday's flights the latest?"
answer = '''
The OpenSky Network computes flights from the positions of the day by a batch process at night, so the arrivals and departures of an airport are available from the previous day back.
'''
wiki = "Flights by Airport"

[[faq]]
question = "What happens when the credits run out?"
answer = '''
The OpenSky API answers with HTTP 429 and the panel stops with a message that says when the credits of that kind of request refill. States, flights and tracks each have their own credits, so the other tabs still work.
'''
wiki = "Credits and Limits"

[[faq]]
question = "What is the country of an aircraft in Live Aircraft?"
answer = '''
The country the OpenSky Network infers from the ICAO 24-bit address of the transponder, the one to which the address belongs: it says nothing of the operator of the aircraft or of where the flight comes from or goes.
'''
wiki = "State Vectors"
hidden = true

[[faq]]
question = "Why does a flight have no airport of departure or arrival?"
answer = '''
OpenSky estimates the airports from the first and last positions it received, and leaves the field empty when it could not identify one, for instance when the aircraft entered or left the reach of its receivers in flight.
'''
wiki = "Flights by Airport"
hidden = true

[[faq]]
question = "Why are the waypoints of a track far apart?"
answer = '''
A track keeps only selected positions: one at least every 15 minutes in flight, and one whenever the aircraft turns by more than 2.5 degrees, climbs or descends by more than 100 metres, or lands or takes off. A gap much longer than 15 minutes means the receivers lost the aircraft.
'''
wiki = "Aircraft Tracks"
hidden = true

