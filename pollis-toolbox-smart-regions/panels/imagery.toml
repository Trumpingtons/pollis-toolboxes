[[codeBranches]]
model = "*"
code = '''
using Downloads  # the standard library that fetches from the services, in the Next Steps

folder = mkpath(expanduser(raw"{{folder}}"))  # where the Export steps write: Choose... picks another
center, zoom = ({{lon}}, {{lat}}), {{zoom}}  # the map opens on {{placeName}}: replace the centre with your own place
half = {{boxKm}} / 2  # km: half the side of the square around the place that the Next Steps measure and save
box = ({{lon}} - half / (111.32 * cosd({{lat}})), {{lat}} - half / 111.32, {{lon}} + half / (111.32 * cosd({{lat}})), {{lat}} + half / 111.32)  # west, south, east, north in degrees
headers = ["User-Agent" => "Pollis (https://pollis.org)"]  # how the Next Steps name themselves to the services
{{?model=sentinel2}} # Sentinel-2 cloudless: EOX IT Services' mosaic of a year's Sentinel-2 images with the clouds left out, in natural colour at 10 m
{{?model=sentinel2}} year = {{s2Year}}
{{?model=sentinel2}} mosaic = year == 2016 ? "s2cloudless_3857" : "s2cloudless-$(year)_3857"  # the layer of the year, in Web Mercator
{{?model=sentinel2}} url = "https://tiles.maps.eox.at/wmts/1.0.0/$(mosaic)/default/g/{z}/{y}/{x}.jpg"  # WMTS in its REST form: the row {y} comes before the column {x}
{{?model=sentinel2}} attribution = "EOxCloudless https://cloudless.eox.at by EOX IT Services GmbH (Contains modified Copernicus Sentinel data $(year))"  # as the service asks
{{?model=sentinel2}} shown = Pollis.tiles(url; name = "Sentinel-2 Cloudless $(year)", attribution = attribution, maxzoom = 17)  # tiles to zoom 17; the map enlarges them beyond
{{?model=corine}} # CORINE Land Cover: 44 classes of land cover in polygons of 25 ha or more, from the European Environment Agency (EEA)
{{?model=corine}} year = {{clcYear}}
{{?model=corine}} service = "https://image.discomap.eea.europa.eu/arcgis/rest/services/Corine/CLC$(year)_WM/MapServer"  # the EEA's ArcGIS map service of the year
{{?model=corine}} url = "$(service)/export?bbox={bbox-epsg-3857}&bboxSR=3857&imageSR=3857&size=256,256&format=png32&transparent=true&layers=show:0,1&f=image"  # each tile drawn by the service: the 100 m raster zoomed out, the polygons zoomed in
{{?model=corine}} legend = "https://image.discomap.eea.europa.eu/arcgis/services/Corine/CLC2018_WM/MapServer/WMSServer?request=GetLegendGraphic&version=1.3.0&format=image/png&layer=12"  # the 44 classes, in the same colours every year
{{?model=corine}} attribution = "CORINE Land Cover $(year), European Environment Agency, Copernicus Land Monitoring Service"
{{?model=corine}} shown = Pollis.tiles(url; name = "CORINE Land Cover $(year)", opacity = {{opacity}}, legend = legend, attribution = attribution)
{{?model=hrl}} # High-Resolution Layers of 2018: imperviousness, tree cover, grassland, and water and wetness at 10 m, from the EEA
{{?model=hrl}} product = "{{hrlLayer}}"
{{?model=hrl}} layer_names = Dict("ImperviousnessDensity" => "Imperviousness Density", "TreeCoverDensity" => "Tree Cover Density", "Grassland" => "Grassland", "WaterWetness" => "Water and Wetness")
{{?model=hrl}} wms = "https://image.discomap.eea.europa.eu/arcgis/services/GioLandPublic/HRL_$(product)_2018/ImageServer/WMSServer"  # the EEA's WMS of the layer
{{?model=hrl}} url = "$(wms)?SERVICE=WMS&VERSION=1.3.0&REQUEST=GetMap&LAYERS=0&STYLES=&CRS=EPSG:3857&BBOX={bbox-epsg-3857}&WIDTH=256&HEIGHT=256&FORMAT=image/png&TRANSPARENT=true"  # a GetMap request for each tile, its box in Web Mercator
{{?model=hrl}} legend = product in ("Grassland", "WaterWetness") ? "$(wms)?request=GetLegendGraphic&version=1.3.0&format=image/png&layer=0" : nothing  # the classes; the two densities run from 0 to 100 %
{{?model=hrl}} attribution = "$(layer_names[product]) 2018, European Environment Agency, Copernicus Land Monitoring Service"
{{?model=hrl}} shown = Pollis.tiles(url; name = layer_names[product] * (legend === nothing ? " 2018, 0 to 100 %" : " 2018"), opacity = {{opacity}}, legend = legend, attribution = attribution)
display(Pollis.webmap(shown; style = "{{style}}", center = center, zoom = zoom))  # the layer under the base map's labels, in the plot pane
'''

# Next Steps action groups
[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "three-zooms"
label = "Three Zoom Levels"
desc = "The layer three zoom levels out, at the zoom given, and three levels in: each level shows half the width of the one before"
code = '''
for z in (max(zoom - 3, 0), zoom, zoom + 3)
	display(Pollis.webmap(shown; style = "{{style}}", center = center, zoom = z, title = "{{placeName}}, zoom $(z)"))
end
'''

[[actionGroups.actions]]
id = "over-imagery"
label = "Over the Imagery"
desc = "The layer over the Sentinel-2 cloudless mosaic of 2018, so that the land cover can be checked against the ground"
models = ["corine", "hrl"]
code = '''
imagery = Pollis.tiles("https://tiles.maps.eox.at/wmts/1.0.0/s2cloudless-2018_3857/default/g/{z}/{y}/{x}.jpg"; name = "Sentinel-2 Cloudless 2018", maxzoom = 17,
	attribution = "EOxCloudless https://cloudless.eox.at by EOX IT Services GmbH (Contains modified Copernicus Sentinel data 2018)")
display(Pollis.webmap(imagery, shown; style = "{{style}}", center = center, zoom = zoom, title = "{{placeName}} over the Sentinel-2 mosaic of 2018"))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "tile-at-centre"
label = "Tile at the Centre"
desc = "Fetch the tile under the place at the zoom given, as the map does, and print the service's answer: status, type and size"
code = '''
n = 2^zoom  # tiles across the world at this zoom
col = floor(Int, ({{lon}} + 180) / 360 * n)
row = floor(Int, (1 - log(tand({{lat}}) + secd({{lat}})) / pi) / 2 * n)  # counted from the north-west corner of Web Mercator
side = 2 * pi * 6378137 / n  # metres a tile spans in Web Mercator
west, north = -pi * 6378137 + col * side, pi * 6378137 - row * side
address = replace(url, "{z}" => string(zoom), "{x}" => string(col), "{y}" => string(row),
	"{bbox-epsg-3857}" => join(round.((west, north - side, west + side, north), digits = 2), ","))
body = IOBuffer()
answer = Downloads.request(address; output = body, headers = headers, throw = false)
if answer isa Downloads.Response
	type = something(get(Dict(lowercase(k) => v for (k, v) in answer.headers), "content-type", nothing), "no type")
	bytes = take!(body)
	println("Tile ", zoom, "/", col, "/", row, ": HTTP ", answer.status, ", ", type, ", ", length(bytes), " bytes")
	occursin("xml", type) || occursin("json", type) || occursin("text", type) ? println(first(String(bytes), 400)) :
		length(bytes) < 1000 && println("A tile this small is usually empty: the layer has nothing there, or nothing at this zoom")
else
	println("No answer from the service: ", answer.message)
end
'''

[[actionGroups.actions]]
id = "service-description"
label = "Service Description"
desc = "What the service says of itself: the years of the mosaic, the scales at which each CORINE layer draws, or the pixel size and type of a High-Resolution Layer"
code = '''
{{?model=sentinel2}} capabilities = String(take!(Downloads.download("https://tiles.maps.eox.at/wmts/1.0.0/WMTSCapabilities.xml", IOBuffer(); headers = headers)))
{{?model=sentinel2}} layers = sort(unique([m[1] for m in eachmatch(r"<ows:Identifier>(s2cloudless[^<]*_3857)</ows:Identifier>", capabilities)]))
{{?model=sentinel2}} println("Mosaics in Web Mercator: ", join(layers, ", "))
{{?model=sentinel2}} before = capabilities[1:first(findfirst("<ows:Identifier>$(mosaic)</ows:Identifier>", capabilities))]  # a layer's abstract comes before its identifier
{{?model=sentinel2}} abstracts = collect(eachmatch(r"<ows:Abstract>([^<]*)</ows:Abstract>", before))
{{?model=sentinel2}} isempty(abstracts) || println("\n", mosaic, ": ", replace(last(abstracts)[1], r"&lt;.*?&gt;" => ""))
{{?model=corine}} using DuckDB, Tables
{{?model=corine}} description = Downloads.download("$(service)?f=json", tempname() * ".json"; headers = headers)
{{?model=hrl}} using DuckDB, Tables
{{?model=hrl}} description = Downloads.download(replace(wms, "/services/" => "/rest/services/", "/WMSServer" => "") * "?f=json", tempname() * ".json"; headers = headers)
{{?model!=sentinel2}} con = DBInterface.connect(DuckDB.DB)
{{?model=corine}} layers = Tables.columntable(DBInterface.execute(con, "SELECT l.id, l.name, l.minScale, l.maxScale FROM (SELECT unnest(layers) AS l FROM read_json('$(description)')) WHERE NOT contains(l.name, 'DOM') AND NOT contains(l.name, '_FR_')"))  # the layers of Europe, not those of the French overseas departments
{{?model=corine}} scale(s) = s == 0 ? "no limit" : "1:" * string(round(Int, s))
{{?model=corine}} println(rpad("layer", 7), rpad("name", 34), rpad("drawn from", 16), "to")
{{?model=corine}} for i in eachindex(layers.id)
{{?model=corine}} 	println(rpad(layers.id[i], 7), rpad(layers.name[i], 34), rpad(scale(layers.minScale[i]), 16), scale(layers.maxScale[i]))
{{?model=corine}} end
{{?model=corine}} println("Zoom 11 is about 1:270,000 at the equator, and larger scales further from it: the polygons draw from about zoom 11 in")
{{?model=hrl}} info = Tables.columntable(DBInterface.execute(con, "SELECT name, pixelType, pixelSizeX, pixelSizeY, spatialReference.latestWkid AS epsg, maxImageWidth, maxImageHeight, hasRasterAttributeTable FROM read_json('$(description)')"))
{{?model=hrl}} for k in keys(info)
{{?model=hrl}} 	println(rpad(string(k), 26), info[k][1])
{{?model=hrl}} end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "two-years"
label = "Two Years"
desc = "The year chosen and the first year of the series, or the last when the first is chosen, one after the other at the same place and zoom"
models = ["sentinel2", "corine"]
code = '''
{{?model=sentinel2}} other = year == 2016 ? 2025 : 2016
{{?model=sentinel2}} then = Pollis.tiles(replace(url, mosaic => other == 2016 ? "s2cloudless_3857" : "s2cloudless-$(other)_3857"); name = "Sentinel-2 Cloudless $(other)", maxzoom = 17,
{{?model=sentinel2}} 	attribution = replace(attribution, string(year) => string(other)))
{{?model=corine}} other = year == 2000 ? 2018 : 2000  # 2000 maps more countries than 1990
{{?model=corine}} then = Pollis.tiles(replace(url, "CLC$(year)" => "CLC$(other)"); name = "CORINE Land Cover $(other)", opacity = {{opacity}}, legend = legend,
{{?model=corine}} 	attribution = replace(attribution, string(year) => string(other)))
for (layer, y) in sort([(shown, year), (then, other)], by = last)
	display(Pollis.webmap(layer; style = "{{style}}", center = center, zoom = zoom, title = "{{placeName}}, $(y)"))
end
'''

[[actionGroups.actions]]
id = "changes"
label = "Changes 2012 to 2018"
desc = "The CORINE change polygons of 2012 to 2018 in the box, each coloured by its change of class, with the area of each change in hectares"
models = ["corine"]
code = '''
using DuckDB, Tables
con = DBInterface.connect(DuckDB.DB)
DBInterface.execute(con, "LOAD spatial")
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
labels_file = Downloads.download("https://image.discomap.eea.europa.eu/arcgis/rest/services/Corine/CLC2018_WM/MapServer/0?f=json", tempname() * ".json"; headers = headers)
DBInterface.execute(con, "CREATE OR REPLACE TABLE classes AS SELECT u.value AS code, u.label AS class FROM (SELECT unnest(drawingInfo.renderer.uniqueValueInfos) AS u FROM read_json('$(labels_file)'))")
changes_file = Downloads.download("https://image.discomap.eea.europa.eu/arcgis/rest/services/Corine/CHA2012_2018_WM/MapServer/0/query?geometry=$(join(box, ","))&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=Code_12,Code_18&outSR=4326&f=geojson",
	tempname() * ".geojson"; headers = headers)
found = occursin("\"Feature\"", read(changes_file, String))  # an empty collection has no columns to join on
found || println("No change of 5 ha or more between 2012 and 2018 in the box: make the box larger")
found && DBInterface.execute(con, """CREATE OR REPLACE TABLE changes AS
	SELECT c.class || ' to ' || d.class AS change, Code_12, Code_18,
		round(ST_Area(ST_Transform(ST_Intersection(geom, ST_MakeEnvelope($(join(box, ", ")))), 'EPSG:4326', 'EPSG:3035')) / 10000, 1) AS hectares,
		ST_Intersection(geom, ST_MakeEnvelope($(join(box, ", ")))) AS geom
	FROM ST_Read('$(changes_file)') JOIN classes c ON c.code = Code_12 JOIN classes d ON d.code = Code_18""")
if found
	summary = Tables.columntable(DBInterface.execute(con, "SELECT change, count(*) AS n, sum(hectares) AS hectares FROM changes GROUP BY change ORDER BY hectares DESC"))
	println("Changes of class from 2012 to 2018 in the box: hectares, polygons, change")
	for i in eachindex(summary.change)
		println(rpad(summary.hectares[i], 10), rpad(summary.n[i], 4), summary.change[i])
	end
	layer = joinpath(mktempdir(), "changes.geojson")
	DBInterface.execute(con, "COPY (SELECT change, hectares, geom FROM changes) TO '$(layer)' (FORMAT GDAL, DRIVER 'GeoJSON')")
	display(Pollis.webmap(Pollis.layer(layer; name = "Changes 2012 to 2018", column = "change", opacity = 0.8); style = "{{style}}", center = center, zoom = zoom))
end
'''

