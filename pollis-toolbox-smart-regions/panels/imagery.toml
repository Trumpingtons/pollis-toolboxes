[[actionGroups.actions]]
id = "pixel-size"
label = "Pixel Size and Zoom"
desc = "The ground a screen pixel covers at the place's latitude and zoom, beside the 10 m of a Sentinel-2 pixel, and the zoom at which the two match"
models = ["sentinel2"]
code = '''
metres_per_pixel = 2 * pi * 6378137 * cosd({{lat}}) / (512 * 2^zoom)  # MapLibre draws the world 512 pixels wide at zoom 0
matching = log2(2 * pi * 6378137 * cosd({{lat}}) / (512 * 10))
println("At latitude {{lat}} and zoom ", zoom, ": ", round(metres_per_pixel, sigdigits = 3), " metres a screen pixel")
println("A Sentinel-2 pixel is 10 m: one to one at zoom ", round(matching, digits = 1), "; beyond it the map enlarges the pixels")
'''

[[actionGroups.actions]]
id = "values-at-points"
label = "Values at Points"
desc = "The value of the layer at the place and at four points half the box side north, east, south and west of it, with the class name the service gives"
models = ["corine", "hrl"]
code = '''
using DuckDB, Tables
con = DBInterface.connect(DuckDB.DB)
step_lon, step_lat = half / (111.32 * cosd({{lat}})), half / 111.32
points = [("centre", {{lon}}, {{lat}}), ("north", {{lon}}, {{lat}} + step_lat), ("east", {{lon}} + step_lon, {{lat}}),
	("south", {{lon}}, {{lat}} - step_lat), ("west", {{lon}} - step_lon, {{lat}})]
{{?model=corine}} labels_file = Downloads.download("$(service)/0?f=json", tempname() * ".json"; headers = headers)
{{?model=corine}} classes = Tables.columntable(DBInterface.execute(con, "SELECT u.value AS value, u.label AS class FROM (SELECT unnest(drawingInfo.renderer.uniqueValueInfos) AS u FROM read_json('$(labels_file)'))"))
{{?model=hrl}} rest = replace(wms, "/services/" => "/rest/services/", "/WMSServer" => "")
{{?model=hrl}} table_file = Downloads.download("$(rest)/rasterAttributeTable?f=json", tempname() * ".json"; headers = headers)
{{?model=hrl}} rat = Tables.columntable(DBInterface.execute(con, "SELECT unnest(features, recursive := true) FROM read_json('$(table_file)')"))
{{?model=hrl}} name_column = first(k for k in keys(rat) if occursin(r"(?i)^class_?name$", string(k)))  # its name differs from layer to layer
{{?model=hrl}} classes = (value = string.(rat.Value), class = string.(getproperty(rat, name_column)))
lookup = Dict(zip(classes.value, classes.class))
{{?model=hrl}} product == "Grassland" && (lookup["0"] = "Not grassland")  # the service's table names only the grassland class
println(rpad("point", 9), rpad("longitude", 11), rpad("latitude", 10), "value")
for (name, x, y) in points
{{?model=corine}} 	text = String(take!(Downloads.download("$(service)/0/query?geometry=$(x),$(y)&geometryType=esriGeometryPoint&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=*&returnGeometry=false&f=json", IOBuffer(); headers = headers)))
{{?model=corine}} 	m = match(r"\"[Cc]ode_\d\d\"\s*:\s*\"(\d+)\"", text)  # the code column is Code_18, Code_12, code_00 and so on
{{?model=hrl}} 	geometry = "%7B%22x%22:$(x),%22y%22:$(y),%22spatialReference%22:%7B%22wkid%22:4326%7D%7D"
{{?model=hrl}} 	text = String(take!(Downloads.download("$(rest)/identify?geometry=$(geometry)&geometryType=esriGeometryPoint&returnGeometry=false&returnCatalogItems=false&f=json", IOBuffer(); headers = headers)))
{{?model=hrl}} 	m = match(r"\"value\"\s*:\s*\"([^\"]*)\"", text)
	value = m === nothing ? "none: outside the area mapped" : get(lookup, m[1], m[1])
	println(rpad(name, 9), rpad(round(x, digits = 4), 11), rpad(round(y, digits = 4), 10), value)
end
'''

[[actionGroups.actions]]
id = "land-cover-shares"
label = "Land Cover Shares"
desc = "The CORINE polygons in the box, cut to it, with the area and share of each class, measured in the equal-area projection EPSG:3035, and on a map"
models = ["corine"]
code = '''
using DuckDB, Tables
con = DBInterface.connect(DuckDB.DB)
DBInterface.execute(con, "LOAD spatial")
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
labels_file = Downloads.download("$(service)/0?f=json", tempname() * ".json"; headers = headers)
DBInterface.execute(con, "CREATE OR REPLACE TABLE classes AS SELECT u.value AS code, u.label AS class FROM (SELECT unnest(drawingInfo.renderer.uniqueValueInfos) AS u FROM read_json('$(labels_file)'))")
polygons_file = Downloads.download("$(service)/0/query?geometry=$(join(box, ","))&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=*&outSR=4326&f=geojson",
	tempname() * ".geojson"; headers = headers)
occursin("exceededTransferLimit\":true", read(polygons_file, String)) && println("The service capped the polygons it sent: make the box smaller")
code_column = first(c for c in Tables.columntable(DBInterface.execute(con, "DESCRIBE SELECT * FROM ST_Read('$(polygons_file)')")).column_name if occursin(r"(?i)^code_\d\d$", c))
DBInterface.execute(con, """CREATE OR REPLACE TABLE cover AS
	SELECT class, ST_Intersection(geom, ST_MakeEnvelope($(join(box, ", ")))) AS geom
	FROM ST_Read('$(polygons_file)') JOIN classes ON code = "$(code_column)" """)
shares = Tables.columntable(DBInterface.execute(con, """
	SELECT class, round(sum(ST_Area(ST_Transform(geom, 'EPSG:4326', 'EPSG:3035'))) / 10000, 1) AS hectares
	FROM cover GROUP BY class ORDER BY hectares DESC"""))
total = sum(shares.hectares)
println("CORINE Land Cover ", year, " in the ", {{boxKm}}, " km box around {{placeName}}: ", round(total, digits = 1), " ha")
for i in eachindex(shares.class)
	println(rpad(round(100 * shares.hectares[i] / total, digits = 1), 7), rpad(shares.hectares[i], 10), shares.class[i])
end
layer = joinpath(mktempdir(), "cover.geojson")
DBInterface.execute(con, "COPY (SELECT class, geom FROM cover) TO '$(layer)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(layer; name = "CORINE Land Cover $(year)", column = "class", opacity = {{opacity}}); style = "{{style}}"))
'''

[[actionGroups.actions]]
id = "box-summary"
label = "Summary of the Box"
desc = "The 10 m values of the layer in the box, fetched from the service in EPSG:3035: the mean density and the share of pixels above 0, or the share of each class"
models = ["hrl"]
code = '''
import ArchGDAL
using DuckDB, Tables
rest = replace(wms, "/services/" => "/rest/services/", "/WMSServer" => "")
side = round(Int, {{boxKm}} * 100)  # pixels of 10 m along a side of the box
values_file = Downloads.download("$(rest)/exportImage?bbox=$(join(box, ","))&bboxSR=4326&imageSR=3035&size=$(side),$(side)&format=tiff&f=image", tempname() * ".tif"; headers = headers)
pixels = ArchGDAL.read(values_file) do dataset
	vec(ArchGDAL.read(dataset, 1))
end
mapped = filter(v -> v <= 253, pixels)  # 254 is unclassifiable, 255 outside the area mapped
println(layer_names[product], " 2018 in the ", {{boxKm}}, " km box around {{placeName}}: ", length(mapped), " of ", length(pixels), " pixels mapped")
if product in ("ImperviousnessDensity", "TreeCoverDensity")
	println("Mean density ", round(sum(Int.(mapped)) / max(length(mapped), 1), digits = 1), " %; pixels above 0: ", round(100 * count(>(0), mapped) / max(length(mapped), 1), digits = 1), " %; at 80 % or more: ", round(100 * count(>=(80), mapped) / max(length(mapped), 1), digits = 1), " %")
else
	table_file = Downloads.download("$(rest)/rasterAttributeTable?f=json", tempname() * ".json"; headers = headers)
	rat = Tables.columntable(DBInterface.execute(DBInterface.connect(DuckDB.DB), "SELECT unnest(features, recursive := true) FROM read_json('$(table_file)')"))
	name_column = first(k for k in keys(rat) if occursin(r"(?i)^class_?name$", string(k)))  # its name differs from layer to layer
	lookup = Dict(Int(v) => string(c) for (v, c) in zip(rat.Value, getproperty(rat, name_column)))
	product == "Grassland" && (lookup[0] = "Not grassland")  # the service's table names only the grassland class
	for v in sort(unique(mapped))
		println(rpad(round(100 * count(==(v), mapped) / length(mapped), digits = 1), 7), "% ", get(lookup, Int(v), string(v)))
	end
end
'''

