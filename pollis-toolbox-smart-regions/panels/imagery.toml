[[actionGroups.actions]]
id = "save-geotiff"
label = "Save as GeoTIFF"
desc = "Write the mosaic of the box, in longitude and latitude at about 10 m, to a GeoTIFF in the folder above, through GDAL's WMS driver"
models = ["sentinel2"]
code = '''
import ArchGDAL
ArchGDAL.setconfigoption("GDAL_HTTP_USERAGENT", "Pollis (https://pollis.org)")
out = joinpath(folder, "sentinel2-cloudless-$(year).tif")
source = "WMS:https://tiles.maps.eox.at/wms?SERVICE=WMS&VERSION=1.1.1&REQUEST=GetMap&LAYERS=$(replace(mosaic, "_3857" => ""))&SRS=EPSG:4326&BBOX=-180,-90,180,90&FORMAT=image/jpeg"
side = round(Int, {{boxKm}} * 100)  # pixels along a side of the box: about 10 m each
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	ArchGDAL.read(source) do wms
		ArchGDAL.gdaltranslate(wms, ["-of", "GTiff", "-projwin", string.([box[1], box[4], box[3], box[2]])..., "-outsize", string(side), string(side), "-co", "COMPRESS=DEFLATE"]; dest = out) do saved
			println("Wrote ", out, ": ", ArchGDAL.width(saved), " by ", ArchGDAL.height(saved), " pixels, ", ArchGDAL.nraster(saved), " bands")
		end
	end
end
'''

[[actionGroups.actions]]
id = "save-polygons"
label = "Save the Polygons"
desc = "Write the CORINE polygons in the box, cut to it, with their code and class, to a GeoPackage in the folder above"
models = ["corine"]
code = '''
using DuckDB, Tables
con = DBInterface.connect(DuckDB.DB)
DBInterface.execute(con, "LOAD spatial")
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude, as GDAL writes them
labels_file = Downloads.download("$(service)/0?f=json", tempname() * ".json"; headers = headers)
DBInterface.execute(con, "CREATE OR REPLACE TABLE classes AS SELECT u.value AS code, u.label AS class FROM (SELECT unnest(drawingInfo.renderer.uniqueValueInfos) AS u FROM read_json('$(labels_file)'))")
polygons_file = Downloads.download("$(service)/0/query?geometry=$(join(box, ","))&geometryType=esriGeometryEnvelope&inSR=4326&spatialRel=esriSpatialRelIntersects&outFields=*&outSR=4326&f=geojson",
	tempname() * ".geojson"; headers = headers)
code_column = first(c for c in Tables.columntable(DBInterface.execute(con, "DESCRIBE SELECT * FROM ST_Read('$(polygons_file)')")).column_name if occursin(r"(?i)^code_\d\d$", c))
out = joinpath(folder, "corine-$(year).gpkg")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, """COPY (SELECT code, class, ST_Intersection(geom, ST_MakeEnvelope($(join(box, ", ")))) AS geom
		FROM ST_Read('$(polygons_file)') JOIN classes ON code = "$(code_column)") TO '$(out)' (FORMAT GDAL, DRIVER 'GPKG', SRS 'EPSG:4326')""")
	println("Wrote ", out, ": ", only(Tables.columntable(DBInterface.execute(con, "SELECT count(*) AS n FROM ST_Read('$(out)')")).n), " polygons")
end
'''

