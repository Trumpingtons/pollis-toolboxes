[[faq]]
question = "Do I need an account or an API key to show these layers?"
answer = '''
No. The Sentinel-2 cloudless mosaics come from EOX IT Services' public tile service, and CORINE Land Cover and the High-Resolution Layers from the European Environment Agency's map services, which all answer without registration or a key.

Each map shows the attribution the service asks for at its bottom right.
'''
wiki = "Overview"

[[faq]]
question = "Why is the CORINE layer blank where I look?"
answer = '''
CORINE Land Cover covers the member and cooperating countries of the European Environment Agency, and the early years cover fewer of them: 1990 leaves out several countries that 2000 and later years map. Outside the area mapped in the year chosen the service draws nothing.

Tile at the Centre fetches the tile under the place and prints its size: a transparent tile of a few hundred bytes has nothing in it.
'''
wiki = "CORINE Land Cover"

[[faq]]
question = "Which year should I choose for the Sentinel-2 mosaic?"
answer = '''
Each year from 2016 has its own mosaic, made from the images of that year. The latest year shows the place as it is now; an earlier year shows what was built, cleared or flooded since.

Two Years shows the year chosen beside the first or the last, at the same place and zoom.
'''
wiki = "Sentinel-2 Mosaic"

[[faq]]
question = "What do the values of the High-Resolution Layers mean?"
answer = '''
Imperviousness Density gives the share of each 10 m pixel sealed by buildings, roads and other artificial surfaces, and Tree Cover Density the share covered by tree crowns, both from 0 to 100 %. Grassland marks grassland pixels. Water and Wetness has four classes: permanent water, temporary water, permanent wetness and temporary wetness.

Values at Points reads the value of the layer at the place and around it, with the class name the service gives.
'''
wiki = "High-Resolution Layers"

[[faq]]
question = "Can I measure areas on these maps?"
answer = '''
Not on the screen: web maps use Web Mercator, which enlarges areas away from the equator. Land Cover Shares downloads the CORINE polygons in the box, cuts them to it and measures their areas in EPSG:3035, the equal-area projection of Europe.

Summary of the Box does the same for the 10 m pixels of a High-Resolution Layer.
'''
wiki = "Decision Guide"
hidden = true

[[faq]]
question = "Why does the CORINE map change when I zoom in?"
answer = '''
The European Environment Agency's map service draws the 100 m raster when the map is zoomed out and the polygons when it is zoomed in past a scale of about 1:250,000, near zoom 11. The classes and colours are the same in both.

Service Description prints the scales at which each layer of the service draws.
'''
wiki = "Map Services"
hidden = true

[[faq]]
question = "How do I get the data itself, rather than a picture of it?"
answer = '''
The tiles are pictures that the service draws. Save the Polygons writes the CORINE polygons of the box to a GeoPackage, and Save the Values writes the 10 m values of a High-Resolution Layer to a GeoTIFF in EPSG:3035, which the Geospatial Raster Files panel reads.

Save as GeoTIFF writes the Sentinel-2 mosaic of the box as a colour picture with its coordinates.
'''
wiki = "Decision Guide"
hidden = true

[[faq]]
question = "What is the smallest area CORINE Land Cover maps?"
answer = '''
The status layers map areas of 25 hectares or more, and linear elements, such as rivers and roads, at least 100 metres wide. The change layers map changes of 5 hectares or more.

A smaller park, field or building group is part of the polygon around it, under that polygon's class.
'''
wiki = "CORINE Nomenclature"
hidden = true

