[[faq]]
question = "Why are some cells of my raster missing?"
answer = '''
A raster marks the cells without a measurement with a no-data value, such as -9999 or -32768, recorded in the file. Rasters.jl reads those cells as missing, so sums and means skip them with skipmissing.

When the file records no no-data value, the sentinel comes back as a number and spoils every statistic. Missing Cells and Range shows the no-data value the file records, how many cells are missing and the smallest and largest values: a minimum far below the rest is a sentinel the file does not declare.
'''
wiki = "Diagnostics"

[[faq]]
question = "Should I read a large GeoTIFF lazily?"
answer = '''
Raster(path; lazy = true) opens the file and reads only its header; cells are read when an operation needs them, block by block. A crop or a window then reads only the blocks it covers, which matters when the file is larger than memory or sits on a web server.

read(r) loads the whole band into memory, which is faster for repeated operations on a raster that fits. The Example Code of the GeoTIFF tab opens the file lazily, takes one band, then reads it.
'''
wiki = "Decision Guide"

[[faq]]
question = "What makes a GeoTIFF cloud-optimised?"
answer = '''
A Cloud-Optimised GeoTIFF is a GeoTIFF whose cells are stored in tiles, with reduced-resolution overviews, and whose header comes first in the file. A reader can then fetch the header, then only the tiles of the area and resolution it needs, with HTTP range requests, without downloading the whole file.

GDAL writes one with its COG driver: Save as Cloud-Optimised GeoTIFF does that.
'''
wiki = "Cloud-Optimised GeoTIFF"
hidden = true

[[faq]]
question = "What does the geotransform of a raster say?"
answer = '''
The geotransform is six numbers that place the grid on the map: the x coordinate of the upper left corner, the cell width, a rotation term, the y coordinate of the upper left corner, a second rotation term, and the cell height, negative when rows run from north to south.

The x coordinate of the left edge of column c (counted from 0) of a north-up raster is the first number plus c times the cell width. File Metadata prints the geotransform.
'''
wiki = "Coordinates and Georeferencing"
hidden = true

