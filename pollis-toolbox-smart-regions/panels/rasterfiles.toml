[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. A file given by an absolute path is read where it is."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[inputs]]
id = "tiffFile"
label = "File"
tooltip = "The GeoTIFF file (.tif or .tiff), in the folder above, or an absolute path. With the default, london-dem.tif, the example first reads the Copernicus DEM GLO-30 over west and central London, about 30 m cells, from its Cloud-Optimised GeoTIFF on AWS, unless the folder has a london-dem.tif already."
default = "london-dem.tif"
models = ["geotiff"]

[[inputs]]
id = "band"
label = "Band"
tooltip = "The band to read, from 1: an elevation model has one, a satellite image one per spectral band. File Metadata lists them."
default = "1"
models = ["geotiff"]

[[codeBranches]]
model = "geotiff"
code = '''
using Rasters, ArchGDAL, Statistics

folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files
path = joinpath(folder, "{{tiffFile}}")  # an absolute path is kept as it is
{{?tiffFile=london-dem.tif}}# Example file: the Copernicus DEM GLO-30, the global surface model of the Copernicus programme in cells of about 30 m, buildings and trees included, over west and central London, read from the Cloud-Optimised GeoTIFF of its tile on AWS and written to london-dem.tif unless the folder has one already. Replace "london-dem.tif" with your own GeoTIFF.
{{?tiffFile=london-dem.tif}}isfile(path) || write(path, read(Raster("/vsicurl/https://copernicus-dem-30m.s3.amazonaws.com/Copernicus_DSM_COG_10_N51_00_W001_00_DEM/Copernicus_DSM_COG_10_N51_00_W001_00_DEM.tif"; lazy = true)[X(-0.6 .. 0.0), Y(51.3 .. 51.7)]); driver = "COG", options = Dict("COMPRESS" => "DEFLATE"))  # only the cells of the window are read

r = Raster(path; lazy = true)  # the file opened: its cells are read only when used
hasdim(r, Band) && (r = r[Band({{band}})])  # one band of a multiband file
grid = read(r)  # the band in memory, missing where the file has no data
file_crs, transform, nodata = ArchGDAL.read(ds -> (ArchGDAL.getproj(ds), ArchGDAL.getgeotransform(ds), ArchGDAL.getnodatavalue(ArchGDAL.getband(ds, {{band}}))), path)  # the coordinate system as WKT, the geotransform and the no-data value
fill_value = convert(nonmissingtype(eltype(grid)), something(nodata, -9999))  # the value written for missing cells: the file's no-data value
println(size(grid, X), " x ", size(grid, Y), " cells of ", transform[2], " by ", abs(transform[6]), ", ", count(ismissing, grid), " missing; values from ", minimum(skipmissing(grid)), " to ", maximum(skipmissing(grid)))
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "plot-raster"
label = "Plot the Raster"
desc = "The band as a heat map drawn with ECharts, north up, at most 200 cells a side (larger rasters averaged over blocks of cells)"
models = ["geotiff"]
code = '''
using ECharts

f = max(1, cld(max(size(grid, X), size(grid, Y)), 200))  # at most 200 cells a side
small = permutedims(f > 1 ? Rasters.aggregate(mean, grid, f; skipmissingval = true) : grid, (X, Y))
north_first = first(lookup(small, Y)) > last(lookup(small, Y))
nx, ny = size(small)
cells = [[i - 1, (north_first ? ny - j : j - 1), round(Float64(small[i, j]), digits = 2)] for i in 1:nx, j in 1:ny if !ismissing(small[i, j])]  # column, row from the south, value
lo, hi = extrema(skipmissing(small))
ylabels = string.(round.(Int, north_first ? reverse(lookup(small, Y)) : lookup(small, Y)))
fig = EChart(ec_width = 760, ec_height = round(Int, 60 + 680 * ny / nx), title = [ECharts.Title(text = basename(path))], tooltip = ECharts.Tooltip(),
	xAxis = [ECharts.Axis(_type = "category", data = string.(round.(Int, lookup(small, X))), name = "x")],
	yAxis = [ECharts.Axis(_type = "category", data = ylabels, name = "y")],
	visualMap = ECharts.VisualMap(min = lo, max = hi, calculable = true, orient = "vertical", right = "1%", top = "middle", inRange = Dict("color" => ["#313695", "#74add1", "#ffffbf", "#f46d43", "#a50026"])),
	series = [ECharts.HeatmapSeries(name = "Value", data = cells)])
'''

[[actionGroups.actions]]
id = "raster-histogram"
label = "Histogram of Values"
desc = "How the values of the cells are spread, in 40 bins, missing cells left out"
models = ["geotiff"]
code = '''
using ECharts

v = Float64.(collect(skipmissing(grid)))
lo, hi = extrema(v)
width = (hi - lo) / 40
counts = zeros(Int, 40)
for value in v
	counts[clamp(floor(Int, (value - lo) / width) + 1, 1, 40)] += 1
end
mids = [round(lo + (k - 0.5) * width, digits = 2) for k in 1:40]
EChart(ec_width = 700, ec_height = 400, title = [ECharts.Title(text = "Values of $(length(v)) cells")],
	xAxis = [ECharts.Axis(_type = "value", name = "Value", scale = true)], yAxis = [ECharts.Axis(_type = "value", name = "Cells")],
	series = [ECharts.XYSeries(name = "Cells", _type = "bar", data = [[m, c] for (m, c) in zip(mids, counts)])])
'''

[[actionGroups.actions]]
id = "raster-map"
label = "Show on a Map"
desc = "The cells, coloured by value, on an OpenStreetMap base map in Pollis's map view, at most 80 cells a side (larger rasters averaged over blocks of cells); click a cell for its value"
models = ["geotiff"]
code = '''
using DuckDB

f = max(1, cld(max(size(grid, X), size(grid, Y)), 80))  # at most 80 cells a side
small = permutedims(f > 1 ? Rasters.aggregate(mean, grid, f; skipmissingval = true) : grid, (X, Y))
edges(d) = [lo == hi ? (lo - abs(step(lookup(small, d))) / 2, hi + abs(step(lookup(small, d))) / 2) : (min(lo, hi), max(lo, hi)) for (lo, hi) in Rasters.intervalbounds(small, d)]  # each cell's two edges, also for a raster of points
xe, ye = edges(X), edges(Y)
rows = ["($(round(Float64(small[i, j]), digits = 3)), $(xe[i][1]), $(ye[j][1]), $(xe[i][2]), $(ye[j][2]))" for i in axes(small, 1), j in axes(small, 2) if !ismissing(small[i, j])]
con = DBInterface.connect(DuckDB.DB)
DBInterface.execute(con, "LOAD spatial")
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
shown = joinpath(mktempdir(), "cells.geojson")
DBInterface.execute(con, "COPY (SELECT value, ST_Transform(ST_MakeEnvelope(x0, y0, x1, y1), '$(file_crs)', 'EPSG:4326') AS geom FROM (VALUES $(join(rows, ", "))) t(value, x0, y0, x1, y1)) TO '$(shown)' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(shown; name = basename(path), column = "value", opacity = 0.7)))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "file-metadata"
label = "File Metadata"
desc = "What GDAL finds in the file: driver, size, bands and their data types and no-data values, tiling, compression, overviews, geotransform and coordinate system"
models = ["geotiff"]
code = '''
ArchGDAL.read(path) do ds
	println("Driver: ", ArchGDAL.shortname(ArchGDAL.getdriver(ds)), "; ", ArchGDAL.width(ds), " x ", ArchGDAL.height(ds), " cells, ", ArchGDAL.nraster(ds), " band(s)")
	println("Geotransform: ", ArchGDAL.getgeotransform(ds))
	m = match(r"^\w+\[\"([^\"]+)\"", ArchGDAL.getproj(ds))
	println("Coordinate system: ", m === nothing ? "none recorded" : m[1])
	println("Structure: ", join(ArchGDAL.metadata(ds; domain = "IMAGE_STRUCTURE"), ", "))
	for b in 1:ArchGDAL.nraster(ds)
		band = ArchGDAL.getband(ds, b)
		println("Band ", b, ": ", ArchGDAL.pixeltype(band), ", no-data value ", something(ArchGDAL.getnodatavalue(band), "none"), ", blocks of ", join(ArchGDAL.blocksize(band), " x "), ", ", ArchGDAL.noverview(band), " overview(s)")
	end
end
'''

[[actionGroups.actions]]
id = "missing-range"
label = "Missing Cells and Range"
desc = "The no-data value the file records, how many cells are missing, and the smallest and largest values with the next ones, where an undeclared sentinel shows"
models = ["geotiff"]
code = '''
v = sort(Float64.(collect(skipmissing(grid))))
println("No-data value recorded: ", something(nodata, "none"))
println("Missing cells: ", count(ismissing, grid), " of ", length(grid), " (", round(100 * count(ismissing, grid) / length(grid), digits = 2), "%)")
println("Smallest values: ", join(round.(v[1:min(5, end)], digits = 3), ", "))
println("Largest values: ", join(round.(v[max(1, end - 4):end], digits = 3), ", "))
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "compression"
label = "Compression Side by Side"
desc = "The band written as a GeoTIFF without compression, with LZW, DEFLATE and ZSTD, and as a Cloud-Optimised GeoTIFF: size on disk and time to read it back"
models = ["geotiff"]
code = '''
dir = mktempdir()
ways = [
	"GeoTIFF, no compression" => ("GTiff", Dict("COMPRESS" => "NONE")),
	"GeoTIFF, LZW" => ("GTiff", Dict("COMPRESS" => "LZW", "PREDICTOR" => "2")),
	"GeoTIFF, DEFLATE" => ("GTiff", Dict("COMPRESS" => "DEFLATE", "PREDICTOR" => "2")),
	"GeoTIFF, ZSTD" => ("GTiff", Dict("COMPRESS" => "ZSTD", "PREDICTOR" => "2")),
	"Cloud-Optimised, DEFLATE" => ("COG", Dict("COMPRESS" => "DEFLATE")),
]
println(rpad("written as", 28), rpad("bytes", 12), "read (ms)")
for (k, (name, (driver, options))) in enumerate(ways)
	out = joinpath(dir, "band$(k).tif")
	try
		write(out, grid; driver = driver, options = options, missingval = fill_value)
		read(Raster(out))  # the first read compiles
		println(rpad(name, 28), rpad(filesize(out), 12), round(1000 * @elapsed(read(Raster(out))), digits = 2))
	catch err
		println(rpad(name, 28), "not written: ", first(sprint(showerror, err), 120))
	end
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "value-summary"
label = "Value Summary"
desc = "The mean, standard deviation and quantiles of the values of the cells, and the area they cover"
models = ["geotiff"]
code = '''
v = Float64.(collect(skipmissing(grid)))
q = quantile(v, [0.0, 0.05, 0.25, 0.5, 0.75, 0.95, 1.0])
println("Cells with a value: ", length(v), ", covering ", round(length(v) * transform[2] * abs(transform[6]), digits = 1), " square units")
println("Mean ", round(mean(v), digits = 3), ", standard deviation ", round(std(v), digits = 3))
println("Quantiles 0, 5, 25, 50, 75, 95, 100%: ", join(round.(q, digits = 3), ", "))
'''

[[actionGroups.actions]]
id = "values-at-points"
label = "Values at Points"
desc = "The value of the cell nearest each of five points: replace them with your own coordinates, in the raster's coordinate system"
models = ["geotiff"]
code = '''
xlo, xhi = extrema(lookup(grid, X))
ylo, yhi = extrema(lookup(grid, Y))
places = [(xlo + (xhi - xlo) * a, ylo + (yhi - ylo) * b) for (a, b) in ((0.5, 0.5), (0.25, 0.25), (0.75, 0.25), (0.25, 0.75), (0.75, 0.75))]  # the centre and four points around it
for (x, y) in places
	println("x = ", round(x, digits = 4), ", y = ", round(y, digits = 4), ": ", coalesce(grid[X(Near(x)), Y(Near(y))], "missing"))  # the cell whose centre is nearest, for cells as areas or as points
end
'''

[[actionGroups]]
id = "export"
label = "Export"

[[actionGroups.actions]]
id = "save-cog"
label = "Save as Cloud-Optimised GeoTIFF"
desc = "Write the band to a Cloud-Optimised GeoTIFF next to the file read, tiled, with overviews and DEFLATE compression"
models = ["geotiff"]
code = '''
out = first(splitext(path)) * "-cog.tif"
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	write(out, grid; driver = "COG", options = Dict("COMPRESS" => "DEFLATE"), missingval = fill_value)  # missing cells written as the file's no-data value
	println("Wrote ", out)
end
'''

[[actionGroups.actions]]
id = "save-wgs84"
label = "Reproject to Longitude and Latitude"
desc = "Warp the band to longitude and latitude on WGS 84 (EPSG:4326), as web maps and global datasets use, and write it next to the file read"
models = ["geotiff"]
code = '''
out = first(splitext(path)) * "-wgs84.tif"
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	warped = resample(grid; crs = EPSG(4326))  # GDAL's warp, nearest neighbour by default
	write(out, warped; missingval = fill_value)
	println("Wrote ", out, ": ", size(warped, X), " x ", size(warped, Y), " cells")
end
'''

