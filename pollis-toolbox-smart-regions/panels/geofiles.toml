[[actionGroups.actions]]
id = "preview-features"
label = "Preview Features"
desc = "The first 10 features as an aligned text table: five attributes at most, and the geometry as text"
code = '''
n = min(10, length(first(tbl)))
shown = length(tbl) > 6 ? [collect(keys(tbl))[1:5]; :wkt] : collect(keys(tbl))  # five attributes at most, and the geometry
cell(x) = first(string(coalesce(x, "")), 22)
println(join(rpad.(cell.(shown), 24)))
for i in 1:n
	println(join(rpad.([cell(getproperty(tbl, c)[i]) for c in shown], 24)))
end
'''

[[actionGroups.actions]]
id = "plot-features"
label = "Plot the Features"
desc = "Every geometry drawn in its coordinates: points as markers, lines as paths, polygons as filled shapes"
code = '''
using Plots, GeoInterfaceRecipes, WellKnownGeometry, GeoFormatTypes

wkb = Tables.columntable(DBInterface.execute(con, "SELECT ST_AsWKB(geom) AS wkb FROM features WHERE geom IS NOT NULL")).wkb
geoms = [GeoFormatTypes.WellKnownBinary(GeoFormatTypes.Geom(), collect(w)) for w in wkb]  # WKB, which GeoInterface reads
centre = Tables.columntable(DBInterface.execute(con, "SELECT avg(ST_Y(ST_Centroid(geom))) AS y, max(abs(ST_XMax(geom))) <= 180 AND max(abs(ST_YMax(geom))) <= 90 AS geographic FROM features"))
geographic = coalesce(centre.geographic[1], false)  # longitude and latitude, or metres
fig = plot(; legend = false, xlabel = geographic ? "Longitude" : "x", ylabel = geographic ? "Latitude" : "y",
	aspect_ratio = geographic ? 1 / cosd(centre.y[1]) : 1)  # a degree of longitude is shorter than one of latitude away from the equator
foreach(g -> plot!(fig, g), geoms)
fig
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "layers-crs"
label = "Layers and Coordinate System"
desc = "What GDAL finds in the file: its driver, each layer with its feature count, geometry type and coordinate system, and its fields"
models = ["geojson", "gpkg", "shapefile", "kml", "gpx"]
code = '''
meta = Tables.columntable(DBInterface.execute(con, "SELECT driver_short_name, layers FROM ST_Read_Meta('$(source)')"))
println("Driver: ", meta.driver_short_name[1])
for layer in meta.layers[1]
	for field in layer.geometry_fields
		crs = field.crs === missing ? "no coordinate system recorded" : string(coalesce(field.crs.auth_name, "?"), ":", coalesce(field.crs.auth_code, "?"), " (", field.crs.name, ")")
		println(rpad(layer.name, 18), rpad(string(layer.feature_count, " features"), 16), rpad(field.type, 18), crs)
	end
	println("    fields: ", join([string(f.name, " ", f.type) for f in layer.fields], ", "))
end
'''

[[actionGroups.actions]]
id = "file-metadata"
label = "File Metadata"
desc = "GeoParquet: the geo metadata, with the geometry column, its encoding and coordinate system. FlatGeobuf: its layer, feature count, geometry type and coordinate system"
models = ["geoparquet"]
code = '''
{{?format=geoparquet}} geo = Tables.columntable(DBInterface.execute(con, "SELECT decode(value) AS geo FROM parquet_kv_metadata('$(source)') WHERE decode(key) = 'geo'"))
{{?format=geoparquet}} println(isempty(geo.geo) ? "No geo metadata: a Parquet file, but not a GeoParquet one" : first(geo.geo[1], 1500))
{{?format=flatgeobuf}} meta = Tables.columntable(DBInterface.execute(con, "SELECT driver_short_name, layers FROM ST_Read_Meta('$(source)')"))
{{?format=flatgeobuf}} for layer in meta.layers[1], field in layer.geometry_fields
{{?format=flatgeobuf}} 	crs = field.crs === missing ? "no coordinate system recorded" : string(coalesce(field.crs.auth_name, "?"), ":", coalesce(field.crs.auth_code, "?"), " (", field.crs.name, ")")
{{?format=flatgeobuf}} 	println(rpad(layer.name, 18), rpad(string(layer.feature_count, " features"), 16), rpad(field.type, 18), crs)
{{?format=flatgeobuf}} end
'''

[[actionGroups.actions]]
id = "geometry-check"
label = "Geometry Check"
desc = "The geometry types, and how many geometries are missing, empty or invalid (a ring that crosses itself, say)"
code = '''
check = Tables.columntable(DBInterface.execute(con, """
SELECT coalesce(ST_GeometryType(geom)::VARCHAR, 'missing') AS type, count(*) AS n,
	count(*) FILTER (WHERE ST_IsEmpty(geom)) AS empty,
	count(*) FILTER (WHERE NOT ST_IsValid(geom)) AS invalid
FROM features GROUP BY ALL ORDER BY n DESC
"""))
println(rpad("geometry type", 22), rpad("features", 10), rpad("empty", 8), "invalid")
for i in eachindex(check.type)
	println(rpad(check.type[i], 22), rpad(check.n[i], 10), rpad(check.empty[i], 8), check.invalid[i])
end
sum(check.invalid) > 0 && println("ST_MakeValid(geom) repairs invalid geometries: UPDATE features SET geom = ST_MakeValid(geom) WHERE NOT ST_IsValid(geom)")
'''

