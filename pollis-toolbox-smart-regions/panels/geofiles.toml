[[actionGroups.actions]]
id = "save-geojson"
label = "Save as GeoJSON"
desc = "Write the features to a .geojson file next to the file read, moved into longitude and latitude on WGS 84 as GeoJSON requires"
models = ["gpkg", "shapefile", "geoparquet", "kml", "gpx"]
code = '''
out = first(splitext(path)) * ".geojson"
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "COPY (SELECT * EXCLUDE (geom), ST_Transform(geom, '{{fileCrs}}', 'EPSG:4326') AS geom FROM features) TO '$(out)' (FORMAT GDAL, DRIVER 'GeoJSON')")
	println("Wrote ", out)
end
'''
