label = "Projected Coordinate System"
tooltip = "The system areas and lengths are measured in, in metres. EPSG:3035 (ETRS89 / LAEA Europe) keeps areas exact across Europe; EPSG:3763 (ETRS89 / Portugal TM06) suits Portugal; a UTM zone (e.g. EPSG:32629) suits a region of a few hundred kilometres."
default = "EPSG:3035"

[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables
{{?model=gpx}}{{?gpxFile=walk.gpx}} using Dates, Random

con = DBInterface.connect(DuckDB.DB)  # an in-memory database: the file stays where it is
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files: Choose... picks another
{{?model=geojson}} path = joinpath(folder, "{{geojsonFile}}")  # an absolute path is kept as it is
{{?model=gpkg}} path = joinpath(folder, "{{gpkgFile}}")  # an absolute path is kept as it is
{{?model=shapefile}} path = joinpath(folder, "{{shapefileFile}}")  # its .shx, .dbf and .prj files are beside it
{{?model=geoparquet}}{{?format=geoparquet}} path = joinpath(folder, "{{geoparquetFile}}")  # an absolute path is kept as it is
{{?model=geoparquet}}{{?format=flatgeobuf}} path = joinpath(folder, "{{fgbFile}}")  # an absolute path is kept as it is
{{?model=kml}} path = joinpath(folder, "{{kmlFile}}")  # an absolute path is kept as it is
{{?model=gpx}} path = joinpath(folder, "{{gpxFile}}")  # an absolute path is kept as it is
{{?model=geojson}}{{?geojsonFile=places.geojson}} # Example file: six Portuguese cities, as points at their approximate centres in longitude and latitude (WGS 84), written to places.geojson unless the folder has one already. Replace "places.geojson" with your own file.
{{?model=shapefile}}{{?shapefileFile=places.shp}} # Example file: six Portuguese cities, as points at their approximate centres in longitude and latitude (WGS 84), written to places.shp unless the folder has one already. Replace "places.shp" with your own file.
{{?model=geoparquet}}{{?format=geoparquet}}{{?geoparquetFile=places.parquet}} # Example file: six Portuguese cities, as points at their approximate centres in longitude and latitude (WGS 84), written to places.parquet unless the folder has one already. Replace "places.parquet" with your own file.
{{?model=geoparquet}}{{?format=flatgeobuf}}{{?fgbFile=places.fgb}} # Example file: six Portuguese cities, as points at their approximate centres in longitude and latitude (WGS 84), written to places.fgb unless the folder has one already. Replace "places.fgb" with your own file.
{{?model=kml}}{{?kmlFile=places.kml}} # Example file: six Portuguese cities, as points at their approximate centres in longitude and latitude (WGS 84), written to places.kml unless the folder has one already. Replace "places.kml" with your own file.
{{?model=gpkg}}{{?gpkgFile=areas.gpkg}} # Example file: the areas within 20 km of six Portuguese cities, as polygons in longitude and latitude (WGS 84), in the layer areas of areas.gpkg, written unless the folder has an areas.gpkg already. Replace "areas.gpkg" with your own file.
{{?model!=gpx}} cities = "SELECT name, ST_Point(lon, lat) AS geom FROM (VALUES ('Lisboa', -9.1393, 38.7223), ('Porto', -8.6291, 41.1579), ('Braga', -8.4265, 41.5454), ('Coimbra', -8.4103, 40.2033), ('Aveiro', -8.6538, 40.6405), ('Faro', -7.9304, 37.0194)) t(name, lon, lat)"
{{?model=geojson}}{{?geojsonFile=places.geojson}} isfile(path) || DBInterface.execute(con, "COPY ($cities) TO '$(path)' (FORMAT GDAL, DRIVER 'GeoJSON')")
{{?model=shapefile}}{{?shapefileFile=places.shp}} isfile(path) || DBInterface.execute(con, "COPY ($cities) TO '$(path)' (FORMAT GDAL, DRIVER 'ESRI Shapefile', SRS 'EPSG:4326')")
{{?model=geoparquet}}{{?format=geoparquet}}{{?geoparquetFile=places.parquet}} isfile(path) || DBInterface.execute(con, "COPY ($cities) TO '$(path)' (FORMAT parquet)")
{{?model=geoparquet}}{{?format=flatgeobuf}}{{?fgbFile=places.fgb}} isfile(path) || DBInterface.execute(con, "COPY ($cities) TO '$(path)' (FORMAT GDAL, DRIVER 'FlatGeobuf', SRS 'EPSG:4326')")
{{?model=kml}}{{?kmlFile=places.kml}} isfile(path) || DBInterface.execute(con, "COPY ($cities) TO '$(path)' (FORMAT GDAL, DRIVER 'KML')")
{{?model=gpkg}}{{?gpkgFile=areas.gpkg}} areas = "SELECT name, ST_Transform(ST_Buffer(ST_Transform(geom, 'EPSG:4326', 'EPSG:3035'), 20000), 'EPSG:3035', 'EPSG:4326') AS geom FROM ($cities)"  # 20 km measured in metres on ETRS89 / LAEA Europe
{{?model=gpkg}}{{?gpkgFile=areas.gpkg}} isfile(path) || DBInterface.execute(con, "COPY ($areas) TO '$(path)' (FORMAT GDAL, DRIVER 'GPKG', LAYER_NAME 'areas', SRS 'EPSG:4326')")
{{?model=gpx}}{{?gpxFile=walk.gpx}} # Example file: a walk of 40 minutes in Lisbon, simulated from a fixed seed, one track point a minute with its time and elevation, written to walk.gpx unless the folder has one already. Replace "walk.gpx" with your own file.
{{?model=gpx}}{{?gpxFile=walk.gpx}} if !isfile(path)
{{?model=gpx}}{{?gpxFile=walk.gpx}} 	rng = Xoshiro(42)  # fixed seed: the same walk on every run
{{?model=gpx}}{{?gpxFile=walk.gpx}} 	start = DateTime(2026, 5, 1, 9, 0)
{{?model=gpx}}{{?gpxFile=walk.gpx}} 	points = [(lat = 38.7076 + 0.00016 * i + 0.00004 * randn(rng), lon = -9.1365 + 0.00009 * i + 0.00004 * randn(rng), ele = 5 + 1.8 * i + randn(rng), time = start + Minute(i)) for i in 0:40]
{{?model=gpx}}{{?gpxFile=walk.gpx}} 	trkpts = ["<trkpt lat=\"$(round(p.lat, digits = 6))\" lon=\"$(round(p.lon, digits = 6))\"><ele>$(round(p.ele, digits = 1))</ele><time>$(p.time)Z</time></trkpt>" for p in points]
{{?model=gpx}}{{?gpxFile=walk.gpx}} 	write(path, join(["<?xml version=\"1.0\" encoding=\"UTF-8\"?>", "<gpx version=\"1.1\" creator=\"Pollis\" xmlns=\"http://www.topografix.com/GPX/1/1\">", "<trk><name>Walk in Lisbon</name><trkseg>", trkpts..., "</trkseg></trk></gpx>"], "\n"))
{{?model=gpx}}{{?gpxFile=walk.gpx}} end

{{?model=kml}} source = endswith(lowercase(path), ".kmz") ? "/vsizip/$(path)/doc.kml" : path  # a KMZ is a zipped KML: GDAL reads the doc.kml inside it
{{?model!=kml}} source = path
{{?model=geojson}} reader = "ST_Read('$(source)')"
{{?model=gpkg}} reader = "ST_Read('$(source)', layer = '{{gpkgLayer}}')"
{{?model=shapefile}} reader = "ST_Read('$(source)')"
{{?model=geoparquet}}{{?format=geoparquet}} reader = "(SELECT * EXCLUDE ({{geomColumn}}), {{geomColumn}} AS geom FROM read_parquet('$(source)'))"  # the geometry column, named geom
{{?model=geoparquet}}{{?format=flatgeobuf}} reader = "ST_Read('$(source)')"
{{?model=kml}} reader = "ST_Read('$(source)')"
{{?model=gpx}} reader = "ST_Read('$(source)', layer = '{{gpxLayer}}')"
DBInterface.execute(con, "CREATE OR REPLACE TABLE features AS SELECT * FROM $reader WHERE {{filter}}")  # the features, with their geometry column geom, for SQL
tbl = Tables.columntable(DBInterface.execute(con, "SELECT * EXCLUDE (geom), ST_AsText(geom) AS wkt FROM features"))  # attributes, and each geometry as text
println(length(first(tbl)), " features x ", length(tbl), " columns: ", join(keys(tbl), ", "))
'''

