[[faq]]
question = "Why are the areas of my features tiny numbers below one?"
answer = '''
On longitude and latitude, `ST_Area` and `ST_Length` give square degrees and degrees, which have no fixed size on the ground: a degree of longitude shrinks towards the poles.

Extent and Measures first transforms the features to the Projected Coordinate System input, in metres, so areas come out in square kilometres and lengths in kilometres. EPSG:3035 keeps areas exact across Europe; a UTM zone or a national system suits a smaller region. The File Coordinate System input must say what the file is in.
'''
wiki = "Coordinate Reference Systems"

[[faq]]
question = "My Shapefile shows no coordinate system: what should I give?"
answer = '''
A Shapefile keeps its coordinate system in a separate .prj file beside the .shp. When Layers and Coordinate System shows no coordinate system recorded, the .prj is missing, and the system is unknown.

Ask whoever published the file which system it is in, and give its EPSG code in the File Coordinate System input, so Extent and Measures and Save as GeoJSON transform it rightly. Saving the features as GeoPackage or GeoParquet keeps the system inside the file from then on.
'''
wiki = "Diagnostics"

[[faq]]
question = "Should I keep my data as GeoJSON, GeoPackage or GeoParquet?"
answer = '''
For analysis of many features, GeoParquet: compressed columns, read only as a query needs them, with the coordinate system in its metadata.

For data that is edited feature by feature, or several layers sent together, GeoPackage, an SQLite database that is updated in place.

For sharing a few thousand features with web maps, GeoJSON, which every web mapping library reads. File Formats Side by Side shows the size and read time of each for your features.
'''
wiki = "Decision Guide"

[[faq]]
question = "Which layer of a GPX file should I read?"
answer = '''
GDAL reads a GPX file as five layers. track_points gives every recorded point with its time and elevation, one row each, for speeds and profiles. tracks gives each recorded track as a line, one line per segment. waypoints gives the single points of interest. routes and route_points give planned routes, as lines or as their points.

The Layer input of the GPX tab picks one.
'''
wiki = "GPX"

[[faq]]
question = "Why does ST_Transform put my points in the wrong place?"
answer = '''
The definition of EPSG:4326 puts latitude first, while GeoJSON, KML, GeoParquet and most software put longitude first. PROJ follows each system's own axis order, so a transformation from EPSG:4326 can read the coordinates the wrong way round.

The setting geometry_always_xy of DuckDB's spatial extension, set to true, makes ST_Transform always take x as longitude and y as latitude. The Example Code sets it at the start.
'''
wiki = "Coordinate Reference Systems"
hidden = true

[[faq]]
question = "How do I read a KMZ file?"
answer = '''
A KMZ file is a zipped KML, with the images and icons it refers to. Its main file, at the root of the archive, is by convention doc.kml.

GDAL reads a file inside a zip archive through its virtual file system, with a path such as /vsizip/places.kmz/doc.kml, which the KML and KMZ tab builds when the File input ends in .kmz.
'''
wiki = "KML and KMZ"
hidden = true

[[faq]]
question = "How do I repair invalid geometries?"
answer = '''
A geometry is invalid when it breaks the rules of Simple Features, such as a polygon whose boundary crosses itself. Areas, intersections and unions of invalid geometries can be wrong without any error.

Geometry Check counts them by type. ST_IsValid tests a geometry, and ST_MakeValid repairs it, for instance by splitting a self-crossing polygon into a multipolygon: UPDATE features SET geom = ST_MakeValid(geom) WHERE NOT ST_IsValid(geom).
'''
wiki = "Diagnostics"
hidden = true

[[faq]]
question = "What is in the geo metadata of a GeoParquet file?"
answer = '''
The geo metadata is a JSON object with the specification's version, the primary_column holding the main geometry, and an entry for each geometry column: its encoding, the geometry types found, and optionally its crs as PROJJSON, its bbox, the orientation of rings and whether edges are planar or spherical.

A column without crs is in OGC:CRS84, longitude and latitude on WGS 84. File Metadata prints the object.
'''
wiki = "GeoParquet and FlatGeobuf"
hidden = true

[[faq]]
question = "Which polygon ring order do Shapefile and GeoJSON use?"
answer = '''
In a Shapefile, the vertices of an outer ring run clockwise and those of a hole counterclockwise. GeoJSON recommends the opposite, the right-hand rule: exterior rings counterclockwise and holes clockwise, though readers are told not to reject files that do otherwise.

GDAL turns rings into polygons by their order and nesting when it reads a Shapefile, so ST_Read returns Simple Features geometries either way.
'''
wiki = "Shapefile"
hidden = true

[[faq]]
question = "Why does a FlatGeobuf file read only part of the features quickly?"
answer = '''
A FlatGeobuf file can start with a spatial index, a packed Hilbert R-tree of the features' boxes, before the features themselves. A reader uses it to fetch only the features in an area, also from a web server through HTTP range requests, without reading the rest.

FlatGeobuf is meant for large amounts of static data: it does not support random writes, so a changed file is written anew.
'''
wiki = "GeoParquet and FlatGeobuf"
hidden = true

