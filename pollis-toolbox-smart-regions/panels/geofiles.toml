label = "Compare"

[[actionGroups.actions]]
id = "formats-side-by-side"
label = "File Formats Side by Side"
desc = "The same features written as GeoJSON, GeoPackage, Shapefile, FlatGeobuf, KML and GeoParquet: size on disk and time for DuckDB to read each"
code = '''
dir = mktempdir()
formats = [
	"GeoJSON" => ("features.geojson", "FORMAT GDAL, DRIVER 'GeoJSON'"),
	"GeoPackage" => ("features.gpkg", "FORMAT GDAL, DRIVER 'GPKG'"),
	"Shapefile" => ("features.shp", "FORMAT GDAL, DRIVER 'ESRI Shapefile'"),
	"FlatGeobuf" => ("features.fgb", "FORMAT GDAL, DRIVER 'FlatGeobuf'"),
	"KML" => ("features.kml", "FORMAT GDAL, DRIVER 'KML'"),
	"GeoParquet" => ("features.parquet", "FORMAT parquet"),
]
println(rpad("format", 12), rpad("bytes", 12), "read (ms)")
for (name, (file, options)) in formats
	out = joinpath(dir, file)
	try
		DBInterface.execute(con, "COPY (SELECT COLUMNS(lambda c: lower(c) NOT IN ('ogc_fid', 'fid')) FROM features) TO '$(out)' ($options)")  # GDAL's own feature ids left out: a GeoPackage makes its own
		bytes = sum(filesize(joinpath(dir, f)) for f in readdir(dir) if f == file || (endswith(file, ".shp") && first(splitext(f)) == "features" && last(splitext(f)) in (".shx", ".dbf", ".prj", ".cpg")))  # a shapefile's .shx, .dbf, .prj and .cpg too
		from = endswith(file, ".parquet") ? "read_parquet('$(out)')" : "ST_Read('$(out)')"
		read_all() = DBInterface.execute(con, "SELECT count(*) FROM $from")
		read_all()  # the first read compiles
		println(rpad(name, 12), rpad(bytes, 12), round(1000 * @elapsed(read_all()), digits = 2))
	catch err
		println(rpad(name, 12), "cannot hold these features: ", first(sprint(showerror, err), 120))
	end
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "extent-measures"
label = "Extent and Measures"
desc = "The bounding box of the features, and their total area, perimeter and length measured in the projected coordinate system"
code = '''
m = Tables.columntable(DBInterface.execute(con, """
WITH projected AS (SELECT ST_Transform(geom, '{{fileCrs}}', '{{projectedCrs}}') AS g FROM features WHERE geom IS NOT NULL)
SELECT (SELECT min(ST_XMin(geom)) FROM features) AS xmin, (SELECT max(ST_XMax(geom)) FROM features) AS xmax,
	(SELECT min(ST_YMin(geom)) FROM features) AS ymin, (SELECT max(ST_YMax(geom)) FROM features) AS ymax,
	sum(ST_Area(g)) / 1e6 AS area_km2, sum(ST_Perimeter(g)) / 1e3 AS perimeter_km, sum(ST_Length(g)) / 1e3 AS length_km
FROM projected
"""))
println("Bounding box ({{fileCrs}}): x from ", m.xmin[1], " to ", m.xmax[1], ", y from ", m.ymin[1], " to ", m.ymax[1])
println("Measured on {{projectedCrs}}: area ", round(m.area_km2[1], digits = 2), " km2, polygon perimeters ", round(m.perimeter_km[1], digits = 2), " km, line lengths ", round(m.length_km[1], digits = 3), " km")
'''

[[actionGroups.actions]]
id = "column-summary"
label = "Column Summary"
desc = "DuckDB's SUMMARIZE of the attribute columns: type, minimum, maximum, distinct values and share missing"
code = '''
s = Tables.columntable(DBInterface.execute(con, "SUMMARIZE (SELECT * EXCLUDE (geom) FROM features)"))
println(rpad("column", 20), rpad("type", 16), rpad("min", 22), rpad("max", 22), rpad("distinct", 10), "missing %")
for i in eachindex(s.column_name)
	println(rpad(s.column_name[i], 20), rpad(s.column_type[i], 16), rpad(first(coalesce(s.min[i], ""), 20), 22), rpad(first(coalesce(s.max[i], ""), 20), 22), rpad(s.approx_unique[i], 10), s.null_percentage[i])
end
'''

