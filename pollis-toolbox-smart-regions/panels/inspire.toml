[[faq]]
question = "Where is the INSPIRE Geoportal?"
answer = '''
The European Commission decommissioned the INSPIRE Geoportal by 1 July 2026: the European Data Portal, data.europa.eu, is the European entry point for geospatial datasets, and the existing metadata and catalogue services are integrated into it through GeoDCAT-AP. The countries' own download services go on serving the data.

The Find Datasets tab searches data.europa.eu; the other three tabs read the services it lists.
'''
wiki = "Overview"

[[faq]]
question = "Which tab should I read a dataset with?"
answer = '''
The one of the service the dataset offers. WFS Download asks a Web Feature Service for one layer, page by page; Atom Download downloads a ready-made file from an INSPIRE Atom feed; OGC API Features reads a collection of a web API, page by page. When a dataset offers several, a WFS or an OGC API sends GeoJSON that DuckDB reads directly, and an Atom feed one file to download at once.
'''
wiki = "Decision Guide"

[[faq]]
question = "Why does the panel ask the WFS for GeoJSON?"
answer = '''
INSPIRE services encode their features by default in GML, which may hold curves, multi-surfaces or two properties with the same name that DuckDB's spatial extension cannot read. When the service lists a JSON output format for GetFeature, WFS Download asks for it, and DuckDB reads the GeoJSON as it reads any file; otherwise it reads the GML.
'''
wiki = "Web Feature Service"

[[faq]]
question = "Why are the features downloaded only once?"
answer = '''
Each download goes to the Folder: the features of a WFS layer or of an OGC API collection as one GeoParquet file, the file of an Atom feed as it is, with a .zip unpacked beside it. The tab reads them from there afterwards; delete the file to download the features again, after the service's data have changed.
'''
wiki = "Factsheet"

[[faq]]
question = "What is an INSPIRE Atom feed?"
answer = '''
A pre-defined dataset download service as an Atom feed: a top feed for the service with an entry for each dataset, and a feed for each dataset with an entry for each file, in one part or several, in a coordinate reference system and a format. Atom Download follows the links from the top feed to the files.
'''
wiki = "Atom Download Feeds"
hidden = true

[[faq]]
question = "Which country code does Find Datasets take?"
answer = '''
The two-letter code of the country in data.europa.eu, as its country facet writes it, in lower or upper case: NL for the Netherlands, BE for Belgium, GR for Greece. Beside GISCO's Units turns GR into EL, the code Eurostat uses for Greece.
'''
wiki = "Searching data.europa.eu"
hidden = true

[[faq]]
question = "What is an administrative unit in INSPIRE?"
answer = '''
A unit of administration where a member state has and/or exercises jurisdictional rights, for local, regional and national governance, in the words of Regulation (EU) No 1089/2010. The units of a country form a hierarchy of levels, from the country itself down to the municipalities.
'''
wiki = "Administrative and Statistical Units"
hidden = true

[[faq]]
question = "Why does a WFS send no features, or only some?"
answer = '''
A service may refuse a page larger than its own limit, take longer than the download allows, or need a layer name with its namespace prefix. WFS Download lists the layers of the service when the one given is not among them; a smaller Page Size asks for fewer features at a time.
'''
wiki = "Diagnostics"
hidden = true

