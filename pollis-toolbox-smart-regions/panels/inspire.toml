code = '''
dir = mktempdir()
function by_country(label, formats)  # the number of datasets of each country, from the country facet of one search
	p = joinpath(dir, "$(label).json")
	facet = isempty(formats) ? "" : "&facets={\"format\":[$(join(["\"$(f)\"" for f in formats], ","))]}"
	Downloads.download("$(api)?q=$(words)&filter=dataset&limit=0$(facet)", p)
	DBInterface.execute(con, "CREATE OR REPLACE TABLE \"$(label)\" AS SELECT i->>'/id' AS country, CAST(i->>'/count' AS BIGINT) AS n FROM (SELECT unnest(CAST(f->'/items' AS JSON[])) AS i FROM (SELECT unnest(CAST(json_extract(content, '/result/facets') AS JSON[])) AS f FROM read_text('$(p)')) WHERE f->>'/id' = 'country')")
end
by_country("all", String[]); by_country("wfs", ["WFS_SRVC"]); by_country("atom", ["ATOM"]); by_country("ogc", ["OGCFEAT", "ogcapi-features"])
c = query("SELECT upper(a.country) AS country, a.n AS datasets, coalesce(w.n, 0) AS wfs, coalesce(t.n, 0) AS atom, coalesce(o.n, 0) AS ogc FROM \"all\" a LEFT JOIN wfs w USING (country) LEFT JOIN atom t USING (country) LEFT JOIN ogc o USING (country) ORDER BY datasets DESC")
println("Datasets of data.europa.eu matching ", theme, " and inspire, by country, and those with a service of each kind (by the format data.europa.eu gives the service)")
println(rpad("country", 9), rpad("datasets", 10), rpad("WFS", 8), rpad("Atom", 8), "OGC API")
for i in eachindex(c.country)
	println(rpad(c.country[i], 9), rpad(c.datasets[i], 10), rpad(c.wfs[i], 8), rpad(c.atom[i], 8), c.ogc[i])
end
'''

