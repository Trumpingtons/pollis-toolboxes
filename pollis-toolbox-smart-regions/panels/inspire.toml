[[codeBranches]]
model = "find"
code = '''
using DuckDB, Tables, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
query(sql) = Tables.columntable(DBInterface.execute(con, sql))
folder = mkpath(expanduser(raw"{{folder}}"))  # where the Next Steps save their files
theme, country = "{{theme}}", lowercase("{{country}}")
total = inspire_search(con, theme, country; rows = {{rows}})  # the most relevant first, as the tables datasets and, for their download services, services
s = query("SELECT d.n, d.title, d.catalogue, s.kind, s.address FROM datasets d JOIN services s USING (n) ORDER BY d.n, s.kind, s.address")
println(total, " datasets of data.europa.eu match ", theme, " and inspire in ", uppercase(country), "; of the first ", min(total, {{rows}}), ", ", length(unique(s.n)), " have a download service.")
println("Read a WFS with WFS Download, an Atom feed with Atom Download, an OGC API with OGC API Features, and a file with the Geospatial Vector Files panel.")
for (i, k) in enumerate(s.n)
	(i == 1 || s.n[i - 1] != k) && println(k, ". ", s.title[i], " (", s.catalogue[i], ")")
	println("   ", rpad(s.kind[i], 18), s.address[i])
end
'''

[[codeBranches]]
model = "wfs"
code = '''
using DuckDB, Tables, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
query(sql) = Tables.columntable(DBInterface.execute(con, sql))
folder = mkpath(expanduser(raw"{{folder}}"))  # where the features are kept once downloaded, and the Next Steps save theirs
layer, service = "{{wfsLayer}}", "{{wfsUrl}}"
w = wfs_features(con, service, layer; folder, page = {{pageSize}})  # a page at a time, kept in the folder as GeoParquet, then read from there, as the table features
name, by, title, source, stem, n = "{{wfsName}}", "{{wfsColour}}", layer, service, w.stem, w.n
columns = query("DESCRIBE features").column_name
for c in (name, by)
	c in columns || error("The features have no column $(c): their columns are $(join(columns, ", "))")
end
println(n, " features of ", layer, " (", w.format, "), read from ", w.file)
'''

[[codeBranches]]
model = "atom"
code = '''
using DuckDB, Tables, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
query(sql) = Tables.columntable(DBInterface.execute(con, sql))
folder = mkpath(expanduser(raw"{{folder}}"))  # where the file is kept once downloaded, and the Next Steps save theirs
a = atom_features(con, "{{atomUrl}}", "{{atomFile}}"; layer = "{{atomLayer}}", folder)  # the first file of the feed that matches and DuckDB reads, unpacked from a .zip, as the table features
println("Files of the feed:")
foreach(f -> println("  ", f.href, ismissing(f.megabytes) ? "" : " ($(f.megabytes) MB)"), first(a.files, 20))
name, by, title, source, stem, n = "{{atomName}}", "{{atomColour}}", isempty("{{atomLayer}}") ? basename(a.path) : "{{atomLayer}}", a.href, a.stem, a.n
columns = query("DESCRIBE features").column_name
for c in (name, by)
	c in columns || error("The features have no column $(c): their columns are $(join(columns, ", "))")
end
println(n, " features of ", title, ", read from ", a.path)
'''

[[codeBranches]]
model = "ogcapi"
code = '''
using DuckDB, Tables, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
query(sql) = Tables.columntable(DBInterface.execute(con, sql))
folder = mkpath(expanduser(raw"{{folder}}"))  # where the features are kept once downloaded, and the Next Steps save theirs
collection, landing = "{{ogcCollection}}", "{{ogcUrl}}"
o = ogc_features(con, landing, collection; folder, page = {{pageSize}})  # page after page, kept in the folder as GeoParquet, then read from there, as the table features
name, by, title, source, stem, n = "{{ogcName}}", "{{ogcColour}}", collection, landing, o.stem, o.n
columns = query("DESCRIBE features").column_name
for c in (name, by)
	c in columns || error("The features have no column $(c): their columns are $(join(columns, ", "))")
end
println(n, " features of ", collection, ", read from ", o.file)
'''

# Next Steps action groups
[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "show-on-map"
label = "Show on a Map"
desc = "The units on an OpenStreetMap base map in Pollis's map view, coloured by the Colour By column; click a unit for its name and area"
models = ["wfs", "atom", "ogcapi"]
code = '''
dir = mktempdir()
colour = name == by ? "" : ", \"$(by)\""
DBInterface.execute(con, "COPY (SELECT \"$(name)\" AS name, round(km2, 1) AS km2$(colour), geom FROM features) TO '$(joinpath(dir, "units.geojson"))' (FORMAT GDAL, DRIVER 'GeoJSON')")
display(Pollis.webmap(Pollis.layer(joinpath(dir, "units.geojson"); name = title, column = name == by ? "name" : by, opacity = 0.7)))
println("Data: ", source)
'''

[[actionGroups.actions]]
id = "areas-chart"
label = "Largest Units by Area"
desc = "The 25 largest units read, in km², as a bar chart drawn with ECharts"
models = ["wfs", "atom", "ogcapi"]
code = '''
using ECharts

d = query("SELECT coalesce(CAST(\"$(name)\" AS VARCHAR), '') AS name, round(km2, 1) AS km2 FROM features ORDER BY km2 DESC LIMIT 25")
EChart(ec_width = 700, ec_height = 400, title = [ECharts.Title(text = "Largest units of $(title), km²")],
	xAxis = [ECharts.Axis(_type = "category", data = collect(d.name), axisLabel = ECharts.AxisLabel(rotate = 45))], yAxis = [ECharts.Axis(_type = "value", name = "km²")],
	series = [ECharts.XYSeries(name = "km²", _type = "bar", data = collect(d.km2))])
'''

[[actionGroups.actions]]
id = "services-chart"
label = "Services of the Datasets"
desc = "How many of the datasets listed offer each kind of download service, as a bar chart drawn with ECharts"
models = ["find"]
code = '''
using ECharts

d = query("SELECT kind, count(DISTINCT n) AS datasets FROM services GROUP BY ALL ORDER BY datasets DESC")
EChart(ec_width = 600, ec_height = 350, title = [ECharts.Title(text = "Download services of the first {{rows}} datasets of $(theme), $(uppercase(country))")],
	xAxis = [ECharts.Axis(_type = "category", data = collect(d.kind))], yAxis = [ECharts.Axis(_type = "value", name = "datasets")],
	series = [ECharts.XYSeries(name = "datasets", _type = "bar", data = collect(d.datasets))])
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "download-contents"
label = "Download and Columns"
desc = "Where the features came from, their columns and coordinate extent, and the values of the Colour By column"
models = ["wfs", "atom", "ogcapi"]
code = '''
println("From ", source, "; ", n, " features of ", title)
d = query("DESCRIBE features")
println("Columns: ", join(["$(d.column_name[i]) ($(d.column_type[i]))" for i in eachindex(d.column_name) if d.column_name[i] != "geom"], ", "))
box = query("SELECT ST_XMin(ST_Extent_Agg(geom)) AS w, ST_XMax(ST_Extent_Agg(geom)) AS e, ST_YMin(ST_Extent_Agg(geom)) AS s, ST_YMax(ST_Extent_Agg(geom)) AS n FROM features")
println("Extent: longitude ", round(box.w[1], digits = 3), " to ", round(box.e[1], digits = 3), ", latitude ", round(box.s[1], digits = 3), " to ", round(box.n[1], digits = 3))
v = query("SELECT coalesce(CAST(\"$(by)\" AS VARCHAR), 'none') AS value, count(*) AS units FROM features GROUP BY ALL ORDER BY units DESC LIMIT 15")
println(by, ": ", join(["$(v.value[i]) ($(v.units[i]))" for i in eachindex(v.value)], ", "))
'''

[[actionGroups.actions]]
id = "geometry-check"
label = "Geometry Check"
desc = "Invalid and empty geometries, units in several parts, the vertices of the boundaries, and the smallest units"
models = ["wfs", "atom", "ogcapi"]
code = '''
g = query("SELECT count(*) FILTER (WHERE NOT ST_IsValid(geom)) AS invalid, count(*) FILTER (WHERE ST_IsEmpty(geom)) AS empty, count(*) FILTER (WHERE ST_NumGeometries(geom) > 1) AS multipart, sum(ST_NPoints(geom)) AS vertices, median(ST_NPoints(geom)) AS median_vertices, string_agg(DISTINCT ST_GeometryType(geom), ', ') AS types FROM features")
println("Geometry types: ", g.types[1], "; invalid: ", g.invalid[1], "; empty: ", g.empty[1], "; units in several parts (islands, enclaves): ", g.multipart[1])
println("Vertices: ", g.vertices[1], " in all, median ", g.median_vertices[1], " per unit")
s = query("SELECT coalesce(CAST(\"$(name)\" AS VARCHAR), '') AS name, km2 FROM features ORDER BY km2 LIMIT 5")
println("Smallest units: ", join(["$(s.name[i]) $(round(s.km2[i], digits = 3)) km²" for i in eachindex(s.name)], "; "))
'''

[[actionGroups.actions]]
id = "catalogues"
label = "Catalogues and Duplicates"
desc = "The catalogues the datasets listed come from, and the titles listed more than once, a dataset that two catalogues pass on to data.europa.eu"
models = ["find"]
code = '''
c = query("SELECT catalogue, count(*) AS datasets FROM datasets GROUP BY ALL ORDER BY datasets DESC")
println("Catalogues: ", join(["$(c.catalogue[i]) ($(c.datasets[i]))" for i in eachindex(c.catalogue)], ", "))
d = query("SELECT title, string_agg(catalogue, ', ' ORDER BY catalogue) AS catalogues, string_agg(CAST(n AS VARCHAR), ', ' ORDER BY n) AS numbers FROM datasets GROUP BY title HAVING count(*) > 1 ORDER BY min(n)")
println("Titles listed more than once: ", length(d.title))
for i in eachindex(d.title)
	println("  ", d.title[i], ": numbers ", d.numbers[i], ", from ", d.catalogues[i])
end
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "beside-gisco"
label = "Beside GISCO's Units"
desc = "The units of the most frequent value of Colour By, the level with the most units, beside GISCO's local administrative units of 2024 for the Country: their numbers, total areas, and the units of the same name whose areas differ most (GISCO's file, about 78 MB, is downloaded once)"
models = ["wfs", "atom", "ogcapi"]
code = '''
lau = gisco_file("lau", "LAU_RG_01M_2024_4326"; folder)  # GISCO's local administrative units of 2024, the file the Eurostat GISCO panel keeps
code = replace(uppercase("{{country}}"), "GR" => "EL")  # Eurostat writes EL for Greece
DBInterface.execute(con, "CREATE OR REPLACE TABLE gisco AS SELECT LAU_NAME AS name, ST_Area_Spheroid(geom) / 1e6 AS km2 FROM $(vector_units(con, lau)) WHERE CNTR_CODE = '$(code)'")
level = only(query("SELECT \"$(by)\" AS v FROM features GROUP BY ALL ORDER BY count(*) DESC LIMIT 1").v)
DBInterface.execute(con, "CREATE OR REPLACE TABLE national AS SELECT CAST(\"$(name)\" AS VARCHAR) AS name, km2 FROM features WHERE \"$(by)\" = '$(level)'")
t = query("SELECT (SELECT count(*) FROM national) AS units, (SELECT round(sum(km2)) FROM national) AS km2, (SELECT count(*) FROM gisco) AS lau, (SELECT round(sum(km2)) FROM gisco) AS lau_km2, (SELECT count(*) FROM national a JOIN gisco b ON lower(a.name) = lower(b.name)) AS same")
println(title, ", ", by, " = ", level, ": ", t.units[1], " units, ", t.km2[1], " km²; GISCO's LAU 2024 of ", code, ": ", t.lau[1], " units, ", t.lau_km2[1], " km²; ", t.same[1], " names in both")
d = query("SELECT a.name, round(a.km2, 1) AS here, round(b.km2, 1) AS gisco, round(100 * (a.km2 / b.km2 - 1), 1) AS pct FROM national a JOIN gisco b ON lower(a.name) = lower(b.name) ORDER BY abs(a.km2 / b.km2 - 1) DESC LIMIT 10")
println("Largest differences of area, km² here and in GISCO's: ", join(["$(d.name[i]) $(d.here[i]) and $(d.gisco[i]) ($(d.pct[i])%)" for i in eachindex(d.name)], "; "))
for (label, a, b) in (("Names here only", "national", "gisco"), ("Names in GISCO's only", "gisco", "national"))
	o = query("SELECT name FROM $(a) WHERE lower(name) NOT IN (SELECT lower(name) FROM $(b) WHERE name IS NOT NULL) ORDER BY name LIMIT 15").name
	println(label, ": ", isempty(o) ? "none" : join(o, ", "))
end
println("© EuroGeographics for the administrative boundaries of GISCO")
'''

[[actionGroups.actions]]
id = "countries-side-by-side"
label = "Countries Side by Side"
desc = "For every country of data.europa.eu, how many datasets match the theme, and how many of them offer a WFS, an Atom feed or an OGC API"
models = ["find"]
code = '''
inspire_countries(con, theme)  # the datasets of each country, and those with a service of each kind, as the table countries
c = query("SELECT * FROM countries")
println("Datasets of data.europa.eu matching ", theme, " and inspire, by country, and those with a service of each kind (by the format data.europa.eu gives the service)")
println(rpad("country", 9), rpad("datasets", 10), rpad("WFS", 8), rpad("Atom", 8), "OGC API")
for i in eachindex(c.country)
	println(rpad(c.country[i], 9), rpad(c.datasets[i], 10), rpad(c.wfs[i], 8), rpad(c.atom[i], 8), c.ogc[i])
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "units-by-level"
label = "Units by Level"
desc = "The units of each value of Colour By, the levels of the administrative hierarchy in INSPIRE's administrative units: how many, their total, median and largest areas"
models = ["wfs", "atom", "ogcapi"]
code = '''
u = query("SELECT coalesce(CAST(\"$(by)\" AS VARCHAR), 'none') AS value, count(*) AS units, round(sum(km2)) AS total, round(median(km2), 1) AS median, round(max(km2), 1) AS largest FROM features GROUP BY ALL ORDER BY units")
w = max(length(by), maximum(length, u.value; init = 5)) + 2
println(rpad(by, w), rpad("units", 8), rpad("total km²", 12), rpad("median km²", 12), "largest km²")
for i in eachindex(u.value)
	println(rpad(u.value[i], w), rpad(u.units[i], 8), rpad(u.total[i], 12), rpad(u.median[i], 12), u.largest[i])
end
println("Levels that cover the whole country have the same total: a level whose total is smaller does not cover all of it")
'''

[[actionGroups.actions]]
id = "licences"
label = "Licences of the Datasets"
desc = "The licences the download services of the datasets listed give, as data.europa.eu records them"
models = ["find"]
code = '''
l = query("SELECT coalesce(licence, 'none recorded') AS licence, count(DISTINCT n) AS datasets FROM services GROUP BY ALL ORDER BY datasets DESC")
for i in eachindex(l.licence)
	println(rpad(l.datasets[i], 5), l.licence[i])
end
println("Check the terms on each publisher's own pages before re-using the data")
'''

[[actionGroups]]
id = "export"
label = "Export"

[[actionGroups.actions]]
id = "save-gpkg"
label = "Save as GeoPackage"
desc = "The units read, with every column and their area, to a GeoPackage in the folder, for the Geospatial Vector Files panel and any GIS"
models = ["wfs", "atom", "ogcapi"]
code = '''
out = joinpath(folder, "$(stem)-units.gpkg")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "COPY features TO '$(out)' (FORMAT GDAL, DRIVER 'GPKG', LAYER_NAME 'units', SRS 'EPSG:4326')")
	println("Wrote ", out)
end
'''

[[actionGroups.actions]]
id = "save-geoparquet"
label = "Save as GeoParquet"
desc = "The units read, with every column and their area, to a GeoParquet file in the folder"
models = ["wfs", "atom", "ogcapi"]
code = '''
out = joinpath(folder, "$(stem)-units.parquet")
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	DBInterface.execute(con, "COPY features TO '$(out)' (FORMAT parquet)")  # DuckDB writes GeoParquet metadata for the geometry column
	println("Wrote ", out)
end
'''

[[actionGroups.actions]]
id = "save-list"
label = "Save the List as CSV"
desc = "The datasets listed and their download services, one row per service, to a CSV file in the folder"
models = ["find"]
code = '''
out = joinpath(folder, "inspire-datasets-$(country)-$(replace(theme, " " => "-")).csv")
DBInterface.execute(con, "COPY (SELECT d.n, d.title, d.catalogue, s.kind, s.address, s.licence FROM datasets d JOIN services s USING (n) ORDER BY d.n, s.kind) TO '$(out)' (HEADER)")
println("Wrote ", out)
'''
