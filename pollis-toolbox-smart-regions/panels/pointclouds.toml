[[faq]]
question = "What is the difference between LAS and LAZ?"
answer = '''
LAZ is LAS compressed with LASzip, without loss: the same header, records and point attributes, in a fraction of the size. A LAZ file is decompressed as it is read, so reading takes more processor time and less disk.

PointClouds.jl reads both with the same LAS(path); the LAS and LAZ tab shows which one the file is in Header and Records.
'''
wiki = "LAZ"

[[faq]]
question = "How do I get a terrain model from a point cloud?"
answer = '''
A digital terrain model (DTM) gives the height of the bare ground in each cell: from the points classified as ground (ASPRS class 2), for example their mean height in the cell. A digital surface model (DSM) gives the highest point in each cell, roofs and treetops included. Their difference, the normalised DSM, is the height of buildings and vegetation above the ground.

Surface and Terrain Grids computes the three at the Cell Size input, and Save Elevation Grids as GeoTIFF writes them.
'''
wiki = "Elevation Models From Point Clouds"

[[faq]]
question = "Why are the coordinates of a LAS file stored as integers?"
answer = '''
A LAS point record holds X, Y and Z as 32-bit integers. The header gives a scale factor and an offset for each axis, and the coordinate is the integer times the scale plus the offset: with a scale of 0.001, coordinates are kept to the millimetre.

Integers keep the precision the same over the whole extent of the file and compress well. PointClouds.jl applies the scale and offset when it reads the coordinates.
'''
wiki = "LAS"
hidden = true

[[faq]]
question = "Which ASPRS classes does a LAS file use?"
answer = '''
The LAS 1.4 specification defines the classification codes of point data record formats 6 to 10: 0 created and never classified, 1 unclassified, 2 ground, 3 low, 4 medium and 5 high vegetation, 6 building, 7 low point (noise), 9 water, 10 rail, 11 road surface, 13 wire guard, 14 wire conductor, 15 transmission tower, 16 wire-structure connector, 17 bridge deck, 18 high noise, 19 overhead structure, 20 ignored ground, 21 snow and 22 temporal exclusion. Codes 64 to 255 are left to the user.

Classes and Returns counts the points of each class in the file.
'''
wiki = "LAS"
hidden = true

[[faq]]
question = "How many points per square metre does a lidar survey need?"
answer = '''
Point density, the number of points per square metre, sets the smallest detail a survey resolves and the cell size its grids can have. A grid cell should hold several points: at 4 points per square metre, a 1 m cell holds about four.

Point Density counts the points in each cell of the Cell Size input and reports the mean, the lowest and the share of empty cells, which shows gaps in the coverage.
'''
wiki = "Diagnostics"
hidden = true

