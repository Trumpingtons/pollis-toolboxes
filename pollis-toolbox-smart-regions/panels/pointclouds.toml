[[inputs]]
id = "folder"
label = "Folder"
tooltip = "Folder of the files: data/examples of the open Pollis Workspace, otherwise in Pollis's own folder. A file given by an absolute path is read where it is."
default = "~/.pollis/data/examples"
folder = "data/examples"
chooseFolder = false

[[inputs]]
id = "lasFile"
label = "File"
tooltip = "The LAS (.las) or LAZ (.laz) file, in the folder above, or an absolute path. With the default, autzen_trim.laz, the example first downloads a real survey around Autzen Stadium in Eugene, Oregon, from the test data of PDAL, about 0.6 MB, unless the folder has it already."
default = "autzen_trim.laz"
models = ["las"]

[[inputs]]
id = "every"
label = "Read Every"
tooltip = "Read every point (1), or every second, tenth, ... point of a large file, for a first look in less memory."
default = "1"
models = ["las"]

[[inputs]]
id = "lasCrs"
label = "File Coordinate System"
tooltip = "file: the coordinate system the file records. For a file that records none, give it as an EPSG code, e.g. EPSG:27700 (OSGB36 / British National Grid) or EPSG:32632 (WGS 84 / UTM zone 32N)."
default = "file"
models = ["las"]

[[inputs]]
id = "cellSize"
label = "Cell Size"
tooltip = "The side of a grid cell, in the units of the coordinate system (metres or feet for a projected one, feet in the example), for Point Density and the elevation grids: a cell should hold several points."
default = "6"
models = ["las"]

[[codeBranches]]
model = "las"
code = '''
using PointClouds, ArchGDAL, Downloads

folder = mkpath(expanduser(raw"{{folder}}"))  # the folder of the files
path = joinpath(folder, "{{lasFile}}")  # an absolute path is kept as it is
{{?lasFile=autzen_trim.laz}}# Example file: autzen_trim.laz, a real airborne lidar survey of 110,000 points around Autzen Stadium in Eugene, Oregon, classified as unclassified (1) and ground (2), in feet on NAD83(HARN) / Oregon GIC Lambert, from the test data of PDAL, about 0.6 MB. Downloaded unless the folder has it already. Replace "autzen_trim.laz" with your own LAS or LAZ file.
{{?lasFile=autzen_trim.laz}}isfile(path) || Downloads.download("https://github.com/PDAL/PDAL/raw/master/test/data/laz/autzen_trim.laz", path)

las = LAS(path)  # the header now; the points are read when used, decompressed if the file is LAZ
keep = 1:{{every}}:length(las)  # the points to read
xyz = coordinates(las, keep)  # x, y and z, the scale and offset of the header applied
pts = (x = first.(xyz), y = getindex.(xyz, 2), z = last.(xyz), classification = classification(las, keep), intensity = intensity(las, keep), return_number = return_number(las, keep), return_count = return_count(las, keep))  # a Tables.jl table, one row per point
{{?lasCrs=file}}wkt_record = findfirst(v -> v.record_id == 2112, las.vlrs)  # a record of the coordinate system as OGC WKT, if the file has one
{{?lasCrs=file}}file_crs = wkt_record !== nothing ? String(rstrip(String(copy(las.vlrs[wkt_record].data)), '\0')) : getcrs(las) === nothing ? "" : getcrs(String, las)  # the WKT the file records, or one made from its GeoTIFF keys, or none
{{?lasCrs!=file}}file_crs = "{{lasCrs}}"
println(length(pts.x), " of ", length(las), " points, LAS ", join(Int.(las.version), "."), "; x from ", minimum(pts.x), " to ", maximum(pts.x), ", y from ", minimum(pts.y), " to ", maximum(pts.y), ", z from ", minimum(pts.z), " to ", maximum(pts.z))
isempty(file_crs) && println("The file records no coordinate system: give its EPSG code in the File Coordinate System input")
'''

# Next Steps action groups
