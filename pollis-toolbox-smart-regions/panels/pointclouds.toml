[[actionGroups.actions]]
id = "plot-points"
label = "Plot the Points"
desc = "The points seen from above, coloured by height, drawn with ECharts: at most 20,000 of them, spread evenly over the file"
models = ["las"]
code = '''
using ECharts

shown = round.(Int, range(1, length(pts.x); length = min(20_000, length(pts.x))))  # evenly spread over the file
lo, hi = extrema(pts.z)
EChart(ec_width = 760, ec_height = 600, title = [ECharts.Title(text = "$(length(shown)) of $(length(pts.x)) points, coloured by z")],
	xAxis = [ECharts.Axis(_type = "value", name = "x", scale = true)], yAxis = [ECharts.Axis(_type = "value", name = "y", scale = true)],
	visualMap = ECharts.VisualMap(min = lo, max = hi, calculable = true, orient = "vertical", right = "1%", top = "middle", inRange = Dict("color" => ["#313695", "#74add1", "#ffffbf", "#f46d43", "#a50026"])),
	series = [ECharts.XYSeries(name = "Points", _type = "scatter", symbolSize = 2, large = true, data = [[pts.x[k], pts.y[k], round(pts.z[k], digits = 2)] for k in shown])])
'''

[[actionGroups.actions]]
id = "cross-section"
label = "Cross-Section"
desc = "The points within 1 m of a line from west to east through the middle of the cloud: their height along the line, coloured by class"
models = ["las"]
code = '''
using ECharts

ymid = (minimum(pts.y) + maximum(pts.y)) / 2
band = findall(abs.(pts.y .- ymid) .< 1)  # within 1 m of the line
names = Dict(1 => "Unclassified", 2 => "Ground", 3 => "Low vegetation", 4 => "Medium vegetation", 5 => "High vegetation", 6 => "Building", 7 => "Low noise", 9 => "Water", 17 => "Bridge deck", 18 => "High noise")
series = [ECharts.XYSeries(name = get(names, c, "Class $c"), _type = "scatter", symbolSize = 3, data = [[round(pts.x[k], digits = 2), round(pts.z[k], digits = 2)] for k in band if pts.classification[k] == c]) for c in sort(unique(pts.classification[band]))]
EChart(ec_width = 800, ec_height = 360, title = [ECharts.Title(text = "Cross-section at y = $(round(ymid, digits = 1)): $(length(band)) points")],
	xAxis = [ECharts.Axis(_type = "value", name = "x", scale = true)], yAxis = [ECharts.Axis(_type = "value", name = "z", scale = true)],
	legend = ECharts.Legend(data = [s.name for s in series]), series = series)
'''

[[actionGroups.actions]]
id = "points-map"
label = "Show on a Map"
desc = "Up to 5,000 points on an OpenStreetMap base map in Pollis's map view, coloured by class; click a point for its height and class"
models = ["las"]
code = '''
using DuckDB

if isempty(file_crs)
	println("The file records no coordinate system: give its EPSG code in the File Coordinate System input")
else
	names = Dict(1 => "Unclassified", 2 => "Ground", 3 => "Low vegetation", 4 => "Medium vegetation", 5 => "High vegetation", 6 => "Building", 7 => "Low noise", 9 => "Water", 17 => "Bridge deck", 18 => "High noise")
	shown = round.(Int, range(1, length(pts.x); length = min(5_000, length(pts.x))))
	rows = ["($(pts.x[k]), $(pts.y[k]), $(round(pts.z[k], digits = 2)), '$(get(names, pts.classification[k], "Class $(pts.classification[k])"))')" for k in shown]
	con = DBInterface.connect(DuckDB.DB)
	DBInterface.execute(con, "LOAD spatial")
	DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude in every transform
	file = joinpath(mktempdir(), "points.geojson")
	DBInterface.execute(con, "COPY (SELECT z, class, ST_Transform(ST_Point(x, y), '$(file_crs)', 'EPSG:4326') AS geom FROM (VALUES $(join(rows, ", "))) t(x, y, z, class)) TO '$(file)' (FORMAT GDAL, DRIVER 'GeoJSON')")
	display(Pollis.webmap(Pollis.layer(file; name = basename(path), column = "class")))
end
'''

