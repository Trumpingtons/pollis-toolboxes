[[actionGroups.actions]]
id = "header"
label = "Header and Records"
desc = "The header of the file: LAS version, point format, point count, scale and offset, extent, returns, the software that wrote it, and its variable-length records"
models = ["las"]
code = '''
println(endswith(lowercase(path), ".laz") ? "LAZ (compressed)" : "LAS", " ", join(Int.(las.version), "."), ", point data record format ", match(r"PointRecord(\d+)", string(eltype(las)))[1])
println(length(las), " points; written by ", isempty(las.software_id) ? "unknown software" : las.software_id, iszero(las.creation_date[2]) ? ", no date recorded" : string(" on day ", las.creation_date[1], " of ", las.creation_date[2]))
println("Scale: ", las.coord_scale, "; offset: ", las.coord_offset)
println("Extent: x ", las.coord_min[1], " to ", las.coord_max[1], ", y ", las.coord_min[2], " to ", las.coord_max[2], ", z ", las.coord_min[3], " to ", las.coord_max[3])
println("Points by return number: ", all(iszero, las.return_counts) ? "none recorded" : join(["$(k) => $(c)" for (k, c) in enumerate(las.return_counts) if c > 0], ", "))
m = match(r"^\w+\[\"([^\"]+)\"", file_crs)
println("Coordinate system: ", isempty(file_crs) ? "none recorded" : m === nothing ? file_crs : m[1])
for vlr in las.vlrs
	println("Record ", vlr.user_id, " ", Int(vlr.record_id), ": ", vlr.description, " (", length(vlr.data), " bytes)")
end
'''

[[actionGroups.actions]]
id = "classes-returns"
label = "Classes and Returns"
desc = "The points of each ASPRS class, and of each return number out of the number of returns of its pulse"
models = ["las"]
code = '''
names = Dict(0 => "Never classified", 1 => "Unclassified", 2 => "Ground", 3 => "Low vegetation", 4 => "Medium vegetation", 5 => "High vegetation", 6 => "Building", 7 => "Low noise", 9 => "Water", 10 => "Rail", 11 => "Road surface", 13 => "Wire guard", 14 => "Wire conductor", 15 => "Transmission tower", 16 => "Wire-structure connector", 17 => "Bridge deck", 18 => "High noise", 19 => "Overhead structure", 20 => "Ignored ground", 21 => "Snow", 22 => "Temporal exclusion")
println(rpad("class", 24), rpad("points", 10), "share")
for c in sort(unique(pts.classification))
	k = count(==(c), pts.classification)
	println(rpad("$c $(get(names, c, "user defined"))", 24), rpad(k, 10), round(100 * k / length(pts.x), digits = 2), "%")
end
println("\n", rpad("return", 24), "points")
for (r, c) in sort(unique(zip(pts.return_number, pts.return_count)))
	println(rpad("$r of $c", 24), count(k -> pts.return_number[k] == r && pts.return_count[k] == c, eachindex(pts.x)))
end
'''

[[actionGroups.actions]]
id = "point-density"
label = "Point Density"
desc = "Points per square unit in cells of the Cell Size input: the mean, the lowest and highest, and the share of empty cells"
models = ["las"]
code = '''
cell = {{cellSize}}
x0, y0 = minimum(pts.x), minimum(pts.y)
nx, ny = floor(Int, (maximum(pts.x) - x0) / cell) + 1, floor(Int, (maximum(pts.y) - y0) / cell) + 1
counts = zeros(Int, nx, ny)
for k in eachindex(pts.x)
	counts[floor(Int, (pts.x[k] - x0) / cell) + 1, floor(Int, (pts.y[k] - y0) / cell) + 1] += 1
end
density = counts ./ cell^2
println("Cells of $(cell) x $(cell): ", nx * ny)
println("Points per square unit: mean ", round(sum(density) / length(density), digits = 2), ", lowest ", minimum(density), ", highest ", maximum(density))
println("Empty cells: ", count(==(0), counts), " (", round(100 * count(==(0), counts) / length(counts), digits = 2), "%)")
'''

[[actionGroups]]
id = "compare"
label = "Compare"

[[actionGroups.actions]]
id = "classes-side-by-side"
label = "Classes Side by Side"
desc = "Each class's points: how many, their height and their mean intensity, which tells ground, vegetation and roofs apart"
models = ["las"]
code = '''
names = Dict(1 => "Unclassified", 2 => "Ground", 3 => "Low vegetation", 4 => "Medium vegetation", 5 => "High vegetation", 6 => "Building", 7 => "Low noise", 9 => "Water", 17 => "Bridge deck", 18 => "High noise")
println(rpad("class", 22), rpad("points", 10), rpad("z min", 10), rpad("z mean", 10), rpad("z max", 10), "intensity (0 to 1)")
for c in sort(unique(pts.classification))
	k = findall(==(c), pts.classification)
	z = pts.z[k]
	println(rpad(get(names, c, "Class $c"), 22), rpad(length(k), 10), rpad(round(minimum(z), digits = 2), 10), rpad(round(sum(z) / length(z), digits = 2), 10), rpad(round(maximum(z), digits = 2), 10), round(sum(pts.intensity[k]) / length(k), digits = 4))
end
'''

[[actionGroups]]
id = "interpret"
label = "Interpret"

[[actionGroups.actions]]
id = "surface-terrain"
label = "Surface and Terrain Grids"
desc = "In cells of the Cell Size input: the surface model (highest point), the terrain model (mean height of ground points) and their difference, the height of buildings and trees above the ground"
models = ["las"]
code = '''
cell = {{cellSize}}
x0, y0 = minimum(pts.x), minimum(pts.y)
nx, ny = floor(Int, (maximum(pts.x) - x0) / cell) + 1, floor(Int, (maximum(pts.y) - y0) / cell) + 1
dsm = fill(-Inf, nx, ny)
ground_sum, ground_n = zeros(nx, ny), zeros(Int, nx, ny)
for k in eachindex(pts.x)
	i, j = floor(Int, (pts.x[k] - x0) / cell) + 1, floor(Int, (pts.y[k] - y0) / cell) + 1
	dsm[i, j] = max(dsm[i, j], pts.z[k])
	if pts.classification[k] == 2  # ground
		ground_sum[i, j] += pts.z[k]
		ground_n[i, j] += 1
	end
end
dtm = [ground_n[i, j] > 0 ? ground_sum[i, j] / ground_n[i, j] : NaN for i in 1:nx, j in 1:ny]
ndsm = [isfinite(dsm[i, j]) && !isnan(dtm[i, j]) ? dsm[i, j] - dtm[i, j] : NaN for i in 1:nx, j in 1:ny]
h = filter(!isnan, ndsm)
println("Grids of ", nx, " x ", ny, " cells of ", cell, " x ", cell)
println("Cells without points: ", count(!isfinite, dsm), "; without ground points (terrain unknown): ", count(isnan, dtm))
println("Terrain: from ", round(minimum(filter(!isnan, dtm)), digits = 2), " to ", round(maximum(filter(!isnan, dtm)), digits = 2))
println("Height above ground: cells above 2 = ", count(>(2), h), " (", round(100 * count(>(2), h) / length(h), digits = 1), "%), highest ", round(maximum(h), digits = 2))
'''

[[actionGroups]]
id = "export"
label = "Export"

[[actionGroups.actions]]
id = "save-grids"
label = "Save Elevation Grids as GeoTIFF"
desc = "Write the surface model, the terrain model and the height above ground, in cells of the Cell Size input, as three GeoTIFF files next to the file read, which the Raster Files panel reads"
models = ["las"]
code = '''
using Rasters
using Rasters.Lookups: Intervals, Center

cell = {{cellSize}}
x0, y0 = minimum(pts.x), minimum(pts.y)
nx, ny = floor(Int, (maximum(pts.x) - x0) / cell) + 1, floor(Int, (maximum(pts.y) - y0) / cell) + 1
dsm = fill(-Inf, nx, ny)
ground_sum, ground_n = zeros(nx, ny), zeros(Int, nx, ny)
for k in eachindex(pts.x)
	i, j = floor(Int, (pts.x[k] - x0) / cell) + 1, floor(Int, (pts.y[k] - y0) / cell) + 1
	dsm[i, j] = max(dsm[i, j], pts.z[k])
	pts.classification[k] == 2 && (ground_sum[i, j] += pts.z[k]; ground_n[i, j] += 1)
end
dtm = [ground_n[i, j] > 0 ? ground_sum[i, j] / ground_n[i, j] : -9999.0 for i in 1:nx, j in 1:ny]
dsm = [isfinite(d) ? d : -9999.0 for d in dsm]
ndsm = [dsm[i, j] != -9999 && dtm[i, j] != -9999 ? dsm[i, j] - dtm[i, j] : -9999.0 for i in 1:nx, j in 1:ny]
dimensions = (X(range(x0 + cell / 2; step = cell, length = nx); sampling = Intervals(Center())), Y(range(y0 + (ny - 0.5) * cell; step = -cell, length = ny); sampling = Intervals(Center())))  # cell centres, rows from north to south
for (name, values) in ("dsm" => dsm, "dtm" => dtm, "ndsm" => ndsm)
	out = first(splitext(path)) * "-$(name).tif"
	if isfile(out)
		println(out, " is there already: rename or move it first")
	else
		write(out, Raster(Float32.(values[:, end:-1:1]), dimensions; crs = isempty(file_crs) ? nothing : WellKnownText(file_crs), missingval = -9999f0))
		println("Wrote ", out)
	end
end
'''

[[actionGroups.actions]]
id = "save-geoparquet"
label = "Save as GeoParquet"
desc = "Write the points read, with their height, class, intensity and returns, to a GeoParquet file next to the file read, for SQL with DuckDB"
models = ["las"]
code = '''
using DuckDB

out = first(splitext(path)) * ".parquet"
if isfile(out)
	println(out, " is there already: rename or move it first")
else
	csv = joinpath(mktempdir(), "points.csv")
	open(csv, "w") do io
		println(io, "x,y,z,classification,intensity,return_number,return_count")
		for k in eachindex(pts.x)
			println(io, pts.x[k], ",", pts.y[k], ",", pts.z[k], ",", pts.classification[k], ",", pts.intensity[k], ",", pts.return_number[k], ",", pts.return_count[k])
		end
	end
	con = DBInterface.connect(DuckDB.DB)
	DBInterface.execute(con, "LOAD spatial")
	DBInterface.execute(con, "COPY (SELECT * EXCLUDE (x, y), ST_Point(x, y) AS geom FROM read_csv('$(csv)')) TO '$(out)' (FORMAT parquet)")
	println("Wrote ", out, ": ", length(pts.x), " points")
end
'''
