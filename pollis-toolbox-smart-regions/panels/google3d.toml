[[faq]]
question = "What do I need to use the panel?"
answer = '''
A Maps Demo Key, the same as for Google Maps, which Google gives at no cost to a personal Google Account, without billing information. It covers Google's 3D map and the shapes drawn on it. It is set with the key on the Powered by line.
'''
wiki = "The Demo Key"

[[faq]]
question = "Which tab should I use?"
answer = '''
3D View to look at buildings and landscape from a camera that turns and tilts. Your Features to raise polygons of your own to a height, Values as Columns to show a value across a place as columns, and Routes at Height to draw lines at the altitude of each of their points.
'''
wiki = "Decision Guide"

[[faq]]
question = "Can I draw my own data in 3D on the 3D map?"
answer = '''
Yes. Your Features raises polygons to a height from a column, Values as Columns draws a value on a grid of square cells as columns, and Routes at Height draws lines at the altitude of each of their points. The examples use the buildings and places of Overture Maps and the tracks of aircraft from the OpenSky Network: replace them with a table of your own.
'''
wiki = "3D Features"

[[faq]]
question = "Can I measure buildings or save the 3D imagery?"
answer = '''
No. The Google Maps Platform Terms forbid caching, scraping or downloading Google's maps and creating content from them, such as heights measured or buildings traced from the 3D imagery. Heights shown in Your Features come from the data drawn, not from Google's imagery.
'''
wiki = "Terms of Use"
hidden = true

[[faq]]
question = "Why does the 3D map stay blank?"
answer = '''
Google refused the Maps Demo Key, and the title over the map says so, or the day's limit has been reached. The photorealistic imagery of the satellite and hybrid modes covers some places only, so a place without it shows less.
'''
wiki = "Diagnostics"
hidden = true

[[faq]]
question = "How do I turn the 3D map?"
answer = '''
With the controls on the map: the arrows move the centre, the plus and minus buttons zoom, the rotate and tilt controls turn and tilt the camera, and the compass turns it back to north. Range, Tilt and Heading set the view the map opens on, and Orbit the Place turns the camera once around the centre.
'''
wiki = "3D Maps and the Camera"
hidden = true

[[faq]]
question = "Why does Routes at Height find no aircraft?"
answer = '''
The tab reads the aircraft flying above 1,000 m over the box around the place now, from the OpenSky Network, without an account. At night, or over a place with little air traffic, there may be none: widen Box Side, or choose a place near a large airport. When the day's anonymous credits are spent, the OpenSky Network answers HTTP 429 and the code says so.
'''
wiki = "3D Features"
hidden = true

[[faq]]
question = "Why do the columns or buildings sink into the ground or float?"
answer = '''
Polygons are raised relative to the ground under them, which Google's 3D map takes from its terrain. Lines of Routes at Height are drawn at their altitude above sea level, as aircraft report it: near the ground the two may differ by tens of metres. See the altitude modes in the 3D Features wiki.
'''
wiki = "3D Features"
hidden = true

