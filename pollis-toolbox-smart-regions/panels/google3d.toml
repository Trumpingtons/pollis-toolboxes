[[inputs]]
id = "place"
label = "Place"
tooltip = "Sydney Harbour or Midtown Manhattan; Your Own Place takes the name, longitude and latitude below. With Sydney Harbour, Your Features and Values as Columns centre on Sydney's business district, around Martin Place."
kind = "select"
default = "sydney"

[[inputs.options]]
value = "sydney"
label = "Sydney Harbour"

[[inputs.options]]
value = "manhattan"
label = "Midtown Manhattan"

[[inputs.options]]
value = "own"
label = "Your Own Place"

[[inputs]]
id = "placeName"
label = "Place Name"
tooltip = "The name of the place, used in the titles of the pages."
default = "Colosseum, Rome"
when = "place=own"
newRow = true

[[inputs]]
id = "lon"
label = "Longitude"
tooltip = "Longitude of the centre of the map, in degrees on WGS 84: negative west of Greenwich."
default = "12.4922"
when = "place=own"

[[inputs]]
id = "lat"
label = "Latitude"
tooltip = "Latitude of the centre of the map, in degrees on WGS 84: negative south of the equator."
default = "41.8902"
when = "place=own"

[[inputs]]
id = "labels"
label = "Labels"
tooltip = "Whether Google's names of roads and places are drawn over the 3D imagery: the 3D map's hybrid mode."
kind = "select"
default = "no"
newRow = true

[[inputs.options]]
value = "no"
label = "Without Labels"

[[inputs.options]]
value = "yes"
label = "With Labels"

[[inputs]]
id = "range"
label = "Range (m)"
tooltip = "The distance from the camera to the centre, in metres: 1,500 shows a few blocks, 10,000 a city."
default = "1500"
models = ["view", "features", "columns"]
newRow = true

[[inputs]]
id = "tilt"
label = "Tilt (degrees)"
tooltip = "The angle of the camera from straight down: 0 looks down on the map, 60 at the skyline, 90 at the horizon."
default = "60"
models = ["view", "features", "columns"]

[[inputs]]
id = "heading"
label = "Heading (degrees)"
tooltip = "The compass direction the camera looks in: 0 north, 90 east, 180 south, 270 west."
default = "0"
models = ["view", "features", "columns"]

[[inputs]]
id = "radius"
label = "Radius (m)"
tooltip = "The features of Overture Maps whose centres lie within this distance of the centre of the place, in metres: 300 holds a few blocks."
default = "300"
models = ["features", "columns"]
newRow = true

[[inputs]]
id = "cellSize"
label = "Cell Size (m)"
tooltip = "The side of each square cell of the grid, in metres: each cell becomes one column."
default = "50"
models = ["columns"]

[[inputs]]
id = "tallest"
label = "Tallest Column (m)"
tooltip = "The height of the column of the cell with the largest value, in metres: the other columns are as tall in proportion to their values."
default = "300"
models = ["columns"]

[[inputs]]
id = "side"
label = "Box Side (km)"
tooltip = "The side of the square around the place in which aircraft are read, in kilometres; the camera starts far enough to see it."
default = "60"
models = ["routes"]
newRow = true

[[inputs]]
id = "aircraft"
label = "Aircraft"
tooltip = "The most aircraft whose tracks are read, of those flying above 1,000 m, the nearest the centre first: each track is one request to the OpenSky Network."
default = "5"
models = ["routes"]

[[inputs]]
id = "curtain"
label = "Curtain"
tooltip = "Whether each track hangs a curtain down to the ground, which shows its height over the land below."
kind = "select"
default = "yes"
models = ["routes"]

[[inputs.options]]
value = "yes"
label = "Curtain to the Ground"

[[inputs.options]]
value = "no"
label = "Line Only"

[[codeBranches]]
model = "*"
code = '''
using DuckDB, Tables, SmartRegions

con = DBInterface.connect(DuckDB.DB)  # an in-memory database, for the features drawn on the map
DBInterface.execute(con, "LOAD spatial")  # DuckDB's spatial extension, which the Smart Regions Toolbox installs
DBInterface.execute(con, "SET geometry_always_xy = true")  # coordinates as longitude, latitude
{{?model=features|columns}}DBInterface.execute(con, "LOAD httpfs")  # DuckDB's extension for files over HTTPS, which the Smart Regions Toolbox installs
{{?place=sydney}} name, lon, lat = "Sydney Harbour", 151.2125, -33.858  # between the Opera House and the Harbour Bridge
{{?place=sydney}}{{?model=features|columns}} name, lon, lat = "Sydney CBD", 151.2093, -33.8675  # around Martin Place: few buildings by the harbour have a height in Overture Maps
{{?place=manhattan}} name, lon, lat = "Midtown Manhattan", -73.98, 40.756  # around Fifth Avenue and 42nd Street
{{?place=own}} name, lon, lat = "{{placeName}}", {{lon}}, {{lat}}  # the centre, in degrees of longitude and latitude
{{?model=view|features|columns}} range_m, tilt, heading = {{range}}, {{tilt}}, {{heading}}  # the camera: metres from the centre, degrees from straight down, degrees from north
mode = "{{labels}}" == "yes" ? "hybrid" : "satellite"
{{?model=view}} shapes = (;)  # nothing drawn on the 3D map
{{?model=features}} # The buildings of Overture Maps around the place, with their heights in metres, or 3 m a floor where only the floors are known
{{?model=features}} r = overture(con, "building"; within = (lon, lat, {{radius}}), columns = "id, names.primary AS name, subtype, class, height AS given_height, num_floors, coalesce(height, num_floors * 3.0) AS height", table = "buildings")
{{?model=features}} println("Overture Maps release ", r.release, ": ", r.n, " buildings within {{radius}} m of the centre of ", name)
{{?model=features}} # Replace them with your own polygons and a column of heights in metres, e.g. SELECT * FROM ST_Read('file.gpkg')
{{?model=features}} file = geojson(con, "SELECT id, name, subtype, class, round(height, 1) AS height, num_floors, geom FROM buildings WHERE height > 0")
{{?model=features}} shapes = (features = file, height = "height", column = "height", note = "The buildings of Overture Maps within {{radius}} m of the centre, raised to their heights in metres and coloured by them.")
{{?model=columns}} # The places of Overture Maps around the place: shops, restaurants, offices, services. Replace them with your own points
{{?model=columns}} r = overture(con, "place"; within = (lon, lat, {{radius}}), columns = "id, names.primary AS name, basic_category AS category", table = "places3d")
{{?model=columns}} println("Overture Maps release ", r.release, ": ", r.n, " places within {{radius}} m of the centre of ", name)
{{?model=columns}} cell, tallest = {{cellSize}}, {{tallest}}  # the side of a cell, and the height of the column of the fullest cell, in metres
{{?model=columns}} utm = utmzone(lon, lat)  # the UTM zone of the place, in metres
{{?model=columns}} DBInterface.execute(con, "CREATE OR REPLACE TABLE cells AS SELECT floor(ST_X(p) / $(cell)) AS i, floor(ST_Y(p) / $(cell)) AS j, count(*) AS places FROM (SELECT ST_Transform(ST_Centroid(geom)::GEOMETRY, 'EPSG:4326', '$(utm)') AS p FROM places3d) GROUP BY ALL")  # the places counted in each square cell of the grid
{{?model=columns}} file = geojson(con, "SELECT places, round(places / max(places) OVER () * $(tallest), 1) AS height, ST_Transform(ST_MakeEnvelope(i * $(cell) + 2, j * $(cell) + 2, (i + 1) * $(cell) - 2, (j + 1) * $(cell) - 2), '$(utm)', 'EPSG:4326') AS geom FROM cells")  # each cell a square 2 m inside its edges, so that the columns stand apart
{{?model=columns}} shapes = (features = file, height = "height", column = "places", note = "The places of Overture Maps within {{radius}} m of the centre, counted in square cells of {{cellSize}} m, as columns as tall as the count: the fullest {{tallest}} m.")
{{?model=routes}} side, most = {{side}}, {{aircraft}}  # the side of the box around the place in kilometres, and the most aircraft whose tracks are read
{{?model=routes}} west, south, east, north = around(lon, lat, side * 500)  # the box, in degrees of longitude and latitude
{{?model=routes}} range_m, tilt, heading = round(Int, side * 1200), 50, 0  # the camera far enough back to see the box
{{?model=routes}} DBInterface.execute(con, "CREATE OR REPLACE TABLE aircraft AS " * opensky_states((west, south, east, north); extended = false))  # the aircraft over the box now, from the OpenSky Network
{{?model=routes}} nearest = Tables.columntable(DBInterface.execute(con, "SELECT icao24 FROM aircraft WHERE NOT on_ground AND lon IS NOT NULL AND altitude > 1000 ORDER BY power(lon - $(lon), 2) + power(lat - $(lat), 2) LIMIT $(most)")).icao24  # the aircraft flying above 1,000 m nearest the centre
{{?model=routes}} isempty(nearest) && error("No aircraft flying above 1,000 m over the box around $(name) now: widen Box Side, or try again later")
{{?model=routes}} tracks = [t for t in opensky_track.(nearest) if t !== nothing]  # the flight each one is on now: one request each
{{?model=routes}} isempty(tracks) && error("The OpenSky Network has no track of the aircraft over $(name) now: try again later")
{{?model=routes}} # The waypoints of the tracks inside the box, with their barometric altitudes in metres, none below sea level. Replace them with your own lines
{{?model=routes}} DBInterface.execute(con, "CREATE OR REPLACE TABLE waypoints AS SELECT icao24, callsign, time, lat, lon, greatest(altitude, 0) AS altitude FROM ($(join(tracks, " UNION ALL "))) WHERE altitude IS NOT NULL AND lat BETWEEN $(south) AND $(north) AND lon BETWEEN $(west) AND $(east)")
{{?model=routes}} DBInterface.execute(con, "CREATE OR REPLACE TABLE flights AS SELECT icao24, any_value(callsign) AS callsign, count(*) AS waypoints, max(altitude) AS highest_m, to_json(list([lon, lat, altitude] ORDER BY time)) AS path, arg_max([lon, lat, altitude], time) AS now FROM waypoints GROUP BY icao24 HAVING count(*) > 1")  # one line for each aircraft, and where it is now
{{?model=routes}} file = joinpath(mktempdir(), "tracks.geojson")
{{?model=routes}} write(file, only(only(Tables.columntable(DBInterface.execute(con, "SELECT json_object('type', 'FeatureCollection', 'features', json_group_array(f))::VARCHAR FROM (SELECT json_object('type', 'Feature', 'properties', json_object('icao24', icao24, 'callsign', callsign, 'waypoints', waypoints, 'highest_m', highest_m), 'geometry', json_object('type', 'LineString', 'coordinates', path)) AS f FROM flights UNION ALL SELECT json_object('type', 'Feature', 'properties', json_object('label', coalesce(callsign, icao24), 'icao24', icao24, 'altitude_m', now[3]), 'geometry', json_object('type', 'Point', 'coordinates', now)) FROM flights)")))))  # GeoJSON with an altitude at each point
{{?model=routes}} println(length(nearest), " aircraft nearest ", name, " now; ", only(only(Tables.columntable(DBInterface.execute(con, "SELECT count(*) FROM flights")))), " with a track inside the box")
{{?model=routes}} shapes = (features = file, column = "highest_m", curtain = "{{curtain}}" == "yes", note = "The tracks of the aircraft flying above 1,000 m nearest the centre now, inside a box of {{side}} km, at their altitudes, coloured by the highest, each with a marker where the aircraft is now.")
camera = (; range = range_m, tilt, heading, mode)
# Google's 3D map on a page of its own in Pollis's browser, with the Maps Demo Key set with the key on the Powered by line
{{?model=view}} Pollis.browse(googlemap3d("$(name), 3D View", lon, lat; place = name, camera...))  # the controls on the map move, zoom, turn and tilt the camera
{{?model=features}} Pollis.browse(googlemap3d("$(name), Buildings by Height", lon, lat; place = name, camera..., shapes...))  # a click on a building shows its columns
{{?model=columns}} Pollis.browse(googlemap3d("$(name), Places per Cell", lon, lat; place = name, camera..., shapes...))  # a click on a column shows its count
{{?model=routes}} Pollis.browse(googlemap3d("$(name), Flights in 3D", lon, lat; place = name, camera..., shapes...))  # a click on a track shows the aircraft
'''

[[actionGroups]]
id = "visualise"
label = "Visualise"

[[actionGroups.actions]]
id = "orbit"
label = "Orbit the Place"
desc = "The 3D map with what the tab drew on it, its camera turning once around the centre in a minute at the camera's range and tilt, clockwise"
code = '''
Pollis.browse(googlemap3d("$(name), Orbit", lon, lat; orbit = true, place = name, camera..., shapes...))
'''

[[actionGroups]]
id = "diagnose"
label = "Diagnose"

[[actionGroups.actions]]
id = "tallest-buildings"
label = "Tallest Buildings"
desc = "The ten tallest buildings within the Radius, with their names, heights and floors, and how many buildings have a height given by Overture Maps, one from their floors, or none"
models = ["features"]
code = '''
known = Tables.columntable(DBInterface.execute(con, "SELECT count(*) FILTER (WHERE given_height IS NOT NULL) AS given, count(*) FILTER (WHERE given_height IS NULL AND num_floors IS NOT NULL) AS floors, count(*) FILTER (WHERE height IS NULL) AS unknown FROM buildings"))
println("Heights: ", only(known.given), " given, ", only(known.floors), " from the floors, ", only(known.unknown), " unknown (not drawn)")
top = Tables.columntable(DBInterface.execute(con, "SELECT coalesce(name, '(no name)') AS name, round(height, 1) AS height, num_floors FROM buildings WHERE height IS NOT NULL ORDER BY height DESC LIMIT 10"))
println(rpad("building", 40), rpad("height (m)", 12), "floors")
for i in eachindex(top.name)
	println(rpad(first(top.name[i], 38), 40), rpad(top.height[i], 12), coalesce(top.num_floors[i], ""))
end
'''

[[actionGroups.actions]]
id = "categories"
label = "Places by Category"
desc = "The fifteen categories of Overture Maps with the most places within the Radius, and the fullest cells of the grid"
models = ["columns"]
code = '''
kinds = Tables.columntable(DBInterface.execute(con, "SELECT coalesce(category, '(none)') AS category, count(*) AS places FROM places3d GROUP BY ALL ORDER BY places DESC LIMIT 15"))
println(rpad("category", 32), "places")
for i in eachindex(kinds.category)
	println(rpad(kinds.category[i], 32), kinds.places[i])
end
s = Tables.columntable(DBInterface.execute(con, "SELECT count(*) AS cells, max(places) AS most, round(median(places), 1) AS middle FROM cells"))
println(only(s.cells), " cells with places: the fullest holds ", only(s.most), ", the median cell ", only(s.middle))
'''

[[actionGroups.actions]]
id = "flights"
label = "Flights Drawn"
desc = "Each aircraft drawn: its callsign, the waypoints of its track inside the box, its highest altitude there and its altitude now"
models = ["routes"]
code = '''
f = Tables.columntable(DBInterface.execute(con, "SELECT icao24, coalesce(callsign, '') AS callsign, waypoints, round(highest_m) AS highest_m, round(now[3]) AS now_m FROM flights ORDER BY highest_m DESC"))
println(rpad("aircraft", 10), rpad("callsign", 10), rpad("waypoints", 11), rpad("highest (m)", 13), "now (m)")
for i in eachindex(f.icao24)
	println(rpad(f.icao24[i], 10), rpad(f.callsign[i], 10), rpad(f.waypoints[i], 11), rpad(f.highest_m[i], 13), f.now_m[i])
end
'''
