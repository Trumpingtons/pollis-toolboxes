# Google Photorealistic 3D Maps: Google's photorealistic 3D map of a place, drawn by the Maps JavaScript API on a page of
# its own in Pollis's browser with a Maps Demo Key, and the user's own data in 3D on it: polygons raised to a height,
# values as columns and lines at an altitude; Sydney Harbour and Midtown Manhattan as example places

[meta]
title = "Google Photorealistic 3D Maps"
viewType = "pollis.google3d"
defaultModel = "view"
decisionFirstColumn = "Tab"

# The user's Maps Demo Key, kept by Pollis in Secret Storage and set in the Julia REPL: the same key as Google Maps
[apiKey]
label = "Google Maps"
noun = "Maps Demo Key"

[[apiKey.fields]]
name = "googleMapsKey"
envVar = "GOOGLE_MAPS_API_KEY"
prompt = "Maps Demo Key, from developers.google.com/maps/demo-key with a personal Google Account"

